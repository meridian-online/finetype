goal: >-
  Replace today's CSV-emitting `finetype validate` with a DuckDB-native
  output pipeline. The CLI orchestrates validation through the existing
  `finetype-core` `table_validator` engine (extended with per-cell
  reject detail) and writes results directly into a DuckDB `.db` file:
  the user's chosen table holds the clean rows, a sibling
  `finetype_reject_errors` table holds the rejects with an extended
  DuckDB-compatible shape. Analysts open the database and query both
  tables in-situ. The `.db` file replaces today's CSV/JSONL sidecars.

constraints:
  - "Validation is deterministic. Given a JSON Schema and a row, pass/fail is a pure function. No heuristics that second-guess the schema at validation time."
  - "Schema lives in JSON files — reviewed, edited, checked into git. No catalog state inside DuckDB. CLI authors schemas via `finetype schema`; DuckDB extension only consumes them."
  - "CLI artefact is a DuckDB `.db` file. No intermediate Parquet or CSV export. Analyst opens the database and queries tables in-situ."
  - "Reject columns mirror DuckDB `reject_errors` base (scan_id, file_id, line, column_idx, column_name, error_type, csv_line, byte_position, error_message) with FineType extensions (type_confidence, expected_type, constraint_failed, constraint_value). UNION across native + FineType rejects requires explicit NULL-pad projection; that cost is accepted."
  - "Single validation engine: finetype-core `table_validator::validate_table` is the sole source of pass/fail + reject detail. The CLI is its only caller in the default flow; no new DuckDB functions are registered. The existing scalar `finetype_validate(value, schema_json)` remains untouched for ad-hoc SQL use."
  - "CLI owns sidecar materialisation. `finetype_reject_errors` is created (or appended to) by the CLI as a persistent table in the output `.db`. The validation engine returns a structured result; the CLI projects it into SQL rows."
  - "scan_id is a per-invocation counter assigned by the CLI. Fresh `.db` → scan_id starts at 1. `--append` into an existing `.db` with a pre-existing sidecar → scan_id = MAX(existing.scan_id) + 1. Concurrent writers are NOT supported in v1; the CLI documents sequential use."
  - "The `finetype schema <file>` JSON Schema output format is an input contract for this spec. The spec depends on `x-finetype-confidence`, `x-finetype-label`, and the pattern/length/enum/required constraints being present in schemas emitted by that command. Any change to the schema-emission format is a breaking change that must update this spec."
  - "The additive change to `finetype_core::table_validator::TableValidationResult` is intra-workspace only (consumers: finetype-cli, finetype-mcp, finetype-duckdb). All three crates are updated in the same PR. No external Rust consumer surface exists for this type today; `finetype-core` is not published under a SemVer contract for this struct."

acceptance_criteria:
  - id: ac-01
    ac_type: gate
    description: >-
      `finetype_core::table_validator::TableValidationResult` gains two new
      fields (additive, non-breaking for the workspace since all consumers
      are in-repo): `valid_row_indices: Vec<usize>` carrying the 0-based
      indices of rows that passed every column's validation, and
      `rejects: Vec<RejectRecord>` carrying per-cell failure detail.
      `RejectRecord` is a new struct in the same module with fields:
      `row_index: usize`, `column_index: usize`, `column_name: String`,
      `value: Option<String>`, `expected_type: Option<String>` (from
      `x-finetype-label`), `type_confidence: Option<f64>` (from
      `x-finetype-confidence`), `constraint_failed: String`
      (pattern|min_length|max_length|enum|type|required), `constraint_value:
      Option<String>`, `error_message: String`. All existing fields
      (`total_rows, valid_rows, invalid_rows, columns, grade, row_errors,
      missing_columns`) remain unchanged; the existing CLI validate path
      continues to work without modification.
    verification: >-
      Rust unit test `test_vrp_ac01_result_shape` in
      `crates/finetype-core/src/table_validator.rs` constructs a fixture
      with 3 rows (1 valid, 2 with different column failures) and asserts:
      (a) `valid_row_indices` equals `vec![1]` (or equivalent fixture-
      dependent value), (b) `rejects.len()` equals the expected cell-
      failure count, (c) each `RejectRecord` has populated
      `constraint_failed` matching one of the documented tokens, (d)
      existing `row_errors` field is also populated (non-breaking
      preservation). `cargo build --workspace` compiles; all consumers
      (finetype-cli, finetype-mcp, finetype-duckdb) continue to link.

  - id: ac-02
    ac_type: code
    description: >-
      The JSON Schema interpretation in `table_validator::validate_table`
      maps each jsonschema validator failure to a `RejectRecord` whose
      `constraint_failed` token is one of: `pattern`, `min_length`,
      `max_length`, `enum`, `type`, `required`. The `constraint_value` is
      populated with the pattern regex, the length limit as a string, the
      enum list as a JSON-array string, or the type name (matching the
      failing constraint). Unknown schema keywords fall through to
      `constraint_failed = "other"` with the raw validator message.
    verification: >-
      Six table-driven test cases in `table_validator.rs`, one per
      supported constraint, each constructing a minimal schema that
      violates exactly that constraint and asserting the resulting
      `RejectRecord` has the expected `constraint_failed` token and a
      `constraint_value` substring matching the schema's constraint.
      Named `test_vrp_ac02_<constraint>_failure`.

  - id: ac-03
    ac_type: code
    description: >-
      Validation is deterministic. Running `validate_table` twice on the
      same (headers, rows, schema) inputs produces byte-identical
      `TableValidationResult` outputs — same `valid_row_indices` order,
      same `rejects` order (sorted by row_index ascending, then
      column_index ascending), same field values throughout.
    verification: >-
      Test `test_vrp_ac03_determinism` calls `validate_table` twice on a
      12-row mixed-outcome fixture, serialises both results to JSON via
      the existing `Serialize` derive, and asserts the JSON strings are
      equal. Also asserts `rejects` is sorted by (row_index, column_index)
      ascending.

  - id: ac-04
    ac_type: gate
    description: >-
      Spike landing: `crates/finetype-duckdb/src/spike.rs` registers a
      trivial `finetype_spike(n BIGINT)` table function using
      duckdb-rs's VTab trait. The spike file
      `orbit/specs/2026-04-22-duckdb-extension-ergonomics/spike-
      duckdb-rs.md` records three findings with code references: (a)
      `vtab` is already active via `loadable-extension`'s transitive
      feature graph — no Cargo change required; (b) same-name
      scalar+table coexistence compiles in Rust and has DuckDB native
      precedent; (c) reading an existing DuckDB table by name from
      within a VTab is NOT supported in duckdb-rs 1.4.4's safe API —
      `BindInfo` exposes no `Connection` / catalog / row-iteration
      primitives. Finding (c) ratifies rollback_plan Scenario A: no
      new DuckDB table function is registered in this spec. Cross-
      client research (see spike-duckdb-rs.md §Research) confirms this
      is a C++-only capability — the C API does not expose
      `ClientContext`, so no duckdb-rs upgrade is expected to unblock
      it without a C API extension.
    verification: >-
      File `spike-duckdb-rs.md` exists with sections (a), (b), (c) each
      citing duckdb-rs source references. `crates/finetype-duckdb/src/spike.rs`
      exists and is registered in `lib.rs` via
      `register_table_function::<FineTypeSpike>("finetype_spike")`.
      `cargo build -p finetype_duckdb` succeeds clean. The spike file
      concludes with "Scenario A ratified" and names the consequent
      AC edits to this spec (ac-05 dropped; ac-06/07/08 rewritten;
      ac-13 category pruned).

  - id: ac-05
    ac_type: doc
    description: >-
      Document the Scenario A pivot. No new DuckDB function is registered
      by this spec. The spike's probe-only `finetype_spike(n)` table
      function is retained in `crates/finetype-duckdb/src/spike.rs` as
      living evidence of the vtab feasibility boundary, with a module-
      level docstring naming MADR 0064 as the decision context. It is
      NOT re-exported for analyst use.
    verification: >-
      `crates/finetype-duckdb/src/spike.rs` docstring references MADR
      0064. `crates/finetype-duckdb/src/lib.rs`'s entrypoint registers
      `finetype_spike` with a comment naming it as the spike artefact
      (not a production function). MADR 0064 records the pivot and
      names this spec.

  - id: ac-06
    ac_type: code
    description: >-
      The CLI projects `TableValidationResult` into the output DuckDB
      `.db` via two INSERTs. Valid rows: CLI opens the `.db`, creates
      the user-named table with source-file schema (VARCHAR for all
      columns — CSV/Parquet load produces strings), inserts only the
      rows whose index appears in `valid_row_indices`. Rejects: CLI
      creates (or appends to) `finetype_reject_errors` with the
      RejectEntry ontology's 13 columns, projects each `RejectRecord`
      into one row. `scan_id` and `file_id` are constants set by the
      CLI; `line` = `row_index + 1`; `column_idx` = `column_index`;
      `column_name` = `column_name`; `error_type` = literal
      `'SEMANTIC_TYPE'`; `csv_line` and `byte_position` = NULL. All
      remaining reject fields copy directly from `RejectRecord`.
    verification: >-
      CLI integration test runs against a fixture. Opens the output
      `.db`. Asserts `PRAGMA table_info('finetype_reject_errors')`
      returns the exact 13-column schema matching the RejectEntry
      ontology (names + DuckDB types). Asserts a known reject row has
      `error_type = 'SEMANTIC_TYPE'` and correctly-populated
      `constraint_failed`, `constraint_value`, `type_confidence`,
      `expected_type`.

  - id: ac-07
    ac_type: code
    description: >-
      The existing scalar `finetype_validate(value VARCHAR, schema_json
      VARCHAR)` in `crates/finetype-duckdb/src/validate.rs` is
      unchanged by this spec. Its behaviour ('valid' or error string
      per value) is preserved; no table function shares its name. This
      AC documents that preservation and its test coverage as part of
      the regression suite.
    verification: >-
      Existing test for the scalar form continues to pass
      (`test_vrp_ac07_scalar_unchanged` — a thin wrapper calling the
      scalar on a simple `{"type":"string"}` schema, asserting 'valid'
      on a string input, non-'valid' on a non-conforming input).
      `cargo build -p finetype_duckdb` succeeds.

  - id: ac-08
    ac_type: code
    description: >-
      Malformed JSON Schema surfaces as a clean CLI error with exit
      code 2 (see ac-10). The CLI's schema-loading step validates that
      the file exists, parses as JSON, and has a `properties` object
      before any staging-table creation. Error messages are specific
      enough to diagnose: name the file path for missing-file, name
      the JSON parse position for invalid-JSON, name the missing
      required schema field for structural failures. No partial
      `.db` writes occur; if the schema load fails, no tables are
      created in the output `.db`.
    verification: >-
      Four CLI integration tests supply (a) a path to a non-existent
      file, (b) a path to invalid JSON, (c) a path to valid JSON
      missing `properties`, (d) a path with permission-denied. Each
      asserts the CLI exits 2 with an error message containing a
      substring specific to the failure mode. Each asserts the
      output `.db` has NO user-facing tables (validated via
      `SHOW TABLES`).

  - id: ac-09
    ac_type: gate
    description: >-
      The CLI command shape is:
      `finetype validate <input> <schema.json> --db <output.db> --table <name> [--append] [--lenient]`.
      Execution flow: (1) load and parse `<schema.json>`, fail-fast on
      malformed schema per ac-08; (2) open or create `<output.db>`;
      (3) read `<input>` (CSV or Parquet) into a staging table
      `__finetype_staging_<uuid>` via DuckDB's `read_csv`/`read_parquet`;
      (4) extract headers + rows from the staging table into Rust Vecs;
      (5) call `finetype_core::table_validator::validate_table(headers,
      rows, schema)` to produce a `TableValidationResult`; (6) BEGIN
      TRANSACTION; (7) create the user's `<name>` table (VARCHAR cols,
      names from headers); INSERT the rows indexed by `valid_row_indices`;
      (8) create `finetype_reject_errors` if absent (schema per
      RejectEntry ontology); INSERT each `RejectRecord` with the
      CLI-assigned `scan_id` and constant `file_id` = 0; (9) COMMIT;
      (10) drop the staging table (in a RAII-equivalent guard that
      runs on both success AND error paths). scan_id rules per
      constraint 8. `--append` reuses an existing `.db` and computes
      the next `scan_id` from `MAX(scan_id) + 1`; absence of
      `--append` on a `.db` that already contains the user's `<name>`
      table is an error (exit 2).
    verification: >-
      CLI integration test invokes the `finetype validate` binary with
      a 100-row fixture. Opens the output `.db`. Asserts (a)
      `SHOW TABLES` returns exactly 2 tables (the user's `<name>` and
      `finetype_reject_errors`) with no `__finetype_staging_*` residue;
      (b) `SELECT COUNT(*) FROM <name>` + `SELECT COUNT(*) FROM
      finetype_reject_errors WHERE scan_id = 1` sums to ≤ 100 (rejects
      can contribute multiple rows per source row, so total rejects ≥
      invalid-row count); (c) a forced-failure test (bad schema path)
      leaves the output `.db` empty of staging residue AND with no
      user-facing tables partially-populated.

  - id: ac-10
    ac_type: code
    description: >-
      CLI exit codes: `0` when zero rejects were produced and no error
      occurred; `1` when any rejects were produced (default CI-gate
      behaviour); `2` when an error occurred (bad schema, file
      unreadable, DuckDB error, staging collision without `--append`).
      A `--lenient` flag forces exit `0` regardless of reject count
      when no error occurred. Exit code `2` is not affected by
      `--lenient`.
    verification: >-
      CLI integration test with four fixtures: (a) zero-reject → exit 0
      with and without `--lenient`; (b) non-zero-reject → exit 1 without
      `--lenient`, exit 0 with `--lenient`; (c) bad schema path → exit 2
      with and without `--lenient`; (d) zero-reject + bad output
      directory → exit 2. Each case asserts the expected exit status
      exactly.

  - id: ac-11
    ac_type: code
    description: >-
      The CLI accepts the JSON Schema format produced by the existing
      `finetype schema <file>` command without modification. Specifically,
      `x-finetype-confidence` and `x-finetype-label` at each
      column-property level are read by the CLI's schema-load step
      and surfaced via `RejectRecord.type_confidence` and
      `RejectRecord.expected_type` on rejects produced from that
      column. Schemas without these extensions validate correctly but
      produce NULL in the corresponding reject columns (graceful
      degradation). The extension reader uses `serde_json`'s
      `get("x-finetype-*")` pattern and tolerates absence.
    verification: >-
      Integration test runs `finetype schema eval/datasets/csv/
      ecommerce_orders.csv > s.json` then `finetype validate
      eval/datasets/csv/ecommerce_orders.csv s.json --db out.db
      --table orders`. Asserts `SELECT type_confidence FROM
      finetype_reject_errors WHERE column_name = 'phone' LIMIT 1`
      returns a non-NULL value matching the schema's
      `x-finetype-confidence`. Separate test asserts a minimal schema
      without `x-finetype-*` extensions validates correctly and
      produces NULL in `type_confidence` / `expected_type`.

  - id: ac-12
    ac_type: code
    description: >-
      End-to-end test on the ecommerce_orders fixture documents the
      observable behaviour when the schema is itself wrong (the
      documented foot-gun). The reject sidecar populates with
      `type_confidence` and `expected_type` values that were recorded
      at schema-authoring time (i.e. copied from `x-finetype-confidence`
      / `x-finetype-label` in the schema JSON — NOT recomputed at
      validation). These authored-time values are what let the analyst
      distinguish "classifier was confidently wrong" from "data value
      is bad" using plain SQL. Validate remains deterministic and
      emits no warning/summary relation of its own.
    verification: >-
      Integration test runs `finetype validate` against
      `eval/datasets/csv/ecommerce_orders.csv` with the existing
      `eval/datasets/csv/ecommerce_orders.schema.json`. Asserts (a)
      `SELECT COUNT(*) FROM finetype_reject_errors WHERE column_name =
      'phone' AND type_confidence > 0.99` > 0 (classifier confidently
      wrong — SSN pattern 0.995 confidence rejected real phone numbers);
      (b) `SELECT COUNT(*) FROM finetype_reject_errors WHERE column_name
      = 'order_id' AND type_confidence < 0.5` > 0 (classifier uncertain
      — LOINC pattern at 0.425 confidence); (c) no summary/info relation
      is produced alongside the sidecar.

  - id: ac-13
    ac_type: gate
    description: >-
      The following named scenario grid has at least one test function
      each; every test name is prefixed `vrp_acNN_*` (where NN is the
      primary AC it covers). All tests pass under `make ci`.
      Scenarios — core crate (7):
      `happy_all_valid`, `all_reject`, `partial_reject_mixed`,
      `multi_reject_per_row`, `empty_input`, `single_row_single_column`,
      `constraint_grid` (one sub-test per pattern/min_length/max_length/
      enum/type/required).
      Scenarios — CLI (5):
      `cli_writes_db_with_sidecar`, `cli_staging_cleanup_on_success`,
      `cli_staging_cleanup_on_failure`, `cli_exit_code_grid`
      (sub-cases: zero-reject, non-zero-reject, error, lenient),
      `cli_malformed_schema_error_grid` (sub-cases: missing-file,
      invalid-json, missing-properties, permission-denied).
      Total: 12 named functions minimum (two with sub-cases).
      The previously-planned DuckDB-extension category is DROPPED
      per Scenario A ratification in ac-04.
    verification: >-
      `cargo test --workspace` output shows all listed functions
      passing. `make ci` output shows the full grid green (fmt + clippy
      + test + check). `grep -r 'fn.*vrp_ac' crates/` returns at least
      12 matches across finetype-core and finetype-cli.

  - id: ac-14
    ac_type: doc
    description: >-
      Documentation updated: (a) card `orbit/cards/0005-schema-driven-
      data-validation.yaml` has this spec appended to its `specs` array
      (already done in v1.0); (b) card `orbit/cards/0007-duckdb-
      sql-extension.yaml` same (already done); (c) CLAUDE.md `validate`
      entry reflects the new CLI shape (`--db`, `--table`, `--append`,
      `--lenient`) and `.db` output replacing the CSV/JSONL sidecars;
      (d) README `validate` section shows the new command form and a
      DuckDB query example against the output `.db`; (e) new MADR
      `orbit/decisions/0064-validate-as-duckdb-reject-pipeline.md`
      records the structural change, names the Scenario A pivot with
      its duckdb-rs API-gap rationale, and is marked as refining
      decisions 0031 and 0032.
    verification: >-
      (a) `specs:` array in the two cards includes this spec path. (b)
      CLAUDE.md contains the new `finetype validate ... --db out.db`
      form in the "CLI commands" table. (c) README contains an example
      SQL block querying `finetype_reject_errors`. (d) File
      `orbit/decisions/0064-validate-as-duckdb-reject-pipeline.md`
      exists, its frontmatter lists `status: accepted` and
      `date-created: 2026-04-24`, and its body references decisions 0031
      and 0032 in a refinement note and cites spike-duckdb-rs.md.

ontology_schema:
  name: "RejectEntry"
  description: >-
    One row in `finetype_reject_errors`. Carries DuckDB-compatible base
    columns alongside FineType-specific extensions. The CLI materialises
    this table by projecting `RejectRecord` entries from the
    `TableValidationResult` returned by `finetype_core::table_validator::
    validate_table`. Per-CLI-invocation scan_id; fresh `.db` → scan_id
    = 1; `--append` → scan_id = MAX(existing) + 1.
  fields:
    - name: "scan_id"
      type: "BIGINT"
      description: "Per-CLI-invocation counter assigned by the CLI before projection. Fresh .db starts at 1."
    - name: "file_id"
      type: "BIGINT"
      description: "Constant (0) for table-sourced rejects; reserved for future file-source integration."
    - name: "line"
      type: "BIGINT"
      description: "1-based row index in the source table (derived from RejectRecord.row_index + 1)."
    - name: "column_idx"
      type: "INTEGER"
      description: "0-based column index in the source table (copied from RejectRecord.column_index)."
    - name: "column_name"
      type: "VARCHAR"
      description: "Name of the column whose value failed validation (copied from RejectRecord.column_name)."
    - name: "error_type"
      type: "VARCHAR"
      description: "Literal 'SEMANTIC_TYPE' for FineType rejects; discriminator for UNION with DuckDB native parse rejects."
    - name: "csv_line"
      type: "VARCHAR"
      description: "NULL for table-sourced rejects (the raw CSV row is no longer available by the time validate runs). Preserved for UNION compatibility."
    - name: "byte_position"
      type: "BIGINT"
      description: "NULL for table-sourced rejects; preserved for UNION compatibility with DuckDB parse rejects."
    - name: "error_message"
      type: "VARCHAR"
      description: "Human-readable description of what failed and why (copied from RejectRecord.error_message)."
    - name: "type_confidence"
      type: "DOUBLE"
      description: "Authored-time value copied from the schema's `x-finetype-confidence`. NOT recomputed at validation. Enables the analyst to distinguish `bad value` from `wrong schema` via plain SQL."
    - name: "expected_type"
      type: "VARCHAR"
      description: "Authored-time value copied from the schema's `x-finetype-label` (FineType taxonomy label the column was classified as when the schema was generated)."
    - name: "constraint_failed"
      type: "VARCHAR"
      description: "Which constraint tripped: 'pattern' | 'min_length' | 'max_length' | 'enum' | 'type' | 'required' | 'other'."
    - name: "constraint_value"
      type: "VARCHAR"
      description: "The constraint's value (pattern regex, length limit as string, enum list as JSON-array string, etc.) for debugging without a schema round-trip."

evaluation_principles:
  - principle: "Determinism — same (schema, row) always produces same reject row"
    weight: 0.3
  - principle: "Single validation path — finetype-core is the only source of pass/fail + reject detail"
    weight: 0.2
  - principle: "DuckDB-idiom fidelity — reject shape UNIONs cleanly with native reject_errors"
    weight: 0.2
  - principle: "Analyst experience — .db is the artefact, opened directly, queried in-situ"
    weight: 0.15
  - principle: "Reviewability — schema is a plain JSON file, diff-able and check-in-able"
    weight: 0.15

exit_conditions:
  - "All 14 acceptance criteria marked [x] in progress.md"
  - "`make ci` output shows all tests passing"
  - "Integration test on ecommerce_orders fixture (ac-12) green"
  - "Card 0005's and 0007's specs arrays include this spec"
  - "MADR 0064 exists and references decisions 0031 / 0032 appropriately"
  - "PR review receives APPROVE verdict"

rollback_plan:
  status: "Scenario A ratified by ac-04 spike (2026-04-24)."
  triggers:
    - "[RATIFIED] duckdb-rs 1.4.4 BindInfo does not expose Connection/catalog access — confirmed by spike-duckdb-rs.md §(c) and cross-client research."
  responses:
    - "Scenario A (ADOPTED): no new DuckDB function is registered. CLI uses finetype-core::table_validator::validate_table directly and writes results to the output .db via duckdb-rs. The existing scalar finetype_validate(value, schema_json) remains unchanged for ad-hoc SQL use. This is reflected in all v1.2 ACs; no further rollback branches are live."
    - "Future card (deferred): if the DuckDB stable C API later exposes ClientContext to table-function bind callbacks (no known roadmap item as of 2026-04-24), open a follow-up spec to register finetype_validate as a native DuckDB table function. Preserve this spec's core-crate fields (ac-01/02/03) unchanged when that lands."

