goal: >
  Make `finetype validate --db --table` write a typed user table by
  applying per-column transforms inside the same DuckDB session that
  performs validation. Surface transform failures via a new
  `'TRANSFORM_FAILED'` reject ontology entry. Remove `cmd_load`. Single
  verb for the import flow: `profile -o json-schema → validate → done`.

constraints:
  - "TRY-wrap each transform — single-CTAS shape preserved, no second validation pass"
  - "Reject ontology extends: error_type gains 'TRANSFORM_FAILED'; constraint_failed gains 'transform'. Existing 'SEMANTIC_TYPE' / 7-token enum values unchanged. REJECT_SIDECAR_DDL columns unchanged (13 cols)"
  - "Projection builder lives in `crates/finetype-cli/src/main.rs` as a free function `build_transform_projection(headers, extensions, taxonomy, try_wrap: bool)`; no `finetype-core` API expansion"
  - "No `--no-transform` flag — SQL `CAST(col AS VARCHAR)` is the documented escape hatch"
  - "`cmd_load` removed outright in v0.6.19 (matches PR #51 hard-removal posture). `Commands::Load` variant, dispatch arm, function body all deleted; `build_load_expr` / `build_load_expr_enum` survive only if the lifted helper still uses them — otherwise deleted"
  - "Unlabelled columns pass through as VARCHAR (bare quoted identifier) — preserves MADR 0064 ac-11 graceful degradation contract"
  - "MCP `validate` tool's `ValidateRequest` shape (`crates/finetype-mcp/src/tools/validate.rs:9-22`) unchanged: no new fields, no behavioural change. The MCP description-string addendum lands at `crates/finetype-mcp/src/lib.rs:113` (`#[tool(description = ...)]` literal); the `tools/validate.rs` edit is limited to the module doc comment."
  - "Existing 15 `vrp_*` tests stay green: 8 CLI-side in `crates/finetype-cli/tests/validate_cli.rs` + 7 engine-side in `crates/finetype-core/src/table_validator.rs` (engine-side untouched by this fold). Today's CLI fixtures use `x-finetype-label: identity.code.id` (not in the taxonomy → graceful-degradation VARCHAR pass-through), so the CLI tests pass byte-identically without VARCHAR-assertion tightening; ac-08 verifies stay-green only. The new ac-02/ac-03/ac-04 tests use real taxonomy labels and carry the typed-CTAS coverage."
  - "Existing check-only mode (PR #51) preserved verbatim — when `--db`/`--table` are absent, no transforms run, no DuckDB session, behaviour byte-identical"
  - "`finetype load …` errors via clap unknown-subcommand handler (no shim, no warning, no carve-out)"
  - "Exit codes preserved: 0 = no rejects (including transform-failures), 1 = rejects present, 2 = error. `--lenient` continues to force exit 0"
  - "NULL-in-NULL-out is NOT a transform failure — staging-NULL → typed-NULL must NOT emit a reject row. The failure predicate is `staging IS NOT NULL AND TRY(transform) IS NULL`"
  - "ENUM type emission is NOT carried over from `cmd_load` — `validate --db --table` produces no `CREATE TYPE … AS ENUM` regardless of column cardinality. Low-cardinality columns retain the schema's `duckdb_type` (typically VARCHAR). `--enum-threshold` is NOT added to `validate`. ac-12 migration map calls this out under `### Changed`."
  - "Transform-failure sweep is pre-CTAS (binding choice): the per-column TRY-failure detection runs against the staging table and removes failed `__row_idx`s from the valid-set BEFORE the user-table CTAS executes. Single-pass user table; no DELETE-after pattern. Implementer must not implement the post-CTAS DELETE alternative."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      Free function `build_transform_projection(headers: &[String],
      extensions: &SchemaExtensions, taxonomy: &Taxonomy, try_wrap: bool) ->
      String` lives in `crates/finetype-cli/src/main.rs`. For each header,
      emits one of:
      - bare quoted identifier `"col"` — when ANY of:
        (a) `extensions.get(header)` returns `(None, _)` (no
            `x-finetype-label` on the column),
        (b) the label IS present but `taxonomy.get(&label)` returns `None`
            (label not in taxonomy — graceful degradation, mirrors
            today's `cmd_load:2758-2760` `("VARCHAR", None, "")` branch),
        (c) the taxonomy entry's `duckdb_type` is `VARCHAR`.
      - `TRY(transform-with-{col}-replaced) AS "col"` — when `try_wrap=true`,
        a label is present in the taxonomy, and a transform exists
      - `transform-with-{col}-replaced AS "col"` — when `try_wrap=false`,
        a label is present in the taxonomy, and a transform exists
      - `TRY_CAST("col" AS T) AS "col"` (or `CAST(...)` when
        `try_wrap=false`) — when a label is present in the taxonomy,
        no transform, but non-VARCHAR `duckdb_type`
      Returns a comma-separated SELECT list. Output is byte-identical to
      `build_load_expr`'s output when `try_wrap=false` and the same column
      set is supplied.
    verification: >
      Unit tests in `main.rs`'s test module:
      `build_transform_projection_emits_try_wrap_when_requested`,
      `build_transform_projection_passes_through_unlabelled_as_varchar`,
      `build_transform_projection_passes_through_unknown_label_as_varchar`,
      `build_transform_projection_emits_bare_passthrough_for_varchar`,
      `build_transform_projection_matches_build_load_expr_when_try_wrap_false`.
      Run: `cargo test -p finetype-cli build_transform_projection`.

  - id: ac-02
    ac_type: code
    description: >
      `cmd_validate_table`'s materialise path (the `if let (Some(db_path),
      Some(table_name)) { ... }` block currently around `main.rs:3884`)
      replaces its `SELECT * EXCLUDE(__row_idx) FROM staging` CTAS with the
      transform projection. The new CTAS shape:
        `CREATE TABLE <user_table> AS SELECT <projection> FROM
         <staging> WHERE __row_idx IN <valid_set_filter>;`
      Projection built via `build_transform_projection(headers,
      &extensions, &taxonomy, /*try_wrap=*/true)`. Staging table read as
      `read_csv(..., all_varchar=true)` is unchanged.
    verification: >
      New integration test
      `crates/finetype-cli/tests/validate_cli.rs::vrp_typed_user_table_columns`
      builds a 3-column CSV (DATE label, DECIMAL label, VARCHAR-only
      label), runs `validate --db out.db --table orders`, then
      `duckdb out.db -c "DESCRIBE orders"` and asserts column types are
      DATE, DECIMAL(18,2), VARCHAR respectively. All 3 valid rows present.

  - id: ac-03
    ac_type: code
    description: >
      Transform failures surface as reject rows. After CTAS, the validate
      path detects rows where `staging IS NOT NULL AND TRY(transform) IS
      NULL` per transformed column and emits a reject row with
      `error_type='TRANSFORM_FAILED'`, `constraint_failed='transform'`,
      `expected_type=<x-finetype-label>`, `constraint_value=<transform
      expression literal>`, `error_message=<staging cell value>`,
      `column_name=<header>`, `row_index=<staging __row_idx>`. The row is
      excluded from the user table (`WHERE __row_idx IN …` filter
      removes it).
    verification: >
      New integration test `vrp_transform_failure_emits_reject_row`:
      CSV has 3 date-shaped rows where row 2 is `2024-02-30` (matches
      `^\d{4}-\d{2}-\d{2}$` but `strptime` fails). Schema has
      `x-finetype-label: datetime.date.iso_8601` on the column. After
      `validate --db out.db --table d`:
        - `SELECT count(*) FROM d` returns 2 (rows 1 and 3)
        - `SELECT * FROM finetype_reject_errors WHERE
           error_type='TRANSFORM_FAILED'` returns 1 row with
           constraint_failed='transform', error_message='2024-02-30',
           expected_type='datetime.date.iso_8601'
        - exit code 1

  - id: ac-04
    ac_type: code
    description: >
      NULL-in-NULL-out is NOT a transform failure. A row whose staging
      cell is NULL (CSV reader normalised "" / "NULL" / "null") and whose
      `TRY(transform)` is NULL must NOT emit a `'TRANSFORM_FAILED'` reject
      row. The user-table cell is NULL; the row remains in the user
      table (assuming no schema rejection).
    verification: >
      New integration test `vrp_null_in_null_out_no_transform_failure`:
      CSV has 3 rows where row 2's date column is empty (CSV `,,`).
      After `validate --db out.db --table d`:
        - `SELECT count(*) FROM d` returns 3
        - `SELECT count(*) FROM finetype_reject_errors WHERE
           error_type='TRANSFORM_FAILED'` returns 0
        - row 2's date column reads NULL
        - exit code 0

  - id: ac-05
    ac_type: code
    description: >
      `Commands::Load` variant deleted from the clap `Commands` enum.
      Dispatch arm `Commands::Load { ... } => cmd_load(...)` removed from
      `main()`. Function `cmd_load` deleted. `build_load_expr` and
      `build_load_expr_enum` deleted IF unused by
      `build_transform_projection`; otherwise renamed/inlined into the
      new helper. Net `crates/finetype-cli/src/main.rs` LOC delta:
      ≤ -250 measured against PR #54's post-merge HEAD (the
      schema-verb-fold parent). `cargo build -p finetype-cli` compiles
      clean with `clippy -D dead_code -D warnings`.
    verification: >
      `grep -n "fn cmd_load\|Commands::Load\|fn build_load_expr"
       crates/finetype-cli/src/main.rs` returns zero matches (the
      lifted helper has a different name). LOC delta verified by
