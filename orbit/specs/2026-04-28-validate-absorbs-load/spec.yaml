implementation_notes:
  - "Today's CTAS to replace lives at main.rs:3884 — `CREATE TABLE {} AS SELECT * EXCLUDE(__row_idx) FROM {} {};` (the `{}` for valid_filter is a `WHERE __row_idx IN (...)` clause)"
  - "`build_load_expr` (main.rs:2903-2920) and `build_load_expr_enum` (main.rs:2925) are the existing per-column expression generators. Lift their logic into `build_transform_projection`, parameterised on `try_wrap`. Keep the VARCHAR-bare-passthrough branch (today line 2911) — it covers both unlabelled-column and explicit-VARCHAR cases."
  - "`cmd_load`'s label-resolution path (`column_classifier.classify_column_with_header(...)` at main.rs:3179-3183) is NOT carried over — folded validate reads `x-finetype-label` from the schema via `SchemaExtensions::extract` (main.rs:3606-3621). The schema is the contract."
  - "`SchemaExtensions::get(column_name)` returns `(Option<String>, Option<f64>)` — the label and confidence. For an unlabelled column, both are None and `build_transform_projection` falls into the bare-passthrough branch."
  - "Transform-failure detection — recommended SQL shape (single post-CTAS sweep): `INSERT INTO finetype_reject_errors SELECT __row_idx, '<col>', staging.<col>, ..., 'TRANSFORM_FAILED', 'transform', '<transform-expr>', '<label>', confidence FROM __finetype_staging staging WHERE __row_idx IN <valid_set> AND staging.<col> IS NOT NULL AND TRY(<transform-expr>) IS NULL;` — one statement per transformed column. CLI loops over headers."
  - "Alternative (single CTE shape) — emit `WITH transform_failures AS (SELECT __row_idx, col_name, ... FROM staging UNPIVOT(value FOR col_name IN (...)) WHERE ...)` once. Trade-off: cleaner SQL, harder to debug per-column. Recommendation in spec is per-column INSERTs (matches current per-column reject loop in cmd_validate_table at main.rs:3920-ish)."
  - "User-table CTAS exclusion: rows that fail any transform are removed from the `valid_row_indices` set BEFORE the CTAS runs (constraint, not recommendation — see new constraint line). Implementation: after the per-column transform-failure sweep populates the reject sidecar, query `SELECT DISTINCT row_index FROM finetype_reject_errors WHERE error_type='TRANSFORM_FAILED'` and remove those indices from the valid-set used in the CTAS WHERE clause. The post-CTAS DELETE alternative is forbidden (single-pass user table is the binding choice)."
  - "CSV-NULL normalisation lives at main.rs:3804-3812 (`\"\"`, `\"NULL\"`, `\"null\"` → None). The validation engine and the staging table see the same NULL values. The transform-failure predicate `staging IS NOT NULL AND TRY(transform) IS NULL` correctly excludes legitimate NULL-in-NULL-out (because `staging IS NOT NULL` is false when staging cell is NULL)."
  - "ENUM columns (`build_load_expr_enum` at main.rs:2925) — `cmd_load` emits `CREATE TYPE <name> AS ENUM (...)` before the CTAS for low-cardinality columns when `--enum-threshold > 0`. `validate` does NOT have an ENUM threshold flag today and the fold does NOT add one (binding constraint above). ENUM emission is dropped from the validate fold; the `build_load_expr_enum` function is deleted alongside `cmd_load`. ac-12's `### Changed` block records this as a behavioural shift."
  - "Today's 8 CLI-side `vrp_*` tests live in `crates/finetype-cli/tests/validate_cli.rs` and are named `test_vrp_ac11_xft_extensions_surface`, `test_vrp_ac11_null_on_absence`, `test_vrp_ac12_ecommerce_end_to_end`, plus 5 `test_vrp_ac13_cli_*` tests. (The `ac-NN` segments in those names are the AC numbers from the original PR #46 spec at `2026-04-22-duckdb-extension-ergonomics/spec.yaml`, NOT this spec's AC numbers.) Their fixture schemas use `x-finetype-label: identity.code.id` (not in taxonomy), so they fall through to bare-passthrough VARCHAR after the fold and pass byte-identically — no column-type-assertion tightening needed. The 7 engine-side `vrp_*` tests live in `crates/finetype-core/src/table_validator.rs` and are pure-function unit tests (not affected by this fold)."
  - "Decision pack at decisions.md surfaced the open SQL-shape question (per-column INSERT vs single CTE UNPIVOT). Spec recommends per-column INSERT for diagnosability; if implementer hits SQL complexity they may switch to UNPIVOT and document in MADR 0071."
  - "`format_column_name`, `sql_ident`, `sql_quote` are CLI-local helpers (main.rs:3640-3643 and nearby). They stay in the CLI; `build_transform_projection` calls them directly."
  - "MCP `validate` tool description-string addendum lands at `crates/finetype-mcp/src/lib.rs:113`'s `#[tool(description = \"...\")]` literal (the actual surface). The `crates/finetype-mcp/src/tools/validate.rs` edit is limited to the module doc comment; the `ValidateRequest` struct (lines 9-22) and `handle()` signature are NOT touched."

ontology_schema:
  name: "RejectOntologyExtension"
  description: >
    Extension to MADR 0064's RejectEntry ontology (REJECT_SIDECAR_DDL,
    main.rs:3713-3728). Existing 13-column shape unchanged; two value
    spaces extend.
  fields:
    - name: "error_type"
      type: "enum"
      description: >
        Discriminator for reject row origin. Was {'SEMANTIC_TYPE'};
        becomes {'SEMANTIC_TYPE', 'TRANSFORM_FAILED'}. SEMANTIC_TYPE
        means schema rejection (pattern/type/etc); TRANSFORM_FAILED
        means schema validation passed but DuckDB transform produced
        NULL on a non-NULL input.
    - name: "constraint_failed"
      type: "enum"
      description: >
        Token naming the failing constraint. Was
        {pattern, min_length, max_length, enum, type, required, other};
        becomes that set ∪ {'transform'}. The 'transform' token pairs
        with error_type='TRANSFORM_FAILED'.
    - name: "constraint_value"
      type: "string"
      description: >
        For 'transform' constraint: carries the transform expression
        literal (e.g., `strptime("col", '%Y-%m-%d')::DATE`). Mirrors
        existing semantics where 'pattern' constraint_value is the
        regex literal.
    - name: "error_message"
      type: "string"
      description: >
        For 'transform' constraint: carries the failing input value
        from the staging table (the raw VARCHAR cell that the
        transform could not parse).

evaluation_principles:
  - principle: "Validation engine is unchanged"
    weight: 0.25
  - principle: "Single CTAS shape preserved"
    weight: 0.20
  - principle: "Hard-removal posture (no shim, no warning)"
    weight: 0.20
  - principle: "Reject ontology extends minimally (2 new values; 13-col DDL fixed)"
    weight: 0.20
  - principle: "MCP surface stable"
    weight: 0.15

