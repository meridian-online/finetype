goal: "Comprehensive audit of training and eval data quality, fill coverage gaps for 100 uncovered types with synthetic data, and retrain multi-branch model (v16) on clean data with longer training. Target: 221+/227 profile eval (97.4%+)."

constraints:
  - "Same 5-branch multi-branch architecture (char+embed+stats+header+validation) — no architecture changes"
  - "600/type synthetic data cap, matching v12 distillation convention"
  - "Training on Metal (macOS), 75–100 epochs, estimated ~4–5 hours (larger dataset than v14)"
  - "Model-as-critic for training data audit (v14 inference on all training rows, with label_remap applied before comparison)"
  - "Heuristic + sample adjudication for training disagreements: validation regex auto-adjudicate where possible, review >=10 disagreements per label for labels with >50 flags, all flags for labels with <=50"
  - "Full manual review for all 338 eval ground truth labels — inspect 5+ sample values per label, document methodology"
  - "No new disambiguation rules — data quality only"
  - "Version bump and release are out of scope (separate card)"

acceptance_criteria:
  - id: ac-01
    description: "Eval ground truth audit complete — all 338 labels in manifest.csv verified against actual column values"
    verification: "Audit report at orbit/specs/2026-04-18-v16-data-audit-retrain/eval-audit.md documents review methodology (5+ sample values per label), lists every correction with evidence, and confirms all 338 labels reviewed. Corrected manifest.csv committed."
    files:
      - eval/datasets/manifest.csv

  - id: ac-02
    description: "Training data model-as-critic audit complete — v14 inference run on all 102k training rows with label_remap.json applied before comparison, disagreements flagged and categorised by label"
    verification: "Audit report with disagreement count, breakdown by label, and resolution summary. Script used for audit is committed. 6 unmapped labels ('', 'yes', 'amount_minor_int', 'metric_prefix', 'paragraph', 'sentence') resolved — either remapped or removed."
    files:
      - output/distillation-v3/sherlock_distilled.csv.gz
      - data/label_remap.json

  - id: ac-03
    description: "Training data cleaned — mislabeled examples corrected or removed. Changes flow through the data prep pipeline (prepare_multibranch_data.py), not just raw CSV edits"
    verification: "Clean training dataset produced via data prep pipeline. Diff summary shows number of corrections per label. FTMB training file rebuilt from corrected data."
    files:
      - output/distillation-v3/sherlock_distilled.csv.gz
      - data/label_remap.json

  - id: ac-04
    description: "Coverage gaps filled — synthetic training data generated for all 100 types not present in distilled data (100 types x 600 examples = ~60k rows)"
    verification: "Synthetic data merged into training pipeline. All 240 taxonomy types have >= 1 training example in the final FTMB file. finetype check passes."
    files:
      - labels/definitions_*.yaml

  - id: ac-05
    description: "v16 model trained — 75–100 epochs on clean + synthetic data, best val_acc recorded"
    verification: "models/sherlock-v16/results.json exists with epoch metrics. Training summary shows best_val_accuracy. models/default symlink updated."
    files:
      - models/sherlock-v16/results.json

  - id: ac-06
    description: "Profile eval achieves 221+/227 (97.4%+ label accuracy). Any regressions on columns correct in v14 must be explained and documented."
    verification: "make eval-report shows >= 221/227. Diff against v14 baseline produced. If any column regresses, the regression is documented with root cause (GT correction, model churn, or synthetic data effect). Net improvement required."
    files:
      - eval/eval_output/report.md

  - id: ac-07
    description: "Golden integration tests pass with v16 model"
    verification: "cargo test -p finetype-cli --test cli_golden -- --ignored passes all golden tests (assertion updates permitted for improved predictions)"
    files:
      - crates/finetype-cli/tests/cli_golden.rs

  - id: ac-08
    description: "All existing tests pass, no regressions"
    verification: "cargo test passes all tests. finetype check passes."

evaluation_principles:
  - principle: "Data quality — clean training data is the primary lever for accuracy"
    weight: 0.4
  - principle: "Coverage — all 240 types represented in training gives the model full vocabulary"
    weight: 0.3
  - principle: "No net regression — any churn must be explained and net positive"
    weight: 0.3

exit_conditions:
  - "Profile eval >= 221/227 with net improvement over v14"
  - "All 240 types have training data"
  - "All 338 eval labels verified with documented methodology"
  - "6 unmapped training labels resolved"
  - "finetype check passes"
  - "All tests pass"

