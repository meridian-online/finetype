goal: >
  Train and promote a sherlock-v18 model that improves v16's accuracy on
  the expanded 352-column eval corpus (v16 baseline: 297/352 = 84.4%
  label / 91.8% domain), without regressing v16's domain accuracy or
  triggering concentrated per-domain regressions. Fix the sweep
  data-prep waste inherited from v16/v17 by pinning a single data seed
  and reusing one `.ftmb` across all training seeds.

constraints:
  - "Fixed data seed — prep runs ONCE with `DATA_SEED=42`. All training seeds reuse the same `.ftmb`. One prep artefact per sweep, not per seed."
  - "Triage is a hard gate — no training run may start before `triage.md` enumerates every v16 misclassification on the expanded 352-col eval with a per-type lever assignment (data / Sharpen rule / architecture)."
  - "Promotion gate (pinned v16 baseline via git SHA of eval inputs): `v18_score ≥ 297/352` on expanded eval AND per-domain regression ≤ 3 columns in any single domain. Gate must be checked before any `models/default` flip."
  - "Leakage firewall must be active on every training run — row-hash filter in `scripts/prepare_multibranch_data.py` is on by default, `eval/datasets/sources.yaml` role manifest present, realism pre-screen passing. Log line asserting hash-filter active is required in prep output."
  - "Scope: retrain + Sharpen adjustments only. Sharpen rules must be value-based per decision 0048 — no header-dependent rules. Taxonomy edits are OUT-OF-SCOPE for v18 — if triage surfaces a coverage gap (an expanded-eval type missing from the 240-type taxonomy), the gap is recorded in triage.md with `proposed_lever: taxonomy-add` and deferred to a follow-up sprint card. No CLI changes, no architecture changes, no Sharpen rule restructuring beyond additions."
  - "3-seed training-only sweep — seeds {42, 43, 44}, 100 epochs each, patience 15, one shared `.ftmb`. Training gate from decision 0053 unchanged (floor 88% val_acc, auto-accept 91.2%)."
  - "Sibling-context attention preserved — `classify_columns_with_context` remains the default profile path. v18 training data must exercise the sibling-context branch (verify during prep)."
  - "No release promotion before gate cleared. `models/default` symlink unchanged until winner selected, gate passed, and release scope decided (decision-record outcome)."
  - "Corpus base (v3 / v4 / v4+additions) is a triage-informed decision — must be recorded in a MADR before prep runs. Corpus choice must cite triage evidence."
  - "If corpus base includes v4 assets (branch `distilled-data-relabel-7-types-v17`), a clean rebase onto main is required before prep — or required merge resolutions must be documented in the corpus MADR."
  - "Row-hash firewall verification required if v4 corpus adopted — log v4-vs-expanded-eval overlap count before training. Any non-zero overlap must be filtered by the firewall; assert zero leaked rows post-filter."
  - "Prep log must contain the literal marker `hash_filter_active: true` — absence fails ac-04 regardless of overlap/leaked_rows values (a silently-disabled firewall can log zeros)."
  - "Prep-script instrumentation is IN SCOPE for v18 — `scripts/prepare_multibranch_data.py` must be patched to emit the seven hash-firewall + sibling-context log markers required by ac-04 and ac-05. The markers do not exist in the current codebase; adding them is part of ac-02's deliverable surface."
  - "Dependency ordering is strict: ac-01 (triage) → ac-03 (corpus MADR `accepted`) → prep invocation → ac-05 (sweep runs) → ac-07 (promotion gate). ac-02 (sweep script skeleton + prep instrumentation) may land in any order but its runtime smoke test must not execute a real prep invocation until ac-03 is `accepted`."
  - "No auto-promotion. Winner selection (ac-07) and release-scope decision (ac-10) are separate steps with manual checkpoints."
  - "Time/compute budget: per-seed training target 4h soft / 6h concerning hard on M1 Pro Metal. Total sweep wall-clock target ≤ 12h end-to-end (prep + 3 seeds + eval per seed). Budget is operator-enforced guidance; ac-05's summary CSV records `time_secs` per seed for post-hoc audit but does not hard-fail on overrun."

acceptance_criteria:
  - id: ac-01
    ac_type: gate
    description: >
      Triage discovery complete. `orbit/specs/2026-04-21-v18-retrain/triage.md`
      exists and enumerates every v16 misclassification on the expanded
      352-col eval (~55 columns). Each row tagged with `dataset,
      column_name, gt_label, v16_label, error_category, proposed_lever`
      where `error_category ∈ {short-string-collapse, sibling-context-pull,
      label-confusion, taxonomy-gap, data-gap, validator-ambiguity,
      other}` and `proposed_lever ∈ {add-data, fix-label-remap,
      add-sharpen-rule, retrain-only, taxonomy-add, investigate-further}`.
      Per-domain summary table included (domain: failure count, top error
      categories). Input SHAs pinned — `triage.md` header records the git
      SHAs of `eval/eval_output/profile_results.csv` and
      `eval/datasets/manifest.csv` used to compute the failure set
      (either commit SHA of the repo at triage time, or `sha256:<hex>`
      content hashes of the two files). Verification replays against
      those pinned inputs, not live files.
    verification: >
      `triage.md` exists at the spec path. File contains a markdown table
      with the required columns. Header block includes three fields:
      `total_v16_failures_covered: N`, `profile_results_sha: <hex-or-commit>`,
      `manifest_sha: <hex-or-commit>`. N equals the v16 failure count
      computed from the SHA-pinned `profile_results.csv` vs SHA-pinned
      `manifest.csv` (label + domain match — a "failure" is any row
      where v16's predicted label or domain disagrees with ground truth).
      Every failure is accounted for in exactly one table row; merging
      two related failures into one row is permitted only if both their
      `dataset::column` identifiers appear in the row. A per-domain
      summary table appears before the detail table with columns
      `domain, v16_correct, v16_incorrect, total_eval_cols` for each of
      the 7 taxonomy domains (container, datetime, finance, geography,
      identity, representation, technology). At least one row has a
      non-`investigate-further` lever.

  - id: ac-02
    ac_type: code
    description: >
      Sweep script skeleton + prep-script instrumentation. Two code
      deliverables: (a) `scripts/sweep_v18.sh` (new file, copy+modify
      of `sweep_v17.sh`) invokes `prepare_multibranch_data.py` once with
      a pinned `--seed 42` and writes output to
      `output/multibranch-training/v18.ftmb`, then invokes
      `cargo run -- train-multi-branch` three times with
      `--seed {42,43,44}` pointing at the same `.ftmb`. The FTMB is NOT
      cleaned up between training runs (only after all 3 complete).
      (b) `scripts/prepare_multibranch_data.py` is patched to emit the
      seven required log markers for ac-04 and ac-05:
      `corpus_base: <path>`, `pre_filter_rows: N`, `row_hash_overlap: N`,
      `post_filter_rows: N`, `hash_filter_active: true`,
      `leaked_rows_after_filter: N`, `eval_hash_table_sha256: <hex>`,
      `n_sibling_headers: N`. Markers are emitted unconditionally
      (even on zero-overlap runs) so ac-04 verification can detect a
      silently-disabled firewall from marker absence.
    verification: >
      `scripts/sweep_v18.sh` exists, is executable, and contains exactly
      one `prepare_multibranch_data.py` invocation inside the seed loop
      guard. `grep -c "prepare_multibranch_data.py" scripts/sweep_v18.sh`
      returns 1 (not 3). `scripts/prepare_multibranch_data.py` contains
      string literals for all eight log markers
      (`corpus_base`, `pre_filter_rows`, `row_hash_overlap`,
      `post_filter_rows`, `hash_filter_active`, `leaked_rows_after_filter`,
      `eval_hash_table_sha256`, `n_sibling_headers`) — verified by
      `grep -c` against the file. Syntax check: `bash -n scripts/sweep_v18.sh`
      exits 0 AND `python -m py_compile scripts/prepare_multibranch_data.py`
      exits 0. No runtime smoke test is required at this AC — the
      end-to-end prep invocation happens at ac-05 and depends on ac-03
      being `accepted` first.

  - id: ac-03
    ac_type: doc
    description: >
      Corpus base decision committed as MADR. New decision file at
      `orbit/decisions/0060-v18-corpus-base.md` (pre-assigned to avoid
      race with ac-08 → 0061). Records the corpus choice (v3, v4, or
      v4+additions) with explicit citations to triage.md evidence. If
      corpus base includes v4 assets, MADR also records (a) rebase
      status of `distilled-data-relabel-7-types-v17` onto current main
      (clean / required-merge-resolutions-listed), and (b) any
      `prepare_multibranch_data.py` conflicts resolved. Status
      `accepted` before prep runs.
    verification: >
      File `orbit/decisions/0060-v18-corpus-base.md` exists with status
      `accepted`. "Decision Outcome" section names one of {v3, v4,
      v4+additions}. Evidence requirement: either (a) cites at least
      three specific triage.md rows (by dataset::column) that justify
      the choice, OR (b) records an explicit negative-evidence argument
      naming the failure categories that would have justified a
      different choice and why they are absent from the triage set.
      If v4 assets selected, the MADR contains a subsection naming
      rebase status explicitly.

  - id: ac-04
    ac_type: code
    description: >
      Row-hash firewall verified as ACTIVE (not just "ran with zero
      overlap"). Before training, the prep invocation logs five distinct
      fields in order: (a) `corpus_base: <path>`, (b) `pre_filter_rows: N`,
      (c) `row_hash_overlap: N`, (d) `post_filter_rows: N`, (e)
      `hash_filter_active: true`. The sentinel assertion
      `pre_filter_rows - row_hash_overlap = post_filter_rows` must hold
      — any other arithmetic indicates the filter did not run. Overlap
      > 0 is permitted only if `post_filter_rows > 0` AND
      `leaked_rows_after_filter: 0` appears in a subsequent log line
      (computed by re-hashing post-filter rows against the eval hash
      table). `leaked_rows_after_filter` must be logged UNCONDITIONALLY
      — even on zero-overlap runs — as a defence-in-depth signal that
      the filter actually ran (not just arithmetically no-oped). The
      SHA256 of `eval/row_hashes.tsv` loaded by the prep run must also
      be logged as `eval_hash_table_sha256: <hex>`. The instrumentation
      that emits these markers is implemented at ac-02; ac-04 verifies
      their presence in the runtime log.
    verification: >
      `results/sweep-v18.log` contains all six log markers:
      `corpus_base`, `pre_filter_rows`, `row_hash_overlap`,
      `post_filter_rows`, `hash_filter_active: true`,
      `leaked_rows_after_filter: 0`, PLUS `eval_hash_table_sha256:
      <64-hex>`. The sentinel arithmetic check passes when run against
      the logged values. Fail if `hash_filter_active: true` is absent
      OR if `leaked_rows_after_filter` is missing OR if
      `eval_hash_table_sha256` is missing.

  - id: ac-05
    ac_type: code
    description: >
      3-seed sweep executes cleanly. All 3 training runs reuse
      `output/multibranch-training/v18.ftmb`. Per-seed artefacts at
      `models/sherlock-v18-seed-{42,43,44}/` — six files each:
      `results.json`, `epochs.jsonl`, `config.json` (including
      injected `type_index_keys`), `model.safetensors`, `label_map.json`,
      and a per-seed eval report at
      `models/sherlock-v18-seed-{SEED}/eval/report.md` written by
      invoking `eval/profile_eval.sh` (or equivalent) against that
      seed's model with `FINETYPE_MODEL=models/sherlock-v18-seed-{SEED}`.
      The wrapper invocation is part of `scripts/sweep_v18.sh` (ac-02).
      Summary CSV at `results/sweep-v18-summary.csv` with 3 data rows +
      header. Sibling-context data present in the FTMB: prep log
      reports a non-zero `n_sibling_headers` across table groups (FTMB
      v3 payload — `sibling_headers` field per
      `crates/finetype-train/src/multi_branch.rs`). Sibling-context
      verification does NOT require a config.json key — the
      multi-branch model's config does not carry sibling-context
      metadata; sibling context travels in the FTMB payload.
    verification: >
      All three model directories exist with all six required files
      (including `label_map.json` and
      `models/sherlock-v18-seed-{SEED}/eval/report.md`). Summary CSV
      has 4 lines (header + 3 seeds). All three seeds' `results.json`
      have ≥ 1 epoch with `val_accuracy` populated. Prep log contains a
      log line matching `n_sibling_headers: <N>` where N > 0 (grep
      pattern `n_sibling_headers: [1-9]`). Each per-seed
      `eval/report.md` is a non-empty file containing the literal
      string `profile` (indicating it came from the profile eval
      harness).

  - id: ac-06
    ac_type: gate
    description: >
      Training gate (decision 0053) passes for at least one seed. At
      least one of the three seeds achieves `val_accuracy ≥ 0.88`
      (floor). All three below floor is a halt condition: the spec is
      marked HALTED (not retried in-session) and `progress.md`
      documents structured investigation hypotheses before any retry
      sweep is authorised in a follow-up spec. HALT transition is
      observable via two signals: (a) `progress.md` contains a "Halt
      investigation" section with the required hypothesis schema,
      AND (b) `drive.yaml` `status` field is set to `halted` (no
      further stage transitions in this drive).
    verification: >
      At least one row in `results/sweep-v18-summary.csv` has
      `gate_status ∈ {AUTO_ACCEPT, FLAG_MANUAL}`. If all three are
      `REJECT`, `progress.md` contains a "Halt investigation" section
      with at least three hypotheses, each formatted as four sub-fields:
      `- symptom:` (observed failure pattern), `- testable_prediction:`
      (concrete check that would confirm/refute), `- falsification_step:`
      (command or query to run), `- estimated_cost:` (time/compute).
      On halt, `drive.yaml` has `status: halted` and no post-halt stage
      transitions appear in `history`. Any retry is a separate
      follow-up spec, not an in-session loop.

  - id: ac-07
    ac_type: gate
    description: >
      Promotion gate cleared. Winner seed's expanded-eval score
      `≥ 297/352` AND per-domain regression count `≤ 3` in every one of
      the 7 taxonomy domains (container, datetime, finance, geography,
      identity, representation, technology). Winner selection: highest
      profile-eval score > highest val_acc > lowest seed number. The
      flat `≤ 3` floor is a deliberate trade-off — in small domains
      (e.g. container, ~4-10 eval cols) this is a loose floor, in
      large domains (e.g. datetime, ~80 eval cols) it is tight;
      chosen for simplicity over scaling. Gate semantics are strict:
      if the selected winner (by tie-break) fails the per-domain
      regression floor, the sweep outcome is HELD regardless of other
      seeds' scores — candidate re-selection down the tie-break order
      is NOT permitted. The tie-break decides the evaluation target;
      the gate decides promotion. Per-column v16→v18 diff emitted at
      `orbit/specs/2026-04-21-v18-retrain/v16-v18-diff.md` with four
      sections: fixes, regressions (domain-tagged), persistent-failures,
      per-domain summary.
    verification: >
      `v16-v18-diff.md` exists with all four sections named.
      Winner's eval score from `models/sherlock-v18-seed-XX/eval/report.md`
      `≥ 297`. Python scriptable domain-regression check:
      for each of the 7 named domains, count columns
      correct-in-v16-wrong-in-v18; every count ≤ 3. If any domain
      regression count > 3 for the selected winner, `ac-09`'s outcome
      MADR must record `held` with this domain named as the hold
      reason — ac-07 itself is recorded as FAILED in progress.md. The
      per-domain summary section in `v16-v18-diff.md` lists the
      regression count for all 7 domains (including zero-regression
      domains, for auditability).

  - id: ac-08
    ac_type: doc
    description: >
      Data-seed-discipline MADR committed. New decision file at
      `orbit/decisions/0061-sweep-data-seed-discipline.md` (pre-assigned
      to avoid race with ac-03 → 0060). Captures the rule "prep runs
      once per sweep with fixed data seed; training seeds vary training
      randomness only." References v17 sweep measurements (~60 min +
      1.9 GB waste) and cites v18 as the first adopter.
    verification: >
      File `orbit/decisions/0061-sweep-data-seed-discipline.md` exists
      with status `accepted`. "Context and Problem Statement" section
      quantifies v17 waste. "Consequences" section notes implications
      for future sweep scripts.

  - id: ac-09
    ac_type: doc
    description: >
      v18 outcome MADR committed. New decision file at
      `orbit/decisions/0062-v18-outcome.md`. Status `accepted`.
      If promoted: records corpus base, winner seed, eval delta,
      release PR reference, and a per-column fixes/regressions
      breakdown. If held: records hold reason (e.g., per-domain
      regression or net-zero outcome), specifies v4 artefact
      disposition, and includes a per-column fixes/regressions
      breakdown so the hold is auditable. If halted (ac-06 HALT
      triggered before eval): records the halt investigation
      hypotheses from `progress.md`, names the v4 artefact
      disposition, and explicitly notes that no per-column breakdown
      exists because no eval ran.
    verification: >
      File `orbit/decisions/0062-v18-outcome.md` exists with status
      `accepted`. Outcome section explicitly states one of "promoted"
      / "held" / "halted". For promoted or held: includes a
      per-column fixes/regressions breakdown. For halted: includes
      a reference to the `progress.md` halt-investigation section
      and explicitly notes no per-column breakdown (because no eval
      ran).

  - id: ac-10
    ac_type: gate
    description: >
      Release scope decided and recorded. `handover.md` exists at
      the spec path and names one of {v0.6.18 shipped, internal
      promotion only, held}. HuggingFace upload, `FINETYPE_CI_MODEL`
      bump, and `models/default` flip mechanics are explicitly
      out-of-scope for this spec — they are delegated to the release
      skill / a subsequent release card once this gate is cleared.
      This spec's gate is the decision record, not the mechanics.
    verification: >
      `handover.md` exists and names exactly one of the three release
      decisions in its header. If "shipped", references the post-gate
      release card/PR URL. If "held", references the 0062 v18 outcome
      MADR hold rationale. If "internal promotion only", names the
      downstream consumers + timeline for public release revisit.

ontology_schema:
  name: "V18RetrainWorkflow"
  description: "The v18 retrain workflow from triage through promotion/hold."
  fields:
    - name: "triage_row"
      type: "object"
      description: "A single v16 failure on the expanded eval, tagged with lever."
    - name: "corpus_base"
      type: "enum[v3, v4, v4-plus-additions]"
      description: "Training data source chosen based on triage evidence."
    - name: "training_seed"
      type: "integer"
      description: "Seed for weight init + batch order (varies per run)."
    - name: "data_seed"
      type: "integer"
      description: "Seed for prep randomness (fixed at 42 per sweep)."
    - name: "sweep_outcome"
      type: "enum[promoted, held, halted]"
      description: "Terminal outcome across all 3 training seeds."

evaluation_principles:
  - principle: "Data-seed discipline is load-bearing — it's the primary efficiency and signal-clarity improvement v18 introduces. Any deviation requires a new MADR."
    weight: 0.2
  - principle: "Triage-before-sweep catches priorities before they become sunk cost — half a day of triage avoids 9h of blind sweep chasing the wrong failures."
    weight: 0.2
  - principle: "Per-domain floor in promotion gate prevents net-zero regressions-masking-fixes (the v17 failure mode)."
    weight: 0.25
  - principle: "Leakage firewall is non-negotiable — every training run verifies it's active. A promoted model trained on leaked data is worse than no promotion."
    weight: 0.2
  - principle: "Release-decision after gate is cleared — no premature release commitment. Ship what's earned, not what's planned."
    weight: 0.15

exit_conditions:
  - "v18 promoted: MADR recorded, models/default flipped, release decision recorded."
  - "v18 held: MADR records hold rationale + v4 artefact disposition + next-step analysis."
  - "Sweep halted pre-eval: all 3 seeds below val_acc floor; halt investigation section appended to progress.md before any retry."

metadata:
  version: "1.3"
  status: "active"
  test_prefix: "v18r"
  timestamp: "2026-04-21T00:00:00Z"
  ambiguity_score: 0.08
  interview_ref: "orbit/specs/2026-04-21-v18-retrain/interview.md"
  revision_history:
    - version: "1.0"
      notes: "Initial spec."
    - version: "1.1"
      notes: "Addressed review-spec-2026-04-21.md findings: 3 MED (cross-ref bug, ac-04 firewall-active sentinel, ac-10 scope narrowing) + 4 LOW (ac-01 total_v16_failures_covered, MADR numbering pre-assigned 0060/0061/0062, ac-05 sibling-context verification, v4-rebase cleanliness in ac-03)."
    - version: "1.2"
      notes: "Addressed review-spec-2026-04-21-v2.md findings: 1 HIGH (ac-05 sibling-context moved off config.json onto FTMB prep-log n_sibling_headers), 3 MED (ac-05 file count → 6 incl label_map.json, ac-07 7 domains enumerated + trade-off owned, taxonomy-edit tightened to OUT-OF-SCOPE for v18), 3 LOW (ac-04 leaked_rows_after_filter + eval_hash_table_sha256 logged unconditionally, ac-06 halt-hypotheses schema specified, time budget constraint added)."
    - version: "1.3"
      notes: "Addressed review-spec-2026-04-21-v3.md findings: 2 HIGH (ac-02 expanded to include prep-script instrumentation work explicitly; ac-02 runtime smoke test removed — dependency ordering added as explicit constraint so ac-02 syntax checks land pre-ac-03 and the real prep runs only at ac-05 after ac-03 accepted), 3 MED (ac-01 input SHA pinning; ac-07 tie-break-vs-gate ordering made strict HELD; ac-05 per-seed eval/report.md path named absolutely), 3 LOW (time budget softened to operator guidance; ac-09 halted branch added; ac-06 halt signal tied to drive.yaml status + ac-03 evidence allows negative-evidence argument). Spec is now advancing to implement via documented protocol deviation — see drive.yaml notes."
