goal: |
  Widen `finance.currency.amount` validation to accept plain bare-decimal values
  (e.g. `1914.96`, `19.95`, `100`, `-50.5`) by composing
  `representation.numeric.decimal_number`'s canonical regex as a 4th alternation
  in the amount union. Demonstrate the fix on the discovery vehicle
  (`eval/datasets/csv/ecommerce_orders.csv`: total_price 63 rejects → 0). Record
  the two misclassification findings (status→periodicity, order_id→SEDOL) as
  deferred-to-retrain and file a follow-up card under the model-improvement
  umbrella. iter-3's row-level fixture lock (MADR 0076) must continue to pass on
  the 12-dataset corpus — no silent attribution drift.

constraints:
  - "Single-file regex change in `labels/definitions_finance.yaml:131` — no taxonomy-shared snippet refactor; YAML doesn't support imports natively."
  - "Reuse `representation.numeric.decimal_number`'s pattern verbatim, including the scientific-notation tail: `^-?[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?$`. No invention, no fork."
  - "No regex header hints (MADR 0042). No new value-based Sharpen rules (MADR 0048's value-based-rules-only directive applies; iter-4 stays at the validator layer)."
  - "`ecommerce_orders.csv` is NOT added to `eval/datasets/validate_manifest.csv` — synthetic, fails MADR 0055 realism floor (sequential `ORD-` IDs, `alice26@outlook.com`, `example.com` URLs)."
  - "iter-3's `vci3_fixture_attribution_regression_match` test must continue to pass — no row-level attribution drift on the 12 corpus datasets. Per MADR 0076, fixture rows whose harness output silently passes validation are forward-looking anchors and don't fail the test."
  - "Misclassifications (status→periodicity, order_id→SEDOL) are recorded as discovery findings in progress.md with diagnostic detail + named fix path; they are NOT addressed by iter-4. A follow-up card is filed."
  - "`make ci` must exit 0; `cargo clippy --all-targets -- -D warnings` clean; `finetype check` (taxonomy ↔ generator alignment) clean."
  - "MADR captures the precedent that validator alternations may compose canonical sibling-type patterns. Comment annotation in the YAML names the source pattern for traceability."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: |
      `finance.currency.amount`'s `validation.pattern` at
      `labels/definitions_finance.yaml:131` gains a 4th alternation, byte-identical
      to `representation.numeric.decimal_number`'s pattern at line 79 of
      `definitions_representation.yaml`: `^-?[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?$`.
      The full amount pattern is the existing 3-alternation union with this
      pattern appended via `|`. A YAML comment immediately above the pattern
      names the source: `# Alternation 4 borrows representation.numeric.decimal_number's canonical bare-decimal regex (definitions_representation.yaml:79). See MADR 0078.`
    verification: |
      `Grep` for the pattern string at `definitions_finance.yaml:131-135`;
      assert byte-identity with the relevant slice of `definitions_representation.yaml:79`.
      Comment line referencing MADR 0078 + sibling source path is present.

  - id: ac-02
    ac_type: code
    description: |
      Regression test `vci4_amount_accepts_bare_decimal` verifies that
      bare-decimal values (`1914.96`, `19.95`, `100`, `-50.5`, `0.99`, `1e6`)
      match the widened `finance.currency.amount` regex.
    verification: |
      `cargo test -p finetype-eval vci4_amount_accepts_bare_decimal` exits 0.

  - id: ac-03
    ac_type: code
    description: |
      Regression test `vci4_amount_preserves_existing_formats` verifies that
      the existing 3 alternations still match: US format (`$1,234.56`,
      `-$999.99`, `£10,000.00`), symbol-required (`-$5.00`), and
      accounting parens (`($1,234.56)`).
    verification: |
      `cargo test -p finetype-eval vci4_amount_preserves_existing_formats` exits 0.

  - id: ac-04
    ac_type: code
    description: |
      Regression test `vci4_amount_rejects_non_money` verifies that the widened
      pattern still rejects clearly-non-amount tokens: `abc`, `1.2.3`, `12px`,
      `1e`, `e5`, empty string. (Same negative cases as
      `decimal_number`'s rejection behaviour.)
    verification: |
      `cargo test -p finetype-eval vci4_amount_rejects_non_money` exits 0.

  - id: ac-05
    ac_type: gate
    description: |
      Demonstration: running `finetype validate eval/datasets/csv/ecommerce_orders.csv
      <schema.json> --db /tmp/iter4-demo.db --table orders` against the schema
      generated by `finetype profile -f eval/datasets/csv/ecommerce_orders.csv -o json-schema`
      shows total_price reject count drop from 63 (iter-3 baseline) to 0.
      Captured as a before/after snippet in progress.md.
    verification: |
      progress.md contains a before/after section quoting the reject summary
      from `finetype_reject_errors` keyed by `total_price`. Before: 63 rejects
      (`SEMANTIC_TYPE`). After: 0 rejects.

  - id: ac-06
    ac_type: gate
    description: |
      iter-3's `vci3_fixture_attribution_regression_match` test continues to
      pass after the regex change. No row-level attribution drift on the
      12-dataset corpus. If FIFA Value/Wage rows (currently
      `code_vs_canonical / path-b-codetype`) silently start passing validation
      under the widened amount regex, per MADR 0076 these rows become
      forward-looking anchors — fixture row preserved, test unaffected.
    verification: |
      `cargo test -p finetype-eval vci3_fixture_attribution_regression_match`
      exits 0. Any silent-pass rows documented in progress.md Findings.

  - id: ac-07
    ac_type: doc
    description: |
      progress.md contains a "Misclassification findings (deferred)" section
      that records, for each of the two non-format-diversity columns:
      (1) the column name and dataset; (2) the GT label; (3) the model's
      predicted label; (4) representative sample values; (5) the trigger
      mechanism (header signal vs value shape vs prefix shape); (6) the
      named fix path (training data widening / generator tightening /
      retrain). Cross-references the follow-up card filed under ac-08.
    verification: |
      progress.md "Misclassification findings (deferred)" section is present
      with two subsections (status, order_id) covering all six required fields.

  - id: ac-08
    ac_type: doc
    description: |
      A follow-up card is filed at `orbit/cards/0015-status-orderid-misclassification.yaml`
      (or the next available NNNN slot if 0015 is already taken when iter-4
      lands) capturing both misclassifications. Card scenarios cover:
      (1) `status` columns whose values are e-commerce/order-state enums
      (shipped, pending, delivered, returned, cancelled) classify as
      `representation.discrete.status` or equivalent, NOT
      `datetime.component.periodicity`; (2) `order_id` columns with
      prefix-shaped values (ORD-12345, INV-99999) classify as
      `identifier.code.order_id` or `representation.discrete.identifier`,
      NOT `finance.securities.sedol`. Card lists this spec as a reference.
    verification: |
      `orbit/cards/0015-*.yaml` (or successor) exists with ≥3 scenarios.
      `references:` array contains `orbit/specs/2026-04-29-validate-corpus-iter4/spec.yaml`.
      `feature:`, `as_a:`, `i_want:`, `so_that:` all populated.

  - id: ac-09
    ac_type: doc
    description: |
      MADR 0078 (or next available index) accepted, dated 2026-04-29, titled
      "Validator alternations may compose canonical sibling-type patterns".
      Records the precedent: when widening a validator's regex, prefer
      composing the canonical pattern of a sibling type (here:
      `decimal_number` → `amount`) over inventing a new alternation. Names
      the constraint: comment annotation in YAML must reference the source
      sibling type's path + line number for traceability.
    verification: |
      `orbit/decisions/0078-*.md` exists, status: accepted, date-created: 2026-04-29.
      Decision Outcome section names `decimal_number → amount` as the
      load-bearing precedent.

  - id: ac-10
    ac_type: doc
    description: |
      `CHANGELOG.md [Unreleased]` gains an iter-4 entry naming the amount
      regex widening, the reused canonical pattern, and the deferred
      misclassifications. `CLAUDE.md` "Recent work" section gains an
      iter-4 line; "What's next" refreshes to consolidate the validate-corpus
      arc as a 4-iteration sequence with 7 MADRs (0072–0078). Card 0014
      `specs[]` array gains the iter-4 spec path.
    verification: |
      `git diff main` shows: CHANGELOG.md [Unreleased] entry, CLAUDE.md
      Recent-work and What's-next updates, card 0014 specs[] append.

  - id: ac-11
    ac_type: gate
    description: |
      `make ci` exits 0. ≥3 net new `vci4_*` tests pass (per ac-02/03/04).
      `cargo clippy --all-targets -- -D warnings` clean. `finetype check`
      taxonomy alignment clean (240 definitions or current count;
      no new alignment failures introduced).
    verification: |
      `make ci` returns exit 0 in a clean clone of the branch.

implementation_notes:
  - "Implementation order: ac-01 (regex change + comment) → ac-02/03/04 (tests) → ac-05 (demo capture) → ac-06 (iter-3 fixture re-run) → ac-07 (progress.md findings) → ac-08 (follow-up card) → ac-09 (MADR 0078) → ac-10 (CHANGELOG/CLAUDE.md/card-spec-array) → ac-11 (make ci gate)."
  - "Test home: append to existing `mod amount_widening_tests` (new) or `mod attribute_tests` in `crates/finetype-eval/src/bin/validate_corpus.rs`. Test prefix `vci4_`."
  - "Demo recipe (ac-05): `cargo run -p finetype-cli -- profile -f eval/datasets/csv/ecommerce_orders.csv -o json-schema > /tmp/iter4-schema.json && cargo run -p finetype-cli -- validate eval/datasets/csv/ecommerce_orders.csv /tmp/iter4-schema.json --db /tmp/iter4-demo.db --table orders && duckdb /tmp/iter4-demo.db 'SELECT column_name, COUNT(*) FROM finetype_reject_errors GROUP BY column_name ORDER BY 2 DESC'`."
  - "iter-3 fixture re-run (ac-06): `make validate-corpus` regenerates `eval/eval_output/validate_corpus.md`; then `cargo test -p finetype-eval vci3_fixture_attribution_regression_match`. If FIFA Value/Wage now silently pass validation, MADR 0076 silent-preservation behaviour applies — note in progress.md Findings, no fixture edit needed."
  - "Follow-up card naming (ac-08): suggested slug is `status-orderid-misclassification` under index 0015. Card slots under model-improvement umbrella; references this spec; ≥3 scenarios per drive-quality-gate convention."
  - "MADR 0078 framing: the load-bearing claim is *composition over invention*. List `decimal_number → amount` as the iter-4 instance. Cross-reference MADRs 0042 (regex header hints deprecated), 0048 (value-based rules only) as the bracketing constraints — the validator layer is where bare-decimal money widening belongs."
  - "Card 0014 specs[] update: append `orbit/specs/2026-04-29-validate-corpus-iter4/` (note: directory path with trailing slash, matches iter-1/2/3 convention)."

ontology_schema:
  name: "AmountValidationWidening"
  description: "The single load-bearing change of iter-4: a 4-alternation amount regex composed from one canonical sibling-type pattern."
  fields:
    - name: "source_pattern_path"
      type: "string"
      description: "Where the borrowed canonical pattern lives — `definitions_representation.yaml:79`."
    - name: "target_pattern_path"
      type: "string"
      description: "Where the alternation lands — `definitions_finance.yaml:131`."
    - name: "borrowed_pattern"
      type: "string"
      description: "The byte-identical regex: `^-?[0-9]+(\\.[0-9]+)?([eE][+-]?[0-9]+)?$`."
    - name: "comment_annotation"
      type: "string"
      description: "YAML comment naming source path + MADR reference for traceability."
    - name: "demo_dataset"
      type: "string"
      description: "`eval/datasets/csv/ecommerce_orders.csv` — synthetic, NOT corpus-eligible per MADR 0055."
    - name: "demo_metric"
      type: "string"
      description: "total_price reject count: 63 → 0."
    - name: "fixture_lock_invariant"
      type: "string"
      description: "iter-3's `vci3_fixture_attribution_regression_match` continues to pass; silent-pass rows preserved per MADR 0076."

evaluation_principles:
  - principle: "Composition over invention"
    weight: 0.40
    description: "The widening reuses an existing canonical pattern verbatim. Quality dimension: byte-identity verification + comment traceability."
  - principle: "Validator-layer scope"
    weight: 0.25
    description: "The fix lives at the validator. No header hints (MADR 0042), no value-based Sharpen rules (MADR 0048 deferral), no model retrain. Quality dimension: change scoped to one YAML file."
  - principle: "Anti-regression discipline"
    weight: 0.25
    description: "iter-3 fixture lock + new vci4_* tests gate the change. Quality dimension: existing 12-dataset corpus shows no row-level attribution drift; sibling alternations still match expected formats."
  - principle: "Honest deferral"
    weight: 0.10
    description: "Misclassifications (status, order_id) recorded with diagnostic detail; follow-up card filed. Quality dimension: progress.md findings + card 0015 (or successor) shipped alongside iter-4."

exit_conditions:
  - "All 11 ACs verified."
  - "`make ci` exit 0."
  - "iter-3 `vci3_fixture_attribution_regression_match` continues to pass."
  - "MADR 0078 accepted, dated 2026-04-29."
  - "Follow-up card filed for status/order_id misclassifications."
  - "PR opened against main with description referencing this spec."

