goal: >
  Tighten the public CLI surface for v0.6.19 in a single hard-removal pass:
  hide two maintainer-only subcommands (`check`, `generate`); remove three
  user-visible surfaces outright (`eval-gittables` subcommand, `--sharp-only`
  flag with all dead gate code, `--model` flag in favour of FINETYPE_MODEL);
  tighten one wire format (schema export drops derivable `x-finetype-*` fields,
  keeping only `label` and `pii`); relax one flag pair (`validate --db/--table`
  optional-but-mutually-required). Document the public-vs-internal CLI
  stability tier in CLAUDE.md so the hide-in-clap mechanism has explicit
  semantics. The schema-verb fold and load→validate consolidation are
  out of scope — they ship in the pipeline-reshape spec (v0.6.20).
  `--model-type` and the legacy classifier code paths are deferred to a
  separate spec (memo `2026-04-27-delete-legacy-classifiers.md`).

constraints:
  - "Hard removal posture — no deprecation cycle. Removed flags/subcommands error immediately via clap's unknown-arg/unknown-subcommand handling. Scripts pinning old surfaces fail loudly rather than drift silently."
  - "Internal callers must continue working. `make ci` (uses `finetype check`), training data prep (uses `finetype generate`), sweep wrappers (use `finetype train`), and `scripts/eval.sh` (uses `finetype eval`) all keep working — these subcommands are hidden, not removed."
  - "Every locus that passes `--model <path>` to the finetype binary MUST be migrated to export `FINETYPE_MODEL=<path>` in the same PR. Authoritative migration list (verified by grep, v1.1): `eval/profile_eval.sh:115` (the eval engine — primary path); `scripts/v19_compare.sh:91`; `scripts/sharpen_ablation.sh:66, 70`; `scripts/amvg/ac03_confusion.py:51`; `scripts/amvg/ac07_post_fix.py:62`; `scripts/rhh/ac03_hit_counts.py:123`; `scripts/rhh/ac04_counterfactual.py:199`; `scripts/rhh/test_rhh.py:340`. Out of scope (do NOT touch — these `--model` are NOT passed to the finetype binary): `scripts/distill_batches.sh:149` (claude CLI), `scripts/llm_label.py:51` and `scripts/llm_label.sh` (Ollama), `scripts/train.sh` (`--model-name` is a different flag — script's own output-dir name), `scripts/eval.sh:42` (its own `--model` script arg — swaps the `models/default` symlink, never invokes `finetype --model`), all `scripts/overnight_v*.sh` (they pass `--model` to `./scripts/eval.sh`, not directly to finetype)."
  - "MCP server is out of scope. MCP's `schema` tool stays verbose for v0.6.19 — it dies entirely in pipeline-reshape (v0.6.20) when `taxonomy` and `profile` absorb json-schema output."
  - "Schema verb consolidation (type-mode → taxonomy, table-mode → profile) is out of scope. The schema verb still exists in v0.6.19; only its export verbosity changes."
  - "`load` subcommand stays public in v0.6.19 — load→validate consolidation is deferred to pipeline-reshape (v0.6.20). `load` continues to appear in `--help` and is not modified by this spec."
  - "`--model-type` flag and the legacy classifier code paths (SenseClassifier, TieredClassifier, CharClassifier — ~2,500–3,500 LOC across finetype-model + finetype-cli) are deferred. Touching them here would triple the diff and entangle two release themes. Memo `orbit/memos/2026-04-27-delete-legacy-classifiers.md` captures the follow-up scope."
  - "Doc refresh (README, full CLAUDE.md command-table audit, docs/* sweep) is a follow-up PR, not part of this spec. The minimum CLAUDE.md updates that ship here are: (a) public-vs-internal stability tier paragraph, (b) command table refreshed for the surfaces this spec changes."
  - "Changes confined to: crates/finetype-cli/src/main.rs (CLI subcommand defs + the schema emitter at lines 2744-2760 type-mode and 2987-3015 table-mode), CLAUDE.md, the migration scripts named above, and tests. No model-crate edits. No MCP edits — `crates/finetype-mcp/src/tools/schema.rs:65-279` is intentionally left verbose (interview Q5: MCP schema tool dies in pipeline-reshape, no investment now)."
  - "Hide mechanism is `#[command(hide = true)]` on the clap subcommand definition — same attribute already in use for `train`, `eval`, `eval-gittables`. Consistency over invention."
  - "Schema verbosity reduction edits the JSON Schema emitter once. Both schema modes (type-mode and table-mode) inherit the change in v0.6.19; `taxonomy KEY -o json-schema` and `profile -f file -o json-schema` inherit it after pipeline-reshape."

acceptance_criteria:
  - id: AC-1
    description: >
      `finetype check` is hidden from `--help` but remains callable. The
      subcommand definition in `crates/finetype-cli/src/main.rs` (around
      `main.rs:274`) gains `#[command(hide = true)]`. `finetype check`
      continues to validate taxonomy↔generator alignment with identical
      output and exit code; only its visibility changes. `make ci` passes
      unchanged.
    verification: >
      `finetype --help` does not list `check` in its subcommand table.
      `finetype check --help` works (hidden subcommands still respond to
      explicit help). `cargo run --bin finetype -- check` returns exit 0
      with the same output as before. `make ci` green.

  - id: AC-2
    description: >
      `finetype generate` is hidden from `--help` but remains callable.
      Same `#[command(hide = true)]` treatment as AC-1. The MCP `generate`
      tool is the public surface for synthetic data generation — the CLI
      subcommand stays available for training-data prep scripts. Card
      0010 already reflects this split (MCP tool = public, CLI subcommand
      = maintainer-internal).
    verification: >
      `finetype --help` does not list `generate`. `finetype generate
      --help` works. Existing scripts that invoke `finetype generate ...`
      run unchanged. Grep confirms training-data prep callers
      (scripts/prepare_multibranch_data.py and any sibling scripts) still
      function.

  - id: AC-3
    description: >
      `finetype eval-gittables` subcommand is removed entirely from the
      CLI. Note: this subcommand is already `#[command(hide = true)]`
      today (`main.rs:382`) — it does not appear in `--help` output —
      so the user-visible change is that explicit invocation
      (`finetype eval-gittables ...`) now errors via clap's
      unknown-subcommand handler instead of silently running a dead
      handler. The variant in the `Commands` enum (around `main.rs:383`)
      and the dispatch arm (around `main.rs:743`) are deleted, along
      with any `cmd_eval_gittables` function exclusive to it. The
      standalone binary at
      `crates/finetype-eval/src/bin/eval_gittables_cli.rs` remains
      untouched — Makefile invokes it directly via `cargo run --bin
      eval-gittables-cli`.
    verification: >
      `finetype eval-gittables` exits non-zero with clap's unknown-
      subcommand message. `make eval-gittables` (or whichever target
      drives GitTables eval) still works because it uses the standalone
      binary. Grep across .sh, .py, Makefile, .yml, .yaml confirms zero
      remaining references to the subcommand variant. `cargo build`
      succeeds with no dead-code warnings related to removed handlers.
      Note: `--help` diff is NOT a verification path here — the
      subcommand was already hidden, so its absence from `--help` is
      pre-existing.

  - id: AC-4
    description: >
      `--sharp-only` flag is removed from every subcommand that accepts
      it, and all dead gate code that depended on it is collapsed. The
      `sharp_only: bool` parameter is removed from the 12+ call sites in
      `crates/finetype-cli/src/main.rs` (lines ~90, 255, 365, 574, 588,
      679, 692, 725, 737, 1313, 1713, 3159, 4142). The 4 gate sites
      (~1482, ~1772, ~3213, ~4199) drop the always-false `if !sharp_only
      && !column_classifier.has_multi_branch()` branch. The alternative
      pipeline branch at ~`main.rs:3330` (`let pipeline = if sharp_only`)
      collapses to the multi-branch path. After cleanup, `finetype
      <verb> --sharp-only` errors via clap's unknown-arg handler.
    verification: >
      `finetype profile -f data.csv --sharp-only` exits non-zero with
      clap's unknown-arg error. `cargo build` shows no warnings about
      unused parameters or unreachable branches. `cargo test` passes.
      `make ci` green. Profile eval (`./scripts/eval.sh`) returns the
      same 369/448 score as today, confirming the multi-branch path is
      unaffected.

  - id: AC-5
    description: >
      `--model` flag is removed from every subcommand that accepts it.
      Eight loci that previously passed `--model "$PATH"` to the
      finetype binary are migrated to export `FINETYPE_MODEL="$PATH"`
      (or inline `FINETYPE_MODEL="$PATH" finetype ...`) before invoking
      the CLI:
      (1) `eval/profile_eval.sh:115` — the eval engine, primary path
      driven by `make eval-profile` and transitively by `scripts/eval.sh`;
      (2) `scripts/v19_compare.sh:91`;
      (3) `scripts/sharpen_ablation.sh:66`;
      (4) `scripts/sharpen_ablation.sh:70`;
      (5) `scripts/amvg/ac03_confusion.py:51`;
      (6) `scripts/amvg/ac07_post_fix.py:62`;
      (7) `scripts/rhh/ac03_hit_counts.py:123`;
      (8) `scripts/rhh/ac04_counterfactual.py:199` (also update the
      argparse default at line 268 — keep the script's own `--model`
      arg for ergonomics, just don't forward it as `--model` to
      finetype);
      (9) `scripts/rhh/test_rhh.py:340`.
      `scripts/eval.sh`, `scripts/train.sh`, `scripts/distill_batches.sh`,
      `scripts/llm_label.py`, `scripts/llm_label.sh`, and the
      `scripts/overnight_v*.sh` family are explicitly NOT in scope —
      their `--model` flags either belong to non-finetype tools (claude,
      Ollama) or are script-internal flags that don't reach the
      finetype binary. The CLI's existing `FINETYPE_MODEL` env-var
      reader (already documented in CLAUDE.md's env-var table) becomes
      the single way to override the default model path. After removal,
      `finetype <verb> --model <path>` errors via clap's unknown-arg
      handler.
    verification: >
      `finetype profile -f data.csv --model models/sherlock-v19-relu-s42`
      exits non-zero with clap's unknown-arg error.
      `FINETYPE_MODEL=models/sherlock-v19-relu-s42 finetype profile -f
      data.csv` runs against the specified model.
      `FINETYPE_MODEL=models/sherlock-v19-relu-s42 make eval-profile`
      runs end-to-end through `eval/profile_eval.sh` and produces a
      report. Each Python diagnostic script under scripts/rhh/ and
      scripts/amvg/ that was migrated runs at least one
      smoke-invocation. Grep across all migrated files for
      `"--model"` (with a finetype binary on the same command line) shows
      zero remaining occurrences. Out-of-scope `--model` references
      (claude, Ollama, script-internal) remain present.

  - id: AC-6
    description: >
      Schema export verbosity is reduced. The JSON Schema emitter in
      the CLI is in TWO codepaths in `crates/finetype-cli/src/main.rs`,
      both of which must drop the derivable fields:
      (a) Type-mode emitter at `main.rs:2744-2760` — single property,
          edits a `BTreeMap` named `schema`.
      (b) Table-mode emitter at `main.rs:2987-3015` — known-label
          branch (~2987-3004) and unknown-label branch (~3008-3015),
          edits a `BTreeMap` named `prop` per column.
      Fields to drop in both codepaths: `x-finetype-confidence`,
      `x-finetype-domain`, `x-finetype-broad-type`, `x-finetype-transform`,
      `x-finetype-transform-ext`, `x-finetype-format-string`. The
      emitter retains only: `x-finetype-label` (the type key — primary
      identifier) and `x-finetype-pii` (security-relevant flag, not
      derivable from the label alone). All dropped fields remain
      reachable via `finetype taxonomy <KEY>` (plain or json output).
      Both `finetype schema KEY` and `finetype schema <file.csv>` emit
      the lean shape. The MCP duplicate emitter at
      `crates/finetype-mcp/src/tools/schema.rs:65-279` is intentionally
      NOT modified (interview Q5 — MCP schema tool dies in
      pipeline-reshape v0.6.20). Downstream impact: the validate path
      reads `x-finetype-label` and `x-finetype-confidence` from input
      schemas (`crates/finetype-core/src/table_validator.rs:80-86`,
      `crates/finetype-cli/src/main.rs:3701, 3705`); after this change,
      `type_confidence` in `finetype_reject_errors` will be NULL for
      schemas emitted by v0.6.19+ `finetype schema`. Pre-existing
      schemas with `x-finetype-confidence` continue to populate the
      column (the read-side parser already handles missing fields
      gracefully — see `validate_cli.rs:373`).
    verification: >
      Run `finetype schema identity.person.email --stdout` (positional
      type-key form) and `finetype schema
      eval/datasets/csv/ecommerce_orders.csv --stdout` (positional
      file-path form, table mode via path-sniffer). Output contains
      `x-finetype-label` and `x-finetype-pii` where applicable; does
      NOT contain `x-finetype-confidence`, `x-finetype-domain`,
      `x-finetype-broad-type`, `x-finetype-transform`,
      `x-finetype-transform-ext`, `x-finetype-format-string`. Existing
      schema-shape tests updated to assert the new lean shape. Add a
      `vrp_*` test that round-trips `finetype schema <csv> | finetype
      validate <csv> <schema>` and asserts validate's
      `finetype_reject_errors.type_confidence` is NULL across all rows.
      CHANGELOG entry: "Schema export drops derivable `x-finetype-*`
      fields (kept: label, pii). Consumers needing dropped fields
      should query `finetype taxonomy <KEY> --output json`. As a
      consequence, `finetype validate`'s `type_confidence` column is
      NULL for schemas emitted by v0.6.19+; pre-existing schemas with
      `x-finetype-confidence` continue to populate it."

  - id: AC-7
    description: >
      `finetype validate` flag pair `--db`/`--table` becomes optional-but-
      mutually-required. The current command shape (per CLAUDE.md and
      `main.rs:302-331`) takes `<file> <schema>` as positional
      arguments — this stays unchanged. clap `requires` on each flag
      pointing at the other enforces that supplying one without the
      other errors at parse time. When both are absent, validate runs
      in check-only mode — performs the validation pass via
      `finetype-core::table_validator` and reports valid/invalid counts
      to stdout, but writes no `.db` file. When both are present,
      behaviour is identical to today (typed table +
      `finetype_reject_errors` sidecar written to the named `.db`).
      Sub-criteria for check-only mode:
      (a) `--output {plain,json}` is honoured — same shapes the
          current full-pair flow produces, just without the .db path
          line.
      (b) `--lenient` still forces exit 0 in check-only mode (rejects
          counted but exit code suppressed).
      (c) `--append` without `--db` errors via clap's existing
          requires-relationship semantics (`--append` already requires
          `--db` today; that constraint is preserved).
    verification: >
      `finetype validate data.csv schema.json` (positional file +
      schema, no --db/--table) runs to completion, prints valid/invalid
      counts, exits 0 (no rejects) or 1 (rejects).
      `finetype validate data.csv schema.json --db out.db` errors
      with clap's "the following required arguments were not provided:
      --table". Same with `--table` only.
      `finetype validate data.csv schema.json --append` errors with
      clap's "--append requires --db".
      `finetype validate data.csv schema.json --lenient` (check-only +
      lenient) exits 0 even when rejects > 0.
      `finetype validate data.csv schema.json -o json` emits the JSON
      summary shape on stdout.
      Both flags together reproduces the v0.6.18 behaviour
      byte-for-byte (same tables, same row counts, same reject-error
      rows). Add `vrp_*` integration tests covering: check-only mode
      (plain + json output), check-only + lenient, half-pair rejection
      (both directions), append-without-db rejection,
      full-pair behaviour-preservation.

  - id: AC-8
    description: >
      CLAUDE.md gains a "Public vs internal CLI surface" section
      documenting the stability tier. Public commands (`infer`, `profile`,
      `validate`, `mcp`, `taxonomy`, plus `schema` until v0.6.20) are
      semver-stable — breaking changes ship with major version bumps and
      migration notes. Internal commands (`check`, `generate`, `train`,
      `eval`) are maintainer-only, hidden from `--help`, may break across
      minor versions without notice. End users are pointed at the MCP
      `generate` tool or the Python `faker` library for production
      synthetic-data needs. The CLAUDE.md command table is refreshed to
      reflect the surfaces this spec changes (entries for `--sharp-only`,
      `--model`, `eval-gittables`, schema verbosity removed/updated;
      validate flag-pair semantics noted).
    verification: >
      `grep -A 10 "Public vs internal CLI surface" CLAUDE.md` returns
      the new section. The CLAUDE.md command table no longer mentions
      `--sharp-only` or `--model`; `eval-gittables` row is gone; schema
      and validate rows reflect the new behaviour. A reviewer can locate
      "what's hidden vs what's public" in under 30 seconds of searching
      CLAUDE.md.

  - id: AC-9
    description: >
      All existing tests pass after the surface changes. `cargo test`
      (workspace) green. `cargo test -p finetype-cli --test cli_golden
      -- --ignored` (golden integration) green — golden snapshots that
      reference removed flags or the old schema shape are updated as
      part of this PR. `make ci` (fmt + clippy + test + check) green.
      Profile eval (`./scripts/eval.sh`) score on the PR branch matches
      `main` HEAD's score within ±0 (deterministic) — the underlying
      invariant is "this PR doesn't change what the model predicts,"
      not a numeric pin (the baseline shifts with model promotions).
    verification: >
      CI run on the PR branch shows all jobs green. Local `make ci`
      green. Capture `./scripts/eval.sh` score on `main` HEAD and on
      the PR branch — they match exactly. If they don't, the PR has
      introduced an unintended pipeline change and must be
      investigated before merge.

  - id: AC-10
    description: >
      `finetype --help` shows exactly the public surface intended for
      v0.6.19: `infer`, `profile`, `schema`, `validate`, `load`, `mcp`,
      `taxonomy`. Note: `load` stays public this release — its
      consolidation into `validate` is deferred to pipeline-reshape
      (v0.6.20). Hidden subcommands (`check`, `generate`, `train`,
      `eval`, `eval-gittables` until removed by AC-3) are absent from
      the listing. The help output for surviving public verbs no longer
      lists `--sharp-only` or `--model`.
    verification: >
      Run `finetype --help` and capture the subcommand listing. Diff
      against the v0.6.18 help output. Expected diff (v0.6.18 → v0.6.19):
      `check` no longer listed (newly hidden); `generate` no longer
      listed (newly hidden); `train`, `eval`, `eval-gittables` already
      hidden in v0.6.18 (no diff); `load`, `infer`, `profile`, `schema`,
      `validate`, `mcp`, `taxonomy` continue to be listed. Run
      `finetype profile --help`, `finetype validate --help`,
      `finetype schema --help`, `finetype load --help` — none list
      `--sharp-only` or `--model`. Snapshot the new help outputs as
      golden files for regression protection.

implementation_notes:
  - "`#[command(hide = true)]` is the same attribute used for `train`, `eval`, `eval-gittables` today (verified: `eval-gittables` is at `main.rs:382`, already hidden) — see the existing definitions and follow the pattern. No changes to dispatch logic needed for hidden subcommands; they run identically, just absent from `--help`."
  - "`--sharp-only` cleanup is mechanical: drop the param at every signature, drop the dead gate code at the 4 evaluation sites, collapse the alternative pipeline branch at `main.rs:3330`. The gate `if !sharp_only && !column_classifier.has_multi_branch()` is always false in production — multi-branch is always present (decision 0041)."
  - "`--model` migration pattern in scripts: replace `--model \"$MODEL_PATH\"` with `FINETYPE_MODEL=\"$MODEL_PATH\"` exported before the CLI call, OR inlined as `FINETYPE_MODEL=\"$MODEL_PATH\" finetype <verb> ...`. Pick whichever matches existing script style. Pre-existing FINETYPE_MODEL exports take precedence — verify each script doesn't already export it for an unrelated reason. For `eval/profile_eval.sh:115`, the existing `MODEL_FLAGS` shell var construction can be replaced with an `export FINETYPE_MODEL=\"$FINETYPE_MODEL\"` and removal of the `--model` argument from the finetype invocation a few lines down."
  - "Schema emitter is NOT a single point of edit. Two codepaths in `crates/finetype-cli/src/main.rs`: type-mode emitter at lines 2744-2760 (single property branch), table-mode emitter at lines 2987-3015 (known-label branch ~2987-3004 + unknown-label branch ~3008-3015). Both edit `BTreeMap` collections (`schema` and `prop` respectively). Drop the same 6 fields in both — `x-finetype-confidence`, `x-finetype-domain`, `x-finetype-broad-type`, `x-finetype-transform`, `x-finetype-transform-ext`, `x-finetype-format-string`. Keep `x-finetype-label` and `x-finetype-pii`. The MCP duplicate at `crates/finetype-mcp/src/tools/schema.rs:65-279` is intentionally NOT modified (interview Q5)."
  - "Validate flag-pair: clap supports `requires` and `requires_all` attributes. The pattern is `#[arg(long, requires = \"table\")] db: Option<PathBuf>` and `#[arg(long, requires = \"db\")] table: Option<String>`. Both Optional, both pointing at the other. When both None → check-only mode; when both Some → existing typed-table + reject-sidecar flow. The validate command takes `<file> <schema>` as positional args (CLAUDE.md line 183, `main.rs:302-331`) — those are NOT changing in this spec, only the `--db`/`--table` constraint."
  - "eval-gittables subcommand removal — sanity-check there's no `cmd_eval_gittables` function shared with the standalone binary. The standalone is at `crates/finetype-eval/src/bin/eval_gittables_cli.rs` and links its own logic; the subcommand handler in `finetype-cli` is independent. Delete the variant + dispatch arm + handler function."
  - "CLAUDE.md command-table refresh: the `finetype schema`, `finetype validate`, and any `--sharp-only`/`--model` references need a single-pass edit. Don't try to refresh the full README/docs/* in this PR — that's the follow-up doc-refresh scope."
  - "Stability-tier doc could go in CLAUDE.md (suggested above), CONTRIBUTING.md, or docs/INTERNAL_API.md. Pick CLAUDE.md — it's where the env-var disambiguation table already lives, so the audience overlap is exact."
  - "Decision capture: the schema-verb-folds-entirely decision (settled in interview Q1) belongs in a MADR. Author may record now under this spec OR with the pipeline-reshape spec where it actually ships. Recommendation: record now (`decisions/<NNNN>-schema-verb-folds-entirely.md`), link from both specs."
  - "Hard-removal vs deprecation tradeoff (interview Q2): the choice was hard removal. Scripts pinning the old shape get an explicit clap error. This is recoverable (the error message is clear, the migration is one-line) and avoids a parallel-maintenance window. Recorded in this spec's constraints; not a standing architectural MADR."

ontology_schema:
  name: "CliSurfaceCleanup"
  description: "What changes on the public CLI surface in v0.6.19, with explicit hide-vs-remove-vs-defer disposition"
  fields:
    - name: "subcommand"
      type: "string"
      description: "CLI subcommand or flag affected (e.g. 'check', 'eval-gittables', '--sharp-only')"
    - name: "disposition"
      type: "string"
      description: "One of: HIDE (clap hide attribute, callable), REMOVE (deleted, errors via clap), DEFER (kept as-is, separate spec)"
    - name: "rationale"
      type: "string"
      description: "Why this disposition — HIDE if internally used, REMOVE if no callers or env-var supersedes, DEFER if entanglement too large for this spec"
    - name: "internal_callers"
      type: "array"
      description: "Scripts/Makefile targets/CI jobs that depend on this surface (informs HIDE vs REMOVE)"
    - name: "migration_required"
      type: "boolean"
      description: "Does this disposition require migrating internal callers (true for --model → FINETYPE_MODEL)"
    - name: "deferred_to"
      type: "string"
      description: "If DEFER, the memo or follow-up spec capturing the entanglement"

evaluation_principles:
  - principle: "Tight public surface — `finetype --help` shows only what end users should call"
    weight: 0.30
  - principle: "No silent breakage of internal workflows — make ci, sweep scripts, training data prep all keep working"
    weight: 0.25
  - principle: "Hard removal beats deprecation here — scripts pinning old surfaces fail loudly with clear clap errors, no parallel-maintenance window"
    weight: 0.15
  - principle: "Stability tier explicit — public vs internal documented in CLAUDE.md so the hide-in-clap mechanism has stated semantics"
    weight: 0.15
  - principle: "Surgical scope — schema verb fold, MCP changes, --model-type cleanup, full doc refresh all deferred to keep the diff reviewable"
    weight: 0.15

exit_conditions:
  - "`finetype check` and `finetype generate` hidden from --help, callable for internal scripts (AC-1, AC-2)"
  - "`finetype eval-gittables` subcommand removed; standalone binary untouched (AC-3)"
  - "`--sharp-only` flag and all dead gate code removed; multi-branch path is the only path (AC-4)"
  - "`--model` flag removed; 4 internal scripts migrated to FINETYPE_MODEL env var (AC-5)"
  - "Schema export emits only x-finetype-label and x-finetype-pii; 5 derivable fields dropped (AC-6)"
  - "validate --db/--table optional-but-mutually-required; check-only mode runs without --db (AC-7)"
  - "CLAUDE.md documents public-vs-internal stability tier; command table refreshed for changed surfaces (AC-8)"
  - "All tests pass; make ci green; profile eval baseline preserved (AC-9)"
  - "`finetype --help` shows the intended v0.6.19 public surface; help golden snapshots updated (AC-10)"

