goal: >
  Build a profile→validate round-trip precision harness that runs over a
  real-world corpus of whole CSVs, reports `N of M datasets pass at P=99%`,
  and attributes every failing column to one of four named mechanisms.
  Ship the harness mechanics + a 7-CSV iter-1 corpus (sourced fresh from
  public open-data URLs, disjoint from the m-19 eval corpus) + the two
  in-scope fixes (enum-overfit on the profile side, ≤5 validator
  widenings on the taxonomy side). Sourcing beyond 7 datasets toward the
  30–50-CSV target is a separate curation sprint (stub card 0015) that
  consumes the harness this iteration delivers. Misclassification and
  code-vs-canonical defer to follow-up cards.

constraints:
  - "The validate-precision corpus is a fresh-build corpus of whole real-world CSVs distinct from the m-19 column-level eval corpus. m-19's METHODOLOGY (sources.yaml provenance schema, MADR 0055 realism floors, row-hash leakage firewall) is reused; m-19's DATA (`eval/datasets/manifest.csv` rows, the synthetic coverage CSVs `coverage_closure_phase_ab.csv` / `new_*.csv` / `representation_coverage.csv` etc.) is NOT reused. The validate corpus has its own manifest, its own sources.yaml entries, and its own row hashes."
  - "Iteration 1's corpus is 7 datasets, sourced fresh from public open-data URLs and committed to the repo at `eval/datasets/validate_corpus/csv/<name>.csv` (a directory distinct from `eval/datasets/csv/`, which stays as m-19 eval data). The 7 datasets exercise all four mechanisms and were verified non-colliding against the existing 35 eval CSVs: pokemon (801 rows — categorical-heavy: `Type 1`, `Type 2`, `Generation`, `Legendary`; stresses enum-overfit fix), rio2016_athletes (10k rows → cap 5000 — `nationality` 3-letter NOC codes hit code-vs-canonical, `date_of_birth` ISO datetime, `height`/`weight` decimals, medal columns small integers), us_baby_names (258k rows → cap 5000 — `year` integer, `name` text, `percent` decimal, `sex` boy/girl categorical), co2_emissions_by_nation (18k rows → cap 5000 — `Country` uppercase non-canonical names hit code-vs-canonical, `Year` integer, fuel breakdowns decimals), world_population (17k rows → cap 5000 — `Country Code` ISO 3166-1 alpha-3, `Year` integer, `Value` integer; control with canonical codes), un_locode (116k rows → cap 5000 — `Country` alpha-2 codes, `Date` `yyMM` short-form datetime hits format-diversity, `Coordinates` `DDMMNS DDDMMEW` geo format hits format-diversity, `IATA` 3-letter codes, `Status`/`Function` low-cardinality categoricals), global_temp_annual (320 rows — `Source` 2-value enum, `Year` integer, `Mean` decimal; clean control). Each dataset's row count is capped at 5000 rows in the iter-1 commit via deterministic head-sampling (preserves header + first 5000 data rows); the harness accepts un-capped data when the manifest points at it."
  - "Sourcing beyond 7 datasets to reach the 30–50 target is OUT OF SCOPE for iteration 1. A follow-up card (created in this iteration as a stub at `orbit/cards/0015-validate-corpus-curation.yaml`) tracks that work. The harness this iteration ships accepts new datasets via PR-only manifest edits — no harness code change is needed to grow the corpus."
  - "Per-dataset pass threshold is P=99% (≥99% of rows valid → dataset passes). The headline number is `N of M datasets pass at P=99%`. Multi-threshold reporting (P=95%, P=90%) is permitted as supplementary output but P=99% is the headline."
  - "Mechanism attribution is deterministic: a per-column `mechanism` is computed from (MADR 0071 reject ontology fields: error_type, constraint_failed) ∪ (per-column GT label comparison). The attribution table is part of the spec (see ontology_schema). The harness does NOT use heuristics — every failing column gets exactly one mechanism or `unknown` (with `unknown` count tracked as a quality signal)."
  - "Ground-truth sidecar format is YAML at `eval/datasets/validate_corpus/<name>.gt.yaml` with a single key `columns` mapping `column_name → expected_label`. Iteration 1 ships sidecars for ALL 7 corpus CSVs (the corpus is small enough that full GT coverage is the right policy — `no_gt` becomes a forward-looking mechanism for future curation). ac-04 names the 7 sidecars."
  - "Infrastructure reuse: validate-corpus CSVs are registered in `eval/datasets/sources.yaml` with `role: validate` (extending the existing `role: eval` mechanism). Per-column MADR 0055 realism floors apply to validate-corpus columns. The row-hash leakage firewall (`scripts/eval_leakage/__init__.py`) is extended so validate-corpus CSV rows count as forbidden in training data."
  - "Sources.yaml schema extension is additive only: the `role` field already exists with values `eval`. Validate-corpus rows add `validate` as a permitted value. Existing `role: eval` rows are not modified."
  - "`make validate-corpus` is the harness entry point. The harness output goes to `eval/eval_output/validate_corpus.md` (per-dataset table + corpus headline + per-mechanism breakdown). `make eval-report` is extended to invoke the harness and surface the headline alongside profile-eval and actionability-eval."
  - "No new public CLI surface — `finetype validate-corpus` is NOT added. The harness shells the existing `finetype profile -o json-schema` and `finetype validate` binaries."
  - "No CI gate this iteration. The harness is local-run-only; CI integration waits until the score stabilises (deferred to a follow-up card)."
  - "In-scope fix 1 (enum-overfit, profile-side): the `--enum-threshold` flag in `finetype profile` (single flag controlling enum emission across all output formats per spec `2026-04-28-profile-json-schema-output/`) has its default lowered from 50 → 32. The existing label-family gate at `crates/finetype-cli/src/main.rs:3345` (label must equal `representation.discrete.categorical` for an enum to be emitted) is unchanged — this iteration tightens the cardinality side only. With 32 as the default, a column labelled `representation.discrete.categorical` with 33 distinct values gets no `enum`; below 32 it does (preserving the categorical case). Users can still override with `--enum-threshold N` for both higher and lower values; the spec change is the default. The 32 figure is fixed by this constraint and not tunable by the implementer without amendment."
  - "In-scope fix 2 (validator format-diversity, taxonomy-side): the taxonomy YAMLs `labels/definitions_*.yaml` gain widened validators ONLY for the specific gaps surfaced by the iteration-1 baseline (which the implementer measures, not pre-judges). Each widening is a one-line YAML edit + a regression test in `crates/finetype-core/tests/` proving the precision principle (MADR 0001) is honoured — the widened validator must still REJECT clearly invalid input. ac-09 names the bound: ≤5 type widenings in iteration 1; further widenings ship under follow-up cards."
  - "Deferred mechanisms (misclassification, code-vs-canonical) are surfaced in the report but receive NO fixes this iteration. The harness's per-mechanism breakdown counts them and names them; the spec does not target them."
  - "MADR records ship in this iteration: 0072 (round-trip pass as the validate metric), 0073 (validate-corpus reuses m-19 infrastructure), 0074 (in-scope vs deferred fix mechanisms). Status: accepted on merge."
  - "No retraining. No model changes. No CharCNN, multi-branch, or Sherlock work. The iteration is profile-emission code + taxonomy YAML + harness Rust + manifest CSV + MADRs + tests."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      `eval/datasets/validate_manifest.csv` exists with 9 columns:
      `dataset, file_path, source_url, licence, fetched_date, provenance_status, gt_sidecar_path, row_count, column_count`.
      Iteration 1 ships exactly 7 rows: `pokemon`, `rio2016_athletes`,
      `us_baby_names`, `co2_emissions_by_nation`, `world_population`,
      `un_locode`, `global_temp_annual`. Every row carries:
        - `source_url`: a fully-qualified public URL (no `'unknown'`
           values — iter-1 sources are all traceable; the URLs verified
           HTTP 200 at the time of spec landing are pinned in
           implementation_notes);
        - `licence`: one of the values in `eval/licence_allowlist.txt`
           (SPDX-canonical `MIT`, `CC0-1.0`, `CC-BY-4.0`, `PDDL-1.0`,
           `ODC-By-1.0`, … plus the free-form `public-domain`,
           `internal`, `unknown-investigating`); the iter-1 corpus
           uses `public-domain` for the four datasets/global_temp_annual,
           rio2016_athletes, world_population, co2_emissions_by_nation
           subset, `MIT` for pokemon's gist mirror, `PDDL-1.0` for the
           datahub mirrors that ship under ODC-PDDL, and free-form
           `public-domain` where no SPDX value applies. No new licence
           values are added in iter-1; if a source's licence is not
           already in `eval/licence_allowlist.txt`, the implementer
           extends the allowlist as part of this PR;
        - `fetched_date`: an ISO 8601 date (the date the CSV was
           sampled into the repo);
        - `provenance_status`: `real` for all 7 rows (no synthetic
           in this iteration's corpus). NOTE: `provenance_status` is
           a NEW column on `validate_manifest.csv` — it is not a field
           in the live `eval/datasets/sources.yaml` schema (sources.yaml
           uses `attribution` instead). The validate manifest is
           file-keyed and adds this column for MADR 0055 alignment;
           sources.yaml stays at its existing m-19 shape (see ac-02);
        - `file_path`: relative to repo root, pointing at
           `eval/datasets/validate_corpus/csv/<name>.csv`;
        - `gt_sidecar_path`: relative to repo root, pointing at
           `eval/datasets/validate_corpus/<name>.gt.yaml`.
      The schema admits new rows via PR with no harness code change.
    verification: >
      `awk -F, 'NR==1 {print NF}' eval/datasets/validate_manifest.csv`
      returns `9`. `wc -l eval/datasets/validate_manifest.csv` returns
      `8` (header + 7 rows). `awk -F, 'NR>1 && ($3 == "unknown" || $3 == "")'
       eval/datasets/validate_manifest.csv | wc -l` returns `0`. Every
      `file_path` and `gt_sidecar_path` resolves to a file that exists
      on disk.

  - id: ac-02
    ac_type: code
    description: >
      `eval/datasets/sources.yaml` is extended with role-`validate`
      entries for the 7 validate-corpus CSVs. Existing role-`eval` and
      role-`train` and role-`both-forbidden` entries are byte-unchanged.
      Each new validate-corpus source mirrors the live sources.yaml
      schema: `source_url` (the public URL pinned in implementation_notes
      — NOT a `repo://` self-reference, since these CSVs originate
      externally), `role: validate`, `licence` (SPDX value from
      `eval/licence_allowlist.txt`), `fetched_date` (ISO 8601),
      `attribution` (one-line free-text prose pointing at the upstream
      project), `datasets` (a YAML list whose single element is the
      dataset slug from `validate_manifest.csv`). The `id`/`name`/
      `provenance_status` keys do NOT appear in sources.yaml — they
      live exclusively on `validate_manifest.csv`. The `role` enum is
      extended from `{eval, train, both-forbidden}` to
      `{eval, train, both-forbidden, validate}`; the header comment
      block of sources.yaml documents the new value with the same
      paragraph shape as the existing three roles.
    verification: >
      `python3 -c "import yaml; d=yaml.safe_load(open('eval/datasets/sources.yaml'));
       roles=set(s.get('role') for s in d.get('sources',[])); assert
       'validate' in roles, roles; assert 'eval' in roles, roles;
       validate_rows=[s for s in d['sources'] if s.get('role')=='validate'];
       assert len(validate_rows)==7, len(validate_rows);
       required={'source_url','role','licence','fetched_date','attribution','datasets'};
       [assert required.issubset(s.keys()), s for s in validate_rows]"`
      exits 0. `git diff main -- eval/datasets/sources.yaml` shows only
      additions (no removals or modifications of pre-existing
      `role: eval/train/both-forbidden` blocks).

  - id: ac-03
    ac_type: code
    description: >
      The row-hash leakage firewall is extended. `scripts/compute_row_hashes.py`
      regenerates `eval/row_hashes.tsv` from BOTH `eval/datasets/manifest.csv`
      (eval role) AND `eval/datasets/validate_manifest.csv` (validate role)
      such that any row appearing in either manifest contributes a hash.
      `scripts/prepare_multibranch_data.py`'s leakage-filter behaviour
      remains active-by-default and now excludes validate-corpus rows
      from training data via the same hash table. The shared normaliser
      at `scripts/eval_leakage/__init__.py` is the single source of truth
      for hash computation; extension is at the manifest-iteration layer
      only.
    verification: >
      `python3 scripts/compute_row_hashes.py --dry-run` reports counts
      that include both eval-corpus rows and validate-corpus rows
      (the dry-run flag is added in this iteration if it does not exist).
      A new test `scripts/test_eval_leakage_validate_corpus.py` (or
      placement under `tests/`) loads a sample row from
      `eval/datasets/csv/airports.csv` and asserts its normalised
      hash appears in the regenerated `eval/row_hashes.tsv`. The
      normaliser source file `scripts/eval_leakage/__init__.py` is
      modified ONLY at the manifest-iteration site (no normaliser-rule
