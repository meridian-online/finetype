implementation_notes:
  - "Iter-1 corpus collision check: the 35 existing eval CSVs in `eval/datasets/csv/` are airports, books_catalog, codes_and_ids, countries, coverage_closure_phase_ab, covid_timeseries, datetime_coverage, datetime_formats, datetime_formats_extended, earthquakes_2024, ecommerce_orders, finance_coverage, financial_data, geography_data, iris, medical_records, multilingual, network_logs, new_finance, new_geography, new_identity, new_representation, new_technology, people_directory, representation_coverage, scientific_measurements, sports_events, tech_systems, technology_coverage, titanic, us_states, world_cities. The 7 iter-1 validate-corpus datasets are confirmed disjoint from this set: `pokemon`, `rio2016_athletes`, `us_baby_names`, `co2_emissions_by_nation`, `world_population`, `un_locode`, `global_temp_annual`. Validate-corpus assets live under `eval/datasets/validate_corpus/` (a new directory); m-19 eval data stays under `eval/datasets/csv/`."
  - "Iter-1 source URLs (verified HTTP 200 at 2026-04-28; data licences are derived from the upstream LICENSE/README and pinned to SPDX values from `eval/licence_allowlist.txt`, with `public-domain` used where no SPDX equivalent exists): pokemon → `https://gist.githubusercontent.com/armgilles/194bcff35001e7eb53a2a8b441e8b2c6/raw/92200bc0a673d5ce2110aaad4544ed6c4010f687/pokemon.csv` (gist mirror; data licence: `public-domain` — Pokémon stat data is widely-mirrored with no licence claim; gist code itself is `MIT` but the manifest column tracks the data licence; 801 rows × 13 cols); rio2016_athletes → `https://raw.githubusercontent.com/flother/rio2016/master/athletes.csv` (data licence: `public-domain` per upstream README; repository code is MIT; ~10k rows × 12 cols, cap to 5000); us_baby_names → `https://raw.githubusercontent.com/hadley/data-baby-names/master/baby-names.csv` (US Social Security Administration data; data licence: `public-domain`; 258k rows × 4 cols, cap to 5000); co2_emissions_by_nation → `https://raw.githubusercontent.com/datasets/co2-fossil-by-nation/main/data/fossil-fuel-co2-emissions-by-nation.csv` (data licence: `PDDL-1.0` per github.com/datasets/co2-fossil-by-nation README; 18k rows × 10 cols, cap to 5000); world_population → `https://raw.githubusercontent.com/datasets/population/master/data/population.csv` (World Bank derivative; data licence: `PDDL-1.0` per github.com/datasets/population README; 17k rows × 4 cols, cap to 5000); un_locode → `https://raw.githubusercontent.com/datasets/un-locode/master/data/code-list.csv` (UNECE UN/LOCODE derivative; data licence: `PDDL-1.0` per github.com/datasets/un-locode README; 116k rows × 12 cols, cap to 5000); global_temp_annual → `https://raw.githubusercontent.com/datasets/global-temp/master/data/annual.csv` (NOAA/NASA-derived; data licence: `PDDL-1.0` per github.com/datasets/global-temp README; 320 rows × 3 cols, no cap). The `eval/licence_allowlist.txt` file already contains all four values used (`MIT`, `PDDL-1.0`, `public-domain`, plus the never-used SPDX entries) — no allowlist edit is needed."
  - "Sampling rule: `head -n <cap+1>` over the source CSV preserves header + first N data rows deterministically. No randomisation in iter-1 (deterministic baselines matter more than statistical balance at this corpus size). For pokemon (801 < 5000) and global_temp_annual (320 < 5000) no truncation is applied; the full file commits."
  - "GT sidecar curation: for each of the 7 corpus CSVs, build the sidecar by reading the CSV header, examining 3-5 sample rows of each column, and choosing the most precise taxonomy label that fits the column's actual content. When ambiguous (e.g. `Type 1` in pokemon — `representation.text.word` vs `representation.enumeration.categorical`), pick the label that today's profile would NOT pick (i.e. the corrected label) and add a `notes:` rationale. The harness's `misclassification` mechanism is precisely the gap between profile's pick and the GT pick."
  - "Code-vs-canonical seam table (ac-07 rule 3): the 5 known seams are gender (M/F vs Male/Female), country (US vs United States vs USA), currency (USD vs $ vs US Dollar), language (en vs English vs en-US), blood_type (A+ vs A_POS vs A positive). Iter-1 corpus columns expected to surface this mechanism: `rio2016_athletes.nationality` (NOC 3-letter codes vs canonical country names), `co2_emissions_by_nation.Country` (uppercase non-canonical names like 'UNITED KINGDOM'), `world_population.Country Code` (ISO 3166-1 alpha-3, canonical), `un_locode.Country` (ISO 3166-1 alpha-2 codes). Implementer hardcodes the 5 seams in the attribution module. Other seams surface as `format_diversity` until added to the table."
  - "Profile JSON Schema emission code path: the v0.6.19 rally added json-schema output to `finetype profile`. The enum-emission decision lives there. Implementer should locate it (likely in `crates/finetype-cli/src/main.rs` or a profile module) and tighten per ac-09's predicate. The 32-cardinality cap is a literal value — implementer should NOT make it a flag in iteration 1."
  - "Validator widening surface for ac-10: implementer runs the baseline harness FIRST, reads `format_diversity` attributions in `eval/eval_output/validate_corpus.baseline.md`, and chooses 1–5 widenings prioritised by per-mechanism row count. Likely surfacing types from the iter-1 corpus (NOT prescriptive — implementer measures): `un_locode.Date` (`^\\d{4}$` yyMM short-form datetime), `un_locode.Coordinates` (`^\\d{4}[NS] \\d{5}[EW]$` packed lat/lon), `rio2016_athletes.height` (decimal metres `^\\d\\.\\d{2}$`), `pokemon.Type 1`/`Type 2` (categorical with possible empty cells). Each widening: one-line YAML edit on the universal `validation:` block, one regression test in `crates/finetype-core/tests/precision_widenings.rs` with both accept-set and reject-set assertions."
  - "Per-mechanism breakdown counts a column once even if it has many reject rows. The `Failing columns` count in ac-08's table is column-level, not row-level. The `Datasets affected` count is the number of distinct datasets where ≥1 column was attributed that mechanism."
  - "Movement reporting (ac-14): if N (post-fix datasets passing) equals N₀ (baseline), the iteration still ships — the harness existing and the baseline being committed is the structural success. The two fixes (ac-09 enum-overfit, ac-10 ≤5 validator widenings) target *mechanism reduction* rather than dataset-pass-flip; they may move per-mechanism counts without flipping any dataset across P=99%. The PR description must be honest about this distinction."
  - "Sources.yaml schema: existing `role: eval` rows have keys `id, name, url, licence, role, fetched_date, provenance_status, datasets`. Validate-corpus rows mirror this shape with `role: validate` and `datasets:` listing the file_path values from validate_manifest.csv."
  - "Row-hash leakage extension: the existing normaliser at `scripts/eval_leakage/__init__.py` works at the (header, sample-values) tuple level. No normaliser change is needed — only the manifest-iteration site that feeds rows to it. Look for the loop that reads `eval/datasets/manifest.csv` and add a parallel loop reading `eval/datasets/validate_manifest.csv`. Validate manifest is 9-col with different column ordering than the 7-col eval manifest; iterate by `csv.DictReader` (key by column name) NOT positional `csv.reader` to avoid coupling to column order."
  - "Harness binary lives in `crates/finetype-eval/src/bin/validate_corpus.rs` per the existing eval-binary placement (alongside `eval_gittables_cli.rs` etc.). Reuse `csv` crate for manifest parsing, `serde_yaml` (or `serde_yml`) for GT sidecars, `Command::new(\"finetype\")` (or the workspace's release binary path) for shelling out. The shelled binary should be the workspace's release build (`target/release/finetype`) so the harness exercises the same code paths users get from the CLI."
  - "Baseline file is committed verbatim from the first run; the delta-comparison logic in subsequent runs reads from the baseline file (NOT a config). Treat the baseline file as a frozen snapshot of `validate_corpus.md` minus the `delta:` line."
  - "Per-dataset diversity (ac-04 column inventories pinned post-commit): pokemon has 13 cols including the test-bed categorical `Type 1` (18 distinct values) and `Generation` (6-7 distinct integer-as-int-or-string ambiguity); rio2016_athletes has 12 cols with `nationality` 3-letter NOC codes hitting code-vs-canonical and `date_of_birth` ISO datetime; us_baby_names has 4 cols (`year`, `name`, `percent`, `sex`) — small surface but stresses the boy/girl categorical and decimal-percent format; co2_emissions_by_nation has 10 cols with uppercase country names and many decimal fuel breakdowns; world_population has 4 cols with canonical country code (control); un_locode has 12 cols with the format-diversity-rich `Date`, `Coordinates`, `IATA`, `Function`; global_temp_annual has 3 cols (Source enum, Year, Mean decimal) — clean control. Total: 58 columns under GT."

ontology_schema:
  name: "FailureMechanism"
  description: >
    The discrete partition over per-column round-trip failures. Computed
    from MADR 0071's reject ontology fields plus per-column GT
    comparison. Every failing column with a GT sidecar entry maps to
    exactly one mechanism. Without a GT entry, the column maps to
    `no_gt`.
  fields:
    - name: "enum_overfit"
      type: "mechanism"
      description: >
        Profile chose the right label, but emitted an enum constraint
        whose value list does not cover the full real-world cardinality.
        Trigger: predicted_label == expected_label AND any reject row
        has constraint_failed='enum'. Fix surface: profile-side
        (ac-09).

        Caveat (post-fix interpretation): after ac-09's threshold
        change, columns labelled `representation.discrete.categorical`
        with cardinality ≤32 still emit enums and CAN still produce
        legitimate enum-rejects (e.g. a real value not in
        `['M', 'F', 'X']` for a low-cardinality gender column). Rule 2
        will attribute these as `enum_overfit` even when the data is
        genuinely outside the legitimate categorical domain. ac-12's
        post-fix delta prose names this honestly: `enum_overfit` is
        a mechanism label (over-fit OR domain-violation), not a
        diagnosis. The rule's value is in surfacing the bucket;
        the human reads the per-column failure list to discriminate.
    - name: "format_diversity"
      type: "mechanism"
      description: >
        Profile chose the right label, but the validator's pattern is
        too narrow for the data's real-world format variance.
        Trigger: predicted_label == expected_label AND
        constraint_failed='pattern' AND not in code-vs-canonical
        seam table. Fix surface: taxonomy YAML (ac-10).
    - name: "misclassification"
      type: "mechanism"
      description: >
        Profile chose the wrong label outright. The validator's
        rejections are downstream of the wrong label. Trigger:
        predicted_label != expected_label AND any SEMANTIC_TYPE
        reject. Fix surface: model retraining (deferred to a
        follow-up retrain card under MADR 0066's hard gate). Iteration
        1 surfaces and counts; does not fix.
    - name: "code_vs_canonical"
      type: "mechanism"
      description: >
        Profile chose a label whose validator expects canonical values
        (Male/Female), but the data carries codes (M/F). The label is
        philosophically right but the validator's domain is canonical
        only. Trigger: predicted_label == expected_label AND
        constraint_failed='pattern' AND column-name matches the
        5-seam table (gender, country, currency, language, blood_type).
        Fix surface: cross-cutting taxonomy decision (deferred —
        needs MADR-level decision before fix). Iteration 1 surfaces
        and counts.
    - name: "unknown"
      type: "mechanism"
      description: >
        Failure attribution rule fell through all four cases. Treated
        as a quality signal — `unknown > 0` after iteration 1
        suggests the rule table needs an extension.
    - name: "no_gt"
      type: "mechanism"
      description: >
        Column failed but no GT sidecar entry existed. Counts toward
        the corpus headline N-of-M but does NOT contribute to
        per-mechanism breakdown. Iteration 1 ships all 7 CSVs with
        full GT (every column in every CSV has a sidecar entry), so
        `no_gt` is structurally 0 this iteration. The mechanism
        exists for forward-compatibility with the corpus-expansion
        follow-up (stub card 0015) where datasets may land with
        partial or no GT during curation.

evaluation_principles:
  - principle: "Round-trip self-consistency over absolute quality"
    weight: 0.30
  - principle: "Mechanism attribution must be deterministic, not heuristic"
    weight: 0.25
  - principle: "Reuse m-19 infrastructure (no parallel manifests)"
    weight: 0.15
  - principle: "Movement-based success — harness + baseline ships, fix-flip is bonus"
    weight: 0.15
  - principle: "Precision principle preserved (MADR 0001) — widenings still reject"
    weight: 0.15

exit_conditions:
  - "All 14 acceptance criteria pass"
  - "`make ci` exits 0 with zero new clippy warnings vs main"
  - "Baseline + post-fix harness reports both committed"
  - "Three MADRs landed (0072, 0073, 0074)"
  - "PR opened and review-pr verdict is APPROVE"
  - "Card 0014 maturity remains 'emerging' (this iteration is the harness; capability matures via follow-up corpus expansion + further mechanism fixes)"

