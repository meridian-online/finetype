  - id: ac-04
    ac_type: code
    description: >
      Ground-truth sidecars exist for all 7 iter-1 corpus CSVs at
      `eval/datasets/validate_corpus/<name>.gt.yaml` (a new directory
      that holds validate-corpus assets — sidecars and the CSVs live
      here, NOT in `eval/datasets/csv/` which is m-19 eval data). The
      seven sidecars are `pokemon.gt.yaml`, `rio2016_athletes.gt.yaml`,
      `us_baby_names.gt.yaml`, `co2_emissions_by_nation.gt.yaml`,
      `world_population.gt.yaml`, `un_locode.gt.yaml`, and
      `global_temp_annual.gt.yaml`. Each sidecar has the schema:
        ```yaml
        columns:
          <column_name>: <expected x-finetype-label>
          ...
        notes: |
          Optional free-text rationale for ambiguous labels.
        ```
      Every column in the source CSV appears in the `columns` map. The
      `expected x-finetype-label` value is a string that exists in the
      taxonomy (the harness validates this — see ac-07). The combined
      column count across all sidecars is approximately 58 columns
      (pokemon 13, rio2016_athletes 12, us_baby_names 4,
      co2_emissions_by_nation 10, world_population 4, un_locode 12,
      global_temp_annual 3 = 58 — implementation_notes pins the per-
      dataset column inventories once the CSVs are committed; the
      figure may shift by ±2 if upstream sources change schemas
      between spec landing and CSV fetch).
    verification: >
      `for f in pokemon rio2016_athletes us_baby_names
       co2_emissions_by_nation world_population un_locode
       global_temp_annual; do test -f
       eval/datasets/validate_corpus/$f.gt.yaml || echo "MISSING: $f"; done`
      prints nothing. `python3 -c "import yaml,glob; [print(f) for f in
       glob.glob('eval/datasets/validate_corpus/*.gt.yaml') if 'columns'
       not in yaml.safe_load(open(f))]"` prints nothing. Every column
      in every CSV header (read with `csv.reader`) appears as a key in
      the corresponding sidecar's `columns` map.

  - id: ac-05
    ac_type: code
    description: >
      A new eval binary exists at
      `crates/finetype-eval/src/bin/validate_corpus.rs`. Invocation:
      `cargo run -p finetype-eval --bin validate-corpus --release --
       --manifest eval/datasets/validate_manifest.csv
       --output eval/eval_output/validate_corpus.md
       [--threshold 0.99]`. The binary:
        1. Reads the manifest.
        2. For each CSV row: shells `finetype profile -f <csv>
           -o json-schema` (stdout-by-default per
           `2026-04-28-profile-json-schema-output/` constraint —
           no `--stdout` flag) and captures stdout into a temp
           schema file.
        3. Shells `finetype validate -f <csv> --schema <temp_schema>`
           and parses the validation report (rows valid / rows total).
        4. Computes per-dataset `pass = (valid / total) >= threshold`.
        5. If a GT sidecar is present, attributes each failing column
           to a mechanism per ac-07's table.
        6. Writes a single `validate_corpus.md` report per ac-08's shape.
      Exit code 0 always (the harness reports — it does not gate).
    verification: >
      `cargo build -p finetype-eval --bin validate-corpus --release`
      compiles clean. `cargo run -p finetype-eval --bin validate-corpus
       --release -- --manifest eval/datasets/validate_manifest.csv
       --output /tmp/validate_corpus.md` exits 0 and writes a non-empty
      file at `/tmp/validate_corpus.md`.

  - id: ac-06
    ac_type: code
    description: >
      `Makefile` gains a `validate-corpus` target that runs the binary
      from ac-05 against `eval/datasets/validate_manifest.csv` and
      writes to `eval/eval_output/validate_corpus.md`. `make eval-report`
      is extended to invoke `make validate-corpus` as part of its
      pipeline AND to surface the headline `N of M datasets pass at
      P=99%` line in the dashboard at `eval/eval_output/report.md`
      alongside the existing profile-eval and actionability-eval
      headlines.
    verification: >
      `grep -E "^validate-corpus:" Makefile` returns exactly one line.
      The `validate-corpus` target depends on a `cargo build --release
      --bin finetype --bin validate-corpus` (or equivalent) prerequisite
      so a fresh checkout's `make validate-corpus` succeeds without a
      prior `cargo build`. `make validate-corpus` exits 0 and writes
      `eval/eval_output/validate_corpus.md`. `make eval-report`
      exits 0 and `grep -E "validate-corpus|N of [0-9]+ datasets pass"
       eval/eval_output/report.md` returns ≥1 match.

  - id: ac-07
    ac_type: code
    description: >
      Mechanism attribution is implemented in
      `crates/finetype-eval/src/bin/validate_corpus.rs` (or a sibling
      module). For each failing column with a GT sidecar entry, the
      mechanism is one of: `enum_overfit`, `format_diversity`,
      `misclassification`, `code_vs_canonical`, or `unknown`. The
      attribution rules (deterministic, in this order):
        1. If `predicted_label != expected_label` AND any reject row
           has `error_type='SEMANTIC_TYPE'` → `misclassification`.
        2. If `predicted_label == expected_label` AND any reject row
           has `constraint_failed='enum'` → `enum_overfit`.
        3. If `predicted_label == expected_label` AND
           `error_type='SEMANTIC_TYPE'` AND `constraint_failed='pattern'`
           AND the column's GT label has a known canonical-vs-code
           seam (table in implementation_notes lists 5 such seams:
           gender, country, currency, language, blood_type) →
           `code_vs_canonical`.
        4. If `predicted_label == expected_label` AND
           `error_type='SEMANTIC_TYPE'` AND `constraint_failed='pattern'`
           (and not rule 3) → `format_diversity`.
        5. Otherwise → `unknown`.
      Failing columns WITHOUT a GT sidecar contribute to the corpus
      headline but their mechanism is `no_gt` (separate count, not
      `unknown`).
    verification: >
      Unit tests live in `#[cfg(test)] mod attribute_tests` adjacent
      to the binary's `main` (so `cargo test --workspace` exercises
      them under `make ci`). The six tests exercise each rule:
      `attribute_rule_misclassification`, `attribute_rule_enum_overfit`,
      `attribute_rule_code_vs_canonical`, `attribute_rule_format_diversity`,
      `attribute_rule_unknown_fallback`, `attribute_no_gt_path`. Each
      constructs a fixture (predicted_label, expected_label, reject row)
      and asserts the returned mechanism. `cargo test -p finetype-eval
      --bin validate-corpus -- attribute_` exits 0 with all 6 tests green.

  - id: ac-08
    ac_type: code
    description: >
      `eval/eval_output/validate_corpus.md` shape (the harness writes
      this verbatim; column widths and exact whitespace are means-level):
        ```
        # Validate-Precision Corpus Report
        Generated: <ISO timestamp>
        Threshold: P=0.99
        Corpus: <M> datasets, <total_rows> rows total

        ## Headline
        **<N> of <M> datasets pass at P=99%** (baseline: <N₀ of M₀>; delta: <±N>)

        ## Per-mechanism breakdown
        | Mechanism             | Failing columns | Datasets affected |
        |-----------------------|-----------------|-------------------|
        | enum_overfit          | …               | …                 |
        | format_diversity      | …               | …                 |
        | misclassification     | …               | …                 |
        | code_vs_canonical     | …               | …                 |
        | unknown               | …               | …                 |
        | no_gt                 | …               | …                 |

        ## Per-dataset
        | Dataset | Rows | Valid | Pass@99% | Failing columns | Top mechanism |
        | airports | 7698 | …     | …        | …               | …             |
        … one row per dataset …
        ```
      Baseline numbers come from a `eval/eval_output/validate_corpus.baseline.md`
      file written by the FIRST harness run before any in-scope fix
      lands (ac-09, ac-10). Subsequent runs read the baseline file and
      report delta.
    verification: >
      The baseline file is committed at
      `eval/eval_output/validate_corpus.baseline.md` after the first
      harness run. The delta line is present in subsequent runs:
      `grep -E "baseline:|delta:" eval/eval_output/validate_corpus.md`
      returns matches. The per-mechanism table contains all 6
      mechanism rows literally
      (`enum_overfit|format_diversity|misclassification|code_vs_canonical|unknown|no_gt`).

  - id: ac-09
    ac_type: code
    description: >
      In-scope fix 1: enum-overfit. Two distinct sub-fixes ship under
      this AC; both target the JSON Schema enum emission path that
      `2026-04-28-profile-json-schema-output/` introduced.
        Sub-fix (a) — Default cardinality cap: lower the default value
        of the existing `--enum-threshold` flag (`crates/finetype-cli/src/main.rs:299`)
        from `50` → `32`. The flag's documented behaviour is unchanged;
        only its default moves. Users who pass `--enum-threshold N`
        explicitly are unaffected. The label-family gate at
        `crates/finetype-cli/src/main.rs:3345` (label must equal
        `representation.discrete.categorical`) is unchanged — that
        gate is already correct and pre-existed this iteration.
        Sub-fix (b) — Boolean-terms gate parity: extend the label-family
        gate so `representation.boolean.terms`,
        `representation.boolean.binary`, and `representation.boolean.initials`
        also receive the same enum-emission treatment as
        `representation.discrete.categorical` (these are taxonomically
        finite-domain labels too). A column labelled
        `representation.boolean.terms` with ≤ `enum_threshold` distinct
        values gets an emitted enum; over the threshold, no enum.
      The 32 figure and the new boolean.* gates are literal — implementer
      does not introduce new flags. Three unit tests in
      `crates/finetype-cli/tests/` (or under `#[cfg(test)] mod`
      adjacent to the JSON Schema emission code):
        T1: `pvc_enum_omitted_for_non_categorical_label` — profile a
            CSV column labelled `datetime.offset.iana` with 12 distinct
            values → emitted schema has the `x-finetype-label` and
            pattern but NO `enum` (regression test, asserts existing
            gate still holds).
        T2: `pvc_enum_kept_for_boolean_terms_label` — profile a CSV
            column labelled `representation.boolean.terms` with 6
            distinct yes/no values at default threshold → emitted
            schema HAS an `enum` array (sub-fix (b) extension).
        T3: `pvc_enum_omitted_when_cardinality_exceeds_default` —
            profile a CSV column labelled `representation.discrete.categorical`
            with 40 distinct values at default threshold (32) → no enum
            (regression bound on sub-fix (a)).
      Post-fix harness re-run: the corpus-level count of failing
      columns attributed to `enum_overfit` is ≤ baseline's count for
      that mechanism. The fix is mechanism-monotonic on
      `enum_overfit` only — counts of OTHER mechanisms (e.g.
      `format_diversity`, `unknown`) may rise as enum-suppressed
      columns fall through to broader pattern checks; this is
      expected and not a regression. If baseline shows 0
      `enum_overfit` attributions, the three unit tests alone
      satisfy the fix's behavioural contract; the harness baseline-
      vs-post-fix delta is recorded honestly with prose noting why.
    verification: >
      Unit tests `pvc_enum_omitted_for_non_categorical_label`,
      `pvc_enum_kept_for_boolean_terms_label`, and
      `pvc_enum_omitted_when_cardinality_exceeds_default` pass:
      `cargo test -p finetype-cli pvc_enum_` exits 0 with 3 tests.
      `grep -E "default_value\\s*=\\s*\"32\"" crates/finetype-cli/src/main.rs`
      returns exactly one match (the lowered `--enum-threshold`
      default). `grep -E "representation\\.boolean\\." crates/finetype-cli/src/main.rs`
      returns ≥1 match (the new boolean.* family in the emission
      gate). Post-fix harness re-run: `enum_overfit` count in
      `eval/eval_output/validate_corpus.md` is ≤ the count in
      `eval/eval_output/validate_corpus.baseline.md`.

  - id: ac-10
    ac_type: code
    description: >
      In-scope fix 2: validator format-diversity. The implementer runs
      the iteration-1 baseline harness over the 7-CSV corpus, reads the
      per-column `format_diversity` attributions, and chooses 1–5 type
      widenings whose widened patterns honour the precision principle
      (MADR 0001) — the widened validator must still REJECT clearly
      invalid input. Each widening is a one-line edit to the relevant
      `labels/definitions_*.yaml` `validation:` block (universal layer
      only — locale-specific blocks remain untouched, since MADR 0001
      requires that locale-specific types' universal validators only
      reject, never accept widely). For each widening: (a) the YAML
      edit lands; (b) a regression test in
      `crates/finetype-core/tests/precision_widenings.rs` asserts
      both an accept-set (≥3 real-world variants the prior pattern
      rejected) AND a reject-set (≥3 clearly-invalid strings the
      widened pattern still rejects). Iteration-1 widening count:
      ≥1 (proves the widening pattern works) and ≤5 (bounds scope —
      further widenings ship under follow-up cards). Likely candidates
      from the iter-1 corpus, in priority order: `un_locode.Date`
      (yyMM short-form datetime), `un_locode.Coordinates`
      (DDMMNS DDDMMEW geo format), `rio2016_athletes.height`
      (decimal metres), or any other type the baseline surfaces;
      implementer chooses based on baseline measurement, NOT the
      list above.
    verification: >
      `git diff main -- labels/definitions_*.yaml` shows changes to
      between 1 and 5 types' `validation:` regexes (count via
      `git diff main -- 'labels/definitions_*.yaml' | grep -c
      "^+.*validation:"` ≥1 and ≤5).
      `cargo test -p finetype-core precision_widenings` exits 0 with
      every widening's accept-set AND reject-set tests passing.
      Post-fix harness re-run: the corpus-level count of failing
      columns attributed to `format_diversity` is ≤ the baseline's
      count. The monotonicity holds because the harness profiles each
