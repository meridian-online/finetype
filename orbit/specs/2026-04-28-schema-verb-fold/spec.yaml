goal: |
  Retire the `finetype schema` public verb in v0.6.19. Type-mode
  (`schema KEY`) is replaced by `taxonomy KEY -o json-schema`;
  table-mode (`schema FILE.csv`) was already retired in card 0003 by
  `profile -o json-schema`. The deletion + the type-mode replacement
  ship in this card. MADR 0070 records the architectural fold;
  MADR 0031 is superseded.

constraints:
  - "Hard removal in v0.6.19 — no soft deprecation, no dispatch shim, no warning-only branch. Same posture as visibility-cleanup spec / PR #51."
  - "`finetype taxonomy KEY -o json-schema` always returns a JSON array, even for single matches. No cardinality-dependent shape — consistent with `taxonomy`'s other output formats."
  - "Type-mode emitter lives in the same shared helper module as the table-mode emitter (`crates/finetype-mcp/src/json_schema.rs`, established in card 0003)."
  - "MCP `schema` tool's type-key branch is retained for v0.6.19 (visibility-cleanup carve-out, mcp-surface-audit memo line 116). Only the table branch dies, which already happened in card 0003."
  - "Verbosity contract from PR #51 is preserved: only `x-finetype-label` + `x-finetype-pii` extensions on emitted schemas. The pre-existing `cmd_schema`'s missing `x-finetype-label` is FIXED in passing — both surfaces now carry both extensions."
  - "Same-PR migration of code + docs + tests. README.md, CLAUDE.md, both .claude/skills/*.md files, golden tests, and CHANGELOG entry all land together. orbit/ historical references out of scope."
  - "MADR 0070 written and 0031 superseded in the same PR. Decision register is the canonical record for the fold."
  - "`-f, --file` flag binding on `Commands::Schema` (main.rs:204-205) goes away with the verb. Other subcommands' `-f, --file` taxonomy-directory pattern is out of scope (separate observation, separate card)."
  - "No `finetype-core` API expansion in v0.6.19 — same constraint inherited from card 0003. Helper stays in finetype-mcp."
  - "No model retraining, no taxonomy edits, no DuckDB extension changes."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: |
      `crates/finetype-mcp/src/json_schema.rs` gains a public function
      `emit_type_schema(label: &str, def: &Definition) -> serde_json::Value`
      that produces the per-type JSON Schema document with `$schema`,
      `$id`, `title`, `description`, validation keywords, `examples` from
      samples, and the verbosity-contract extensions
      `x-finetype-label` + `x-finetype-pii`. Module-level docs note the
      two-emitter shape (table + type) and the shared verbosity contract.
    verification: |
      `cargo build -p finetype-mcp` succeeds. The function's signature
      and module docs are visible from `cargo doc -p finetype-mcp`. A
      unit test exercises the emitter for `identity.person.email` and
      asserts `$schema`, `$id`, `x-finetype-label`,
      `x-finetype-pii` are all present and the dropped extensions
      (`x-finetype-broad-type`, `-transform`, `-format-string`,
      `-domain`, `-confidence`, `-transform-ext`) are all absent.

  - id: ac-02
    ac_type: code
    description: |
      `Commands::Taxonomy` clap variant gains an optional positional
      argument `type_key: Option<String>`. When present, `cmd_taxonomy`
      filters the definitions using the same exact-match-or-glob
      predicate as the current `cmd_schema` (exact key OR
      `prefix.*` / `prefix*` glob). When absent, the existing
      `--domain` / `--category` / `--priority` filtering is preserved
      and unchanged. Edit-distance suggestions on unknown KEY are
      ported from `cmd_schema` (main.rs:2629-2647) into `cmd_taxonomy`
      and remain identical in behaviour: stderr suggestions, exit code
      1, no stdout output.
    verification: |
      `cargo run -p finetype-cli -- taxonomy email` succeeds (exits 0)
      with the existing Plain-output behaviour applied to the
      single-match `identity.person.email`. `cargo run -p finetype-cli --
      taxonomy "identity.person.*"` succeeds, matching all
      identity.person types. `cargo run -p finetype-cli -- taxonomy
      not_a_real_type` exits 1 with edit-distance suggestions on stderr
      and nothing on stdout.

  - id: ac-03
    ac_type: code
    description: |
      `cmd_taxonomy` gains an `OutputFormat::JsonSchema` match arm. The
      arm iterates the matched `defs: Vec<(&String, &Definition)>`
      (filtered by either positional KEY per ac-02 or by
      domain/category/priority), calls `json_schema::emit_type_schema`
      per match, collects into `Vec<Value>`, and writes the JSON array
      to stdout pretty-printed (always pretty — `OutputFormat::Json`
      already pretty-prints unconditionally; `JsonSchema` matches that
      pattern). Even single-match input emits a single-element array —
      never a bare object. Unknown-KEY behaviour under JsonSchema mode
      matches ac-02: exit 1, suggestions on stderr, nothing on stdout
      (NOT `[]`).
    verification: |
      `finetype taxonomy email -o json-schema` emits a JSON array with
      one object whose `x-finetype-label` is `identity.person.email`.
      `finetype taxonomy --domain identity -o json-schema` emits a
      JSON array of N objects (one per identity-domain type). Both
      runs `serde_json::from_str` cleanly into `Vec<Value>`.
      `finetype taxonomy not_a_real_type -o json-schema` exits 1 with
      stderr suggestions and empty stdout.

  - id: ac-04
    ac_type: code
    description: |
      `Commands::Schema` clap variant, `cmd_schema` function (main.rs:2565+),
      `cmd_schema_table` function (main.rs:2699+, ~200 LOC of model
      load + sibling-context wiring + per-column classification + emit
      call), the path-sniffer dispatch arm (main.rs:595+), and the
      dedicated `-f, --file` `PathBuf` flag bound to schema's `file`
      arg are all deleted. The private `build_json_schema` function in
      `main.rs:2642` is also deleted (its body moves into
      `json_schema::emit_type_schema`). After deletion, no profile /
      load / validate code path becomes orphaned — every helper used
      by `cmd_schema_table` (`load_multi_branch_classifier`, sibling-
      context wiring, etc.) must remain reachable from `cmd_profile`
      OR be removed alongside `cmd_schema_table`.
    verification: |
      `grep -n "Commands::Schema\|fn cmd_schema\b\|fn cmd_schema_table\|fn build_json_schema" crates/finetype-cli/src/main.rs`
      returns no hits. `cargo build -p finetype-cli` succeeds. `finetype --help`
      no longer lists `schema`. `finetype schema email` exits with clap's
      "unrecognized subcommand" error (exit 2). `cargo clippy -p finetype-cli
      --all-targets -- -D warnings -D dead_code` succeeds (catches orphaned
      helpers from cmd_schema_table deletion).

  - id: ac-05
    ac_type: code
    description: |
      Two existing golden tests in `crates/finetype-cli/tests/cli_golden.rs`
      are renamed and migrated:
      `golden_schema_email` → `golden_taxonomy_json_schema_email`;
      `golden_schema_iso_date` → `golden_taxonomy_json_schema_iso_date`.
      The `run_schema_json` helper is renamed to
      `run_taxonomy_json_schema` (or equivalent) and shells out to
      `cargo run -p finetype-cli -- taxonomy <KEY> -o json-schema`.
      Each test gains a `.as_array().unwrap()[0]` projection at the top
      of the assertion block (per ac-03's always-array shape). Each
      test gains a NEW assertion checking that
      `x-finetype-label` is present and equal to the queried key
      (verifies the in-passing addition called out in
      implementation_notes; pairs with the CHANGELOG bullet under
      ac-07). Other existing assertion bodies (`pattern`,
      `x-finetype-pii`, dropped extensions) stay unchanged.
    verification: |
      `cargo test -p finetype-cli --test cli_golden -- --ignored
      golden_taxonomy_json_schema_email golden_taxonomy_json_schema_iso_date`
      passes both tests. `grep "golden_schema_email\|golden_schema_iso_date\|run_schema_json"`
      on the test file returns no hits. Both tests assert
      `x-finetype-label` presence + value match.

  - id: ac-06
    ac_type: doc
    description: |
      README.md migrated:
      - L77: `finetype schema "datetime.date.*" --pretty` →
        `finetype taxonomy "datetime.date.*" -o json-schema`
        (drop `--pretty` — `taxonomy -o json-schema` pretty-prints
        unconditionally per ac-03).
      - L82 was already migrated in card 0003 (table-mode) — verify it
        stays as `finetype profile -f data.csv -o json-schema > schema.json`.

      CLAUDE.md migrated:
      - "Public vs internal CLI surface" table row for `schema` is
        deleted. The public surface drops from 7 to 6 commands:
        `infer`, `profile`, `validate`, `load`, `mcp`, `taxonomy`.
        CLAUDE.md:177 sentence updated from "only the 7 public
        commands" → "only the 6 public commands". The "Public
        (v0.6.19)" table row at CLAUDE.md:186 is updated to drop
        `schema` from the comma-separated list.
      - The MCP tools table row for `schema` is RETAINED for v0.6.19
        (per constraint #4) with an inline note: "MCP audit follow-up
        in v0.6.20 will mirror the CLI fold."

      `.claude/skills/finetype-cli/SKILL.md`:
      - Lines 40-65, 244, 251: every reference to `finetype schema KEY`
        migrated to `finetype taxonomy KEY -o json-schema`.
      - Every reference to `finetype schema FILE.csv` migrated to
        `finetype profile -f FILE.csv -o json-schema`.

      `.claude/skills/finetype-pipeline/SKILL.md`:
      - Lines 57, 140: same migration as above.

      Out of scope (not user-facing): orbit/ historical references,
      CLAUDE.md "Recent work" historical entries (the only
      `finetype schema` invocation in CLAUDE.md is the line-208
      command-table row that is deleted by this AC).
    verification: |
      `grep -RE "finetype schema" README.md CLAUDE.md .claude/skills/`
      returns zero hits. `grep -E "^\| .schema. \|" CLAUDE.md` returns
      exactly one hit (the MCP tools row, retained per constraint #4).
      `grep -E "finetype taxonomy.*json-schema|finetype profile.*json-schema" README.md`
      returns at least 2 hits. `grep -E "6 public commands" CLAUDE.md`
      returns one hit.

  - id: ac-07
    ac_type: doc
    description: |
      `CHANGELOG.md` gains a v0.6.19 entry under "Removed" naming the
      schema verb fold with the verbatim migration map:

        - `finetype schema KEY` → `finetype taxonomy KEY -o json-schema`
        - `finetype schema FILE.csv` → `finetype profile -f FILE.csv -o json-schema`

      A "Changed" sub-bullet records the in-passing addition:
      `x-finetype-label` is now emitted on type-mode JSON Schema
      output (was only emitted on table-mode prior to v0.6.19;
      type-mode only emitted `x-finetype-pii`). Both surfaces now
      carry both extensions, matching the verbosity contract from
      PR #51. The entry references MADR 0070.
    verification: |
      `grep -A 6 "schema verb" CHANGELOG.md` shows the migration map.
      `grep -A 2 "x-finetype-label" CHANGELOG.md` shows the Changed
      sub-bullet.

  - id: ac-08
    ac_type: doc
    description: |
      MADR 0070 created at
      `orbit/decisions/0070-schema-verb-folds-entirely.md` with status
      `accepted`, title "Schema verb folds entirely — type-mode →
      taxonomy, table-mode → profile". Captures: context (overlap with
      `taxonomy`/`profile`), considered options (rename, soft
      deprecation, hard fold), decision (hard fold), consequences
      (CLI surface tightens; MCP audit deferred per Decision 4 in this
      card's interview). References MADR 0031 as superseded.
    verification: |
      `cat orbit/decisions/0070-schema-verb-folds-entirely.md` returns
      a valid MADR with `status: accepted` in frontmatter. The body
      includes "Considered Options", "Decision Outcome", "Consequences"
      sections. References to 0031 and PR #51 are present.

  - id: ac-09
    ac_type: doc
    description: |
      MADR 0031 frontmatter updated to `status: superseded by 0070`.
      `date-modified` set to `2026-04-28`.
    verification: |
      `head -10 orbit/decisions/0031-table-level-schema-via-finetype-schema.md`
      shows `status: superseded by 0070` and the updated `date-modified`.

  - id: ac-10
    ac_type: code
    description: |
      `crates/finetype-mcp/src/lib.rs:142-148` server description text
      and the MCP `schema` tool description in `tools/schema.rs` carry
      a one-line "MCP audit follow-up in v0.6.20" comment so the
      temporary CLI/MCP asymmetry is visible in the source. No
      behaviour change in MCP — the type-key branch keeps working.
    verification: |
      `grep -n "MCP audit follow-up" crates/finetype-mcp/src/`
      returns hits in `lib.rs` and `tools/schema.rs`. The MCP `schema`
      tool's `path`/`data` branches still error per card 0003's
      migration string; the `type_key` branch still works.

  - id: ac-11
    ac_type: gate
    description: |
      `make ci` passes (fmt, clippy, test, taxonomy check). Zero new
      clippy warnings introduced by this card relative to the baseline
      established by `make ci` on `main` immediately before card
      0003's branch was rebased (PR #53 baseline). The pre-existing
      finetype-eval rust-1.95 clippy lints are pre-existing baseline
      and out of scope.
    verification: |
      `make ci` exits 0. New `golden_taxonomy_json_schema_*` tests
      pass under `--ignored`. Legacy `golden_schema_*` tests no
      longer exist (per ac-05). `cargo clippy -p finetype-cli -p
      finetype-mcp --all-targets -- -D warnings` exits 0
      (touched-crates-only baseline, identical to PR #53's gate).

implementation_notes:
  - |
    **Helper-module home — drift between interview/decisions and as-shipped state.**
    Interview Q3 (line 82-85) and decisions D3 (line 78) both
    recommend a CLI-internal helper module at
    `crates/finetype-cli/src/json_schema.rs`. Both pre-date card 0003's
    PR #53. Card 0003 placed the helper at
    `crates/finetype-mcp/src/json_schema.rs` instead — the recommendation
    B intent ("don't expand finetype-core API") was satisfied by
    placing the helper in finetype-mcp because finetype-cli already
    depends on finetype-mcp; the helper is reachable from both
    surfaces without expanding finetype-core. Card 0006 extends the
    same module with `emit_type_schema(...)`. **No module relocation
    is in scope for this card.** The companion spec
    (`2026-04-28-profile-json-schema-output/spec.yaml` ac-02) carries
    the same drift; future archaeologists should read constraint #3
    here as the authoritative location and treat interview/decisions
    as design-phase sketches superseded by PR #53.
  - |
    **In-passing extension addition** (HIGH visibility, not a "fix").
    The pre-existing `build_json_schema` in `main.rs:2642` does NOT
    emit `x-finetype-label` (only `x-finetype-pii`, line 2724). The new
    `emit_type_schema` emits BOTH per the verbosity contract,
    matching `emit_table_schema`'s behaviour. This IS a behaviour
    change in the type-mode JSON Schema export contract — v0.6.18
    `schema KEY` output did not carry `x-finetype-label`, v0.6.19
    `taxonomy KEY -o json-schema` does. Symmetry with table-mode
    wins; the CHANGELOG entry under ac-07 records this explicitly,
    and the renamed golden tests under ac-05 add a label-presence
    assertion to the body.
  - |
    `cmd_taxonomy`'s output match has explicit arms (no catch-all)
    for `Plain | Markdown | Arrow`, `Json`, `Csv`. Card 0003 added a
    catch-all for `JsonSchema` at line 2466 that degrades to the
    Plain output. This card replaces the catch-all with a dedicated
    `OutputFormat::JsonSchema` arm. Pretty-printing is unconditional
    (no `--pretty` flag added to taxonomy — `OutputFormat::Json`
    already pretty-prints unconditionally; this matches that
    pattern).
  - |
    `cmd_schema_table` is **NOT a thin caller** — it is ~200 LOC of
    model load + sibling-context wiring + per-column classification
    that ends with a call to `json_schema::emit_table_schema`. Deleting
    it cleanly requires confirming via dead-code clippy that no
    helper used only by `cmd_schema_table` becomes orphaned. Most
    helpers (`load_multi_branch_classifier`, sibling-context wiring)
    are also used by `cmd_profile` and stay; any that become
    dead-code-only get removed alongside the deletion. ac-04's
    verification gates this with `clippy -D dead_code`.
  - |
    `cmd_schema` itself is ~75 LOC (`main.rs:2565-2639`). Its body
    moves into `emit_type_schema` (the schema-building part) and the
    edit-distance suggestion logic moves into `cmd_taxonomy`'s KEY-
    not-found branch (per ac-02). The unknown-key contract is pinned
    in ac-02 and ac-03: exit 1, suggestions on stderr, empty stdout
    (NOT `[]` — match v0.6.18 byte-for-byte on the error path).
  - |
    Tests get renamed not rewritten — most of the assertion body
    stays unchanged. Two changes per test: (a) `.as_array().unwrap()[0]`
    projection at the top to handle the always-array shape; (b) one
    new assertion checking `x-finetype-label` presence + value match
    (ac-05 calls this out explicitly).

ontology_schema:
  name: "SchemaVerbFold"
  description: |
    Models the v0.6.19 retirement of `finetype schema`: the deletion
    of the verb, the addition of `taxonomy -o json-schema`, the
    migration surface (docs + tests), and the formal MADR record.
  fields:
    - name: "verb_deleted"
      type: "boolean"
      description: "Whether the schema verb is gone from the CLI surface (clap variant + dispatch + cmd_* functions)."
    - name: "type_mode_replacement"
      type: "string"
      description: "The new way to export type-mode JSON Schema: `taxonomy KEY -o json-schema`."
    - name: "helper_module_path"
      type: "string"
      description: "Where the JSON Schema emitter lives (constraint #3)."
    - name: "madr_number"
      type: "integer"
      description: "MADR file number recording the fold (0070)."
    - name: "superseded_madr"
      type: "integer"
      description: "MADR number flipped to `superseded by` status (0031)."
    - name: "always_array_shape"
      type: "boolean"
      description: "Whether `taxonomy -o json-schema` returns a JSON array even for single matches (constraint #2)."

evaluation_principles:
  - principle: "Surface tightness"
    weight: 0.25
  - principle: "Migration completeness — all docs/tests work in the released artefact"
    weight: 0.25
  - principle: "Decision capture (MADR 0070 + 0031 superseded)"
    weight: 0.20
  - principle: "Verbosity-contract preservation (label + pii only)"
    weight: 0.15
  - principle: "MCP carve-out integrity (type-branch lives in v0.6.19)"
    weight: 0.15

exit_conditions:
  - "All 11 acceptance criteria pass."
  - "`make ci` exits 0 with zero new clippy warnings (PR #53 baseline)."
  - "PR opened and review-pr verdict is APPROVE."
  - "Rally manifest updated: card 0006 status → shipped."

