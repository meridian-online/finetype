goal: >
  Produce the removal roadmap for rule-based header-hint pathways (MADR 0042
  execution). This spec is diagnostic-only: it enumerates every rule-based
  header-hint family in the codebase, measures how often each family fires
  on the full eval corpus (448 rows, 352 label-scored columns), measures
  what the multi-branch model predicts when each family is disabled, and
  classifies each family as model-covered (safe to remove) or model-gap
  (blocked on training-data fortification). Output:
  diagnostics/rhh_roadmap.tsv + methodology doc. No source-code removal.
  Subsequent per-domain specs consume this roadmap.

constraints:
  - >
    No source-code removal in this spec. All of column.rs / semantic.rs /
    main.rs stays intact. Deliverable is measurement + roadmap, not a
    behaviour change.
  - >
    Model2Vec semantic-hint layer (semantic.rs, 733 lines) is out of scope
    for the roadmap's "remove" column. It stays. Threshold gates
    (header_hint_cross_domain 0.85, header_hint_same_category 0.95) stay.
  - >
    Granularity is rule-family, not per-arm. Runtime disambiguation_rule
    emits family tags (e.g. "header_hint_hardcoded", "header_hint_measurement"),
    not per-arm tags ("hh_email_exact"). This spec matches that granularity
    for all inventory, measurement, and classification. Per-arm enumeration
    is deferred to a future spec if evidence warrants. ac-01 is the source
    of truth for the family list — hand-counted estimates from the interview
    (which said ~12) are known to undercount; grep shows 36 distinct
    header_hint_* suffixes plus sense_geo_* branches plus the substring-matcher
    category plus the top-level header_hint() match table. The canonical list
    emerges from ac-01's output.
  - >
    Measurement is against the full 448-row eval manifest
    (eval/datasets/manifest.csv). Uses the sherlock-v16 model (current
    models/default). Primary baseline is v16's existing profile eval output
    (297/352 label, 323/352 domain per CLAUDE.md m-19 re-score).
  - >
    "Model-covered" means: with the specific family disabled, the multi-branch
    model's raw top-1 prediction matches the expected ground-truth label on
    ≥80% of columns where that family currently fires. "Model-gap" means <80%.
    80% is the threshold — named explicitly here, not a judgement call.
  - >
    Per-family measurement uses targeted disablement — not the global
    --no-header-hint flag. Each family gets disabled individually via an
    instrumentation hook implemented as a SINGLE cfg-gated check at each
    relevant function entry (`apply_header_sharpen`, `header_hint`, each
    sense_geo_* branch head). Zero per-arm diff sprawl. The hook reads
    env var RHH_DISABLE_HINTS (comma-separated list of family names) and
    early-returns when the current family is in the disabled set. Feature
    flag: `rhh-instrumentation`. When the feature is off, the hook compiles
    out entirely.
  - >
    All diagnostics live under diagnostics/ with reproducible regeneration
    scripts under scripts/rhh/. Every TSV has a schema comment header.
  - >
    Test prefix for this spec is `rhh`. Tests are named rhh_ac01_*,
    rhh_ac02_*, etc., under scripts/rhh/test_rhh.py (pytest/unittest) or
    crates/finetype-model/tests/rhh_*.rs (Rust tests for instrumentation).

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      Family inventory — enumerate every rule-based header-hint rule family
      in the codebase as a TSV at diagnostics/rhh_family_inventory.tsv.
      Columns: family_id (stable identifier matching the runtime
      disambiguation_rule tag, e.g. "header_hint_hardcoded",
      "header_hint_measurement", "sense_geo_hint_override",
      "substring_matcher_finance", plus "header_hint_table" for the top-level
      match at column.rs:3999), file, line_start, line_end, rule_family_class
      (one of: match_table, branch, substring, legacy_sense), domain (7-value
      enum OR "cross-domain" if the family covers multiple domains),
      type_targets (semicolon-separated taxonomy types), arm_count (number of
      distinct arms/call-sites within this family — for
      "header_hint_table" this is the ~185-line match arm count; for
      "substring_matcher_*" this is the h.contains count within the family's
      scope). Generated by scripts/rhh/ac01_inventory.py which grep-walks
      column.rs (and any other source files where header_hint_* tags are
      emitted).
    verification: >
      File exists at diagnostics/rhh_family_inventory.tsv with header row
      matching the documented schema. Row count ≥ 15 (established lower
      bound: 36 header_hint_* suffixes collapse into 12-18 semantic families
      per grep sampling, plus 2 sense_geo_* legacy branches, plus 1
      header_hint_table, plus ~7 substring_matcher_* groupings — one per
      domain). Every family_id is unique. Every (file, line_start, line_end)
      triple brackets real call-sites for the family; ranges MAY overlap
      across families (substring matchers are interleaved arms in a single
      function body, branch families are guards inside apply_header_sharpen
      — see MADR 0042 execution-log notes and rhh_methodology.md "Design
      Pivots" for the v1.3 spec correction). Every rule_family_class value
      appears at least once (all 4 classes are exercised). A Python test
      (rhh_ac01_inventory) loads the TSV and asserts all invariants.

  - id: ac-02
    ac_type: code
    description: >
      Family-disablement instrumentation — add a runtime hook that reads
      env var RHH_DISABLE_HINTS (comma-separated family_ids) and causes
      matching families to early-return their hint-application step during
      inference. Implemented as ONE cfg-gated check per function entry
      point (apply_header_sharpen, header_hint, each sense_geo_* branch
      head, each substring_matcher_* branch head) — not per-arm. Feature
      flag `rhh-instrumentation` gates the entire hook; when off, the hook
      compiles to zero instructions. Covers every family_id from ac-01.
    verification: >
      `cargo build -p finetype-model` (default features) succeeds with no
      diff in public API (checked by `cargo public-api` or equivalent manual
      check; logged in diagnostics/rhh_build_check.txt). Binary size
      recorded but not gated — variance between macOS/Linux builds too
      large for a threshold. `cargo build -p finetype-model --features
      rhh-instrumentation` succeeds clean. Test rhh_ac02_disable_env: with
      RHH_DISABLE_HINTS="header_hint_hardcoded", classifying a column with
      header="email" and non-email values produces a disambiguation_rule
      that does NOT start with "header_hint_hardcoded" (exercising one
      emitting family). Test rhh_ac02_disable_non_emitting: with
      RHH_DISABLE_HINTS="header_hint_table" (the top-level match at
      column.rs:3999 emits via header_hint_hardcoded when a match fires),
      classify a column with header="email" — the disambiguation_rule
      must differ from baseline, proving the table entry-point disable
      is wired correctly even when the family has no dedicated emitter
      tag. Similar check for one substring_matcher_* family using a
      known-targeted finance.currency.amount column. Test
      rhh_ac02_disable_all: with
      RHH_DISABLE_HINTS="<every family_id comma-joined from ac-01>", no
      disambiguation_rule emitted by the profile pipeline starts with any
      of the disabled family prefixes.

  - id: ac-03
    ac_type: code
    description: >
      Per-family hit-count measurement — for every family_id in ac-01,
      measure how many of the 352 scored columns on the expanded eval
      manifest currently trigger that family. Uses the existing
      disambiguation_rule field emitted during inference, matched by
      prefix. Output diagnostics/rhh_hit_counts.tsv with columns:
      family_id, columns_hit, columns_correct (prediction matches GT),
      columns_wrong (prediction differs from GT), columns_unused (352 -
      hit). Generated by scripts/rhh/ac03_hit_counts.py which runs
      `finetype profile --verbose` once on the full manifest and parses
      disambiguation_rule prefixes across all 352 rows.
    verification: >
      File exists, schema matches the shipped columns (family_id,
      hit_count, measurement_mode, rule_family_class, keep_required,
      note) — v1.3 spec correction. Original schema
      (columns_hit/correct/wrong/unused) was replaced because internal
      families fire inside header_hint() without a dedicated rule prefix,
      so prefix-match correctness counts don't exist for them; correctness
      is measured uniformly by ac-04's counterfactual instead. Every
      family_id from ac-01 appears exactly once. Every measurement_mode is
      one of {direct, internal}. For direct-mode families, hit_count equals
      the count of rows in the baseline profile output whose
      disambiguation_rule begins with the family_id (counted independently
      by rhh_ac03_totals test). For internal-mode families hit_count is
      deferred to ac-04.

  - id: ac-04
    ac_type: code
    description: >
      Per-family counterfactual prediction — for every family_id with
      columns_hit ≥ 1, measure what the model predicts on those columns
      when that family is disabled (via ac-02's instrumentation). Output
      diagnostics/rhh_counterfactual.tsv with columns: family_id,
      column_id (dataset::column_name), gt_label, baseline_prediction,
      no_hint_prediction, no_hint_domain_correct (bool),
      no_hint_label_correct (bool). One row per
      (family_id, column_hit) pair. Generated by
      scripts/rhh/ac04_counterfactual.py which loops over family_ids,
      sets RHH_DISABLE_HINTS, runs `finetype profile --verbose` on the
      family's hit columns, parses predictions, diffs against baseline.
    verification: >
      File exists, schema matches. Row count equals 22 families × 448
      GT-covered columns == 9856 — v1.3 correction from the original
      "sum of columns_hit" invariant, which predated the uniform
      label_changed==1 hit definition (see rhh_methodology.md "Design
      Pivots"). Every column_id is traceable back to a row in the eval
      manifest. Test rhh_ac04_baseline_match: every counterfactual row's
      baseline_prediction matches the corresponding family-agnostic
      baseline in rhh_counterfactual.tsv (the 22 families share one
      baseline per column, so every column_id should show 22 identical
      baseline_prediction values across families). Model pinning: the
      TSV opens with a schema comment header recording (a) the resolved
      absolute path of the model directory (following models/default
      symlink), (b) the sha256 of model.safetensors at measurement time.
      This protects downstream interpretation against a future
      models/default promotion flip.

  - id: ac-05
    ac_type: code
    description: >
      Family classification — classify every family_id as "model-covered",
      "model-gap", or "no-hit". Rules:
      (a) no-hit: columns_hit == 0 on eval. Safe to remove with zero measured
      risk but unverifiable; flagged for next eval-corpus expansion.
      (b) model-covered: columns_hit ≥ 1 AND no_hint_label_correct ≥ 80% of
      columns_hit. Safe to remove.
      (c) model-gap: columns_hit ≥ 1 AND no_hint_label_correct < 80% of
      columns_hit. Remove blocked pending training-data fortification.
      Output diagnostics/rhh_classification.tsv with columns: family_id,
      classification, columns_hit, no_hint_label_accuracy (3 decimal
      places), notes. Generated by scripts/rhh/ac05_classify.py joining
      ac-03 + ac-04 outputs.
    verification: >
      File exists, schema matches. Every family_id from ac-01 appears
      exactly once. classification ∈ {model-covered, model-gap, no-hit}.
      Boundary tests: 5 hits / 4 correct (0.800) → model-covered; 5 hits
      / 3 correct (0.600) → model-gap (test rhh_ac05_boundary).
      no_hint_label_accuracy matches the ratio
      no_hint_label_correct / columns_hit from ac-04 for every
      classified family (test rhh_ac05_arithmetic).

  - id: ac-06
    ac_type: code
    description: >
      Domain-level rollup — aggregate classification counts per domain
      into diagnostics/rhh_domain_rollup.tsv. Columns: domain (7 rows —
      container, datetime, finance, geography, identity, representation,
      technology; plus one "cross-domain" row for families that span
      multiple domains), total_families, model_covered, model_gap,
      no_hit, removal_readiness. removal_readiness is "READY" if
      model_gap == 0, "NEEDS_FORTIFICATION" if model_gap > 0, "NO_EVIDENCE"
      if total_families == no_hit.
    verification: >
      File exists, schema matches. Row count = 8 (7 domains + cross-domain)
      unless the inventory has zero cross-domain families, in which case
      row count = 7 and the spec records that fact. Sum of total_families
      across all rows equals the total family count in ac-01. Sum of
      (model_covered + model_gap + no_hit) per row == total_families per
      row. Every removal_readiness value is one of the three defined
      strings. No evidence-prescribing verification — the rollup reports
      whatever the data says.

  - id: ac-07
    ac_type: code
    description: >
      Roadmap synthesis — final artefact diagnostics/rhh_roadmap.tsv. One
      row per family_id, columns: family_id, file, line_start, line_end,
      domain, type_targets, classification, proposed_stage (domain name or
      "cross-domain-stage"), blocked_on (empty, "v19-retrain", or
      "training-data-fortification-<type-or-family>"), notes. proposed_stage
      defaults to the family's domain; cross-domain families get assigned
      to the last domain stage unless a more-specific driver is recorded.
      Families with classification == "model-gap" that target
      finance.currency.amount_* variants get
      blocked_on == "v19-retrain" (the 11 amount-variant arms shipped in
      MADR 0065). Other model-gap families get
      blocked_on == "training-data-fortification-<primary-target>", where
      primary-target is defined as the FIRST type in the family's
      type_targets field (semicolon-split[0]). For single-target families
      this is unambiguous; for multi-target families the first-listed type
      becomes the primary ticket, and secondary targets are recorded in
      the notes field.
    verification: >
      File exists, schema matches. Every family_id from ac-01 appears
      exactly once. Every model-gap family has non-empty blocked_on.
      Every family with domain=="finance" and classification=="model-gap"
      AND type_targets containing "amount_" has blocked_on=="v19-retrain".
      proposed_stage is one of {container, datetime, finance, geography,
      identity, representation, technology, cross-domain-stage}.

  - id: ac-08
    ac_type: doc
    description: >
      Methodology doc at diagnostics/rhh_methodology.md documenting the
      80% threshold rationale, counterfactual measurement approach, the
      single-cfg-gate instrumentation design, known limitations
      (sibling-context attention interaction NOT measured — see spec
      open question 4; per-arm granularity deferred; the 80% threshold
      is a policy choice not a statistical test), and reproducibility
      steps listing every script + invocation order.
    verification: >
      File exists, ≥ 500 words. Contains sections: "Threshold Rationale",
      "Measurement Approach", "Instrumentation Design", "Limitations",
      "Reproducibility". Every script under scripts/rhh/ is listed with
      its purpose and example command.

  - id: ac-09
    ac_type: gate
    description: >
      Reproducibility gate — from a clean checkout on the same machine,
      running `scripts/rhh/regenerate_all.sh` produces byte-identical
      output files for rhh_family_inventory.tsv, rhh_hit_counts.tsv,
      rhh_classification.tsv, rhh_domain_rollup.tsv, rhh_roadmap.tsv.
      rhh_counterfactual.tsv is permitted ≤0 rows of drift on the same
      machine and documented tolerance ≤1% cross-machine (not enforced
      by this spec — documented only).
    verification: >
      Running `scripts/rhh/regenerate_all.sh` twice in a row on the same
      machine produces byte-identical output for the non-FP TSVs
      (rhh_family_inventory.tsv, rhh_hit_counts.tsv, rhh_domain_rollup.tsv,
      rhh_roadmap.tsv). For rhh_counterfactual.tsv AND rhh_classification.tsv
      (which depends on the accuracy ratio derived from counterfactual),
      byte-identical holds on the same machine under deterministic
      inference (seed pinned in the regenerate script, CUDA/Metal
      determinism flags set where possible); if drift is observed, the
      drift is logged in diagnostics/rhh_drift_log.txt with the diff and
      the test fails with a clear message. Checked by sha256 diff in test
      rhh_ac09_reproducibility. The regenerate script is committed and
      executable (chmod +x).

  - id: ac-10
    ac_type: gate
    description: >
      Publication gate — the roadmap output is committed under
      diagnostics/rhh_*.tsv. PR description includes:
      (a) summary table of ac-06 domain rollup,
      (b) the proposed per-domain stage sequence from ac-07,
      (c) explicit list of model-gap families with blocked_on values,
      (d) pointer to rhh_methodology.md.
    verification: >
      PR description (reviewed by /orb:review-pr) contains all four
      sections. All diagnostics/rhh_*.tsv files are staged and tracked
      in git.

  - id: ac-11
    ac_type: doc
    description: >
      MADR 0042 status update — append an "Execution Log" section to
      orbit/decisions/0042-remove-regex-header-hints.md linking this
      spec and noting rhh_roadmap.tsv as the execution artefact. Do
      not change the decision's status field.
    verification: >
      Grep orbit/decisions/0042-remove-regex-header-hints.md for
      "Execution Log" — section present. Section references this spec
      path and rhh_roadmap.tsv.

ontology_schema:
  name: "HeaderHintFamilyInventoryRow"
  description: >
    One row of rhh_family_inventory.tsv — a single rule-based header-hint
    rule family enumerated from FineType source. Granularity matches the
    runtime disambiguation_rule emitter (family, not per-arm).
  fields:
    - name: "family_id"
      type: "string"
      description: >
        Stable identifier matching the runtime disambiguation_rule tag
        (e.g. "header_hint_hardcoded", "header_hint_measurement") or a
        grouped tag for families without a runtime emitter (e.g.
        "header_hint_table" for the top-level match at column.rs:3999,
        "substring_matcher_finance" for domain-grouped h.contains calls).
        Canonical list is ac-01's output, not this spec's prose.
    - name: "rule_family_class"
      type: "string"
      description: >
        One of: match_table, branch, substring, legacy_sense.
    - name: "file"
      type: "string"
      description: "Source file path relative to repo root"
    - name: "line_start"
      type: "integer"
      description: "1-indexed line number where the family's code begins"
    - name: "line_end"
      type: "integer"
      description: "1-indexed line number where the family's code ends"
    - name: "domain"
      type: "string"
      description: >
        One of: container, datetime, finance, geography, identity,
        representation, technology, cross-domain.
    - name: "type_targets"
      type: "string"
      description: >
        Semicolon-separated list of taxonomy types this family promotes
        to (e.g. 'identity.person.email;technology.internet.url').
    - name: "arm_count"
      type: "integer"
      description: >
        Number of distinct arms/call-sites within this family — the
        per-arm detail this spec intentionally does not measure.

evaluation_principles:
  - principle: "Evidence over judgement — 80% threshold is computed, not debated"
    weight: 0.35
  - principle: "Reproducibility — regenerate_all.sh produces deterministic output"
    weight: 0.25
  - principle: "No premature removal — this spec is measurement-only"
    weight: 0.20
  - principle: "Honest classification — model-gap means model-gap, not 'we hope it works'"
    weight: 0.20

exit_conditions:
  - "rhh_roadmap.tsv committed with every family_id classified"
  - "MADR 0042 execution log updated"
  - "PR description contains the four required sections"
  - "All 11 ACs marked [x] in progress.md"

