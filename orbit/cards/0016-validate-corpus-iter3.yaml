feature: "Validate-corpus iter-3 — harness mechanism attribution"
as_a: "data analyst reading the validate-corpus per-mechanism breakdown"
i_want: "the harness to attribute datetime-format failures to format_diversity and code-vs-canonical mismatches to code_vs_canonical (rather than collapsing both into the misclassification catch-all bucket)"
so_that: "iter-2's mechanism-coverage curation work surfaces in the report — currently NYC Taxi's SQL timestamps, GDELT's compact-integer dates, FIFA's '88+2' position ratings, OECD's CODE/LABEL pairs, and S&P 500's GICS Sector all attribute to misclassification, leaving format_diversity and code_vs_canonical at 0/0 despite five datasets being curated specifically to exercise them"

scenarios:
  - name: "Datetime-format failure attributes to format_diversity"
    given: "a column whose GT label is a datetime.* type and whose actual prediction is a different datetime.* type with the same broad family but a different format string (e.g. GT=datetime.timestamp.sql_standard, predicted=datetime.timestamp.iso_8601)"
    when: "make validate-corpus runs"
    then: "the per-mechanism breakdown attributes the failure to format_diversity, not the catch-all misclassification bucket"
    source_lines: "iter-2 validate_corpus.md (delta=+0); NYC Taxi tpep_pickup_datetime + GDELT SQLDATE both surfaced as misclassification despite the iter-2 GT sidecars naming distinct datetime sub-formats"

  - name: "CODE/LABEL pair mismatch attributes to code_vs_canonical"
    given: "a column whose values are a short-form code (e.g. ISO country code, CAMEO event code, GICS sector code) but whose GT label is a canonical/text type, OR conversely values are a long-form name and GT is a code-typed field"
    when: "make validate-corpus runs"
    then: "the failure attributes to code_vs_canonical, surfacing the disagreement between value shape and the canonical-form expectation"
    source_lines: "iter-2: OECD REF_AREA/Reference area pairs, GDELT Actor*CountryCode, FIFA position ratings — all attributed to misclassification"

  - name: "Mechanism-attribution rules are documented + tested"
    given: "the harness's mechanism-attribution code"
    when: "iter-3 ships"
    then: "each mechanism (enum_overfit, format_diversity, misclassification, code_vs_canonical) has a documented attribution rule and at least one regression test, so future re-attribution is intentional rather than incidental"
    source_lines: "iter-2 progress.md notes; the attribution logic is opaque in the iter-1 harness"

maturity: "emerging"

goal: "Extend the validate-corpus harness's per-mechanism attribution logic so format_diversity and code_vs_canonical surface as designed in iter-2's curated datasets. This is a code change to the mechanism-attribution rules in the harness (not corpus growth), pinned by the iter-2 finding that 5 datasets curated specifically for these mechanisms still attributed everything to misclassification. Iter-2's GT sidecars stay byte-unchanged — the test surface for the new attribution rules is already in the corpus."

references:
  - "orbit/specs/2026-04-28-validate-corpus-curation/spec.yaml"
  - "orbit/specs/2026-04-28-validate-corpus-curation/progress.md"
  - "eval/eval_output/validate_corpus.md (iter-2 result: format_diversity=0, code_vs_canonical=0)"
  - "orbit/cards/0015-validate-corpus-curation.yaml"
  - "orbit/decisions/0072-round-trip-pass-as-validate-metric.md"

specs: []
