feature: "Validate-precision corpus curation"
as_a: "data analyst relying on FineType's round-trip precision metric"
i_want: "the validate-precision corpus to grow from 7 datasets toward the 30–50-CSV target so the headline `N of M datasets pass at P=99%` stabilises and movement reflects engine quality rather than corpus shape"
so_that: "drift over releases is interpretable, mechanism counts have statistical weight, and adding a CSV is a PR-only operation against the harness shipped in card 0014"

scenarios:
  - name: "Add a new public-domain CSV to the corpus"
    given: "a candidate dataset (public-domain or SPDX-allowlisted licence) sourced from a verifiable URL"
    when: "the curator opens a PR adding (a) the CSV file under eval/datasets/validate_corpus/csv/, (b) a row in eval/datasets/validate_manifest.csv, (c) a sources.yaml entry with role: validate, (d) a per-column GT sidecar at eval/datasets/validate_corpus/<name>.gt.yaml"
    then: "make validate-corpus picks up the new dataset with no harness code change, the row-hash leakage firewall registers the new rows automatically (compute_row_hashes.py iterates the manifest), and the corpus headline updates on the next make eval-report run"
    source_lines: "spec 2026-04-28-validate-precision-corpus/spec.yaml ac-01/ac-02/ac-03/ac-04"

  - name: "Curation prioritises mechanism coverage, not raw count"
    given: "the iter-1 baseline shows imbalance — e.g. misclassification dominates failure surface, format-diversity is rare"
    when: "the curator picks the next CSV to add"
    then: "the choice prioritises datasets that exercise underrepresented mechanisms (a code-vs-canonical-rich CSV when that bucket has 0 attributions), so the per-mechanism breakdown has statistical signal — not just a higher M with the same shape"
    source_lines: "spec 2026-04-28-validate-precision-corpus/spec.yaml mechanism table"

  - name: "Realism + leakage gates apply uniformly"
    given: "any CSV proposed for validate-corpus inclusion"
    when: "make ci runs against the PR"
    then: "the candidate's columns satisfy MADR 0055 realism floors via scripts/prescreen_eval.py, the candidate's rows are absent from eval/row_hashes.tsv at training time (firewall extension from MADR 0056), and licence is in eval/licence_allowlist.txt — same gates as eval-corpus growth"
    source_lines: "MADR 0055/0056; spec ac-03"

maturity: "emerging"

goal: "Grow the validate-precision corpus from the 7 datasets shipped in card 0014 / iter-1 toward the 30–50-CSV target named in that spec's goal statement, prioritising datasets that exercise underrepresented failure mechanisms (code_vs_canonical, format_diversity) so the per-mechanism breakdown has statistical weight beyond iter-1's small sample. Each addition is a 4-file PR (CSV + manifest row + sources.yaml entry + GT sidecar) — no harness code change — exercising the harness contract delivered in card 0014. The card stays emerging until the corpus reaches ≥20 datasets with ≥1 column per mechanism category surfaced."

references:
  - "orbit/specs/2026-04-28-validate-precision-corpus/spec.yaml"
  - "orbit/specs/2026-04-28-validate-precision-corpus/interview.md"
  - "orbit/cards/0014-profile-validate-precision.yaml"
  - "orbit/decisions/0055-eval-realism-dimensions.md"
  - "orbit/decisions/0056-train-eval-leakage-prevention.md"
  - "orbit/decisions/0057-eval-coverage-floor.md"
  - "orbit/decisions/0072-round-trip-pass-as-validate-metric.md"
  - "orbit/decisions/0073-validate-corpus-reuses-m19-infrastructure.md"
  - "orbit/decisions/0074-validate-corpus-in-scope-fix-mechanisms.md"

specs:
  - "orbit/specs/2026-04-28-validate-corpus-curation/spec.yaml"
