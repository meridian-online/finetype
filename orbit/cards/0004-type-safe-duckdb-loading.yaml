feature: "Type-safe DuckDB loading"
as_a: "data analyst"
i_want: "to generate a runnable DuckDB CREATE TABLE statement from a CSV file, with correct column types inferred automatically"
so_that: "I can load data with proper types in one pipeline command instead of writing DDL by hand"

# RETIREMENT NOTICE
# As of v0.6.19 the `finetype load` verb is being folded into `finetype validate`.
# The capability — CSV → typed DuckDB table — moves to card 0005, where validate's
# CTAS projection applies per-column transforms keyed by x-finetype-label instead
# of emitting SELECT * pass-through VARCHAR. Today's middle artefact (validate's
# VARCHAR-only valid table) is a waste shape; folding eliminates it.
#
# The scenarios below remain as historical record of what `load` did.
# See orbit/memos/2026-04-27-load-folds-into-validate.md for the rationale,
# and orbit/specs/2026-04-27-cli-pipeline-reshape/ for the migration spec.

scenarios:
  - name: "Generate and execute CREATE TABLE (historical)"
    given: "a CSV file with columns of mixed types"
    when: "I ran finetype load -f data.csv | duckdb (≤ v0.6.18)"
    then: "FineType profiled the file, generated a CREATE TABLE AS SELECT with type-correct casts, and piped it to DuckDB for execution"
    source_lines: "README.md (≤ v0.6.18): finetype load -f data.csv | duckdb"

  - name: "Transformation contracts guarantee safe casts (historical)"
    given: "a column detected as datetime.date.mdy_slash"
    when: "the load command generated SQL"
    then: "the transform expression strptime(col, '%m/%d/%Y')::DATE was guaranteed to succeed on the detected values (99.9% actionability) — same contract now applied by validate"
    source_lines: "README.md: Each type is a transformation contract"

  - name: "Custom table name (historical)"
    given: "a CSV file"
    when: "I ran finetype load -f data.csv --table-name my_table"
    then: "the generated DDL used the specified table name — replaced by validate's --table flag"
    source_lines: "CLAUDE.md (≤ v0.6.18): finetype load <file> (--table-name, --limit N, ...)"

  - name: "Column name normalisation (historical)"
    given: "a CSV with messy column headers"
    when: "I ran finetype load"
    then: "column names were normalised to DuckDB-safe identifiers by default — behaviour preserved in validate"
    source_lines: "CLAUDE.md (≤ v0.6.18): finetype load <file> (--no-normalize-names)"

maturity: "retired"
superseded_by: "0005-schema-driven-data-validation"
goal: "Capability folds into validate (card 0005) — CSV → typed DuckDB table is now one verb, not two"

specs:
  - "orbit/specs/2026-04-27-cli-pipeline-reshape/"  # planned (v0.6.19) — retires `load`

references:
  - "README.md"
  - "CLAUDE.md"
  - "orbit/decisions/0036-delegate-normalize-names-to-duckdb.md"
  - "orbit/memos/2026-04-27-load-folds-into-validate.md"
  - "orbit/memos/2026-04-27-load-rethink-as-transform.md"  # superseded alternative
