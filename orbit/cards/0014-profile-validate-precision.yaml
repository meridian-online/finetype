feature: "Profile-validate precision corpus"
as_a: "data analyst working with FineType"
i_want: "profile and validate to behave as a self-consistent pair — when I profile a clean CSV and validate the same CSV against its inferred schema, most rows pass — and when they don't, the failure attributes to a named, fixable mechanism"
so_that: "I can trust the CLI's headline workflow (profile → schema → validate) without learning when it silently lies, and FineType ships measurable round-trip quality alongside its profile-eval and actionability-eval headlines"

scenarios:
  - name: "Round-trip pass on a clean CSV"
    given: "a real-world CSV (e.g. airports.csv) and the schema produced by `finetype profile -f data.csv -o json-schema`"
    when: "I run `finetype validate -f data.csv --schema schema.json`"
    then: "≥99% of rows validate; the dataset is recorded as a pass in the corpus harness output. Today (2026-04-28) airports.csv yields 0/7698 valid rows — that's the bug we're closing."
    source_lines: "orbit/specs/2026-04-28-validate-precision-corpus/interview.md Q1; airports.csv evidence at session start"

  - name: "Failures attribute to a named mechanism"
    given: "a corpus CSV that fails round-trip + a per-column ground-truth label sidecar"
    when: "the harness diagnoses each failing column"
    then: "every failing column is attributed to one of four mechanisms — enum-overfit, validator-format-diversity, misclassification, or code-vs-canonical — using the MADR 0071 reject ontology (error_type, constraint_failed) plus GT comparison"
    source_lines: "interview.md Q10; MADR 0071 reject ontology; airports.csv breakdown (utc_offset/timezone/dst/name)"

  - name: "Harness runs as a make target alongside profile-eval"
    given: "a built FineType binary and the validate-precision corpus on disk"
    when: "I run `make validate-corpus` (and `make eval-report`)"
    then: "the harness runs profile→validate on every corpus CSV, emits a per-dataset report and a corpus-level summary (`N of M datasets pass at P=99%`), and the dashboard surfaces the headline alongside profile-eval and actionability"
    source_lines: "interview.md Q9; eval/eval_output/report.md as the existing dashboard pattern"

  - name: "Enum-overfit is bounded by sample evidence"
    given: "a CSV column with 100 sampled rows and 12 distinct values inferred as a categorical"
    when: "`finetype profile -f data.csv -o json-schema` emits the schema for that column"
    then: "no `enum` constraint is emitted unless sample size + cardinality cross a confidence threshold — schema may carry the inferred label but not freeze a value list that real data will violate"
    source_lines: "interview.md Q6; airports.csv timezone column (12-value enum frozen, 7686 rows fail)"

  - name: "Validator format-diversity widens with corpus evidence"
    given: "a real-world column whose values are valid by intent but reject under the current narrow validator (e.g. utc_offset='10' rejecting against `^UTC [+-]\\d{2}:\\d{2}$`)"
    when: "the corpus surfaces the format-diversity gap and a taxonomy fix lands"
    then: "validation accepts the broader real-world format while preserving precision elsewhere; the harness re-run shows the dataset pass status flip from fail to pass"
    source_lines: "interview.md Q6; airports.csv utc_offset='10' rejecting"

  - name: "Movement-based sprint reporting"
    given: "baseline corpus measurement before in-scope fixes and post-fix measurement after enum-overfit + validator-format-diversity work lands"
    when: "I read the dashboard"
    then: "the report names the baseline (`N₀ of M datasets pass`) and the post-fix delta (`+N datasets`) — sprint success is the documented improvement, not an absolute target, since misclassification and code-vs-canonical are deferred"
    source_lines: "interview.md Q5, Q7"

  - name: "Corpus joins the m-19 leakage firewall"
    given: "a corpus CSV being added to the validate-precision corpus"
    when: "the manifest is updated"
    then: "the CSV's source is registered in `eval/datasets/sources.yaml` with `role=validate`, the row-hash leakage check (`scripts/eval_leakage/`) treats validate-corpus rows as forbidden in training data, and the per-column MADR 0055 floors apply"
    source_lines: "interview.md Q8; MADR 0055 / 0056 / 0057"

  - name: "Ground-truth sidecar is the diagnostic anchor"
    given: "a corpus CSV in the manifest"
    when: "the corpus is built"
    then: "a per-column ground-truth label sidecar exists alongside the CSV (column → expected x-finetype-label) — the harness uses it to distinguish 'profile picked the wrong label' from 'profile picked the right label, validator was wrong'"
    source_lines: "interview.md Q10"

maturity: "emerging"
goal: "Profile→validate is a self-consistent pair: round-trip pass at P=99% is the contract; failures attribute to one of four named mechanisms; the harness runs via `make validate-corpus` against a 30–50-CSV real-world corpus; enum-overfit (profile-side) and validator-format-diversity (taxonomy-side) ship as in-scope sprint fixes; misclassification and code-vs-canonical defer to follow-up cards."

