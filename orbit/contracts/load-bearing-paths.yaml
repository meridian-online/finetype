# Load-bearing paths registry
#
# Files in this registry require the B07 consumer-graph audit protocol
# from the active autonomy contract before any Edit/Write. The H03 halt
# enforces the protocol — a commit touching a registered path without a
# corresponding cycle-log audit entry triggers immediate revert.
#
# A path enters the registry when:
#   1. It has ≥ 1 downstream consumer that parses it positionally or
#      with implicit schema assumptions (m-19's bash positional read
#      lesson), OR
#   2. Editing it can produce parseable but semantically wrong content
#      (taxonomy YAML, training data manifests), OR
#   3. It defines compile-time or load-time invariants
#      (Cargo.toml, schema files, model registry symlink).
#
# A path leaves the registry only via tabletop discussion and an
# explicit removal note in this file's history.
#
# `consumers` lists known consumers + their tolerance class:
#   tolerant — uses tolerant parser (e.g. csv::Reader.get(i),
#              dict-keyed access)
#   fragile  — positional bash read, hardcoded indices, implicit schema
#   unknown  — needs reading on first edit
#
# Authored 2026-05-03 alongside
# `2026-05-03-gittables-90-percent-roundtrip.yaml`. Initial entries
# pulled from m-19 (ac-15) consumer inventory + scenarios 4 + scribe-pass
# audit of compile-time / load-time files.

registry:
  - path: labels/definitions_container.yaml
    rationale: taxonomy definition; compile-time invariants
              (240-class model coupling)
    consumers:
      - {path: crates/finetype-core/src/taxonomy.rs, class: tolerant}
      - {path: scripts/check_taxonomy.sh, class: fragile, notes: "calls finetype check"}
      - {path: crates/finetype-train/src/data.rs, class: tolerant}

  - path: labels/definitions_datetime.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: labels/definitions_finance.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: labels/definitions_geography.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: labels/definitions_identity.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: labels/definitions_representation.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: labels/definitions_technology.yaml
    rationale: taxonomy definition
    consumers: same-as labels/definitions_container.yaml

  - path: eval/datasets/manifest.csv
    rationale: |
      m-19 (ac-15) demonstrated silent positional-parser corruption
      on schema migration. 7-column schema enforced via
      eval/licence_allowlist.txt and ISO-8601 fetched_date.
    consumers:
      - {path: eval/profile_eval.sh, class: fragile,
         notes: "lines 78 + 148 — bash read -r with all 7 fields named"}
      - {path: crates/finetype-train/src/data.rs:790, class: tolerant,
         notes: "load_profile_columns() — record.get(0..3) + .get(3)"}
      - {path: crates/finetype-eval/src/bin/eval_mapping.rs:175,
         class: tolerant}
      - {path: crates/finetype-cli/src/bin/extract_features.rs:34,
         class: tolerant}
      - {path: crates/finetype-eval/src/bin/eval_actionability.rs:115,
         class: tolerant, notes: "load_csv() helper — spot-check
         on first edit"}
      - {path: crates/finetype-train/src/bin/prepare_sense_data.rs:52,
         class: tolerant}
      - {path: research/prepare.py:945, class: unknown,
         notes: "profile_eval() — re-verify on first touch"}

  - path: eval/datasets/sources.yaml
    rationale: |
      role-manifest layer per MADR 0056. Determines train | eval |
      both-forbidden disposition; mis-edit can cause silent
      train/eval contamination.
    consumers:
      - {path: scripts/eval_leakage/__init__.py, class: tolerant}
      - {path: scripts/prepare_multibranch_data.py, class: tolerant}
      - {path: scripts/eval_coverage_check.py, class: tolerant}

  - path: scripts/prescreen_eval.py
    rationale: pre-screen logic; floors anchored in MADR 0055
    consumers:
      - {path: orbit/decisions/0055-eval-realism-dimensions.md,
         class: tolerant, notes: "doc cross-reference"}
      - {path: eval/pre-screen_floors.yaml, class: tolerant,
         notes: "configuration data — co-edited"}

  - path: scripts/eval_leakage/__init__.py
    rationale: |
      shared normaliser (NORMALISER_VERSION). Changes to normalise
      semantics invalidate row_hashes.tsv; need version-bump
      coordination.
    consumers:
      - {path: scripts/compute_row_hashes.py, class: tolerant}
      - {path: scripts/prepare_multibranch_data.py, class: tolerant}
      - {path: scripts/eval_leakage/test_normaliser.py, class: tolerant,
         notes: "planted-collision test"}
      - {path: scripts/eval_leakage/test_filter_pipeline.py,
         class: tolerant}

  - path: scripts/prepare_multibranch_data.py
    rationale: training-data prep; row-hash filter is leakage gate
    consumers:
      - {path: Makefile, class: fragile, notes: "training targets"}
      - {path: scripts/sweep_v17.sh, class: fragile}

  - path: Cargo.toml
    rationale: workspace dependency tree; compile-time
    consumers:
      - {path: "crates/*/Cargo.toml", class: tolerant,
         notes: "workspace inheritance"}

  - path: crates/finetype-cli/Cargo.toml
    rationale: CLI binary deps; compile-time + release-binary scope
    consumers:
      - {path: scripts/release.sh, class: fragile,
         notes: "binary names + features"}

  - path: crates/finetype-core/Cargo.toml
    rationale: core deps; compile-time
    consumers: workspace-wide

  - path: crates/finetype-duckdb/Cargo.toml
    rationale: DuckDB extension; community-extension scope
    consumers:
      - {path: ".github/workflows/duckdb-extension.yml",
         class: fragile, notes: "build matrix"}

  - path: Makefile
    rationale: |
      orchestrates make ci, make eval-report, training targets;
      target deletion or rename silently breaks CI + downstream.
    consumers:
      - {path: ".github/workflows/ci.yml", class: fragile}
      - {path: ".github/workflows/release.yml", class: fragile}
      - {path: orbit/specs/*/spec.yaml, class: tolerant,
         notes: "ACs reference make targets by name"}

  - path: models/default
    rationale: |
      symlink — never the target file. Promotion via B08 swaps the
      symlink; halt H10 forbids the underlying binary entering git.
      Re-link only via cycle promotion path.
    consumers:
      - {path: crates/finetype-cli/src/lib.rs, class: tolerant,
         notes: "model loader resolves symlink"}

  - path: .github/workflows/ci.yml
    rationale: |
      CI is the load-bearing post-push gate (no PR review).
      Misedit can silently disable a check.
    consumers:
      - {path: github actions runner, class: fragile,
         notes: "every push triggers"}

  - path: .github/workflows/release.yml
    rationale: release automation; versioned-binary distribution
    consumers:
      - {path: github actions runner, class: fragile}
      - {path: scripts/release.sh, class: fragile}

  - path: orbit/contracts/2026-05-03-gittables-90-percent-roundtrip.yaml
    rationale: |
      THIS contract — self-edit by the cron agent must surface to
      tabletop. Direct edit forbidden between tabletops.
    consumers:
      - {path: cron agent, class: fragile,
         notes: "reads contract at cycle start"}

  - path: orbit/contracts/load-bearing-paths.yaml
    rationale: |
      THIS file — adding/removing entries shifts the H03 halt
      surface. Edit only via tabletop.
    consumers:
      - {path: cron agent, class: fragile, notes: "B07 protocol"}

