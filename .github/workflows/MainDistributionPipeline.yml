name: DuckDB Extension Distribution

# Builds the finetype.duckdb_extension for the platforms the project
# distributes, using the same reusable workflow + build contract the
# duckdb/community-extensions CI uses when it rebuilds the registered
# extension. A green run here proves a tagged ref is buildable by community
# CI without manual steps. See spec 2026-06-02-duckdb-extension-republish.
#
# This is a PROOF, not the release path: it uploads to GitHub Actions
# artifacts, which expire, and nothing downstream reads them. release.yml
# calls this same reusable workflow again on the same tag, in its own run, and
# attaches THAT build's binaries to the GitHub release as durable, checksummed
# assets — see its `build-extension` job for why a second build rather than a
# cross-run artifact fetch.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      # Latest stable DuckDB. The artifact is stamped with the stable C API
      # (C_STRUCT) at the v1.2.0 floor by the in-tree Makefile, so one binary
      # loads on DuckDB 1.2 through 1.5+ regardless of this build target.
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: finetype
      # The Rust toolchain builds the cdylib; python3 backs the metadata-stamp
      # venv and the sqllogictest test runner.
      extra_toolchains: 'rust;python3'
      # Distribute Linux x86/arm, macOS x86/arm, Windows amd64. Everything else
      # is excluded: wasm_* and linux_amd64_musl per the community registry,
      # plus linux_arm64_musl, windows_arm64, and windows_amd64_mingw which the
      # project does not ship.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl;windows_arm64;windows_amd64_mingw'

  # The version each of those five binaries actually carries, read off its own
  # bytes after the build that produced it.
  #
  # WHY HERE AND NOT ONLY IN release.yml. The build contract derives the stamp
  # from git — the tag at HEAD, or that commit's abbreviated sha when there is
  # none — and for months it derived nothing at all, because a committed
  # configure/extension_version.txt arrived with every checkout and the rule
  # that would rewrite it has no prerequisites. release.yml can only refuse that
  # on a tag, a few days a year, at the moment it is least welcome to be wrong.
  # This job asks the same question of every pull request and every push, where
  # the expected answer is the abbreviated commit. `0.6.23` abbreviates no
  # commit, so the defect fails here on any diff at all.
  #
  # WHAT IT DOES NOT COVER: the community-extensions rebuild. duckdb/community-
  # extensions runs this same reusable workflow in its own repository, where no
  # job of ours can run. What travels there is the build contract in the
  # Makefile, which this job is the standing evidence for.
  stamp:
    name: Each binary carries the version of the ref it was built from
    needs: duckdb-stable-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No merge-multiple: all five artifacts hold a file called
      # finetype.duckdb_extension, so flattening would leave one. Each stays in
      # artifacts/<artifact-name>/ and the glob below reads them back out.
      - uses: actions/download-artifact@v4
        with:
          pattern: finetype-v1.5.3-extension-*
          path: artifacts

      - name: Read the stamp off each binary
        shell: bash
        run: |
          shopt -s nullglob
          files=(artifacts/*/finetype.duckdb_extension)
          if [ "${#files[@]}" -ne 5 ]; then
            echo "::error::expected 5 extension binaries, found ${#files[@]}" >&2
            exit 1
          fi
          args=()
          for f in "${files[@]}"; do args+=(--artifact "$f"); done
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            scripts/check_extension_stamp.py "${args[@]}" --tag "${GITHUB_REF_NAME}"
          else
            scripts/check_extension_stamp.py "${args[@]}" --expect-commit "${GITHUB_SHA}"
          fi
