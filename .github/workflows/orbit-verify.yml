# orbit-state v0.1 CI gates.
#
# - ac-16 (round-trip): every canonical YAML under .orbit/{specs,cards,choices,
#   memories} plus schema-version round-trips byte-identical via the canonical
#   writer. Failure blocks merge.
# - ac-17 (verify):     the SQLite index rebuilds from files alone with no
#   parse failures. Failure blocks merge.
#
# Builds the orbit binary from hughcameron/orbit's orbit-state workspace per
# run. Once chezmoi-distributed binaries are available, switch this step to a
# pinned-binary download.

name: orbit verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout finetype
        uses: actions/checkout@v4

      - name: Checkout orbit (orbit-state source)
        uses: actions/checkout@v4
        with:
          repository: hughcameron/orbit
          path: .orbit-source
          ref: main

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ""

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .orbit-source/orbit-state/target
          key: ${{ runner.os }}-orbit-state-${{ hashFiles('.orbit-source/orbit-state/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-orbit-state-

      - name: Build orbit binary
        run: cargo build --bin orbit --release
        working-directory: .orbit-source/orbit-state

      - name: orbit verify (ac-16 round-trip + ac-17 index rebuild)
        run: .orbit-source/orbit-state/target/release/orbit --root . verify
