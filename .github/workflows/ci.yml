name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # CI's authoritative model name. Read only by .github/scripts/download-model.sh.
  # See specs/2026-04-20-ci-decouple-default-symlink/spec.yaml for the promotion flow.
  FINETYPE_CI_MODEL: m2v8m-s43

jobs:
  gate-routing:
    # A fast, toolchain-free early signal: the manifest, the tree and the
    # workflow still agree. It publishes nothing and nothing depends on it.
    #
    # It is NOT where the audit becomes blocking. This job is not a required
    # context, and a pull request whose only red job is unrequired reports
    # UNSTABLE, which is mergeable. `plan` re-runs the audit inside every job
    # that routes, two of which ARE required contexts, and that is what blocks.
    # This one just fails in eight seconds instead of four minutes.
    name: Gate self-test routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Every gate self-test is registered, guarded and reachable
        run: .github/scripts/gate-self-tests.py audit

  gate-routing-self-test:
    # The router is a gate, so it is routed like one. Its own proof builds
    # scratch repositories and requires each audit rule to redden against a tree
    # that violates it — a guard inverted to `== 'false'`, a guard sitting above
    # the step that sets it, a job condition that could skip a proof.
    name: Gate routing self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # Routing happens INSIDE each job that carries a proof, rather than in
        # one job the others depend on. Measured on a probe pull request: when a
        # shared routing job failed, its dependants were SKIPPED, and a required
        # status check that is skipped SATISFIES branch protection -- the pull
        # request reported UNSTABLE, which is mergeable, not BLOCKED. Two of the
        # five required contexts here were among them, so the arrangement that
        # routes proofs also weakened the checks that gate a merge.
        #
        # This step runs the audit before it plans, which is what makes the audit
        # blocking: it runs inside required contexts, so a routing defect reddens
        # a check branch protection reads.
        #
        # A pull request is measured against the commit it targets, a push to
        # main against the tip it replaced. The shallow checkout has neither, so
        # the router fetches the base at depth 1 and compares the two trees. An
        # empty, absent or unfetchable base routes EVERY gate and says so.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The routing detects a routing that would silently skip a proof
        if: steps.route.outputs.gate_routing == 'true'
        run: .github/scripts/gate-self-tests.py --self-test

  public-hygiene:
    # Toolchain-free: it is `git grep` over tracked files and finishes in
    # seconds, so a path into the private planning repo, or an absolute home
    # directory, goes red long before the crate build has resolved a dependency.
    # It depends on no other job, which is deliberate — see the routing step
    # below.
    #
    # THE NAME IS A CONTRACT, not a label. `Private paths in tracked files` is a
    # required status check in this repository's branch protection, so a job with
    # any other name cannot satisfy it: renaming this one leaves the required
    # context permanently unposted and every pull request BLOCKED, which is a
    # state no amount of green elsewhere clears. That is why the commit-message
    # and pull request surfaces are the job BELOW rather than more steps here,
    # even though they share a rule list with this one. Changing the required set
    # is a branch-protection edit, and that is repository configuration.
    name: Private paths in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      # The gate's own regression test runs FIRST when it runs at all. A hygiene
      # gate fails silently in both directions — it can stop matching, or start
      # matching honest prose — so "the gate still works" has to be established
      # before "the tree is clean" means anything. Both directions were live
      # defects when this self-test was first run against the gate it tests.
      # Routed: only a diff that touches the gate, its rules, its allowlist, its
      # accepted record or its fixture can have broken it.
      - name: hygiene gate self-test
        if: steps.route.outputs.public_hygiene == 'true'
        run: ./scripts/check-public-hygiene-selftest.sh
      - name: private planning paths and absolute home paths
        run: ./scripts/check-public-hygiene.sh

  history-hygiene:
    # The two surfaces the job above cannot see: the message of every commit
    # reachable from HEAD, and the pull request's own title and body. Same rule
    # list, scripts/public-hygiene-rules.txt, read by the other gate — splitting
    # the rules is how this surface came to be uncovered while tracked files were
    # gated, and 137 commits reached main carrying a reference the other gate
    # would have refused in a file.
    #
    # A SEPARATE JOB, not more steps above, because the job above carries a
    # required-context name and this one does not yet. It also keeps the full
    # fetch out of the required job's critical path.
    #
    # NOT a required status check. Adding it to the required set is a
    # branch-protection edit, which is repository configuration rather than
    # anything a workflow file can do.
    name: Private references in commit messages and pull request text
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit-message scan reads every message reachable from HEAD and
          # verifies scripts/public-hygiene-accepted-history.txt against them.
          # Under the default shallow checkout it would see one commit, find
          # nothing, and report all 146 records unreachable — a gate reporting on
          # a history it cannot see. ~190 MB and 1,484 commits, seconds here.
          fetch-depth: 0
      - name: Which gates this diff changed
        id: route
        # Its own routing step. No job may depend on another for this; see the
        # identical step in `gate-routing-self-test` for the measurement that
        # settled it.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: history hygiene gate self-test
        if: steps.route.outputs.history_hygiene == 'true'
        run: ./scripts/check-history-hygiene-selftest.sh
      - name: private references in commit messages
        run: ./scripts/check-history-hygiene.sh
      # The pull request's own text, which is not in the repository and so is in
      # neither scan. Passed through the environment rather than interpolated
      # into the script: `${{ }}` inside a `run:` substitutes before the shell
      # sees it, so a title containing a quote or a backtick would be executed
      # rather than scanned.
      #
      # This reads the body AS OF THE EVENT THAT STARTED THIS RUN. A body edited
      # afterwards is read by .github/workflows/pr-text-hygiene.yml, which
      # triggers on `edited` and runs this one step; that trigger is not here
      # because it would re-run every job in this file on every typo fix. That
      # the other workflow exists, triggers on `edited` and runs this same
      # `--text` mode is a case in check-history-hygiene-selftest.sh, which the
      # step above runs — the sentence was true and unchecked for as long as it
      # had been written.
      - name: private references in the pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" >"$RUNNER_TEMP/pr-text.txt"
          ./scripts/check-history-hygiene.sh --text "$RUNNER_TEMP/pr-text.txt"

  formula-asset:
    # The odd job here: the check it covers cannot run on a pull request at all.
    # scripts/check-formula-asset.sh addresses a published release through the
    # rewritten tap formula, and there is no release on a branch — so the check
    # lives in release.yml and its credibility lives here.
    #
    # That split is the whole point. A check that runs on a tag and nowhere else
    # is exercised a handful of times a year, always at the moment it is least
    # welcome to be wrong. These two stand a loopback HTTP server in front of
    # throwaway assets and prove — with no network beyond localhost and no
    # toolchain — that a wrong checksum, an unresolvable url and a lost platform
    # block each still turn it red, and that a self-test saying so can still
    # tell a broken check from a working one.
    #
    # WHEN, precisely: on a pull request whose diff touches the check or either
    # harness, and on any diff that changes the routing itself. Not on every
    # pull request; the sentence below is the one that is true.
    #
    # Every step here is a proof rather than a check, so every step is routed:
    # a diff that leaves `scripts/check-formula-asset.sh` and its two harnesses
    # alone runs none of them, and the job costs its checkout and nothing more.
    name: Tap formula asset check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The check reddens on a bad checksum, a 404 and a missing block
        if: steps.route.outputs.formula_asset == 'true'
        run: ./scripts/check-formula-asset-selftest.sh
      - name: ...and the self-test detects deliberately broken copies of the check
        # A self-test is only worth its exit code if it can still see a failure.
        # Seven broken checks — always-exit-0, the digest comparison removed,
        # the loop stopped after the first pair, the HTTP status ignored, the
        # minimum-pairs guard removed, a parser that keeps only the last pair,
        # and one that reads the first and last and skips the middle — each
        # must make the step above go red.
        #
        # The check's closing reconciliation cannot be proved that way. No
        # formula can make it fire while the fetch loop is correct, so removing
        # it changes nothing the self-test observes. This step asserts on it
        # directly instead, against copies of the check whose loop already
        # skips — one of which reports clean at exit 0, having fetched nothing,
        # the moment the reconciliation is taken out.
        if: steps.route.outputs.formula_asset == 'true'
        run: ./scripts/check-formula-asset-mutations.sh

  schema-catalogue:
    # Same shape as `formula-asset` above, and for the same reason: the check
    # this proves (scripts/check_schema_catalogue.py) reads a release asset
    # that release.yml generates from labels/definitions_*.yaml, and there is
    # no release on a branch — so the check itself runs only on a tag, and its
    # credibility runs here on any pull request whose diff touches
    # scripts/check_schema_catalogue.py, which is the path
    # .github/gate-self-tests.tsv's row for this gate watches. A pull request
    # touching neither that script nor the routing skips this proof.
    # `--self-test` mutates
    # synthetic catalogues in-process (an emptied array, entries that keep
    # their label but lose every checkable keyword, entries that keep a
    # keyword but lose their label) and requires the check to redden on each,
    # then re-runs them through the script as a subprocess and requires the
    # exit code this job reads to be 1 rather than only the verdict to be
    # right.
    name: Taxonomy schema catalogue check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The check reddens on an emptied catalogue and on entries missing a label or a checkable keyword
        if: steps.route.outputs.schema_catalogue == 'true'
        run: python3 scripts/check_schema_catalogue.py --self-test

  model-coverage:
    # Same shape again: scripts/check_model_coverage.py reads the catalogue
    # release.yml generates alongside the model's label_map.json it downloaded
    # for that same tag, and both only exist together in a release job. The
    # self-test proves the two failure directions AC6 names, against synthetic
    # three-label inputs: a catalogue emptied to `[]` measures 0.0, and a label
    # map carrying labels the catalogue does not mention measures a fraction
    # the gate's MIN_COVERAGE threshold refuses. It then re-runs both through
    # the script as a subprocess and requires exit 1, because measuring the
    # right fraction and acting on it are two different things and only the
    # second is what this job reads.
    name: Model coverage check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The check reddens on a label map carrying labels the catalogue does not mention
        if: steps.route.outputs.model_coverage == 'true'
        run: python3 scripts/check_model_coverage.py --self-test

  release-asset-assembly:
    # Same shape again: release.yml's `release` job is the only real caller of
    # .github/scripts/assemble-release-assets.sh, and it only runs on a pushed
    # tag. Its `--self-test` builds a synthetic `artifacts/` tree standing in
    # for what `actions/download-artifact` (no merge-multiple) produces, and
    # requires the script itself to: assemble all 24 expected files with each
    # extension binary traced back to its own platform (no cross-platform
    # collision), refuse with exit 1 when one platform's extension artifact is
    # missing rather than silently shipping four, refuse with exit 3 when an
    # artifact arrives for a platform its arch-to-target mapping does not name
    # rather than dropping it, and write every sidecar in a form
    # `shasum -a 256 -c` verifies from the directory a downloader unpacked
    # into.
    name: Release asset assembly check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The script reddens on a missing platform and assembles collision-free otherwise
        if: steps.route.outputs.release_asset_assembly == 'true'
        run: ./.github/scripts/assemble-release-assets.sh --self-test

  release-asset-contract:
    # The third link, and now the second as well. assemble-release-assets.sh
    # guards the artifacts tree, and closing that is what makes the other two
    # dangerous: delete an entry from the release step's `files:` list and every
    # other check here stays green while the tag publishes without it.
    # `fail_on_unmatched_files: true` fires on an entry that is present and
    # matches nothing, never on one that is gone. `if-no-files-found: error`
    # fires only when the UNION of an upload's globs comes up empty, so dropping
    # one of three is silent -- which is how the CLI archives came to be
    # publishable with no checksum beside them. This job runs the assembler for
    # real, over a tree filtered through the upload globs release.yml declares,
    # and requires every one of those globs to be load-bearing.
    name: Release asset contract check
    runs-on: ubuntu-latest
    # 10 rather than 5: the self-test below now runs the assembler once per
    # declared upload glob per case (~50s on a laptop). The ceiling is here to
    # catch a hang, not to budget the work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The release step ships exactly what the assembler assembles
        if: steps.route.outputs.release_asset_contract == 'true'
        run: python3 scripts/check_release_asset_contract.py
      - name: ...and the contract check reddens when the release step drops an asset
        if: steps.route.outputs.release_asset_contract == 'true'
        run: python3 scripts/check_release_asset_contract.py --self-test

  download-model-test:
    name: download-model.sh tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run resolution test harness
        run: .github/scripts/test-download-model.sh

  drift-check:
    name: CI model vs symlink drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Check for drift between FINETYPE_CI_MODEL and models/default
        run: .github/scripts/check-ci-model-drift.sh

      - name: ...and the drift gate detects a planted drift
        # The step above is only known to pass. This one runs the same script
        # over scratch trees it builds: a planted drift in the symlink form and
        # in the plain-text form git leaves on Windows, a target differing only
        # by a path component (which a basename comparison would call aligned),
        # a models/default that resolves to no name, and a whitespace pin —
        # each held to an exit status AND a message, since a status alone
        # cannot tell a refusal from a crash. The aligned trees, FINETYPE_CI_MODEL
        # unset among them, are asserted green in the same run, or the catches
        # are noise.
        if: steps.route.outputs.ci_model_drift == 'true'
        run: .github/scripts/check-ci-model-drift.sh --self-test

  evidence:
    name: Fixture manifest + scorer failure propagation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Manifest self-consistency
        # Fails if a recorded score isn't its own correct/scored, if a bar has no
        # source, if a registered fixture file was edited without a new version
        # being registered, if a fixture does not name the taxonomy version its
        # labels were adjudicated under, if evidence/ has grown past its budget or
        # taken on a non-text artefact, or if a committed release report has drifted
        # from the manifest it is generated from.
        run: scripts/evidence.py verify
      - name: evidence/ stays small, text-only and true to the manifest
        run: scripts/test_evidence.sh
      - name: The evidence suite detects a wrong evidence.py
        # Six realistic wrong implementations — a renderer that ignores a recorded
        # taxonomy stamp, one that claims a stamp no baseline carries, a
        # record-baseline that drops the flag, a delta table that loses the column
        # telling two of its rows apart, and each of the TWO independent report-drift
        # comparisons short-circuited. Each must redden a case aimed at it. Without
        # this the suite above is only known to pass, never known to detect.
        #
        # The longest-running proof in this file, and the clearest case for
        # routing it: the two steps above are the gate and keep running on every
        # diff; this one answers for a change to `scripts/evidence.py` or to
        # either harness, and nothing else can invalidate it.
        if: steps.route.outputs.evidence == 'true'
        run: scripts/test_evidence_mutations.sh
      - name: Scorer propagates failures and stamps every score with its fixture
        run: scripts/test_score_clean_label.sh

      - name: Documented taxonomy counts match labels/definitions_*.yaml
        # Nothing else in CI reads documentation, so a wrong number in prose is
        # invisible to sixteen green checks. This derives the counts from the
        # taxonomy files the build embeds and fails if a documented one differs —
        # the headline AND the per-domain table, row by row, so the two cannot
        # drift apart from each other or from the data. Bolted onto this job
        # rather than given its own: it costs a stdlib-python second, and this is
        # already the job that asks whether a document still agrees with the data
        # it was generated from.
        run: scripts/check_doc_taxonomy_counts.py

      - name: ...and the count gate detects a wrong number
        # A gate that is only known to pass is not known to detect. Twenty-five
        # mutations against a scratch copy — a drifting headline, a drifting table
        # row, two rows SWAPPED so the sum still matches the headline, a definition
        # added or deleted behind the docs' back, a claim reworded out of the
        # registry, a brand-new unregistered claim, a second table nothing reads,
        # a domain file that ships without being counted, a locale table row that
        # goes stale, a row corrected in its headline but not in its `[+N more]`
        # remainder, a region heading that disagrees with its own list — each must
        # redden a NAMED case, and the unmutated tree must pass or every "caught"
        # above is noise.
        if: steps.route.outputs.doc_taxonomy_counts == 'true'
        run: scripts/check_doc_taxonomy_counts.py --self-test

      - name: Comment citations resolve
        # The count gates read documentation; this reads COMMENTS, which is the
        # other place prose goes wrong. Two checks on the lines this branch
        # ADDED: a symbol attributed to a named crate must actually be defined
        # there, and a backticked repo path must exist.
        #
        # THIS FILE IS IN SCOPE. A comment in a workflow is an instruction an
        # agent acts on, so a present-tense pointer at a path that has moved is
        # indistinguishable from an instruction to use it. SYNTAX and
        # SYNTAX_BY_NAME in the script name what it opens.
        #
        # fetch-depth 0: it diffs against origin/main and REFUSES to report
        # success when it cannot resolve a merge base, rather than printing a
        # pass over a diff it never read.
        run: |
          git fetch --no-tags --unshallow origin main || git fetch --no-tags origin main
          scripts/check_comment_citations.py

      - name: ...and the citation gate detects a wrong attribution
        # Fixtures are DERIVED from this repo's own crates, not named: the first
        # port of this script from the sibling repo failed six of ten cases
        # purely because its cases named the other repo's crates. A const is
        # found that one crate defines and another does not, and both the false
        # and the true attribution are asserted.
        #
        # The cases past Rust feed a RAW LINE through the gate's own comment
        # reader rather than handing it a comment body: a citation in a workflow
        # comment, one in a trailing comment, and text that only looks like a
        # comment inside a quoted value. A file set widened without the matcher
        # widening with it reads more files, finds nothing in them, and reddens
        # here.
        if: steps.route.outputs.comment_citations == 'true'
        run: scripts/check_comment_citations.py --self-test

  doc-surface:
    name: Documented DuckDB surface + SQL examples
    runs-on: ubuntu-latest
    steps:
      # `submodules: recursive`, unlike every other job in this file, because
      # this is the only one that runs `make build-extension`: the Makefile
      # includes `extension-ci-tools/makefiles/…/base.Makefile`, which is a
      # submodule. Without it the build dies with "No rule to make target"
      # before either gate runs — a gate that CANNOT fail rather than one that
      # passes. The extension-binary jobs live in MainDistributionPipeline.yml
      # and do their own checkout.
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: The extension's version file is generated, not committed
        # Both halves of the defect that stamped one version onto every release
        # for months. The build writes configure/ on the configure step, and a
        # tracked copy arrives with every checkout — after which the rule that
        # would rewrite it, which has no prerequisites, is never run. First here
        # in the job because it costs milliseconds and nothing below it can be
        # trusted while it is false.
        run: scripts/check_extension_stamp.py --untracked-version-file

      - name: ...and the build rewrites it even when one is already on disk
        # Untracking fixes CI, where every checkout is fresh, and nothing else.
        # Asked of make with `make -n`, so what is read is make's rebuild
        # decision on the real Makefile rather than a string in it. Needs the
        # extension-ci-tools submodule this job already checks out, for the
        # include; no toolchain.
        run: scripts/check_extension_stamp.py --regenerates-version-file

      - name: The release path still invokes the stamp gate where it has to
        # Every other stamp step in this job proves the GATE detects. This one
        # proves the gate is still CALLED — unguarded, and before the bytes are
        # published — at the three places a wrong stamp escapes: the two steps
        # in release.yml and the stamp job in MainDistributionPipeline.yml.
        # Those are workflow YAML, so nothing in this repository read them: one
        # `continue-on-error: true` on the release step turned the refusal into
        # a warning with every check here, including that gate's own
        # `--self-test`, still at exit 0.
        #
        # Unguarded and in a required context on purpose. A routed step is
        # skipped on a diff that does not touch the gate, and a skipped required
        # check satisfies branch protection.
        #
        # `release_wiring` in .github/gate-self-tests.tsv is an `always` row, so
        # the audit requires this step to be here and to carry no guard. Until
        # that row existed, deleting this step and the rehearsal below left every
        # check in this repository green.
        run: scripts/check_extension_stamp.py --release-wiring

      - run: rustup show

      - uses: Swatinem/rust-cache@v2
      - name: Install duckdb CLI
        # Both gates below read the catalog / run the examples through this CLI.
        # Same pin as the smoke job.
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version
      - name: Build the extension
        # Just the cdylib + the metadata stamp — not the CLI, eval binaries or
        # trainer. `make build-release` would build all of them.
        run: make build-extension

      - name: The extension's run-time version and its own trailer are one version
        # ONE artefact, ONE load, two independent readings: `ft_version()` is
        # compiled in from Cargo.toml, and `duckdb_extensions().extension_version`
        # is DuckDB's own reading of the metadata trailer the build stamped.
        # Asserting each against a literal instead would pass while the artefact
        # disagreed with itself, which is the shape a consumer actually hits —
        # it reads the trailer before loading and the function after.
        #
        # The LOAD is also the only thing here that establishes identity: any
        # stamped shared library satisfies a trailer read, and only running one
        # proves it is this extension.
        run: scripts/check_extension_stamp.py --artifact target/release/finetype.duckdb_extension --load

      # UNGUARDED, like --release-wiring above and for a stronger reason. This
      # runs the `release` job's own assemble and stamp commands — its `run:`
      # text, read out of release.yml, with GITHUB_REF_NAME supplied — against
      # a directory of real assembled asset names. release.yml runs only on a
      # pushed tag, so until this step existed nothing had ever executed those
      # lines: the step that loads an asset named it under the name the
      # assembler writes, DuckDB derives the init symbol it dlsyms from that
      # name, and every tag would have exited 2 there and published nothing.
      # A routed step would skip on any diff that does not touch the gate,
      # which is most of the diffs that could break the release path. The
      # `release_rehearsal` row in .github/gate-self-tests.tsv is what requires
      # this step to be present and unguarded.
      - name: The release job's own stamp commands still run against real asset names
        run: scripts/check_extension_stamp.py --release-rehearsal --artifact target/release/finetype.duckdb_extension

      - name: ...and the stamp gate detects a trailer that is not the release
        # Fixtures are copies of the artefact above, re-stamped with the real
        # extension-ci-tools stamper. Every trailer field but the version — the
        # platform, the ABI type, the DuckDB floor — is read off that artefact,
        # so a literal for any of those three would be a constant of the
        # machine that wrote it and the proof would then only pass on that
        # machine. It is also what makes the run-time mismatch case an artefact
        # that genuinely disagrees with itself rather than a mutated comparison.
        # One fixture is stamped for a platform this runner is NOT, on purpose,
        # and does not load: that is the case proving an unloadable artefact is
        # refused by name rather than skipped.

        if: steps.route.outputs.extension_stamp == 'true'
        run: scripts/check_extension_stamp.py --self-test --artifact target/release/finetype.duckdb_extension

      - name: The spike still compiles, off the default build
        # crates/finetype-duckdb/src/spike.rs is a trivial VTab kept as living
        # evidence that `vtab` is active under `loadable-extension` and that a
        # table function and the scalars coexist (choice 0064, findings a/b).
        # It is behind the non-default `spike` feature so no released artifact
        # carries `finetype_spike` in its catalog — which means nothing else in
        # this file compiles it, and evidence nobody compiles is a memory. Here
        # rather than in its own job because `make build-extension` above has
        # already built this crate's dependency graph.
        run: cargo check -p finetype_duckdb --features spike

      - name: The documented DuckDB surface matches duckdb_functions()
        # Which functions exist, what kind each is and what each returns are
        # asserted in prose in README.md, docs/ARCHITECTURE.md and the
        # finetype-duckdb module doc. This LOADs the local build (hermetic
        # extension_directory, and the loaded version must equal the tree's, so
        # a community build installed on the runner cannot answer for it) and
        # compares the catalog with the docs in both directions. No model
        # needed: LOAD alone populates duckdb_functions().
        run: scripts/check_duckdb_catalog.py

      - name: ...and the catalog gate detects a wrong surface
        if: steps.route.outputs.duckdb_catalog == 'true'
        run: scripts/check_duckdb_catalog.py --self-test

      - name: The taxonomy's published SQL and samples resolve
        # `labels/definitions_*.yaml` is published: `finetype taxonomy --full`
        # emits it and the type-registry pages render `transform` and
        # `decompose` as copy-button code blocks. The two gates above read
        # README.md, docs/*.md and the module doc, so `labels/` was outside
        # every file list they enumerate. This reads the same catalog for call
        # heads and cast targets, and puts each `samples:` value of a
        # checksum-bearing leaf through finetype-core's own check digit — via
        # the `checksum-samples` binary `make build-extension` produced above,
        # so no build step of its own. No model needed.
        run: scripts/check_taxonomy_content.py

      - name: ...and the taxonomy gate detects unresolvable content
        # Mutations of a pristine copy of labels/, covering each value shape the
        # reader answers for: an inline scalar, a folded block, a nested
        # mapping entry; a missing function, a missing cast type, an extension
        # symbol used in the plain-DuckDB fields; a sample that fails its check
        # digit, a scheme finetype-core does not know, and a check-digit leaf
        # with its samples removed.
        #
        # Also shapes the reader does NOT answer for — a nested entry folded
        # into a block scalar, a flow sequence, a block and a mapping indented
        # below the reader's floor, and a plain scalar broken across two lines
        # at an inline SQL field, a null one, a checksum: directive, a bare
        # checksum: key and a samples: item. A shape it cannot read has to be
        # refused, because a skipped entry reports the same expression count as
        # a clean tree — which is how the run-on scalar was found, at exit 0
        # with the clean tree's own figures.
        #
        # And the interruptions the reader must read PAST rather than refuse: a
        # blank line, and a comment, between two samples and between two
        # decompose: entries. YAML publishes what sits either side of one, and
        # each case breaks the item AFTER the interruption, so what it pins is
        # that the block did not end there. The comment cases sweep its column:
        # a reader that tests the indent first reads past a comment at four
        # spaces and stops at a shallower one, and
        # `labels/definitions_technology.yaml` carries comments at column 0 and
        # at two spaces.
        if: steps.route.outputs.taxonomy_content == 'true'
        run: scripts/check_taxonomy_content.py --self-test

      - name: Every published sample satisfies its own leaf's pattern
        # The gate above puts a CHECK-DIGIT leaf's samples through
        # finetype-core; this puts EVERY leaf's samples through its own
        # `validation.pattern`. Nothing did before: `finetype check` validates
        # the 50 values per definition its GENERATOR produces — the
        # `12550/12550` it reports — and never reads the static `samples:` list,
        # so a sample of "ABC" under a leaf whose own pattern is `^[0-9]+$` left
        # every job in this file green.
        #
        # Bolted onto this job rather than given its own, for the reason the
        # count gate is bolted onto `evidence`: the oracle it calls is a bin in
        # finetype-build-tools, which `make build-extension` above already
        # built, so the marginal cost is a stdlib-python second. It needs
        # neither duckdb nor the model.
        run: scripts/check_sample_patterns.py

      - name: ...and the sample gate detects a contradiction
        # Nine mutations that must fail — a sample replaced with a value its own
        # pattern rejects (at the first, middle and last patterned leaf, since
        # one permissive pattern would otherwise carry the whole case), a
        # pattern tightened past its own samples, a pattern that no longer
        # compiles (the product drops such a validator with `.ok()` and then
        # validates nothing), a patterned leaf that loses every sample, a
        # quarantined sample edited to a different wrong value, a quarantined
        # sample corrected with its entry left behind, and a duplicated leaf key
        # that serde_yaml silently resolves to one leaf.
        #
        # And two that must NOT: a sample swapped for one that a leaf with the
        # IDENTICAL pattern publishes — the cross-leaf case, which is a
        # judgement rather than a violation, since eight patterns in labels/ are
        # shared byte-for-byte by two or three leaves — and a nonsense sample
        # under a leaf with no pattern at all, which is outside the declared
        # scope. Without that second pair this gate could be refusing honest
        # values and nobody would find out until it refused one.
        if: steps.route.outputs.sample_patterns == 'true'
        run: scripts/check_sample_patterns.py --self-test

      - name: Download model from HuggingFace
        # Only the SQL examples need it. The catalog gate above ran without it,
        # so a wrong surface reddens before this download is paid for.
        run: .github/scripts/download-model.sh

      - name: Every documented SQL example runs, and has the documented shape
        # Extracts every ```sql fence from README.md and docs/*.md, injects a
        # LOAD of the LOCAL build and runs it. A DuckDB error fails. Then SHAPE,
        # read out of the fence's own trailing comment: an ASCII result box must
        # name the columns the query returns, a documented STRUCT literal must
        # carry the STRUCT's field names, and a documented JSON payload may not
        # name a key the query never returns. NO confidence digit, label or
        # score is ever compared — those move with the model, and a flaky gate
        # is a gate that gets ignored.
        #
        # README.md is in the script's SELF_CONTAINED set, so it is given
        # NOTHING beyond the LOAD: its fences run exactly as a reader pastes
        # them, which makes this job that reader's path rather than a proxy for
        # it. That is new. The script used to prepend a fixture whose
        # `CREATE TABLE my_table` occurred once in the repository — here — and
        # zero times in README.md, so the gate was green while a reader pasting
        # the first example got `Catalog Error: Table with name my_table does
        # not exist!`. The other two documents behind FIXTURES still get one,
        # and still create none of their four tables.
        run: scripts/check_sql_examples.py

      - name: ...and the example gate detects a broken example
        # Ten mutations that must fail — a README that stops creating the table
        # its own examples query, a self-contained document handed a fixture
        # anyway, a query against a missing table, a call to a function that
        # does not exist, a renamed result column, a renamed STRUCT field, a
        # JSON key that is never returned, a LOAD of an artifact no build
        # produces, a shell pipeline back inside a ```sql fence, a macro column
        # TYPE that drifts — and two that must NOT: a moved confidence digit and
        # a changed predicted label must leave it green. Without that second
        # pair this gate could be pinning model output and nobody would find out
        # until it flaked.
        if: steps.route.outputs.sql_examples == 'true'
        run: scripts/check_sql_examples.py --self-test

  encoder-dtype:
    # Every step here is a proof rather than a check, and each is routed
    # separately: a diff that changes `scripts/encoder_dtype.py` alone does not
    # re-run the record-diff harness.
    name: Encoder half-precision packing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Round trip, tie rounding, overflow refusal, offsets, no-op, mode, metadata
        # The bytes this tool writes get compiled into a released binary, so it is
        # gated on the same runner that builds one: an out-of-range value must abort
        # rather than store `inf`, a tie must round to even (the rule that keeps the
        # output identical on macOS and Linux), and the untouched tensors in the same
        # file must keep their bytes when the offsets are rebuilt.
        #
        # Two of the cases are about what the tool does when it has nothing to do. An
        # encoder it did not write — a HuggingFace export, whose header keys are not in
        # sorted order — must come back byte-identical, because printing "unchanged"
        # while moving the file's sha256 is worse than failing; and a conversion must
        # not drop the destination's permission bits, which is what the atomic-rename
        # write does on its own.
        #
        # The rest are the silent-degradation shapes, each added because deleting the
        # code that prevents it left every other case green: a hardcoded 0644 that
        # *widens* a 0600 artifact, a `__metadata__` block dropped behind a successful
        # convert, a `--out` copy that loses the source's mode, an integer tensor
        # reinterpreted as floats, and a header written without its alignment padding.
        # Stdlib only.
        if: steps.route.outputs.encoder_dtype == 'true'
        run: scripts/encoder_dtype.py self-test

      - name: The record diff compares the whole record, not just the label
        # The instrument that says a model-artifact change did not alter the
        # output has to be able to SEE the output. Two pull requests were refused
        # for citing a prediction file whose confidence column is the empty
        # string on every row, so the cases here are one per emitted field, plus
        # identity-keyed row matching (a positional zip silently compares
        # unrelated columns when an emit partially fails) and CSV parsing that
        # survives a format string containing a comma.
        if: steps.route.outputs.encoder_record_diff == 'true'
        run: scripts/encoder_dtype_record_diff.py self-test

      - name: ...and eleven wrong implementations of it do not pass
        # A self-test that a broken tool passes is a structural guard, which this
        # repository has collected fifteen instances of. Each mutation is the
        # implementation a competent author would plausibly write — label-only
        # comparison, positional row matching, a naive split on commas, a
        # max-delta that records the last delta — and must be killed by a NAMED
        # case. Four of these passed when they were first written; the harness is
        # what caught that, and it exits non-zero if any mutation survives again.
        if: steps.route.outputs.encoder_record_diff == 'true'
        run: scripts/encoder_dtype_record_diff_mutations.py

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show # installs the minimal toolchain from rust-toolchain.toml
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo test

  workspace-test:
    # THE JOB THAT MAKES A GREEN BADGE MEAN SOMETHING.
    #
    # `cargo test` and `cargo clippy` above are BARE, so they build
    # `default-members` — finetype-core, finetype-model, finetype-cli. That is
    # three of the workspace's eight crates.
    #
    # A SEPARATE JOB, not a `--workspace` flag on the two above, because the
    # broad build pulls candle and a bundled duckdb into the fast path. Its own
    # cache key keeps that cost off `test` and `clippy`, whose scope and runtime
    # are deliberately unchanged.
    #
    # NO `continue-on-error`, ON PURPOSE: a job that reports success while its
    # command failed is the exact defect this job exists to remove. Whether a red
    # check stands between a pull request and the merge button is a repository
    # setting, decided outside this file.
    #
    # ── WHAT IT ATTESTS TO ──────────────────────────────────────────────────
    #
    # `cargo test --workspace --no-fail-fast` compiles every workspace member
    # and its test targets, then runs the test binaries it built — a failure in
    # one does not stop the ones sequenced behind it. A red run therefore names
    # the crates whose tests fail rather than the first one to fail, which is
    # what a check standing between a pull request and the merge button has to
    # hand the person reading it.
    #
    # The flag governs what a red run REPORTS, not whether it is red: a failing
    # test fails the command with the flag and without it. Its reach stops at
    # compilation — a crate that fails to compile ends the run before a test
    # binary is executed.
    #
    # A fixture disagreement in finetype-eval's validate_corpus
    # (crates/finetype-eval/src/bin/validate_corpus.rs) is not fixed by
    # regenerating the fixture. `make validate-corpus` rewrites the harness
    # report, which asserts the harness is right by construction — the
    # thing under test. Which side is authoritative is an evaluation decision,
    # not a CI one, and stays out of this job.
    name: Workspace Test (all eight crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the `test`/`clippy`/`check` caches: this job's
          # dependency graph is a superset (candle-transformers, libduckdb-sys,
          # rmcp, ratatui) and sharing a key would evict theirs on every run.
          prefix-key: v0-rust-workspace
      - name: Download model from HuggingFace
        # crates/finetype-cli/build.rs PANICS when models/default is absent or is
        # not a multi-branch model, so the workspace does not compile at all
        # without this step — it is not only the tests that need the model.
        run: .github/scripts/download-model.sh
      - run: cargo test --workspace --no-fail-fast

  python-types:
    # Every accuracy number this repository quotes is produced or adjudicated by
    # Python, and until now CI type-checked none of it. The class of fault that
    # matters here does not crash: a None-safety slip in the file that resolves
    # the BAR for a gated score comparison compares a fresh score against a blank
    # bar and prints a plausible number.
    #
    # SCOPE: the gating and evaluation scripts, listed explicitly in
    # pyrightconfig.json rather than globbed. The wider scripts/ tree is research
    # code that imports numpy, pandas, duckdb, torch and pyarrow; type-checking it
    # would require installing the whole ML stack on every PR to report mostly
    # unresolved-import noise. The covered set is stdlib-only AT MODULE SCOPE — not
    # third-party-free: score_gold_anchor.py defers one `import pyarrow.parquet`
    # into cmd_predict behind a `# type: ignore[reportMissingImports]`. The
    # consequence is what this job relies on and it holds either way: no dependency
    # install, and the local run sees exactly what CI sees.
    name: Python type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # Pinned, and matched by pyrightconfig.json's pythonVersion. pyright
          # infers reachability from the version, so an unpinned interpreter can
          # silently change which branches it analyses.
          python-version: "3.13"
      - name: Install pyright
        # Exact pin: pyright adds checks between minor releases, so an unpinned
        # install turns an unrelated PR red for a rule nobody chose to adopt.
        # Keep this in step with the version named in pyrightconfig.json's
        # comment and in the Makefile's `types` target.
        run: npm install -g pyright@1.1.411
      - name: Type-check the evaluation and gate scripts
        # No arguments: the file set is pyrightconfig.json's `include`, so a
        # local `pyright` from the repo root checks exactly what CI checks. An
        # argument here would silently override the config's file set.
        run: pyright

  map-fidelity:
    # `eval/static-embedding-map-fidelity/` measures what a static embedding
    # costs against two floors: seeded Gaussian noise, and DuckDB BM25. Nothing
    # else in this file reads `eval/`, and the measurement itself cannot run
    # here -- five models, a corpus download, about an hour. What runs here is
    # the refusal: a committed results file whose control has climbed off its
    # floor, whose ceiling no longer separates from it, or whose arms turn out
    # to have produced identical vectors under different model names.
    #
    # That last one is why this job exists rather than a reviewer reading the
    # table. A file where two arms silently loaded the same model has every
    # number in range and simply reports that the two agree, which is the shape
    # of a finding -- so it reads as a result rather than as a fault.
    #
    # Stdlib only, so no dependency install and a local run sees what CI sees.
    name: Static-embedding map fidelity floors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          # Matched to the python-types job, which type-checks this same file.
          python-version: "3.13"
      - name: Which gates this diff changed
        id: route
        # In-job by design, and it audits before it plans; see the identical step
        # in the `gate-routing-self-test` job for why.
        run: .github/scripts/gate-self-tests.py plan --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: The committed measurement's floors still hold
        run: eval/static-embedding-map-fidelity/check_results.py
      - name: ...and the floor check detects a file whose floors have moved
        # A case per rule, each mutating a fixture that passes clean and
        # requiring exactly that rule to fire. The case list is checked against
        # the rule list in both directions, so a rule added without a case, or a
        # case naming a rule that no longer exists, reddens here.
        if: steps.route.outputs.map_fidelity_results == 'true'
        run: eval/static-embedding-map-fidelity/check_results.py --self-test

  check:
    name: Taxonomy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo build --release
      - run: ./target/release/finetype check --verbose

  smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install duckdb CLI
        # duckdb is a hard runtime dependency (choice 0100): `profile` and
        # `validate` shell out to it for CSV/Parquet ingestion. smoke.sh exercises
        # `profile`, so the CLI must be on PATH.
        run: |
          curl -fsSL -o duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip
          unzip -o duckdb.zip
          sudo mv duckdb /usr/local/bin/duckdb
          duckdb --version
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: ./tests/smoke.sh
