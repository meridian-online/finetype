name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # CI's authoritative model name. Read only by .github/scripts/download-model.sh.
  # See specs/2026-04-20-ci-decouple-default-symlink/spec.yaml for the promotion flow.
  FINETYPE_CI_MODEL: sherlock-v16

jobs:
  download-model-test:
    name: download-model.sh tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run resolution test harness
        run: .github/scripts/test-download-model.sh

  drift-check:
    name: CI model vs symlink drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for drift between FINETYPE_CI_MODEL and models/default
        run: .github/scripts/check-ci-model-drift.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs toolchain + components from rust-toolchain.toml
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo test

  check:
    name: Taxonomy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: cargo build --release
      - run: ./target/release/finetype check --verbose

  smoke:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Download model from HuggingFace
        run: .github/scripts/download-model.sh
      - run: ./tests/smoke.sh
