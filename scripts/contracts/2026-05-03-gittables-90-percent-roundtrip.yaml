    - ids: [S5, S6]
      type: subsumed
      reason: |
        S5 (before/after measurement) implicit in dual-metric framing;
        gate re-measured every cycle. S6 (sampling reproducibility)
        structurally addressed — gate on frozen holdout is
        reproducible by construction.

  hazop_matrix:
    parameters: 11
    guide_words: 7
    cells_walked: 77
    cells_with_new_branches_or_halts: 9
    deltas:
      - cell: LESS × Reject count
        surfaced: B04
      - cell: MORE × Holdout score
        surfaced: H06, E05
      - cell: OTHER THAN × m-19 eval score
        surfaced: H07
      - cell: REVERSE × Failure log
        surfaced: H08
      - cell: REVERSE × Working-slice coverage
        surfaced: H09
      - cell: AS WELL AS × Commit/push state
        surfaced: H10
      - cell: REVERSE × Candidate model
        surfaced: H11
      - cell: AS WELL AS × Predicted types
        surfaced: H12
      - cell: PART OF × Sampled file
        surfaced: B06

  premortem_completion:
    candidates_added: [H01_disk_space, H04_concurrent_cycle]
    candidates_cut:
      - clock_skew_halt — not load-bearing
      - memory_pressure_halt — standing-order suffices
      - cron_process_survival_halt — infrastructure scope, not contract

  hot_wash: |
    Seven meta-observations from this session, captured before
    contract finalisation. None contradict the contract; all are
    methodology pass-2 fodder for the orbit memo.

    1. The original session brief proposed scoping the contract to
       validate-corpus iter-5+. Hugh's reframe (full GitTables, no
       PR merges, retrain authority) was an order-of-magnitude
       larger than the bottom-up brief assumed. Methodology pass-2
       lesson: facilitator should probe "what do you want the cron
       to OWN" earlier, not bottom-up from a recent spec dir.

    2. Metric-gameability emerged late as a load-bearing question.
       The non-trivial-prediction floor only got pinned because the
       scribe challenged "validation rate >90%" as undefined. A
       cron agent optimising raw rejects has a trivial winning move
       (push every prediction to plain_text). Methodology pass-2:
       add a step-1 check — "is the proposed metric game-able by
       the contracted agent?" Run before any scenario walks.

    3. Dual-metric framing (gate + corpus value) emerged from Hugh's
       pushback that a frozen holdout left 1.016M files invisible.
       Methodology pass-2: explicitly ask "what value comes from
       data the gate doesn't see?" The answer was three additional
       uses of the corpus (failure-mechanism discovery, training-
       data harvest, taxonomy coverage map).

    4. Three halt categories share a structural shape:
       "branch cannot catch a cross-cycle pattern."
       - H13 holdout_stagnation
       - H08 failure-log REVERSE
       - H09 coverage-log REVERSE
       These all materialise inter-cycle memory as halt invariants
       because the cron has no other memory mechanism. Worth
       promoting to a methodology pattern: "cross-cycle invariants
       always become halts; branches cannot bridge cycles."

    5. The contract's outputs include MORE than just the contract
       YAML. Auxiliary artefacts (load-bearing-paths registry) and
       engineering work (gate harness, content-hash dedup, lockfile
       mechanism, append-only log integrity tooling) surface as
       beads from the contract. Methodology pass-2: contract write
       step explicitly includes "what auxiliary artefacts and
       engineering work does this contract require to operate? File
       them."

    6. The orbit `schedule` skill is online-only — it provisions
       remote cloud agents in Anthropic's infrastructure, not local
       cron jobs. The scribe reflexively reached for it when scoping
       the pass-2 tabletop trigger and had to be redirected by
       Hugh. For tabletop-derived contracts where the cron-firing
       agent must run on the user's machine (data locality, GPU
       access, local repo state), `schedule` is the wrong tool.
       Local equivalents: `CronCreate` (in-session, REPL-bound) for
       low-stakes reminders; launchd / system cron for unattended
       autonomous firing — the latter is infrastructure-team work.
       Methodology pass-2: when authoring a contract, state
       explicitly whether the cron-firing agent runs local or
       remote, and route to the appropriate scheduling tool from
       the start. Add a §2 standing-orders entry naming the
       scheduling mechanism so future tabletops audit it.

    7. `CronCreate`'s `durable: true` parameter was silently
       ignored on this harness — both attempts produced
       session-only crons (no `.claude/scheduled_tasks.json` file
       created). For multi-day reminders, never trust a
       session-bound mechanism. The fallback that worked: write
       the prompt to a discoverable file at a sibling path (here:
