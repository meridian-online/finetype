# newsyslog config — log rotation for the FineType cron-firing agent.
# Bead finetype-53r, ac-05.
#
# Install:
#   sudo cp scripts/launchd/finetype-cron.newsyslog.conf \
#       /etc/newsyslog.d/finetype-cron.conf
#
# Verify:
#   sudo newsyslog -nv  # dry-run; shows what would be rotated
#
# newsyslog runs daily under launchd's com.apple.newsyslog. Rotation
# format: <logfile> <owner:group> <mode> <count> <size> <when> <flags>
#
# - count=14: keep 14 days of archives (cycle log analysis horizon)
# - size=*  : rotate by time, not size
# - when=$D0: rotate at midnight every day
# - flags=GZ: gzip archives (saves ~80% space; cycle logs compress well)
#
# Important: the contract calls for archive-not-delete (failure-mode
# autopsy may need historical cycles). count=14 is the rotation horizon
# inside newsyslog; for indefinite retention, periodically copy the
# *.gz archives elsewhere before they age out.
#
# Permissions on owner/group: the user `hugh` owns the logs (the cron
# agent runs as that user); newsyslog needs write access via that ownership.

# logfile_name              [owner:group]   mode count size when  flags
/Users/hugh/Library/Logs/finetype-cron/stdout.log  hugh:staff  644 14    *    $D0   GZ
/Users/hugh/Library/Logs/finetype-cron/stderr.log  hugh:staff  644 14    *    $D0   GZ
