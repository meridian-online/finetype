goal: >
  Close the accuracy gap by fixing root causes upstream of training: (1) purge 9 stale
  label references from the Sharpen/header_hint pipeline that inject phantom labels into
  model output, (2) audit all generators for cross-type collisions and fix with Hugh's
  approval, (3) fix augmentation under-delivery and oversampling shortfall, (4) expand
  eval coverage from 131 to ~156 types so we can measure what we're improving. Then
  retrain as sherlock-v6 and re-tune Sharpen rules based on systematic error analysis.
  Ship on expanded eval baseline — old 190-column denominator becomes historical.

constraints:
  - "Single overnight run on M1 Pro with Metal (~8 hours, same budget as v5)"
  - "Current architecture only (v5-scaled showed identical raw, worse domain — ceiling is data quality, not capacity)"
  - "Fork v5 training infrastructure (overnight script, TUI, adaptive epochs, resumable stages) — same CLI params but AC-5/AC-6 change underlying behavior"
  - "Sibling-context attention model frozen (reuse v4 weights)"
  - "29 profile eval datasets excluded from training corpus"
  - "Generator collision resolutions are case-by-case with approval gate (audit → table → Hugh approves → fix)"
  - "Sharpen rule changes must be justified by systematic error analysis, not gut feel (decision 0038)"
  - "Eval moves to expanded set — old 190-column baseline becomes historical reference only"

acceptance_criteria:
  - id: AC-1
    title: "Fix stale label references in Sharpen pipeline"
    description: >
      Purge all 9 stale label references from column.rs that inject phantom labels
      (labels not in the current 250-type taxonomy) into model output. These override
      correct model predictions with nonexistent labels, causing guaranteed eval failures.

      Stale labels to fix:
        - identity.financial.currency_code → finance.currency.currency_code (line 3843)
        - identity.credential.password → identity.person.password (line 4006)
        - geography.trade.hs_code → geography.transportation.hs_code (lines 2444, 2921-2930)
        - geography.transport.iata_code → geography.transportation.iata_code (line 5664)
        - technology.identifier.uuid → representation.identifier.uuid (line 3767)
        - technology.development.os → remove (no taxonomy match) (line 3895)
        - geography.address.street_address → remove or map to full_address (lines 3964-3969)
        - datetime.date.iso_date → datetime.date.iso (line 3972)
        - technology.development.boolean / technology.data.boolean → remove (lines 186-188)

      For labels with no taxonomy match: remove the hint entirely (let the model decide).
      Update corresponding test assertions (lines 5767, 5779-5780, 5950-5978, 8960/8977/
      8982/9221) to assert the correct canonical labels — do not simply delete tests.
    verification: >
      grep -rn all hardcoded label strings in column.rs, cross-check against label_map.json.
      Zero stale references remain. For each fixed reference, a test asserts the correct
      canonical label fires (tests updated, not deleted). cargo test passes.
      Run profile eval on models/sherlock-v5-current/ before and after fix — expect ≥2
      columns rescued (currency columns at minimum).

  - id: AC-2
    title: "Full generator collision audit"
    description: >
      Systematically test every generator pair that shares a broad_type (VARCHAR, BIGINT,
      DOUBLE, etc.) for output overlap. For each collision found, document:
        - Which types collide
        - Example overlapping values
        - Proposed resolution (case-by-case, not universal rule)
        - Whether the collision affects eval columns

      Known collision to fix: hs_code ↔ decimal_number.
      Decision: 2-level dotted values (e.g., 8471.30) are decimal. Only 3+ dot-separated
      levels (e.g., 0901.11.00.10) are hs_code. Change validation pattern from
      ^\d{4}\.?\d{2}(\.\d{2}){0,2}$ to ^\d{4}\.\d{2}(\.\d{2}){1,2}$.
      Remove 10% 2-level bucket from generator (was: 10% XXXX.XX, 70% XXXX.XX.XX,
      20% XXXX.XX.XX.XX → becomes: 80% XXXX.XX.XX, 20% XXXX.XX.XX.XX).

      Present collision table to Hugh for approval before implementing fixes.
    verification: >
      Collision audit report saved to specs/2026-03-26-overnight-v6-data-quality/collisions.md.
      Hugh approves resolutions. All approved fixes implemented and passing finetype check.
      For every approved collision fix: generate 100 samples from each colliding type,
      run finetype infer — cross-contamination rate <5% per pair.
      hs_code specifically: generate 1000 samples, confirm 0% are 2-level.

  - id: AC-3
    title: "Collapse currency_code taxonomy duplicate"
    description: >
      The stale header_hint reference (identity.financial.currency_code) reflects a
      taxonomy move that happened in v0.5.1 (NNFT-179). The canonical type is
      finance.currency.currency_code. Ensure no references to the old location remain
      anywhere in the codebase (training data, eval mappings, Sharpen rules, tests).
      Also scan the distilled training corpus for stale identity.financial labels —
      exclude or relabel before training. Record as MADR decision.
    verification: >
      grep -rn "identity.financial" across entire repo returns zero results.
      grep across distilled training CSVs returns zero identity.financial labels.
      MADR filed in decisions/. currency columns score correctly in profile eval.

  - id: AC-4
    title: "Expand eval coverage to ~25 high-priority types"
    description: >
      Add eval datasets for the ~25 highest-priority uncovered types identified in the
      investigation. Priority types include:
        - representation: scientific_notation, decimal_number_comma, file_size
        - datetime: compact_ymd, rfc_3339, iso_8601_offset, dmy_dash, ymd_dot, quarter, fiscal_year
        - finance: currency_symbol, bitcoin_address, isin, cusip
        - technology: ip_v6, calver
        - identity: username

      For each new type: create or source a CSV with ≥20 representative values, add to
      eval/datasets/manifest.csv with ground truth labels, update eval/schema_mapping.csv
      if needed. New datasets must NOT overlap with training corpus.
    verification: >
      Eval denominator grows from current ~315 columns to ≥340.
      Unique types covered grows by ≥19 from baseline (pin baseline count using unique
      gt_label values in manifest.csv before implementation begins — estimated ~129-131).
      All new datasets have valid ground truth. Profile eval runs clean on new datasets.

  - id: AC-5
    title: "Fix augmentation coverage gap"
    description: >
      Root cause identified by spec review: double-probability gate in
      prepare_multibranch_data.py. augment_column() has 13/20 internal slots as
      "no_aug" (~65% no-op rate). augment_columns() gates on rng.random() <
      augmentation_rate. Combined effect: 0.35 × 0.35 = 12.25%, exactly matching
      v5's observed 12.2%.

      Fix: remove "no_aug" slots from augment_column()'s weighted choice table so
      that when a column is selected for augmentation (by the rate check), it always
      gets augmented. The --augmentation-rate flag then directly controls coverage.

      After fix: manifest must show augmented_columns/total_columns ≥ 30%.
      Augmentation types: whitespace, encoding, null_mix, case_variation (4 existing).
      format_mixing was never implemented — it is out of scope for this AC. If needed,
      it should be a separate feature AC with a design spec.
    verification: >
      Run data preparation with --augmentation-rate 0.35. Manifest shows
      augmented columns ≥ 30% of total. Confirm augment_column() no longer has
      no_aug slots. All 4 existing augmentation types present in stats.

  - id: AC-6
    title: "Fix oversampling multiplier"
    description: >
      Root cause identified by spec review: blend_columns() correctly computes
      effective_spt = samples_per_type × oversample_multiplier (e.g., 9000). But
      the synthetic pool is generated flat at samples_per_type (3000) per type via
      generate_synthetic_columns(). When blend_columns() tries to allocate 9000,
      actual_s is capped by len(s_cols) = 3000, so total never exceeds ~5000.

      Fix: generate_synthetic_columns() must produce samples_per_type ×
      oversample_multiplier synthetic columns for oversampled types. Either pass
      the oversample list to the generation step, or generate effective_spt
      columns per type when that type is in the oversample list.
    verification: >
      Manifest blend_ratio_stats shows each oversampled type with total ≥ 9000
      (at 3x multiplier with 3000 base). Verify synthetic pool size per oversampled
      type is ≥ effective_spt before blending. Or if samples_per_type is adjusted,
      total = multiplier × samples_per_type for each oversampled type.

  - id: AC-7
    title: "Systematic Sharpen error analysis"
    description: >
      Prerequisite: instrument the Sharpen pipeline to log a trace per column.
      Currently ColumnResult only records one disambiguation_rule, and feature_sharpen()/
      value_sharpen() return on first match with no intermediate logging. Build minimal
      trace infrastructure: for each column, log the label before and after each rule
      stage (feature_sharpen, value_sharpen, header_sharpen), and which rules were
      evaluated (not just which fired).

      Then run models/sherlock-v5-current/ through profile eval with trace enabled.
      Analyze:
        (a) Rules that fired correctly for v4 but don't fire for v5 (confidence shift)
        (b) Rules that fire incorrectly for v5 (rescuing the wrong direction)
        (c) New rules justified by v5's specific error patterns
      Known candidate: iso vs iso_date T-separator check — the difference is meaningful
      for analysts and is exactly the kind of pattern Sharpen excels at.
      Per decision 0038: prefer retraining over new rules. Only add rules where the model
      demonstrably cannot learn the pattern.
    verification: >
      Sharpen trace infrastructure produces per-column trace (label before/after each
      rule stage, rules evaluated). Trace report saved to output/overnight-v6/sharpen_analysis.md.
      Each rule change documented with evidence (before/after, which columns affected).
      Post-Sharpen accuracy improves over raw by ≥5 columns on expanded eval.

  - id: AC-8
    title: "Overnight v6 training run"
    description: >
      Run the fixed pipeline end-to-end using v5 overnight infrastructure as base.
      CLI parameters match v5: 3000 samples/type, 3x oversample on confused types,
      0.35 augmentation rate, adaptive epochs (minimum 20), seed 42.
      Only train one architecture (current — v5-scaled showed no benefit).

      Note: although CLI parameters are the same, behavior changes due to:
        - AC-5: augmentation no longer double-gated (effective rate ~35%, was ~12%)
        - AC-6: synthetic pool enlarged for oversampled types (9000 available, was 3000)
        - AC-2: generator collision fixes change training data distribution
      These changes are intentional. Document all behavioral differences from v5
      in the overnight v6 script header.

      All generator fixes from AC-2 and data quality fixes from AC-5/AC-6 must
      land before training starts.
    verification: >
      Training completes within 8 hours. Manifest confirms fixes from AC-2,
      AC-5, AC-6. Model saved as sherlock-v6-current. Script header documents
      what changed from v5.

  - id: AC-9
    title: "Post-Sharpen accuracy on expanded eval"
    description: >
      Evaluate sherlock-v6 on the expanded eval set (AC-4). Report both:
        - Expanded eval accuracy (new primary metric)
        - Legacy 190-column accuracy (historical comparison only)
      Target: ≥5 net column improvements over v5-current on expanded eval (stale label
      fixes alone should recover 2-3, so 5 is a reasonable floor for the combined work).
      Hard floor: no regression below v4 baseline (155/190) on the legacy set.
    verification: >
      Profile eval with full pipeline on expanded eval set. ≥5 net column improvements
      over v5-current baseline on expanded eval. Legacy 190-column score ≥155/190.
      Per-column regression report shows ≤5 regressions from v4 baseline on legacy set.
      Comparison report saved to output/overnight-v6/comparison.md.

  - id: AC-10
    title: "Ship winning model"
    description: >
      If AC-9 passes: update models/default symlink to sherlock-v6-current.
      Publish to HuggingFace meridian-online/finetype-model. Update CLAUDE.md
      with new accuracy numbers (on expanded eval). Update version to 0.6.13.
    verification: >
      models/default → sherlock-v6-current.
      DuckDB extension downloads and loads the model.
      5-column spot check matches profile eval expectations.

ontology_schema:
  name: "DataQualityTrainingRun"
  description: "Training run focused on data quality, generator audit, eval expansion, and stale label cleanup"
  fields:
    - name: "stale_labels_fixed"
      type: "number"
      description: "Number of stale label references purged from Sharpen pipeline (target: 9)"
    - name: "generator_collisions_found"
      type: "number"
      description: "Number of generator collisions identified in audit"
    - name: "generator_collisions_fixed"
      type: "number"
      description: "Number of collisions fixed after approval"
    - name: "eval_types_covered"
      type: "number"
      description: "Unique types with eval coverage after expansion (target: ≥150)"
    - name: "eval_columns_total"
      type: "number"
      description: "Total eval columns after expansion (target: ≥340)"
    - name: "augmentation_actual_rate"
      type: "number"
      description: "Actual augmentation rate achieved (target ≥0.30)"
    - name: "oversample_actual_total"
      type: "number"
      description: "Actual total samples for oversampled types (target: multiplier × base)"
    - name: "sharpen_rescue_count"
      type: "number"
      description: "Net columns rescued by Sharpen (raw → post-Sharpen improvement, target ≥5)"
    - name: "expanded_eval_accuracy"
      type: "string"
      description: "Post-Sharpen label accuracy on expanded eval (primary metric)"
    - name: "legacy_eval_accuracy"
      type: "string"
      description: "Post-Sharpen label accuracy on legacy 190-column set (historical comparison)"
    - name: "regression_count"
      type: "number"
      description: "Regressions from v4 baseline on legacy set (max 5)"

evaluation_principles:
  - principle: "Stale labels purged and generator collisions resolved"
    weight: 0.25
  - principle: "Eval coverage expanded to ≥150 types with valid ground truth"
    weight: 0.20
  - principle: "Data quality fixes verified (augmentation, oversampling)"
    weight: 0.15
  - principle: "Post-Sharpen accuracy improvement on expanded eval"
    weight: 0.25
  - principle: "No regression floor on legacy eval (≥155/190, ≤5 regressions)"
    weight: 0.15

exit_conditions:
  - "Model ≥5 net improvements on expanded eval AND legacy ≥155/190 — ship as v0.6.13 default"
  - "STOP if stale label fix (AC-1, tested on models/sherlock-v5-current/) doesn't recover ≥2 columns on legacy eval — investigate deeper pipeline issues"
  - "STOP if generator collision audit surfaces >20 collisions — scope too large, split into separate workstream"
  - "STOP if augmentation fix doesn't reach 30% — debug prepare script before training"
  - "STOP if model regresses below 155/190 on legacy eval — escalate to distilled data expansion"

