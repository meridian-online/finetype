goal: >
  Build a Python-based autoresearch loop that autonomously searches for the best
  multi-branch fusion architecture for FineType. An agent iterates on train.py,
  evaluating each variant against raw model accuracy on 214 eval columns within
  a 10-minute wall-clock training budget. The single best architecture is ported
  back to Rust for production training.

context: >
  The branch diagnostic spike (2026-03-27) found that early fusion destroys 84
  correct branch answers and creates only 5. The header branch (44.4% eval
  accuracy, highest of any branch) contributes only 10% of the merged vector
  (64/628 dims) and gets systematically outvoted. Rather than manually specifying
  fusion variants, we adapt Karpathy's autoresearch pattern: program.md instructs
  an autonomous agent to iterate on a Python training script overnight. The winning
  architecture gets ported back to Rust (Candle) for production.

constraints:
  - "Three-file architecture: prepare.py (fixed), train.py (agent modifies), program.md (agent instructions)"
  - "Agent modifies ONLY train.py — prepare.py and program.md are read-only"
  - "Architecture-only changes — training hyperparams locked at v7 values (LR 0.0001, dropout 0.35, batch 32, weight decay 0.0001, seed 42)"
  - "10-minute wall-clock time budget per experiment — enforced by signal.alarm(600) in train.py. Not epoch-based (matches autoresearch, naturally penalises bloated architectures)"
  - "Deterministic training — seed 42, torch.use_deterministic_algorithms(True). Pre-flight: train baseline twice and verify identical eval accuracy. If Metal is non-deterministic, fall back to CPU"
  - "Raw model accuracy on 214 eval columns as keep/discard metric (no Sharpen rules)"
  - "Data loaded via Python FTMB reader from canonical .ftmb file (v2 or v3 format). Binary format documented in research/FTMB_FORMAT.md"
  - "All research files live in finetype/research/ subdirectory"
  - "No new Python dependencies beyond PyTorch, numpy, struct (stdlib)"
  - "Eval columns pre-extracted as eval .ftmb file with metadata header (timestamp, finetype version, taxonomy hash) — no Rust compilation in the loop"
  - "Agent CAN modify: branch MLP architectures (layer widths, depths, activations), fusion operation (concat/mean/max/attention/per-branch-heads), trunk MLP structure before softmax, ensemble strategy"
  - "Agent CANNOT modify: hyperparams (seed, LR, batch size, dropout, weight decay), loss function (CrossEntropyLoss), feature input dimensions (960/512/27/128), data loading or sampling, eval metric or eval data"

acceptance_criteria:
  - id: AC-1
    title: "prepare.py — FTMB reader and evaluation function"
    description: >
      prepare.py contains: (a) a Python FTMB reader that parses v2 and v3 binary
      format into PyTorch tensors (char[960], embed[512], stats[27], header[128],
      label string) per the byte layout in research/FTMB_FORMAT.md, (b) an
      evaluate() function that runs a model forward pass on the 214 eval columns
      and returns label accuracy (X/214) and domain accuracy, (c) a label-to-index
      mapping generated at runtime from labels/definitions_*.yaml (not hard-coded),
      (d) a train/val split function for the training FTMB data, (e) validation
      of eval.ftmb metadata header (timestamp, finetype version, taxonomy hash)
      on load.
    verification: >
      Run prepare.py standalone — it loads both train and eval .ftmb files, prints
      record counts and feature dimensions, validates eval.ftmb metadata, and
      returns the v7 baseline accuracy when given a trained model. Must parse both
      v2 (24-byte header, flat records) and v3 (28-byte header, table-grouped with
      sibling headers) formats correctly. Label count must match 239.

  - id: AC-2
    title: "train.py — v7 baseline model in PyTorch"
    description: >
      train.py implements the v7 early-fusion multi-branch model in PyTorch: 4
      branch MLPs (char 960→[300,300], embed 512→[200,200], stats 27→[128,64],
      header 128→[128,64] with LayerNorm), concatenation to 628-dim merged vector,
      BatchNorm→Dense(500)→Dense(500) trunk, flat 239-class softmax head. Training
      enforces a 10-minute wall-clock timeout (signal.alarm(600)) with fixed
      hyperparams. Determinism enforced via torch.manual_seed(42) and
      torch.use_deterministic_algorithms(True). At completion, train.py prints
      structured metrics to stdout and runs the eval function from prepare.py.
      Inference timing uses 5 warmup passes + 10 timed passes, reporting median.
    verification: >
      Run train.py on Metal twice consecutively. Both runs must: (a) complete
      within the 10-minute budget, (b) print identical structured output
      (val_accuracy, eval_label_accuracy, eval_domain_accuracy, epochs_completed,
      inference_ms_per_sample, num_params) to within ±0.5% eval accuracy, (c)
      achieve eval accuracy within ±2% of Rust v7 baseline (172/214 = 80.4%).
      If Metal is non-deterministic (runs differ by >0.5%), switch to CPU and
      re-validate.

  - id: AC-3
    title: "Eval FTMB file — pre-extracted eval column features"
    description: >
      A one-time script (extract_eval_features.sh) uses the Rust finetype binary
      to extract 4-branch features for all 214 format-detectable eval columns from
      the manifest, writing them as an eval .ftmb file with ground truth labels.
      The file includes a metadata header: extraction timestamp, finetype binary
      version, taxonomy hash (sha256 of sorted label list), and feature dimensions.
      prepare.py validates this metadata on load.
    verification: >
      eval.ftmb contains exactly the 214 format-detectable columns from
      eval/datasets/manifest.csv with correct ground truth labels from
      eval/schema_mapping.csv. Feature dimensions match training data
      (960+512+27+128). Labels are canonical FineType taxonomy keys. Metadata
      header is parseable by prepare.py and taxonomy hash matches current
      labels/definitions_*.yaml.

  - id: AC-4
    title: "program.md — autonomous agent instructions"
    description: >
      program.md contains complete instructions for an autonomous agent to run the
      research loop including: (a) experiment lifecycle (modify train.py → syntax
      check → run → parse output → keep/discard → log to results.tsv → repeat),
      (b) branch diagnostic evidence (fusion destroys 84, header suppressed,
      integer_number family, phone→SSN), (c) the 239-type taxonomy for reference,
      (d) explicit allow/deny list for modifications (architecture yes, hyperparams
      no, loss function no), (e) NEVER STOP directive, (f) pre-commit safety:
      python -m py_compile train.py + import check before every git commit,
      (g) crash recovery: if train.py fails to compile or import, git checkout
      train.py and log status=error, (h) convergence detection: if 40 consecutive
      experiments show no improvement, stop and log status=converged, (i) results.tsv
      format specification with exact columns and example row.
    verification: >
      An agent given program.md, train.py, and prepare.py can autonomously run at
      least 3 experiment iterations without human intervention, producing valid
      results.tsv entries. Format: tab-separated with columns commit, eval_label_acc,
      eval_domain_acc, epochs, inference_ms, num_params, status, description.
      Status values: keep, discard, error, timeout, converged.

  - id: AC-5
    title: "End-to-end autonomous loop"
    description: >
      The research loop runs unattended overnight. The agent modifies train.py,
      trains within the 10-minute budget, evaluates on 214 columns, logs results,
      keeps improvements (git commit), discards regressions (git reset), and
      continues indefinitely.
    verification: >
      Launch the loop, let it run for 1 hour unattended. Verify: (a) results.tsv
      has ≥4 entries, (b) git log shows commits for kept experiments, (c) no
      crashed experiments left the working tree dirty, (d) the current train.py
      contains the best-performing architecture.

  - id: AC-6
    title: "Architecture transferability"
    description: >
      The winning architecture from the research loop is documented clearly enough
      to port to Rust. train.py uses standard PyTorch primitives (nn.Linear,
      nn.BatchNorm1d, nn.ReLU, nn.Dropout, nn.Softmax) that have direct Candle
      equivalents. The model class has a clear forward() method showing the
      complete data flow.
    verification: >
      A developer can read the winning train.py model class and implement the
      equivalent in crates/finetype-train/src/multi_branch.rs within 2 hours.
      No exotic PyTorch features (custom autograd, JIT, dynamic computation
      graphs) that lack Candle equivalents.

ontology_schema:
  name: "ResearchExperiment"
  description: "A single architecture search experiment"
  fields:
    - name: "commit"
      type: "string"
      description: "Git commit hash (short) or 'baseline'"
    - name: "eval_label_acc"
      type: "number"
      description: "Label accuracy on 214 eval columns (X/214, expressed as fraction)"
    - name: "eval_domain_acc"
      type: "number"
      description: "Domain accuracy on 214 eval columns"
    - name: "epochs_completed"
      type: "number"
      description: "How many epochs fit in the 10-minute budget"
    - name: "inference_ms"
      type: "number"
      description: "Inference time in ms per sample (forward pass only)"
    - name: "num_params"
      type: "number"
      description: "Total trainable parameters"
    - name: "status"
      type: "string"
      description: "keep | discard | error | timeout | converged"
    - name: "description"
      type: "string"
      description: "One-line description of what changed"

evaluation_principles:
  - principle: "Accuracy improvement over v7 baseline"
    weight: 0.5
  - principle: "Architecture simplicity and transferability to Rust"
    weight: 0.3
  - principle: "Inference efficiency (params, ms/sample)"
    weight: 0.2

exit_conditions:
  - "Winning architecture achieves ≥180/214 raw accuracy (≥84.1%) within 10-minute budget — clear improvement over v7 baseline (172/214 = 80.4%)"
  - "OR: 40+ experiments completed with no architecture beating baseline — evidence that the fusion problem requires a data fix, not just architecture"
  - "OR: human interrupts the loop after reviewing results.tsv"

deliverables:
  - path: "research/prepare.py"
    description: "Fixed infrastructure — FTMB reader, eval function, data loading. Agent cannot modify."
  - path: "research/train.py"
    description: "Training script — v7 baseline model in PyTorch. Agent modifies this file only."
  - path: "research/program.md"
    description: "Agent instructions — experiment lifecycle, diagnostic evidence, constraints, results.tsv format."
  - path: "research/FTMB_FORMAT.md"
    description: "Binary format specification for .ftmb files (v2 and v3), byte-by-byte layout."
  - path: "research/eval.ftmb"
    description: "Pre-extracted features for 214 eval columns with metadata header. Generated once by setup script."
  - path: "research/results.tsv"
    description: "Experiment log — TSV with columns matching ResearchExperiment ontology. Not committed to git."
  - path: "research/extract_eval_features.sh"
    description: "One-time setup script — uses Rust finetype to extract eval column features into eval.ftmb."

implementation_plan:
  phase_1:
    title: "Infrastructure (human, ~4 hours)"
    steps:
      - "Write FTMB_FORMAT.md documenting v2/v3 binary layout from Rust source"
      - "Write FTMB Python reader in prepare.py (parse v2/v3 binary → PyTorch tensors)"
      - "Write label index mapping (239 types from labels/definitions_*.yaml, runtime-generated)"
      - "Write evaluate() function (forward pass on eval.ftmb, compare to ground truth)"
      - "Write extract_eval_features.sh (finetype extract-features on 214 manifest columns → eval.ftmb with metadata header)"
      - "Write v7 baseline model in train.py (PyTorch, matching Rust architecture exactly)"
      - "Write training loop with 10-minute wall-clock timeout (signal.alarm) and structured output"
      - "Write program.md with diagnostic evidence, experiment lifecycle, allow/deny list, pre-commit checks, convergence detection, results.tsv format"
      - "Pre-flight: run train.py twice on Metal, verify determinism (±0.5% eval accuracy)"
      - "Validate: train.py baseline matches Rust v7 accuracy within ±2%"

  phase_2:
    title: "Overnight research (agent, ~8 hours unattended)"
    steps:
      - "Launch agent with program.md"
      - "Agent runs modify → train → eval → keep/discard loop"
      - "Target: 40+ experiments overnight"

  phase_3:
    title: "Port to Rust (human, ~2 hours)"
    steps:
      - "Review results.tsv and winning architecture"
      - "Implement winning fusion strategy in multi_branch.rs"
      - "Full 30-epoch Rust training on Metal"
      - "Profile eval to confirm accuracy improvement"

