goal: >
  Add 6 value-based disambiguation rules (R25–R30) to the Sharpen pipeline
  to fix 8 of the 12 remaining misclassifications in the v14 eval. Each rule
  checks actual column values — no header/metadata dependency. No retraining
  required. Target: 215/227 → 223/227 (98.2% label accuracy).

constraints:
  - Value-based rules only — no header checks (decision 0048)
  - R25, R26, R27, R30 go in value_sharpen()
  - R28, R29 go in apply_header_sharpen() as post-hint guards (same pattern as the country_code guard) — value_sharpen corrections for these subtypes are overwritten by same-category header hint overrides (review finding B1)
  - Each rule must have a column-level threshold (percentage of values matching the pattern)
  - No model or training changes — code additions to column.rs only
  - All existing tests must continue passing (395 tests)
  - Each rule gets at least 2 unit tests (positive case + negative/boundary case)
  - Integration tests for R28 and R29 must exercise the full classify_multi_branch pipeline to prove they survive header hints

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      R25: HTTP status code gate. If label is "geography.address.postal_code"
      and ≥90% of non-empty values are 3-digit integers in range 100–599,
      override to "representation.numeric.integer_number". Must fire BEFORE
      R12 (disambiguate_numeric) to prevent R12 from reconfirming postal_code
      for 3-digit HTTP status values (review finding H1). Implementation:
      add the check at the top of value_sharpen, before the R12 call at
      ~line 2654.
    verification: >
      Unit test: sample ["200", "404", "500", "301", "503"] → integer_number.
      Unit test: sample ["90210", "10001", "SW1A"] → stays postal_code.
      Unit test: sample ["101", "200", "300", "400"] (Icelandic postal overlap)
      → integer_number (known limitation, documented).
      Eval: server_logs_json/status_code and network_logs/status_code both
      correctly classified as integer_number.

  - id: ac-02
    ac_type: code
    description: >
      R26: Hash length gate. If label is "technology.identifier.tsid" and
      ≥90% of non-empty values are hexadecimal strings (characters 0-9,
      a-f, A-F only) of length 40 or 64, override to
      "technology.cryptographic.hash". TSID is strictly 32-char hex.
      40-char = SHA-1, 64-char = SHA-256.
    verification: >
      Unit test: 64-char hex values → hash.
      Unit test: 40-char hex values → hash.
      Unit test: 32-char hex values → stays tsid.
      Unit test: 64-char non-hex values → stays tsid.
      Eval: codes_and_ids/sha256 correctly classified as hash.

  - id: ac-03
    ac_type: code
    description: >
      R27: Year vs compact_ym gate. If label is "datetime.date.compact_ym"
      and ≥90% of non-empty values are exactly 4 digits (matching ^\d{4}$)
      AND ≥80% of those 4-digit values fall in 1900–2100 (plausible year
      range), override to "datetime.component.year". compact_ym is strictly
      6 digits (YYYYMM). The year range check prevents false positives on
      4-digit non-year values (review finding L1).
    verification: >
      Unit test: sample ["2022", "2021", "2023"] → year.
      Unit test: sample ["202201", "202312", "202406"] → stays compact_ym.
      Unit test: sample ["1234", "5678", "9012"] (non-year 4-digit) → stays compact_ym.
      Eval: datetime_formats/year correctly classified as year.

  - id: ac-04
    ac_type: code
    description: >
      R28: Email display format post-hint guard. Placed in apply_header_sharpen()
      AFTER all header hint processing (same position as country_code guard).
      If final label is "identity.person.email" and ≥80% of non-empty values
      match the display format pattern .+\s*<.+@.+> (name followed by angle-
      bracketed email), override to "identity.person.email_display".
      Must survive same-category header hint override where h.contains("email")
      in the header triggers a hint back to email (review finding B1).
    verification: >
      Integration test: exercises full classify_multi_branch pipeline with
      header="email_display" and values=["Alice <a@b.com>", "Bob <b@c.org>"]
      — asserts output is email_display (not email).
      Unit test: ["a@b.com", "user@example.org"] → stays email.
      Unit test: ['"Name" <a@b.com>', "Other <x@y.io>"] with quotes → email_display.
      Eval: new_identity/email_display correctly classified.

  - id: ac-05
    ac_type: code
    description: >
      R29: Phone E.164 format post-hint guard. Placed in apply_header_sharpen()
      AFTER all header hint processing (same position as country_code guard).
      If final label is "identity.person.phone_number" and ≥80% of non-empty
      values match ^\+\d{7,15}$ (E.164: plus sign followed by 7–15 digits,
      no spaces/dashes/parens), override to "identity.person.phone_e164".
      Must survive same-category header hint override where h.contains("phone")
      in the header triggers a hint back to phone_number (review finding B1).
    verification: >
      Integration test: exercises full classify_multi_branch pipeline with
      header="phone_e164" and values=["+18005551234", "+442071234567", ...]
      — asserts output is phone_e164 (not phone_number).
      Unit test: ["+1 800 555 1234", "(800) 555-1234"] → stays phone_number.
      Unit test: ["+1234"] (too short, 4 digits) → stays phone_number.
      Eval: new_identity/phone_e164 correctly classified.

  - id: ac-06
    ac_type: code
    description: >
      R30: Accounting format gate. If label is "finance.currency.amount_accounting"
      and 0% of non-empty values contain any currency formatting character
      (from the set: $, €, £, ¥, ₹, ₩, comma used as thousands separator),
      override to "representation.numeric.decimal_number". The distinguishing
      feature of amount_accounting is currency formatting — without it, the
      values are plain numbers. Thousands separator detection: comma followed
      by exactly 3 digits before end or next comma (e.g., "1,000" or
      "1,000,000"). Indian lakhs notation (1,00,000) is a known limitation.
    verification: >
      Unit test: ["109", "145", "89.5", "219"] → decimal_number.
      Unit test: ["$1,234.56", "€500.00", "£99.99"] → stays amount_accounting.
      Unit test: ["1,234", "2,500,000"] with thousands commas → stays amount_accounting.
      Eval: earthquakes_2024/gap correctly classified as decimal_number.

  - id: ac-07
    ac_type: code
    description: >
      Profile eval: run eval on all 35 datasets (227 columns) and verify
      ≥223/227 label accuracy. Column-level regression diff vs v14 baseline
      (215/227): all 215 correct columns must remain correct. Document any
      new misclassifications.
    verification: >
      eval/eval_output/report.md exists with updated results. Column-level
      diff shows 0 regressions on v14-correct columns. All 8 target columns
      (status_code ×2, sha256, year, email_display, phone_e164, gap, and
      one of the country columns already fixed) now correct.

deliverables:
  - crates/finetype-model/src/column.rs — R25, R26, R27, R30 in value_sharpen(); R28, R29 as post-hint guards in apply_header_sharpen()
  - decisions/0048-value-rules-over-header-rules.md — MADR for value-only rule strategy (already committed)
  - eval/eval_output/report.md — updated eval results (gitignored, not committed)

known_limitations:
  - "R30 comma heuristic may misfire on European decimal notation (1.234,56) and Indian lakhs notation (1,00,000). Acceptable — European formats are handled by decimal_number_comma type, Indian lakhs are rare in current eval datasets."
  - "R25 HTTP status range (100-599) overlaps with some 3-digit postal codes (e.g., Icelandic 101-902). Acceptable — the 90% threshold and 3-digit-only constraint limit false positives. Pure Icelandic postal columns are a known edge case."
  - "5 items deferred per decision 0048: depthError→latitude, earthquake id→username, user_agent→jwt, user_agent→plain_text, geojson→plain_text."

rule_placement:
  value_sharpen:
    - "R25 (HTTP status gate) — BEFORE R12 to prevent R12 from reconfirming postal_code"
    - "R26 (hash length gate) — end of value_sharpen, no ordering dependency"
    - "R27 (year vs compact_ym) — end of value_sharpen, no ordering dependency"
    - "R30 (accounting format gate) — end of value_sharpen, no ordering dependency"
  apply_header_sharpen_post_hint:
    - "R28 (email display) — after all header hint processing, same block as country_code guard"
    - "R29 (phone E.164) — after all header hint processing, same block as country_code guard"

evaluation_principles:
  - principle: "Fix what value-based rules can fix — every rule must check actual data, not metadata"
    weight: 0.4
  - principle: "No regressions — the 215 correct columns in v14 must stay correct"
    weight: 0.3
  - principle: "Clean, testable rules with clear thresholds and documented edge cases"
    weight: 0.3

exit_conditions:
  - All 6 rules implemented with unit tests
  - Integration tests for R28 and R29 prove they survive header hint overrides
  - Profile eval ≥223/227 (8 new corrections from rules)
  - No regressions from v14 baseline (column-level diff)
  - Decision 0048 committed

