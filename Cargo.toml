[workspace]
resolver = "2"
members = [
    "crates/finetype-core",
    "crates/finetype-model",
    "crates/finetype-cli",
    "crates/finetype-mcp",
    "crates/finetype-duckdb",
    "crates/finetype-eval",
    "crates/finetype-train",
    "crates/finetype-build-tools",
]
# DuckDB extension downloads models at runtime from HuggingFace Hub.
# Build it explicitly with: cargo build -p finetype_duckdb
default-members = [
    "crates/finetype-core",
    "crates/finetype-model",
    "crates/finetype-cli",
]

[workspace.package]
version = "0.6.53"
edition = "2021"
license = "MIT"
repository = "https://github.com/meridian-online/finetype"
homepage = "https://meridian.online/projects/finetype/"
authors = ["Hugh Cameron"]
description = "Semantic type classification for text data"
keywords = ["type-detection", "data-profiling", "classification", "duckdb", "text"]
categories = ["text-processing", "science"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# ML / Candle
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig", "http"] }

# Data generation
fakeit = "1.3"
fake = { version = "3", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
glob = "0.3"
luhn = "1.0"
phonenumber = "0.3"
regex = "1.10"
jsonschema = "0.42"

# CLI
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"

# Async
tokio = { version = "1.0", features = ["full"] }

# Utilities
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indexmap = "2.0"

# Testing
tempfile = "3"

# HuggingFace Hub (runtime model download)
hf-hub = "0.4"

# DuckDB extension — exact pin tracking a specific DuckDB release (choice 0063
# pin-strategy addendum). 1.10503.x = DuckDB 1.5.3. The loadable-extension ABI
# must match the DuckDB version community CI builds against, so this is bumped
# and re-PR'd per DuckDB release rather than floated as a range.
duckdb = { version = "=1.10503.1", features = ["loadable-extension", "vscalar"] }
libduckdb-sys = "=1.10503.1"

# Internal crates
finetype-core = { version = "0.6.0", path = "crates/finetype-core" }
finetype-model = { version = "0.6.0", path = "crates/finetype-model" }
finetype-train = { version = "0.6.39", path = "crates/finetype-train" }

[profile.release]
lto = true
codegen-units = 1
