# Validate-corpus expected-attribution fixture
# ============================================
#
# This file is the authoritative ground truth for what each per-(dataset,
# column) failure means under the iter-3 attribution cascade. The
# validate-corpus harness's `attribute()` cascade is regression-checked
# against these rows by `vci3_fixture_attribution_regression_match`.
#
# Schema (ac-03):
#   - dataset               (string, required)
#   - column                (string, required)
#   - expected_mechanism    (string, required: enum_overfit | format_diversity
#                                            | misclassification | code_vs_canonical
#                                            | unknown | no_gt)
#   - rationale             (string, required, ≤200 chars)
#   - pending_escalation    (bool,   optional, default false)
#   - superseded_mechanism  (string, optional: the `expected_mechanism` this row
#                                    held before it was re-locked, same enum)
#
# `superseded_mechanism` keeps a re-lock legible: the value a row used to hold
# stays in the file beside the value it holds now, so the change is readable
# without a git archaeology pass. `vci3_fixture_superseded_mechanism_recorded`
# names the re-locked rows and requires each to carry a record, that record to
# name a mechanism the cascade emits, and it to differ from the row's current
# value. A record that meets those three and still names the wrong value passes:
# presence and shape are what the test reaches, and content is not.
#
# Construction is **strict two-pass** (ac-03, ac-13). Phase 1 (this commit)
# hand-writes the 4 hard anchor rows + 1 known taxonomy-gap row from the
# iter-2 GT sidecar `notes:` sections — NOT from harness output, NOT from
# the iter-2 spec's illustrative mismatch table. Phase 2 (separate commit)
# runs the iter-3 harness against the full 12-dataset manifest and appends
# rows for every other failing column, with `expected_mechanism` set to the
# harness's actual output (anti-regression lock, not correctness oracle).
#
# Source-of-truth precedence: GT sidecar `notes:` wins over iter-2 spec
# illustrative table when they conflict.
#
# Re-lock of 2026-08-02
# ---------------------
# Nine rows disagreed with the 2026-07-17 harness report. They were split on
# the provenance of the fixture side, not on which mechanism reads better:
#
#   * A row whose `rationale` is generated cascade boilerplate ("Iter-3 cascade
#     Rule N: …") records an earlier harness run, not an adjudication. Re-locking
#     it to the current report restores no judgement, because none was made. The
#     eight such rows are re-locked, each carrying `superseded_mechanism`. They
#     are listed in `vci3_fixture_superseded_mechanism_recorded`.
#   * `fifa_players` / `Value` is hand-written from the GT sidecar's `notes:`
#     item 2. It is NOT re-locked; see its row for the carve-out.
#
# What this costs if the split is wrong: a model regression hiding inside one of
# the eight moves is locked in as expected. Each re-locked row keeps the value it
# moved off, so the question stays answerable from this file.

# ---------------------------------------------------------------------------
# Phase 1 — 4 hard anchors + 1 known taxonomy-gap row
# ---------------------------------------------------------------------------

- dataset: nyc_taxi
  column: tpep_pickup_datetime
  expected_mechanism: format_diversity
  rationale: |
    NYC TLC GT sidecar names SQL-standard "YYYY-MM-DD HH:MM:SS" as the
    format-diversity seam vs ISO-only iter-1 timestamps. Path B subtype
    drift within datetime.timestamp.* prefix.
  pending_escalation: false

- dataset: gdelt_events
  column: SQLDATE
  expected_mechanism: format_diversity
  rationale: |
    GDELT GT sidecar names compact_ymd (YYYYMMDD, 8-digit unsigned) as
    the format-diversity seam — integer-shaped date without separators.
    Subtype drift within datetime.date.* prefix.
  pending_escalation: false

# CARVE-OUT, 2026-08-02. This row is NOT re-locked, and it is the one row of the
# nine that carries an adjudication rather than a generated cascade rationale —
# it was hand-written from the GT sidecar's `notes:` item 2. The 2026-07-17
# report attributes it via `path-b-prefix` (format_diversity), so the prediction
# has left CODE_TYPED_LABELS for a representation.* subtype and the seam the
# sidecar describes is no longer the seam the cascade sees.
#
# `pending_escalation: true` takes it out of the regression comparison in
# `compare_to_fixture` while `expected_mechanism` keeps the adjudicated value, so
# the disagreement stays on the record instead of being settled by preference.
# Whether the sidecar thesis or the cascade is authoritative here is an
# evaluation call, and it is open; it also moves an anchor count, which is why
# `vci3_fixture_anchor_count_2_hard_3_gap` reads 2/3.
- dataset: fifa_players
  column: Value
  expected_mechanism: code_vs_canonical
  rationale: |
    FIFA GT sidecar item 2: Value/Wage/Release Clause use formatted
    currency with M/K abbreviation ('€110.5M', '€565K'). GT
    representation.text.plain_text vs harness-predicted
    finance.currency.amount (in CODE_TYPED_LABELS) → path-b-codetype.
    Carved out 2026-08-02: the 2026-07-17 report reads path-b-prefix
    (format_diversity) instead, and the adjudicated value is kept rather
    than re-locked. Wage shares this seam and WAS re-locked.
  pending_escalation: true

- dataset: oecd_employment
  column: REF_AREA
  expected_mechanism: code_vs_canonical
  rationale: |
    OECD GT sidecar names REF_AREA / Reference area as the load-bearing
    CvC seam — ISO-3 country codes ('NOR') vs full names ('Norway') in
    paired columns. Iter-2 expected GT geography.location.country_code (in
    allowlist) against a canonical-text predicted side; iter-3 empirical
    reality differs: the v0.6.19 model mispredicts to
    technology.internet.http_method (ALSO in CODE_TYPED_LABELS), so
    cascade Rule 3's XOR=false and Rule 6 (misclassification) fires.
    Anchor preserved as iter-2 truth, marked pending_escalation pending
    model improvement to lift http_method out of REF_AREA's confusion set
    (or value-shape signals plumbed into RejectRow per the broader
    escalation path).
  pending_escalation: true

# Known taxonomy-gap row — NOT a hard anchor.
# GICS Sector is constructively un-attributable via label-only signals
# under v0.6.19 taxonomy: GT is representation.discrete.categorical (no
# GICS label exists), and English-text sector names like "Information
# Technology" predict text/categorical, not codes — neither side enters
# the code-typed allowlist. This row exists to keep the obligation
# visible (taxonomy widening for GICS sector/industry types OR
# value-shape signals plumbed into RejectRow), pending follow-up spec.
- dataset: sp500_constituents
  column: GICS Sector
  expected_mechanism: code_vs_canonical
  rationale: |
    Pending taxonomy widening: GICS Sector has no FineType label
    (v0.6.19 taxonomy gap). Label-only attribution cannot fire — both
    sides land outside CODE_TYPED_LABELS. Follow-up spec: extend
    taxonomy with GICS sector/industry types, OR plumb value-shape
    signals into RejectRow.
  pending_escalation: true

