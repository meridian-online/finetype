# ---------------------------------------------------------------------------
# Phase 3 — 12 rows for columns that were NOT failing at the iter-3 baseline
# (the 2026-04-29 report) and ARE failing at the 2026-07-17 report. None of
# the twelve appears in the April per-column attributions table, so each is a
# new failure rather than a Phase-2 omission. `expected_mechanism` is the
# 2026-07-17 harness output, per the anti-regression-lock framing in this
# file's header — it records what the harness does now and is not a claim
# that the mechanism is the right one.
#
# The `attribute` cascade is byte-identical between the two reports, so
# whatever moved these columns is upstream of the cascade. Reproduce with
# `git show <rev>:crates/finetype-eval/src/bin/validate_corpus.rs |
# sed -n '275,1028p' | shasum`, which is efaf65a0 at ce5db184, fe85510f
# and 4d904719.
# Each rationale states the GT label from the dataset's `.gt.yaml` sidecar
# and what the report's trigger implies about the prediction. The
# CODE_TYPED_LABELS list (validate_corpus.rs lines 337-380) carries entries
# under geography., finance., identity. and technology. and none under
# representation., so for a representation.* GT a `path-b-codetype` trigger
# implies the predicted side is the code-typed one.
# ---------------------------------------------------------------------------

