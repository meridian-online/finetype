# eval/datasets/sources.yaml — role manifest for train↔eval leakage firewall
#
# Each entry records a unique source_url and its role:
#   eval            — used ONLY for evaluation, NEVER for training
#   train           — used ONLY for training, NEVER for evaluation
#   both-forbidden  — contaminated source; excluded from both sides
#
# Resolution rule (MADR 0056 §Layer 1):
#   When a source appears on both sides, eval keeps the source and training
#   must relocate to an alternative. Any source that cannot be safely relocated
#   is tracked in progress.md under `un-relocatable training sources`.
#
# Populated from eval/datasets/manifest.csv (ac-02). Regenerate with:
#   python scripts/build_sources_yaml.py  (future helper)

