# eval/datasets/sources.yaml — role manifest for train↔eval leakage firewall
#
# Each entry records a unique source_url and its role:
#   eval            — used ONLY for label-eval (m-19 column-level eval corpus),
#                     NEVER for training
#   validate        — used ONLY for round-trip validate-precision corpus
#                     (spec 2026-04-28-validate-precision-corpus), NEVER for
#                     training. Disjoint from `eval` data; shares the
#                     leakage-firewall semantics.
#   train           — used ONLY for training, NEVER for evaluation or validation
#   both-forbidden  — contaminated source; excluded from both sides
#
# Resolution rule (MADR 0056 §Layer 1):
#   When a source appears on both sides, eval/validate keeps the source and
#   training must relocate to an alternative. Any source that cannot be safely
#   relocated is tracked in progress.md under `un-relocatable training sources`.
#
# Populated from eval/datasets/manifest.csv (role: eval, ac-02 of 2026-04-21
# spec) and eval/datasets/validate_manifest.csv (role: validate, ac-02 of
# 2026-04-28-validate-precision-corpus spec). Regenerate with:
#   python scripts/build_sources_yaml.py  (future helper)

