notes: |
  Iter-2 corpus dataset. 5000-row head sample from FIFA 2019 player
  attributes (~18k rows upstream, 89 columns). Source:
  github.com/sharmaroshan/FIFA-2019-Analysis (Footballer.csv). Licence
  pinned to CC-BY-SA-4.0 in manifest — the upstream Kaggle dataset
  carries the EA Sports "Sofifa" community licence which is not SPDX,
  so SA fallback is used for the allowlist match.

  Code_vs_canonical commitment is broad and explicit:

  1. Position rating columns (LS, ST, RS, LW … RB — 26 columns) carry
     values like "88+2" — overall rating with positional bonus. They
     LOOK like integers (mostly two-digit) but the "+2" suffix breaks
     numeric parsing. Mapped to representation.text.word to be honest
     about the format. The validator must reject if it tries to coerce
     these to integer_number; this is the load-bearing CvC seam.

  2. Value, Wage, Release Clause use formatted currency with M/K
     abbreviation ("€110.5M", "€565K"). They look currency-shaped but
     finance.currency.amount validation accepts plain numerics with at
     most a single currency symbol; the M/K suffix breaks the validator.
     Mapped to plain_text to be honest about non-canonical formatting.

  3. Height ("5'7") and Weight ("159lbs") use imperial/Anglo notation
     not present in any FineType taxonomy type. Height is short-form
     (always 1-2 chars before apostrophe + 1-2 chars after) — word.
     Weight has the "lbs" suffix — plain_text.

  4. Joined ("Jul 1, 2004") uses abbreviated-month-comma format —
     datetime.date.abbreviated_month. Contract Valid Until ("2021") is
     bare year — datetime.component.year. Two date columns, two formats.

  5. Real Face ("Yes"/"No") is boolean.terms. Preferred Foot
     ("Left"/"Right") is categorical (only 2 values but not boolean —
     these are categorical preferences, not truth-values).

  Photo, Flag, Club Logo are full URLs to sofifa.com images — url.

  Skill Moves and International Reputation values are 1-5 small-integer
  rankings — ordinal not integer_number.
