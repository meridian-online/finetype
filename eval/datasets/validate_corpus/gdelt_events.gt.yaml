notes: |
  Iter-2 corpus dataset. 5000-row head sample from GDELT Event 1.0 daily
  export 2024-01-15 (~122k rows upstream, 58 columns). Source:
  data.gdeltproject.org, SPDX CC0-1.0.

  Format-diversity commitment lives at four datetime columns:
   - SQLDATE  → datetime.date.compact_ymd  (YYYYMMDD, 8-digit unsigned)
   - MonthYear → datetime.date.compact_ym  (YYYYMM, 6-digit unsigned)
   - Year     → datetime.component.year   (YYYY, 4-digit unsigned)
   - DATEADDED → datetime.date.compact_ymd (YYYYMMDD)
  These are integer-shaped dates without separators. The validator must
  recognise them as dates rather than collapsing to integer_number — the
  exact failure mode iter-1 saw with co2_emissions_by_nation's Year column
  before MADR 0072's round-trip lens caught it.

  Code_vs_canonical surface area is huge (32 categorical columns —
  CAMEO actor codes, event codes, 2-letter ADM1 codes, 3-letter actor
  country codes, religion/ethnic/type codes from the CAMEO 1.1b
  taxonomy). All mapped to representation.discrete.categorical because
  there's no FineType taxonomy entry for CAMEO codes specifically. The
  Geo_CountryCode columns use ISO 3166-1 alpha-2 and ARE in the taxonomy
  (geography.location.country_code) — so the iter-1 country-code seam
  carries forward.

  Most categorical Actor* fields are sparse (>90% NULL) — the validator
  must accept empty/NULL without rejecting. Empty cells are not a code
  vs canonical mismatch.

  IsRootEvent is 1/0 → representation.boolean.binary.
  GLOBALEVENTID is a strictly increasing event-counter integer →
  representation.identifier.increment.
  SOURCEURL is a full URL → technology.internet.url.
