# eval/geonames/header_pools.yaml — Curated minimal header pools per locale.
#
# Per spec 2026-05-24-v21-geonames-geography ac-02 / ac-04.
#
# Strategy: minimal, authentic, no guesses. For each (pool, type) we list
# 3-6 column-header strings that real-world spreadsheets in that locale
# commonly use for that data. The noise generator (geonames_noise_recipes.py)
# layers case/spacing/separator variants on top — these pools provide the
# *vocabulary*, not the form variations.
#
# Non-Latin scripts deliberately ship both native-script forms and the
# English equivalent (most real-world non-English spreadsheets use a mix —
# observed pattern in GitTables corpus pass).
#
# `english` covers en_US, en_GB, and other en_* locales unless overridden.
# Cross-locale header reuse is fine — the generator picks one header per
# generated column.

