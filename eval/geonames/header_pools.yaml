  english:
    geography.location.city:          [city, city_name, town, municipality, place, locality]
    geography.location.region:        [state, region, province, county, admin_region]
    geography.location.country:       [country, country_name, nation, land]
    geography.location.country_code:  [country_code, country_iso, country_iso2, iso2, cc]
    geography.location.continent:     [continent, continent_code]
    geography.location.county:        [county, district, county_name]
    geography.location.us_state:      [state, us_state, state_code, state_name]
    geography.address.postal_code:    [postal_code, zip, zip_code, postcode, post_code]
    geography.coordinate.latitude:    [latitude, lat, y, gps_lat]
    geography.coordinate.longitude:   [longitude, lng, lon, x, gps_lon]

