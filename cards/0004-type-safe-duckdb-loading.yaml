feature: "Type-safe DuckDB loading"
as_a: "data analyst"
i_want: "to generate a runnable DuckDB CREATE TABLE statement from a CSV file, with correct column types inferred automatically"
so_that: "I can load data with proper types in one pipeline command instead of writing DDL by hand"

scenarios:
  - name: "Generate and execute CREATE TABLE"
    given: "a CSV file with columns of mixed types"
    when: "I run finetype load -f data.csv | duckdb"
    then: "FineType profiles the file, generates a CREATE TABLE AS SELECT with type-correct casts, and pipes it to DuckDB for execution"
    source_lines: "README.md: finetype load -f data.csv | duckdb — generates runnable CREATE TABLE statements"

  - name: "Transformation contracts guarantee safe casts"
    given: "a column detected as datetime.date.mdy_slash"
    when: "the load command generates SQL"
    then: "the transform expression strptime(col, '%m/%d/%Y')::DATE is guaranteed to succeed on the detected values (99.9% actionability)"
    source_lines: "README.md: Each type is a transformation contract — if FineType predicts datetime.date.mdy_slash, that guarantees strptime(value, '%m/%d/%Y')::DATE will succeed"

  - name: "Custom table name"
    given: "a CSV file"
    when: "I run finetype load -f data.csv --table-name my_table"
    then: "the generated DDL uses the specified table name instead of deriving one from the filename"
    source_lines: "CLAUDE.md: finetype load <file> (--table-name, --limit N, --no-normalize-names, --enum-threshold N)"

  - name: "Column name normalisation"
    given: "a CSV with messy column headers like 'First Name' or 'Order #'"
    when: "I run finetype load"
    then: "column names are normalised to DuckDB-safe identifiers by default, with --no-normalize-names to preserve originals"
    source_lines: "CLAUDE.md: finetype load <file> (--no-normalize-names)"

maturity: "established"
goal: "99.9% actionability — generated SQL succeeds on real data across 120 tested types"

specs: []

references:
  - "README.md"
  - "CLAUDE.md"
  - "decisions/0036-delegate-normalize-names-to-duckdb.md"
