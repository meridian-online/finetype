id: '0063'
title: Consolidate DuckDB Extension In-Tree, Repoint Community-Extensions Registry
status: accepted
date_created: 2026-04-22
date_modified: 2026-04-22
body: |
  # 0063. Consolidate DuckDB Extension In-Tree, Repoint Community-Extensions Registry

  ## Context and Problem Statement

  FineType's DuckDB extension currently lives in two places:

  - **`~/github/meridian-online/duckdb-finetype/`** — standalone repo that hosts the community-extension registration (registered at `duckdb/community-extensions/extensions/finetype/`). Last commit 2026-03-18. Pins `finetype-core = "0.5.0"` and ships the tiered-v2 CharCNN architecture (34 CharCNNs, 168–250 types depending on which line of the description.yml is read — the registry's own metadata is internally inconsistent).
  - **`~/github/meridian-online/finetype/crates/finetype-duckdb/`** — in-tree workspace crate, `publish = false`, matches current workspace version (0.6.17). Actively developed. Documented in CLAUDE.md's Build & Test section as `cargo build -p finetype_duckdb --release`. Ships sherlock-v16 multi-branch (240 types, one forward pass per column).

  The two have diverged substantially. Users running `INSTALL finetype FROM community;` receive a ~3-month-old snapshot of a fundamentally different classifier from what ships in the main repo. The longer this drift persists, the more the community-extension registration becomes misleading rather than useful.

  ## Considered Options

  - **Option A — Delete `duckdb-finetype` and deregister the community extension.** Raise a PR to `duckdb/community-extensions` removing `extensions/finetype/`; archive the standalone repo. Users lose `INSTALL finetype FROM community`; only Homebrew and `cargo install` remain. ~30 min of work.
  - **Option B — Migrate the community-extension scaffolding in-tree, repoint the registry, archive the standalone repo.** Move `Makefile`, `extension-ci-tools` submodule, `configure/`, and the description.yml equivalent into the main finetype repo (under `crates/finetype-duckdb/` or a dedicated `duckdb-extension/` directory). Raise a PR to `duckdb/community-extensions` updating `repo.github` → `meridian-online/finetype` and `repo.ref` → a current commit. Bump extension version to match the workspace. Archive standalone. ~1–2 hours.
  - **Option C — Resurrect the standalone repo.** Bump `finetype-core = "0.6.17"`, repoint at sherlock-v16, cut v0.3.0, update the registry. Continue maintaining two repos long-term. Every finetype release cuts twice. ~2–3 hours to bring current, then ongoing duplication cost.

  ## Decision Outcome

  Chosen option: **Option B (consolidate in-tree)**, because it preserves the `INSTALL … FROM community` distribution channel (which is the only one-line install path for DuckDB users) while eliminating the maintenance split that caused the current drift. Option A gives up distribution breadth for cleanliness; Option C pays an ongoing tax on every release to maintain two repos that should have been one.

  ### Evidence

  - `duckdb/community-extensions/extensions/finetype/description.yml` pins `repo.ref: 2b4574495b8deef84a00bce8a40570b9c248f55b` (the standalone repo's HEAD) at `version: 0.2.0`.
  - The registry's description.yml contains architectural claims that no longer apply: "tiered CharCNN", "34 character-level CNNs", type count 250 (one section) / 168 (standalone repo commit message). Current architecture is multi-branch sherlock-v16 with 240 types in a single forward pass.
  - The in-tree crate (`crates/finetype-duckdb/`) already declares `publish = false` and tracks `version.workspace = true` — it was built to be the active development site. CLAUDE.md's documented build command (`cargo build -p finetype_duckdb --release`) targets the in-tree crate exclusively. The standalone repo is effectively a frozen fork.

  ### Consequences

  **Good, because:**

  - One source of truth for DuckDB extension code — every finetype release ships one extension, not two potentially-divergent copies.
  - `INSTALL finetype FROM community;` resumes serving current code (sherlock-v16) within one registry-PR turnaround.
  - Removes a confusing discoverability pattern where readers find two repos and have to infer which is live.
  - Eliminates the permanent cost of mirror-releasing every version bump into the standalone repo.

  **Bad, because:**

  - One-time migration work: extract the community-extension CI scaffolding (`extension-ci-tools` submodule, `configure/`, `Makefile`), set it up inside the main finetype repo, verify the build produces an equivalent `.duckdb_extension` artefact.
  - Brief window where `duckdb/community-extensions` CI may fail a rebuild if the registry PR isn't coordinated with the standalone-repo archive. Mitigate: land the registry repoint first, verify one successful community-extensions rebuild cycle, then archive the standalone.
  - Slight coupling increase — the main repo's CI surface grows by a DuckDB-extension build that was previously contained in its own repo. Acceptable trade for the consolidation benefit.

  ### Migration Plan (follow-up spec)

  Not part of this decision — recorded here only as the expected shape of the work that follows:

  1. Ergonomics review of `crates/finetype-duckdb/` (Hugh + Nightingale together — scope for a separate card / discovery).
  2. In-tree scaffolding: vendor `extension-ci-tools` submodule, add `configure/`, port the standalone `Makefile` into a form that works from the workspace root, confirm CI can produce per-platform `.duckdb_extension` artefacts matching the community-extension build contract.
  3. Registry PR to `duckdb/community-extensions`: update `repo.github` and `repo.ref`, bump `version` to the current finetype release, refresh the `extended_description` to match the sherlock-v16 architecture.
  4. After the registry PR merges and one successful community-extensions rebuild lands: archive `meridian-online/duckdb-finetype`.
