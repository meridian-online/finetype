id: '0087'
title: Gittables multi-lens diagnostic absorbs m-19; disposition of v19 gate and Phase 2 inference work
status: accepted
date_created: 2026-05-20
date_modified: 2026-05-20
body: |
  # 0087. Gittables multi-lens diagnostic absorbs m-19; disposition of v19 gate and Phase 2 inference work

  ## Context and Problem Statement

  Spec `2026-05-20-gittables-multi-lens-diagnostic` proposes a
  multi-lens (Sense + YDF + DBpedia + mechanism cascade) corpus
  diagnostic at full gittables scale. Author intent (interview Q7):
  this work supersedes all other in-flight FineType work and becomes
  the eval-expansion milestone.

  Three in-flight items need explicit disposition before
  implementation begins:

  - **m-19** (`2026-04-21-eval-expansion`) — Phase A+B: realism
    standard + pre-screen, coverage floor (≥1 column per type across
    240 types), train/eval leakage firewall.
  - **v19 retrain gate** (MADR 0066) — currently enforced as a hard
    promotion gate; status as a blocker on v20 work.
  - **Autonomous inference module Phase 2** (MADRs 0083, 0084, 0085,
    0086) — Phase 1 signal scope lock, ac-02 floor recalibration,
    sibling-context consumption, Phase 2 locked weights.

  Without this disposition, the diagnostic spec, m-19, the retrain
  gate, and the inference-module roadmap each carry implicit claims
  on the same headcount and compute budget. The reciprocal-status
  annotations in this MADR remove the ambiguity.

  ## Considered Options

  - **Option A — diagnostic runs in parallel; m-19 continues, v19
    gate unchanged, Phase 2 proceeds.** Lowest coordination overhead;
    diagnostic outputs feed all three. Risk: m-19's realism standard
    and the diagnostic's corroboration filter are two ways to gate
    realism — duplicate, with risk of drift.
  - **Option B — diagnostic absorbs m-19 deliverables; v19 gate
    re-anchored to a diagnostic milestone; Phase 2 paused pending
    diagnostic findings.** Highest coordination cost up front;
    single eval-expansion track going forward; v20 promotion follows
    the diagnostic's training-data outputs.
  - **Option C — defer the diagnostic until m-19 and v19 retrain
    ship; revisit Phase 2 later.** Lowest near-term risk; longest
    time-to-eval-at-scale. Author posture in the interview
    explicitly rejected this — "this should be the only active spec
    we pursue."

  ## Decision Outcome

  Chosen option: **Option B — diagnostic absorbs m-19 deliverables;
  v19 gate re-anchored to a diagnostic milestone; Phase 2 paused
  pending diagnostic findings**, because (a) the author's stated
  intent is that this is the only active eval-expansion track; (b)
  the diagnostic's corroboration filter operationalises realism at
  corpus scale and obsoletes the parallel m-19 pre-screen; (c) the
  full-corpus pass naturally satisfies the 240/240 coverage floor by
  construction; (d) train/eval leakage prevention (MADR 0056) extends
  cleanly to the diagnostic's measure-half partition. Option A risks
  silently duplicated realism gating; Option C delays the load-
  bearing measurement work the author wants delivered first.

  ### Disposition per item

  **m-19 (`2026-04-21-eval-expansion`) — folded in.**

  Three deliverables disposition:

  1. **Realism standard + pre-screen** → folded in as the diagnostic's
     corroboration filter. ≥2 independent lens agreement (subset of
     {YDF, DBpedia annotation, mechanism cascade}; Sense is the
     subject of corroboration) IS the realism gate at corpus scale.
     m-19's realism MADR (whatever number it claimed under m-19's
     ac-09) is preserved as a definition but does not drive separate
     pre-screen work. The diagnostic's ac-09 supersedes m-19's
     pre-screen execution.
  2. **Coverage floor (240/240 types)** → satisfied by construction.
     The full gittables corpus pass on the measure half naturally
     surfaces every type Sense can emit; per-type prediction counts
     surface in `report.md` frontmatter. m-19's separate coverage
     push is unnecessary going forward.
  3. **Train/eval leakage firewall** → folded in as the diagnostic's
     constraint 6. MADR 0056 (train/eval leakage prevention) stands
     in full and is extended from the holdout subset to the full
     measure-half corpus. The diagnostic's ac-04 enforces the
     `file_content_sha256 MOD 2 == 1` partition; ac-03 enforces
     YDF training-set exclusion of `labelled_eval.tsv`.

  Net effect: m-19's open task surface closes. m-19's `spec.yaml`
  receives a status note in its `goal:` block pointing at this MADR;
  open ACs against m-19 are not pursued under m-19's identity going
  forward.

  **v19 retrain gate (MADR 0066) — re-anchored.**

  MADR 0066's six promotion conditions remain in force as the
  mechanical gate for any v20 candidate. The gate's **trigger
  condition** (when v20 promotion becomes possible) is now bound to
  the diagnostic's outputs:

  - v20 promotion is gated until `report.md` (diagnostic ac-10) ships
    AND surfaces ≥1 corroborated gap in the `training_data_addition`
    recommended-action-class.
  - At that point, v20 promotion is pursued via a separate follow-up
    spec consuming the surfaced training-data gaps; the gittables
    diagnostic spec itself does NOT promote v20 directly.

  MADR 0066's body receives an annotation referencing this MADR
  alongside its existing cross-references.

  **Autonomous inference module Phase 2 (MADRs 0083–0086) — paused.**

  The four MADRs describe a settled Phase 1 design (scope lock,
  ac-02 floor, sibling-context consumption, Phase 2 locked weights).
  Phase 2 *execution* (the empirical signal sweep against the
  calibrate half, the move from Phase 1's `{validator pass-rate,
  header-name}` to Phase 2's four-signal mix) is paused pending the
  diagnostic's `report.md`:

  - If the diagnostic surfaces gaps in mechanism categories that
    Phase 2's additional signals (generator-shape, sibling-context)
    would close, Phase 2 work resumes against those specific gaps,
    likely as a follow-up spec.
  - If the diagnostic surfaces gaps elsewhere (taxonomy-missing,
    validator-too-narrow, model-error), Phase 2 may remain paused
    indefinitely while the focus shifts to training-data or
    validator work.

  The four MADRs (0083, 0084, 0085, 0086) each receive a status
  note in their `body:` field referencing this MADR; their
  `status: accepted` stays — the decisions stand, only the execution
  is paused. The Phase 1 inference module (already shipped per the
  2026-05-04 spec) continues to operate; the diagnostic consumes
  `finetype infer-type` per the existing Phase 1 contract.

  ### Consequences

  - Good, because the project now has a single active eval-expansion
    track instead of three overlapping efforts (m-19 + diagnostic +
    Phase 2). Coordination overhead falls.
  - Good, because the realism standard operationalises as a working
    filter (lens corroboration) instead of a programmatic pre-screen
    requiring its own quality bar.
  - Good, because v19 retrain gate's trigger is now tied to a
    concrete diagnostic output, not "whenever someone decides v20 is
    ready" — the lift condition is measurable.
  - Good, because Phase 2 inference-module work pauses in a state
    where the Phase 1 contract is still live; downstream consumers
    (the diagnostic's ac-08 mechanism attribution) are not affected.
  - Bad, because m-19's curated dataset work surface closes without
    those datasets being added to the corpus — if the diagnostic's
    full corpus pass surfaces gaps that the m-19 manual curation
    would have addressed, the recovery path is a follow-up spec
    rather than continuing m-19. Mitigation: m-19's existing curated
    rows (already in `eval/datasets/`) stay in tree; only the open
    expansion work closes.
  - Bad, because v20 promotion timeline is now coupled to the
    diagnostic's ~48–72h corpus pass plus report-authoring. Mitigation:
    accepted — author's posture is that no v20 promotion is needed
    until diagnostic findings name the work.
  - Neutral, because Phase 2's locked weights (MADR 0086) are not
    affected — they remain the canonical Phase 2 spec when execution
    resumes.

  ## Cross-references

  - **Spec `2026-05-20-gittables-multi-lens-diagnostic`** — the
    diagnostic that absorbs m-19; this MADR closes its ac-01.
  - **Spec `2026-04-21-eval-expansion`** — m-19; folded in per
    Disposition.m-19 above.
  - **MADR 0055** — eval realism dimensions; preserved as definition,
    operationalised differently going forward.
  - **MADR 0056** — train/eval leakage prevention; stands in full,
    extended to the full corpus measure-half.
  - **MADR 0057** — eval coverage floor; satisfied by construction
    under the diagnostic's full-corpus pass.
  - **MADR 0066** — v19 retrain hard gate; trigger re-anchored to
    diagnostic's ac-10 + `training_data_addition` surfacing.
  - **MADRs 0083, 0084, 0085, 0086** — Phase 2 inference signal
    decisions; paused pending diagnostic findings.
