title: GELU+LayerNorm architecture not adopted for multi-branch model
status: accepted
date_created: 2026-04-12
date_modified: 2026-04-12
body: |
  # 0046. GELU+LayerNorm architecture not adopted for multi-branch model

  ## Context and Problem Statement

  The autoresearch spike (Candle training experiments) identified GELU activation
  and LayerNorm as promising improvements over the default ReLU+BatchNorm in the
  multi-branch classifier. The question was whether these architectural changes
  would improve profile eval accuracy at production scale (sherlock-v5-scaled
  dimensions: [450,450]/[300,300]/[192,96]/[750,750]).

  ## Considered Options

  - **Option A:** Adopt GELU+LayerNorm as the default activation/normalization
  - **Option B:** Keep ReLU+BatchNorm (current default)

  ## Decision Outcome

  Chosen option: **Option B — keep ReLU+BatchNorm**, because GELU+LN regresses
  profile eval by 5 labels in a controlled fair comparison.

  Three training runs isolated the effect:

  | Run | Config | vs baseline | Confounds |
  |-----|--------|-------------|-----------|
  | v8  | GELU+LN, lr=1e-3, zero headers | -8 labels | LR + headers |
  | v9  | GELU+LN, lr=1e-4, zero headers | -8 labels | headers only |
  | v10 | GELU+LN, lr=1e-4, real headers | **-5 labels** | **none (fair)** |

  v10 was the first fair comparison — both v4-sibling and v10-gelu trained with
  real Model2Vec header features and frozen sibling-context enrichment. The 5-label
  gap (188/227 vs 193/227) is a genuine architectural effect.

  The GELU+LN code remains in the codebase behind `activation` and `use_layer_norm`
  config fields (backward compatible via `#[serde(default)]`). It can be revisited
  if future training data or model scale changes shift the balance.

  ### Consequences

  - Good, because ReLU+BN is proven at production scale with Sharpen post-processing
  - Good, because the configurable activation/norm infrastructure is available for future experiments
  - Bad, because GELU+LN showed higher val_accuracy (85.9% vs ~84%) — the benefit doesn't transfer through Sharpen
  - Neutral, the GELU+LN experiment surfaced a data quality issue (v7 FTMB had zero headers) that has been fixed

  ## Related

  - Decision 0038: Strength through simplification (retraining > new rules)
  - Decision 0041: Multi-branch as Sense replacement
