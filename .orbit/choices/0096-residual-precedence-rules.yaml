id: '0096'
title: Residual-precedence decisions are rule-shaped — scoped amendment to 0038
status: accepted
date_created: 2026-06-12
date_modified: 2026-06-12
body: |
  # 0096. Residual-precedence decisions are rule-shaped — scoped amendment to 0038

  ## Context and Problem Statement

  Decision 0038 ("strength through simplification") prefers retraining over
  disambiguation rules; rules are a last resort. Across 2026-06-11/12 the
  instruments produced six consistent measurements that one class of decision
  cannot be trained into the architectures we own:

  - v23 retrain: categorical +529% emission, 48k city columns absorbed.
  - v27 retrain, proxy round 1: categorical 5.76x over-emission at 16k
    training records.
  - v27 retrain, proxy round 2: 6.22x at 1.9k records — an 8x training-mass
    cut made the explosion WORSE. Presence-driven, not mass-driven.
  - fusion-v26 ship gate: value-view head collapses the label space at
    corpus breadth (categorical 10.7x, 90 types suppressed).
  - fusion-v27 lever fix (alpha floor + cardinality gate): helped, still
    NO-GO (6.05x, 47 types collapsed).
  - learning-to-defer selector: collapse-proof by construction, banked no
    win — the value expert holds neither headline boundary alone.

  The common mechanism: `categorical` and `alphanumeric_id` are RESIDUAL
  categories — "no tighter type fits" — and a flat 240-way softmax (or an
  additive value-view head) has no way to express that precedence. Trained
  as shape classes, the residual labels become near-universal attractors
  over short repeating strings / id-shaped strings.

  Meanwhile the same week, three value-based Sharpen rules shipped through
  the gold + corpus-honest gates (postal header-veto 0.6.27, veto
  shape-fallback 0.6.28, word-vocab override 0.6.29), moving verified
  accuracy 0.655 -> 0.719 with zero per-label regressions and the model
  untouched.

  ## Decision

  Amend 0038's scope: **prefer retraining over rules, EXCEPT for
  residual-precedence decisions, which are architecturally rule-shaped
  until a head with precedence semantics exists.** A residual-precedence
  decision is one of the form "a tighter assertion failed (or none fits) —
  which residual label does the column's own shape support?".

  Such rules are admitted under three standing conditions:

  1. **Value-based** (per 0048) — they read the column's values, never
     header metadata alone.
  2. **Gate-shipped** — gold no-regression AND corpus-honest GO are
     blocking preconditions, with both-sides evidence (the rule must be
     measured on the population it must NOT fire on, at corpus scale —
     R32's broad variant was rejected exactly there).
  3. **Ledgered** — every such rule is an entry in the deterministic-layer
     audit with a kill switch and a traceable `disambiguation_rule` tag,
     and must keep earning its place at corpus scale.

  0038's default remains in force for everything that is NOT residual
  precedence: boundary confusions between two genuine shape classes are
  still retraining territory (with the destination-drift proxy and the cap
  fix from memo 2026-06-12-ordered-distilled-cap-bug as preconditions).

  ## Consequences

  - The Sense model keeps shape classification; the deterministic layer
    owns precedence/fallback semantics. This is a measured division of
    labour, not a regression to the pre-0042 header-hint cascade — those
    rules patched model weakness unmeasured; these implement a decision
    class the architecture lacks, with gates.
  - Any future architecture bet that wants to reclaim this territory must
    design precedence in (hierarchical head, abstain-then-fallback, or
    explicit residual handling) and beat the rule baseline through the same
    gates. The fusion post-mortems (output/late-fusion/) are the design
    input.
  - Rule accretion is bounded by the deterministic-layer audit: a rule that
    stops earning its corpus-scale keep is deleted under the card-0019
    scenario-5 no-regression gold gate.

  ## Substrate

  - output/v27-recall-retrain/proxy_failed_report.md (training-side law)
  - output/late-fusion/ac07_ship_gate_decision.md, deferral_finding.md
    (architecture-side law)
  - memory categorical-is-a-residual-category
  - specs 2026-06-12-veto-shape-fallback, 2026-06-12-text-vocab-override
    (the admitted-rule pattern, applied twice)
