id: '0108'
title: 'Division of labour: the Sense model owns open-vocab semantics + broad shape; cede the closed/format/checksum tail to Sharpen + validators'
status: rejected
date_created: 2026-06-27
date_modified: 2026-06-28
verdict: |
  REJECTED 2026-06-28 on the 3-seed retrain. The leaf-drop reshape costs gold
  accuracy on EVERY seed — composed gold 0.811 / 0.832 / 0.792 (mean 0.812) vs the
  s43 baseline 0.853, i.e. −4.1pp mean, −2.0pp best. Not seed variance: a consistent,
  structural regression that misses choice 0104's parity-or-better bar. The recovery
  rule (`ceded_leaf_recovery`) is gold-clean, but the reshaped MODEL degrades on the
  KEPT classes (residual boundary `alphanumeric_id→word`) plus attractor drift to
  held-back leaves recovery cannot catch. Confound: the leaf-drop necessarily removes
  the ceded columns' training rows (131k→87k), so the cost blends class-removal and
  data-reduction; recovering the data means a residual catch-all class — the attractor
  trap the reshape was meant to avoid. The over-emit problem (the original motivation)
  is real but its fix is TRAINING NEGATIVES (task t-000133e418), not label-space
  surgery. Substrate: output/model-label-space-reshape/VERDICT.md, the ac-2/ac-3
  results, memory `reshape-leaf-drop-costs-gold`.
body: |
  # 0108. The Sense model's real job is open-vocabulary semantics + broad shape; the closed/format/checksum tail belongs to Sharpen + validators

  ## Context and Problem Statement

  Composed accuracy is carried by the Sharpen layer, not the model. Three
  independent retrains lifted raw Sense +4–7pp and moved composed gold ZERO
  (memory `composed-is-rule-bound`: gte 0.502→0.571, per-value attn 0.522→0.561,
  both composed-tied). So the model's job is SMALLER than its 244-leaf softmax
  pretends.

  The model carries a long tail of fine, value-determinable leaves — checksums
  (isbn, the securities/commerce/medical identifiers), closed validators (mac,
  email, ip, uuid, currency_code), format-exclusive leaves (the ISO timestamp
  family), synthetic-generator types (user_agent, si_number). These are NOT where
  a learned model adds value: a deterministic recogniser names them
  correct-by-construction. They ARE where the model MANUFACTURES the corpus
  over-emission that NO-GOs every fresh retrain (isbn collapse, currency_code
  3.2×, user_agent 7.2×, si_number 2.5× — choice 0104 §Evidence). The session's
  gold work was the same signal at the column level: of 47 re-adjudication
  candidates, the 28 KEPT were nearly all the model over-emitting a specific leaf.

  The ac-0 partition (`output/model-label-space-reshape/ac0_partition.md`,
  workflow `wf_9a28f0ad-47a`) classified all 244 model-predicted leaves against
  their actual taxonomy validators, adversarially challenged each cede:

  - **134 CEDE (safe now)** — conclusive value-only validator; deterministic
    recovery ships or is value-self-sufficient.
  - **29 CEDE (held)** — 21 checksum-identifier leaves needing a per-type recovery
    rule first; 8 bare-number epoch/compact leaves whose only recovery anchor is
    the model itself (held as KEEP).
  - **23 EXCLUDE** — open-vocabulary (city, entity_name, username, numeric_code,
    full_name, …); no validator can own them, the model's judgement is the only
    thing that can. These are what the reshape PROTECTS capacity for.
  - **58 KEEP** — permissive/broad validator (integer, decimal, plain_text, word,
    binary, the amount family); model arbitration is load-bearing.

  Architectural enabler (memory `model-output-label-space-is-taxonomy-driven`):
  the model's output head is sized from the live taxonomy, not the data, so a leaf
  can be removed from the softmax cleanly via a trainer deny-list without touching
  the taxonomy or the validation branch.

  ## Decision

  Reshape the Sense model to its real, reduced job and record the division of
  labour as policy:

  - **The model owns** open-vocabulary semantics (city vs region vs country,
    entity_name, username, full_name) and broad shape (integer vs decimal vs word
    vs plain_text vs categorical) — the calls that require learned, contextual
    judgement and that no validator can make.
  - **Sharpen + validators own** the closed/format/checksum tail — leaves whose
    membership is decided by a tight regex, a closed enum, or a check digit. These
    are removed from the model's training label space (`train-multi-branch
    --cede-labels`, head 244→110 for the conservative set) and recovered
    deterministically (correct-by-construction; recovery already ships for the
    delimited-datetime / structured-string / state-code / isbn families, and a
    generic closed-validator recovery rule covers the remainder).

  Two guardrails are load-bearing and must not be crossed:

  1. **Cede only CLOSED-vocabulary / validator-ownable leaves.** Vocabulary
     CLOSURE, not semantics, makes a leaf cede-able. Open-vocab over-emitters
     (city, entity_name, username, numeric_code) stay the model's job — ceding
     them loses recall with no recovery (memory
     `specialiser-is-the-abstaining-witness`: city AUC 0.987 / R@P.90 0.000).
  2. **Do NOT merge `word`+`plain_text` in TRAINING.** The residual is itself a
     softmax attractor; the cure was shrinking residual mass, not merging. The
     reframe stays a SCORING-only collapse (choice 0102).

  ## Decision Drivers

  - Composed is rule-bound at the Sense→Sharpen seam; the model's fine tail is
    pure liability there (FP mass, zero composed lift).
  - Removing the validator-ownable leaves strips FP mass WITHOUT losing recall —
    the deterministic recovery path is correct-by-construction and already ships
    for several families.
  - It is the unblock for a shippable retrain: the over-emit NO-GO triggers are
    leaves the reshaped model can no longer emit.
  - Simplicity: a 110-class head is a smaller, more honest model; the closed tail
    lives where it is testable in isolation (validators + Sharpen rules).

  ## Honest scope (what this decision does NOT yet prove)

  - The leaf-drop is an OPEN BET pending ac-2: a single-seed retrain on the reduced
    label space must show the over-emit band clears AND the FP mass does not simply
    RELOCATE to a neighbouring kept label (destination drift). ac-2 is the go/no-go.
  - The generic closed-validator recovery rule is the real engineering risk: a
    rule that asserts any leaf whose closed validator passes ≥90% can itself
    over-emit (a column of ISO-4217 words → currency_code). It must be gold-gated.
  - ac-3 (gold + composed parity) is judged by the gold-adjudicated relocation
    review (choice 0104), NOT a corpus-honest GO (structurally unpassable by any
    retrain).

  ## Consequences

  - Good: a reproducible, simpler default whose over-emission warts are gone by
    construction; the retrain roadmap is unblocked.
  - Good: the closed tail's correctness becomes a validator/Sharpen test surface,
    not a training-data lottery.
  - Neutral: a new generic recovery rule is added to the Sharpen layer (ledgered
    in the deterministic-layer audit with a kill switch, per decision 0096).
  - Risk: a cede whose recovery silently under-fires loses recall the gold corpus
    may not see; mitigated by the representative band + rare-type scoreboard.

  ## Supersedes / amends / relates

  - Builds on choice 0104 (gold-adjudicated relocation review for model swaps) —
    the reshaped model ships through that bar, not a corpus-honest GO.
  - Consistent with decision 0096 (residual-precedence is rule-shaped) and 0048
    (value-based rules): the ceded tail is recovered by value-based Sharpen rules.
  - Substrate: spec `2026-06-27-model-label-space-reshape`, ac-0 partition
    (`output/model-label-space-reshape/ac0_partition.md`), memories
    `composed-is-rule-bound`, `model-output-label-space-is-taxonomy-driven`,
    `specialiser-is-the-abstaining-witness`.

  ## Status note (proposed)

  PROPOSED, pending the ac-2 over-emit measurement and owner ratification. The
  division of labour is the decision the whole reshape depends on — it is surfaced
  to the owner now so the direction is agreed before the recovery-rule build and
  the gold/composed parity run commit effort.
