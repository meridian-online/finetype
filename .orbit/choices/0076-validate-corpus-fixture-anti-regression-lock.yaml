id: '0076'
title: Validate-corpus fixture as anti-regression lock
status: accepted
date_created: 2026-04-29
date_modified: 2026-04-29
body: |
  # 0076. Validate-corpus fixture as anti-regression lock

  ## Context and Problem Statement

  Iter-2 of validate-corpus shipped a per-mechanism breakdown table but
  no row-level oracle. A future code change (cascade rule reorder, model
  promotion, taxonomy edit, allowlist tuning) could silently flip a
  column from `code_vs_canonical` to `misclassification` without any
  test catching the regression. The per-mechanism counts could stay
  identical while individual rows churn — the headline "3 of 12 datasets
  pass at P=99%" is too coarse to surface row-level drift.

  Iter-3 needs a way to lock the cascade's row-level attribution against
  silent regression while still allowing the harness to evolve as the
  model and taxonomy improve. Two requirements pull against each other:
  (1) a strict oracle catches drift; (2) a strict oracle becomes
  brittle as soon as the underlying engines change.

  ## Considered Options

  - **Option A — No fixture; rely on per-mechanism counts.** Iter-2's
    status quo. Easy to maintain but gives no row-level guarantee. A
    cascade reorder that flips 5 rows from one bucket to another with
    symmetric counts is invisible.
  - **Option B — Strict per-row fixture, no escape valve.** Every
    failing column has a fixed `(mechanism, trigger)` expectation;
    CI fails on any divergence. Catches all drift but makes legitimate
    improvements (model lift, allowlist tuning) require fixture
    updates as part of the same PR — no soft-fail surface for
    known-pending work.
  - **Option C — Per-row fixture with `pending_escalation` flag.**
    Each row has `expected_mechanism` + `rationale` + `pending_escalation`
    bool. The regression test iterates harness output and asserts
    fixture-vs-actual match, but skips rows where
    `pending_escalation: true`. Pending rows document known taxonomy /
    model gaps without forcing brittle assertions.

  ## Decision Outcome

  Chosen option: **Option C — per-row fixture with `pending_escalation`
  flag**, because it gives a strict oracle for the rows we are confident
  about (the iter-2 anchors and harness-validated Phase 2 rows) while
  allowing the iter-3 reality of "this row's correct attribution is
  contingent on a fix we haven't shipped yet" to be recorded in the
  fixture itself.

  The fixture lives at
  `eval/datasets/validate_corpus_expected_attributions.yaml` and is the
  single source of truth for "what attribution should this row produce?"
  The schema is:

  ```yaml
  - dataset: <basename of dataset directory>
    column: <column header>
    expected_mechanism: <enum_overfit|format_diversity|misclassification|code_vs_canonical|fallthrough>
    rationale: <plain-English why this row attributes here>
    pending_escalation: <bool, default false>
  ```

  The regression test
  (`vci3_fixture_attribution_regression_match`) parses
  `eval/eval_output/validate_corpus.md`'s per-column attributions table
  and asserts each row matches the fixture's `expected_mechanism`,
  skipping rows where `pending_escalation: true`. Iteration is over
  harness output, NOT fixture rows — fixture rows that no longer fail
  (NYC Taxi `tpep_pickup_datetime` after m-19 timestamp widening) are
  silently preserved as forward-looking anchors: if the column ever
  fails again, the fixture row pins what the expected attribution
  should be.

  The fixture is committed in two phases to enforce the
  "oracle-then-validation" discipline:

  - **Phase 1 — anchors only.** Hand-authored rows transcribed from
    ground-truth `.gt.yaml` `notes:` sections. Five rows: GDELT SQLDATE,
    FIFA Value, NYC Taxi tpep, GICS Sector (`pending_escalation: true`),
    OECD REF_AREA. Phase 1 is committed BEFORE the iter-3 harness runs
    so the anchor's `expected_mechanism` is independent of the cascade's
    classification of it.
  - **Phase 2 — harness-derived.** After Phase 1 ships, run the iter-3
    harness against the full 12-dataset manifest, append a fixture row
    per failing column with `rationale = first sentence of the rule's
    rustdoc`, hand-review each row. The Phase 2 rows are the cascade's
    current state — the lock against silent regression — but they are
    NOT independent oracles. If the cascade has a latent bug, Phase 2
    rows reflect the bug.

  `FIXTURE_BASELINE_ROWS` is pinned to the post-Phase-2 row count (80 in
  iter-3) by `vci3_fixture_row_count_baseline`. The constant guards
  against silent fixture truncation.

  ### Consequences

  - Good, because row-level attribution drift is caught by a single
    test rather than requiring per-row asserts in the test file.
  - Good, because `pending_escalation: true` lets us document
    known-correct-but-currently-suppressed-by-upstream-gap rows
    (REF_AREA's model-misprediction collision, GICS Sector's missing
    taxonomy label) without polluting the regression test with
    conditional logic.
  - Good, because the two-phase commit enforces oracle independence:
    Phase 1's `expected_mechanism` is provably not derived from the
    iter-3 cascade because Phase 1 lands before iter-3 runs.
  - Bad, because the fixture is a maintenance surface — any model
    promotion, taxonomy edit, or allowlist change that legitimately
    shifts a row's attribution requires a fixture update in the same
    PR. Mitigated: the regression test's failure message names the
    specific dataset, column, expected, and actual mechanisms — the
    fix is mechanical.
  - Neutral, because rows whose harness output no longer fails
    (post-fix NYC Taxi tpep) are silently preserved. The fixture's
    anchor count grows monotonically; cleanup is opt-in not enforced.
