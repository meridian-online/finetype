body: |
  # 0099. Dispatch CLI CSV ingestion to DuckDB (gated on a Windows bundled-build spike)

  ## Context and Problem Statement

  The CLI reads CSV with a bespoke single-threaded `csv`-crate reader
  (`read_csv_input`, `crates/finetype-cli/src/profile_io.rs:117`) — a siloed
  ingestion path separate from the DuckDB extension's `ft_profile(read_csv(...))`.
  DuckDB's CSV reader is parallel/vectorised with a robust dialect sniffer
  (delimiter, quoting, compression, header/type detection). Dispatching CLI
  ingestion to DuckDB would: speed up large-CSV profiling, retire the bespoke
  path, and — the strategic prize — make the **free-stats inference path
  universal**. Routed through DuckDB, every input (CSV included) gets full-column
  statistics computed in one fast parallel scan, so the column-statistics lever +
  neural short-circuit (deferred from spec 2026-06-16-column-statistics-lever,
  ac-05/ac-07) apply on CSV, Parquet, and DuckDB tables alike — not just
  DuckDB-native tables.

  THE BLOCKER: the shipped CLI **deliberately excludes bundled DuckDB**. The
  default `cpu` build pulls no `finetype-train`, so the distributed binary never
  compiles the bundled DuckDB amalgamation — by design, to (a) dodge the
  bundled-DuckDB Windows/MSVC build failure that has broken releases and (b) stay
  lean (`crates/finetype-cli/Cargo.toml` `[features]` comment). Single-binary
  distribution (Homebrew / GitHub releases / one static binary) rules out a
  non-bundled system `libduckdb` (that would require DuckDB installed on the
  user's machine). So the only way to dispatch to DuckDB is to bundle it into the
  shipped binary — which re-introduces the Windows/MSVC build fragility that was
  engineered away.

  ## Decision Drivers

  - CSV ingestion speed + dialect robustness (DuckDB >> bespoke reader).
  - Code consolidation: one ingestion path, retire `read_csv_input`.
  - Universal free-stats: column-stat rules + neural short-circuit on every input.
  - AGAINST: Windows/MSVC release-build reliability — a proven failure mode the
    local (macOS/Linux) toolchain cannot reproduce.
  - Binary size: roughly doubles — acceptable per author.
  - Single-binary distribution: bundled is mandatory; no system-libduckdb option.

  ## Considered Options

  1. **Dispatch to bundled DuckDB in the shipped CLI** (the proposal) — bundle
     DuckDB, route ingestion through an in-process connection (`read_csv` →
     sample + stats in SQL → shared engine), delete the bespoke reader.
  2. **Status quo + position the extension as the fast path** — keep the lean
     bespoke reader; document `ft_profile(read_csv('f.csv'))` for large CSVs.
     Two surfaces, two audiences; no capability lost (the fast path already
     exists), only consolidation forgone.
  3. **Feature-gate DuckDB ingestion** (like `train`) — opt-in; default stays
     bespoke. Half-measure: does not retire the siloed path for the shipped
     binary, so most users see no change.
  4. **Parallelise the bespoke reader** — close some of the speed gap without
     DuckDB; keeps single-binary + no Windows risk; never matches DuckDB's
     sniffer/robustness and does not deliver universal free-stats.

  ## Decision Outcome

  **GATED.** Adopt Option 1 IF AND ONLY IF the Windows bundled-DuckDB build spike
  (below) goes green on the release runner with a current pin, AND a permanent
  Windows-bundled CI gate + a locked DuckDB pin are added. Otherwise adopt
  Option 2 (lean CLI; extension as the fast path). The hinge is purely the
  Windows build — every other axis favours Option 1.

  ## Deciding Experiment — the spike

  GOAL: determine whether bundled DuckDB compiles in the shipped CLI on the
  Windows MSVC release runner with a current pin. This is the only real unknown;
  it cannot be reproduced locally, so it must run on CI.

  METHOD (throwaway branch / PR, CI-only — no production change):
  1. Add a `duckdb` dependency (`features = ["bundled"]`) to `finetype-cli`
     enabled in the DEFAULT/`cpu` build (a temporary `duckdb-csv` feature folded
     into `default`).
  2. Add a trivial in-process call — open a `Connection`, run
     `SELECT * FROM read_csv('<fixture>.csv') LIMIT 1` — to force real linkage so
     it is not dead-code-eliminated.
  3. Push to trigger the cross-platform build (the `release.yml` matrix or a
     dedicated CI workflow) across all 5 targets: linux x86/arm, macOS x86/arm,
     **windows-msvc** (the load-bearing one).
  4. Pin: try the current workspace pin (`=1.10503.1`) first; on Windows failure,
     sweep a small set of known candidates.

  SUCCESS CRITERIA:
  - All 5 platform builds green (windows-msvc is decisive).
  - Binary-size delta measured and recorded.
  - Smoke parity: `finetype profile <fixture>.csv` via the DuckDB path returns the
    same labels as the bespoke reader on a parity fixture.

  OUTCOME ROUTING:
  - GREEN → open the implementation spec (route ingestion through DuckDB, delete
    `read_csv_input`, wire the universal free-stats path + short-circuit, lock the
    DuckDB pin, add the permanent Windows-bundled CI gate). Flip this choice to
    `accepted`.
  - RED → flip this choice to `rejected` (adopt Option 2); record the failing pin
    + error; document the extension as the large-CSV path.

  COST: ~one CI build cycle; low.

  ## Consequences

  - Good (if green): one fast, robust ingestion path; universal free-stats across
    CSV/Parquet/DuckDB; less bespoke code.
  - Bad (if adopted): bundled DuckDB in every shipped binary → larger binary + a
    standing Windows-build maintenance burden (pin discipline + the CI gate are
    mandatory, per the release-skill bundled-DuckDB guard).
  - Neutral: the DuckDB extension already provides the fast CSV path today, so
    Option 2 loses no capability — only consolidation.

  ## Outcome (2026-06-16) — REJECTED, adopt Option 2

  The deciding spike ran (`spike-duckdb-windows` #27607400306, throwaway branch
  `spike/duckdb-csv-windows`). **windows-msvc RED; linux + macOS GREEN.** Bundled
  `libduckdb-sys` (Rust `duckdb` crate, `features=["bundled"]`) fails under the
  Windows runner's MSVC — `cl.exe` exit code 2 compiling the DuckDB amalgamation
  file `ub_src_storage_compression_chimp.cpp` (MSVC 14.51.36231, pin `=1.10503.1`)
  — the exact failure class the `cpu` feature was built to dodge. The controls
  (macOS/Linux) compiled + linked the bundled CLI fine, so the approach is sound
  everywhere except the one platform that matters for the shipped binary.

  Because single-binary distribution forces bundling (no system-libduckdb
  option), and bundling breaks the Windows release, **dispatching CLI CSV
  ingestion to DuckDB is not viable.** Adopt **Option 2**: keep the lean
  csv-crate reader (`read_csv_input`) as the single-binary baseline; the DuckDB
  extension (`ft_profile(read_csv(...))`) is the fast/large-CSV path. The
  deferred free-stats path stays DuckDB-extension-scoped (not universalised via
  the CLI). REOPEN only if a future DuckDB release compiles clean under MSVC.
  Spike branch + workflow torn down. Evidence: `output/duckdb-csv-spike/`.

  ## Relationship to existing decisions

  - Reverses the `cpu`-feature design intent (no bundled DuckDB in the shipped
    binary) if adopted.
  - Unblocks and universalises the deferred free-stats path (spec
    2026-06-16-column-statistics-lever, ac-05/ac-07).
  - Interacts with the release discipline's bundled-DuckDB Windows-pin guard
    (docs/RELEASE.md).
