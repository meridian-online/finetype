id: '0101'
title: 'CLI is the canonical capability surface; every MCP tool maps to a CLI capability (ddl retired, schema folded)'
status: accepted
date_created: 2026-06-16
date_modified: 2026-06-16
body: |
  # 0101. CLI↔MCP surface parity — the CLI is canonical, MCP must not exceed it

  ## Context and Problem Statement

  The MCP server and the CLI drifted into different capability sets. As of
  v0.6.31 the MCP exposes seven tools — `infer`, `taxonomy`, `validate`,
  `profile`, `generate`, **`schema`**, **`ddl`** — while the CLI exposes
  `infer`, `taxonomy`, `validate`, `profile` (public) plus `generate` and other
  maintainer-internal subcommands (hidden). Two of the MCP tools have no CLI
  equivalent:

  - **`schema`** — the CLI `schema` verb was RETIRED in v0.6.19 (choice 0070):
    its type-mode folded into `taxonomy KEY -o json-schema`, its table-mode into
    `profile -f FILE -o json-schema`. The MCP `schema` tool was left in place as
    a documented carve-out (v0.6.19 visibility cleanup) pending the mirror fold.
    It is now stale capability the CLI deliberately does not have.
  - **`ddl`** — emits CREATE TABLE DDL from a profile. The CLI has NO `ddl`
    command (not even hidden); the CLI's typed-table story is
    `validate --db/--table` (materialise). `ddl` is MCP-only.

  An agent reading the MCP surface and an analyst reading the CLI surface should
  see the SAME set of capabilities. Capability drift between the two surfaces is
  a correctness and trust problem: it means "what FineType can do" depends on
  which door you came in.

  Not all asymmetry is drift, though. `generate` is exposed as a public MCP tool
  AND a *hidden* CLI subcommand BY DESIGN (choice/card 0010: MCP is the public
  sampling surface; the CLI subcommand is maintainer-internal training tooling,
  hidden because faker libraries serve general fake-data needs better). So the
  rule cannot be naive name-equality.

  ## Decision

  **The CLI is the canonical capability surface. Every registered MCP tool MUST
  map to a CLI capability** — a visible subcommand, or an intentionally hidden
  one with a recorded reason (e.g. `generate`, card 0010). The reverse is
  permitted: the CLI may carry maintainer-internal hidden subcommands (`check`,
  `train-multi-branch`, `extract-features`, …) with no MCP tool. Formally:

      { MCP tools } ⊆ { CLI capabilities, visible ∪ intentionally-hidden }

  Two concrete corrections follow, settling the present drift:

  1. **`schema` → FOLD (parity via choice 0070).** Add a `json-schema` output to
     the MCP `taxonomy` tool (type-mode, calling the existing
     `emit_type_schema()` helper); table-mode is already covered by the MCP
     `profile` tool's `json-schema` format. Then remove the `schema` tool. Net:
     the MCP mirrors the CLI's 0070 fold exactly.
  2. **`ddl` → RETIRE (parity DOWN).** Remove the `ddl` tool. The CLI has no DDL
     command and will not gain one; `validate --db/--table` is the typed-table
     surface. (Author's explicit call: parity down, not up.)

  A **parity guard test** makes the rule enforceable: a single manifest
  enumerates the agreed MCP↔CLI mapping (each MCP tool annotated as "mirrors CLI
  command X" or "intentional MCP-public of hidden CLI command X + card ref"); a
  test asserts the server's registered tool set equals the manifest. A new MCP
  tool, or a removed CLI command, fails the test until the mapping is updated —
  forcing the asymmetry to be a decision, not an accident.

  ## Considered Options

  1. **MCP ⊆ CLI, fold schema + retire ddl + add a guard** (chosen).
  2. **Parity UP for ddl** — add a `finetype ddl` CLI command so both surfaces
     carry it. Rejected by the author: DDL emission is not a capability the CLI
     should grow; `validate --db/--table` already materialises typed tables.
  3. **Leave the drift, document it** — rejected: the carve-out was always
     "pending the mirror fold" (schema.rs), and undocumented capability drift is
     exactly the trust problem this closes.

  ## Consequences

  - Good: one capability surface; an agent and an analyst see the same FineType.
    The guard prevents silent re-drift.
  - Good: `emit_type_schema()` keeps a single caller path (CLI + MCP taxonomy),
    no behaviour change to schema emission.
  - Bad: removes the MCP `ddl` tool — a (minor) capability loss for any agent
    that called it. No CLI equivalent existed, so this narrows the product, not
    just the MCP. Acceptable per the author's parity-down call.
  - Neutral: card 0008 drops from "8 tools" to the parity set; card text +
    README + the MCP tool docs update accordingly.

  ## Relationship to existing decisions

  - Completes choice 0070 (schema-verb fold) on the MCP side — the carve-out
    schema.rs flagged for "the v0.6.20 audit".
  - Preserves choice/card 0010's intentional generate asymmetry (named in the
    guard manifest, not flagged as drift).
  - Touches cards 0008 (MCP server) and 0006 (CLI).
