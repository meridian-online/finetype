id: '0090'
title: 'Dataset provenance: extend sources.yaml with snapshot integrity fields, two snapshot modes'
status: accepted
date_created: 2026-05-24
date_modified: 2026-05-24
body: |
  # 0090. Dataset provenance: extend sources.yaml with snapshot integrity fields, two snapshot modes

  ## Context and Problem Statement

  v20 corpus-pass evidence showed the geography retrain failed the AC-04
  cells (cell 2 −1.1%, cell 1 −3.0% vs the −20% threshold). The post-mortem
  cross-tab needed to ask which GeoNames-equivalent training data v19 had
  already seen — but FineType had no single source of truth for
  contributing datasets. Sherlock came from a HuggingFace pull with no
  recorded revision; GitTables was a 1M-parquet tree at an absolute path
  with no integrity manifest; CLDR was a vendored TSV set with the version
  buried in a README; the new GeoNames work was about to land with no
  pattern to follow. The existing `eval/datasets/sources.yaml` (choice
  0056) already tracked train↔eval leakage roles for many entries but
  had no integrity fields, so it could detect role misuse but not silent
  drift.

  Forcing this now matters because v21 will be a multi-month investment
  and the registry has to be in place before the v21 fetch script runs,
  or v21's reproducibility chain inherits the same gap v20 had.

  ## Considered Options

  - **Option A** — extend the existing `eval/datasets/sources.yaml` with
    integrity fields (snapshot pointer, local path, dataset version),
    keep the role-manifest semantics from choice 0056 untouched.
  - **Option B** — create a parallel `datasets/registry.yaml` and leave
    sources.yaml as the role manifest. Integrity tracking lives in the
    new file, leakage tracking stays in the old.
  - **Option C** — track integrity inline in each training launcher script
    (e.g. write a per-file SHA manifest at the start of each
    `overnight_*.sh` run). No central registry; the run's manifest is
    its own record.

  ## Decision Outcome

  Chosen option: **Option A**, because the existing sources.yaml is already
  the agreed authority for "what data contributes to FineType," and split
  registries reliably drift apart over time. Extending the schema keeps
  leakage rules and integrity rules adjacent so future audits can see
  both in one file.

  ### Schema extension

  Three optional fields added per `sources[]` entry:

  - `local_path` — absolute path for external data
    (`/Users/hugh/datasets/<name>`); `repo://…` URI for in-repo data.
    Mirrors the existing `repo://` URI convention used by `source_url`.
  - `snapshot` — relative path from repo root to a per-source snapshot
    JSON under `eval/datasets/snapshots/`.
  - `dataset_version` — stable identifier. Date for daily-rotating
    sources (GeoNames), release tag for versioned sources (CLDR 46.0.0),
    content hash for upstreams that don't version (Sherlock HF
    revision SHA, GitTables corpus-paths SHA prefix).

  All three are optional per entry — the 35+ existing eval-CSV entries
  keep their role-only data without forced backfill; they gain integrity
  fields as routine maintenance touches them.

  ### Two snapshot modes

  - **`full`** — every file under `local_path` is hashed (SHA256 + size).
    Default mode. Right for datasets up to a few thousand files.
  - **`index-only`** — for very-large path-list datasets (GitTables: 1M+
    parquets). Hashes the index file itself plus a deterministic
    1000-file stride sample. Caught by an explicit
    `snapshot_mode: index-only` field so `dataset_verify.py` dispatches
    correctly; the two modes are not interchangeable.

  Rejected: a single mode that scales by sampling everything. The
  per-file integrity guarantee for small datasets is too valuable to
  trade; per-file SHA is cheap when there are few files and worthless
  when there are 1M.

  ### Out-of-scope policy

  The registry covers datasets that contribute to the FineType codebase.
  Three classes are explicitly excluded:

  - **Personal sandbox** data — local datasets not referenced by any
    launcher or spec.
  - **Derived artefacts** produced by FineType itself (training csv
    blends, corpus-pass parquets) — reproducible from registered inputs
    + a script, so the inputs are what need provenance.
  - **Private external datasets** belonging to other projects, even if
    stored locally. The registry is for data contributing to this repo;
    downstream uses keep their own registries.

  ### Consequences

  - Good, because reproducibility chains now terminate at byte-hashed
    inputs. A v21 training manifest can reference
    `eval/datasets/snapshots/geonames-2026-05-24.json` by SHA-of-the-
    snapshot and the v21 model is provenance-anchored end-to-end.
  - Good, because adding a new dataset is now one command
    (`dataset_register.py <name> <path> --role train --licence … --attribution …`).
    Future training sources land via the same path instead of ad-hoc glue.
  - Good, because pre-flight verify catches silent drift before
    multi-hour runs commit their output to a corrupted input.
  - Bad, because the `dataset_register.py` rewrite path loses YAML
    comments above individual entries. Acceptable for v1 (the header
    note flags the trade-off; ruamel.yaml round-trip can restore later);
    documentation belongs in `datasets/README.md` and the MADR file
    anyway, not in field-level comments.
  - Bad, because the existing 35+ eval-CSV entries don't gain integrity
    fields automatically. Mitigated by allowing optional fields per
    entry; the verify script skips entries without a `snapshot` field.
    Routine maintenance backfills as touched.
  - Neutral, because `index-only` mode is a real coverage gap — it
    doesn't catch silent modification of files outside the 1000-file
    sample. The maintainer mitigates by periodic full re-snapshots.
    Documented in `datasets/README.md` so the trade-off is visible.
