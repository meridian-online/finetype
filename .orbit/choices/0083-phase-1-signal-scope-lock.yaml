id: '0083'
title: Phase 1 inference signal scope lock
status: accepted
date_created: 2026-05-04
date_modified: 2026-05-04
body: |
  # 0083. Phase 1 inference signal scope lock

  ## Context and Problem Statement

  The triangulator (MADR 0079) is designed to fuse multiple
  independent signals about a column's correct type. Four signal
  families are technically available: validator pass-rate (run
  each of 240 validators against samples); header-name match
  (token-overlap between column name and taxonomy label tail);
  generator-shape (compare samples to what the per-type generator
  in `crates/finetype-core/src/generator.rs` would produce);
  sibling-context (use other columns in the same parquet file as
  disambiguating context, leveraging Model2Vec embeddings already
  loaded in the runtime). Each signal has a different cost and
  different precision profile. Phase 1 needs to ship cheap and
  correct enough to satisfy ac-02's ≥60% non-unknown floor at
  ≥0.7 confidence on the held-out half. Adding more signals
  later is easy if they're decoupled; designing them in from the
  start risks breaching the ac-05 100ms budget and requires
  empirical evidence the simpler form can't reach the floor.

  ## Considered Options

  - **Option A — All four signals from the start.** Maximum
    Phase-1 confidence; bigger code surface for first ship; risks
    ac-05 budget (sibling-context attention through Model2Vec is
    the heaviest signal — current `multi-branch sibling context`
    loader is ~400K params); requires deciding fusion form for
    four-way score aggregation.
  - **Option B — Validator pass-rate + header-name match only.**
    Two cheapest signals. Validator scan (240 regex/enum × 8
    truncated samples = 1920 evaluations) is ~2ms on M1; header
    tokenisation + label scan is ~1ms. Total cost stays well
    inside budget. Defers generator-shape and sibling-context to
    Phase 2 — invocable only if empirical floor measurement
    shows the two-signal pair can't satisfy ac-02.
  - **Option C — Validator pass-rate alone.** Even simpler. Fails
    the validator-broken cases (Sex, timezone) that motivated the
    triangulator architecture. Header-match is the salvage signal
    there. Option C effectively reverts to MADR 0079 Option A
    (validator-retrieval) which the architecture decision rejected.
  - **Option D — Header-name match alone.** Independent of
    validator quality. Misses purely-shape-driven types (UUIDs,
    ISO dates, country codes — columns where the header carries
    no signal but the value-shape is unambiguous).

  ## Decision Outcome

  Chosen option: **Option B — validator pass-rate + header-name
  match only**, locked for Phase 1, because it is the smallest
  signal pair that exercises both axes of the
  "validator-broken vs model-error" discrimination MADR 0079's
  triangulator architecture depends on. Options C and D each
  collapse the architecture to one axis; Option A invites scope
  creep before empirical evidence justifies it.

  The lock is operationally enforced by:
  - Module's source MUST NOT reference generator-shape extraction,
    sibling-context attention, or Model2Vec embeddings. Audited
    via `grep -ri 'generator_shape\|sibling_context\|model2vec'
    crates/finetype-core/src/infer.rs` returning only TODO
    comments or no matches (ac-11 verification).
  - The `signals` JSON the module emits has fields
    `validator_pass_rate` and `header_match` only. Adding fields
    is a forward-compatible schema change but would require
    extending the cascade rules (ac-09) — a follow-on bead.
  - The fusion form is weighted-sum with locked weights
    `w_v=0.4, w_h=0.6` (MADR 0079). Adding signals would require
    redefining the weight invariant `w_v + w_h = 1.0`; the simple
    form admits two-signal extension via `w_v + w_h + w_g + w_s
    = 1.0` if Phase 2 is approved.
  - The descriptive sweep on `failure_log.tsv`'s calibrate half
    (bucket 0) is for the curve in `progress.md`; it does NOT
    authorise weight tweaking. Phase 2 expansion requires its own
    card and review-spec cycle.

  ### Consequences

  - Good, because Phase 1 ships in a fraction of the time a
    four-signal triangulator would, and the latency budget has
    comfortable headroom (~25ms estimated vs 100ms budget).
  - Good, because the empirical evidence for whether
    generator-shape and sibling-context are *needed* is itself a
    Phase-1 deliverable: if ac-02 floor (≥60%/≥0.7) is comfortably
    exceeded with two signals, Phase 2's case is weaker; if it's
    marginal, Phase 2 has a measurable target to improve against.
  - Good, because the lock is a forward-looking constraint that
    prevents the implementing agent from sneaking generator-shape
    in as "just one more signal." If the Phase-2 case looks
    obvious during implementation, the right move is to file a
    follow-on bead, not extend Phase 1's scope.
  - Bad, because some columns will fail the floor purely because
    Phase 1 lacks the signal that would have classified them.
    Specifically: columns with neutral headers (`x`, `field_3`)
    AND broken validators (Sex with case mismatch under
    neutral-header datasets) will score below threshold. These
    cases require generator-shape or sibling-context to recover.
    The held-out floor measurement (ac-02) will reveal how
    prevalent these are.
  - Bad, because sibling-context as a signal is currently
    computed for free elsewhere in the runtime (the cycle
    worker's profile call already runs Model2Vec sibling
    attention). Phase 1 is leaving that signal on the floor.
    Mitigated: the inference module's signals are intentionally
    *independent* of the model — one of the architectural
    claims (MADR 0079) is that the inference module triangulates
    ON the model's prediction, not WITH the model's internals.
    Sibling-context attention is part of the model's internals.
    If a future card moves toward "inference reuses model
    internals," that's a different architectural decision.
  - Neutral, because Phase 2 is preserved as a future direction.
    This decision is forward-looking — it doesn't rule out
    Phase 2; it specifies that Phase 2 needs its own justification.

  References:
  - `.orbit/specs/2026-05-04-autonomous-type-inference/spec.yaml`
    (ac-11 verification, constraint block)
  - `.orbit/specs/2026-05-04-autonomous-type-inference/interview.md`
    (Q7)
