title: RunPod Zombie Protection Fixes
status: accepted
date_created: 2026-04-11
date_modified: 2026-04-11
body: |
  # 0045. RunPod Zombie Protection Fixes

  ## Context and Problem Statement

  The first autoresearch session (80 experiments, $40 budget) revealed that 3 of 4 zombie pod protection layers failed silently. The pod ran ~20 hours instead of the intended 10, consuming the entire $40 budget at $1.98/hr instead of the expected $5.90 at $0.59/hr. Only the account balance cap prevented overspend.

  **Failures observed:**

  1. **Pod self-destruct timer**: `runpodctl pod stop` ran on the pod but had no API credentials — the command silently failed.
  2. **Beelink watchdog cron**: Relied on `uptimeSeconds` from the RunPod API, which always returned 0. The watchdog ran every 30 minutes but never detected the pod as exceeding its limit.
  3. **Reported pricing**: `runpodctl pod create` returned `costPerHr: 0.59` for a SECURE cloud RTX 4090, but actual billing was $1.98/hr (3.4× higher).

  ## Considered Options

  - **Option A: Fix all three layers independently** — authenticate runpodctl on pod, switch watchdog to creation-time-based check, verify pricing from billing API after first hour.
  - **Option B: Simplify to two reliable layers** — drop pod-side self-destruct (unreliable by design since it requires API auth), strengthen the Beelink watchdog as primary kill mechanism, keep account balance as backstop.
  - **Option C: Use RunPod's native charge limit** — set a per-pod spending cap via the API if available, plus the watchdog fix.

  ## Decision Outcome

  Chosen option: "Option B — simplify to two reliable layers", because the pod-side self-destruct is inherently fragile (requires API credentials on an ephemeral machine) and adding complexity to make it work is worse than having one strong external mechanism.

  ### Implementation

  **Layer 1 — Beelink watchdog (primary):**
  - Calculate elapsed time from `createdAt` timestamp, not `uptimeSeconds` (which is broken in the API)
  - Compare `now - createdAt` against `MAX_RUNTIME_HOURS`
  - Log actual elapsed time on every check for auditability
  - Run every 15 minutes (not 30) for faster response

  **Layer 2 — Account balance (backstop):**
  - Set RunPod account balance to match session budget before each run
  - This is the only layer that provably worked

  **Pricing verification:**
  - After pod creation, wait 1 hour and query billing API to confirm actual rate
  - Update budget tracking with real rate, not the rate from `pod create`
  - Alert if actual rate exceeds expected rate by >20%

  **Drop from scripts:**
  - Remove pod-side `runpodctl` installation and self-destruct timer (lines 329-350 of `runpod_launch.sh`)
  - Simpler pod setup, fewer failure modes

  ### Consequences

  - Good, because fewer moving parts means fewer silent failures
  - Good, because creation-time-based check is deterministic (no API data dependency)
  - Good, because pricing verification catches rate surprises in the first hour
  - Bad, because losing the pod-side timer means slightly slower response if the Beelink goes offline — but the account balance still caps total spend
  - Neutral, because the 4-layer design looked robust on paper but 3 layers were untested against real API behaviour
