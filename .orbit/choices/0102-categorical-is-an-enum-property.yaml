id: '0102'
title: 'Categorical is a representation property (enum domain), not a competing semantic leaf'
status: proposed
date_created: 2026-06-17
date_modified: 2026-06-17
body: |
  # 0102. Categorical is a representation property (enum domain), not a competing semantic leaf

  ## Context and Problem Statement

  `representation.discrete.categorical` is modelled as a terminal semantic leaf
  that competes, in a single mutually-exclusive softmax/label decision, with
  `city`, `country_code`, `region`, `entity_name`, etc. The 2026-06-17
  investigation (memory `cardinality-boundary-error-is-real`) established that
  this is the **single largest gold error mass** AND that it is structurally
  unwinnable as posed:

  - Categorical cannot be TRAINED as a flat softmax class — every low-cardinality
    column matches it, so it becomes a universal attractor and collapses its
    neighbours (v23 +529%, v27 6x; memory `categorical-is-a-residual-category`).
    The `COLUMN_LEVEL_TYPES` guard in `prepare_multibranch_data.py` drops it from
    training; the shipped model emits categorical ONLY via deterministic Sharpen
    rules that key on `distinct` (cardinality) — `value_sharpen.rs` (6 sites),
    `feature_sharpen.rs`, `fusion_cardinality_gate`.
  - Full-column cardinality cannot SEPARATE categorical from `country_code`
    (median ratio 0.039 vs 0.044), `city`, or `region` — because those are
    low-cardinality on both sides.
  - Three blind panels WITH true cardinality only 88% confirmed gold and left
    columns fully contested. Re-adjudicating with cardinality moved the headline
    0 (gold cleanup does not unlock accuracy).

  The DuckDB ENUM design (https://duckdb.org/2021/11/26/duck-enum) names the
  category error directly. An ENUM is a **bounded, low-cardinality value domain**
  that is dictionary-encoded — *"a country column will never have more than a few
  hundred unique entries."* A country column is an enum AND semantically a
  country: **enum-ness is orthogonal to meaning**, a storage/representation
  property, not a semantic type. FineType already files categorical under the
  `representation` domain and already detects it by cardinality in the Sharpen
  layer — it is operationally an enum property, mislabelled as a competing leaf.

  So the question the model and the gold eval ask — "is this column categorical
  OR city?" — is malformed. A bounded `{Manhattan, Queens, Brooklyn}` column is
  genuinely BOTH a region and an enum. Forcing one label manufactures an
  irreducible boundary and penalises correct semantic predictions.

  ## Decision Drivers

  - Dissolve the largest, irreducibly-ambiguous error class rather than
    symptom-manage it.
  - Match what analysts actually need: the column's MEANING **and** whether it is
    a bounded enum they can dictionary-encode / validate against a fixed domain.
  - Remove the training attractor permanently (enum-ness becomes a structural flag
    computed from cardinality, never a softmax class).
  - Support OPEN enums (novel domains: system status, product categories) — a real
    analyst time-saver and modelling step, not just recognition of known codes.
  - AGAINST: an output-schema change, a gold-fixture migration, and an eval-scoring
    change. This is 0.7.0-scale, not an incremental rule.

  ## Considered Options

  ### Option A — Categorical as a gated residual leaf (status quo, refined)
  Keep `categorical` a competing leaf, defined as "low cardinality AND no more
  specific semantic type fits", gated by the residual-precedence design (choice
  0096). Cheap; no schema change. But it keeps the malformed mutually-exclusive
  boundary — the model must still DECIDE categorical-vs-specific, which we proved
  is unwinnable. "Categorical" stays a euphemism for "unclassified-but-bounded".

  ### Option B — Enum as an orthogonal column property (DuckDB model) — PROPOSED
  A column carries its semantic type AND, independently, an **enum-domain**
  property: `{ type: geography.location.country_code, enum: { closed|open, domain:
  [US, GB, FR], distinct: 3, rows: 5000 } }`. Enum detection is a DETERMINISTIC
  representation-layer computation (full-column cardinality + domain extraction —
  the `ColumnScanStats` plumbing already built in ac-04a, currently consumer-less),
  reported alongside the neural semantic type. The neural model never decides
  "categorical"; it only predicts the semantic type (now without a competing
  attractor). The pure case — a bounded column with NO semantic type (arbitrary
  status/category codes) — is reported as `{ type: <string/text residual>, enum:
  {open, domain: [...]} }`: that IS what "categorical" should mean, an
  enum-detected-but-unnamed domain.

  ## Decision Outcome (proposed)

  Adopt **Option B**: categorical/enum is an orthogonal, deterministically-computed
  representation property reported alongside the semantic type, not a competing
  softmax leaf. Retire `representation.discrete.categorical` as a terminal
  classification target.

  ## Patch decomposition (design 2026-06-17, interview in spec
  `2026-06-17-enum-domain-emission`)

  0102 ships in two increments; the author set the first as a PATCH (not 0.7.0):

  **PATCH increment — enum-domain emission (additive, no model/gold/eval change).**
  The enum domain is already emitted (`enum_emission.rs`) but gated by LABEL
  (`label_is_enum_eligible` → categorical/boolean) over the SAMPLE. The patch
  decouples it: emit the observed enum domain for ANY column whose FULL-COLUMN
  value structure is a bounded, cohesive domain, regardless of semantic label.
  The enum PREDICATE is:
    1. bounded cardinality (full-column distinct ≤ cap AND distinct/rows ≤ ratio);
    2. **structural cohesion** — a similarity score over the distinct values
       (author: enums are *designed* to look alike — alpha IDs, verbs, state
       codes; a low-cardinality column of heterogeneous values is not an enum).
       Patch primary: character-shape cohesion (deterministic). Semantic cohesion
       (Model2Vec cluster-tightness) is a future enhancement.
    3. not denylisted (continuous numeric, datetime, quasi-unique IDs).
  Thresholds are calibrated by a study, not fiat. **Open detection only** —
  closed-dictionary validation is deferred. `ColumnScanStats` (ac-04a) becomes the
  engine. Output is additive (extend `unique_values` / a small `enum` block).

  **0.7.0 increment — the accuracy reframe (deferred).** Eval scores semantic type
  with enum as a separate dimension; drop `representation.discrete.categorical` as
  a target; gold migration; residual-label decision; closed-enum dictionaries.

  ## Open vs closed enums

  Both fall out of Option B for free, because detection is structural:
  - **Closed/known enum** — the domain matches a recognised dictionary (ISO country
    codes, currencies). Validate against the known set; flag out-of-domain values.
  - **Open/discovered enum** — a bounded domain we have never seen (system status,
    custom categories). We cannot NAME it, but we DETECT it is an enum and EXTRACT
    its domain + cardinality. This is the analyst payoff the DuckDB blog gestures at
    ("Automatic Storage Encoding"): FineType says "bounded enum, domain {PENDING,
    ACTIVE, CLOSED}, 3 distinct over 10k rows" so the analyst can materialise the
    enum / validation without manual inspection. Open-enum detection is the one
    thing cardinality does reliably, and it is FREE (no model).

  ## Accuracy upside (honest framing)

  - One-time headline correction on the boundary mass: the model's specific-type
    predictions (`city`/`region`/`iata`) stop being scored as false positives
    against a `categorical` gold label, and categorical-FN columns get their real
    semantic type. Rough order: the ~22 boundary over-emission FPs + a share of the
    categorical FN — plausibly low-single-digit headline points — CONTINGENT on a
    gold migration to the type+enum schema and an eval that scores semantic type.
  - This is NOT a model improvement; it is the eval ceasing to ask an impossible
    question. State it as such — the upside is real for the number but it is
    definitional, not learned. (Precedent discipline: do not over-claim, per the
    2026-06-17 separator-bug retraction.)
  - The larger, non-headline win: the irreducible categorical boundary is gone, the
    training attractor is gone, and the output gains a load-bearing analyst feature
    (enum domains) the current schema cannot express.

  ## Consequences

  - Output schema gains an `enum` block (closed|open, domain, distinct, rows) on
    column profiles; `ColumnScanStats` becomes its engine (the ac-04a plumbing
    gets its consumer).
  - The neural label space drops `representation.discrete.categorical` as a target
    (it is already untrained); the Sharpen categorical sites are replaced by the
    enum-property computation.
  - Gold-fixture migration: `categorical` rows are re-labelled to their semantic
    type (or a string/text residual) + an enum flag; the eval scores semantic type
    with enum as a separate dimension.
  - Geography corollary (author, 2026-06-17): do NOT proliferate locale-specific
    geographic leaves (`neighbourhood`/`borough`/`district`) — they overlap
    `city`/`region` by locale and REDUCE precision. If granularity matters, model
    it as a graded attribute of `geography.location`, not N competing leaves. Same
    disease as categorical: orthogonal/graded facts forced into mutually-exclusive
    labels.

  ## Open Questions

  - What carries the "bounded, no semantic type" residual — a generic
    `representation.text.string`, or `plain_text`, or a dedicated `enum` type?
  - How does the eval score a two-part answer (semantic type + enum property)?
    Headline = semantic type only, enum as a separate precision/recall track?
  - Closed-enum dictionaries: which known domains ship first (ISO codes already
    have locale validation)?
  - Migration scope: one-shot gold re-label vs phased.

  ## Substrate

  Memories `cardinality-boundary-error-is-real`, `categorical-is-a-residual-category`,
  `full-column-stat-sharpen-is-redundant`. Spec
  `2026-06-17-cardinality-boundary-readjudication`. `ColumnScanStats`
  (`crates/finetype-model/src/column/mod.rs`, commit f1e047d). DuckDB ENUM blog
  (2021-11-26).
