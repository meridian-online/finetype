id: 0098
title: 'Generic checksum-substance guard for algo-exists identifier types'
status: accepted
date_created: 2026-06-15
date_modified: 2026-06-15
body: |
  # 0098. Generic checksum-substance guard for algo-exists identifier types

  ## Context and Problem Statement

  A validator audit (2026-06-15) found 17 taxonomy validators that check shape,
  not substance — length/format patterns with no checksum, a Precision
  Principle violation. 14 already have the check-digit algorithm in the
  codebase. ISBN was the proof-of-concept: `isbn_checkdigit_veto` shipped
  (0.6.27) as a per-type post-sharpen patch that re-checks the ISBN-10/13 check
  digit, because a same-length financial integer (`marketCap` 5150000128)
  otherwise profiles as an ISBN. The campaign's stated plan was to "fix the
  validator so the early `schema_validation_gate` rejects checksum-failing
  numbers upstream, making the veto redundant — then delete it," and template
  that across the other 13 algo-exists types (aba, luhn, npi, ean, upc, imei,
  isin, cusip, sedol, lei, iban).

  Two findings reshaped the plan:

  1. **The early-gate premise is false on the shipped model.**
     `schema_validation_gate` (column/mod.rs:860) lives only on the legacy
     `classify_column` path. The default `sherlock-v19` multi-branch pipeline
     early-returns into `classify_multi_branch` and never runs it — its only
     validator-driven demotion is the hand-rolled vetoes in
     `apply_post_sharpen_guards`. Shipping evidence confirms: the ISBN veto
     itself moved gold +4 (0.753→0.757), so it is load-bearing and cannot be
     deleted by strengthening a validator the pipeline never consults.

  2. **Folding the checksum into the shared validator regresses gold −4.**
     When the compiled `identity.commerce.isbn` validator was made
     checksum-aware, the generic `value_sharpen` schema-demotion rules — which
     also call `get_validator(label).is_valid` — fired first on
     checksum-failing ISBN columns and demoted them to their own fallback
     (`representation.identifier.numeric_code`), a worse target than the
     gold-correct `integer_number`. Four financial columns flipped
     correct→wrong (717→713 on the gold corpus).

  ## Considered Options

  - **A. Keep per-type vetoes; only dedupe + de-lax validators.** Add the
    checksum to each validator and share the math. Lowest risk, but retires no
    veto and (per finding 2) regresses gold via the generic rules.
  - **B. Route the multi-branch pipeline through `schema_validation_gate`.**
    Lets substance-checking validators retire the vetoes, but broadens demotion
    across every pattern-validated label — a large, separate bet.
  - **C. One generic guard scoped by a `checksum:` directive, owning the math
    in `crate::checksum`; validator stays shape-only.** Replaces the per-type
    veto pattern; each new algo-exists type enrols with a one-line YAML
    directive, not a new Rust veto.

  ## Decision Outcome

  Chosen option: "C", because it delivers the campaign's thesis — remove code
  while raising precision — for all numeric algo-exists types at once, while
  holding gold exactly: the guard reproduces the retired veto's behaviour
  (predictions byte-identical to main on the gold corpus).

  Mechanics:
  - `crate::checksum` (finetype-core) is the canonical home for the check-digit
    arithmetic (`isbn` today; `resolve(name)` dispatches; add an arm + a YAML
    directive to enrol a type).
  - A `checksum:` directive on the type `Definition` (sibling to `validation:`)
    names the scheme.
  - `checksum_substance_guard` (column/mod.rs, in `apply_post_sharpen_guards`,
    rhh kill switch `checksum_substance_guard`) reads the directive, resolves
    the function from `crate::checksum`, and on a bare-number column most of
    whose values fail the checksum, demotes to decimal/integer by shape.
  - The checksum is deliberately NOT folded into the compiled validator (the
    cause of the −4 regression). The validator stays shape-only; the dedicated
    guard owns the substance check and the gold-correct demotion target.
  - `isbn_checkdigit_veto` and its hand-rolled `is_valid_isbn` are deleted.

  Scope note: the guard fires only on bare-number columns, so it templates the
  numeric algo-exists types (aba, credit_card/luhn, npi, ean, upc, imei). The
  alphanumeric ones (isin, cusip, sedol, lei, iban) need a shape-aware
  extension before they can enrol — a follow-up, not part of this decision.

  ### Consequences

  - Good, because one guard + a one-line directive replaces N per-type Rust
    vetoes — the campaign removes code as it adds types (decision 0038).
  - Good, because gold held at 717/931 with predictions byte-identical to main,
    and the change cleared the H05 corpus-honest gate.
  - Good, because it is value-based (0048) and gate-shipped with a kill switch
    (0096), and the check-digit math is now tested once in `crate::checksum`.
  - Bad, because the taxonomy validators remain shape-only — the `validate`
    verb still does not checksum-validate ISBNs. De-laxing them safely needs a
    per-consumer audit of every generic schema-demotion rule's fallback target.
  - Neutral, because the original "fix the early validator" framing does not
    apply to the shipped pipeline; the deterministic guard layer, not the
    validator, is where substance checks land for the multi-branch default.
