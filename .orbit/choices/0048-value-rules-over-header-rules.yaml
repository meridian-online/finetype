id: '0048'
title: Value-based disambiguation rules only — no new header-based rules
status: accepted
date_created: 2026-04-18
date_modified: 2026-04-18
body: |
  # 0048. Value-based disambiguation rules only — no new header-based rules

  ## Context and Problem Statement

  v14 retrained the multi-branch model with targeted data curation (decontamination, hard negatives, collision separation) to fix 15 misclassifications from the v13 audit. Result: the 3 fixes that shipped all came from code changes (rule removal, post-hint guard), not from retraining. Training data curation produced a model with similar val accuracy (91.2%) but did not shift any eval predictions — especially not the 4 items at 1.00 confidence.

  12 misclassifications remain. They split into two groups:

  - **6 items fixable by value-based rules** — the values themselves contain a deterministic signal that distinguishes the correct type from the predicted type (e.g., 64-char hex = SHA-256 not tsid, "Name <email>" format = email_display not email, 3-digit integers in 100–599 = HTTP status codes not postal codes).
  - **5 items requiring header context** — the values are genuinely ambiguous; only the column name distinguishes them (e.g., decimal numbers in [-90,90] could be latitude or depth error; "us6000pgkh" could be a username or alphanumeric ID). No value-based signal exists.

  Decision 0038 said "prefer retraining over rules." Decision 0042 said "remove regex header hints." Both remain valid in principle — but 0038's mitigation clause ("if retraining doesn't fix a pattern, it can be added as a targeted rule") has been triggered. The question is: what kind of rules?

  ## Considered Options

  - **Option A: Add both value-based and header-based rules** — Fix all 12 items with targeted rules. Header-based rules would check column names for patterns like "status", "depth", "gap" to override predictions.
  - **Option B: Value-based rules only** — Fix the 6 items where values contain a deterministic signal. Defer the 5 header-dependent items to model improvements (subtype hierarchy, better training signal, architectural changes).
  - **Option C: Continue retraining approach** — Try different training strategies (higher learning rate, curriculum learning, focal loss) to shift the remaining predictions without rules.

  ## Decision Outcome

  Chosen option: "Option B — Value-based rules only", because:

  1. **Value-based rules check the data, not the metadata.** A column's values are universal — "Name <email>" format is display-style email regardless of what the column is called. Header-based rules depend on naming conventions that vary by dataset, language, and author.
  2. **Header context is the model's job.** The multi-branch architecture has a dedicated 128-dim header branch specifically to learn header→type associations. If the model can't learn "depthError ≠ latitude", the answer is a better model, not a regex on the column name. This extends decision 0042's principle from hints to rules.
  3. **v14 proved the boundary.** Four rounds of retraining (v11–v14) with progressively refined data curation produced diminishing returns. The remaining value-ambiguous items need architectural improvements (subtype-aware model head, hierarchical loss), not more data.
  4. **Value-based rules compose well.** They can stack with the model's prediction — each rule examines the values to confirm or override, independent of header signal. This makes them testable, debuggable, and unlikely to conflict.

  ### What gets value-based rules (v15)

  - R25: `postal_code` → `integer_number` when ≥90% of values are 3-digit ints in 100–599
  - R26: `tsid` → `hash` when ≥90% of values are 40-char or 64-char hex
  - R27: `compact_ym` → `year` when ≥90% of values are exactly 4 digits
  - R28: `email` → `email_display` when ≥80% of values match `.+\s*<.+@.+>`
  - R29: `phone_number` → `phone_e164` when ≥80% of values match `^\+\d{7,15}$`
  - R30: `amount_accounting` → `decimal_number` when 0% of values contain currency formatting

  ### What waits for model improvements

  - `latitude` vs `decimal_number` (depthError) — header-dependent, no value signal
  - `username` vs `alphanumeric_id` (earthquake id) — header-dependent, ambiguous values
  - `user_agent` → `jwt` / `plain_text` — model capacity issue, needs better training
  - `geojson` → `plain_text` — novel data shape, needs JSON-as-string training

  ### Consequences

  - Good, because value-based rules are deterministic, testable, and dataset-independent
  - Good, because it maintains pressure on the model to learn header context rather than offloading it to rules
  - Good, because the 5 deferred items become clear targets for architectural investment (subtype hierarchy, hierarchical loss)
  - Bad, because 5 items remain unfixed until model improvements ship
  - Mitigation: the 5 deferred items are low-confidence (0.43–0.96) and domain-correct — the practical impact on end users is limited
