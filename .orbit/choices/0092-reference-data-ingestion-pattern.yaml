id: '0092'
title: 'Reference-data ingestion: build-time fetch + normalise to tracked Parquet sieve-tables, large/licensed sources downloaded on demand'
status: accepted
date_created: 2026-06-05
date_modified: 2026-06-05
body: |
  # 0092. Reference-data ingestion: build-time fetch + normalise to tracked Parquet sieve-tables, large/licensed sources downloaded on demand

  ## Context and Problem Statement

  The B2 mining factory (spec 2026-06-05-reference-data-inventory) needs to
  read authoritative reference vocabularies — Geonames cities, full CLDR
  name tables, IANA tz/TLD/media-type registries, ISO 4217/639 codes — to
  train value-membership sieves. The repo has **no external-reference-data
  ingestion pattern today**: all reference data is hand-embedded in
  `generator.rs` (6,848 lines) and `locale_data.rs` (3,333 lines), there are
  no data crates, and the lists are demonstration-grade stubs (currency_code
  39 vs ISO 4217 ≈180; tz 12 vs IANA ≈600; city ≈12/locale vs Geonames ≈4M).

  Two forces collide. First, **size**: Geonames is ≈4M rows — far too large
  to vendor into a public Git repo. Second, **licence**: some sources must
  never be vendored at all (CPT is AMA-copyrighted; CUSIP/ISIN are
  commercially licensed — inventory ac-03). The pattern must let the small,
  permissive vocabularies be committed for reproducibility while keeping the
  large or licensed ones out of the tree entirely.

  This must be decided before the first B2 sieve (Geonames) is built, or the
  Geonames integration sets an ad-hoc precedent the rest inherit.

  ## Considered Options

  - **Option A — Vendor everything as in-repo data files.** Commit the
    normalised lists (CSV/Parquet) directly into the repo; build reads them
    locally. Simple, fully reproducible offline.
  - **Option B — Pipeline-time fetch, nothing tracked.** Every sieve build
    downloads its source fresh from upstream at run time; nothing reference
    lands in the repo. Always current, zero vendoring risk.
  - **Option C — Tiered: build-time fetch + normalise, with a size/licence
    gate deciding which normalised outputs are tracked in-repo vs
    downloaded on demand.** Small permissive vocabularies are committed as
    normalised Parquet sieve-tables; large or licensed sources are fetched
    to a gitignored cache, mirroring the model-weights download path
    (spec 2026-06-02-public-release-readiness ac-06: weights un-tracked,
    resolved on build/download).

  ## Decision Outcome

  Chosen option: **Option C**, because it is the only one that respects both
  hard constraints at once — a 4M-row Geonames table cannot be vendored
  (rules out A), and CPT/CUSIP must never be vendored regardless of size
  (also rules out A) — while small permissive code lists (ISO 4217 ≈180,
  IANA tz ≈600) are cheap to commit and benefit from offline-reproducible
  builds (rules out B's "nothing tracked" extreme). The size/licence gate is
  the same shape as the already-accepted model-weights split, so the repo
  gains one consistent "downloaded heavy artefact" mental model rather than
  two.

  ### Generation timing: build-time, not pipeline-time

  Normalisation runs at **build/refresh time** via a script
  (`scripts/reference_data_build.py` or a `build.rs`-adjacent step), not
  inside the inference pipeline. The pipeline consumes the normalised
  sieve-tables as static inputs; it never fetches. This keeps inference
  deterministic and offline, and keeps network/licence handling in one
  auditable place.

  ### The tracked-vs-downloaded gate

  A normalised source is **tracked in-repo** (as Parquet under
  `eval/datasets/reference/<source>/`) when BOTH hold:

  - **Small** — normalised size is modest (rule of thumb: the normalised
    table is under a few MB; ISO 4217, ISO 639, IANA tz/TLD/media-types,
    CLDR name tables qualify).
  - **Permissive** — the licence permits vendoring AND is confirmed (not
    "verify before use"): Geonames CC-BY (attribution kept), CLDR Unicode
    Licence, IANA public domain, ISO free codes, GLEIF CC0.

  Otherwise it is **downloaded on demand** to a gitignored cache
  (`~/.cache/finetype/reference/` or `eval/datasets/reference/_cache/`,
  gitignored), mirroring the model-weights download path:

  - **Too large to vendor** — Geonames (≈4M places). Even though CC-BY
    permits vendoring, size forbids it; the *raw* Geonames dump downloads on
    demand and the build normalises it to a compact sieve-table. The
    compact city/region table MAY then be tracked if it lands under the size
    rule; the raw 4M dump never is.
  - **DO-NOT-VENDOR by licence** — CPT (AMA ©), CUSIP/ISIN (licensed), and
    every "verify before use" source in inventory ac-03. These are **never
    fetched-and-vendored** and ideally never fetched at all: they are mined
    via pattern + checksum only, with no list materialised to disk.

  ### Normalised on-disk shape the B2 sieves consume

  One uniform schema so a sieve is source-agnostic. Each reference source
  normalises to a Parquet "sieve-table":

  ```
  reference/<source>/<vocabulary>.parquet
    value            VARCHAR   -- the canonical surface form (e.g. "Paris", "EUR")
    taxonomy_type    VARCHAR   -- the key it backs (e.g. geography.location.city)
    locale           VARCHAR   -- nullable; per-locale vocabularies only
    aliases          VARCHAR[] -- nullable; alternate spellings/abbreviations
    weight           DOUBLE    -- nullable; e.g. Geonames population for ranking
  ```

  The sieve loads the relevant `taxonomy_type` partition, builds a
  membership set on `value` ∪ `aliases`, and scores a candidate column by
  the fraction of its values that are members. This is the same
  membership-gate shape `country_code`'s 249-enum already implements
  inline — the pattern generalises it to a tracked table.

  ### Provenance integration

  Every reference source registers in `eval/datasets/sources.yaml` per
  choice 0090: `local_path` (the normalised Parquet or the cache path),
  `snapshot` (SHA manifest under `eval/datasets/snapshots/`), and
  `dataset_version` (Geonames date, CLDR release tag, IANA db version). The
  reproducibility chain terminates at a byte-hashed reference snapshot, so a
  v20+ training run is provenance-anchored to the exact vocabulary it mined
  against.

  ### Consequences

  - Good, because the public repo never carries 4M Geonames rows nor any
    AMA/CUSIP-licensed list — the two release landmines are designed out at
    the ingestion layer, not policed after the fact.
  - Good, because the tracked small vocabularies make most builds offline
    and fully reproducible; only Geonames-class sources need network.
  - Good, because the download-on-demand cache reuses the model-weights
    mental model already shipping in the release-readiness spec — one
    "heavy artefact downloaded, not tracked" pattern, not two.
  - Good, because the uniform sieve-table schema means B2 writes one sieve
    that works across every source; adding a source is a normalise script
    plus a `sources.yaml` row.
  - Bad, because a build-time fetch introduces a network dependency and an
    upstream-availability risk for refresh runs; mitigated by the snapshot
    manifest (a missing upstream falls back to the last hashed snapshot).
  - Bad, because the hand-embedded stubs in `generator.rs` / `locale_data.rs`
    now have a second source of truth (the sieve-tables) until the
    generators are migrated to read the normalised tables; the inventory
    flags this as follow-up, out of scope for B0.
  - Neutral, because the exact size threshold for "track vs download" is a
    judgement rule, not a hard byte limit; the gate names the qualifying
    sources explicitly so the boundary cases (compact Geonames city table)
    are decided per-source at integration time.
