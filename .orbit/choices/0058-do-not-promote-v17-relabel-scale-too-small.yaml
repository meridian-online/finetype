id: '0058'
title: Do not promote v17; relabel intervention below noise floor
status: accepted
date_created: 2026-04-21
date_modified: 2026-04-21
body: |
  # 0058. Do not promote v17; relabel intervention below noise floor

  ## Context and Problem Statement

  Decision 0054 held sherlock-v17 from promotion pending expanded-eval
  measurement. Rationale: 5 of 7 relabel target types (swift_bic,
  http_method, cpt, loinc, excel_format) had zero coverage in the
  pre-expansion eval, so relabel success was structurally unmeasurable.

  Spec 2026-04-21-eval-expansion (merged in PR #42) closed that gap
  — the corpus now has 448 rows with 240/240 type coverage (via
  manifest entries and restricted-registry carve-out) and a
  diagnostic-only v16 baseline at 297/352 (84.4% label, 91.8% domain).

  This decision answers the measurement question decision 0054 left
  open: does v17 now beat v16 on the expanded eval?

  ## Evidence

  Re-scored v17-seed-44 against the 448-row expanded manifest (see
  `.orbit/specs/2026-04-21-v17-re-eval/findings.md` for the full
  writeup and `profile_results.csv` artefacts on that branch):

  ```
  |                 | label correct | label % | domain correct | domain % |
  |-----------------|---------------|---------|----------------|----------|
  | v16 (default)   | 297 / 352     | 84.4%   | 323 / 352      | 91.8%    |
  | v17-seed-44     | 295 / 352     | 83.8%   | 326 / 352      | 92.6%    |
  | delta           | −2            | −0.6pp  | +3             | +0.8pp   |
  ```

  On the 10 manifest rows that specifically measure relabel-target
  types (user_agent ×3, ssn ×2, cpt, loinc, issn, excel_format,
  http_method), v16 and v17 are **identical**:
  **6 stable-hit / 4 stable-miss / 0 fix / 0 regression.**

  Signal-to-noise argument: PR #40 fixed ~45 distilled rows across 7
  types. Each type's training dataset is ~1000+ synthetic + distilled
  rows. 45 / 7000+ ≈ 0.6% of the training signal — below the noise
  floor even if every fix was perfectly correct.

  ## Considered Options

  - **A. Promote v17 anyway** — identical eval with small domain
    improvement (+3 domain). Rejected: no clear win on label accuracy,
    and v17 introduces 7 non-relabel regressions (3 on previously-covered
    rows, 7 on newly-covered rows per the delta comparison). A
    domain-neutral retrain that trades label correctness for domain
    correctness is not a promotion-worthy change.
  - **B. Re-sweep v17 with larger relabel scope** — fix 500+ rows per
    type instead of ~6. Rejected as the next move: the signal-to-noise
    argument argues for going further, but we lack evidence that the
    relabel *direction* is right. Before spending another retrain cycle
    on data cleaning, rule out the pipeline gap (option C).
  - **C. Stop training, wire validator-authoritative promotion, then
    re-measure** — the v17 re-eval surfaced a pipeline gap:
    `http_method` and `excel_format` both predict generic
    `representation.discrete.categorical` when named-type validators
    would confirm the specific type on every sampled value. Decision
    0051's intent was that schema/validator signal would flow through
    to the named-type output; in practice the promotion step isn't
    wired. Fix that first; re-measure; decide about retrains with
    the pipeline ceiling established.

  ## Decision Outcome

  Chosen option: **C**. Do not promote v17. Models
  `sherlock-v17-seed-{42,43,44}` remain on local disk but are not
  published or symlinked. `models/default` stays at sherlock-v16.

  The "fix more distilled data" lever in CLAUDE.md "What's next" is
  closed — relabel at current intervention scale is documented to
  fall below the noise floor. The next implementation work is
  validator-authoritative promotion, not data cleaning or retraining.

  ### Consequences

  - Good, because we stop rehearsing an exhausted lever. Relabel-and-
    retrain cycles at 6-row-per-type scope will keep producing
    identical eval deltas; the evidence is now clear.
  - Good, because the surfaced pipeline gap is smaller and more
    concrete than either "more relabel" or "feature redesign" — it's
    spec-able and fixable without a retrain.
  - Good, because establishing the pipeline ceiling first makes the
    next retrain evidence-led: we'll know which misses are model-
    learnable vs validator-solvable.
  - Bad, because v17's training work is now treated as sunk cost —
    the 3-seed sweep, V4 distilled loaders, generator rewrites
    (PR #40). These changes stay on main and are reusable for v18,
    but their specific promotion value is zero.
  - Bad, because the 7 non-relabel regressions in v17 (array
    separators, datetime specificity, protein_sequence, token_urlsafe)
    suggest the retrain redistributed capacity in ways we didn't
    predict. A feature-discrimination discovery card may need to
    investigate whether any of those regressions share a shape.
  - Neutral, because the relabel direction isn't disproven — it's
    just unmeasurable at this intervention scale. A much larger
    relabel (500+ rows/type) could move things, but isn't the right
    next bet until we know what the pipeline alone can do.

