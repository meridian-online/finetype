title: Phase 2 locked weights — w_v=0.2, w_h=0.4, w_g=0.3, w_s=0.1
status: accepted
date_created: 2026-05-04
date_modified: 2026-05-04
body: |
  # 0086. Phase 2 locked weights — w_v=0.2, w_h=0.4, w_g=0.3, w_s=0.1

  ## Context and Problem Statement

  Phase 2 (bead `finetype-dnf`) extends the autonomous type-inference
  triangulator from 2 signals to 4. Phase 1 locked
  `w_v=0.4, w_h=0.6` per MADR 0079 with the explicit rationale "header
  > validator because validators are more error-prone." Phase 2 must
  choose four weights (w_v, w_h, w_g, w_s) summing to 1.0, and bead
  ac-03 mandates these are locked at design-time per a Phase 2 MADR —
  no agent-driven sweep against either calibrate or measure half. The
  rationale must cite (a) first-principles reasoning analogous to MADR
  0079 AND (b) per-signal lift estimates from the Phase 2 plausibility
  memo.

  ## Considered Options

  The space of 4-tuple allocations is continuous. Considered options
  collapse to four discrete points sampled from the policy boundaries:

  - **Option A — w_v=0.2, w_h=0.4, w_g=0.3, w_s=0.1.** Halve Phase 1
    weights and redistribute. Preserves header > validator (h=2v,
    matching Phase 1's 0.6/0.4 ratio exactly). w_g exceeds w_v —
    acknowledges generator-shape's larger addressable subset (78% per
    plausibility memo §"Per-signal lift estimates"). w_s smallest
    among the four — reflects sibling-context's small strict
    addressable set (≤2%) plus residual uncertainty about MADR 0085's
    error-source-independence reframe holding empirically.
  - **Option B — w_v=0.2, w_h=0.4, w_g=0.2, w_s=0.2.** Equal weights for
    the new signals. Symmetric but ignores empirical asymmetry: the
    cliff cluster (78% of failing rows) is generator-shape's load. An
    equal w_g/w_s split underweights generator-shape's empirically-
    bigger lift contribution.
  - **Option C — w_v=0.15, w_h=0.35, w_g=0.4, w_s=0.1.** Maximise
    w_g to lift the cliff cluster: at w_g=0.4 with v=1 g=1 h=0 s=0,
    score = 0.15 + 0 + 0.4 + 0 = 0.55, clearing 0.5 alone. But w_g
    exceeds w_h, breaking the "header > * " ordering principle that
    MADR 0079 set. Header-led recovery (v=0, h=1) yields only 0.35,
    below fallback.
  - **Option D — w_v=0.25, w_h=0.5, w_g=0.2, w_s=0.05.** Conservative
    redistribution: keep header dominant (w_h=0.5), shrink w_v slightly
    from 0.4 to 0.25, allocate the difference (0.25) modestly between
    new signals. Preserves more of Phase 1's behavior (header alone at
    0.5 still clears fallback), but cliff cluster (v=1, g=1, h=0) only
    reaches 0.25 + 0.2 = 0.45 — barely above Phase 1's 0.4. Cliff lift
    weak; ac-05 may not pass.

  ## Decision Outcome

  Chosen option: **Option A — w_v=0.2, w_h=0.4, w_g=0.3, w_s=0.1**,
  because it satisfies all three structural constraints:

  1. **Inherits MADR 0079's "header > validator" with byte-identical
     ratio.** w_h / w_v = 0.4 / 0.2 = 2.0; Phase 1's 0.6 / 0.4 = 1.5.
     Actually Phase 2 strengthens header's relative dominance (2× vs
     1.5×), reflecting the empirical evidence from the plausibility
     memo: header is the *only* signal that already clears 0.7 alone
     under Phase 1, and the redistribution preserves header as the
     most-weighted single signal at w_h=0.4.
  2. **Allocates generator-shape proportionate to its addressable
     subset.** Plausibility memo records 78% of failing rows are
     generator-shape addressable. w_g=0.3 is the largest weight after
     w_h, reflecting that on the cliff cluster generator-shape carries
     the lift Phase 1's locked weights cannot reach. w_g < w_h
     acknowledges that generator-shape is correlated with validator on
     shape-uniform values (per memo §"Per-signal lift estimates" —
     generator-shape's argmax IS validator's argmax on the cliff
     cluster), so over-weighting a less-orthogonal signal would not
     add information.
  3. **Allocates sibling-context the smallest weight, reflecting both
     empirical and architectural caution.** Plausibility memo's strict
     classifier records sibling-context's addressable set at 1.6%.
     MADR 0085 made the architectural reframe (error-source vs
     code-path independence) but flagged the empirical hedge: if
     measured sibling-context lift is <0.5 pp on `non_unknown@0.5`,
     escalate to a sub-bead. w_s=0.1 reflects this empirical-uncertainty
     discount — sibling-context contributes meaningfully when it fires
     (a perfectly-firing sibling-context signal contributes 0.1 to the
     score, half of Phase 1's w_v contribution to a perfectly-firing
     validator) but does not load-bear.

  The allocation also satisfies the score-formula sanity check on
  typical row patterns:

  ```
  Cliff cluster (v=1, h=0, g=1, s=0):       0.2 + 0.0 + 0.3 + 0.0 = 0.50
  Cliff cluster + sibling (v=1, h=0, g=1, s=1): 0.2 + 0.0 + 0.3 + 0.1 = 0.60
  Header-led recovery (v=0, h=1, g=0, s=0): 0.0 + 0.4 + 0.0 + 0.0 = 0.40
  Strong header + validator (v=1, h=1):     0.2 + 0.4         + 0.0 = 0.60
  Strong all (v=1, h=1, g=1, s=1):          0.2 + 0.4 + 0.3 + 0.1 = 1.00
  ```

  The cliff cluster lifts from Phase 1's 0.40 to Phase 2's 0.50 (no
  sibling-context) or 0.60 (with sibling-context) — clearing the
  fallback threshold 0.4 by a comfortable margin and lifting toward
  the AC02 threshold 0.7. This is the load-bearing mechanism for
  ac-05 (cliff lift). Header-led recovery degrades from Phase 1's 0.6
  to Phase 2's 0.4, which is a real cost — but the 115 rows in this
  bucket (per memo §"The cliff cluster" tabulation) are a smaller
  slice than the cliff cluster (780 rows). The trade is favourable on
  volume.

  Options B, C, D were rejected:

  - B (equal new-signal weights): under-weights generator-shape's
    empirically-bigger contribution.
  - C (w_g=0.4): maximises cliff lift but breaks "header > *"
    ordering and demotes header-led recovery below fallback. Bad
    asymmetric loss.
  - D (conservative): preserves Phase 1 behavior too closely; cliff
    cluster doesn't lift meaningfully; ac-05 likely fails.

  ### Citation from plausibility memo

  Per plausibility memo §"Implications for ac-03 weight selection",
  the recommended starting point was `w_v=0.2, w_h=0.3, w_g=0.3,
  w_s=0.2`. This MADR diverges from that recommendation in two ways:
  (a) increased w_h from 0.3 to 0.4 to preserve a stronger
  "header > *" ordering reflecting Phase 1's empirical evidence that
  header is the most discriminating axis (clearing 0.7 alone at
  h≥0.5 + v=1.0); (b) decreased w_s from 0.2 to 0.1 reflecting the
  empirical-uncertainty discount on sibling-context per MADR 0085's
  hedge. The memo's recommendation was identified as a *starting
  point*; this MADR's first-principles analysis adjusts it on
  those two axes.

  ### Lock semantics

  The weights are **module-level constants** in `crates/finetype-core/src/infer.rs`
  analogous to Phase 1's `W_V` and `W_H`. The implementing agent does
  NOT run a sweep; the weights are written into source by the
  implementing agent verbatim from this MADR's title. The lock is
  verifiable by `grep -n 'W_V\|W_H\|W_G\|W_S' crates/finetype-core/src/infer.rs`
  returning constants matching `0.2`, `0.4`, `0.3`, `0.1` respectively.

  ### Consequences

  - Good, because the allocation is empirically grounded — every weight
    cites a reason from the plausibility memo or from MADR 0079's
    inheritance, not a sweep result.
  - Good, because the cliff cluster's score lifts from 0.40 to 0.50
    (without sibling-context) or 0.60 (with) — load-bearing for ac-05.
  - Good, because the lock is operational (module-level const, agent
    cannot adjust without amending this MADR).
  - Bad, because header-led recovery (115 rows) demotes from Phase 1's
    passing band to a lower score band. Some Phase 1 passes will
    become Phase 2 fails.
  - Bad, because the redistribution caps the maximum single-signal
    contribution at 0.4 (was 0.6 under Phase 1). No single signal
    alone can clear 0.5; Phase 2 fundamentally requires *agreement
    across signals* to reach high confidence. This is the architectural
    shift: Phase 1 was "any one strong signal can pass"; Phase 2 is
    "two-of-four strong signals required."
  - Neutral, because the score formula remains weighted-sum (not
    rank-aggregation, not lexicographic), preserving Phase 1's
    cascade-mechanism interpretability and the existing `select_mechanism()`
    cascade structure (with new mechanism tokens to be added per ac-08).

  ## References

  - `.orbit/choices/0079-triangulator-architecture-for-autonomous-inference.md`
    (Phase 1 weights and "header > validator" rationale)
  - `.orbit/choices/0083-phase-1-signal-scope-lock.md` (forward-
    compatible weight invariant `w_v + w_h + w_g + w_s = 1.0`)
  - `.orbit/choices/0085-inference-module-may-consume-model-sibling-context.md`
    (error-source-independence reframe; w_s=0.1 reflects the hedge)
  - `.orbit/specs/2026-05-04-autonomous-type-inference/phase2_plausibility.md`
    (per-signal lift estimates; generator-shape's 78% addressable
    subset; sibling-context's 1.6% addressable subset)
  - `crates/finetype-core/src/infer.rs` (where Phase 1's locked weight
    constants live; Phase 2 amends additively)
  - `.orbit/cards/0016-phase-2-triangulator-signals.yaml` ac-03
