id: '0088'
title: Collapse `finetype infer-type` into `finetype infer --explain`
status: accepted
date_created: 2026-05-22
date_modified: 2026-05-22
body: |
  # 0088. Collapse `finetype infer-type` into `finetype infer --explain`

  ## Context and Problem Statement

  `finetype infer-type` shipped in the autonomous-type-inference spec
  (2026-05-04) as a separate subcommand because of a perceived name
  collision with the existing `finetype infer` verb (per that spec's
  progress.md: *"existing `finetype infer` subcommand collides with the
  spec's `finetype infer` triangulator. Resolved by using `finetype
  infer-type`"*). The result was two infer verbs in the public CLI
  surface — `infer` for classification, `infer-type` for the
  diagnostic cascade — with no surface hint of how they relate. The
  `infer-type` help text also leaked a private project reference
  (`bead finetype-7zi`) into user-facing output, which violates
  CLAUDE.md's "never reference private project content in public
  artefacts" rule.

  Compounding: ac-08 of the gittables multi-lens diagnostic
  (2026-05-20) needs to attribute mechanism tokens to millions of
  columns. Subprocess-per-call against `infer-type` loads taxonomy +
  validators on every invocation — the same model-load tax that
  motivated `profile`'s batch mode (decision in PR landing
  2026-05-22). Without batch semantics, ac-08 would run for many
  hours of pure subprocess overhead.

  ## Considered Options

  - **A. Fix `infer-type`'s help text only.** Drop the `bead` leak,
    keep the verb. Cheapest, but leaves two infer verbs in the
    public surface with no relationship hint and no batch mode.
  - **B. Rename `infer-type` to `explain` or `diagnose`.** Better
    verb, but still a separate command and still no batch semantics.
    Ripples through 6 internal scripts + 1 active spec.
  - **C. Fold `infer-type` into a flag on `infer` (`--explain`),
    introduce NDJSON batch semantics in the same change.** One verb
    in the user-facing CLI; the diagnostic cascade becomes a
    capability of `infer`; batch mode falls out for free because
    `--explain` requires `--batch`. Ripples through the same
    6 scripts + 1 spec.

  ## Decision Outcome

  Chosen option: **C**. The decision is driven by three forces in
  combination: (1) CLI surface hygiene — two near-identical verbs
  with no relationship hint and a private-project leak in the help
  text were a public-facing mess (per the author: *"we're building
  in public and I'm not keen on making a mess"*); (2) ac-08's batch
  requirement — without amortised model load, mechanism attribution
  on 3–5M columns is prohibitively slow; (3) ergonomic coherence —
  `infer` already has `--mode column --batch`; `--explain` slots
  in as a natural extension rather than a new top-level verb.

  The wire shape (NDJSON in/out, `{column_name, predicted_type,
  samples}` → `{inferred_correct_type, confidence, mechanism,
  signals}`) is unchanged. Scripts migrate by changing
  `[finetype_bin, "infer-type"]` to `[finetype_bin, "infer",
  "--mode", "column", "--batch", "--explain"]`; stdin payloads
  do not change.

  ### Consequences

  - Good, because the public CLI loses a redundant verb and the
    private-project reference (`bead finetype-7zi`).
  - Good, because the same change introduces NDJSON batch semantics
    for the diagnostic cascade, unlocking ac-08's mechanism
    attribution at corpus scale (one process, one taxonomy load,
    millions of columns).
  - Good, because `infer` becomes the single user-facing verb for
    "ask FineType something about this data", with flags
    differentiating row-mode classification, column-mode
    classification, batch classification, and diagnostic-cascade
    batch attribution.
  - Bad, because 6 internal scripts (`bench_infer.py`,
    `bench_infer_floor.py`, `cron_cycle_work.py`,
    `cron_preamble.sh`, `infer_labelled_eval.py`,
    `phase2_plausibility_scan.py`) and ac-08 of the active
    diagnostic spec all needed call-site migration. Done in the
    same commit. Older closed specs (2026-05-04 et al.) and review
    documents retain historical `infer-type` references — those
    are deliberately not rewritten.
  - Neutral, because the underlying logic in
    `crates/finetype-core/src/infer.rs` is unchanged; only the
    CLI entry point moves.

