id: '0100'
title: 'Require the duckdb CLI as a hard dependency; consolidate ingestion via shell-out (not linking)'
status: accepted
date_created: 2026-06-16
date_modified: 2026-06-16
body: |
  # 0100. Require the duckdb CLI as a hard dependency; consolidate ingestion via shell-out

  ## Context and Problem Statement

  Choice 0099 sought to dispatch CLI CSV ingestion to DuckDB for speed +
  universal free-stats, but was rejected: it assumed *linking* bundled
  `libduckdb-sys`, which fails to compile under the Windows release runner's MSVC
  (spike #27607400306). The goal — fast, robust ingestion and a universal
  column-statistics / free-stats path — remains desirable.

  The key fact 0099 missed: **the CLI never linked DuckDB.** `finetype validate`
  is pure-Rust validation (`finetype_core::table_validator`) + the `csv` crate,
  and for Parquet input and the materialise/transform step it **shells out to the
  external `duckdb` CLI on PATH** (`std::process::Command::new("duckdb")`,
  `crates/finetype-cli/src/validate.rs`). So DuckDB is already a *de-facto runtime
  requirement* for validate's Parquet/materialise paths — a shell-out, not a link.

  Shell-out sidesteps everything that sank 0099: no `libduckdb-sys` compile, so
  no Windows/MSVC amalgamation failure, no bundled-binary bloat. The same model
  validate already uses can carry fast CSV ingestion.

  ## Decision Drivers

  - CSV ingestion speed + dialect robustness (DuckDB CLI parallel sniffer).
  - Universal free-stats: full-column stats (count, approx_distinct, min/max) +
    neural short-circuit on every input, computed in one SQL query.
  - Consolidation: one ingestion model (shell-out), shared with validate.
  - NO compile/link risk: shell-out invokes a binary; releases build unchanged.
  - AGAINST: a HARD runtime dependency on the `duckdb` CLI on PATH.
  - Process-spawn + IPC overhead (likely a win on large files, possibly a loss on
    tiny ones).
  - Coupling to the duckdb CLI's output format / version (validate already lives
    with this).

  ## Considered Options

  1. **Require the `duckdb` CLI + route ingestion through shell-out** (the
     proposal). Formalise duckdb-on-PATH as a hard dependency (declare it in the
     Homebrew formula, clear error otherwise); read CSV/Parquet via the duckdb
     CLI → per-column sample + full-column stats in SQL → the shared engine.
  2. **Status quo = 0099 Option 2.** Lean csv-crate reader as the single-binary
     baseline; duckdb CLI stays a soft requirement (validate Parquet/materialise
     only); the extension is the fast in-warehouse path. No consolidation.
  3. **Link bundled libduckdb-sys** — REJECTED by choice 0099 (Windows MSVC).
  4. **Link a PREBUILT libduckdb** (official Windows binaries via
     `DUCKDB_LIB_DIR`, not the amalgamation) — avoids the MSVC compile but
     requires statically linking / shipping a prebuilt lib (heavier than
     shell-out, changes the single-binary story). Fallback only if shell-out
     performance proves unacceptable.

  ## Decision Outcome

  **GATED.** Adopt Option 1 IF the shell-out spike confirms (a) it works
  cross-platform including Windows `duckdb.exe`, and (b) it beats the csv-crate
  reader on a large CSV. Otherwise stay on Option 2. Unlike 0099 the gate carries
  no compile risk — it only validates that invoking the binary works and is
  faster. Option 4 (prebuilt link) is the fallback if shell-out overhead is the
  blocker.

  ## Deciding Experiment — the shell-out spike

  GOAL: confirm shell-out ingestion is cross-platform + faster, with no compile
  risk.

  METHOD:
  1. Prototype an ingestion path that invokes the `duckdb` CLI to read a
     CSV/Parquet and emit, per column, a value sample + full-column stats
     (`count(*)`, `approx_count_distinct`, `min`, `max`) in one query — mirroring
     validate's existing shell-out plumbing.
  2. Run it on macOS, Linux, and **Windows with `duckdb.exe`** (a normal CI
     matrix — no bundled compile).
  3. Benchmark vs the csv-crate `read_csv_input` on a large CSV (and a small one,
     to size the spawn-overhead crossover).

  SUCCESS CRITERIA:
  - Works on all three OSes (Windows decisive — but this is binary invocation,
    not a build).
  - Faster than csv-crate on the large file; record the small-file crossover.
  - Profile parity vs csv-crate on a fixture set.

  OUTCOME ROUTING:
  - GREEN → implement: require duckdb-on-PATH, route ingestion through shell-out,
    universalise the free-stats path; decide whether to retire csv-crate entirely
    or keep it for small files. Flip this choice `accepted`.
  - RED (cross-platform/perf) → consider Option 4 (prebuilt link) or stay
    Option 2; flip `rejected`.

  ## Consequences

  - Good: fast/robust ingestion + universal free-stats, with zero compile/link
    risk (releases build exactly as today); one ingestion model shared with
    validate.
  - Bad: a hard runtime dependency on the `duckdb` CLI (Homebrew formula dep;
    clear error + docs when absent). Spawn/IPC overhead managed (csv-crate
    fallback for small files, or accept it).
  - Neutral: formalises a dependency validate already effectively has.

  ## Relationship to existing decisions

  - Supersedes choice 0099's *link* framing (0099 stays rejected as the link
    path; 0100 pursues the same goal via shell-out).
  - Unblocks + universalises the deferred free-stats path
    (spec 2026-06-16-column-statistics-lever, ac-05/ac-07).
  - Touches distribution (docs/RELEASE.md, Homebrew formula) — a runtime dep
    declaration, not a build change.
