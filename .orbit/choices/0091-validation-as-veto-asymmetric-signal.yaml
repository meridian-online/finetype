id: 0091
title: 'Validation is an asymmetric signal: ship validation-as-veto in profile, keep YES-disambiguation blocked; case-fold enums (membership-scoped); source enums to standards'
status: accepted
date_created: 2026-06-05
date_modified: 2026-06-05
body: |
  # 0091. Validation is an asymmetric signal: ship validation-as-veto in profile, keep YES-disambiguation blocked; case-fold enums (membership-scoped); source enums to standards

  ## Context and Problem Statement

  The corpus-wide false-veto sweep (spec
  2026-06-05-validation-gate-precision-fixes) measured how often each
  typed validation *vetoes* columns where both lenses agree on the type —
  a proxy for "truly type X". Six validations were format-brittle: they
  rejected real-world variants of their own type (`1998.0` for a year
  stored as a float, `00:07:13.580` for a sub-second ISO time, `male`
  for a `Male`-cased gender enum), at false-veto rates of 22–94%. That
  brittleness is the thing standing between the project and a precision
  win that needs **no retraining**: profile could check its own
  predictions against the data, but only if the validations are trusted.

  Two prior results frame the decision. First, memory
  `validation-gate-asymmetry`: validation is a **reliable NO, unreliable
  YES** — it can confidently *eliminate* a type whose contract the values
  contradict, but usually can't *select* one, because many types share a
  value shape (a float in [-90, 90] equally passes latitude, longitude,
  temperature, score). Second, spec 2026-06-04-value-level-ydf-labelling
  closed INCONCLUSIVE: the YES half (disambiguating validation-survivors
  with a value-level model) hit a corpus-starvation wall — cleaned
  GitTables yields only 10 distinct latitudes across 18M rows, far too
  few to learn the YES signal. So the asymmetry is not just theory; the
  NO half is shippable now and the YES half is blocked on data.

  Forcing this now matters because `ydf_prediction_gated` already applies
  exactly this veto in the **eval** path and is canonical there (choice
  per spec 2026-05-26-ydf-validation-gate). The profile path — what every
  analyst actually runs — did not gate its own answers. Closing that gap
  is the near-term precision lever.

  ## Considered Options

  - **Option A** — ship validation-as-veto in profile DEFAULT-ON, scoped:
    HARD veto (NULL the prediction) only for labels the sweep measured as
    non-brittle; ADVISORY flag (surfaced, never NULLed) for everything
    else. Keep YES-side disambiguation out of scope (blocked on data).
    Case-fold enum *membership* only; source the gender enums to
    recognised standards.
  - **Option B** — ship the veto globally (HARD veto for every typed
    validation, no audited-safe scoping). Simpler, but inherits every
    brittle validation's false vetoes as live NULLs.
  - **Option C** — defer the profile veto until the YES half is solved,
    shipping both directions together as one "validation-aware profile".

  ## Decision Outcome

  Chosen option: **Option A**. The asymmetry is the load-bearing reason:
  the NO half is correct and shippable with zero training data, while the
  YES half is a genuine research problem that one labelled outcome cannot
  close. Tying them together (Option C) would strand a ready precision win
  behind a blocked one. Option B was rejected because an unmeasured
  validation's brittleness becomes a silent wrong NULL — the exact
  false-veto failure mode the sweep exists to prevent.

  ### Decision 1 — validation-as-veto ships in profile, scoped by evidence

  profile checks each column's sample values against the predicted type's
  validation and applies the canonical 50% pass-rate threshold (matching
  `ydf_prediction_gated`). The veto is **scoped to audited-safe labels**:
  a label earns HARD-veto status only by being *measured* non-brittle on
  the agreement corpus — it has a real validation, ≥ 20 both-lens
  agreement columns, and a post-fix false-veto rate below 10%. That set
  is generated by `scripts/false_veto_sweep.py` into `labels/veto_safe.txt`
  (69 labels) and embedded into the binary at compile time via
  `include_str!`, so the runtime veto scope **cannot drift** from the
  swept evidence. The ~152 types the sweep could not measure (rare-type
  starvation, same wall as spec 2026-06-04) get an ADVISORY low-pass flag
  — surfaced to the analyst, never a hard NULL — until they become
  measurable. Default-on, with a `--no-validation-veto` escape hatch.

  The YES half stays out of scope. Disambiguating validation-survivors
  (which of the shared-shape types is this?) remains blocked on rare-type
  training data and is not attempted here.

  ### Decision 2 — case-fold enums, scoped to membership only

  Enum matching is made case-insensitive (`male` matches a `Male` enum),
  but **scoped to the enum-membership comparison only**. This is not a
  universal case-insensitivity claim: a co-attached `pattern` check stays
  byte-exact, because lower-casing the raw input would corrupt pattern
  semantics (a `^[MFX]$` sex code must not start matching `m`). The Rust
  validator (`CompiledValidator`, jsonschema-rs-backed, no case-insensitive
  enum flag) folds both the enum set and the compared value for the enum
  check alone; the eval gate mirrors the same scoped fold. The
  "only ADDS matches, never removes" property holds for the enum
  direction specifically, which is why the fold is safe to apply
  unconditionally.

  ### Decision 3 — source the gender enums to recognised standards

  The gender enums were self-labelled "illustrative". They are re-sourced:

  - `identity.person.gender` → HL7 FHIR AdministrativeGender
    (male | female | other | unknown).
  - `identity.person.gender_code` → ICAO Doc 9303 passport sex field
    (M/F/X), plus an ISO/IEC 5218 numeric variant
    (0 not-known / 1 male / 2 female / 9 not-applicable) for digit-coded
    columns. Matched case-insensitively per Decision 2.

  Both definitions carry `references:` to the sourcing standard. This is
  the Precision Principle applied to enums: the domain is now a published
  standard, not an agent's guess.

  ### Consequences

  - Good, because profile gains a near-term precision win with zero
    retraining — it NULLs its own demonstrably-wrong predictions
    (`datetime.component.year` on basketball jersey numbers,
    `identity.person.email` on free text) instead of emitting them as
    confident types. Spark-joy pillar: the analyst sees "unknown ⊘
    vetoed:X (0% pass)" rather than a wrong answer stated with confidence.
  - Good, because the embedded, swept allowlist makes the HARD-veto scope
    auditable and non-drifting: the runtime can only hard-veto a type the
    evidence licensed. Re-running the sweep regenerates the file; the
    binary picks it up at the next build.
  - Good, because the asymmetry is now a recorded architectural stance,
    not folklore: future "use validation to pick the type" proposals are
    answered by this record + spec 2026-06-04's INCONCLUSIVE evidence.
  - Bad, because the ADVISORY band is a real coverage gap — 152 types
    get a flag, not protection. A brittle unmeasured validation still
    can't NULL anything, but it also can't catch a genuine misclass.
    Mitigated by design: advisory is strictly safer than the old silent
    pass, and types graduate to HARD as agreement-column counts grow.
  - Bad, because case-folding enum membership is a deliberate asymmetry
    in the validator (enum folds, pattern doesn't) that a future reader
    could mistake for an oversight. Mitigated by the scoped-fold comment
    in `validator.rs` and this record.
  - Neutral, because the FHIR narrowing drops `Non-binary` /
    `Prefer-not-to-say` from the gender enum in favour of the standard's
    `other` / `unknown`. The sweep confirmed gender's false-veto rate
    *fell* (22.3% → 5.2%) under the change — the case-fold more than
    offsets the narrowing on real columns — so the standard wins without
    a precision regression.

  ## Verification

  - False-veto sweep, before → after on 1,273,619 agreement columns:
    day_of_week 70.2 → 10.7% (documented correct-veto residual),
    gender 22.3 → 5.2%, year 32.6 → 0.4%, time.iso 88.4 → 2.3%,
    hms_24h 35.8 → 0.7%, rfc_3339 93.6 → 2.6%. Zero clean-validation
    regressions.
  - Runtime/eval parity: 16/16 fixture values agree across the Rust
    `CompiledValidator` and the Python eval gate.
  - Taxonomy↔generator alignment: 240/240.

