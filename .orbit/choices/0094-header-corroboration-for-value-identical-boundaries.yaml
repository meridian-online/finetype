id: '0094'
title: Header corroboration permitted in Sharpen for value-identical boundaries (scoped amendment to 0048)
status: proposed
date_created: 2026-06-08
date_modified: 2026-06-08
body: |
  # 0094. Header corroboration permitted in Sharpen for value-identical boundaries (scoped amendment to 0048)

  ## Context and Problem Statement

  Decision **0048 ("value-based rules only")** explicitly identified a class of
  misclassifications where *no value-based signal exists* — "decimal numbers in
  [-90,90] could be latitude or depth error; only the column name distinguishes
  them" — and **deferred them to model improvements**: "Header context is the
  model's job ... if the model can't learn 'depthError ≠ latitude', the answer
  is a better model, not a regex on the column name. What waits for model
  improvements: latitude vs decimal_number (depthError)."

  That bet has now been tested four times and lost. Per the 2026-06-08 eval
  diagnosis and the rare-type scoreboard (`output/eval-ceiling-diagnosis/`),
  the learned header branch did **not** learn the boundary across v22/v23/v24/
  latdec — the latitude false-positive rate on non-coordinate numeric columns
  went 0.0013 (v19) → 0.0070 (v22) → **0.0163 (v23, 12× worse)**, i.e. it
  regressed. The additive hard-negative retrain is 0-for-4 at fixing these, and
  the v24 memo independently concluded the numeric clusters "may need the same
  humility" as the earthquake families (already routed to Sharpen/taxonomy).

  Two things changed since 0048 that reopen its deferral:
  1. **Empirical falsification.** 0048's load-bearing premise — "a better model
     will learn it" — is contradicted by four rounds of evidence.
  2. **A test now exists.** 0048 had no way to measure a header rule's effect on
     these columns (corpus precision is blind to them — choice 0093). The rare-
     type scoreboard makes such a rule *testable* in seconds, removing the
     "rules are untestable / unbounded" risk that justified avoiding them.

  ## Considered Options

  - **A. Status quo (0048 unchanged).** Keep waiting for the model to learn the
     boundary; accept the latitude/coordinate FPs indefinitely.
  - **B. Header-corroborated demotion in Sharpen, scoped to value-identical
     boundaries.** A value-based-FIRST guard that demotes a coordinate
     prediction to the generic-numeric fallback UNLESS the header corroborates a
     coordinate — applied only to the provably-no-value-signal boundary class
     (latitude/longitude vs decimal/integer measurements).
  - **C. New universal header rules.** Re-admit header-based rules generally
     (full reversal of 0042 + 0048).

  ## Decision Outcome

  **Option B**, as a **narrow, named amendment to 0048** — not a reversal. 0048's
  principle stands for every boundary where a value signal exists; this carves
  out only the class 0048 itself flagged as having *no* value signal. The rule
  shape is a **demotion guard**, consistent with the existing
  attractor-demotion / validation-veto pattern: a coordinate prediction
  (`geography.coordinate.latitude`/`longitude`) on a column whose values are
  generic small decimals is demoted to `representation.numeric.decimal_number`
  UNLESS the header corroborates a coordinate (`lat`/`latitude`/`lon`/`lng`/
  `longitude`/… anchored). Direction matters: the header is used only to *veto a
  false coordinate*, never to *promote* one — so a mislabelled header cannot
  create a coordinate, only fail to rescue one, keeping the precision-first
  posture.

  Option C is rejected: 0042/0048's distrust of header conventions is sound in
  general; the exception is justified *only* by the proven absence of any value
  signal for this specific class.

  ### Implementation (deferred to a tested spec — NOT yet shipped)

  Implementation is a follow-up spec, gated by the rare-type scoreboard as its
  acceptance test, with non-negotiable bars:
  - latitude FP-rate on the gold negatives drops materially below the v19 floor;
  - latitude **recall** on the gold positives does not regress (the header-
    corroborated columns must still be called latitude);
  - corpus-honest gate stays GO (no collateral on untargeted boundaries);
  - the guard is feature-flagged and value-validated (only fires when values are
    in-range generic decimals), so it is inert on already-correct columns.

  Until that spec ships, `models/default` behaviour is unchanged.

  **Status: proposed — awaiting the author's read of this full text before it is
  accepted**, because it amends a "settled — do not re-ask" decision (0048) and
  reintroduces header-dependence that 0042/0048 deliberately removed (header
  conventions vary by locale/dataset — a real latitude column headed
  `breddegrad`/`緯度`/`y` could fail corroboration and be wrongly demoted, a
  recall risk the implementation must measure). Fence: **one MADR per header
  exception** — this authorises only the named value-identical coordinate class,
  never general header rules. A 2026-06-08 overnight session may build a
  **feature-flagged, off-by-default** candidate against this design for review,
  but does not promote it or accept this decision. Amends 0048; when accepted,
  updates the "Architectural direction" section of CLAUDE.md.
