key: multibranch-stats-already-has-cardinality
body: 'The multi-branch Sense model''s stats branch (extract_column_stats, crates/finetype-model/src/column_stats.rs, COLUMN_STATS_DIM=27) ALREADY contains cardinality + entropy (col_entropy, frac_unique, n_values, frac_empty) plus length stats, char composition, structural. The column/mod.rs:2266 comment ''the value head cannot see column cardinality'' is about the SEPARATE value/fusion head, NOT the multi-branch. So the Sense model CAN see cardinality -> the categorical/id residual-attractor is NOT feature-poverty (0096 holds for those). What the 27-dim stats GENUINELY lack: parsed numeric value/range (length_min/max are STRING length, not magnitude), column-level precision (decimal_places is per-value only, not aggregated in), and sequentiality/monotonicity. extract_column_stats is the UNIFIED Rust path (called at both extract-features --json training extraction AND multi_branch/mod.rs inference x4) -> extending it gives train+inference parity with NO candle and NO FTMB format bump (dim-agnostic reader). The per-value FEATURE_DIM=37 (features.rs) + YDF value_feature_row pipeline are SEPARATE -> untouched. See [[decimal-number-is-a-residual-attractor]].'
