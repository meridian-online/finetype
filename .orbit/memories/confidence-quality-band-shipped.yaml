key: confidence-quality-band-shipped
body: |-
  SHIPPED to main (spec 2026-06-18-calibrated-confidence-abstention, card 0020 honest production typing, Option B): profile output now carries quality_band (high>=0.85 / medium 0.70-0.85 / low<0.70) + runner_up (low band only, from vote_distribution 2nd-best) across json/csv/plain/markdown. crates/finetype-cli/src/profile.rs (quality_band_label + low_band_runner_up free fns; ColProfile gained 2 fields). DEFAULT-ON, purely ADDITIVE — predicted label + raw confidence unchanged, headline unchanged by construction. NOT yet released (no version bump; CHANGELOG Unreleased).

  WHY band not calibrated-number: ac-00 reliability curve (scripts/probe_confidence_calibration.py, calib_{gold,repr}.tsv) showed shipped confidence RANKS correctness but is NOT calibrated (over-confident: 0.99 bin = 0.85 actual on repr). So the band reads the RANKING. Thresholds 0.70/0.85 are the data-driven knees.

  ac-03 VALIDATION (the signal helps, not cosmetic): high-band precision 0.912 gold / 0.816 repr — clearly above the rest; repr fully monotonic 0.82/0.68/0.54 (low = scrutinise/coin-flip). CAVEAT: medium(0.736) vs low(0.772) INVERT on gold within overlapping CIs (n=87 vs 254) — medium is the muddy tier; dependable read is HIGH=trust, LOW=scrutinise. runner_up populates 63% gold/33% repr of low cols, carries TRUE answer in 12 gold/6 repr where top was wrong (minority bonus).

  DESIGN CALLS (author-approved): NO unknown-conversion (preserves best guess + headline), per [[determinability-probe-gold-is-the-ceiling]] 'ship the runner-up not not-determinable'; NO calibration map (band robust to over-confidence; numeric isotonic map deferred). B07 audit: ColProfile profile.rs-local; MCP/duckdb consume JSON output (additive-safe); JsonSchema/x-finetype contract path UNCHANGED (documented follow-up if MCP wants band in schema). Pairs with [[representative-accuracy-fixture-shipped]] (the calibration was measured on gold + the new repr fixture).
