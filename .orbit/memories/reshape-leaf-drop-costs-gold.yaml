key: reshape-leaf-drop-costs-gold
body: 'The model label-space RESHAPE (spec 2026-06-27, choice 0108) — dropping the 134 validator-ownable closed/format/checksum leaves from the Sense model''s output and recovering them deterministically — is NO-GO, disproven on gold across 3 seeds. Composed gold (reframe): reshaped-111+recovery = 0.811/0.832/0.792 (mean 0.812) vs s43 baseline 0.853 = -4.1pp mean, -2.0pp best; ALL three below baseline (NOT seed variance). The recovery rule ceded_leaf_recovery is gold-CLEAN (s43 rule-on==rule-off, zero over-fire) — the loss is the reshaped MODEL degrading on KEPT classes: residual-boundary shift alphanumeric_id->word + attractor drift to held-back leaves (integer->ndc, url->docker_ref) recovery can''t catch. CONFOUND: leaf-drop removes the ceded columns'' training rows (131k->87k, -33%), so the cost blends class-removal + data-reduction; preserving the data needs a residual catch-all = the attractor trap. The over-emit problem that motivated this (isbn/currency_code/user_agent/si_number over-emission) IS real but its fix is TRAINING NEGATIVES (t-000133e418), NOT label-space surgery. ac-2 DID confirm ceding zeroes the targeted over-emitters but the FP mass relocates (43% to specific leaves, recovery absorbs ~85%). Reusable: cede-filter infra (train-multi-branch --cede-labels deny-list [[model-output-label-space-is-taxonomy-driven]], Python --cede-labels), ac-0 partition. Related: [[composed-is-rule-bound]], [[categorical-is-a-residual-category]].'
