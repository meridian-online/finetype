key: honest-sense-vs-composed-gate
body: 'CRITICAL eval-fairness lesson (2026-06-21): NEVER compare a model''s STANDALONE Sense to v19''s COMPOSED (Sense+Sharpen) number — the Sharpen rule layer adds ~+0.29 and is model-agnostic, so it is a rigged gate. The entire gte-embed campaign was wrongly NO-GO''d this way (gte scored via predict_multibranch = Sense-only; v19 via profile = composed). HONEST gate = Sense-vs-Sense (score_gold_anchor.py predict --raw-model gives Sense-only for any model via profile''s --raw-model flag) OR composed-vs-composed. Result on gold: v19 Sense 0.502, gte-floor Sense 0.532, gte TWO-VIEW Sense 0.571 (BEATS v19 by +0.069), cdist Sense 0.316 (real NO-GO). The gte representation genuinely beats v19''s Sense; composed two-view projects ~0.79-0.86. Also: fresh-retrain penalty is ~0.19 at the Sense level (cdist 0.316 vs v19 tuned 0.502) — see [[multibranch-stats-already-has-cardinality]]. Compose any model''s predictions cheaply: the Sharpen rules are value-based (decision 0048), decoupled from the embedding.'
