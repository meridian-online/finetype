key: sense-mixed-format-column-collapse
body: 'Multi-branch Sense collapses a majority-single-format column to representation.text.plain_text when a minority of off-format values are mixed in. Verified identical across v19-relu-s42, v22-boundary-s44, v23-precision-s44 (FINETYPE_MODEL_DIR per-model test): clean ISO+Z column -> datetime.timestamp.iso_8601; clean dd/mm/yyyy column -> datetime.date.dmy_slash; but 10 ISO + one ''15/07/2024'' + one ''2024-11-11 09:00:00'' -> plain_text (and 10 ISO + just the slash -> representation.identifier.alphanumeric_id). Mechanism: column-level single forward pass over aggregated value features; heterogeneous columns blur the signature so argmax falls to the generic catch-all. NOT a regression: every shipped multi-branch seed behaves identically, and golden_profile_datetime_formats (cli_golden.rs) only pins clean single-format columns and is #[ignore]d. The web quick-start''s ''93.3% iso_8601'' was illustrative/hand-authored (93.3% is arithmetically impossible on a 12-row column; it entered via a docs-formatting commit, not a captured run). Why it matters: defeats the profile->validate round-trip — profile should type the column iso_8601 so validate can reject the 2 dirty rows; collapsing to VARCHAR throws away both the typing and the dirty-row catch. Fix direction = training-data coverage (add majority-format-with-noise columns to the Sense training set), per decision 0038 prefer retrain over Sharpen rules. Future Sense-retrain target.'
