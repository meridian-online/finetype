body: 'WIN (2026-06-14): amount_bare_number_veto SHIPPED to main. currency.amount precision was 0.105 on gold (17 FP: bare accounting integers like netIncome 795000000 promoted to amount by money-ish headers). Value-based demotion (run from caller AFTER apply_header_sharpen — the over-emission is created inside an early-returning header-hint path): bare-number currency.amount -> integer/decimal. Gold 0.725 -> 0.741 (+15 cols, biggest single-rule jump of the session); integer_number recall 0.592 -> 0.673; corpus-honest gate GO 0 triggers. TRADEOFF (author-accepted): currency.amount recall 0.40 -> 0.00 — gold labels base_salary (bare int) as amount but netIncome (bare int) as integer, identical by value, so genuine bare-int amounts can''t be kept without the 17 FP; net +15 because model over-emitted amount 8:1 wrong. Refinement option not taken: header split salary/price->amount vs income/expense->integer (gold has only 5 amount cols, too few to calibrate). 5th value-identical-boundary rule. Evidence: output/amount-veto/. Links [[state-code-promote-shipped]].'
