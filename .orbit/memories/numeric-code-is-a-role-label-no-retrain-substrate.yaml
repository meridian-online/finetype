key: numeric-code-is-a-role-label-no-retrain-substrate
body: 'CORRECTED 2026-06-17 (author challenge: ''have you checked if we have a generator?''). My earlier claim here -- ''numeric_code has no ground truth, untrainable role label, retrain lever dead'' -- was WRONG on the central facts. WHAT I GOT WRONG: (1) We HAVE a generator: ''finetype generate'' synthesises per-type training values, and prepare_multibranch_data.py ALREADY blends ~1200 synthetic numeric_code columns/type with distilled data. Ground truth exists. I only checked the corpus DIAGNOSTIC (corroborated_gaps has no numeric_code cluster -- TRUE but narrow) and pattern-matched to the categorical lesson without checking the generator or emission. (2) numeric_code is NOT a pure role label: its taxonomy definition (labels/definitions_representation.yaml:1192) names a real VALUE discriminator -- leading zeros + fixed width (036, 06075, 0001) -- and the model has a feature_no_leading_zero feature keyed on it. (3) The model ACTIVELY EMITS numeric_code: 59,157 predictions in the corpus pass. It is a working label, not a dead attractor-loser. CORRECTED PICTURE: the error splits TWO ways -- (a) leading-zero/fixed-width codes are value-shape distinguishable, generator-backed, TRAINABLE (or a leading-zero Sharpen rule); (b) only the BARE-LARGE-INTEGER IDs (GAME_ID/PLAYER_ID, no leading zeros) are the genuinely contestable role case integer_number can''t be separated from by value alone. So a numeric_code retrain/Sharpen IS viable with sound generator ground truth -- the OPPOSITE of what I claimed. OPEN PUZZLE: a clean leading-zero VARCHAR column (036/840/06075/0001, zeros preserved through duckdb ingestion + parquet) STILL profiled integer_number on 8 rows despite training+feature -- so something (integer attractor winning / small-sample aggregation / missing header signal) suppresses numeric_code on small inputs. Diagnose THAT before a retrain; may be a cheap leading-zero Sharpen win. The categorical-attractor analogy ([[categorical-is-a-residual-category]]) applies ONLY to the bare-ID slice, not the whole boundary. LESSON: check the generator + emission count before declaring a label untrainable.'
