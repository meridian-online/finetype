key: numeric-code-is-a-role-label-no-retrain-substrate
body: 'The numeric_code-vs-integer boundary -- the last nominally-trainable representative error mass after the enum reframe -- CANNOT be soundly retrained, and for the same structural reason categorical couldn''t (2026-06-17, spec 2026-06-17-post-reframe-retrain investigation). (1) NO GROUND TRUTH: the multi-lens diagnostic surfaced ZERO corroborated-gap clusters targeting representation.identifier.numeric_code (v23/v24 trained on corroborated clusters; there is none here). The only per-column label source is gated-YDF, which the instrument audit measured 42% wrong on contested ground and BARS from adjudicating correctness -- mining numeric_code positives from it is the documented anti-pattern. Gold has 3 numeric_code cols, eval-only (leakage firewall). (2) IT IS A ROLE LABEL, not a value shape: ''an integer that happens to be an identifier'' (GAME_ID/PLAYER_ID/TEAM_ID/subject_id -> truth numeric_code; model emits integer_number/increment/unix_seconds). The value-only architecture can''t separate an ID code from an integer quantity without semantics -- which is WHY the boundary is contestable. Training a role label as a flat-softmax class is exactly the categorical attractor trap ([[categorical-is-a-residual-category]], decision 0096); it would rebuild the +529% explosion one neighbour over (into integer_number). STRATEGIC for card 0020: after the reframe removed categorical, the remaining representative error masses are ALL semantic/role boundaries (numeric_code=role, full_name-vs-place=semantic per [[full-name-username-veto-is-gold-neutral]]) the value-only model can''t learn -- so the additive-RETRAIN lever likely has NO sound target left, and recall belongs in value-based Sharpen rules (the username veto), NOT retrains. The 0-for-5 retrain record may reflect ''no trainable target'', not just ''the attractor was in the way''. HYPOTHESIS to test by building a properly LLM-panel-labelled numeric_code training set, not assert -- but the bar is now high. Reinforces [[cardinality-boundary-error-is-real]]: the only real lever left is a semantic model advance.'
