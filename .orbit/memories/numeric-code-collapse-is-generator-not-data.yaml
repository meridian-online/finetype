key: numeric-code-collapse-is-generator-not-data
body: 'spec 2026-06-23 (2026-06-24, REFINED): (1) v19 and potion-8M train on IDENTICAL data (build_ftmb_v5_potion reuses constant V19_ARGS: same distillation-v3 Sherlock corpus + data/label_remap.json + 1200/0.7/600 blend + format v4). v19''s data was NOT better. Taxonomy types (numeric_code/isbn/si_number/user_agent) come from synthetic ''finetype generate'' (Sherlock corpus only has common types artist/city/name). (2) The numeric_code corpus ''collapse'' (biggest NO-GO trigger, 7014 lost) is LARGELY AN ORACLE ARTIFACT, not a potion regression: of 5342 oracle-confirmed numeric_code cols, 0% have leading zeros and 88% are headed ''id'' (sequential integers 2038329,2038328...). v19 OVER-emitted numeric_code onto integer ID cols; potion correctly declines; gate counts it as collapse because gated-YDF (42% wrong on contested ground per CLAUDE.md, validator passes any digit string) rubber-stamps v19. Leading-zero rule t-0000a86b wouldn''t fire (0% lz) and shouldn''t (they''re IDs). DISCOUNT numeric_code. (3) BUT the NO-GO SURVIVES on 11 oracle-AWARE over-emit triggers: potion over-asserts user_agent 7.2x, username 3.4x, currency_code 3.2x, version 2.9x, si_number 2.5x etc (CREATED false positives, >>4). The real defect is fresh-retrain OVER-EMISSION of synthetic types, NOT lost numeric_code. (4) Real numeric_codes (gold naic_code/certificate_number/iucr) are HEADER/context-driven, not leading-zero (leading zeros = partial coverage, user-confirmed). FIX DIRECTION: audit synthetic generators for the OVER-emitted types (too-broad examples->over-predict); numeric_code is a separate precision-safe rule. isbn collapse (1733, real checksum validator) needs gold check. ALWAYS gold-cross-check collapse triggers (oracle unreliable). See [[potion8m-corpus-nogo-faithful]].'
