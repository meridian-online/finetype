key: numeric-code-collapse-is-generator-not-data
body: 'spec 2026-06-23 (2026-06-24): potion-8M and v19 train on IDENTICAL data — build_ftmb_v5_potion reuses a constant literally named V19_ARGS (same distillation-v3 Sherlock corpus, same data/label_remap.json, same 1200/0.7/600 blend + hard-negatives + format v4). v19''s data was NOT better. The numeric_code corpus collapse (potion 59157->463, 7014 confirmed lost) is a SYNTHETIC-GENERATOR flaw, not data drift: ''finetype generate'' produces numeric_code values that are 92% plain all-digit integers (356, 7130, 580) — only 8% have the leading-zero signal that defines the type — so they''re indistinguishable from integer_number. A fresh flat softmax can''t separate a class whose examples are 92% identical to a bigger neighbour => collapses numeric_code->integer. This is decision 0096 (residual/attractor types are rule-shaped, NOT trainable into flat softmax). v19 emitting numeric_code (59k, ~12% oracle-confirmed) is the ANOMALY (specific unreproducible historical weights, imprecise). FIX = deterministic leading-zero RULE t-0000a86b (helps v19 too), NOT better data. The taxonomy-specific types (numeric_code/isbn/si_number/user_agent) all come from synthetic generation (Sherlock corpus only covers common types like artist/city/name); the other NO-GO triggers likely share this generator-quality root cause and need the same audit. Reframes ''fix the data drift'' as ''audit synthetic generators + value-based rules for attractor types''. See [[potion8m-corpus-nogo-faithful]] RESULTS_LEDGER.md.'
