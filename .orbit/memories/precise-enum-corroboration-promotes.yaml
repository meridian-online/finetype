key: precise-enum-corroboration-promotes
body: 'Value-corroboration promotion pattern (shipped country_code_corroboration, 2026-06-15, gold +5): when the model files a value into a value-identical sibling (2-letter ISO codes look like region/city/country names), use the TARGET type''s PRECISE validator as the disambiguator — if a confusable column''s values are majority-valid against country_code''s 249-code ISO enum, promote to country_code. Promotion-only + value-based (0048); genuine place-name columns fail the enum and are untouched. Lives in apply_post_sharpen_guards (column/mod.rs), rhh kill switch country_code_corroboration. KEY exclusion: leave out sibling types whose values LEGITIMATELY overlap the enum (state/state_code 2-letter codes overlap ISO) — promoting them trades one error for another (+0, and corpus-scale risk). Mirror of the demotion guards (checksum_substance_guard) but promoting via a precise enum instead of demoting via a failed checksum. Reusable wherever a precise enum/closed-set validator can adjudicate a value-identical boundary.'
