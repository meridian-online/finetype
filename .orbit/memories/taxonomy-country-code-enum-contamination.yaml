key: taxonomy-country-code-enum-contamination
body: 'CORRECTED 2026-05-26: The original observation was wrong. labels/definitions_geography.yaml geography.location.country_code.validation.enum contains exactly 249 canonical ISO 3166-1 alpha-2 codes (AD..ZW alphabetical, no duplicates, no state codes). The state/province codes the original memory observed (AL, AK, AZ, CA, AB, BC, ON, QC...) live in geography.location.state_code.validation_by_locale.{EN_US,EN_CA,EN_AU}.enum, which is the correct location for them. Spec 2026-05-26-taxonomy-country-code-enum-cleanup ran a broad audit (.orbit/specs/2026-05-26-taxonomy-country-code-enum-cleanup/enum_audit.md) — verdict: all 13 universal validation.enum blocks audit clean; no contamination anywhere in labels/. The ENUM_SKIP_LABELS workaround in scripts/apply_ydf_validation_gate.py was removed; the gate now applies pattern AND enum jointly (mirrors finetype-core::CompiledValidator). Regression test added: crates/finetype-core/src/validator.rs::ac06_country_code_enum_rejects_state_and_province_codes. Cell-2 delta from cleanup: −6 columns refused, 0 cell-2 movement — v22''s −10.4% gated lift vs v19 stands.'
