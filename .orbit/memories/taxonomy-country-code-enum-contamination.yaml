key: taxonomy-country-code-enum-contamination
body: labels/definitions_geography.yaml's geography.location.country_code.validation.enum contains 331 entries — the first ~249 are the canonical ISO 3166-1 alpha-2 codes (AD through ZW alphabetical), but the tail contains US state codes (AL, AK, AZ, AR, CA, CO, ...), Canadian province codes (AB, BC, MB, NB, NL, NS, NT, NU, ON, PE, QC, SK, YT), and some duplicates (US, FR, JP, DE, CA repeated; NT, SA, WA, CA, NY, TX, FL, ON tacked on). State and province codes are NOT country codes per ISO 3166-1 and shouldn't be in this enum. Discovered 2026-05-26 while implementing v23 R26; R26 hardcodes a clean ISO 3166-1 alpha-2 constant in crates/finetype-model/src/country_code_enums.rs instead of reading this enum. The contamination would have defeated R26's US-state anti-enum (state codes would be 'valid country codes' per yaml). Fix is out-of-scope for v23 but worth a follow-up spec — likely affects other consumers of the enum (validation, MCP schema export, generator).
