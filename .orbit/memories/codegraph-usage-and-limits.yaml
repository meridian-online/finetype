key: codegraph-usage-and-limits
body: |-
  codegraph (project-local MCP, installed 2026-06-08; .mcp.json wired, .codegraph/ index gitignored, restart agent to load codegraph_* tools) is a code knowledge-graph tool that ACCELERATES the B07 consumer-graph audit / H03 load-bearing-edit-without-audit discipline: before editing load-bearing code, codegraph_impact <symbol> / codegraph_callers enumerates consumers fast. Their docs: explore-first (codegraph_explore with a bag of symbol names), then codegraph_node for full body + caller trail; a flow question should resolve in 1-5 calls with zero Read/Grep.

  HARD LIMIT — it is a STATIC call-graph: Rust trait dispatch, generics, and the #[test] harness are invisible, so 'no callers' is NOT dead-code truth. Proven 2026-06-08: an orphan query over finetype-core+model was ~90% false positives (trait impls like classify/forward; test fns the harness calls). Canonical dead-code/impact truth stays clippy + ripgrep; codegraph is a fast FIRST pass to verify against, never the oracle. codegraph's own warning: 'Partial coverage is WORSE than none.'

  Freshness: the CLI does NOT auto-sync — run 'codegraph sync' before relying on a query after edits (the MCP server auto-syncs on a 2s debounce). For dead-code hunts the high-signal queries are duplicate-name + identical-body (found the 6x get_device dup) and #[allow(dead_code)] markers, NOT raw orphan lists.
