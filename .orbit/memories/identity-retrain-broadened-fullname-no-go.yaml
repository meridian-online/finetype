key: identity-retrain-broadened-fullname-no-go
body: 'The identity-fortification retrain (spec 2026-06-18, card 0020) NO-GO''d on gold (2026-06-18) — the 6th retrain to regress, and it failed the SAME way categorical/numeric_code did: additive training BROADENED a text catch-all. Composition: v3 base (v19''s base) + 1800 author-handle->username + 900 multi-token author->full_name, header-paired. Drift proxy GO at 25ep (username +0.12pp, full_name +1.23pp in-band). But same-binary gold --reframe: v19 739/927=0.797 -> s44(best, val_acc 0.9162) 726/927=0.783, -13 cols. CAUSE: the 900 multi-token full_name additions taught ''multi-word title-case text -> full_name'', broadening full_name from 6 to 15 gold preds (P 0.167->0.067) onto longName/ObjectName/food_category/County/place-org names. Username unrecovered on gold (0/1). TWO DURABLE LESSONS: (1) DRIFT PROXY PASSES, GOLD FAILS: the proxy measures distribution drift (full_name +1.23pp was within the 3x band) NOT correctness; a small catch-all increase landing entirely on the hard place/org columns is within-band but precision-killing. Gold (human truth) is the real gate; proxy is only a gross-drift pre-check. Promotion order held (proxy GO -> gold NO-GO). (2) ADDING full_name/identity TRAINING MASS BROADENS full_name the same way categorical/numeric_code broaden ([[categorical-is-a-residual-category]], [[numeric-code-is-a-role-label-no-retrain-substrate]]) — full_name is itself a multi-word-text attractor. The deterministic username veto (shipped, guarded, spec 2026-06-17-full-name-username-veto) remains the better tool; the retrain didn''t beat it. Reinforces [[cardinality-boundary-error-is-real]]: ~0.80 is the practical ceiling; additive retrains into text/semantic boundaries keep regressing. s44/s43/s42 kept as artifacts, NOT promoted. Untested recompose: username-handles-only + place/org hard-negatives, but the bar is now very high (0-for-6).'
