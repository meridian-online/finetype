key: tz-abbrev-mining-and-header-gate
body: 'The plain_text-discovery mining playbook (taxonomy leaf + closed-set validator + deterministic Sharpen recovery + gold migration, NO retrain) extended cleanly to a closed-set DATETIME type: datetime.offset.timezone_abbreviation (EST/EDT/CEST/…), spec 2026-06-25-timezone-abbreviation-type. +5 gold on BOTH the attention model (0.812->0.817) and the shipped default m2v8m-s43 (0.807->0.812), zero regressions. KEY LESSONS: (1) The HEADER GATE carries precision for abbreviation overlaps — EST=estimate, CST=cost, WET=the word. Corpus scale: the timezone_abbreviation_recovery guard fires on 1,440 real tz columns (all with a tz header) and correctly SKIPS 3 tz-shaped-but-not-tz columns (symbol=EAT stock, TEAM_ABBREVIATION=EST, ''Library Strategy''=EST) precisely because they lack a tz header. Without the header gate those 3 would be false positives. (2) CASE is a precision signal: UPPERCASE-only validator (corpus 1,442/1,444 tz columns uppercase; WET-zone vs wet-word). (3) The recovery fires on ANY source label, NOT a residual allowlist — the model funnels uppercase abbreviations into country_code/iata 3-letter-code ATTRACTORS as readily as into word/iana, so a residual-only gate misses them; precision is the header + >=90% closed-set validator gates, not the source label. (4) VOLUME BAR held: tz cleared (1,504 distinct datasets >= the >=1,000 plain-text-discovery bar) but the xmldoc-ref candidate (T:/M: .NET doc IDs) was REJECTED at 31 datasets — clean-and-nameable but too rare, same call as unix/url-path/pos_tagged. Links [[categorical-is-a-residual-category]], [[cardinality-boundary-error-is-real]].'
