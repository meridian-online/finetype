key: column-stats-separate-residual-gaps
body: 'BREAKTHROUGH PROBE (2026-06-16, scripts/probe_column_stats.py, 751/931 gold via DuckDB full-column aggregates): full-column CARDINALITY RATIO (distinct/rows) decisively separates the residual recall gaps that NO model-side lever (retrain/fusion/sibling/hierarchical) could touch — because it is COLUMN-LEVEL signal the per-VALUE model is structurally blind to. categorical (median card 0.036) vs alphanumeric_id (median 1.000) AUC 0.985; categorical vs entity_name 0.887; categorical vs city 0.776; integer_number vs increment AUC 0.972 (incr signature = contiguous+unique) / 0.944 (card). These are the BIGGEST gold gaps (categorical 54FN, alnum 18FN, integer 40FN incl. increment 17). Coordinate-vs-decimal by numeric RANGE is WEAK (max|val| AUC 0.58/0.69) — coordinates need the sibling-PAIR not range, and are already solved on gold. PRECEDENT: cardinality is ALREADY shipped & working in veto_shape_fallback (0.6.28: alnum R 0.111→0.667) + text_vocab_override (0.6.29: categorical R 0.396→0.465) + fusion_cardinality_gate (column/mod.rs:2115) — but computed over the 100-VALUE SAMPLE and applied narrowly within vetoes. THE LEVER (aligns with 0048/0096 value-based residual rules, NOT the falsified encoder/head bets): feed FULL-COLUMN exact stats (cardinality, increment signature, binary domain, min/max) as value-based rules/features — FREE inside DuckDB (the analyst''s idea: lean on DuckDB column statistics), one aggregate pass on CSV. Likely a SPEED WIN (decisive stat short-circuits the neural pass) not a cost; no encoder, negligible binary impact. This is the ''new architecture layer'' that survives — a column-statistics layer, not a bigger model. CAVEAT: AUC = separability ceiling on gold, not shipped recall; must clear the corpus-honest gate (relocation) like any rule. increment gold support thin (n=1). Supersedes the dead 2-layer program ([[sibling-context-is-the-stranded-architecture-layer]], [[hierarchical-head-falsified]]).'
