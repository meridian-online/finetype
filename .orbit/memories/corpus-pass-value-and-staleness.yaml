key: corpus-pass-value-and-staleness
body: 'VALUE-AUDIT of the corpus pass (2026-06-27, workflow wf_8ac351ca-223, 4 Explore investigators + 1 adversarial verifier): the corpus pass is STILL load-bearing but a NARROWER slice than it looks, and a real chunk has rotted. The correction the verifier caught (the 4 investigators missed it): what survives is the VALUE CACHE (sample_values_truncated in columns.parquet) + the FROZEN gated-YDF oracle (output/ydf-validation-gate/v19_gated.parquet) — NOT the substrate''s own sense_prediction column. THREE-WAY SPLIT: (1) ALIVE/load-bearing = value-cache + frozen oracle -> the ONLY blocking relocation gate (corpus_honest_gate.py/_fast.sh, gate_candidate_from_cache.py), which shipped the current default m2v8m-s43 last week. The gate reconstructs the 33k stratified-sample tables from sample_values_truncated and re-profiles with the LIVE binary, so the substrate''s worth is the raw VALUES it froze, not its predictions; marginal cost ~6min (not the ~9h one-time build). All 3 gate bands key on ydf_prediction_gated (oracle_fp / composition-aware over_emit / collapse) — strip the oracle and the gate reverts to the raw-marginal version it was built to replace. Plus the value-mining that fed 6 shipped Sharpen rules + 5 taxonomy types (v0.6.27-0.6.37). (2) DIMINISHED/STALE = the substrate''s sense_prediction column is RETIRED-v19 output (columns.parquet dated 2026-05-22; v19 retired 2026-06-24 for m2v8m-s43; CLAUDE.md says ''Rebuild forced by Sense model change'' — it changed, substrate never rebuilt). Every consumer reading sense_prediction DIRECTLY reflects a retired model: build_diagnostic_report / build_mechanism_decomposition / build_corroborated_gaps, plus report.md + corroborated_gaps.parquet (frozen 2026-05-29). New mining off these inherits v19''s error surface. The GATE is NOT diminished by this — it deliberately bypasses the stale column (re-profiles fresh from the value cache); the oracle''s v19-ness is by-design (YDF is column-INTRINSIC, independent of Sense, intentionally frozen). (3) DEAD = value_ydf/* (per-class embedding specialist, NO-GO per [[specialiser-is-the-abstaining-witness]]), charcnn_collateral_eval.py (file physically removed, choice 0107), and the per-version hard-negative miners (extract_v23/v24/latdec_hard_negatives, branch_ablation_diagnostic, audit_geography_code_patterns, compute_v22_cell_deltas) — orphaned dead-ends for retrains that all closed Failed/NO-GO/deferred. YDF-per-column-verdict consumers (cluster reachability/safety_score) are correctly DIMINISHED (~42% wrong on contested ground). ACTION: do NOT rebuild the corpus pass now — next session is the Sense retrain (two-stage head + speed), so a rebuild against m2v8m-s43 would itself be stale within a session. Keep it frozen as value-cache; fold ''rebuild corpus pass for fresh mining'' into the POST-Sense-retrain checklist, and prune the dead orphan miners (card 0019 scenario-5 simplification, gold-no-regression gated). One-line: the corpus pass earns its keep as the value-cache + frozen-oracle powering the only blocking relocation gate, but its own prediction column is a month-stale v19 fossil and ~a third of its ''mining'' scripts are orphans. Links [[specialiser-is-the-abstaining-witness]] [[corpus-honest-gate-rebaselined-to-m2v8m]] [[composed-accuracy-ceiling-and-backlog]].'
