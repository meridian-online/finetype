key: catastrophic-forgetting-cure-is-train-time
body: 'Research (2026-06-13, deep-research 10 findings each verified 3-0): FineType''s untargeted-class collapse on additive retrains is textbook CLASS-INCREMENTAL interference (shared softmax, no task ID; van de Ven Nature MI 2022). The actionable mechanism is PCGrad''s ''tragic triad'' (Yu NeurIPS 2020): negative transfer needs conflicting gradients + LARGE GRADIENT-MAGNITUDE DIFFERENCE + high curvature — conflict alone is harmless. The magnitude leg is OUR failure: flooding manufactured VOLUME for one starved class makes its gradient dominate and stamp over untargeted classes. CURE is train-time, ZERO inference cost, mostly knobs we already have: (1) BALANCED REPLAY first — keep prior real columns balanced vs new data, don''t dump volume; replay is the only all-scenario top performer, beats A-GEM/FROMP (it''s our --ratio-distilled/--distilled-cap mix). (2) CLASS-BALANCED / LOGIT-ADJUSTED LOSS to strengthen rare classes by REWEIGHTING not flooding. (3) PCGrad gradient surgery as second-order add-on. Longer shot: mergeable LoRA (zero-cost merge is real but forgetting-cure unproven below Transformer scale). DO NOT bother with EWC/SI/MAS (fail in class-IL, near no-protection baseline; all same Fisher approx) or PackNet/HAT (need a task ID we don''t have). This REFRAMES manufacturing: ''add volume for the starved class'' is the CAUSE of collateral, not the cure. Confirms what we saw — locale-format held numerics by spreading across 34 types (balanced) where geography-heavy collapsed them (dominant). Full memo + citations: output/mining-factory/catastrophic-forgetting-research.md. Links [[mfg-localefmt-identifier-collapse]].'
