key: state-code-promote-shipped
body: 'WIN (2026-06-14): state_code promotion rule SHIPPED to main (commit ce4f713, header_hint_state_code_promote). First clean gold GAIN of the session after the coordinate dead-ends. state_code went P=R=0.000 -> 0.857 (0->6 of 7 gold columns correct); gold headline 0.719 -> 0.725 (+6 cols); corpus-honest gate GO, 0 triggers; zero new regressions (the 1 residual state_code FP on ''iso_region'' is PRE-EXISTING/model''s own — my rule requires a state/province header which iso_region lacks). Rule: promote to geography.location.state_code when >=80% of values are in closed STATE_CODES vocab (US 50+DC, CA, AU from taxonomy validation_by_locale) AND header_corroborates_state (token-aware state/province). Header is load-bearing — 2-letter codes overlap ISO country codes (CA=California AND Canada), header guard + vocab gate together can''t fire on country or state-name columns (smoke-confirmed: State-of-codes->state_code, Country-of-ISO->country_code, State-of-names->state). 4th value-identical-boundary rule through the gates (after postal-veto 0.6.27, veto-shape-fallback 0.6.28, word-vocab 0.6.29). Ready for the next binary release (0.6.30 candidate). LESSON CONFIRMED: the rule path (Sharpen value rules on cleanly-checkable boundaries) keeps shipping while the retrain path NO-GOs. Next gold targets: currency.amount P0.105 (over-emit, wants a precision veto), categorical/integer recall (residual, harder). Evidence: output/state-code-promote/. Links [[coordinate-promotion-already-exists-guard-not-warranted]].'
