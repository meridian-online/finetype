key: sharpen-rules-fail-on-corpus-expansion
body: 'FEEDBACK (Hugh, 2026-06-03): Sharpen rules always end up being the wrong answer when we expand the corpus. Why: a Sharpen rule is fit to the value-shapes present in today''s corpus; when the corpus grows, the rule''s precondition over-fires on newly-seen neighbouring shapes (the v23-sharpen-code-discriminator on country_code is the warning, the deprecated regex header_hint cascade is the precedent). How to apply: do NOT propose Sharpen-rule fixes as the durable answer for misclassification clusters, even LOW-safety ones the reachability advisory routes to Sharpen -- treat that routing as ''not a safe retrain'' rather than ''therefore Sharpen''. Reinforces decisions 0038 (strength through simplification / prefer retraining) and 0048 (value-based rules only). The live question Hugh is raising is upstream of this: whether the multi-branch ARCHITECTURE itself is the problem (see [[charcnn-vs-multibranch-data-scaling]]).'
