key: snapshot-seed-does-not-fix-file-set
body: 'scripts/snapshot_sense_distribution.py samples files via DuckDB ''USING SAMPLE n ROWS (reservoir, {seed})''. The docstring claims ''same --seed gives the same file set across models'' — this is FALSE. Verified 2026-06-05: five seed-42 runs gave total_cols 12206/12363/12771/13676/13681, and two snapshots back-to-back in ONE job (v22 then v23, both seed 42) drew different file sets (12363 vs 13681). DuckDB reservoir sampling is not reproducible across runs because parallel scan order varies. CONSEQUENCE: any cross-model Sense-distribution diff that relies on seed to hold the file set constant actually conflates the model change with a different file sample. The v24 ''ground truth'' (sense_dist_v19_clean 12771 vs sense_dist_v24_clean 12206) was two different file samples, so part of the coordinate.latitude 15->65 is sampling, not model. Rate-normalisation corrects the denominator SIZE but not WHICH files are in the sample. FIX (shipped): added --file-list to snapshot_sense_distribution.py; draw the sample once, persist to sense_dist_<label>.files.txt, and profile every model on that EXACT list so only the model varies. The big ''noise'' movers in a seed-42-vs-seed-43 negative control (e.g. boolean.initials 9->149, 15x) were file-sampling artifacts (a wide file entering/leaving the sample), not model-seed noise — they vanish under a fixed file list. Always use --file-list for any drift_report comparison.'
