key: representative-baseline-is-068
body: 'Representative-data accuracy baseline measured 2026-06-17 (output/representative-baseline/finding.md). The shipped model (v19, fresh 0.6.33 full pipeline) scores ~0.68 on 250 uniform-random NON-TRIVIAL gittables columns — NOT higher than the curated gold hard slice (0.79), if anything LOWER. METHOD (verified end-to-end, answers the memo 2026-06-17-enum-accuracy-reframe precondition): blind Sonnet panel labelled from the same ~8 sample values; two independent blind Opus adjudicators ruled all 88 model/panel disagreements shown both labels unblinded-to-source -> 78 model lost ON THE MERITS, 8 panel-wrong, 2 ties; adjudicated band 0.680-0.688 (raw panel 0.648). Provenance: re-ran the SHIPPED model fresh (sidesteps the corpus-pass v19-vs-v22 question; git confirms default=v19 on the 2026-05-22 corpus-pass date anyway). KILLS the working hypothesis that gold understates production: gold is NOT a uniquely-hard slice; curation if anything OVER-states representative accuracy because it selects answerable columns. So 98% is UNREACHABLE on this architecture; production lives in the 0.65-0.80 band everywhere. Strengthens [[cardinality-boundary-error-is-real]] (~0.80 ceiling) and pushes it LOWER for production. INVALID cross-check that coincidentally agreed: weighting gold per-predicted-type precision by corpus frequency gives ~0.66 but is selection-biased (gold''s per-type composition over-samples each type''s failure cases, non-transportable) -- do NOT reuse that method. ERROR TAXONOMY of 78 losses REFRAMES the Sharpen lever: categorical-residual 24 (hard limit), numeric_code-vs-integer 12 (contestable), full_name-over-emit-on-USERNAMES 12 (value-rule, also fixes gold full_name P=0.167), gross value-shape collisions 7 (UUID/Message-ID->full_address, epoch->npi, 0.0->url -- clean veto rules), Sharpen-veto->unknown 4, unix-epoch 3, boolean-vs-numeric 3. The memo''s named targets are SMALL/non-issues: year-vs-integer already healthy (not in loss set), unix small, url small. Highest-value value-based Sharpen fix is USERNAME RECOVERY then structural SHAPE VETOES.'
