key: model-output-label-space-is-taxonomy-driven
body: 'The Sense model''s OUTPUT label space (n_classes / softmax head width) is built from the FULL live taxonomy, NOT from the training data: crates/finetype-cli/src/main.rs cmd_train_multi_branch does `n_classes = taxonomy.len()` and `label_to_idx = taxonomy.label_to_index()`, then keeps only records whose label is in label_to_idx. Consequences: (1) removing a leaf''s training ROWS does NOT remove it from the model''s emittable classes — it just leaves it untrained; (2) to actually shrink the head you must filter the label list itself. Shipped mechanism: `train-multi-branch --cede-labels <file>` (spec 2026-06-27-model-label-space-reshape ac-1) denies leaves from labels_list/label_to_idx → head shrinks (244→110 for the conservative cede set). The validation branch (valid_dim, one feature per taxonomy type) is SEPARATE and unaffected — it stays full-taxonomy width. Because the deny-list drops ceded records via the existing label-filter, ANY existing FTMB can be reshaped directly (no FTMB rebuild needed; the Python --cede-labels filter is only a build-speed optimisation). Related: [[composed-is-rule-bound]].'
