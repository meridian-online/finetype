key: embed-branch-4stat-aggregation
body: 'The multi-branch ''embed'' branch (512-dim) is NOT a single column embedding — it is Model2Vec encoding each value to 128-dim then aggregating the column with FOUR per-dimension statistics concatenated: mean ++ variance ++ min ++ max (crates/finetype-model/src/embedding_aggregation.rs, EMBED_AGG_DIM=128*4=512, single-pass). Any encoder swap MUST replicate this 4-stat aggregation or it silently downgrades the branch — bare-mean drops variance (within-column spread: categorical vs free-text/id), min, max. The gte-tiny embed swap (spec 2026-06-20) does gte 384-dim per value x 4 stats = 1536. Aggregation is ~free at inference (encoder runs once per value; stats are a cheap pass); the cost is the encoder itself (Model2Vec static lookup ~sub-us/value vs gte transformer ~10ms/col, profile-time not serving). Matching the aggregation also makes an encoder swap a true one-variable change. See [[gte-embed-build-taxonomy-244]].'
