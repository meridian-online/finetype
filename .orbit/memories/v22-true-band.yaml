key: v22-true-band
body: 'v22''s honest position on the cell-2 metric is Partial (−10.4% vs v19), not Failed (−8.9%). The Failed verdict shipped in output/corpus-pass-v22/cell_deltas.md was a measurement artefact: raw YDF predictions included 2,828 msg_id columns labelled iso6346, 547 TEAM_ABBREVIATION columns labelled country_code, 237 exchange columns labelled country_code, and similar noise across credit_card_number (96% refusal), phone_e164 (100%), iban (97%), ein (99%). When scored against the gated baseline (per spec 2026-05-26-ydf-validation-gate), v22 cell-2 lift jumps from −8.9% to −10.4%, putting it inside the Partial band per the v22 spec''s pre-committed ac-08 thresholds (Met ≥ 20% / Partial 10–20% / Failed < 10%). The shift is +1.5 pp because v22 had higher noise pressure than v19 in absolute terms (4,056 vs 3,163 noise drops). Per-subtype gains v22 actually made and the noise had been masking: city −10.2%, region −12.8%, country −31.5%. Verification: output/ydf-validation-gate/cell_deltas_gated.md + v22_re_baseline.md.'
