body: 'm2v8m-attn (per-value cross-value attention, choice 0106) is DEFERRED — not promoted, but a primed candidate for the next model cut (decided 2026-06-25). NOT a hard no-swap: with the cleaned Sharpen rules shipped in 0.6.37, attn nominally edges shipped s43 on gold (0.817, 761/931, CI 0.791-0.841 vs s43 0.812, 753/927, CI 0.786-0.836) and is materially better on Sense (0.561 vs 0.522, +3.9pp — a bigger Sense gain than s43 had over v19). WHY DEFERRED (not blocked-forever): (1) single seed only — promotion gate wants best-of-3, ~40h reseed outstanding; (2) native parity never verified at scale — 0.817 came from predict_multibranch (training forward), not the Rust binary; s43 had this verified at ship (dual-encoder ac-01), attn''s ac-3 never ran on corpus; (3) composed edge is inside CI (a tie, so the real win is the Sense lift); (4) +2.3ms/col, against the card-0006 latency goal that took priority. TO REVISIT: run 3-seed best-of-3, verify native parity (ac-3) on corpus, then the choice-0104 gold-adjudicated relocation review. The composed/gold win (0.800->0.812) was the cleaned RULES (sharpen-stage-audit = the rule-layer bet), already shipped in 0.6.37 on unchanged s43. Confirms [[composed-is-rule-bound]]: even cleaned rules convert attn''s +3.9pp Sense to only +0.5pp composed. Substrate: output/sharpen-audit/score_tz (attn) vs score_deftz (s43).'
