key: v23-ac08-outcome
body: 'v23-sharpen-code-discriminator closed at ac-08 in the ''Lift ≥ 0'' R26-scoped band. R26 fires on 3 columns out of 6.5M (corpus pass v22) — zero false promotions after the n_distinct ≥ 3 anti-collision guard caught a 730-column boolean-NO precision hole during offline validation (NO is Norway in ISO 3166). Cell-2 movement: -1 column (73,514 → 73,513), within rounding. The result confirms the v23 ac-01 finding: the cell-2 metric is dominated by YDF-label noise (msg_id mislabeled as iso6346, stock_id as mgrs, 3-letter team codes as country_code) that no Sharpen rule can recover. Of YDF-labeled country_code cols (4,044): 2,890 already correctly classified by Sense, 547 are 3-letter team abbreviations (TEAM_ABBREVIATION: UTA, FLA), 237 are 3-letter exchange codes (exchange: GER) — none reachable by a 2-char alpha-2 rule. R26 still ships as a precision win for analysts working with country-code columns whose Sense classification slips. Follow-up needed: spec on YDF-label cleanup + cell-2 metric re-baseline so future Sense retrains can be judged against honest ground truth. Artifacts: output/v23-sharpen-codes/cell_deltas.md + columns_sharpened.parquet.'
