key: datetime-handling-is-long-tail
body: 'Datetime accuracy is already strong and the remaining gaps are long-tail — NOT a high-value lever. Evidence (2026-06-19): the deterministic datetime parser (spec 2026-06-19-deterministic-datetime-parser) netted only gold +1 / representative flat / corpus A/B 0 changes; the model is ~90% exact-leaf on datetime gold and gets the common formats right. The zoneless-ISO gap (the next datetime increment) is only ~615 corpus columns (0.01% of 6M) — scoped as spec 2026-06-19-zoneless-iso-datetime-leaves but DEFERRED as too marginal to build ahead of bigger levers. Design for that spec is settled: ADD iso_seconds + iso_milliseconds zoneless leaves (mirror iso_microseconds), do NOT broaden patterns (zoned/zoneless transforms differ; Z-optional would break validate round-trip). The parser itself is a proven-safe foundation (zero over-emission, veto-consistency gate). Conclusion: stop mining datetime; the next accuracy lever is taxonomy-GAP discovery (see [[next-lever-taxonomy-gap-discovery]] / memo 2026-06-19-taxonomy-gap-discovery).'
