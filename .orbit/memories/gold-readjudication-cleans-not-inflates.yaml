key: gold-readjudication-cleans-not-inflates
body: 'Mixed-panel gold re-adjudication phase 1 (2026-06-16, spec 2026-06-16-mixed-teacher-gold-readjudication, eval/gold/gold_corpus_v2.tsv): 4 BLIND panels (Opus/Sonnet/Haiku neutral + Opus adversarial; Qwen/Ollama + Fable both unavailable so all same Claude family = capacity diversity only, determinability is an UPPER BOUND) over 260 ac-03 heuristic gold cols + 28 strong-tier controls. Verdicts 160 CONFIRM / 47 PROPOSE / 53 CONTESTED. Applied 23 non-debatable corrections (conf>=0.75) append-only per 0095. KEY OUTCOME: shipped model 0.793->0.796 (+3 of 931) — re-adjudication CLEANS gold, it does NOT inflate the score. Decomposition: of 23 applied, 8 helped the model / 5 HURT it / 10 neutral; of 47 proposed, 37 DISAGREE with the model. That tiny shift IS the integrity proof (goalpost-moving would jump the headline). Negative control 82% confirm; leakage 0 overlap. LESSON: don''t expect gold re-adjudication to lift the headline much — its value is TRUST + honest targets, not points. The real ceiling lift still needs MODEL work on the now-verified-determinable targets (the 35 confirmed-error residuals) + the deferred debatable proposals + taxonomy gaps. CAVEAT discovered: panels invented non-canonical taxonomy paths (geography.location.coordinate.latitude, finance.identifier.isbn) sharing the LEAF with canonical — always leaf-normalize panel labels before comparing. Datetime CONTESTED inflated by unconstrained sub-format vocab (iso/calendar_date/date) — constrain vocab on re-run. Reusable scripts: scripts/aggregate_readjudication.py, scripts/apply_readjudication_v2.py. See [[determinability-probe-gold-is-the-ceiling]].'
