key: v24-safe-retrain-is-numeric-targets
body: 'v24 retrain design (2026-06-03), disciplined by the v23 relitigation memo + the reachability safety_score. v23 (sherlock-v23-precision) closed Failed: it won 6 FP clusters but fired representation.discrete.categorical on 548k cols (+530% vs v22), eating ~48k geography cols and reversing v22''s country/region/city gains. The memo''s explicit warning: do NOT run a v24 patch retrain with a different hard-negative mix (same recipe, same risk). Its rec #3 (cluster reachability) WAS built = safety_score on corroborated_gaps.parquet. Reading it back: misclassification clusters split by correct-label target -> NUMERIC-target (int/dec) 69,987 cols avg safety 0.69 (top: utc->integer 0.95, url->integer 0.91, boolean->integer 0.94, int->dec 0.84) = SAFE to additively train; CATEGORICAL-target 115,439 cols avg safety 0.49 = UNSAFE (the v23 failure mode). So the ONLY safe v24 is the numeric-target clusters, never training discrete.categorical as a correct label, with the mandatory Sense-distribution pre/post check guarding against categorical explosion + geography regression. Spec: 2026-06-03-v24-numeric-precision. The earthquake blog families are UNSAFE: id->geohash safety 0.32, net/source->measurement_unit safety 0.29 (both ->categorical) -> route to Sharpen/taxonomy, not retrain. ALSO FLAGGED: models/default symlinks v19-relu-s42 but CLAUDE.md + v23 memo claim default is v22-boundary-relu-s44, and the corpus diagnostic ran on v22 -- the shipping default vs measured-model is ambiguous and must be pinned before any retrain (v24 ac-00).'
