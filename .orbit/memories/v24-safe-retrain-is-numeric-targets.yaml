key: v24-safe-retrain-is-numeric-targets
body: |-
  v24 retrain design (2026-06-03), disciplined by the v23 relitigation memo + the reachability safety_score. v23 (sherlock-v23-precision) closed Failed: it won 6 FP clusters but fired representation.discrete.categorical on 548k cols (+530% vs v22), eating ~48k geography cols and reversing v22's country/region/city gains. The memo's explicit warning: do NOT run a v24 patch retrain with a different hard-negative mix (same recipe, same risk). Its rec #3 (cluster reachability) WAS built = safety_score on corroborated_gaps.parquet. Reading it back: misclassification clusters split by correct-label target -> NUMERIC-target (int/dec) 69,987 cols avg safety 0.69 (top: utc->integer 0.95, url->integer 0.91, boolean->integer 0.94, int->dec 0.84); CATEGORICAL-target 115,439 cols avg safety 0.49. Never training discrete.categorical as a correct label, with the mandatory Sense-distribution pre/post check guarding categorical explosion + geography regression. Spec: 2026-06-03-v24-numeric-precision.

  OUTCOME (2026-06-05): v24 closed FAILED, do not ship (output/v24-numeric-precision/relitigation_memo.md). The safety_score's core claim was VALIDATED — v24 DID avoid the categorical explosion (corpus 1.01%->0.86%), exactly as the numeric-target safety predicted. But the bet failed on a DIFFERENT axis: geography.coordinate.latitude over-emit 15->65 (4.3x), longitude 16->44; plain earthquake decimals (mag/dmin/rms/*Error) relabelled latitude; earthquake roundtrip C->F. Lesson: a HIGH safety_score is necessary, not sufficient — it gates categorical-direction distinctness only and is structurally BLIND to destination drift (which OTHER boundary a cluster's examples pull). Additive hard-negative retrain now 0-for-2 (v23 categorical, v24 coordinate); negative transfer doesn't vanish, it moves. Follow-ups: (1) the utc over-emit was instead fixed value-side by widening Rule 32 schema_fail_demotion to utc/url (memory utc-url-schema-fail-demotion-shipped); (2) the destination-drift blind spot is specced as 2026-06-05-destination-drift-precheck (full-label-space drift report + cheap proxy-train gate). The models/default-vs-measured ambiguity flagged here was resolved: default is v19-relu-s42.
