key: coordinate-promotion-already-exists-guard-not-warranted
body: 'Coordinate promotion investigation + outcome (2026-06-14). KEY SUBSTRATE FINDING: the decimal->coordinate PROMOTION already EXISTS in the Sharpen stage — a coord-headered numeric column (decimal_number is a HARDCODED_GENERIC_LABEL; header_hint(''lat'')=geography.coordinate.latitude) is promoted to latitude/longitude by the existing header_hint_cross_domain override (column.rs ~2591) on the HEADER ALONE, no value validation. The taxonomy range validation (lat[-90,90]/lon[-180,180]) exists but is VETO-ONLY by invariant (''validation only to veto its own prediction, never to assert one''); lat/lon disambiguation exists in inference.rs Rule 5 (|value|>90 -> longitude); header_corroborates_coordinate() + a coord VETO (header_hint_coord_veto, demote false coords) already exist. So ''build a coordinate rule'' was already done. BUILT + TESTED a range+precision GUARD on the existing promotion (header_hint_coord_promote_guard, values_look_like_coordinates: range + >=3 fractional-digit precision). MATCHED gold result: guard OFF 0.719 vs guard ON 0.715 = -3 columns, ZERO improvements, 3 regressions (demoted 3 gold-confirmed Lat/Lon columns that were low-precision real coordinates). Corpus-honest gate GO (no corpus harm, but no benefit). VERDICT: REVERTED (commit 5a6d53f reverts dbc4525). The guard fixes a theoretical precision hole (temperature-with-coord-header) that does NOT occur in the measured data, at the cost of real low-precision coordinate recall; even tuned it tops out net-neutral (0 false coords to remove). Per Precision Principle + 0038, a net-negative/net-neutral complexity-add does not ship. LESSON: the precision threshold (>=3 frac digits) over-blocks genuine low-precision coordinates; range alone admits temperatures — the value-shape discriminator can''t cleanly separate them, which is why the existing header-driven promotion (header as the discriminator) is actually the better-on-gold approach. Evidence: output/coord-promote-guard/. Links [[coord-only-blend-numeric-collateral]].'
