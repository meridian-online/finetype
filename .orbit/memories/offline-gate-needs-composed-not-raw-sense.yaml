key: offline-gate-needs-composed-not-raw-sense
body: 'spec 2026-06-21 (2026-06-23): The corpus-honest gate compares COMPOSED predictions — its baseline/oracle is the NATIVE ''finetype profile'' x-finetype-label (post-veto, post-Sharpen; m2v-244 native = 101,338 unknowns from the validation veto). predict_multibranch emits RAW pre-veto Sense argmax (0 unknowns). So gating predict_multibranch output directly against the native baseline is APPLES-TO-ORANGES — veto-demoted labels (binary, year, numeric_code) look like huge over-emissions. The potion-8M/code-16M OFFLINE gate NO-GOs (22 triggers, binary 6.3x, year 10x) are ARTIFACTS, not real relocation. To gate a non-native model faithfully: compose its Sense first (compose_predictions.py + FINETYPE_INJECT_LABEL re-profiles per column applying the native veto+Sharpen WITHOUT needing the model native) THEN gate, OR native-ize it (dual-encoder Rust) and use gittables_corpus_pass. Both cost ~a native-pass each, so the ''cheap offline de-risk'' isn''t cheap — the dual-encoder native work (also the ship path) is the better investment. Raw prediction DISTRIBUTIONS are still sane/comparable (m2v8m: decimal 25%, binary 6%) — only the gate''s over-emit/collapse bands are confounded by the missing veto. See [[m2v244-corpus-nogo-gold-reproducible-not-corpus-faithful]].'
