key: encoder-data-lever-proven
body: |-
  CONTESTED-RESIDUAL DATA LEVER PROVEN (2026-06-18, the top risk from the encoder build's ac-01/02 preview): corpus-mined HEADER+VALUES training data lifts the gold contested set from 0.648 (distilled values-only) to 0.82 (balanced) — ~75% of the gap to the 0.893 zero-shot ceiling, above shipped 0.684 — even with NOISY header-heuristic labels. Proves BOTH levers convert: headers (+13pp+) and mining contested-residual examples (codes-that-are-plain-text). No attractor (residual precision 0.89). Substrate: output/fine-tuned-encoder-discovery/{contested_residual_mining_proof.md, mining_proof.py, geonames_proof.py, mining_pool.tsv}.

  GEONAMES CLEAN-VOCAB LABELLING (author input, eval/gold/lens_reference/{cities15000.txt, admin1CodesASCII.txt, iso3166.csv}): vocabulary-membership (>=50% of values in vocab -> positive, else over-emission->residual) makes country_code/city/country NEAR-PERFECT (recall 1.00/1.00/0.91) — correctly handles [PA,TX,NY,CA]->residual since few are real ISO countries. BUT region COLLAPSES (recall 0.07-0.33): admin1CodesASCII NAME list (4322) under-covers real region values (states/provinces/codes); region needs the iso_3166-2 subdivision codes (in iso3166.csv) + state codes, or header/LLM fallback.

  CLEAN-VOCAB PATH (cuts the LLM-labelling spend for the build's ac-01): authoritative vocabularies build the BULK of contested-residual training data — GeoNames for geo (generator scripts/generate_geonames_geography.py exists, spec 2026-05-24-v21-geonames-geography), Wikidata for person/full_name (scripts/generate_wikidata_person_columns.py exists). Membership doubles as a labeller (in-vocab=positive, out=residual) AND a generator of clean positives. distill_* LLM-labelling narrows to only the ambiguous tail (entity_name + messy residual) — much cheaper than labelling everything. Build ac-01 = header+values representation + vocab-labelled+mined contested-residual data; corpus-honest gate remains arbiter. CAVEATS: frozen-MiniLM linear head, family-level (8 classes), 244-col test — directional not a promotion number. Pairs with [[encoder-upgrade-is-the-live-model-lever]].
