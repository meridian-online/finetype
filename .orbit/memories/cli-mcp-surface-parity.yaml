key: cli-mcp-surface-parity
body: 'CLI↔MCP surface parity rule (choice 0101): the CLI is the canonical capability surface; every registered MCP tool MUST map to a CLI capability (visible OR intentionally-hidden). The reverse is allowed — maintainer-internal hidden CLI subcommands (check, train-multi-branch, extract-features) need no MCP tool. Enforced by PARITY_MANIFEST + parity_guard test in crates/finetype-mcp/src/lib.rs (parity_tests mod): adding/removing/renaming an MCP tool fails the test until the manifest is updated with the CLI mapping. MCP tools as of 0.6.32: infer, profile, taxonomy, validate, generate. schema tool folded into taxonomy (key+format:json-schema, type-mode) + profile (table-mode) per choice 0070; ddl tool retired parity-down (no CLI DDL command — typed tables are validate --db/--table). generate is an INTENTIONAL asymmetry: MCP-public surface of a HIDDEN CLI subcommand (card 0010). To add a new MCP tool, add it to PARITY_MANIFEST with its CLI mapping.'
