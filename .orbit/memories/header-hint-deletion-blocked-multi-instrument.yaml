key: header-hint-deletion-blocked-multi-instrument
body: 'Header-hint DELETION is blocked — decision 2026-06-09, output/eval-ceiling-diagnosis/header_hint_delete_decision.md. Measured delete vs defer vs hints-on on ALL instruments before touching shipping behaviour: hints-on m-19=303/352 (86.1%); DELETE (suppress non-load-bearing hardcoded hints) = corpus gate NO-GO (postal_code) AND m-19 289/352 (82.1%, -4.0pp, -14 cols); DEFER (per-family) = gate GO but m-19 297/352 (84.4%, -1.7pp). Neither free. KEY LESSON: no single instrument sufficient — the corpus-honest gate CAUGHT delete but GREEN-LIT defer, while m-19 caught defer''s regression too (gate is oracle-bound, blind to the curated rare/hard types). Only gate+scoreboard+m-19 together gave the truth; a single GO is not safety (justifies choice 0093''s multi-instrument discipline). The ablation''s ''+3.7 oracle agreement from removing hints'' was mostly honest abstention on bulk numerics, not correctness — deletion doesn''t pay for itself. DECISION: keep the hardcoded header-hint table as-is; ship only the coord-veto (clean add, GO everywhere, latitude FP 12x better, m-19 neutral). Revisit deletion ONLY after training-data fortification turns the model-gap families (url/datetime/isbn/postal/amount, header_hint_cross_domain) model-covered — the RHH roadmap''s real precondition. Removed FINETYPE_HINTS_DEFER/DELETE measurement scaffolding (commit a7fee8d), kept coord-veto.'
