key: infer-latency-breakdown
body: 'infer --mode column warm latency (~0.12s) breaks down (measured 2026-06-25, m2v8m-s43, release binary, batch load timer): ~0.11s is the MODEL+TAXONOMY load (load_multi_branch_classifier dual-encoder + load_taxonomy compiling 245 validators + 6 locale validators), ~0.02s is the actual column classify. --mode row is ~0.02s because it skips the multi-branch column path. The sibling-context attention model (396,800 params, models/sibling-context, 1.5MB) was loaded by infer but NEVER invoked (only classify_columns_with_context uses it, which infer never calls — infer is always single-column) — removing it (commit 91aac37, wire_model2vec_only) saved only ~10ms, NOT the 0.11s the task t-…497c predicted. CONCLUSION: the real infer latency lever is the DETERMINISTIC FAST-PATH (t-…497e): resolve format-detectable values via value detectors BEFORE loading the multi-branch model, skipping the ~0.11s. Open Q for that design: how much of the 0.11s is multi-branch vs taxonomy compile — the fast-path skips the model but the closed-set/format detectors still need taxonomy validators. Card 0006.'
