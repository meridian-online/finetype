key: stage1-charcnn-precision-schema-gate
body: 'Value-only CharCNN (v14-feat, 37-dim) drives latitude collateral to ZERO on the 150-file corpus lens (1871 cols): NEW latitude=0, utc=1 (the one utc is gmtOffSetMilliseconds — a genuine UTC offset, arguably correct). Beats v24 multi-branch (26 utc + 3 lat = 29) and prior feat-CharCNN v13 (lat=14). Two changes did it, both value-level, NO header: (1) decimal_places feature (features.rs idx 36, FEATURE_DIM 36->37) — fractional-digit count separates latitude 4dp from magnitude 1dp; (2) schema_validation_gate (column.rs, legacy/CharCNN path only) — demotes any predicted label when >50% of column values fail its JSON Schema validator, catching longitude/depth >±90 breaching latitude''s range. Earthquake table: dmin/depthError/horizontalError/depth/mag no longer mislabel latitude. Confirms the user''s thesis: value features ALONE (precision + JSONSchema gate) crack mag-vs-latitude WITHOUT the header. v14-feat train acc 91.63% (v13-feat 91.87%, no regression). Confound: CharCNN trained on synthetic per-type data, v19 on gittables blend — clean footprint is encouraging-but-confounded, not the final cascade verdict. Does NOT touch v19 multi-branch default (gate is in the legacy path). All 406 finetype-model lib tests pass.'
