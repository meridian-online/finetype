key: corpus-honest-gate-rebaselined-to-m2v8m
body: 'DECISION (2026-06-27, author): the corpus-honest gate is RE-ANCHORED to the reproducible shipped model m2v8m-s43, NOT the retired/unreproducible v19. Rationale: gating a candidate against v19 conflates the change-under-test with the (structurally-unpassable, 0%-pass-rate) deviation of the shipped model from v19 — so a v19-baselined gate is destructive (always NO-GO on model drift) rather than constructive. Anchoring the BASELINE (the A label in each A->B transition) to m2v8m-rules-off isolates exactly the rule/candidate effect. The ydf_prediction_gated ORACLE stays (it is column-intrinsic — the gated-YDF referee, independent of the sense model — so v19_gated.parquet''s ydf column is reusable; only the v19 SENSE baseline is dropped). Author: ''I don''t see any value revising v19, I don''t want to invest in a model we can''t reproduce.'' The re-sharpen fast path (commit cbd331c) makes the m2v8m baseline cheap: one raw-Sense cache + resharpen rules-off (baseline) and rules-on (candidate). Updates the 2026-06-07-corpus-honest-quality-gate methodology. Links [[resharpen-fast-path-for-rule-gates]] [[composed-accuracy-ceiling-and-backlog]].'
