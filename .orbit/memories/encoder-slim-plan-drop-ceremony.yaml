key: encoder-slim-plan-drop-ceremony
body: 'ENCODER PATH METHODOLOGY SIMPLIFICATION (2026-06-19, author zoom-out ''is the ceremony earning its keep?''). gte-tiny broke the semantic ceiling (0.811 contested vs shipped 0.684); most of the promotion apparatus is scar tissue from the additive-flat-softmax-multibranch 0-for-6 retrains that relocated at scale. gte-tiny is a SEPARATE ENCODER (not an additive softmax rebalance) so it does NOT share that failure mode -> the process shrinks to match. ARCHITECTURE (slim): type-routed two-stage = deterministic parsers (datetime/codes/coords) + static multi-branch (structural/confident) + gte-tiny on CONTESTED-SEMANTIC predictions (geo/person/entity/residual), ROUTED BY PREDICTED TYPE — NO confidence machinery, NO low-band-escalation, NO corpus-pass-confidence prerequisite (that whole step is deleted). DROPPED for this path: (1) drift proxy — models flat-softmax distribution explosion, impossible for a separate encoder; (2) confidence-capture + low-band escalation — the ''minimally patch v19'' inheritance, replaced by predicted-type routing; (3) gated-YDF oracle as BLOCKING arbiter — wrong ~42% on contested, INFLATED the prior encoder NO-GO by scoring correct fixes of v19''s errors as oracle_fp -> demoted to directional sanity. KEPT (the truth, right-sized): gold + representative human-truth accuracy = the BLOCKING gates (what told the truth when curated harness + YDF both misled); corpus over-emission = DIRECTIONAL sanity check on gte-tiny''s OWN predictions (keep the question, drop the vs-v19-YDF apparatus); deterministic parsers (cheapest accuracy, ship independently). STEPS collapsed 5->3+ship: (1) fine-tune gte-tiny semantic classifier on clean rebalanced data (v3 recipe, saved); (2) wire type-routed two-stage, evaluate on gold+representative + over-emission sanity; (3) GO on human truth -> Rust integration. SCOPE: slims the ENCODER path only; generalising (demoting corpus-honest gate from H05-blocking for ALL work) is a separate choice/MADR — drift proxy + corpus-honest gate STAY for future additive multi-branch retrains where they earn their keep. Spec 2026-06-18-minilm-encoder-build revised. Pairs [[encoder-upgrade-is-the-live-model-lever]], [[encoder-data-lever-proven]], supersedes the low-band/confidence framing in [[confidence-quality-band-shipped]] for the encoder routing (band still ships as the analyst signal).'
