key: corpus-gate-is-structurally-anti-model-swap
body: 'spec 2026-06-23 (2026-06-24) STRUCTURAL FINDING: the corpus-honest gate (H05 BLOCKING) is a RULE-CHANGE regression detector, NOT a valid model-swap ship gate. Evidence: across all recorded gate runs, EVERY GO (21) is a rule/veto/guard change on v19 (postal-veto, country-code-corrob, isbn-checksum-guard, coord-guard, state-code, amount-veto, veto-fallback...); EVERY model retrain has NO-GO''d WITHOUT EXCEPTION (v22, v23, latdec x3, mfg-coords x3, fusion-v26/v27, m2v-244, potion-8M x2). 0% model pass rate. WHY structural: the gate''s oracle is v19''s gated-YDF (output/ydf-validation-gate/v19_gated.parquet) — it measures DEVIATION FROM v19. A retrain moves 12-25% of all columns vs v19 (latdec 12.0%, v22 21.3%, v23 24.7%) so the bands trip BY CONSTRUCTION; a rule change makes a small targeted delta so it stays in-band. CLAUDE.md''s own audit says gated-YDF is 42% wrong on contested ground and ''must not adjudicate per-column correctness without a gold cross-check'' — yet the gate uses it as the blocking model-swap referee. CONSEQUENCE: using corpus-gate-GO as the BLOCKING criterion to retire v19 = PERMANENT v19 lock-in; this is the real reason no reproducible default has ever shipped (NOT candidate quality). FIX (needs owner decision + recorded choice amending H05''s role): for a MODEL SWAP, use the gate to FIND relocations, then ADJUDICATE them with GOLD not gated-YDF. Already shown benign: numeric_code (potion MORE correct, v19 over-emits onto id cols), si_number (33.65k IS si), username (Author handles). Genuinely-wrong, fix first: user_agent (prose), currency_code (UDP/TCP/EDT). Then ship on gold-parity (potion-8M 0.794 ~ v19 0.797) + representative + gold-cleared relocations. Precedent for recalibrating the gate when it false-alarms: the 0.6.29 composition-aware over_emit fix (text-vocab NO-GO->GO). See [[potion8m-corpus-nogo-faithful]] [[rules-coadapted-to-v19-the-real-wall]].'
