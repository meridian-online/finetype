key: corpus-pass-sense-is-v19-not-v22
body: 'PROVENANCE CORRECTION: eval/gittables/corpus_pass/columns.parquet''s sense_prediction column is v19''s predictions, NOT v22''s. Proof (2026-06-06): columns.parquet sense is byte-identical to output/ydf-validation-gate/v19_gated.parquet (0 of 6,590,432 joined rows differ), while v19_gated vs v22_gated differ on 1,397,932 rows — v22 grabs geography.coordinate.latitude on 26,002 columns vs v19''s 7,894 (v22 ~3.3x worse). The output/ydf-validation-gate/{v19,v20,v21,v22,v23}_gated.parquet files are genuinely per-model (one corpus-pass sense column each + ydf gating). The CLAUDE.md eval-section wording ''the diagnostic ran on v22 / columns.parquet carries v22 predictions'' is WRONG for the materialised sense column — it is v19. Consequence: the 3,974 latitude->decimal_number columns in the corpus ARE v19''s OWN false-positives (not v22''s), so the latitude-decimal hard-negative blend (spec 2026-06-06-latitude-decimal-hard-negative-retrain ac-01) can be built directly from columns.parquet with no fresh v19 profiling run.'
