key: full-name-username-veto-is-gold-neutral
body: 'CORRECTION to [[representative-baseline-is-068]]: the claim that username recovery ''also fixes gold full_name P=0.167'' is WRONG. Verified 2026-06-17 by joining v19 gold predictions to gold truth (spec 2026-06-17-full-name-username-veto ac-00). Gold full_name = 6 predictions, 1 correct (P=0.167). The 5 FPs are ALL multi-word Title-Case place/org names, NOT usernames: venue_localized_country_name->country, street_name->plain_text, gis_nta_name->plain_text, agency_name->plain_text, longName->entity_name; the 1 TP is ''creator''. These have spaces (the opposite shape from single-token login handles), so a username/low-whitespace rule cannot and must not touch them. CONSEQUENCE: the full_name->username veto is a REPRESENTATIVE-side win (the ~165k corpus ''author''/handle mass; ~12/250 baseline) and GOLD-NEUTRAL (gold has 1 username + 1 full_name col; gold gate role is no-regression, not lift). The gold full_name leak is a SEPARATE semantic problem (place/org vs person) at the architectural ceiling ([[cardinality-boundary-error-is-real]]). DISCRIMINATOR (value-based, 0048, real corpus data): internal-whitespace fraction = 0.005 for ''author'' vs 0.94-1.0 for player_name/person/name/artist/school_name -- decisive; threshold ~0.15 safe. full_name is the model''s largest over-emission: 249,568 corpus columns.'
