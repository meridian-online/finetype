key: charcnn-vs-multibranch-data-scaling
body: 'Decision 0041 adopted multi-branch as the Sense stage at 140/190 raw vs the old Sense->CharCNN value-level-voting path''s 188/190 — a deliberate accuracy-for-speed trade (1 forward pass/col vs ~100 CharCNN value inferences), betting Sharpen would recover the gap. User''s standing hypothesis (2026-06-03): that bet is failing on corpus expansion — ''Sharpen always ends up wrong when we expand the corpus; CharCNN scaled better with data.'' Mechanism that supports it: CharCNN decides at the VALUE level (independent per-value votes, no cross-column entanglement -> roughly monotonic data scaling), multi-branch decides at the COLUMN level (sparse per-column vector, branch entanglement through shared dense layers -> moving one decision boundary moves all low-cardinality columns at once = the v23 categorical-explosion / 48k-geography-regression failure mode). Counter-caveats: (1) 188/190 was a tiny eval, never measured at gittables 500k-column scale; (2) pure value-level voting CANNOT resolve context-dependent cases (earthquake ''us'' network-code vs country_code needs the header branch) — a context-free CharCNN revival reintroduces exactly the ambiguity that sinks the blog demo. Decisive test: data-scaling experiment training both --model-type {char-cnn, multi-branch} (both still live options) at increasing volumes, plotting corpus accuracy AND collateral (categorical-explosion / geography-regression) vs data size. Bigger than v24; v24''s numeric-only retrain is safe under either architecture so it should not block. See .orbit/choices/0041-multi-branch-as-sense-replacement.yaml, output/v23-precision-retrain/relitigation_memo.md.'
