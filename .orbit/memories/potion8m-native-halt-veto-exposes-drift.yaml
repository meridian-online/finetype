key: potion8m-native-halt-veto-exposes-drift
body: 'CORRECTED 2026-06-23 (supersedes the earlier HALT claim — that was a config bug, NOT a model regression). potion-8M native composed best-of-3 = 0.794 (s42 0.756 / s43 0.794 / s44 0.781) which TIES v19 native 0.797 and reproduces the offline 0.794. The dual-encoder is correct (value features byte-identical to offline). THE BUG: the potion training pipeline (overnight_potion.sh -> train-multi-branch with m2v8m-244-config.json) never wrote type_index_keys into the model config (v19 has all 240; m2v8m/code16m had it MISSING). MultiBranchClassifier disables the validation branch when type_index_keys is empty and feeds it ZEROS, while the model was trained on real validation pass-rates and predict_multibranch (offline) reads them from the FTMB. Result: native pure argmax agreed with offline only 46% (v19 control 93%); composed looked like -11pp. FIX: inject the 244 type_index_keys (from  -> ValidationFeatureExtractor::new(taxonomy).type_keys(), the SAME order the FTMB baked) into the model configs; pure-argmax agreement jumped 0.46->0.90 (matches v19''s 0.93 baseline), composed -> 0.794. LESSONS: (1) the offline 0.794 was faithful after all; the veto/Sharpen explanation in the prior note was WRONG. (2) A faithful native gate REQUIRES type_index_keys in the config for any validation-branch model. PIPELINE FIX NEEDED: train/build must persist type_index_keys (or MultiBranchClassifier should derive from live taxonomy when missing). (3) RE-CHECK [[m2v244-corpus-nogo-gold-reproducible-not-corpus-faithful]]: m2v-244''s corpus NO-GO + 101k unknowns may be the SAME zeroed-validation-branch artifact, not real drift. NEXT: ac-02 native corpus-honest gate on the FIXED potion-8M config (the real blocking gate). See [[offline-gate-needs-composed-not-raw-sense]] [[potion8m-beats-code16m-pick]].'
