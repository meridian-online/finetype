key: potion8m-native-halt-veto-exposes-drift
body: 'spec 2026-06-23 dual-encoder-native ac-01 (2026-06-23): potion-8M HALTS at the native gold gate. Native composed (faithful, full finetype-profile pipeline WITH validation veto) best-of-3 = 0.690 (s42 0.676/s43 0.690/s44 0.689) vs v19 native 0.797 = -11pp REAL regression. The offline 0.794 ''tie with v19'' was an ARTIFACT of compose_predictions skipping the validation veto (Sharpen-only): same raw Sense 0.503, but Sharpen-only -> 0.800 while veto+Sharpen -> 0.690. For v19 the veto is neutral (0.793->0.797); for potion-8M it is destructive (0.800->0.690) because potion-8M over-asserts into types its own values FAIL the validator for -> veto demotes. This is the SAME fresh-retrain data/recipe drift as [[m2v244-corpus-nogo-gold-reproducible-not-corpus-faithful]] (numeric_code/isbn/npi collapse, si_number/file_size over-emit); potion-8M shares the data blend and inherits it; embed swap cannot fix a data problem. On 168 native-vs-offline composed disagreements offline right 117x, native 15x vs gold. DUAL-ENCODER ITSELF IS CORRECT AND KEPT: value features byte-identical to offline potion_embed (msg_id 0.05340816 vs 0.053408157, region exact); matrix == HF potion-base-8M (diff 0.0); Rust encode_batch == model2vec.encode cos 1.0000. Built: value_model2vec 2nd resource + value_embed_model config field (None=single-encoder bit-identical) + extract_embedding_aggregation_dyn (4*embed_dim) in MultiBranchClassifier; tests green. DECISION: do NOT run ac-02 corpus gate (would be NO-GO), do NOT paper with >4 rules; STAY ON v19. Real next bet = fix fresh-retrain DATA DRIFT so a reproducible model validates by construction (gold-blind, veto/corpus-gate-visible), THEN reuse the proven dual-encoder if a bigger value encoder is still wanted. See [[offline-gate-needs-composed-not-raw-sense]] [[potion8m-beats-code16m-pick]] [[static-embed-frontier-topped-out]].'
