key: hierarchical-head-falsified-for-shape-overlap
body: 'Hierarchical head FALSIFIED as a fix for value-shape-overlap interference (2026-06-14). Tested domain->category->leaf head on the coord-only blend (research arm of choice 0097, the per-family-head idea). Result WORSE than flat on every axis: gold 0.685 (vs flat 0.718), Sense NO-GO (user_agent), corpus-honest NO-GO 8 triggers incl numeric_code collapse to 3% (59k->1.7k, WORSE than flat''s 18%) + reintroduced user_agent 7x/isbn 4.3x explosions the flat coord run avoided + new tech-domain instability (calver 8x, docker_ref). MECHANISM: splitting the OUTPUT head doesn''t fix interference originating in the SHARED REPRESENTATION (char/embed/stats/validation trunk) — coordinate decimals still bleed into the numeric region, and the extra softmax layers ADD interference surface. CAMPAIGN CONCLUSION: model-side delivery is EXHAUSTED for coordinates — additive-blend flat (NO-GO), balanced replay (improved, still NO-GO), logit-adjust (wrong lever, frequency not shape), hierarchical head (falsified, worse), LoRA (unproven below transformer scale). The coordinate-vs-numeric boundary is a value-shape overlap (coords ARE decimals); no head/loss change holds it. SETTLED: ship coordinates via Sharpen value-rule (lat[-90,90] lon[-180,180] precision, choice 0048/0096), stop retraining. Caveat: hier was epoch-33 (run killed at 36, ~1pp short) but numeric collapse was HARDER than fully-converged flat, so convergence doesn''t rescue it. Substrate: output/mining-factory/coord-only/ac06_hierarchical_verdict.md. Links [[coord-only-blend-numeric-collateral]].'
