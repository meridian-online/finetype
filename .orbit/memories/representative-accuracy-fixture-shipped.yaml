key: representative-accuracy-fixture-shipped
body: |-
  Standing representative-data eval fixture SHIPPED (spec 2026-06-18-representative-accuracy-gate, card 0020 scenario 1, eval infra only — no model/rule). eval/repr/representative_corpus.tsv = 260 uniform-random non-trivial gittables columns, PANEL tier (repr-panel-sonnet), built by scripts/build_representative_fixture.py from the persisted 2026-06-17 study artifacts (panel_labels.json + repr_predictions.tsv; the draw script was ephemeral so the fixture IS the canonical membership record, like gold). Scored by the EXISTING score_gold_anchor.py predict|score --reframe (no new code; mirrors gold schema; all 260 resolve in columns.parquet). Leakage firewall STANDING: registered in gold_anchor_guard.GOLD_CORPUS_FIXTURES (future training excludes it), make leakage-guard green.

  v19 REPRESENTATIVE BASELINE = 0.691 reframe (CI 0.632-0.744, n=259); raw 0.610. Gate against the reframe number — raw is unstable to Sharpen-rule changes (the study's 0.648 reconciled as 162/250 after 10 artifact drops; 23 fresh preds drifted 0.6.33->0.6.34: ~16 categorical->word from enum-reframe rule retirement [reframe-invisible] + ~6 Author full_name->username veto firing).

  PROMOTION ORDER (CLAUDE.md updated): gold-anchor -> drift proxy -> gold+scoreboard -> REPRESENTATIVE (ADVISORY) -> corpus-honest (BLOCKING H05) -> swap. Representative is ADVISORY ONLY: n=260 CI ~±6pp, panel-tier ~3pp anti-model bias that is COMMON-MODE so cancels in the candidate-vs-v19 DELTA; flag fires when candidate repr drops >CI below v19. gold+corpus-honest stay the only blocking gates.

  ac-04 KEY FINDING (the honest ceiling on its authority): the fixture's DETECTION role is UNPROVEN. Scored v19 vs s44 (identity NO-GO) on both: s44 gold 0.783(-1.4pp)/repr 0.683(-0.8pp) — repr TRACKS gold and is the WEAKER detector (s44 repr drop 0.008 < CI, flag wouldn't fire; gold caught it -13 cols). full_name broadening hits HARD boundary cols gold over-samples / repr under-samples. So repr is NOT a sharper alarm than gold for hard-boundary regressions. Its PROVEN value is LEVEL: a standing 10pp production-vs-curated gap (repr 0.691 vs gold 0.797), stable across candidates — that IS scenario 1's goal (the reported headline = the production headline). UPGRADE PATH (filed task, needs LLM opt-in): re-adjudicate the ~88-98 model/panel disagreements to localise the 8 panel-wrong flips -> adjudicated tier (cited 0.68 not reproducible per-column; only aggregate persisted). Pairs with [[representative-baseline-is-068]], [[ceiling-discovery-both-levers-dead]].
