body: 'ac-06 coord-only verdict (2026-06-13): minimal blend (lat+lon ONLY, 100 cols) candidate sherlock-mfg-coords-relu-s43 (val 91.53%) is gold-CLEAN (0.718, matches shipped default 0.719, +6.3pp over v19 baseline; lat/lon PERFECT) and Sense-drift GO, but corpus-honest gate NO-GO on 7 NUMERIC-family triggers: numeric_code collapse 59k->10.6k, upc 12.9k->860, compact_ymd collapse; amount (+16.8k oracle-FP), si_number 2.2x, iso_week 11x over-emit. 5th consecutive additive-blend NO-GO (v22/v23/v24/locale-format/coord-only). DECISIVE: even the cleanest possible blend (pure lat+lon decimals) causes corpus-scale collateral — collateral RELOCATES (identifiers->numerics) but never vanishes. Mechanism is REPRESENTATIONAL not frequency: coordinate VALUES are decimals, so teaching ''these decimals are coordinates'' expands the coordinate boundary into numeric_code/si_number/amount/compact-date territory. CONSEQUENCE: (1) logit-adjusted loss (now built, choice 0097) is NOT the fix for this — it corrects frequency imbalance, not representational interference; reserve it for a genuinely frequency-starved class. (2) Coordinates must ship via a Sharpen VALUE-RULE (lat in[-90,90], lon in[-180,180], decimal precision) per choice 0096 rule-shaped pattern — the Sense model structurally cannot hold the coordinate-vs-numeric boundary (v24-latitude lesson, 3rd confirmation). (3) Manufacturing validated as EFFICACY tool, NOT as additive-blend delivery for value-shape-overlapping types. NEXT: build coordinate Sharpen range-rule, don''t retrain. Substrate: output/mining-factory/coord-only/ac06_verdict.md. Links [[catastrophic-forgetting-cure-is-train-time]] [[mfg-localefmt-identifier-collapse]].'
