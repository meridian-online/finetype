key: duckdb-ext-vendored-openssl
body: |-
  The DuckDB extension (crates/finetype-duckdb) needs vendored OpenSSL ONLY on non-Windows. hf-hub + tokenizers pull OpenSSL transitively via native-tls, but native-tls is platform-adaptive: SChannel on Windows, Security.framework on macOS, OpenSSL on Linux. So the manifest scopes it:

    [target.'cfg(not(target_os = "windows"))'.dependencies]
    openssl = { version = "0.10", features = ["vendored"] }

  WHY each platform:
  - Linux: the community-extensions Linux container sets OPENSSL_DIR to a vcpkg prefix with NO OpenSSL, so a system openssl-sys build panics ("OpenSSL include directory does not exist"). Vendored makes openssl-sys compile its own copy and ignore OPENSSL_DIR.
  - macOS: keeps vendored (its runner compiles OpenSSL from source cleanly; harmless).
  - Windows: must NOT force openssl. An unconditional vendored dep made openssl-src compile from source, and the Windows runner's MSYS Perl lacks Locale::Maketext::Simple, so OpenSSL's ./Configure aborts (exit 2) -> Windows extension build fails. Verified openssl-sys is absent from the x86_64-pc-windows-msvc dep graph after scoping (cargo tree -i openssl-sys --target x86_64-pc-windows-msvc -> nothing to print), so SChannel is used and no OpenSSL build runs.

  windows_amd64 (MSVC) IS a shipped extension platform (MainDistributionPipeline.yml exclude_archs only drops mingw/arm Windows). The CLI binary release (cargo build -p finetype-cli on GitHub runners) is unaffected by all of this. rustls is hard here because feature-unification forces native-tls back on via hf-hub defaults + tokenizers' internal hf-hub. First surfaced 2026-06-03 cutting v0.6.21 (Linux); Windows scoping added 2026-06-03 commit e07c4f8.
