key: tierb-id-residual-veto-recovery-shipped
body: |-
  SHIPPED 2026-06-29 (commit 5952ff7, composed-accuracy roadmap Tier-B #13/#14): gold 0.856->0.864 (797->804/931), corpus-honest GO, 0 gold regressions. #13 id-residual recovery banks +7 (ipni_id, BenchmarkName x4, coord_id, ttxid); #14 binary full-column is gold-NEUTRAL (production fix only).

  LOAD-BEARING ARCHITECTURE FINDING (cost ~1h to discover): the alphanumeric_id->unknown cluster is NOT a model->unknown miss and NOT fixable by a post-sharpen guard. The model+sharpen CORRECTLY label these alphanumeric_id; the CLI-path validation veto (profile.rs resolve_veto_outcome) then hard-NULLs them to unknown because alphanumeric_id's validation pattern REQUIRES a letter AND a digit (labels/definitions_representation.yaml:1176) and these fail it (digit-separator ids 69732-1 have no letter; BenchmarkName CONV_FWD..<CUDNN..> has <> outside the charset). So the fix MUST live in veto_shape_fallback (core) + resolve_veto_outcome (cli), the post-hard-veto recovery layer — exactly BACKLOG #13/#18's framing. A post-sharpen guard is a NO-OP (label is already alphanumeric_id when guards run; --raw-model shows unknown only because it SKIPS sharpen). Verify with FT_DBG-style eprintln at the guard, not --raw-model.

  GATING INSIGHT: veto_shape_fallback + the validation veto are NOT in compose_from_sense, so the resharpen FAST corpus-honest gate (corpus_honest_gate_fast.sh) is STRUCTURALLY BLIND to veto-layer rules (base==cand under resharpen). Use scripts/gate_candidate_from_cache.py WITHOUT --raw-sense-tsv instead: it runs the NATIVE profile path (final x-finetype-label WITH veto) over the 33k stratified sample from cached values, ~6-8min/pass, no source re-read. Build base+cand binaries (stash edits -> build -> pop), two native passes, join v19_gated oracle into baseline, run corpus_honest_gate.py. Substrate: output/composed-accuracy-roadmap/tierb-gate/.

  GATE IS ORACLE-ANCHORED (key): over_emit only fires when the oracle's OWN marginal for the label (v19m) >= marginal_floor 2000. gated-YDF cannot emit alphanumeric_id (YDF tech/identifier recall ~0), so v19m~0 and the band is silent by construction -> GO. This is a CORRECT GO for relocation (post-veto recoveries carry no oracle-confirmed support), but the gate CANNOT see id-type over-emission. So HONEST-SCOPE SPOT-CHECK the recovered columns manually: it caught 3 false-friend classes the gate missed -- M/D/YYYY slash-dates (DOB), packed datetimes (2020-10-20_12-25-49, 20190619-140629), and slash-fractions (1397/2400). Fixed by is_digit_separator_id: drop '/' as a separator + require >=1 group that is NOT a valid temporal component (validate packed YYYYMMDD/HHMMSS bounds so 77227420=month-74 stays an id). 2237->2160 recoveries after the screen. Kill switches: FINETYPE_NO_VETO_FALLBACK=1 (#13), RHH binary_vocab_veto (#14). Confirms [[roadmap-corpus-gate-stricter-than-estimates]] (recoveries DO clear) and [[composed-is-rule-bound]]. Links [[composed-accuracy-ceiling-and-backlog]].
