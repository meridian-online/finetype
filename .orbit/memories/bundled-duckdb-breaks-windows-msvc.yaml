key: bundled-duckdb-breaks-windows-msvc
body: 'Dispatching CLI CSV ingestion to DuckDB is NOT viable for the shipped single-binary (choice 0099 REJECTED, spike #27607400306, 2026-06-16). Bundled libduckdb-sys (Rust duckdb crate features=[bundled]) FAILS under the Windows release runner''s MSVC: cl.exe exit code 2 compiling the DuckDB amalgamation ub_src_storage_compression_chimp.cpp (MSVC 14.51.36231, pin =1.10503.1). macOS+Linux compile+link the bundled CLI fine — blocker is purely Windows MSVC + the bundled amalgamation. This is why finetype-cli''s shipped ''cpu'' default excludes finetype-train/DuckDB (Cargo.toml comment). Single-binary distribution (Homebrew/releases) rules out a system libduckdb, so bundling is mandatory -> Windows breaks. The DuckDB EXTENSION builds fine on Windows because it uses the vcpkg/static toolchain (x64-windows-static), a DIFFERENT build path than the Rust amalgamation. CONSEQUENCE: keep the lean csv-crate reader (read_csv_input) as the CLI baseline; the extension ft_profile(read_csv(...)) is the fast/large-CSV path; the free-stats inference path stays extension-scoped. DO NOT re-attempt bundling DuckDB in the CLI unless a future DuckDB release compiles clean under MSVC. See [[schema-validation-gate-bypassed-on-multibranch]] is unrelated; ref output/duckdb-csv-spike/.'
