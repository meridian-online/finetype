key: tierA-fully-banked-engine-lever-spent
body: 'The composed-accuracy roadmap''s Tier-A ''bankable engine fixes'' (#1-#11 in output/composed-accuracy-roadmap/BACKLOG.md) are ALL shipped inside live 0.864 as of 2026-06-30 — verified by a 4-reader survey against git/CHANGELOG (only the NPI-Luhn half of #6 is unshipped, held by its author at ~0 new gold). The roadmap''s ''0.812->0.86 pending'' arithmetic is STALE: that tier banked during the Sharpen campaign. So ~0pp of cheap engine accuracy remains. The residual ~110/136 gold errors are DEMOTE-shaped (geo/entity/city, currency value-blind, url->query_string) and structurally collapse the corpus-honest gate H05 (geo retrain 0-for-6, currency 0-for-5, increment-default 98% oracle-collapse) — rules cannot touch them. The only additive recoveries left are 1-3 cols each (gold-CI noise) plus ~7 re-pull-gated data-ops (column-name IS the value, no source on disk). CONCLUSION: the engine accuracy lever is SPENT; deterministic ceiling ~0.86. The project PIVOTED to product/legibility 2026-06-30 (shipped: crates.io install fix, x-finetype-unknown-reason cross-surface parity, representative production-headline eval companion). Only surviving engine thread = the gold-invisible geo/entity over-emission retrain (task t-000133e418, gated gold-parity NOT corpus-honest). Extends [[composed-is-rule-bound]], [[roadmap-corpus-gate-stricter-than-estimates]], [[clean-label-retrain-refutes-data-ceiling]].'
