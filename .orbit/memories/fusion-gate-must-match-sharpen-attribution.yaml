key: fusion-gate-must-match-sharpen-attribution
body: 'B3 late-fusion (spec 2026-06-08) ac-04: the FIRST kill switch NO-GO was a MEASUREMENT ARTIFACT, not a real regression. It compared fusion (Sense output only) against the v19 gold baseline produced by ''finetype profile'' = the FULL Sense->Sharpen pipeline. PROOF: the v19 multi-branch logits (View2, computed inside dump-fusion-features) predict decimal_number on 30/30 gold latitude columns -- raw multi-branch does NOT distinguish latitude from decimal. v19''s latitude recall 1.000 on the gold anchor comes entirely from SHARPEN''s value-range rules (|lat|<=90, paired lat/lon), which run AFTER the Sense stage. Sharpen is untouched by the fusion spec and runs after fusion identically. KEY LESSON: any gate comparing a Sense-stage replacement must put both models on equal Sharpen footing -- either compare fusion-Sense vs RAW-multi-branch-Sense (argmax of mb logits, pre-Sharpen), or compare full-pipeline-with-fusion vs full-pipeline-v19 (needs the port). Comparing fusion-no-Sharpen vs v19-with-Sharpen manufactures phantom regressions on every SHARPEN-OWNED family (lat/lon especially). The corpus-honest gate (vs v19_gated.parquet = full pipeline sense_prediction) has the SAME trap and is only fair as the POST-port ship gate. CONSEQUENCE for B3: lat/lon is Sharpen-owned, not Sense-owned -- the original ''fusion fixes coordinates'' thesis was misframed. On a FAIR pre-Sharpen comparison fusion-v26 is hold-and-improve: family A (tight-code vs crypto-hash/alnum-id) 0.400->0.967, a Sharpen-UNREACHABLE value-level win that is where B3''s real value lives; B/C/D hold. Supersedes the over-narrow lesson in [[fusion-head-needs-target-families-in-train-corpus]] (the manufactured-corpus retrain helped val but was not the actual blocker).'
