key: cardinality-boundary-error-is-real
body: 'The categorical-vs-specific boundary is the dominant gold error mass AND a REAL, hard model limit — not a measurement artifact (spec 2026-06-17-cardinality-boundary-readjudication, 2026-06-17). Tested by re-adjudicating the 239 boundary columns WITH true full-column cardinality (the signal gold''s original 8-25-value labelling never had): 3 blind panels, 88% confirm vs current gold, 29 proposed changes; author supplied authoritative labels (author_labels.tsv) and 21 applied. Headline UNCHANGED 0.789->0.789 (confirmed twice: panel dry-run -3, author labels net 0) — so cleaning gold improves correctness without unlocking ANY model accuracy. KEY FACTS: (1) Gold was labelled from 8-25 values, NEVER full cardinality; the eval feeds 8 (median 8, cap 8) while files hold median 67 / up to 20k. (2) Feeding the model MORE rows makes it WORSE — categorical FP explodes 7->44 (P 0.87->0.51) as the residual attractor over-fires; production over-emits categorical relative to the starved eval. (3) Cardinality separates categorical from entity_name (0.04 vs 0.99) / iata but NOT from country_code (0.039 vs 0.044) / city / region — those are low-card on BOTH sides, decided by SEMANTICS, so a cardinality GATE can''t fix them (only a human/LLM with values can). (4) Even 3 panels + cardinality leave 6 columns fully contested + many debatable (boroughs region-or-categorical?, species word-or-entity?) — part of the gap to 98% is IRREDUCIBLE label ambiguity. AUTHOR LABELLING PHILOSOPHY (reusable): messy / misleading-structure columns -> representation.text.plain_text (the honest residual), NOT forced into specific types (signature_source_url is not a url; EstadoDoc=''Si'' is not country_code) — 19 of 21 corrections were ->plain_text. TAXONOMY GAP surfaced: geography.location.neighborhood (NYC NTA names; author chose plain_text for now). STRATEGIC: ~0.80 on contested gold is near the practical ceiling for the current architecture; the only remaining lever is a SEMANTIC model advance (header/sibling/value), where past bets are stranded/dead ([[sibling-context-is-the-stranded-architecture-layer]]). Stop chasing this boundary. Closes the arc: [[full-column-stat-sharpen-is-redundant]], [[decisive-stat-skip-is-no-go]] — full-column statistics convert to NOTHING shippable (skip, rule, or gold-relabel).'
