key: determinability-probe-gold-is-the-ceiling
body: 'DETERMINABILITY PROBE (2026-06-16, output/determinability-probe/): 3 blind Claude panels (the distillation blind-pass teacher) labelled 68 contested residual-label gold ERRORS + 15 controls, header+values only. REFUTES ''not determinable'': contested columns are 100% determinable (87% unanimous, 0% 3-way split); controls 15/15 unanimous agreeing gold+model (instrument trustworthy). The disagreement is panel-vs-GOLD, not panel-vs-panel: panel-majority vs gold = 35 agree / 33 DISAGREE (gold contestable on ~49% of these errors, almost all from the ac-03 HEURISTIC gold tier not the two-panel-adjudicated tier); vs model = 7 agree / 61 disagree. The 33 gold-contestable split: 7 RECOVERABLE (panel sides with model -> legit score gain on re-adjudication, e.g. id->uuid, name->entity_name, BenchmarkName->alphanumeric_id), 7 TAXONOMY GAP (panel says ''other'' -> gold used plain_text as fallback for MISSING types: street_name, file_path/filename, publication_year, link, block), 19 PANEL-THIRD (gold plain_text catch-all wrong, model also wrong, panel says categorical/entity_name/alnum). The 35 panel==gold are genuine confirmed model errors (hard residual core). CONCLUSION: the score ceiling is capped by GOLD-LABEL QUALITY + taxonomy gaps, not model limits or undeterminability. Ambitious-but-honest path: (1) re-adjudicate the ~349 ac-03-heuristic gold columns with a MIXED-teacher panel (add Qwen3:32b as a genuinely-independent 3rd panel; the 3 Claude panels share priors) per choice 0095 gold-evolution, (2) taxonomy-discovery for street_name/file_path/publication_year, (3) ship panel reasoning+confidence as the analyst answer (not ''not determinable''), (4) fix residual model errors that survive (now provably determinable). Distillation-as-JUDGE (not as bulk volume) is the lever; residual types are already abundant in distillation-v3 (cat 17k/entity 18k/text 10k) so MORE volume won''t help (0096 attractor wall). See [[column-stats-separate-residual-gaps]].'
