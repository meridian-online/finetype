key: corpus-honest-gate-oracle-aware-bands
body: 'Corpus-honest gate (scripts/corpus_honest_gate.py) bands made ORACLE-AWARE on 2026-06-08 to close an honest-abstention blind spot found on the 0.6.24 precision patch. ROOT CAUSE: the original oracle_fp band classified the oracle only against the CANDIDATE label, and collapse used raw marginal — so a demote-to-unknown of an ALREADY-oracle-refuted label read as oracle_fp, and any correct-FP removal (an over-emitted label demoted) read as collapse. The 0.6.24 patch (validation-veto default-on + utc/url/measurement_unit/geohash schema-fail demotions) is a real corpus improvement (+858 cols more correct vs gated-YDF oracle, 0.2% false-veto = 117/49,018 demote-to-unknown destroyed an oracle-confirmed label; 86% were confident-wrong -> honest-unknown) but the OLD gate returned NO-GO. FIX: transition_counts now classifies oracle vs BOTH ends (oracle_dst vs candidate, oracle_src vs base v19 label). oracle_fp counts only CREATED FPs (move A->B oracle refutes where oracle CONFIRMED source A, i.e. osrc==''agree''); collapse measures loss of oracle-CONFIRMED support (cand_correct/base_correct <= collapse_frac) with new --collapse-correct-floor 1000, NOT raw marginal. over_emit unchanged (raw ratio>=3.0, load-bearing for v22/v23, never misfired). VALIDATION: re-ran the four-verdict regression — v19 GO, v22/v23/latdec NO-GO all preserved on their LOAD-BEARING movers (latdec latitude oracle_fp net 2127; v23 categorical over_emit 8.68x+oracle_fp; v22 city over_emit 3.06x), and 0.6.24 now reads GO (0 triggers). Bonus: trigger noise fell 52-78 -> 11-14 (the ac-03 high-trigger concern). decimal_number_comma is the honesty proof: raw marginal -46% but kept all 253 oracle-confirmed cols (correct_ratio 1.0) so no collapse fire. Guard intact: oracle_fp still needs net>=1000 AND obs>=120 AND ratio>=0.20, so a future veto that destroys oracle-confirmed labels at scale still trips it. Evidence: output/corpus-honest-gate/refined/oracle_aware_bands.md, v0624_finding.md. Updates the gate decision in CLAUDE.md (the four-verdict-reproduction ac-03 claim now holds with oracle-aware bands).'
