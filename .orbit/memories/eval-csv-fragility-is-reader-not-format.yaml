key: eval-csv-fragility-is-reader-not-format
body: 'The recurring ''eval CSV breaks'' pain is a READER robustness gap, NOT a storage-format problem — do not migrate eval fixtures to Parquet. Root cause: duckdb''s PARALLEL csv scanner hard-errors on null_padding (which we always pass for ragged rows) + a quoted field containing a newline (''parallel scanner does not support null_padding in conjunction with quoted new lines''). Fix is the reader: read_csv_input retries with parallel=false on failure (commit 841cd2b). WHY keep CSV: the eval fixtures ARE the messy-real-input regression surface (pillar 1) — converting them to Parquet would test a cleaner format than any analyst feeds FineType and would HIDE exactly this class of bug (it silently dropped 4 gold full_address columns until parallel=false recovered them). The format split is already correct: internal substrate (columns.parquet, corpus pass) = Parquet; INPUTS stay CSV because inputs are CSV. Also fixed: batch --files no longer aborts on one bad file (skip-and-log + zero-output backstop so an all-failed batch still exits non-zero, preserving the missing-duckdb actionable-error contract). HOW to apply: if eval CSV ingestion fails again, check whether read_csv_input''s fallback covers the new failure mode; extend the reader, don''t change the fixture format.'
