key: private-dataset-ydf-training
body: 'A private upstream dataset is the training-data origin for the YDF lens
  model and must NOT be identified in any committed file in this repo (specs,
  registry, code, docs, commits, PRs). Do not commit its codenames or its local
  filesystem path. The YDF lens model artifact itself
  (eval/gittables/models/ydf.bin) is fine to reference — only the upstream
  training-data origin is private. The literal forbidden names and path are
  recorded in an untracked local note on the author''s machine, deliberately
  kept out of git.'
