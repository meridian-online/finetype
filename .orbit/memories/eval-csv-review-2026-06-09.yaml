key: eval-csv-review-2026-06-09
body: |-
  Eval-CSV validation review (eval/datasets/csv, 32 files) on 0.6.25. Found defects sort into: clean code/taxonomy fixes (shipped), gated model FPs, and one design call.

  SHIPPED this session (pushed to main 6e24213..dd5449f):
  - 02c899a fix(validate) case-insensitive enum membership: CLI validate path (table_validator.rs) compiled jsonschema enums byte-exact; a separate validator.rs path already case-folded. Strip enum from jsonschema, fold membership separately. Guard: universal case-insensitivity is safe — no taxonomy enum distinguishes members by case alone; case-variant lists (boolean T/F/t/f, HTTP methods) are author workarounds. Effect: people_directory 113->60 (remaining 60 = "Non-binary", which HL7-sourced gender enum maps to `other` — taxonomy choice, not bug).
  - a8e86e0 fix(taxonomy) epoch_nanoseconds transform epoch_ns({col}) -> make_timestamp_ns({col}::BIGINT): epoch_ns runs timestamp->bigint, no VARCHAR binder overload, aborted validate (exit 2). Now degrades to per-cell rejects (TRY catches the ::BIGINT cast). coverage_closure_phase_ab exit 2->1.
  - 7fc8589 fix(taxonomy) drop stale datetime.offset.iana 12-zone enum, validate by pattern: JSON Schema ANDed a correct Region/City pattern with a 12-entry enum subset, rejecting all other real zones. airports -5726, datetime_formats -13.
  - dd5449f feat(sharpen) hard-veto periodicity + decimal_number (corpus-gate validated): added both to labels/veto_safe.txt via a new GATE_VALIDATED_EXCEPTIONS class in scripts/false_veto_sweep.py (rare-starved, so unmeasurable by the both-lens sweep — validated by the corpus-honest gate instead). Fixes status->periodicity (ecommerce/sports) and blood_pressure->decimal (medical): 3 files 260->0 rejects. Corpus gate GO, zero triggers — periodicity 13,967->35 corpus cols (net_contra 0, oracle confirmed NONE), decimal_number 1.9M->1.89M (net_contra -287). First non-trivial GO the gate has cleared (GO-precision was unvalidated; safety_score precedent — one GO is not full validation). Provenance: output/corpus-honest-gate/veto_statusbp_finding.md.

  DECIDED taxonomy directions (principle: full enum only for small/closed/stable/authoritative sets like country_code's 249; otherwise pattern):
  - IANA: pattern-only. Hardcoded enum goes stale and SILENTLY rejects new tzdata zones (worse than the loud 12-entry bug). Add an enum only if build-generated from tzdata.
  - ICAO (geography.transportation.icao_code): KEEP strict ^[A-Z]{4}$. The 152 airports rejects (K52A, 03N) are FAA Location Identifiers — a DIFFERENT standard sharing the column — correctly rejected. Do NOT widen to alphanumeric (was my initial rec, reversed after reading the def). Widening lowers precision for no real gain.
  - country_code (geography.location.country_code): alpha-2 only; rejects valid alpha-3 (USA) and numeric (840) ISO 3166-1 forms (countries.csv alpha-3/country-code, 498 each). Direction = SIBLING TYPES (country_code_alpha3, country_code_numeric), NOT widen the universal type (3-digit numbers would match too much). Sibling types need model training to land usefully (model still predicts country_code alpha-2) — gated, not a taxonomy-only fix.

  How the veto works (for future veto-allowlist work): "attractor demotion" is validation-as-veto (validation_veto.rs evaluate_validation_veto). pass-rate<0.5 (VETO_THRESHOLD) HARD-vetoes (label->unknown) ONLY for labels on labels/veto_safe.txt; else advisory-only (prediction survives, flagged). The veto runs as an OUTER Sharpen step in the CLI profile path (main.rs ~4224: `if vetoed { "unknown" }`), AFTER the model crate's Sense+in-model-Sharpen returns. veto_safe.txt is include_str!-embedded (validation_veto.rs:31) — rebuild to pick up changes. It is GENERATED by scripts/false_veto_sweep.py (measured non-brittle labels + exceptions); to add a rare-starved label durably, add it to an exceptions list in that script (VETO_SAFE_EXCEPTIONS = "just over ceiling"; GATE_VALIDATED_EXCEPTIONS = "unmeasurable, gate-validated"), else a regeneration wipes a hand-edit. Regenerate-and-diff before committing — the sweep re-measures against CURRENT validators, so a blind regen can drift other labels (here it came out clean: exactly +2).

  GATED candidates STILL NOT actioned:
  - Model FPs needing retrain (validators correct, predictions wrong): airports utc_offset->datetime.offset.utc (bare integer hour offsets vs UTC +HH:MM string); airports dst->representation.scientific.rna_sequence (single-letter flags U/A/E/N/S — A/U/N pass RNA by coincidence, the Precision-Principle anti-pattern); countries iso_3166-2->identity.medical.dea_number (ISO 3166-2:AF subdivision strings).
  - airports \N (OpenFlights NULL sentinel) read as data, inflating reject counts across columns — null-detection improvement, not a type issue.
  - continent enum missing UN M49 sub-region names (Americas, Caribbean) — countries region/sub-region columns (~393 rejects); likely a missing region type or model FP, NOT a continent-enum widen (would blunt continent).

  PROCESS: agent worktree isolation did NOT hold for the fix agents — gender fix committed straight to main, epoch fix landed uncommitted in main's working tree. Both recovered. Lesson: agents in worktrees must COMMIT to persist; "don't commit to main" was read as "don't commit at all" and one agent's worktree was cleaned (work recovered from the leaked main tree). Real CI clippy gate is `cargo clippy -- -D warnings` (NOT --all-targets/--workspace); pre-existing --all-targets test-file lint debt (precise_audit.rs, candle_validation.rs, eval_report.rs) is outside the gate.
