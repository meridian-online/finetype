key: gte-tiny-narrow-beats-broad
body: 'DECISIVE (2026-06-20 overnight): gte-tiny works as a NARROW contested-boundary escalation specialist on top of v19, NOT as a backbone/replacement. Evidence across 4 experiments: (1) clean-slate wholesale composed regresses gold 0.770/repr 0.618 vs v19 0.798/0.691; (2) clean full-label GATED ALSO regresses gold 0.690/repr 0.660; (3) June 8-family GATED is the WIN gold 0.809(+1.1)/repr 0.691(flat). A BROAD 205-label gte-tiny is a WORSE witness than the narrow 8-family one — spreading across labels collapses per-override accuracy. Overnight also REFUTED: more training (flat e8->e16) and MLP head (0.770 vs 0.769) — capacity/undertraining are NOT the bottleneck. Clean labels helped repr 0.571->0.618 but not enough. CONCLUSION: bank the narrow June-head gated escalation (+1.1/flat) as the win; the clean-slate-drop-v19 bet does not work. Optional refinement: widen the focused head 8->~15-20 contested families (NOT full 205). v19 stays the floor. Substrate: output/gte-tiny-clean-slate/OVERNIGHT_RESULT.md.'
