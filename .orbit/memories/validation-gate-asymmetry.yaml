key: validation-gate-asymmetry
body: 'Validation/JSON-Schema is an ASYMMETRIC signal for type inference: a reliable NO, an unreliable YES. It can confidently ELIMINATE a type (value contradicts the contract) but usually can''t SELECT one, because many types share a value shape. Two regimes, shown live on eval/gittables/corpus_pass/columns.parquet (probe via scripts/apply_ydf_validation_gate.py load_validations+evaluate): (1) ''validation is all you need'' — discriminating checks like geography.location.country_code''s 249-member ISO enum (USA/JUS vetoed, US kept; 366/400 kept, all 34 vetoes correct). (2) ''validation is half the answer'' — shared checks like geography.coordinate.latitude (a float in [-90,90] equally passes longitude/temperature/score) and datetime.component.year (^\\d{4}$ — 2017 also passes any 4-digit id). This is WHY the value-level YDF prior fed a 240-dim per-value JSON-Schema pass-rate vector INTO the model (++37 feature dims = 277-dim): for shared-shape types the model must carry the YES half using header/sibling/distribution context validation can''t see, and it needs the validation signal alongside real examples to learn WHEN validation is decisive. Strategy split: the NO half (validation-as-veto in profile) is shippable now with zero training data — it''s the gate, already canonical as ydf_prediction_gated. The YES half (disambiguating validation-survivors) is the real research problem and is what hit the corpus-starvation wall in spec 2026-06-04-value-level-ydf-labelling (cleaned gittables yields 10 distinct latitudes in 18M rows). Misfire note: the gate is only as good as each validation — year''s ^\\d{4}$ wrongly vetoes ~9% of its vetoes (real years stored as 1998.0); fix = normalise integer-valued floats before matching. Before wiring the gate live, sweep the corpus-wide false-veto rate per typed validation (a read, not a build).'
