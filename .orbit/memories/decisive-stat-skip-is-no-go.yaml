key: decisive-stat-skip-is-no-go
body: 'The neural-SKIP form of the column-statistics lever is a NO-GO (spec 2026-06-16-duckdb-shellout-ingestion ac-04b, 2026-06-17, scripts/sweep_decisive_stats.py, output/decisive-stat-sweep/finding.md). Swept four candidate decisive-stat predicates'' strictness knobs and measured GOLD SLICE PRECISION (fraction of fired columns whose human label == asserted label) over 751/931 gold columns; the skip pass-mark was >=0.98. ALL FOUR fail by a wide margin: low-card->categorical 0.33, high-card+alnum->alphanumeric_id 0.63, increment ~0.13 (gold support 1), exact-{0,1}->binary 0.00 (gold support 0). ROOT CAUSE: a full-column stat SEPARATES these types on average (the probe''s AUC 0.97-0.99 was real) but the LOSING side of each boundary is a high-frequency IMPOSTOR sharing the identical signature the blind assertion cannot see past: codes/years/sparse-ints under categorical; URLs(17)/UUIDs/addresses under alnum; Year-ranges + ranks(GlobalRank 1..20000) + ID columns gold-labelled integer_number under increment; constants(nd=1) + sparse 0/1 integer counts under binary. SEPARABILITY (AUC) IS A CEILING FOR A DISCRIMINATOR WITH A SECOND OPINION, NOT A THRESHOLD A BLIND ASSERTION CAN SHIP AT. CLINCHER: the binary/increment skips would re-assert the exact labels two SHIPPED gold-validated DEMOTION vetoes exist to strip (binary_vocab_veto, increment_substance_veto, both ->integer) — i.e. act against verified evidence and make gold WORSE. corpus-honest never ran (nothing cleared the first gate). SURVIVING SHAPE: the column-statistics accuracy lever lives only as a POST-PASS recall rule that KEEPS the neural vote and layers value-shape guards (exclude url/uuid/address/year-range/decimal), the shipped 0048/0096 veto-fallback pattern — even compounded, alnum tops ~0.82 on gold (a recall rule, not a 98% skip). Free-stats plumbing (ac-04a, ColumnScanStats, f1e047d) stands and feeds it. Refines [[column-stats-separate-residual-gaps]] (its ''likely a SPEED WIN via short-circuit'' hope is falsified for the skip) and [[categorical-is-a-residual-category]].'
