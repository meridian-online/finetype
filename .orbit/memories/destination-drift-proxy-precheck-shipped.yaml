key: destination-drift-proxy-precheck-shipped
body: 'Destination-drift proxy pre-check SHIPPED + validated (spec 2026-06-05-destination-drift-precheck). Before any training_data_addition retrain, run scripts/proxy_pretrain.sh: trains ONE seed for 10 epochs on the candidate''s already-built FTMB (~6-7% of the full 3-seed/50-epoch overnight wall-clock; v24 proxy 52min vs 828min full), snapshots Sense distribution on a FIXED corpus file list, runs scripts/drift_report.py (calibrated band --abs-floor 0.0040 --rel-mult 3.0 --direction up). NO-GO (exit 1) = do not launch overnight. Retro-calibrated 2-for-2: reproduced v23 categorical (proxy +7.30pp/4.69x vs full +6.13pp/4.10x) AND v24 coordinate.latitude (proxy +0.71pp/6.19x vs full +0.64pp/5.65x), preserving rank+direction and slightly OVER-stating magnitude (conservative, never false GO). Limitation: proxy under-convergence can add an extra NO-GO label (v24 proxy also flagged compact_ymd 23x, not in full run), so read WHICH label tripped. Mandatory ALONGSIDE the post-train Sense-distribution check (post-train stays mandatory). Cross-model snapshots MUST share one --file-list (DuckDB reservoir sampling not seed-reproducible). The drift report SUPERSEDES the snapshot watch block (whole label vector vs hand-picked subset). Substrate: output/destination-drift-precheck/{calibration.md,proxy_retrocalibration.md}.'
