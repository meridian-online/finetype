key: duckdb-shellout-ingestion-viable
body: 'Shell-out CSV/Parquet ingestion via the external duckdb CLI is VIABLE (choice 0100 ac-01 spike, 2026-06-16) — the path that works where choice 0099''s LINK approach failed. SUMMARIZE SELECT * FROM read_csv(f) gives per-column count/approx_unique/min/max in one parallel query (the free-stats); USING SAMPLE gives the value sample. Perf: large 1M-row/143MB file duckdb 0.71s vs Rust csv-crate read+stats ~1.25s (~1.8x faster, parallel); small 100-row file csv-crate wins by the ~40ms duckdb process-spawn floor (crossover is small files). Cross-platform GREEN: windows-latest + ubuntu-latest CI (#27611258343) + macOS local run duckdb SUMMARIZE + read_csv fine — and crucially NO compile/link risk (invoking duckdb.exe, not compiling libduckdb-sys), which is exactly why this works where bundled-DuckDB-on-Windows-MSVC failed ([[bundled-duckdb-breaks-windows-msvc]]). IMPLICATION: making duckdb a hard runtime dep + routing ingestion through shell-out unlocks the universal free-stats path. Crossover decision: full consolidation (duckdb everywhere, ~40ms small-file cost negligible for a CLI) vs hybrid (csv-crate for small files). duckdb v1.5.3 used.'
