key: full-column-stat-sharpen-is-redundant
body: 'The column-statistics lever ships NOTHING — neither as a neural skip ([[decisive-stat-skip-is-no-go]]) nor as a post-pass recall rule (spec 2026-06-17-categorical-alnum-recall-rule, 2026-06-17). (1) alphanumeric_id NO-GO: its defining shape (high-card alpha+digit) is shared by real URLs, so a stat override breaks 18 correct url preds to recover 2 (P 0.952->0.68). (2) categorical word full-column-cardinality upgrade NO-GO: text_vocab_override fires at distinct in [2,12] AND distinct/n<=0.6; sample distinct <= full distinct ALWAYS, so a representative ~100-sample of a low-card column already trips it — the full-column version adds nothing the model doesn''t already get. Full-file profiling confirmed: the 2 study ''winners'' are already categorical (Type) or top_level_domain (Unnamed:4) without any fix. The study''s apparent +2 was a CONFOUND: it joined harness predictions (from the small stored sample) against full-file stats — a value set in neither regime. ColumnScanStats (column/mod.rs, ac-04a, f1e047d) remains as tested plumbing with NO consumer. CORRECTION (2026-06-17): an EARLIER version of this memory claimed the gold harness feeds ''n=1'' truncated samples and ''understates production accuracy'' — that was WRONG, a separator-bug in my analysis (split on \x1f instead of the real SEP ''│'' in score_gold_anchor.py), so multi-value samples looked like one value. The harness feeds ~8 REPRESENTATIVE values (median 8), and crucially gold was adjudicated FROM those samples (sense_context/ydf_context), so the eval is INTERNALLY CONSISTENT. Re-baselining by feeding bigger source-read samples made accuracy WORSE (0.785->0.707, 84 right->wrong) — evidence the harness is NOT broken. The ''fix the harness'' follow-up is RETRACTED. Headline of record: 0.800 (745/931, June re-adjudication); a fresh re-run measures ~0.785 (4 columns fail to load + noise), same instrument. Whole arc''s lesson: full-column-statistic separability ([[column-stats-separate-residual-gaps]] AUC 0.97-0.99) does NOT convert to a shippable lever, as skip OR rule.'
