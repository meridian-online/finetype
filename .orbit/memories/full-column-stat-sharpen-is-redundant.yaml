key: full-column-stat-sharpen-is-redundant
body: 'The column-statistics lever ships NOTHING — neither as a neural skip ([[decisive-stat-skip-is-no-go]]) nor as a post-pass recall rule (spec 2026-06-17-categorical-alnum-recall-rule, 2026-06-17). TWO independent NO-GOs: (1) alphanumeric_id — its defining shape (high-card alpha+digit) is shared by real URLs, so a stat override breaks 18 correct url preds to recover 2 (P 0.952->0.68). (2) categorical word full-column-cardinality upgrade is REDUNDANT WITH PROPER SAMPLING, provably: text_vocab_override fires at distinct in [2,12] AND distinct/n<=0.6; sample distinct <= full distinct ALWAYS (subset), and a 100-value sample of a low-card column gives ratio <= 12/100 = 0.12 — so the sample-based rule already fires whenever the full-column version would, EXCEPT on degenerate n=1 samples. The apparent +2 gold gain was a CONFOUND: the score_gold_anchor harness feeds sample_values_truncated (some columns n=1) so baseline preds came from 1-value samples, joined against full-file stats — a pairing that exists in neither production nor the harness. Full-file verification: the 2 ''winners'' are ALREADY categorical (Type) or top_level_domain (Unnamed:4) on real data; the fix recovers nothing. CONSEQUENCE A: full-column-stat Sharpen fixes CANNOT be studied on the truncated-sample gold harness. CONSEQUENCE B: some categorical ''recall gap'' (gold R 0.443) is a HARNESS ARTIFACT (n=1 samples), not a model deficiency — the gold baseline 0.789 may understate production accuracy on low-truncated-sample columns. ColumnScanStats (column/mod.rs, ac-04a, commit f1e047d) remains as tested plumbing with NO consumer. Whole arc''s lesson: full-column-statistic separability (the probe''s AUC 0.97-0.99, [[column-stats-separate-residual-gaps]]) does NOT convert to a shippable lever — not as a skip, not as a rule.'
