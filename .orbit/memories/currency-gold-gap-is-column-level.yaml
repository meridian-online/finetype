key: currency-gold-gap-is-column-level
body: 'The 5 gold finance.currency.amount columns (NYC payroll base_salary/regular_gross_paid/total_ot_paid/total_other_pay + UK price_paid ''price'') are 100% BARE NUMBERS — zero in-value currency symbols across 20k rows each (verified 2026-06-15). Values like 70264.0 / 265000 are indistinguishable from decimal_number/integer_number at the value level; the only ''this is money'' signal is the HEADER (base_salary, price). CONSEQUENCE: the currency recall gap (gold R=0.000, all 5 -> decimal(4)/integer(1)) is UNREACHABLE by any value-based Sharpen guard (nothing to trigger on) AND a header-keyword guard is the deprecated header_hint regex pattern (decision 0042) with high collateral. Additive multi-branch retrain is also dead for currency (locale-format blend = corpus-honest NO-GO, currency precision 0.100 from subtype/generic granularity clash; additive route 0-for-5 — see [[finetype-retrain-authority]]). This is the column-level-ambiguous case the value-level arch test flagged (output/value-level-arch-test/findings.md): signal is in the column, not the value -> belongs to B3 late-fusion, NOT a guard or retrain. DO NOT re-propose a currency-symbol guard for the gold gap. LESSON: always check actual column VALUES for the in-value signal before approving a value-based guard (the symbol assumption was falsified here). A symbol-bearing euro/real corpus gap may still exist but is gold-invisible (0 symbol-bearing currency cols in gold) so only advisory-tier validatable.'
