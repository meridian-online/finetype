key: fresh-retrain-penalty-was-44-stats
body: 'spec 2026-06-21 ac-01 (2026-06-22): The ''~0.19 fresh-retrain Sense penalty'' that dead-ended the embed roadmap was ENTIRELY the 44-stat column-distribution change, NOT a regressed pipeline. cdist''s Sense 0.316 carried the 44 stats; reverting to v19''s bit-exact 27 stats (commit bdb7c79) recovers a fresh 3-seed Model2Vec retrain (potion-4M, format v4, LIVE 244 taxonomy) to Sense best-of-3 0.521 (BEATS v19 0.502) / composed 0.770 (inside v19 CI [0.767,0.819]). So: (1) we CAN rebuild v19 quality from scratch -> movable baseline = models/m2v-244-s44 (named m2v-244; Sense 0.521, composed 0.769); (2) 240->244 taxonomy change is benign (no drift); (3) the column-distribution 44-stat NO-GO didn''t just fail, it DESTROYED the representation. Seed spread is wide (Sense 0.481-0.521, composed 0.755-0.770) -> fresh-vs-fresh comparisons MUST be best-of-3, never single-seed. Build: scripts/overnight_m2v_244.sh (VALID_DIM-from-taxonomy + FTMB truncation gates baked in). See [[honest-sense-vs-composed-gate]] [[multibranch-stats-already-has-cardinality]].'
