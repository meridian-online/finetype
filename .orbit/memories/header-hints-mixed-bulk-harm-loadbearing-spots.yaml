key: header-hints-mixed-bulk-harm-loadbearing-spots
body: 'Corpus-scale ablation (2026-06-09, output/eval-ceiling-diagnosis/header_hint_ablation.md) of the hardcoded header hints on the 33k stratified sample: hints ON (A) / OFF (B, RHH_DISABLE_HINTS=all) / DEFER (C, FINETYPE_HINTS_DEFER=1, the new flag that makes hardcoded hints defer to confident predictions like the learned classifier). VERDICT: mixed and NOT removable wholesale. (1) In bulk the hints HURT: hints-OFF raises gated-YDF oracle agreement +3.7pts (0.4927->0.5294) because the hints FORCE confident labels where the model would honestly abstain (unknown marginal +48% when off) — real bulk harm, Precision-Principle-aligned to remove. (2) But they''re LOAD-BEARING where the model is weak: url recall craters 0.925->0.340 without them; corpus-honest gate = NO-GO for BOTH off and defer. hints-OFF triggers: unix_seconds COLLAPSE (39799->17637, correct_ratio 0.475, real loss), data_uri over_emit 8.8x, isbn, postal_code. hints-DEFER NO-GO milder (2 triggers vs 4): data_uri over_emit 8.8x (defer doesn''t help — model is CONFIDENTLY wrong on data_uri so defer leaves it), isbn oracle_fp. (3) DEFER strictly beats OFF (4.8% vs 9.3% churn, url recall 0.683 vs 0.340, 2 vs 4 triggers) but still NO-GO globally — too blunt applied to all families. CONCLUSION: surgical per-family, not wholesale — defer/remove the bulk-forcing families (header_hint_table finance/representation arms), KEEP url/datetime-epoch/isbn until the model covers them. This confirms the April RHH classification (12 removable / 10 model-gap) at corpus scale. The global FINETYPE_HINTS_DEFER flag is a per-family TOOL, not a default. Confirms the override asymmetry concern: hardcoded hints override even confident predictions (hint_is_hardcoded bypasses the confidence gate) while learned hints defer.'
