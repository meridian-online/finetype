key: v24-numeric-retrain-failed-coordinate-explosion
body: 'v24-numeric-precision (spec 2026-06-03) closed Failed at ac-04, NOT promoted. Default stays sherlock-v19-relu-s42. v24 trained clean (val_acc 0.944 all 3 seeds) and AVOIDED v23''s categorical explosion (corpus categorical 1.01%->0.86%), but opened a NEW negative-transfer family: geography.coordinate.latitude 15->65 (4.3x), longitude 16->44 (2.75x), region 35->61 on a matched 1000-file fresh-binary snapshot. Plain numeric columns (earthquake mag/dmin/rms/*Error) relabel as latitude; earthquake round-trip regresses 0.0130/grade C -> 0.0583/grade F. Target FP drop was uneven and net-negative: per-cluster bool->int -56pct and int->dec -100pct (wins) but utc only -4pct and url 0pct, AND corpus-wide utc predictions EXPANDED 50->256 (5x). KEY LESSON: the reachability safety_score (HIGH 0.84-0.95 on all 4 targets) gates CATEGORICAL-direction risk only; it is blind to destination drift into OTHER boundaries (numeric->coordinate). HIGH safety_score is necessary not sufficient; the mandatory Sense-distribution pre/post check is what caught this -- validates CLAUDE.md keeping it mandatory. Additive hard-negative retrain now 0-for-2 (v23 categorical, v24 coordinate) for clean precision wins. Substrate: output/v24-numeric-precision/relitigation_memo.md, sense_dist_v{19,24}_clean.json. Measured 2026-06-05 with FINETYPE_BIN=./target/release/finetype (PATH finetype 0.6.20 is stale).'
