key: sibling-context-is-the-stranded-architecture-layer
body: 'THE NEW ARCHITECTURE LAYER ALREADY EXISTS, HALF-BUILT. v19 (models/default = sherlock-v19-relu-s42) ships ONLY config/label_map/model.safetensors — NO sibling-context, NO hierarchical head: the production Sense model runs with ZERO cross-column context and a FLAT 250-way softmax. Yet the formal 2026-03 architecture challenge (RESPONSE_CLAUDE/GEMINI, FINDINGS.md) ranked sibling-context attention its #1 highest-value enhancement (Sato +14.4% macro F1; Pythagoras +17.92% weighted F1 on NUMERIC columns specifically — our coordinate/currency/numeric gaps) and hierarchical head its lowest-risk (P5). BOTH ARE BUILT: crates/finetype-model/src/sibling_context.rs (full multi-head self-attn, WIRED into CLI via wire_sibling_context in main.rs/profile.rs), char_cnn.rs HeadType::Hierarchical + HierarchyMap, plus tiered.rs/tiered_training.rs (ModelType::Tiered). BUT: (1) sibling-context was only trained for the OLD 6-class Sense (models/sibling-context, 1.5M, 78% val) — the multi-branch 250-class integration spec 2026-03-24-sibling-context-multi-branch is CLOSED with 0/7 ACs done, abandoned at REQUEST_CHANGES review (blockers: FTMB v3 table-grouped binary format, FrozenSiblingContext training loop, 6->250 class transfer untested — INTEGRATION ENGINEERING, not a negative result). (2) tiered = the DEAD original 46-CharCNN graph, pivoted away from 2026-02-28 for capacity ceiling (CharCNN fails >50 labels/model) — NOT a revival candidate. (3) value-level CharCNN fusion is comprehensively DEAD (additive collapses label space; deferral inert — expert right on only 3.6% of v19 disagreements; the famous family-A 17->93% was the ADDITIVE HEAD not the expert; output/late-fusion/deferral_finding.md). NET: the team took the additive-retrain (0-for-5) + deterministic-guard road (now exhausted, gold plateaued 0.782) and LEFT the #1 architecture enhancement stranded at the integration step. ''Finding the new layer'' = FINISHING sibling-context into the production fine-grained model (FTMB v3 + table-grouped training + ablation vs v19), strongly motivated for coordinates (lat always has lon sibling) but currency efficacy (symbol-less, header-decisive) must be PROBED not assumed. Supersedes the premise of spec 2026-06-16-scoped-late-fusion-boundary-arbiter (its value-expert is the poor witness). See [[currency-gold-gap-is-column-level]].'
