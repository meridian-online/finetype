key: v22-direction-hard-negatives
body: 'v21 (GeoNames-augmented geography) failed AC-07 — cell-2 lift only 2.3% vs 20% threshold (per output/corpus-pass-v21/cell_deltas.md). Per-subtype: city (62% of misses) moved -1.6%, full_address +1.6% (regress), region -4.3%. Easy subtypes moved 13-40% (postal_code, country_code, continent, iso6346). The diagnosis: GeoNames gave the model more positive city examples but no signal about what ISN''T a city. Next-iteration direction (v22): (a) hard negatives — train with explicit non-city text that shares city-like patterns: person surnames (Wikidata Q5), business/brand names, place-name-but-not-city features (rivers, mountains, neighbourhoods). The model needs to learn the boundary. (b) Real-world city columns are messier than GeoNames + noise recipes captured — try sampling from the GitTables corpus itself for city values (paired with hard-negative columns) once boundary training works. (c) The multi-branch sibling-context branch may need inspection — if it''s not helping city disambiguation, that''s a separate intervention. Reference: spec 2026-05-24-v21-geonames-geography close notes.'
