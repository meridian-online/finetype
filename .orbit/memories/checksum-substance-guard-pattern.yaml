key: checksum-substance-guard-pattern
body: 'The algo-exists validator-fix campaign (isbn/aba/luhn/npi/ean/upc/imei/isin/cusip/sedol/lei/iban) ships as ONE generic guard, not per-type vetoes. Pattern (choice 0098, isbn shipped 2026-06-15): (1) check-digit math in crates/finetype-core/src/checksum.rs (resolve(name)->fn); (2) a checksum: directive on the type Definition (sibling to validation:) names the scheme; (3) checksum_substance_guard in column/mod.rs apply_post_sharpen_guards reads the directive, resolves the fn, demotes bare-number columns that fail the checksum to integer/decimal. New NUMERIC type = one-line YAML directive + a resolve() arm, no new Rust veto. CRITICAL: do NOT fold the checksum into the shared CompiledValidator — the generic value_sharpen schema-demotion rules also call get_validator(label).is_valid and fire FIRST on checksum-failing columns, demoting to numeric_code/categorical (worse than the guard''s gold-correct integer_number). That regressed gold -4 (4 financial cols) in testing. Validator stays SHAPE-ONLY; the dedicated guard owns substance. Alphanumeric types (isin/cusip/sedol/lei/iban) need a shape-aware guard extension before enrolling (guard is bare-number-scoped today). See schema-validation-gate-bypassed-on-multibranch.'
