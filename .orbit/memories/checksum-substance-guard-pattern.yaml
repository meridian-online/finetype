key: checksum-substance-guard-pattern
body: 'The algo-exists validator-fix campaign ships as ONE generic guard (choice 0098), not per-type vetoes. Pattern: (1) check-digit fn in crates/finetype-core/src/checksum.rs (resolve(name)->fn); (2) checksum: directive on the type Definition (sibling to validation:); (3) checksum_substance_guard in column/mod.rs apply_post_sharpen_guards reads the directive, resolves the fn, and on a column most of whose values FAIL the checksum, demotes by shape: bare-number -> integer/decimal, alphanumeric -> alphanumeric_id (UNCONDITIONAL, not cardinality-split: checksum types are all identifiers so lookalikes are identifiers; gold 5/5). New type = one fn + one-line directive, no new Rust veto. SHIPPED: isbn(+4), aba(+2), cusip+sedol(+2, plus 2 isbn-on-alnum FPs). Cumulative gold 717->723. CRITICAL: do NOT fold checksums into the shared CompiledValidator — generic value_sharpen schema-demotion rules also call get_validator(label).is_valid and pre-empt the guard with a worse target (regressed gold -4). TRIAGE LESSON: a raw FP count overstates opportunity — a guard fixes an FP only if the column''s TRUE label == the guard''s demotion target. npi 4FP/0fixable (FPs are timestamps/ISBNs, not integers) -> NOT shipped. ean/upc/imei/credit_card/isin/lei/iban: 0 gold FPs. Campaign near-exhausted on gold after isbn/aba/cusip/sedol. See schema-validation-gate-bypassed-on-multibranch.'
