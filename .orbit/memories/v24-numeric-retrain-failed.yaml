key: v24-numeric-retrain-failed
body: 'v24 numeric-precision retrain (sherlock-v24-numeric-relu-s42/43/44, multi-branch, same v13-config as v22 — DATA-only change, no architecture delta) FAILS the mandatory Sense-distribution pre/post check; do NOT promote, do NOT attempt a v25 patch retrain. Evidence (2026-06-04): on-target the fix WORKS — trained v24-s42 moves utc_to_int cols to integer (29/40) and bool_to_int to integer (33/40), zero target regressions; int_to_dec and url_to_int clusters did NOT take (unchanged). But the global Sense distribution shows COLLATERAL: 800-file/11.7k-col snapshot vs v19 — datetime.offset.utc 52->183 (+3.5x), geography.coordinate.latitude 10->91 (+9x), plus entity_name +446, periodicity +97, boolean.terms +129, alphanumeric_id +126. categorical stayed flat (0.99%->1.05%) so it dodged v23''s specific explosion but reproduced the failure one label over. Full-file profiling (150 files) pins the mechanism: 29/1880 cols newly flip to utc/latitude, 25 of them FROM the correct representation.numeric.integer_number and 3 from decimal_number — v24 robs the correct numeric labels. The collateral cols are the SAME SHAPE as the hard negatives (low-integer Comments/Points -> utc; small decimals avgScore/gini_index -> latitude): additive hard negatives on an ambiguous region DESTABILISE the boundary rather than relocate it; win and collateral come from the same jittered boundary. This is the column-level-entanglement signature [[charcnn-vs-multibranch-data-scaling]] predicts. ac-04 closes Failed on the mandatory check alone; the 7hr gated corpus pass was NOT run (verdict already determined, would only quantify a Failed result). Next move is the CharCNN data-scaling experiment, NOT Sharpen [[sharpen-rules-fail-on-corpus-expansion]] and NOT another retrain. Substrate: output/v24-numeric-precision/sense_dist_v24.json vs sense_dist_v19.json.'
