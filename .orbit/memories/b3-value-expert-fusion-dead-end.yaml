key: b3-value-expert-fusion-dead-end
body: 'B3 value-expert fusion thesis is exhausted (2026-06-08). Two architectures tried to combine the value-level CharCNN (v25) with multi-branch v19: (1) additive late-fusion (v26/v27) COLLAPSES the corpus label space — NO-GO x2 on the corpus-honest gate (unknown +52%/+68%, categorical 10.7x/6.05x, 47-90 types zeroed). (2) learning-to-defer / selective override (deferral_selector.py) is collapse-proof but INERT: banks no win. Decisive gold-anchor numbers: family-A alphanumeric_id v19=12/30, expert-alone=12/30 (the 17%->93% family-A win was the ADDITIVE HEAD''s, NOT the expert''s — deferral overrides with the expert''s own label, which is no better); family-C latitude v19=0/30, expert=11/30 (real standalone win) but selector assigns p=0.04-0.16 because the expert over-emits latitude/decimal corpus-wide, so a corpus-calibrated selector won''t fire. The lat/lon signal is real but entangled with over-emission at a level column-level features can''t separate. CONCLUSION: value-expert is not a bankable contributor to a general classifier via any score-combination. v19 keeps a real latitude blind spot worth a FUTURE targeted fix (needs sibling-dist/header feature, not per-value char-CNN). Recommendation: abandon value-expert fusion for 0.7.0; models/default stays v19, Cargo 0.6.23. v25 preserved (local backup ~/mac_backup/finetype-v25-20260608 + HF value-charcnn-v25/). Evidence: output/late-fusion/deferral_finding.md, deferral_v1_report.md.'
