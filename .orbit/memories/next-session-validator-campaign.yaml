key: next-session-validator-campaign
body: |-
  SESSION OPENER (queued 2026-06-15): start the LAX-VALIDATOR FIX CAMPAIGN. Full prioritized list + per-type notes in task t-000073f518b9266878be6a08 (spec 2026-06-07-reference-data-mining-factory). Context: a parallel-agent audit found 17 taxonomy validators that check SHAPE not SUBSTANCE (length/format pattern, no checksum) — a Precision Principle violation; 14 already have the check-digit algorithm sitting unused in crates/finetype-core/src/generator/helpers.rs.

  START WITH ISBN — it is the proof-of-concept for the whole campaign: isbn_checkdigit_veto already ships as a POST-SHARPEN patch (added 2026-06-15). Fixing the EARLY validator instead (wire isbn10/isbn13 check-digit from helpers.rs into identity.commerce.isbn validation, so schema_validation_gate at column/mod.rs:860 rejects checksum-failing numbers) should catch the same FPs upstream, making the post-sharpen veto REDUNDANT. The end-to-end loop to demonstrate: (1) fix validator, (2) confirm gold UNCHANGED with the veto disabled via its rhh kill switch (proves the validator now does the veto's job), (3) RETIRE isbn_checkdigit_veto + its helper/test, (4) gold + corpus-honest gate the net change. That proves 'fix root cause, delete the patch' (decision 0038 strength-through-simplification) and sets the template for the other 13 algo-exists types (aba_routing, credit_card luhn, npi, isin, cusip, sedol, lei, ean, upc, imei, iban).

  DISCIPLINE: SEQUENTIAL — each fix touches shared files (the YAML validation blocks + validator path + the vetoes), so they cannot parallelize; each is gold + corpus-honest gated (scripts/eval_rule.sh --label X --out-dir output/X --default). A validator fix changes the early gate's DEMOTION behaviour, so it can relocate UNTARGETED types at corpus scale — the H05 corpus-honest gate is the backstop. Consider batching independent algo-exists fixes into one gate run (see [[corpus-honest-gate-batching]]). Use scripts/gold_fp_analysis.py for per-type FP/FN drill-down (joins on (sha,column_name)). BASELINE to beat/hold: gold 705... current 717/931=0.770 on main (c653ca0). Run 'orbit task show 2026-06-07-reference-data-mining-factory t-000073f518b9266878be6a08' first.
