key: data-label-quality-is-the-unrun-ceiling-lever
body: 'STRATEGIC (2026-06-28, after the reshape NO-GO): the suspected real accuracy ceiling is TRAINING-LABEL QUALITY, not the model — and it''s the one lever never cleanly tested. Evidence: raw Sense caps ~0.50-0.57 across EVERY architecture tried (potion-4M/8M/16M, two-view, per-value attn, gte transformer; oracle 0.599) — a ceiling stable under model change is the fingerprint of a label ceiling. The data lever IS proven on raw Sense ([[encoder-data-lever-proven]]): corpus-mined + GeoNames/Wikidata vocab-membership labels lift the contested SEMANTIC set 0.684->0.82-0.89. THE GAP: that proof was always entangled with a transformer encoder upgrade (died: composed-tied, 100x latency) and measured on RAW SENSE — never isolated on COMPOSED gold with the SHIPPED STATIC architecture. The cell ''static model + clean vocab labels + composed gold'' is EMPTY. Every experiment (encoders, fusion, reshape) changed the model on top of the same noisy distilled-Sherlock labels. THE EXPERIMENT: rebuild training set with vocab-membership labels (generators exist: generate_geonames_geography.py, generate_wikidata_person_columns.py) for the semantic families, HOLD architecture+Sharpen fixed, measure composed. CAVEAT: [[composed-is-rule-bound]] (3 confirmations) is the prior against it moving composed — BUT the data lever targets the semantic mass (geo/person, open-vocab, NO validator) which is exactly where Sharpen structurally can''t help ([[ceiling-discovery-both-levers-dead]] called it ''irreducible by the model''). Decisive either way. TWO STANDING DISCIPLINES (author 2026-06-28): (1) DON''T TRUST LABELS — sample-check values before training on ANY source; vocab-membership has its own failure modes (region collapses on GeoNames admin1, recall 0.07-0.33); we''ve found 33 gold corrections + validator traps (color_hex passes bare numbers) recently. (2) SPEED is a decoupled track: label COUNT is not a speed lever (softmax negligible, retired-240 trap); real levers = the ~8% fast-path (this session''s fastpath_sizing.md), the free IO/single-encoder wins (next-train-research/RESEARCH.md), and a SMALLER model that clean labels might make viable at equal accuracy. Handoff: output/composed-accuracy-roadmap/SESSION_HANDOFF.md.'
