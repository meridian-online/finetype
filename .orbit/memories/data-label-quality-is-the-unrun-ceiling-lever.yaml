key: data-label-quality-is-the-unrun-ceiling-lever
body: 'RESOLVED 2026-06-28 — REFUTED. This was the standing hypothesis (post reshape NO-GO) that TRAINING-LABEL QUALITY, not the model, was the unrun accuracy ceiling — based on raw Sense capping ~0.50-0.57 across every architecture + the data lever proven on raw-Sense contested set ([[encoder-data-lever-proven]], 0.684->0.82). THE EXPERIMENT RAN (spec 2026-06-28-clean-label-retrain) and REFUTED it on composed gold: holding the shipped arch + Sharpen fixed and swapping geo/person labels to GeoNames/Wikidata vocab-membership clean positives gave composed(reframe) 0.845 ≈ s43 0.853 (FLAT, within CI) — clean labels DON''T move composed even for the semantic mass. The shipped model already saturates semantic gold (city 0.958, country_code 0.926, continent 1.000), so there was no headroom; the proof''s lift was instrument-specific (contested subset, raw Sense, frozen 8-class probe) and didn''t translate. 4th confirmation of [[composed-is-rule-bound]]. FULL RESULT + numbers + caveats: [[clean-label-retrain-refutes-data-ceiling]]. The two standing DISCIPLINES from this thread remain valid regardless: (1) sample-check labels before training (vocab-membership is a clean-positive GENERATOR but a noisy FILTER — the ac-0 audit caught it); (2) speed is a decoupled track (label count is not a speed lever; real levers = ~8% fast-path + free IO/single-encoder wins).'
