key: v23-ac01-finding
body: 'v23 spec ac-01 audit reveals premise invalidation on tight-pattern subtypes. Of YDF-labeled ''iso6346'' columns (3,389 rows, the ''biggest regression'' at +40.3%), ZERO contain values matching the iso6346 regex ^[A-Z]{3}[UJZ]\d{7}$ — they are dominated by msg_id columns (2,828/3,389 prefixed ''msg'', e.g. msg48752425). Same for ydf=mgrs (35 cols, 0 pattern matches; values are stock_id/cluster_id/package codes) and ydf=plus_code (4 cols, 0 matches). v22 is NOT regressing on these — it''s correctly classifying msg_id/stock_id as alphanumeric_id while YDF''s ''ground truth'' still mislabels them as iso6346/mgrs. Implementing the planned R23/R24/R25 promote rules would either never fire (no real codes in corpus) or fire wrongly (promote msg_id → iso6346). For loose patterns the picture is different: country_code_alpha2 has 839 ydf-labeled cols matching the pattern (real recovery potential); iata 25 (marginal — 5-col delta vs v19); icao 1 (no signal). Conclusion: v23 spec needs revision before ac-03+; the cell-2 ''regression'' the spec aimed to reverse is largely a measurement artefact of noisy YDF labels, not a real v22 capability loss. Investigation artefact: output/v23-sharpen-codes/pattern_fp_audit.tsv. Surfaced 2026-05-26.'
