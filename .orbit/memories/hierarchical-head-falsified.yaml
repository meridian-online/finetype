key: hierarchical-head-falsified
body: 'The hierarchical Domain→Family→Type head (char_cnn.rs HeadType::Hierarchical, --head hierarchical / --hierarchical flag) was TRAINED and FALSIFIED 2026-06-13 (choice 0097 research arm; output/mining-factory/coord-only/ac06_hierarchical_verdict.md). Same-data ablation vs flat head: gold 0.685 vs 0.718 (−3.3pp), Sense drift NO-GO (user_agent), corpus-honest gate NO-GO 8 vs 7 triggers, numeric_code collapsed HARDER (3% kept vs flat 18%), AND it CREATED new cross-domain instability (calver 8.2×, docker_ref) — the opposite of preventing cross-domain leakage. MECHANISM (general): splitting the OUTPUT head does not fix interference that originates in the SHARED REPRESENTATION (char/embed/stats/header/validation trunk entangles value-shapes before the head); the extra domain+category+leaf softmaxes ADD interference surface. CONSEQUENCE: an error-decomposition ''ceiling'' (e.g. 43% of v19 errors are cross-domain → +12.2% if a domain head were perfect) MIS-LOCATES the fix — the head is not where the problem is. Caveat: the 0097 run was on the coord-only manufactured blend, not the base corpus, and ~1pp short of convergence, but the same-data flat-vs-hier ablation + the general mechanism make a base-corpus re-run a likely-redundant spend. choice 0097 campaign conclusion: ''model-side delivery is exhausted'' for value-shape-overlap boundaries; ship via value-rules (0048/0096) or accept the ceiling. Pairs with [[sibling-context-is-the-stranded-architecture-layer]] (sibling-context = thin gold headroom) — BOTH layers of the 2026-06-16 architecture program are now empirically dead.'
