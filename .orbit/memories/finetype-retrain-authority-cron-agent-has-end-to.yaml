key: finetype-retrain-authority-cron-agent-has-end-to
body: 'finetype-retrain-authority: Cron agent has end-to-end retrain authority on M1 (Metal). Trigger: E01 — failure_log accumulates ≥20 distinct (predicted, observed-inferred) misclassification pairs OR ≥30% of last 48h reject volume from misclassification. Promote: B08 (m-19 ≥ -0.5%, gate ≥ 0%, vci3 pass, no per-type ≥5% regression) + corpus-honest gate (spec 2026-06-07-corpus-honest-quality-gate): a NO-GO from scripts/corpus_honest_gate.py is BLOCKING — it is the only instrument that catches a fix which RELOCATES error rather than removes it (latdec''s ydf=None latitude FPs that gold-anchor + m-19 + drift-proxy all missed). A corpus-honest GO is ADVISORY (necessary, not yet sufficient): the gate is a proven NO-GO detector but its GO-precision is unvalidated until it clears a first genuine GO candidate without false alarm (safety_score precedent — advisory until labelled outcomes accrue). Hold: B09 (window). Halt: H05 (m-19 drop ≥1%, gate drop ≥2%, vci3 fail, per-type ≥5%, OR corpus-honest gate NO-GO). Plus H07 (model-SHA mismatch in eval report) + H11 (corrupted candidate model) + H12 (pipeline drift in prediction count). models/default symlink swap is the promotion mechanism. Authored 2026-05-03 in tabletop; corpus-honest gate added 2026-06-07.'
