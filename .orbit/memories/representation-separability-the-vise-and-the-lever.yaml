key: representation-separability-the-vise-and-the-lever
body: 'Representation-separability research (2026-06-14, deep-research, framed as feature-separability not forgetting — closes the gap the first pass left). CONFIRMS: the coordinate failure is class-OVERLAP / low-separability (overlap hurts even when balanced; Santos Information Fusion 2022) — no clean boundary exists in that region of the shared rep, which is why head-only + hierarchical changes can''t fix it. DECOUPLING (cRT/LWS/tau-norm, the arm we flagged as missed) would NOT have helped: it fixes classifier BIAS for a class already SEEN+separated (Kang ICLR2020), but a starved class is a representation GAP and frozen-feature adaptation BREAKS — backbone updates required (Luo ICML2023). THE VISE (cited): freeze backbone -> can''t learn the gap; update backbone -> distorts shared rep, harms neighbours (full FT +2% ID but -7% OOD vs linear probe, Kumar ICLR2022 = the mechanism of our numeric_code 59k->1.7k collapse). Structural dilemma, not tuning — why dose/replay/head all failed identically. THE NEW LEVER (zero inference cost) for a FUTURE starved class NOT cleanly rule-expressible: training-time feature-GEOMETRY-shaping loss — SupCon (Khosla NeurIPS2020), ArcFace angular margin (Deng CVPR2019), center/prototype losses — reshapes the trunk so overlapping classes separate; plain softmax doesn''t shape geometry. Caveat: training stability, small-classifier evidence thinner. FOR COORDINATES: rule wins (cleanly-checkable range+precision; encoding range as a loss is ''a difficult optimisation problem'' Dash 2021; engineered~=learned at small scale Jiang AIED2018). DECISION: coordinates->Sharpen rule (settled); next non-rule-able starved class->geometry-shaping loss (next sanctioned engine investment, analogue of logit-adjust for shape-overlap); do NOT use decoupling for starved classes. Memo: output/mining-factory/representation-separability-research.md. Links [[hierarchical-head-falsified-for-shape-overlap]] [[catastrophic-forgetting-cure-is-train-time]].'
