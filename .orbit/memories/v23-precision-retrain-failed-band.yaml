body: 'v23-precision-retrain (spec 2026-05-27) closed Failed at ac-04 → ac-05 Path C. FP-rate component Met (top-6 corroborated clusters dropped −70.8%, three by 92-96%), but cell-2 component Failed: v23 gated cell-2 vs v19 lands at +5.1% (regression vs v19 baseline; +17.3% vs v22). Per-subtype damage on v22''s monotone-movers: country +70.3%, region +29.0%, city +14.1% — v22''s −31.5% country lift entirely gone. Mechanism: opt-in --include-column-level-types let the 50k categorical-target hard negatives train the model to fire discrete.categorical on 548k columns (+529.6% vs v22), ~48k of which were geography.location.city in v22. The ''representation.discrete.categorical'' label is too broad as a training target — its definition (any low-cardinality string set) overlaps with geography subtypes at sample sizes 5-10. v22 remains the default; v23 model dirs kept for diagnostic access (s42/s43/s44). What we learned: the corroborated-gaps report ranks ''what to fix'' but not ''what''s safe to fix this way''; cluster reachability needs scoring before any training_data_addition retrain. Candidate next bets (not committed): Sharpen rule for the 3 clean clusters, 6th model branch for low-cardinality discrimination, or extended diagnostic that measures per-cluster reachability. Per-cluster outcomes per : 721b890ea74d gender_code FP -95.7% (Met), 1b858e0d073b utc-on-int -92.2% (Met), 20803deffbad url-on-int 0% (flat), 81b63a52e3ef boolean-on-int -0.8% (flat), cdde5d05b73a periodicity-on-cat +139% (REGRESSED), 3f2aa8465552 alphanumeric_id-on-cat -95.8% (Met).'
