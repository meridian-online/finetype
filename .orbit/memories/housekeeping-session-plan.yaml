body: 'PLANNED housekeeping/simplification session (scoped 2026-06-14, for next session; card 0019 scenario 5). ENABLER: every change gates on the no-regression gold run (baseline 0.741) + full test suite + clippy — that harness makes large-file refactoring safe; do NOT start without confirming the baseline. SCOPE (file sizes): column.rs 11,956 (primary), generator.rs 6,819, main.rs 5,747, multi_branch.rs 4,489 (locale_data.rs 3,333 is data, leave); 277 python scripts to weed; output/ is 4.5GB to prune. SEQUENCED PLAN (risk-ascending): Phase 1 QUICK WINS (parallel worktree agents, independent files): fix latent clippy::type_complexity train_fusion_head.rs:177 (breaks CI on rust update), resolve flaky sense_train test_train_sense_fixture_loss_decreases, prune output/ + survey 277 scripts for dead ones (delete-list not auto-delete), STATE_CODES->taxonomy enum dedup. Phase 2 STRUCTURAL CLEANUP in column.rs (sequential, BEFORE split): add explicit post-sharpen guard hook (value-identical rules are unreachable behind early-returning hint paths — the amount_veto trap), dedup the 3 identical apply_header_sharpen call sites. Phase 3 THE SPLIT (sequential, mechanical, behavior-preserving, compile+test after each module move, NO logic changes mixed): column/{helpers,value_sharpen,feature_sharpen,header_sharpen,mod}.rs; final no-regression gold+test+clippy gate; then generator.rs/main.rs if appetite. AGENTS: parallel for Phase 1 (independent files, today''s worktree pattern worked); SEQUENTIAL single careful pass for Phases 2-3 (one file, all edits collide) — a Plan agent can design module boundaries first. DISCIPLINE: do as its OWN session/spec isolated from feature work — a behavior-preserving refactor mixed with accuracy changes makes the gold gate ambiguous. Deferred-items task: t-000126f4 (post-sharpen hook, clippy lint, flaky test, checkpoint-resume).'
