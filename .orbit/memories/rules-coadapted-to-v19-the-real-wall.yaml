key: rules-coadapted-to-v19-the-real-wall
body: 'spec 2026-06-23 (2026-06-24) QUANTIFIED: rule co-adaptation to v19 confirmed by raw->composed transition grid on gold (reframe n=927, raw=pure argmax no veto/Sharpen): v19 raw 0.471->composed 0.797 (FIX 335, BREAK 33, netLift +302); potion-8M raw 0.520->0.794 (FIX 295, BREAK 41, netLift +254). potion-8M raw model is MORE accurate (+45 cols) but the deterministic layer gives v19 48 MORE net-lift columns -> cancels raw lead -> composed tie (~3 col gap). Per-rule gap (gold, small-sample/directional): v19-only recoveries = veto_fallback:id(5)+veto:hash(5); potion-only BREAKS (rule turns right->wrong) = header_hint_cross_domain link_id/state(6)+veto:alphanumeric_id(3)+singletons (14 total). So co-adaptation is REAL but LOCALIZED to ~a dozen rules, not broad. PATH TO BEAT v19: potion raw already wins; re-fit the ~dozen co-adapted rules (fix header-hint/alnum-veto misfires) -> composed > 0.798. Tractable rule edit, not architecture rebuild. SEPARATE from ship blocker (corpus over-emissions user_agent/currency_code generators). Embed aggregation is a SHARED ceiling (v19 + gte-tiny clean-slate both pool); per-value attention untested but lower priority than rule re-fit. See [[potion8m-corpus-nogo-faithful]].'
