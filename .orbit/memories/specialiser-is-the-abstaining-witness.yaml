key: specialiser-is-the-abstaining-witness
body: 'ANSWER to ''is there a better specialiser than YDF?'' (2026-06-27, 7-agent workflow output/.../wrbmhfcjo): NO better KIND of general feature-model specialiser exists, and FineType already ships the one that survives. The YDF''s 0.505 (datetime 0.97 / identity 0.71 / representation 0.44 / geography 0.31 / technology 0.00 vs human gold) is the PROOF that ''a feature-model suite across all labels'' is structurally dead — most columns carry NO decisive per-value fingerprint. Every feature-specialiser shape was tested + killed on the same value-fingerprint-determinability axis: value-expert/CharCNN fusion (NO-GO x2, label collapse), blind decisive-stat skip (0.33-0.63 vs 0.98 bar), full-col-stat recall rule (ships nothing net), hierarchical head (WORSE than flat 0.685 vs 0.718), richer encoder (composed rule-bound). The ONLY surviving shape is the ABSTAINING value-decisive rule that fires only where the fingerprint is decisive — the Sharpen layer IS a suite of ~8 of these (the better specialiser; grow it, composed ~0.81->~0.88 bankable, 4-for-0, near-ZERO staleness vs the YDF''s stale 240-dim). THREE non-competing extensions, only one a fresh feature-specialiser: (1) GAZETTEER/vocab-membership reader scoped to REGION (ISO-3166-2+admin2, corroboration-gated, abstains by construction) — the one geography leaf composed genuinely misses (region P0.692/R0.600); litigated county->region surface, vocab not in-repo, small gold prize. (2) LLM-as-judge OFFLINE only (teacher: re-adjudicate contested gold + mine taxonomy gaps) — the ONLY lever on the semantic residual (no per-column fingerprint by construction; ~100% LLM-determinable). (3) m2v-embedding PER-CLASS ABSTAINING WITNESS routed as a corroborating veto (NOT a classifier — ''m2v->classifier'' IS the Sense model, capped 0.52 by the embedding regardless of head). The embedding carries the SEMANTIC signal the char-feature YDF + value-rules lack (m2v linear-probe separability 0.803 contested, gte 0.893, shipped 0.684) — but an ASSERTING embed-specialist over-emits (gte fine-tune corpus-honest NO-GO x2), so it MUST abstain. Proven shippable form = two-sided witness gate (override only where model band low/med AND witness>=0.95): gte-tiny version MEASURED gold +1.1pp (0.798->0.809), improve-or-hold both gates. m2v is the CHEAP variant (in-model/free + modular: one binary GBT per class, no main retrain). DEAD-ENDS (do not re-propose): value-fusion, encoder/attention SWAP, hierarchical head, blind decisive-stat, calibrated-abstaining-YDF (zero new coverage). Pilot: spec 2026-06-27-m2v-witness-specialiser-pilot. Links [[composed-is-rule-bound]] [[decisive-stat-skip-is-no-go]] [[determinability-probe-gold-is-the-ceiling]] [[encoder-data-lever-proven]] [[composed-accuracy-ceiling-and-backlog]].'
