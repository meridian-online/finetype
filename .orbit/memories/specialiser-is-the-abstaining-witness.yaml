key: specialiser-is-the-abstaining-witness
body: 'ANSWER to ''is there a better specialiser than YDF?'' (2026-06-27, 7-agent workflow output/.../wrbmhfcjo): NO better KIND of general feature-model specialiser exists, and FineType already ships the one that survives. The YDF''s 0.505 (datetime 0.97 / identity 0.71 / representation 0.44 / geography 0.31 / technology 0.00 vs human gold) is the PROOF that ''a feature-model suite across all labels'' is structurally dead — most columns carry NO decisive per-value fingerprint. Every feature-specialiser shape was tested + killed on the same value-fingerprint-determinability axis: value-expert/CharCNN fusion (NO-GO x2, label collapse), blind decisive-stat skip (0.33-0.63 vs 0.98 bar), full-col-stat recall rule (ships nothing net), hierarchical head (WORSE than flat 0.685 vs 0.718), richer encoder (composed rule-bound). The ONLY surviving shape is the ABSTAINING value-decisive rule that fires only where the fingerprint is decisive — the Sharpen layer IS a suite of ~8 of these (the better specialiser; grow it, composed ~0.81->~0.88 bankable, 4-for-0, near-ZERO staleness vs the YDF''s stale 240-dim). TWO surviving non-competing extensions (the third was piloted + killed, see below): (1) GAZETTEER/vocab-membership reader scoped to REGION (ISO-3166-2+admin2, corroboration-gated, abstains by construction) — the one geography leaf composed genuinely misses (region P0.692/R0.600); litigated county->region surface, vocab not in-repo, small gold prize. NOW ALSO COVERS COUNTRY (the witness pilot proved country is gazetteer-determinable; see below). (2) LLM-as-judge OFFLINE only (teacher: re-adjudicate contested gold + mine taxonomy gaps) — the ONLY lever on the semantic residual (no per-column fingerprint by construction; ~100% LLM-determinable). PILOT VERDICT — extension (3) the cheap per-class m2v-embedding witness is a 4th DEAD-END (spec 2026-06-27-m2v-witness-specialiser-pilot, closed NO-GO). The full-bucket gold sweep (output/m2v-witness-pilot/sweep_result.md, 19 buckets, one-vs-rest GBT on the in-model 1024-dim aggregated m2v embedding) shows the witness carves a HIGH-PRECISION abstaining region (R@P.90>=0.5) ONLY on CLOSED-vocabulary types — country 0.818, year 0.805, country_code 0.722, isbn 0.500 — and THREE of those four are already Sharpen-owned (validator/closed-set/checksum), so redundant. The lone semantic win is country, which is a GAZETTEER lookup -> folds into extension (1), not a fresh specialiser. The OPEN semantic residual that motivated the witness (word, plain_text, entity_name, alphanumeric_id, city) is UNCRACKABLE by the cheap m2v witness EVEN at near-perfect AUC: city AUC 0.987 / R@P.90 0.000, entity_name 0.959 / 0.000. The discriminating variable is VOCABULARY CLOSURE, not semantics: bounded value sets carve, open vocabularies collapse because adjacent confusors pollute the top of the ranking. METHODOLOGY KEEPER: AUC is the wrong instrument for an abstaining veto — precision-at-recall is the gate (an AUC screen would have shipped city/entity_name and gained nothing). The gte two-sided witness gate (+1.1pp, 0.798->0.809, override only where model band low/med AND witness>=0.95) remains the ONLY embedding form that ships — but it needs the STRONGER gte encoder (not free, corpus-honest YELLOW), so it is a deliberate Sense-side bet, not the cheap in-model lever. DEAD-ENDS (do not re-propose): value-fusion, encoder/attention SWAP, hierarchical head, blind decisive-stat, calibrated-abstaining-YDF (zero new coverage), and now the cheap per-class m2v witness (closed-vocab-only = redundant with Sharpen/gazetteer). Links [[composed-is-rule-bound]] [[decisive-stat-skip-is-no-go]] [[determinability-probe-gold-is-the-ceiling]] [[encoder-data-lever-proven]] [[composed-accuracy-ceiling-and-backlog]].'
