key: m2v244-corpus-nogo-gold-reproducible-not-corpus-faithful
body: 'spec 2026-06-21 (2026-06-23): m2v-244 (reproducible potion-4M 244-label baseline) corpus-honest gate = NO-GO, despite tying v19 on gold (composed 0.769 within CI). GOLD-REPRODUCIBLE != CORPUS-FAITHFUL: the fresh-retrain pipeline rebuilds v19''s gold score but NOT its corpus behavior. 13 triggers: numeric_code COLLAPSES 59157->238 (7328 confirmed->0, routed to integer_number +255k = the leading-zero zero-loss numeric_code exists to prevent); isbn 8024->521, npi 42675->18608 collapse; file_size 6.8x, pipe_separated 5.5x, username 3.3x, alphanumeric_id 2.7x, locale_code 2.1x, si_number 2.0x (8813 contra) over-emit onto oracle-refuted cols; unknown +229k. Implications: (1) m2v-244 NOT shippable, zero-code unblock CLOSED; (2) potion-8M + code-16M share the data blend/recipe -> likely inherit it -> must each clear their OWN corpus-honest gate (offline predict_multibranch path) before trusting their gold-tie; embed swap won''t fix a data-driven collapse; (3) v19 stays default — only corpus-clean model (240-label, unreproducible); (4) we SKIPPED the destination-drift precheck on m2v-244 — the 1000-file/10-epoch proxy would have flagged numeric_code collapse cheaply; EVERY fresh retrain incl the baseline must run it. Real blocker = DATA/RECIPE diagnosis (why fresh retrains collapse numeric_code/isbn/npi + over-emit si_number/file_size), gold-blind, corpus-gate-visible. See [[fresh-retrain-penalty-was-44-stats]] [[static-embed-frontier-topped-out]].'
