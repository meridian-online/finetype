body: 'BREAKTHROUGH FINDING (2026-06-19, 4 fresh-eyes sub-agents converged): adding types via flat-softmax Sense RETRAIN is 0-for-6 (v22/v23/v24/v27x2/latdec all NO-GO); deterministic value-based Sharpen READERS are 4-for-4 (postal-veto 0.6.27, veto-shape-fallback 0.6.28, R32 0.6.29, datetime-reader 0.6.35; gold 610->745). The law: a flat softmax cannot express PRECEDENCE (''nothing tighter fits''), so any trained shape-class becomes a universal attractor; destination drift originates in the SHARED TRUNK (hierarchical head was built and made it WORSE, output/mining-factory/coord-only/ac06; not the output layer). ENCODER is settled: gte-tiny/MiniLM was built+tested 2026-06-18/19, separability 0.684->0.872 but representative -5.8pp (better encoder MOVES the attractor, demoted 130k entity/name->residual); DO NOT re-run, recipe banked in output/fine-tuned-encoder-discovery. So: add new types as gated value-based readers (corroboration gate: only fire where model is in-family/residual, never override confident foreign type; veto-consistency gate: values pass the leaf validator >=0.9) => destination drift STRUCTURALLY IMPOSSIBLE, no overnight run, no NO-GO. Cheap dry probe (seconds, zero model change): count corpus columns passing each type''s validator grouped by current sense_prediction = reachable recall + over-emission risk. ONLY retrain if a type has no value signature, and then use frozen-trunk + abstaining one-vs-rest override heads (reuse late-fusion deferral infra), NEVER flat-softmax. Infra unlock for low-band escalation: record sense_confidence (currently NULL in v19_gated.parquet).'
