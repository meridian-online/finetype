key: fusion-head-needs-target-families-in-train-corpus
body: 'B3 late-fusion (spec 2026-06-08) FAILED ac-04 kill switch: fusion-v25 regressed 3 of 4 gold families (latitude recall 1.000->0.000, longitude ->0.033, categorical 0.967->0.000; lat/lon collapse to decimal_number, categorical to country_code). Root cause is NOT architecture (the value-CharCNN learns lat/lon at 0.729/0.813 when trained on manufactured coordinate diversity, ac-01). It is the HEAD''s training corpus: the distilled sherlock corpus inherits sherlock''s class distribution and contains NO coordinate columns, so lat/lon showed NaN recall all through ac-03 validation and the head never learned a gradient connecting View1''s lat/lon signal to the lat/lon output. The learned residual weight alpha settled at 0.139 -- looked healthy on distilled val but too weak to inherit v19''s correct latitude calls, which alone get them right. LESSON for any general Sense-replacement head: it can only hold the rare/starved families if its TRAINING corpus contains them; a corpus whose distribution IS the gap cannot teach the model to close the gap. Fix path: blend manufactured coordinate/categorical columns into the fusion feature dump so those families have non-NaN support, retrain+re-search head, re-run the same kill switch. Until then v19 multi-branch stays the shipped Sense default.'
