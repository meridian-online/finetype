key: enum-domain-emission-shipped
body: 'Enum-domain emission shipped (patch increment of choice 0102, spec 2026-06-17-enum-domain-emission, 2026-06-17). profile now reports each column''s OBSERVED bounded domain as a DESCRIPTIVE x-finetype-enum extension {open, domain, distinct, rows, cohesion}, DECOUPLED from the semantic label — a country_code column emits [FR,GB,US] just like a categorical one (0102: enum-ness is a representation property, not a competing type). Policy: finetype_core::enum_domain::detect_enum_domain — predicate distinct<=32 AND distinct/rows<=0.5 AND NOT label-denylisted (representation.numeric./geography.coordinate./datetime./representation.identifier./url). Cohesion (char-shape) is EMITTED as a score, NOT gated (ac-00 ablation: gating it cost 12 enum positives to reject 3 open-text; ratio subsumes it). KEY IMPL FACT: emit_table_schema/attach_stats (crates/finetype-mcp/src/json_schema.rs) is the SHARED json-schema emitter for BOTH the CLI -o json-schema AND the MCP profile tool — so the MCP shadows the CLI for free (parity structural). The standard JSON-Schema  keyword is now gated conservatively (label_is_enum_keyword_eligible = categorical/boolean) — FIXING a prior cardinality-only over-emission (enum_overfit hazard, card 0014); the open domain lives only in x-finetype-enum which validators ignore, so profile->validate round-trip is unaffected (verified 10/10 valid grade A). Commits 89d5ac1/1423e73/c079381/9424f84. REMAINING: docs note + the version bump/tag/publish (author''s deliberate /release binary). DEFERRED to 0.7.0 (separate spec vs 0102): the ACCURACY reframe — eval scores semantic type + enum dimension, drop representation.discrete.categorical as a target, gold migration, closed-enum dictionaries. Honest correction: ColumnScanStats (ac-04a) did NOT become the consumer (label-prefix denylist + direct counts were simpler); it remains idle plumbing. Arc: [[cardinality-boundary-error-is-real]] -> 0102 -> this patch.'
