key: training-data-gap-locale-format-family
body: 'Training-data gap census (2026-06-12, from scripts/prepare_multibranch_data.py templates): only 114 of 240 types appear in the synthetic co-occurrence templates — 126 absent entirely. Currency: ONLY generic finance.currency.amount; all 12 amount_* locale variants absent. Datetime: only month_name/day_of_week; the 4 locale-format month/weekday variants (abbreviated_month, long_full_month, weekday_abbreviated_month, weekday_full_month — the audit''s locale-gap validators) absent. CONSEQUENCE: the value-level model votes decimal_number on euro currency and cannot emit any locale-format variant it never trained on (the ''corpus whose distribution IS the gap'' failure mode). The CLEAN co-traveller batch for a value-level locale-format training run = currency amount_* variants + datetime locale month/weekday variants: same profile (CLDR-manufacturable, explicit in-value marker = symbol or month-name token, value-level, low-collateral, absent from training). These are the IDEAL CharCNN-vs-multi-branch pilot ([[charcnn-vs-multibranch-data-scaling]]) because the in-value marker removes the latitude context-confound. Tier-2 candidates (manufacturable but 2-letter/short-code context-ambiguous, harder): state_code (gold P=R=0.000, ISO 3166-2), finance.banking.aba_routing/bsb. HARD EXCLUDE from any training run: representation.discrete.categorical/ordinal, representation.identifier.alphanumeric_id — residual categories that resist flat-softmax training and become universal attractors ([[categorical-is-a-residual-category]], choice 0096); they belong in Sharpen veto-fallback rules. VEHICLE: the reference-data mining factory (spec 2026-06-07) already emits CLDR month_name/abbreviated_month + ISO currency_code/currency_symbol but NOT the amount FORMAT variants nor the full/weekday month variants — those are the currency-shaped + datetime-shaped holes to add. See spec 2026-06-12-currency-variant-recognition.'
