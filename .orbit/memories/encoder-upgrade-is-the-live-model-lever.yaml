key: encoder-upgrade-is-the-live-model-lever
body: |-
  ENCODER UPGRADE is the live model-side lever — discovery 2026-06-18-fine-tuned-encoder-discovery CLOSED (GO to build), build spec 2026-06-18-minilm-encoder-build DRAFTED + partly driven. The FIRST model-side GO after 0-for-6 retrains. Substrate: output/fine-tuned-encoder-discovery/.

  THESIS: every failed model bet left the ENCODER static (additive retrains fed the same Model2Vec-static trunk; hierarchical head [[hierarchical-head-falsified]] reshaped output; sibling [[sibling-context-is-the-stranded-architecture-layer]] added cross-column). Upgrading the encoder (static Model2Vec -> fine-tuned MiniLM) is the untouched lever, targeting the shared representation where interference lives.

  DISCOVERY EVIDENCE (zero-shot linear-probe, 244 contested semantic cols): contextual all-MiniLM-L6-v2 0.893 (header+values) / 0.766 (values-only) >> static Model2Vec 0.803 >> shipped model 0.684. Decoder LLM Qwen2.5-0.5B 0.901 barely beats the small ENCODER for 10x latency -> small encoder is the tool, no decoder/LLM-in-the-loop needed.

  BUILD PROGRESS (2026-06-18, ac-00 through ac-01/02 preview driven; ac-01 production/ac-03/ac-04 NOT done — need real compute + supervised decisions):
  - ac-00 (RUST LATENCY, gate): candle BERT runs (candle-transformers 0.8.4 + tokenizers + safetensors, deterministic, embeddable — all existing workspace deps). candle CPU ~7x slower than torch/MKL: single-col 45.8ms, batched(32) 10.7ms (AT 10ms budget). Code: crates/finetype-candle-spike/src/bin/minilm_latency.rs.
  - ac-00.5 (METAL, M1 GPU): SOLVES latency — Metal batched 0.07ms/col (150x CPU), corpus low-band pass ~2min vs 5.9h. CAVEAT: Metal/CUDA only; cross-platform CPU stays at-budget batched (int8 the lever, now low priority). Run batched always.
  - ac-01/02 PREVIEW (head on frozen MiniLM, distilled-trained, gold/repr test): (a) residual ATTRACTOR does NOT reproduce — head UNDER-predicts residual (0.97 prec), doesn't collapse to the sink; class-balance slightly hurt. Attractor is NOT the binding risk. (b) BINDING RISK = TRAINING-DATA COVERAGE: head trained on CURRENT distilled hits only 0.648 on gold (BELOW shipped 0.684), residual recall 0.45 — distilled residual class doesn't cover gold's contested cases (PA-plain-text, Si-status). Encoder CAN separate (CV 0.766) but distilled doesn't TEACH the gold boundary.

  REFINED BUILD PLAN: ac-01 is NOT 'fine-tune MiniLM on distilled' (under-delivers 0.648). It needs (1) header+values representation (+13pp), (2) MINED/GENERATED contested-residual training data (codes-that-are-plain-text) — the TOP build risk (filed as task), above latency (GPU-solved) and attractor (didn't reproduce). Corpus-honest gate (ac-04) remains the arbiter. ML probe env: gitignored uv venv output/fine-tuned-encoder-discovery/.venv (torch+sentence-transformers). Pairs with [[confidence-quality-band-shipped]] (low-band escalation gate), [[representative-accuracy-fixture-shipped]].
