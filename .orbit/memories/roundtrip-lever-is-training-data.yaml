key: roundtrip-lever-is-training-data
body: 'Round-trip precision (profile->validate) lever, measured 2026-06-03. Fast single-dataset harness (scripts/roundtrip_metrics.sh on earthquakes_2024.csv: reject_rate_non_trivial=0.149) TRACKS the gittables corpus: a 250-table stratified sample (scripts/roundtrip_ab.py) gives non_trivial_pct=0.866, reject_rate cell-weighted=0.141, column-weighted ceil-failpct=0.190 (ceil 0.01). So the earthquake harness is a trustworthy /goal inner loop, not an outlier. Lever attribution (corroborated_gaps.parquet, recommended_action_class weighted by affected_column_count): training_data_addition 378131 cols >> model_retrain 31315 >> validator_widening 1399. So schema-strictness is NOT the main lever (~0.6% of reject_rate_ceil); and the diagnostic recommends ZERO fallback_adjustment (Sharpen) gaps -- consistent with decisions 0038/0048. Even the validator_widening bucket is half misclassification mislabelled (columns headed Email holding postal addresses); the only clean schema-widening wins are datetime.component.year rejecting float-form years (''1837.0'', ~235 cols) and identity.person.gender rejecting encoded forms (''1''/''0'',''f''/''m'', ~99 cols). v23 RULED OUT as a lever: sherlock-v23-precision-relu-s42/43/44 produce byte-identical labels to v19 across 2111 sample columns AND on earthquake, despite different weights (v23 closed Failed, geography->categorical regression). Conclusion: the fix for the stalled blog round-trip is a training-data-addition bet on the specific misclassification families (network-codes->measurement_unit, event-ids->geohash, gender_code FP, utc-on-integers), NOT a Sharpen patch, schema loosening, or model swap.'
