body: 'spec 2026-06-21 ac-02 (2026-06-23): The bigger-static embed frontier is a NO-GO. Tested vs m2v-244 baseline (Sense 0.521 / composed 0.765-0.769), all 3-seed: potion-8M single (capacity) Sense 0.522 FLAT / composed 0.794 (+3pp, rule-composability only, ties v19); base-8M++code-16M two-view (teacher diversity + fusion) Sense 0.513 FLAT / composed 0.770 FLAT (lost 8M''s bump). => static Sense ceiling ~0.52; capacity, code-teacher, and two-view ALL flat. DEEPER: composed is RULE-BOUND not embed-bound — even gte transformer Sense 0.571 only TIED v19 composed 0.787 (matches ac-02 prep: only ~1pp embed-addressable, rest is 0096 residual-attractor rules like alnum->geohash). NO embedding path (static or transformer) beats v19 composed. Decisions: stop embed chase; do NOT build fastembed-rs (composed rule-bound, even gte Sense ties); m2v-244 (ac-01) is the standing movable-baseline win; the product-accuracy lever is VALUE RULES (alnum->geohash veto, task t-00007be9), not encoders. See [[potion-single-view-flat-sense-composable]] [[fresh-retrain-penalty-was-44-stats]] [[honest-sense-vs-composed-gate]].'
