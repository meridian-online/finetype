key: next-default-model-lead-target-c-family
body: 'Gold-anchor diagnosis (oracle: metrics_v19-models-default_2026-06-05.tsv) picks the C_lat_lon_temperature family as the lead target for the next default model. v19 is never wrong on the hard families, only SILENT (all recall gaps are precision 1.000). The single leveraged cell: decimal_number''s 12 FN ARE latitude''s 12 FP — same temperature/feature-float columns, so one hard-negative retrain moves two numbers (decimal recall 0.60 up, latitude precision 0.714 up), and it is the OPPOSITE direction of v24''s death (v24 pushed numerics INTO latitude). Corpus coverage abundant: 3,974 latitude->decimal columns, split into ~1,280 true latitudes (Lat/lat/latitude) and a rich FP pool of feature floats (cumulative_gpa, mag, HitRate, vz/vx/vy velocities, RealTime(ms), LnPrior, ML min_q metrics). Cluster safety_score=0.589 MODERATE -> mandates the proxy pre/post check, which the new gate provides. The C retrain is the proxy''s first FORWARD use (2-for-2 retro only so far). Value-voting (Hugh''s idea) tested: hard latitude-range |v|<=90 catches only 4/3974 (0.1%) because impostors sit IN-range (gpa 3.4, hitrate 0-1, mag ~15) -> value voting does NOT recover C, only the retrain does. Value voting IS a free precision guard for bounded/enumerated labels elsewhere (year range, longitude +/-180, country_code/iata set-membership) per decision 0048. Full writeup: output/gold-eval-anchor/next_step_diagnosis.md'
