key: decimal-number-is-a-residual-attractor
body: 'The coordinate (latitude/longitude) gold regression in the gte-embed work is NOT a representation gap — it is the decimal_number RESIDUAL-ATTRACTOR (decision 0096 pathology, same as categorical/alphanumeric_id). Evidence (spec 2026-06-21, ac-01): (a) a 5-fold-CV linear probe separates coordinate-vs-decimal at 0.85 on gold using EITHER gte-tiny embed (1536) OR numeric_range_features(32) — range features are NOT better (0.841 vs 0.852), so the embed already carries the signal; (b) the floor model still predicts decimal_number 1.8x its base rate (171 vs 94 actual), swallowing 34 latitudes + 38 longitudes. A flat softmax defaults to the frequent ''no tighter numeric type fits'' class regardless of feature quality. So NO embedding (gte, two-view, range features) fixes it — per 0096 it is rule-shaped. Levers: logit_adjust_tau (trainer CLI flag, zero inference cost, counters the frequency attractor) and/or a value-DISTRIBUTION-based decimal->coordinate promotion gate (both-sides evidence + kill switch; plain range promotion is blocked by coord-promote-guard for false-positive reasons). See [[categorical-is-a-residual-category]].'
