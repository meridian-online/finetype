key: infer-deterministic-fast-path
body: 'infer single-shot deterministic fast-path SHIPPED 2026-06-25 (commit f150c34, finetype_core::fast_path::deterministic_fast_path, card 0006). cmd_infer column mode, no --header: resolves structurally-conclusive types (email, ip_v4, ip_v6, mac_address, windows_path, message_id, delimited ISO datetime) from value-only validators BEFORE loading the multi-branch model, skipping the ~0.08s model load. Measured 0.12s->0.07s (~40%) on eligible values; ineligible unchanged (cheap miss then full path). CONSERVATIVE leaf set (CONCLUSIVE_LEAVES const) — each validator structurally exclusive so correct-by-construction (validator-passing ⟹ value IS that type); ≥90% sample match + datetime veto-consistency, mirrors label_validates_sample. Agreement-tested vs full pipeline over ~40 values: never fires on a non-member (rejects 999.x IPs, partial dates, bare <...>); only diffs are ip_v6/mac single values where the MODEL was wrong and fast-path is right (so it''s also single-value-robust, never a regression). NOT widened to loose/overlapping closed-set/locale validators (would reintroduce the attractor failure mode, see [[composed-is-rule-bound]] rule-layer discipline). Engaged no-header only (header can steer full pipeline); RHH kill-switch ''deterministic_fast_path'' (needs --features rhh-instrumentation). Batch infer untouched (amortises model load). Builds on [[infer-latency-breakdown]]. The sibling-context skip (commit 91aac37) was the marginal ~10ms predecessor.'
