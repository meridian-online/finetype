key: eval-campaign-workflow-lessons
body: 'Sequential gold-gated campaign workflow lessons (2026-06-15 session): (1) COMMIT each gated fix BEFORE starting the next — intermixing two fixes in shared files (checksum.rs, a YAML) then having no interactive ''git add -p'' (blocked in this env) forces bundling them in one commit. Keep history clean by commit-then-next. (2) The gate''s corpus pass (~30min) LOCKS ./target/release/finetype — do not rebuild during it (corrupts spawned subprocesses); prep next-fix code in debug (cargo test -p ...) and hold the release build until the gate finishes. See task for the snapshot-binary fix. (3) ''cargo build & wait; predict'' raced once and predicted on a STALE binary — force a clean rebuild (touch + foreground cargo build) before measuring, or check binary mtime. (4) TRIAGE: a raw FP count overstates a guard''s opportunity — a guard fixes an FP only if gold-label == the guard''s demotion/promotion target (see checksum-substance-guard-pattern). (5) CLAUDE.md per-type numbers drift — always regenerate current gaps from the latest gold report_*.md, not the embedded v19 snapshot.'
