key: sharpen-header-hint-validator-corroboration
body: 'Value-corroborating header-hint overrides (decline a header_hint promotion when the column''s values fail the hinted type''s universal validator) only works for labels with PRECISE validators. Gold A/B on the attention model (spec 2026-06-25-sharpen-stage-audit ac-1): broad guard was net +6 but 14 recover / 8 regress, because the universal validators for technology.internet.url, geography.location.country_code, datetime.offset.iana, and datetime.offset.utc reject their OWN genuine members at ~0% (href->url, ''Country Code''->country_code, a real utc_offset->utc all regressed). Pass-rate carries no separating signal there (a 0.5->0.10 threshold change did nothing). Scoped the guard (header_hint_value_corroboration) to {datetime.component.year, datetime.epoch.unix_seconds, datetime.epoch.unix_milliseconds} -> +5/0 gold-clean. The url/utc/ordinal/alphanumeric_id clusters need per-label value tests, not a universal-validator guard. See output/sharpen-audit/ac1_measurement.md.'
