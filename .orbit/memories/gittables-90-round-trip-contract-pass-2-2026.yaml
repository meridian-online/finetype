body: 'GitTables 90% round-trip contract pass-2 (2026-05-10): superseded the 2026-05-03 contract after 8 cycles (7 full + 1 partial df6a4260). Gate byte-identical 0.0785 across 7 measurements (157/2000) — model frozen, gate working as designed. Five amendments folded: B02 split (B02a detected / B02b widen retrain-mode), B10 partial-cycle recovery (codifies cycle 4 H02 pattern), H04 disambiguated (cycle_id-based, not lockfile-presence), H13 null-Δ pause semantics, E01 split (E01a autonomous / E01b calibration). Plus §2 lockfile-cycle_id-only / harness_dirty gate / git pull --rebase before push. New P1 bead finetype-7zi filed for autonomous type-inference module — without it, E01a structurally cannot fire and every retrain is forever via E01b. Brief at orbit/contracts/2026-05-10-pass2-tabletop-brief.md; new contract at orbit/contracts/2026-05-10-gittables-90-percent-roundtrip.yaml.'
