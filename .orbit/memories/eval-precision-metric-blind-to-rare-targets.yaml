key: eval-precision-metric-blind-to-rare-targets
body: |-
  The corpus precision 'ceiling' (~0.49 cell-2 vs gated-YDF, flat across v22/v23/v24/latdec) is a MEASUREMENT ARTIFACT, not a model limit (finding 2026-06-08, output/eval-ceiling-diagnosis/finding.md). Two structural facts: (1) the scored denominator (v19_gated.parquet, 5.81M cols) is 52.5% plain integer+decimal, while the rounds' battlegrounds latitude+longitude+url+utc total 18 cols (0.0003%) — raw YDF proposes latitude 8x and utc 0x across 6.6M cols, so they can't enter the denominator. (2) The common types a rare-type bet collaterally damages (city 60.5k, country 8.5k) ARE measured, so a round is debited for side-effects and credited nothing for the rare-type fix — a one-way ratchet where every round can only stay flat or regress.

  The gated-YDF oracle is a NOISY JUDGE, not ground truth: its own gate data shows raw YDF confidently wrong 70-100% on many families (year 69%, decimal_comma 94%, isbn 90%, credit_card 96%, phone_e164/iso6346 100%); against independent DBpedia it's ~8x further from truth than the Sense model it judges (relative signal; DBpedia mapping is header-derived/coarse). 0.6.24 already showed 86% of Sense 'disagreements' were honest abstention.

  RULED OUT: no leakage/circularity. YDF trains only on synthetic+distilled (never reads corpus), scores 100% on the held-out sha%2==1 measure partition. Firewall discipline sound.

  CORRECTIONS: (a) demote aggregate corpus-precision as headline; use the rare-label-quota'd corpus-honest gate (latitude=2,213 cols there vs 3). (b) build a trusted ground truth for contested rare types (header-anchored+value-validated) instead of chasing the oracle — prototype scripts/build_rare_type_gold.py. (c) latitude-vs-rms etc. are value-unidentifiable (header-only); route to Sharpen, don't value-retrain. (d) re-baseline the multi-lens diagnostic on v19 (it ran against v22, -10.4% worse).
