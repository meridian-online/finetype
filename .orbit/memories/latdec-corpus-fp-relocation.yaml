key: latdec-corpus-fp-relocation
body: 'latitude->decimal hard-negative retrain (spec 2026-06-06): NO-GO at corpus scale despite GO on gold anchor (240), m-19 (369->377), AND drift proxy. The fix RELOCATED rather than removed the feature-float->latitude confusion. Bet''s success metric (sense=latitude AND ydf=decimal) hit 0 ONLY because the candidate''s 4,417 NEW latitude FPs land on ydf=None columns (ver/cam/HitRate/gpa, 99.1% non-geographic by name) where the oracle abstains; v19''s 3,974 FPs were ydf-visible. Net feature-float latitude FPs ~2,700 (v19) -> ~4,377 (candidate), ~60% WORSE. Two compounding blind spots: (1) latitude is 0.13% of columns so the proxy''s fixed 1000-file list (~18 lat cols) can''t resolve a +23% shift — proxy is calibrated for over-emit EXPLOSIONS on common labels, not drift on rare ones; (2) an FP metric conditioned on the oracle being non-null is gameable by relocating FPs to oracle-abstain columns. Lesson: gold anchor is an EFFICACY instrument not a GENERALISATION one; only the full corpus pass + by-name inspection caught this. A hard-negative SET overfits to its patterns, not the class boundary. Incidental win: TLD 87,542->3,038 was v19 over-emitting (99.4% ydf=categorical) — real precision gain but unrelated to the bet.'
