key: plain-text-type-discovery-method
body: 'Mining hidden types out of a residual bucket (representation.text.plain_text, 447k cols): cluster by STRUCTURAL SHAPE of the first sample value (regexp_replace digits->9, alpha->W) not by header; measure volume as DISTINCT DATASET SIGNATURES (file_path with digits masked), never raw column count — replication inflates raw counts 16x+ (snake_token 28,291 cols -> 1,709 datasets; pos_tagged 6,965 -> 74). Rank = distinct-dataset breadth x blind-panel nameability (N independent agents name relabelled/shuffled clusters from values alone, 0-1 confidence, flag ''mixed''). Build gate = volume bar AND clean (non-mixed) verdict; mixed clusters fail precision principle. SHIPPED v0.6.36 (spec 2026-06-19-plain-text-type-discovery): 3 types added LIVE to technology domain (filesystem.windows_path, internet.message_id, code.qualified_name) + categorical retired as a leaf (choice 0102) = 240->242. KEY: adding/removing a taxonomy leaf touches taxonomy YAML + generator arm + label_category_map (FORMAT_LABELS sorted + 4 count tests: test_category_counts, test_eligible_labels_count, test_all_labels_are_sorted, test_total_is_N) + cli_golden 240->N + precise_audit window. valid_dim/n_classes=240 are MODEL config fixtures (deserialized JSON), NOT taxonomy-derived — they stay 240 until retrain, do not touch. Categorical is an internal sentinel (CATEGORICAL_LABEL in column/mod.rs, fusion_cardinality_gate) remapped to word at finalize — removing the leaf keeps the sentinel, zero runtime change.'
