key: plain-text-type-discovery-method
body: 'Mining hidden types out of a residual bucket (e.g. representation.text.plain_text, 447k cols): cluster by STRUCTURAL SHAPE of the first sample value (regexp_replace digits->9, alpha->W) not by header; measure volume as DISTINCT DATASET SIGNATURES (file_path with digits masked), never raw column count — corpus replication inflates raw counts 16x+ (snake_token 28,291 cols -> 1,709 datasets; pos_tagged 6,965 -> 74). Rank = distinct-dataset breadth x blind-panel nameability (N independent agents name relabelled/shuffled clusters from values alone, 0-1 confidence, flag ''mixed''). Build gate = volume bar AND a clean (non-mixed) verdict: mixed clusters fail the precision principle (can''t validate ''range OR code OR age-band''). New types are retrain-gated: label space locked at 240 across taxonomy + label_category_map + model valid_dim, precise_audit enforces taxonomy~model +/-1. See spec 2026-06-19-plain-text-type-discovery.'
