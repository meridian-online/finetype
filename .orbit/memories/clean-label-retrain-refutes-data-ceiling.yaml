key: clean-label-retrain-refutes-data-ceiling
body: 'RESULT (2026-06-28, spec 2026-06-28-clean-label-retrain): the ''training-label quality is the accuracy ceiling'' thesis is REFUTED on composed gold. RAN the experiment that two months of architecture work never ran — held the SHIPPED arch (m2v8m potion-8M, m2v8m-244 config) + Sharpen FIXED, swapped ONLY the geo/person training labels to GeoNames/Wikidata vocab-membership clean positives, single seed, measured composed gold (reframe). THE NUMBERS (composed reframe, bar = s43 0.853): AUGMENT (keep all real v3 + ADD clean positives = the clean isolation of the label variable) = 0.845, FLAT within the +-2.4pp gold CI; raw Sense even ticked DOWN 0.536->0.516. REPLACE (drop v3 geo/person, generator-only synthetic) = 0.774 (-7.9pp) — a synthetic-vs-real DISTRIBUTION shift, NOT a label-quality signal (it cratered exactly the synthesised families: continent 1.000->0.000, city 0.958->0.458; the ac-0 audit predicted it). DIAGNOSIS (3-way per-family recall s43|REPLACE|AUGMENT): the shipped model ALREADY SATURATES semantic gold (city 0.958, country_code 0.926, continent 1.000, country 0.818, region 0.800); AUGMENT PRESERVED all of them and marginally lifted country 0.818->0.909 + country_code 0.926->0.944, but the HEADLINE stayed flat because the families were already maxed and composed is rule-bound. WHY THE PROOF DIDN''T TRANSLATE: [[encoder-data-lever-proven]]''s 0.684->0.82 lift was instrument-specific (CONTESTED subset, RAW Sense, frozen-MiniLM 8-class linear probe) — it does NOT translate to the shipped 245-class multibranch on composed gold. This is [[composed-is-rule-bound]]''s 4th confirmation, now on the open-vocab SEMANTIC MASS that Sharpen supposedly can''t fix (the strongest case for the data lever) — it still didn''t move. CONCLUSION: the accuracy ceiling is the rule layer + already-saturated semantic gold + irreducible residual mass, NOT the training labels. STOP chasing data/labels for composed accuracy (decisive per the handoff''s pre-registered framing). CAVEATS: taxonomy drifted 244->245 (datetime.offset.timezone_abbreviation, Sharpen-recovered, 0 training rows, inert) — trained candidate at 245 (= env where 0.853 was measured), added a pre-flight valid_dim guard after a dimension-mismatch crash; REPLACE NaN''d at epoch 44 but best-checkpoint (model_best, epoch 40) preserved the healthy model; single seed (within noise); the FULL proven recipe also MINED mislabelled residuals + relabelled hard negatives — this run added clean POSITIVES only, so the mining variant is a weak-prior but not strictly closed; 4M speed track NOT run (gated on AUGMENT GO, which was flat). Substrate: output/clean-label-retrain/{VERDICT.md, ac0_*.md, scores/}, scripts/{audit_clean_labels,build_clean_label_blend,run_clean_label_augment}.* Resolves [[data-label-quality-is-the-unrun-ceiling-lever]].'
