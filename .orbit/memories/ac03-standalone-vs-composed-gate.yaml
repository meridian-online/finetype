key: ac03-standalone-vs-composed-gate
body: 'ac-03''s offline precomputed-feature predict path (predict_multibranch) produces STANDALONE Sense argmax only. The canonical gold gate (v19=0.798) is COMPOSED — Sense + the Rust Sharpen rule layer (vetoes, shape fallback, vocab override) which runs in , not in the model. So standalone is NOT comparable to composed; the rule layer adds ~+0.27 (prototype gte-tiny: 0.378 standalone -> 0.646 composed). Consequence: the spec''s ''ac-03 offline gate BEFORE ac-04'' can only gate on STANDALONE (use floor-vs-release-candidate standalone to isolate the fine-tune''s value); the true composed comparison vs v19 needs ac-04 (gte in-binary). gte-floor-s42 (frozen gte-tiny + 4-stat + L2-norm fixes) standalone gold = 0.532/931, implying ~0.75-0.80 composed — plausibly competitive with v19. predict_multibranch validated: reproduced 0.9497 on the floor model''s own training FTMB (vs train 0.953/val 0.926).'
