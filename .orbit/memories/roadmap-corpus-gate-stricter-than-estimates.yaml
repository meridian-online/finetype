key: roadmap-corpus-gate-stricter-than-estimates
body: 'FINDING (2026-06-28, executing the composed-accuracy roadmap Tier-B): the corpus-honest gate (H05, BLOCKING) is STRICTER than BACKLOG.md''s per-fix risk estimates. #12 increment suppression was tagged ''+8, low-risk, ship-as-is''; the meaningful version (default increment->integer, gold +7 recovering integer-ID over-emits) is a corpus-honest NO-GO — the gated-YDF oracle confirms ~128k contiguous-run increments on the 33k stratified sample, so wholesale demotion collapses 98% of oracle support (correct_ratio 0.021 vs 0.6 floor). Only the value-decidable None/Some(false) slice was shippable = gold 0.854->0.856 (+2), corpus-honest GO (commit acc513c). IMPLICATION: the roadmap''s staged 0.86->0.88->0.90 is optimistic — DEMOTE arms of high-volume types (increment, and likely the geo/IATA Tier-C header-corroboration) hit the collapse band; RECOVERY arms (unknown->X, the id-residual #13 and binary #14 arms) are additive and lower-collapse-risk, more likely GO. RE-BASELINE FIRST: live 0.6.38 is 0.854 (795/931), NOT BACKLOG''s stale 0.812 — the Sharpen campaign + gold re-adjudication already banked; re-anchor errors against output/composed-accuracy-roadmap/rescore/live_errors.tsv (136 errors). The warm Sense cache at output/composed-accuracy-roadmap/incgate/{sense_cache.tsv,base.tsv,baseline.parquet} re-gates the next rule in seconds (resharpen). Strategic: 4 sessions (reshape/clean-label/ceiling-discovery/Tier-B-first-NO-GO) agree accuracy is near its practical ceiling; the higher-leverage bet is PRODUCT (honest typing: unknown-reason + representative-baseline surfacing, both S-effort spec-ready) per ceiling-discovery ac-04. Links [[composed-is-rule-bound]] [[clean-label-retrain-refutes-data-ceiling]].'
