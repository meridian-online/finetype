id: 0006-command-line-interface
feature: Command-line interface
as_a: data analyst
i_want: a tight set of CLI verbs for type detection, profiling, validation, and taxonomy exploration
so_that: I can work with data types from my terminal using predictable patterns that compose into pipelines, without tripping over maintainer-internal flags or vestigial subcommands
goal: Four public verbs (infer | profile | validate | mcp + taxonomy with json-schema output) composing into pipelines; maintainer affordances hidden; surface mirrors MCP
maturity: established
scenarios:
- name: Consistent input patterns
  given: any FineType command that accepts data
  when: I use -f for file input or -i for inline values
  then: every command follows the same input convention — no per-command flag memorisation
  gate: false
- name: Flexible output formats
  given: a command that produces structured output
  when: I pass -o plain|json|csv|markdown|arrow|json-schema
  then: results render in the requested format for human reading or downstream tooling
  gate: false
- name: Pipeline-friendly design
  given: a Unix pipeline
  when: I run finetype profile -f data.csv -o json-schema | finetype validate -f data.csv --schema -
  then: structured output goes to stdout, composing cleanly with downstream FineType verbs, duckdb, jq, or any pipe target
  gate: false
- name: Tight public verb surface
  given: the finetype binary
  when: I run finetype --help
  then: 'four public verbs cover the workflow: infer, profile, validate, mcp — plus taxonomy for browsing (which absorbs type-mode JSON Schema export via -o json-schema)'
  gate: false
- name: Maintainer affordances stay hidden
  given: subcommands and flags used only by the training pipeline or CI
  when: a regular user reads --help
  then: train, eval, eval-gittables, check, generate are hidden; --model, --model-type are hidden; --sharp-only is removed (no-op)
  gate: false
- name: Public surface mirrors the MCP server
  given: the contract that MCP and CLI should evolve in lockstep
  when: I compare finetype --help with the MCP tool list
  then: every public CLI verb maps to an MCP tool (and vice versa); CLI exposes maintainer affordances on top, MCP does not
  gate: false
