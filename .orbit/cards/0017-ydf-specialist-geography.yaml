id: 0017-ydf-specialist-geography
feature: YDF as geography specialist — training-data extraction for v20+ Sense retrain
as_a: FineType maintainer using m-19's corpus diagnostic to plan v20 retraining
i_want: the gittables diagnostic's corroborated gaps to feed a training-data extraction pipeline, starting with geography — pulling columns where YDF is high-confidence on a geography subtype (`address.full_address`, `address.postal_code`, `location.continent`, etc.) and Sense's prediction misses by a domain-sibling
so_that: the next Sense retrain has corpus-scale, lens-corroborated training examples for known-weak domains, rather than depending on synthetic data alone; YDF stops being just a noise filter and becomes a productive labelling oracle for Sense's weak spots
goal: Turn m-19's diagnostic output into a self-improving loop. The 61,068 corroborated `training_data_addition` clusters (ac-09 output, ~378,131 distinct columns) are the obvious source — but right now they're a static list. A geography-first extractor that pulls `(Sense-missed, YDF-confident-in-geography)` columns and emits them as training rows would lift Sense's geography precision in v20 without manual labelling. Demonstrate on geography (where author observation 2026-05-23 already noted YDF picks up `geography.address.full_address` reliably); if the v20 corpus pass shows a measurable lift in the geography mechanism cells, scale the pattern to other domains.
maturity: emerging
scenarios:
- name: Geography training-data extract produced
  given: m-19's diagnostic outputs at eval/gittables/corpus_pass/ (columns.parquet, mechanism_decomposition.parquet, corroborated_gaps.parquet) and the FineType taxonomy's geography domain (25 types across location / address / coordinate categories)
  when: I run scripts/extract_ydf_specialist_training_data.py --domain geography
  then: a TSV emitted at eval/gittables/v20_training_candidates/geography.tsv with rows `(file_path, column_name, sample_values, ydf_prediction, ydf_confidence, sense_prediction, candidate_target_label, row_hash)` — one row per column where YDF predicts a `geography.*` type with confidence ≥ 0.7 AND Sense's prediction is either non-geography or a domain-sibling within geography
  gate: false
- name: v20 retrain consumes the extract
  given: a geography.tsv from the extractor, plus the existing v19 training data
  when: v20 trains the multi-branch classifier on the union and the full corpus diagnostic re-runs
  then: report.md (Part 1) shows a measurable reduction in geography-domain corroborated gaps — specifically the `(criterion × mechanism)` cells where geography mismatches concentrated in m-19 (predominantly `reject_rate_ceil × format_diversity_path_b` for postal_code → full_address and `non_trivial_floor × misclassification` for missed geography labels)
  gate: false
- name: Scale to second domain
  given: geography extract has demonstrated v20 lift
  when: I run --domain finance (or datetime, or identity)
  then: same shape of extract — the pattern generalises without code changes per domain
  gate: false
