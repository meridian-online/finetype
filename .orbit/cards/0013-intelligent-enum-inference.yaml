id: 0013-intelligent-enum-inference
feature: Intelligent ENUM inference
as_a: data analyst
i_want: FineType to recognise low-cardinality columns and map them to DuckDB ENUMs, with the model understanding categorical patterns better
so_that: I get 4-10x storage compression and faster groupby/filter performance without manually declaring ENUM types
goal: Any low-cardinality column gets ENUM in load output; model accuracy on categorical columns improves via enriched training data
maturity: emerging
scenarios:
- name: Cardinality-based ENUM promotion in load
  given: a CSV where a VARCHAR column (e.g., country, status) has ≤50 distinct values
  when: I run finetype load -f data.csv | duckdb
  then: the column is emitted as CREATE TYPE + CAST to ENUM regardless of its semantic type
  gate: false
- name: Type-aware ENUM for inherently finite types
  given: a column classified as country, continent, currency_code, or iata_code
  when: I run finetype load
  then: the column gets ENUM treatment because the type is known to be a finite set, even if cardinality exceeds the default threshold
  gate: false
- name: Profile surfaces ENUM candidates
  given: a CSV with mixed cardinality columns
  when: I run finetype profile -f data.csv --verbose
  then: low-cardinality columns show cardinality count and ENUM eligibility in the output
  gate: false
- name: Threshold control
  given: a column with 200 distinct values
  when: I run finetype load with --enum-threshold 0
  then: no ENUM types are generated — all categorical columns stay VARCHAR
  gate: false
- name: 'Distillation: categorical training data enrichment'
  given: the DuckDB ENUM documentation and real-world categorical patterns
  when: generating training data for the categorical type
  then: training examples include common ENUM patterns (status codes, rating scales, boolean-like, country lists) that improve model accuracy on categorical columns
  gate: false
- name: ENUM only when safe
  given: a column classified as categorical but containing free-text or high-cardinality values
  when: I run finetype load
  then: the column stays VARCHAR — ENUM is only applied when the distinct values form a closed set
  gate: false
specs: []
relations: []
references:
- https://duckdb.org/2021/11/26/duck-enum
