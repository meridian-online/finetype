feature: Synthetic data generation
as_a: data analyst, developer, or AI agent
i_want: to generate realistic sample values for any type in the taxonomy
so_that: I can create test fixtures, validate pipelines, and explore type definitions with concrete examples that pass FineType's own validation
goal: 100% generator-taxonomy alignment with locale-specific generation; MCP `generate` is the public surface, CLI subcommand is maintainer-internal training tooling
maturity: established
scenarios:
- name: Per-type sampling via MCP (public surface)
  given: an AI agent connected to the FineType MCP server
  when: the agent calls the generate tool with a type key and sample count
  then: the MCP server returns realistic values that conform to the type's validation pattern — this is the public surface for FineType-aligned sampling
  gate: false
- name: Locale-specific generation
  given: a locale-specific type key
  when: samples are generated for geography.address.postal_code.EN_CA
  then: generated values conform to the Canadian postal code format (ANA NAN)
  gate: false
- name: Bulk training-data synthesis (maintainer-internal)
  given: the training pipeline
  when: scripts/prepare_multibranch_data.py invokes finetype generate via cargo run
  then: bulk NDJSON is emitted for use by the training loop — the CLI subcommand is hidden from end users since faker libraries cover general fake-data needs better
  gate: false
- name: Generator-taxonomy alignment
  given: the full taxonomy
  when: the maintainer runs finetype check (hidden subcommand)
  then: every type with a generator produces values that pass its own validation pattern — 100% alignment
  gate: false
