feature: MCP server for AI agents
as_a: developer integrating AI agents with data pipelines
i_want: to expose FineType's type inference to AI agents via Model Context Protocol
so_that: agents can profile, classify, validate, and generate data without CLI wrappers
goal: 8 tools and taxonomy resources over stdio transport, fully wired to multi-branch pipeline
maturity: established
scenarios:
- name: Start MCP server
  given: FineType is installed
  when: I configure my MCP client to launch finetype mcp as a stdio subprocess
  then: an MCP server starts with 8 tools and taxonomy resources available
  gate: false
- name: Profile a file via MCP
  given: a running MCP server
  when: an agent calls the profile tool with a file path or inline CSV data
  then: column types are returned as JSON with a markdown summary
  gate: false
- name: Browse taxonomy as resources
  given: a running MCP server
  when: an agent reads finetype://taxonomy or finetype://taxonomy/{domain}
  then: the full or domain-filtered taxonomy is returned as a browsable resource
  gate: false
- name: Generate synthetic test data
  given: a running MCP server
  when: an agent calls the generate tool with a type key
  then: representative sample values are returned for that type
  gate: false
specs:
- .orbit/specs/2026-03-07-mcp-server/
- .orbit/specs/2026-03-25-multi-branch-pipeline-integration/
relations: []
references:
- README.md
- CLAUDE.md
- crates/finetype-mcp/src/
notes: []
