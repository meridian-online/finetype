feature: Status / order_id misclassification fixes
as_a: data analyst running profile→validate on transactional CSVs
i_want: the model to predict `representation.discrete.status` for order-state / payment-state / account-state columns, and `representation.discrete.identifier` (or equivalent) for prefix-shaped order IDs
so_that: validate doesn't reject 100/100 rows in two of the most common transactional column shapes — the discovery vehicle for iter-4 (`ecommerce_orders.csv`) currently rejects every row in `status` (predicted `datetime.component.periodicity`) and every row in `order_id` (predicted `finance.securities.sedol`)
goal: 'Two-dataset misclassification mechanism — status family resolves to status/categorical (not periodicity); prefix-shaped IDs resolve to identifier (not SEDOL). Closes the 200-reject overhang in `ecommerce_orders.csv` after iter-4''s amount widening (63 → 0 on total_price). Fix path is training-data-side: status-family generator widening, SEDOL generator tightening, identifier generator addition; ships with the next model retrain (post-v19).'
maturity: planned
scenarios:
- name: Order-state status column classifies as status, not periodicity
  given: a column named `status` whose values are e-commerce / order-state enums (`shipped`, `pending`, `delivered`, `returned`, `cancelled`)
  when: I run `finetype profile -f data.csv -o json-schema | finetype validate -f data.csv --schema -`
  then: the column is classified as `representation.discrete.status` (or the closest canonical equivalent — categorical with status-shape semantics), NOT `datetime.component.periodicity`. Validation passes ≥99% of rows.
  gate: false
- name: Account-state and payment-state columns also resolve to status
  given: a column with values like `active`/`suspended`/`closed` (account state) or `authorized`/`captured`/`refunded`/`failed` (payment state)
  when: I run profile and validate
  then: the column resolves to a state-typed categorical, not periodicity, regardless of header (`account_state`, `payment_status`, `state`). The training-data widening must cover the broader status family, not just order states.
  gate: false
- name: Order-id prefix-shaped column classifies as identifier, not SEDOL
  given: a column named `order_id` (or `transaction_id`, `invoice_id`, `payment_id`, etc.) whose values follow `<PREFIX>-<DIGITS>` shape (`ORD-00001`, `INV-99999`, `TXN-12345`)
  when: I run profile and validate
  then: the column is classified as `representation.discrete.identifier` or a prefix-shaped-identifier sibling, NOT `finance.securities.sedol`. Validation passes ≥99% of rows. (SEDOL's regex `^[B-DF-HJ-NP-TV-Z0-9]{6}[0-9]$` correctly rejects `<PREFIX>-<DIGITS>`; the misclassification is at the model layer, not the validator.)
  gate: false
- name: SEDOL generator tightens — distilled rows match the strict regex
  given: the existing SEDOL training-data generator under finetype-core
  when: the generator is reviewed against the canonical SEDOL regex
  then: every distilled SEDOL row matches `^[B-DF-HJ-NP-TV-Z0-9]{6}[0-9]$`. Generator-output ↔ validator alignment becomes a passing precondition (covered by `finetype check`-equivalent gate). The hypothesis is that the SEDOL value-branch is currently weakened by over-emission of prefix-shaped 7-char codes that don't match the regex; tightening the generator should improve SEDOL precision without retraining the existing prefix-shape feature.
  gate: false
- name: End-to-end discovery-vehicle round-trip passes
  given: the trained-then-promoted model with status family widening + SEDOL generator tightening + identifier generator addition + retrain
  when: I re-run profile→validate on `eval/datasets/csv/ecommerce_orders.csv`
  then: 'total rejects drop from 263 (iter-4 post-amount-widening: 100 status + 100 order_id + 63 — wait, 63 closed by iter-4 amount widening, so 200 post-iter-4) to ≤2 (rejects allowed only on genuine data quality issues, not classifier/validator misalignment). The dataset moves from F-grade to A/B-grade in `finetype validate`''s grading rubric.'
  gate: false
