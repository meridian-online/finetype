id: 0018-dataset-provenance-registry
feature: Dataset provenance registry — snapshot every contributing dataset with verifiable integrity
as_a: FineType maintainer reproducing or auditing a model version
i_want: a canonical index of every dataset that contributes to training or evaluation, with per-file SHA256 + size + fetched-date, so I can answer "which bytes produced this model" without spelunking through scripts and download caches
so_that: model versions become bit-reproducible from declared inputs, drift on a vendored dataset is detected before it silently changes a training run, and adding a new source (GeoNames now, others later) follows one documented pattern instead of ad-hoc per-dataset glue
goal: One registry file pointing at one per-source snapshot file per dataset, with tooling to register a new source and verify an existing one. The existing `eval/datasets/sources.yaml` (role manifest for train↔eval leakage) is extended, not replaced — adding the missing integrity fields (snapshot pointer, local path, file SHAs/sizes) so leakage tracking and reproducibility live in one place.
maturity: emerging
scenarios:
- name: Register a newly fetched dataset
  given: a dataset has been downloaded to a local path
  when: the maintainer runs scripts/dataset_register.py <name> <local_path>
  then: a snapshot JSON is written under eval/datasets/snapshots/, sources.yaml is updated with the snapshot pointer + integrity fields, and the entry is ready to be referenced by a training/eval pipeline
  gate: false
- name: Verify integrity before a long-running training run
  given: a registered dataset
  when: the maintainer (or a launcher script) runs scripts/dataset_verify.py <name>
  then: every file recorded in the snapshot is re-hashed and matched; the command exits non-zero on any mismatch, missing file, or extra file with a precise drift report
  gate: false
- name: Training manifest references the snapshot
  given: a training launcher (e.g. overnight_v21_geography.sh) consumes a registered dataset
  when: the run writes its FTMB manifest
  then: the manifest records the snapshot filename + SHA256-of-the-snapshot for each dataset consumed — full chain back to bytes on disk for the v21 model artefact
  gate: false
- name: Adding a new dataset is procedural, not ad-hoc
  given: a new external dataset (e.g. OSM streets) becomes a training source
  when: the maintainer follows datasets/README.md
  then: registration + snapshot creation + sources.yaml entry follow one pattern; no per-source script glue is needed in the launchers
  gate: false
specs:
- .orbit/specs/2026-05-24-dataset-provenance-registry/
relations: []
references:
- .orbit/choices/0056-train-eval-leakage-prevention.yaml  (existing sources.yaml — extended, not replaced)
- eval/datasets/sources.yaml  (existing role manifest — receives the new integrity fields)
notes:
- Driven by author observation 2026-05-24 — corpus pass evidence showed v20 didn't close ac-04 because the YDF-confidence assumption was structurally biased against the dominant miss class; the v21 pivot to GeoNames-as-training-source surfaced that we have no consistent provenance pattern across Sherlock + GitTables + CLDR + (now) GeoNames. Generalised before the v21 spec consumes it.
