feature: Semantic type detection
as_a: data analyst
i_want: to classify text values into precise semantic types from a taxonomy spanning 7 domains (datetime, representation, technology, identity, finance, geography, container)
so_that: I know exactly what each column contains — not just 'string' or 'number' but ip_v4, iso_8601, email, credit_card_number — and can transform it safely
goal: '201/227 (88.5%) with sherlock-v11+Sharpen. Next target: 215+/227 (~95%) via retraining for remaining 26 model-level misclassifications (hint/threshold ceiling reached at 201)'
maturity: established
scenarios:
- name: Single value classification
  given: a text value of unknown type
  when: I run finetype infer -i '192.168.1.1'
  then: FineType returns technology.internet.ip_v4 with a confidence score
  gate: false
- name: Column-level disambiguation
  given: a column of ambiguous values like 2024, 2025, 2026
  when: I classify the column with its header
  then: FineType uses the header text, value distribution, and 36 deterministic features to disambiguate (year vs postal_code vs product_sku)
  gate: false
- name: Column-level inference
  given: a column of values with a header
  when: I run column-level classification
  then: a single forward pass per column produces the type — the model considers character patterns, value embeddings, statistical features, and the header together
  gate: false
- name: Confidence-aware output
  given: any classification result
  when: the model produces a prediction
  then: a confidence score accompanies the label, enabling downstream filtering on prediction quality
  gate: false
