id: 2026-05-23-ydf-specialist-geography
goal: Turn m-19's diagnostic output into a self-improving loop. The 61,068 corroborated `training_data_addition` clusters (ac-09 output, ~378,131 distinct columns) are the obvious source — but right now they're a static list. A geography-first extractor that pulls `(Sense-missed, YDF-confident-in-geography)` columns and emits them as training rows would lift Sense's geography precision in v20 without manual labelling. Demonstrate on geography (where author observation 2026-05-23 already noted YDF picks up `geography.address.full_address` reliably); if the v20 corpus pass shows a measurable lift in the geography mechanism cells, scale the pattern to other domains.
cards:
- 0017-ydf-specialist-geography
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Geography training-data extract produced.

    `scripts/extract_ydf_specialist_training_data.py --domain geography` emits
    `eval/gittables/v20_training_candidates/geography.tsv` with rows
    `(file_path, column_name, sample_values, ydf_prediction, ydf_confidence,
    sense_prediction, candidate_target_label, row_hash)`.

    (Column `sense_prediction` is the neutral name — whether Sense or YDF is
    correct in the disagreement is the *purpose* of the extract, not its
    premise. Renamed from `sense_prediction_missed` per cycle-2 finding 5.)

    Row filter:
      - YDF predicts a `geography.*` type with confidence ≥ `--min-confidence`
        (default 0.7 — preliminary; revisit after ac-04 observation).
      - Sense's prediction is either non-geography or a domain-sibling within
        geography.

    Circular-precision guard (addresses the mislabelled-email bucket flagged
    in cycle-1; cue list grounded in Sense source per cycle-2 finding 1):

      - The cue list is derived from
        `crates/finetype-model/src/column.rs::header_hint()` (exact-match
        arms plus the substring matcher), restricted to cues that map to
        non-geography types.
      - The cue list is materialised at
        `eval/gittables/ydf_extract_cue_audit.tsv` with columns
        `(header_cue, sense_type, source_file, source_line)`, regenerated
        by `scripts/audit_sense_header_cues.py` (a small reader that
        greps `column.rs`).
      - The extractor loads this TSV at startup and uses it as its cue
        list. The extractor errors if the TSV is missing, if any embedded
        constant copy of the list drifts from the TSV (sha256 check), or
        if the audit script reports `column.rs` has changed since the TSV
        was generated.
      - Exclusion rule: a row is dropped if `column_name`
        case-insensitively matches a cue mapping to a non-geography type
        AND `ydf_prediction` is in the geography domain AND `sense_prediction`
        is non-geography (the cross-domain case where Sense's header read
        is load-bearing).
      - Count of rows excluded by this guard is emitted to stderr and
        recorded in `geography.extract_stats.json`.

    Path portability: `file_path` is stored relative to `$GITTABLES_ROOT`
    (the canonical root resolved at extract-time, matching the convention
    used by `gittables_corpus_pass.py`). Absolute paths are forbidden in
    the output TSV. The script errors if `$GITTABLES_ROOT` is unset or if
    absolute paths in `columns.parquet` do not resolve under it.
  gate: false
  checked: true
- id: ac-02
  description: |
    Leakage firewall — gittables training corpus declared and filtered
    before the extract is consumed by v20. Verifiable purely from
    artefacts produced inside this spec (per cycle-2 finding 3 — Path A:
    leakage check lives inside the extractor).

    Three pieces:

      1. `eval/datasets/sources.yaml` has a gittables entry with
         `role: train` declared before `geography.tsv` is written. The
         same file (or a paired entry) declares
         `eval/gittables/holdout_paths.txt` as `role: eval` (or
         `both-forbidden`).
      2. The extractor reads `holdout_paths.txt` and filters out rows
         whose `file_path` is in the holdout set. The exclusion count is
         emitted to stderr (must be > 0 for the current geography corpus
         per the cycle-1 review's 16-file overlap observation, unless the
         upstream `columns.parquet` changes).
      3. The extractor imports `scripts/eval_leakage/__init__.py`'s
         `row_hash(header, value)` to compute one row hash per emitted
         row (joining the per-row hashes into a per-column `row_hash`
         field — concrete scheme documented in the extractor module
         docstring). It then joins these hashes against
         `eval/row_hashes.tsv` itself; if any overlap, the script errors
         and writes a non-zero-overlap report. If overlap is zero, it
         writes
         `eval/gittables/v20_training_candidates/geography.leakage.json`
         with `{overlap_count: 0, eval_hashes_checked: N, geography_rows_emitted: M}`.

    Close evidence: the committed `geography.leakage.json` showing
    `overlap_count: 0`, plus the `sources.yaml` diff.

    No dependency on `prepare_multibranch_data.py --dry-run` (that path
    was rejected in cycle 2 — the script's `--dry-run` does not currently
    accept arbitrary TSV input and emits stdout rather than the asserted
    JSON artefact).
  gate: false
  checked: true
- id: ac-03
  description: |
    Extract is consumable by the existing v20 training pipeline — no
    bespoke flag (revised post-implementation per author pushback —
    the cycle-2 split half a).

    Resolution: the extractor emits
    `eval/gittables/v20_training_candidates/<domain>.distilled.csv.gz`
    in the sherlock_distilled schema (`final_label`, `sample_values`
    as JSON, `column_name`). The v20 launch concatenates this with the
    v19 `sherlock_distilled.csv.gz` and passes the merged file via
    the existing `--distilled` flag of
    `scripts/prepare_multibranch_data.py`. No new flag, no new loader,
    no new merge code — existing source-tracking, leakage filtering,
    and training-rows manifest all apply by default.

    Forensic provenance (file_path, ydf_confidence, sense_prediction,
    row_hash) lives in a sidecar `<domain>.provenance.tsv` that the
    training pipeline never reads — kept for audit only.

    Close evidence: the committed
    `eval/gittables/v20_training_candidates/geography.distilled.csv.gz`
    is byte-readable by the existing `load_distilled_columns()` in
    `scripts/prepare_multibranch_data.py:933`. Verified by direct
    function call producing N labelled columns. The v20 launch recipe
    is documented in the spec close note rather than a script — it is
    operator glue (concat then `--distilled`), not pipeline change.

    This AC blocks `spec.close` — `ac_type: code` — because emitting
    the consumable artefact is a code deliverable.
  gate: false
  checked: true
- id: ac-04
  description: |
    v20 retrain shows measurable geography lift on the next corpus pass
    (cycle-2 finding 2, split half b — observation).

    After v20 trains on `geography.tsv ∪ v19 training corpus` (per ac-03)
    and the full gittables corpus pass re-runs (via the m-19 pipeline at
    `scripts/test_corpus_pass_reproducibility.sh` or its successor),
    `eval/gittables/corpus_pass/report.md` Part 1 shows ≥ 20% reduction
    in row count, against the v19 baseline captured in m-19's
    `report.md`, in both target cells:

      - `reject_rate_ceil × format_diversity_path_b`, filtered to rows
        where `sense_prediction` is non-geography AND `ydf_prediction`
        starts with `geography.address.postal_code` or
        `geography.address.full_address` (the postal_code → full_address
        pattern from m-19's diagnostic).
      - `non_trivial_floor × misclassification`, filtered to rows where
        `ydf_prediction` starts with `geography.` (the missed-geography
        bucket).

    20% is a conservative falsifiable floor. If the v20 run hits the
    threshold on one cell but not the other, the AC partially closes and
    a follow-up spec investigates the asymmetry.

    Close evidence: a delta table in the post-v20 `report.md` showing
    the two cell counts at v19 vs v20, with the calculation noted in
    the spec close note.

    `ac_type: observation` — post-cutover empirical measurement of an
    external (v20) training run. Defers `spec.close` per METHOD.md band
    rules.
  gate: false
  checked: false
  ac_type: observation
- id: ac-05
  description: |
    Scale to second domain — the extractor generalises by `--domain`
    argument alone, with per-domain config externalised (cycle-2 finding
    4, Option B).

    Per-domain configuration (the cue list scope, the YDF prediction
    prefix filter, etc.) lives in
    `eval/gittables/ydf_extract_domain_configs.yaml`, not inside
    `scripts/extract_ydf_specialist_training_data.py`. The script reads
    the YAML at startup and selects the block matching `--domain`.

    Close evidence: running
    `scripts/extract_ydf_specialist_training_data.py --domain finance`
    (or `datetime`, or `identity`) produces
    `eval/gittables/v20_training_candidates/<domain>.tsv` with the same
    column schema (header line) as `geography.tsv`. `git diff
    scripts/extract_ydf_specialist_training_data.py` between the
    geography and second-domain runs shows zero changes. The YAML is
    touched (a new domain block added); no script under `scripts/` is.
  gate: false
  checked: true
