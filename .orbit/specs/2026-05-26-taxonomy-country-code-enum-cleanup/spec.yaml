id: 2026-05-26-taxonomy-country-code-enum-cleanup
goal: |
  Clean `geography.location.country_code.validation.enum` in
  `labels/definitions_geography.yaml` so it contains exactly the
  ~249 canonical ISO 3166-1 alpha-2 codes — no US state codes, no
  Canadian province codes, no duplicates. Restore the enum as the
  single source of truth for "is X a country code", remove the
  workaround skip-list shielding the YDF validation gate, and
  confirm every consumer behaves correctly after cleanup.

  Why now. Discovered 2026-05-26 while implementing v23 R26: the
  enum's tail (~82 entries) contains US state codes (AL, AK, AZ,
  CA, NY, TX, FL...), Canadian province codes (AB, BC, ON, QC,
  SK...), and duplicates. R26 worked around it by hardcoding a
  clean constant in `crates/finetype-model/src/country_code_enums.rs`,
  but R26 was reverted in commit `000b2cd` and that file no longer
  exists. Spec 2026-05-26-ydf-validation-gate dodges via
  `ENUM_SKIP_LABELS` in `scripts/apply_ydf_validation_gate.py`,
  falling back to the alpha-2 pattern. Both workarounds disappear
  once the enum is cleaned.

  Pillar link: Precision principle. The enum exists to
  meaningfully distinguish "is a country code" from "is not". An
  enum that says "AL is a country" — when AL is Alabama — is the
  opposite of precision. Every downstream consumer inherits that
  lie.

  Scope and constraints:
    - Infrastructure cleanup only. No model changes. No retraining.
      No new validation engine.
    - Behaviour change is strictly tightening — things that
      validated by accident (state codes as country codes) stop
      validating; nothing that should validate stops doing so. If a
      consumer test fails on cleanup, it was relying on
      contamination; fix it forward.
    - The cleaned enum is the single source of truth for the
      alpha-2 country code set. Whether the canonical list lives
      yaml-only or yaml + duplicated Rust constant is the
      load-bearing call inside ac-03 (file a MADR if duplicated).
    - `cargo test --workspace` passes before and after.

cards:
- 0002-semantic-type-detection
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Catalogue every consumer of
    `geography.location.country_code.validation.enum`.

    Grep for `validation.enum`, `enum_set`, country_code lookups
    across validator/schema/generator/MCP/eval/duckdb/scripts.
    Likely sites (verify, don't assume): `taxonomy.rs`,
    `validator.rs`, `generator.rs`, `finetype-mcp/src/json_schema.rs`
    + `tools/schema.rs`, `finetype-eval/src/bin/validate_corpus.rs`,
    `finetype-duckdb/src/validate.rs`, `apply_ydf_validation_gate.py`.

    For each: record (a) file + line, (b) what it does with the
    enum, (c) expected delta after cleanup (must always be
    "tightens — rejects state codes that previously validated").
    Anything that would loosen is a red flag — investigate before
    ac-03 lands.

    Close evidence: `consumers.md` in this spec folder.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-02
  description: |
    Audit every other `enum:` in `labels/definitions_*.yaml` for
    similar contamination.

    Method: `grep -nA 200 "enum:" labels/definitions_*.yaml`,
    then for each enum confirm member count + spot-check that
    members are canonical (e.g. `currency.code` exactly ISO 4217;
    `language.code` exactly ISO 639-1).

    Output: `enum_audit.md` listing every enum, expected canonical
    size + source, actual size, verdict (clean / contaminated /
    suspect). Look for: state/province codes in country enums,
    duplicates, deprecated members, non-canonical entries.

    If contamination beyond country_code is found: file follow-ups
    per ac-07; this spec stays focused on country_code.

    Close evidence: `enum_audit.md` exists.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-03
  description: |
    Clean `geography.location.country_code.validation.enum` to
    exactly the officially-assigned ISO 3166-1 alpha-2 codes
    (~249 entries; exclude user-assigned XX/XY, reserved, and
    deprecated codes).

    Source of truth decision (LOAD-BEARING — record in commit
    message): pick ONE of
      (a) yaml-only — taxonomy yaml is canonical; all consumers
          read it via Taxonomy.
      (b) yaml + Rust constant — duplicate as
          `crates/finetype-model/src/country_code_enums.rs`
          (resurrecting the file removed in commit `000b2cd`).

    Default (a) — single source of truth, fewer sync hazards.
    Choose (b) only if ac-01 surfaces a consumer that genuinely
    cannot load the taxonomy at use time. If (b), file a MADR
    documenting the duplication + the sync test that keeps yaml
    and Rust in lockstep.

    Derivation: hand-curated from an ISO 3166-1 reference
    (pycountry table or vendored snapshot). Do not take the
    existing enum's first 249 entries blindly — verify against
    the canonical source. Sort alphabetically.

    Close evidence: yaml diff shows the polluted tail removed;
    enum block count matches the verified canonical count;
    `cargo build --workspace` succeeds.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-04
  description: |
    Regenerate any artefacts that derive from the enum.

    From ac-01's consumer list: JSON Schema fixtures, MCP schema
    goldens, generator sample sets, `crates/finetype-cli/tests/
    cli_golden.rs`. Run the generator on country_code end-to-end;
    confirm output values are all canonical (no AL/CA/QC).

    Close evidence: goldens updated; `cargo test --workspace`
    passes.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-05
  description: |
    Remove `ENUM_SKIP_LABELS` from
    `scripts/apply_ydf_validation_gate.py` and re-run the gate
    against v22.

    Delete the frozenset and the skip branch in
    `build_validation_spec`. With the cleaned enum, the gate uses
    enum-membership for country_code and refuses
    team-abbreviation / exchange-code mislabels that the
    pattern-only path was letting through (alpha-2 pattern
    accepts `UT`, `FLA` shape; cleaned enum does not).

    Verification: re-run gate on
    `output/corpus-pass-v22/corpus_pass/columns.parquet`;
    country_code refusal count should go UP (the alpha-2 pattern
    accepts any 2-char uppercase string including `UT`, `OK`, `OR`
    — the cleaned enum rejects those because they aren't ISO
    country codes); record cell-2 delta vs pre-cleanup gated
    baseline.

    Close evidence: PR diff removes ENUM_SKIP_LABELS; delta
    captured in `output/ydf-validation-gate/
    country_code_cleanup_delta.md`.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-06
  description: |
    Regression test guarding against re-contamination.

    Extend `ac01_country_code_enum_validates_official_codes` in
    `crates/finetype-core/src/validator.rs` (or add a sibling):
      - assert enum size == verified canonical count;
      - assert REJECTS US state codes (`AL`, `AK`, `CA`, `NY`,
        `TX`, `FL`);
      - assert REJECTS CA province codes (`AB`, `BC`, `ON`, `QC`,
        `SK`);
      - assert ACCEPTS canonical codes (`US`, `GB`, `JP`, `DE`,
        `ZW`).

    The negative assertions are load-bearing — they fail today
    (the contaminated enum accepts AL, CA, etc.) and pass after
    ac-03.

    Close evidence: test added; fails on pre-cleanup yaml, passes
    on post-cleanup yaml.
    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-07
  description: |
    Triage ac-02's audit findings.

    If ac-02 surfaced contamination beyond country_code: file one
    follow-up spec per type under `.orbit/specs/` (attached to
    card 0002); leave a memory
    `taxonomy-enum-contamination-followups` listing them. If
    nothing else: append "audit clean" note to `enum_audit.md`.
    `ac_type: doc`.
  gate: false
  checked: false
  ac_type: doc
