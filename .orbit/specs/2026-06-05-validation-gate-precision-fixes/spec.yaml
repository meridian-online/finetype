id: 2026-06-05-validation-gate-precision-fixes
goal: Ship validation-as-veto in the profile path by fixing the format-brittle pattern validations and case-folding enum matching that the corpus-wide false-veto sweep surfaced, so profile checks its own answers against the data without any retraining.
cards:
- .orbit/cards/0002-semantic-type-detection.yaml
status: open
labels:
- precision
- validation-gate
acceptance_criteria:
- id: ac-01
  description: |
    Fix the format-brittle validations the false-veto sweep surfaced, widening each ONLY to real-world format variants (never to accept arbitrary input — Precision Principle holds). CRITICAL: widen the pattern AND the co-located length/range bounds together — a pattern fix alone leaves the rescued value vetoed by minLength/maxLength (verified: time.iso and hms_24h both carry fixed-length bounds that reject the very values this AC exists to rescue).
      - datetime.timestamp.rfc_3339: accept a colon-less `[+-]\d{4}` offset
        (`... -0800`) alongside `[+-]\d{2}:\d{2}|Z`. (format_string `%z`
        already round-trips both forms — no transform change needed.)
      - datetime.time.iso: pattern `\.\d{1,6}` (1-6 fractional digits, not
        exactly 6); relax minLength/maxLength from fixed 15 to span the now-
        valid range (min 10, max 15), or drop them since the pattern is exact.
      - datetime.time.hms_24h: optional fractional part `(\.\d+)?`; raise
        maxLength from 8 to cover the fractional form (keep minLength 8).
      - datetime.component.year: pattern `^\d{4}(\.0+)?$` to tolerate an
        integer-valued float (`1998.0`) — parquet stores integers as floats.
        (No length bounds on year; minimum/maximum 1000/2100 unaffected.)
    mdy_12h is DEFERRED, not fixed here: its 98% false-veto is the seconds- bearing form `06/30/2013 12:00:00 AM`, but its format_string `%I:%M %p` cannot round-trip seconds and strptime has no "optional :SS" — a seconds-bearing mdy_12h is a distinct canonical format. Filed as a taxonomy follow-up (note on this spec), out of scope for a regex widening. Generators pass (taxonomy generators, 100% alignment retained).
  gate: false
  checked: true
- id: ac-02
  description: |
    Make enum validation matching case-insensitive (Unicode case-fold). The jsonschema-rs-backed Rust validator (crates/finetype-core/src/validator.rs CompiledValidator) has NO case-insensitive enum flag, so the fix is scoped: case-fold ONLY the enum-membership comparison (fold both the enum set and the compared value for the enum check), leaving any co-attached `pattern` check byte-exact — lower-casing the raw input would corrupt pattern semantics. Mirror the same scoped fold in the eval gate's evaluate() (scripts/apply_ydf_validation_gate.py). The "only ADDS matches, never removes" property holds for the enum direction specifically. Unit test pins day_of_week (`thursday`->Thursday) and gender (`male`->Male). Sweep-measured wins: day_of_week 70%->19% veto, gender 22%->5%, continent 60%->53%.
  gate: false
  checked: true
- id: ac-03
  description: |
    Source the gender enums to reputable standards and add `references:` to both definitions (currently self-labelled "illustrative"):
      - identity.person.gender -> HL7 FHIR AdministrativeGender
        (male | female | other | unknown).
      - identity.person.gender_code -> ICAO Doc 9303 passport sex field
        (M/F/X) — the existing `^[MFX]$` pattern is already ICAO-correct, so
        the fix is aligning the description (which wrongly claims `O` is valid)
        to the pattern; AND add an ISO/IEC 5218 numeric variant
        (0 not-known / 1 male / 2 female / 9 not-applicable) for digit-coded
        columns. Matched case-insensitively per ac-02.
  gate: false
  checked: true
  ac_type: doc
- id: ac-04
  description: |
    Runtime/eval parity — the canonical gap this spec must close. The eval gate deliberately SKIPS length checks while the Rust validator ENFORCES them, so they disagree on exactly the ac-01 rescued values unless reconciled. Add a parity test that runs a FIXED fixture of the rescued values through both the Rust validator (live `finetype validate` / CompiledValidator) and the eval gate, and asserts IDENTICAL pass/fail. Fixture pins at minimum: `00:07:13.580` (time.iso), `01:03:29.000` (hms_24h), `1998.0` (year), `2020-03-19 15:34:31 -0800` (rfc_3339), `thursday`/`male` (enum case-fold). Reconcile whichever side is wrong (gate must honour length, or the validator's widened bounds must match) so the fixture passes on both.
  gate: false
  checked: true
- id: ac-05
  description: |
    Re-run the corpus-wide false-veto sweep (this session's agreement-column method over eval/gittables/corpus_pass/columns.parquet) before and after the fixes; record the per-validation veto-rate delta. Target: day_of_week, gender, component.year, time.iso, hms_24h, rfc_3339 each drop below a 10% false-veto rate on agreement columns, and NO previously-clean validation (veto<2%) regresses. (mdy_12h is expected to stay high — it is deferred per ac-01, and that is the correct, documented outcome.) Artefact under output/ (sanitised — no raw corpus values, per secret-scanner risk).
  gate: false
  checked: true
  ac_type: observation
- id: ac-06
  description: |
    Wire validation-as-veto into the live profile path. profile emits a per-column `validation_pass_rate` (fraction of sample values passing the predicted type's validation) and applies the veto at the canonical 50% threshold (matching ydf_prediction_gated): pass_rate < 0.5 => the predicted type is NULLed/flagged. SCOPE the HARD veto to audited-safe labels (the ~40 sweep-clean + the ac-01/02/03 fixed set); for the 152 types the sweep could NOT measure (too few agreement columns — same rare-type starvation as spec 2026-06-04), surface pass_rate as ADVISORY only (no hard NULL) until measurable. State the profile output-shape change and whether the veto is default-on. This is the gate-in-profile deliverable — the near-term precision win needing no retraining.
  gate: false
  checked: false
- id: ac-07
  description: |
    MADR choice record capturing the direction: validation is an ASYMMETRIC signal (reliable NO, unreliable YES — see memory validation-gate-asymmetry), so validation-as-veto ships in profile while value-level YES-disambiguation stays blocked on rare-type training data (spec 2026-06-04 INCONCLUSIVE). Records the case-fold-enums decision SCOPED to enum membership (not a universal case-insensitivity claim — co-attached patterns stay exact) and the standards-sourcing decision (FHIR / ICAO 9303 / ISO 5218).
  gate: false
  checked: false
  ac_type: doc
