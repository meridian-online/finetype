id: 2026-04-20-distilled-data-relabel-7-types
status: closed
goal: |
  Retrain sherlock to v17 on a corpus that combines v16's existing data with public-dataset distilled rows for user_agent and LOINC (with fallback to generator if no suitable dataset is found), improved synthetic generators for SWIFT BIC / CPT / Excel format / SSN (≥1000 unique values each, audited against v16 eval failures), and a YAML schema ENUM expansion for http_method (case variants). Promote v17 only if profile eval clears a scope-aware net-positive gate (v17 ≥ max(235/242, v16-baseline-at-corpus-freeze)). Release v0.6.18.
  N=1 email regression is NOT fixed by this spec — it stays tracked in .orbit/specs/2026-04-20-v16-n1-email-regression/ with its own discovery.
acceptance_criteria:
- id: ac-01
  description: |
    Per-type source loaders exist under output/distillation-v4/loaders/ for public-dataset types in the sourcing_table (currently user_agent and LOINC). Each loader is an independently runnable Python module that emits a per-type CSV with header [value,label] and canonical taxonomy labels. If the primary+secondary candidates in sourcing_table fail license/coverage review, the implementer invokes the fallback-to-generator clause, updates the sourcing_table via spec bump, and documents the decision in SOURCES.md.
- id: ac-02
  description: |
    Generator improvements for every type with sourcing_table.path == "generator" (currently SWIFT BIC, CPT, Excel format, SSN). Each generator meets the target unique-value count from sourcing_table AND implements every item in its `improvements_required` list.
- id: ac-03
  description: |
    output/distillation-v4/SOURCES.md exists and is consistent with the top-level `sourcing_table:` field in this spec. Every one of the 7 types has an entry; each entry reports its path (public_dataset / generator / schema_only), its source location (dataset URL + license, generator file path, or YAML file path), and any deviations from the sourcing_table (with spec-bump reference if a fallback was invoked).
- id: ac-04
  description: |
    scripts/prepare_multibranch_data.py consumes v4 per-type CSVs alongside v3 distillation and the improved generators. v3's rows for the 7 target types are NOT mixed with v4 data — v4 replaces them. `_DROP_DISTILLED_TYPES` at scripts/prepare_multibranch_data.py:867 is updated:
      Public-dataset types (user_agent, LOINC): REMOVED from the
        list — they now have real distilled data.
      Generator-path types (SWIFT BIC, CPT, Excel format, SSN):
        REMAIN in the list — they use generators, not distilled rows.
      http_method: REMAINS in the list — schema-only treatment.
- id: ac-05
  description: |
    scripts/validate_label_remap.py exists (new script) and runs before training. It traverses transitive chains in data/label_remap.json and fails if any label doesn't resolve to a canonical taxonomy key. Wired into the prep script or CI so it fails loud on unresolved labels. Scope is limited to chain traversal + canonical-key resolution — no taxonomy validation beyond that (that's `finetype check`'s job).
- id: ac-06
  description: |
    HTTP-method YAML schema — sub-AC (a) of 2. Update labels/definitions_technology.yaml L283-286 so both `enum` AND `pattern` enumerate all 27 case variants of the 9 HTTP methods: `GET Get get POST Post post PUT Put put DELETE Delete delete PATCH Patch patch HEAD Head head OPTIONS Options options TRACE Trace trace CONNECT Connect connect`. Do NOT use (?i) alone — enum exact-string matching defeats regex-only case handling.
    Also update SOURCES.md http_method entry with: (a) the schema change; (b) the documented cascade effect — retrain picks up a stronger validation-branch pass-rate feature; (c) language note: stop calling the validation branch a "filter" or "gate" in this codebase; it is a learned pass-rate feature.
- id: ac-07
  description: |
    HTTP-method CompiledValidator — sub-AC (b) of 2. Unit test in crates/finetype-core/src/validator.rs asserts `CompiledValidator::is_valid` returns true for all 27 case variants (GET, Get, get, POST, Post, post, … CONNECT, Connect, connect) and false for:
      - non-method strings: "GOAT", "SAN JOAQUIN", "PATROL"
      - mixed-case outside the 27 list: "gET", "POSt", "geT"
      - whitespace-contaminated: " GET", "GET ", "GET\n"
      - adjacent tokens: "GET /", "GET HTTP/1.1"
- id: ac-08
  description: |
    Decision 0049 amended in place. .orbit/choices/0049-preserve-synthetic-for-bad-distilled-types.md has an updated 'date-modified' header and a new '## Update 2026-04-2X' section noting: (a) public-dataset distilled data now exists for user_agent + LOINC; (b) SWIFT BIC / CPT / Excel format / SSN use improved generators; (c) http_method handled via YAML schema ENUM. Status remains `accepted`, NOT `superseded`.
- id: ac-09
  description: |
    3-seed sweep completes via scripts/sweep_v17.sh (adapted from sweep_v16.sh). Seeds 42, 43, 44 × 100 epochs each, fresh training. Output directories: `models/sherlock-v17-seed-42/`, `models/sherlock-v17-seed-43/`, `models/sherlock-v17-seed-44/`. Training gate: any checkpoint with val_acc < 88% is REJECTED (script exits non-zero); checkpoints with val_acc 88%–91.2% are RETAINED but flagged in progress.md for manual review before promotion. results.json + epochs.jsonl written per seed.
    **No-promotion branch:** If all 3 seeds' best val_acc fall below 88%, the spec halts. Implementer investigates (data corruption, label_remap break, config drift). v17 is not promoted; v0.6.18 is not released.
- id: ac-10
  description: |
    v16 baseline captured at corpus-freeze. The implementer runs `eval/profile_eval.sh` against sherlock-v16 at the moment output/distillation-v4/ is finalised (immediately before the sweep begins). Results written to .orbit/specs/2026-04-20-distilled-data-relabel-7-types/v16-baseline.md containing: (a) score x/242, (b) git SHA of eval/datasets/ + eval/schema_mapping.yaml at time-of-capture, (c) wall-clock timestamp, (d) finetype CLI version string. The same eval inputs are reused verbatim in ac-11.
- id: ac-11
  description: |
    Profile eval on all 3 seeds' best checkpoints, scored against the eval inputs pinned in ac-10 (NOT against drifted GT).
    **Winner selection:** winner = seed with highest profile-eval score (x/242). Ties broken by highest val_acc (from ac-09). Further ties broken by lowest seed number (42 > 43 > 44).
    **Promotion gate:** winner_score ≥ max(235, v16_baseline_score).
    **No-promotion branch:** if winner_score < max(235, v16_baseline), spec halts. Implementer documents in progress.md which seeds scored what, which per-column regressions drove the miss, and whether a data fix is worth pursuing before a v17.2 retrain vs deferring v17 entirely. v0.6.18 is NOT released.
    **Manual-review branch:** if winner's val_acc is in 88–91.2% AND profile eval passes the gate, promotion is gated on an explicit Hugh sign-off (NOT implementer self-attestation). The implementer pauses, posts the per-seed per-column eval diff + the winner's val_acc + training curves (from epochs.jsonl) as a comment on the promotion PR, and waits for Hugh's explicit "approve promote" reply. The approval (verbatim Hugh comment) is quoted in progress.md before ac-12 runs.
- id: ac-12
  description: |
    sherlock-v17 promoted per the CI-decouple flow (strict ordering):
    1. **HF upload first**: sherlock-v17/{model.safetensors,
       config.json, label_map.json} uploaded to
       meridian-online/finetype-model on HuggingFace and verified
       resolvable via `curl -fsI` before any PR is opened.
    2. **Same-PR workflow bump + symlink flip**: a single PR
       (a) bumps FINETYPE_CI_MODEL to sherlock-v17 in
       `.github/workflows/ci.yml` and `.github/workflows/release.yml`,
       AND (b) flips `models/default` symlink to sherlock-v17.
    3. **CI drift-check silent**: the drift-check job from the
       CI-decouple spec emits no ::warning:: in the PR run.

    **Rollback rule**: if ac-13 (tag push + release workflow) fails after ac-12 is merged, the implementer opens an immediate revert PR restoring models/default → sherlock-v16 AND FINETYPE_CI_MODEL → sherlock-v16 in both workflows. Rationale: while the release tag/binaries are broken, keeping the symlink on a model that has no corresponding release creates downstream install-path ambiguity. The revert PR is merged before any retry of ac-13.
- id: ac-13
  description: |
    v0.6.18 released: Cargo.toml workspace version bumped 0.6.17 → 0.6.18; tag v0.6.18 pushed to main; GitHub release published with 5-platform binaries; Homebrew tap auto-bumped. eval/eval_output/report.md refreshed with v17 winner numbers from ac-11.
- id: ac-14
  description: |
    MADR files committed for the surfaced decisions:
      (a) Per-type sourcing policy — public datasets OR generators,
          not restricted registries; sourcing_table is the spec's
          single source of truth.
      (b) http_method via YAML-schema ENUM-only, enumerating 27 case
          variants (not (?i) regex). Documents the 3-surface cascade.
      (c) Scope-aware eval gate — max(235/242, v16-at-corpus-freeze).
      (d) Training gate relaxed — 88% catastrophic floor with
          88–91.2% manual-review band.
    Each MADR references this spec.
