id: 2026-04-16-v13-retrain
status: closed
goal: |
  Retrain multi-branch model (v13) with improved training data quality, expanded validation patterns, rebalanced class distribution, and increased validation branch capacity. Target: ≥210/227 label accuracy (92.5%+) on profile eval.
acceptance_criteria:
- id: ac-01
  description: |
    P1a: Remove state_code→country_code remap from data/label_remap.json. Create geography.location.state_code taxonomy type in labels/definitions_geography.yaml with: title, description, designation (locale_specific), validation pattern, validation_by_locale (US, CA, AU at minimum), generator, format_string, and transform.
  ac_type: code
- id: ac-02
  description: |
    P1b-d: Filter mislabeled distilled rows. Drop all distilled rows for SSN (3 rows, all mislabeled). Drop all distilled rows for user_agent (4 rows, all mislabeled). Filter phone_number distilled rows to keep only those with actual phone-format values (drop year ranges like "1985 - 1987"). Filter postal_code distilled rows to keep only those matching numeric or known alphanumeric postal code patterns (~4 of 34 rows are clean).
  ac_type: code
- id: ac-03
  description: |
    P2: Add missing validation patterns to taxonomy definitions. Add http_method validation (exact match: GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, CONNECT, TRACE). Add user_agent validation (must contain known UA prefix like Mozilla/, curl/, python-requests/, etc.). Add latitude range validation (value in [-90, 90]). Tighten geohash validation (minimum length 6, or character distribution check, or negative pattern for non-geohash strings).
  ac_type: code
- id: ac-04
  description: |
    P3a: Cap distilled rows per type at 600 in the training data pipeline. Types with more than 600 distilled rows are randomly sampled down to 600. Types with fewer than 600 are unaffected. Cap is applied before the 70/30 blend ratio.
  ac_type: code
- id: ac-05
  description: |
    P3b: Add hard-negative mining for latitude vs decimal_number. Generate synthetic decimal_number examples specifically in the [-90, 90] range with non-geographic headers (e.g., "error", "score", "depth", "rating", "percentage"). These augment the existing decimal_number training data.
  ac_type: code
- id: ac-06
  description: |
    P4a: Increase validation branch hidden dimensions from [128, 64] to [192, 128]. Set in v13 config.json only — do NOT change MultiBranchConfig code defaults (valid_hidden stays [0, 0] for backward compat with older models). Merged dim changes from 1006 to 1070. Merge hidden layer sizes may need adjustment to accommodate the larger input.
  ac_type: code
- id: ac-07
  description: |
    P4b: Add per-branch gradient norm monitoring to the training loop. After each epoch, compute and log the L2 gradient norm for each branch (char, embed, stats, header, validation). Add a branch_gradient_norms field to EpochMetrics with #[serde(default)] for backward compatibility with existing results.json files. Type: Option<HashMap<String, f32>> or HashMap with serde(default). These are written to results.json alongside existing metrics.
  ac_type: code
- id: ac-08
  description: |
    Training run: Train v13 with all P1-P4 changes applied. 50 epochs, 1200 columns/type, 70/30 blend, Metal backend. Model saved to models/sherlock-v13/ with config.json, model.safetensors, results.json, and type_index.json.
  ac_type: code
- id: ac-09
  description: |
    Eval run: Run profile eval against v13 model on all 35 datasets (227 columns). Generate eval report. Target: ≥210/227 label accuracy (92.5%+).
  ac_type: code
