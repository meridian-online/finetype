id: 2026-06-18-representative-accuracy-gate
goal: 'Freeze the panel-adjudicated uniform-random representative sample into a standing eval fixture (sibling to gold) and wire it into the promotion scoreboard as an ADVISORY band, so every candidate''s headline reflects production-representative data — not just the curated-hard gold slice — before promotion. Eval infrastructure only: no model or rule ships.'
cards:
- 0020-honest-production-typing
- 0019-human-verified-gold-corpus
status: closed
labels:
- eval-infrastructure
- representative-baseline
- honest-typing
acceptance_criteria:
- id: ac-00
  description: |
    SETTLE THE FIXTURE'S TRUTH TIER + ADVISORY-BAND POLICY (doc, design-critical, BLOCKING).
    Two decisions must come from the existing substrate (output/representative-baseline/
    {finding.md, panel_labels.json, repr_predictions.tsv}), not fiat:
    (a) TRUTH TIER — the 250 columns are blind-Sonnet-panel labelled with two blind-Opus
        adjudicators on the 88 disagreements (78 model-lost-on-merits); there is NO author
        tier for most. Decide whether the frozen fixture ships at this panel/adjudicated tier
        (consistent with gold's `llm-2panel` tier) and whether any subset needs author
        confirmation before it can carry a promotion signal. STATE THE LIMIT: representative
        labels are softer truth than gold's author tier, so the fixture measures a BAND
        (0.680–0.688 adjudicated; raw-panel CI 0.587–0.705), not a point.
    (b) ADVISORY BAND — define the band semantics precisely: the representative headline is
        REPORTED alongside gold at every promotion, and an advisory FLAG (never a block) fires
        when a candidate's representative headline drops beyond the fixture's CI (~±6pp at
        n=250) vs the v19 baseline. STATE WHY ADVISORY, NOT BLOCKING: 250 columns cannot
        separate marginal candidates without false alarms; gold + corpus-honest stay the
        blocking gates (promotion order 0095, H05 unchanged).
    DELIVERABLE: the tier decision + the band definition + the explicit non-blocking rationale,
    written so a future promotion knows exactly what the representative number does and does not
    authorise.
  gate: true
  checked: true
  ac_type: doc
- id: ac-01
  description: |
    FREEZE THE REPRESENTATIVE FIXTURE (config). Turn the one-shot study into a standing fixture
    in the gold mould: a single canonical TSV (e.g. `eval/repr/representative_corpus.tsv`) with
    per-column (file_content_sha256, column_name, label, truth-tier/provenance string, taxonomy
    version) for the ~250 scored columns. Membership is the DETERMINISTIC uniform-random draw
    the study documents (same seed/method, non-trivial columns only, matching gold's scope) so
    the fixture is reproducible, not a frozen accident. Append-only provenance like gold.
    LEAKAGE FIREWALL: extend the gold guard (`make leakage-guard`,
    scripts/audit_gold_anchor_leakage.py + eval_leakage/) — or a representative sibling — so no
    fixture column leaks into training data; the guard must be green.
    DELIVERABLE: the committed fixture TSV + a reproducible build/migration step + leakage-guard
    green over it.
  gate: false
  checked: true
  ac_type: config
- id: ac-02
  description: |
    SCORE IT WITH THE GOLD INSTRUMENT (code). Wire the representative fixture into
    score_gold_anchor.py (or a thin sibling that reuses its predict/score core) so
    `predict | score --reframe` runs against it identically to gold — same ~8-value
    sample-consistency contract (the harness feeds `sample_values_truncated`; do NOT read full
    columns — memory `full-column-stat-sharpen-is-redundant`), same reframe collapse, same
    per-type table + one headline. Re-baseline the shipped v19 under this path.
    DELIVERABLE: the scored representative report + the v19 headline. Per ac-00, the fixture
    ships at PANEL tier, so the correctness check is a clean end-to-end reproduction of the
    raw-PANEL number (≈0.648 legacy; recompute the exact figure under --reframe and record it) —
    NOT the adjudicated 0.680–0.688 band, whose per-column flips were never persisted. If the
    reproduced panel number drifts from ≈0.648, find the discrepancy before banking it
    (2026-06-17 over-read discipline). NOTE: the existing gold scorer reads the fixture unchanged
    if it mirrors gold's schema (file_content_sha256, column_name, curated_label, provenance) —
    all 260 repr columns resolve in columns.parquet — so this is invocation + recording, no new
    scoring code unless a sibling entry-point is cleaner.
  gate: false
  checked: true
- id: ac-03
  description: |
    ADD THE REPRESENTATIVE BAND TO THE PROMOTION ORDER (doc). Update the promotion scoreboard
    (CLAUDE.md "Promotion order (0095)" + docs/RELEASE.md) so the sequence reads:
    gold-anchor (efficacy) → drift proxy (pre-train) → gold + rare-type scoreboard + REPRESENTATIVE
    (advisory) → corpus-honest (blocking, H05) → swap. Place the representative band explicitly as
    ADVISORY per ac-00, and name what it adds that the others cannot: gold is curated-hard, the
    drift proxy measures distribution-not-correctness, the corpus-honest gate measures relocation
    on rare labels — none of them measures accuracy on a uniform-random production column.
    DELIVERABLE: the documented promotion order with the representative band placed, its advisory
    role and CI caveat stated, so the scoreboard is self-describing for the next promoter.
  gate: false
  checked: true
  ac_type: doc
- id: ac-04
  description: |
    PROVE THE FIXTURE EARNS ITS KEEP (observation, BLOCKING). The fixture is only worth its
    maintenance if it carries signal the curated instruments do not. Score at least two
    available candidates on BOTH gold and representative under the same scorer — the shipped v19,
    and the identity-fortification retrain (sherlock-v22-boundary-relu-s44, NO-GO'd on gold
    2026-06-18) as the natural control — and report whether the representative band moves
    INDEPENDENTLY of gold or merely tracks it. Either outcome is a real finding, stated honestly:
    (a) if representative diverges (a candidate holds gold but drops representative, or vice
        versa), the fixture adds detection gold alone lacks — its purpose is proven;
    (b) if the two move together on every available candidate, say so — the fixture is then a
        cheaper-to-trust corroborator, not a unique detector, and the advisory framing (ac-00) is
        the honest ceiling on its authority.
    DELIVERABLE: the both-instruments table over the candidates + the verdict on independent
    signal. STATE what is measured vs assumed (a clean divergence may simply not exist yet among
    today's candidates; do not manufacture one).
  gate: true
  checked: true
  ac_type: observation
closed_at: 2026-06-18T10:13:15.14564Z
