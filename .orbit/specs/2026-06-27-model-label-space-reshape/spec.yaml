acceptance_criteria:
- id: ac-0
  description: |
    Design pinned (the cede-set + the exclusions + the recovery audit). Enumerate
    the model-predicted leaves whose validator is structurally conclusive /
    closed-set (the CEDE-SET: isbn, mac, message_id, ip_v4/v6, email, utc-offset,
    iso_seconds/iso_milliseconds, ethereum_address, …). Pin the EXCLUSION list —
    open-vocab over-emitters that must NOT be ceded (city, entity_name, username,
    numeric_code; guardrail 1). For EVERY cede-set leaf, confirm a shipping
    deterministic recovery path (Sharpen rule / validator / fast-path) so recall
    is recovered, NOT lost. Output: the explicit cede / keep / exclude partition.
  gate: true
  checked: true
  ac_type: doc
- id: ac-1
  description: |
    Build the reduced-label-space training data: filter the cede-set out of the
    model's training label vector (COLUMN_LEVEL_TYPES / the label construction in
    scripts/prepare_multibranch_data.py). Round-trip verified: n_classes drops by
    |cede-set|, every dropped leaf has a live recovery validator (ac-0 audit), and
    NO excluded open-vocab leaf was removed.
  gate: false
  checked: true
- id: ac-2
  description: |
    LOAD-BEARING MEASUREMENT — does the reshape clear the retrain NO-GO blocker?
    Run a single-seed potion retrain on the reduced label space; score the
    corpus-honest OVER-EMIT band vs the current 244-label model. DELIVERABLE: do
    the synthetic/format-leaf over-emit triggers (isbn collapse, currency_code
    3.2×, si_number 2.5×, …) VANISH because the model can no longer emit those
    leaves? A clear over-emit-band improvement is the go/no-go for the whole
    reshape.
  gate: false
  checked: false
  ac_type: observation
- id: ac-3
  description: |
    Gold + composed PARITY of the reduced-label model vs the shipped default,
    judged by the gold-adjudicated relocation review (choice 0104), NOT a
    corpus-honest GO (structurally unpassable by any retrain). Ship the reshape
    only if composed holds within CI AND ac-2's over-emit band clears. Re-fit the
    model-coupled Tier-B vetoes against the new model before scoring.
  gate: false
  checked: false
  ac_type: observation
- id: ac-4
  description: |
    ABSTAINING-HEAD DE-RISK PROBE (cheap; KILL-SWITCH before any full build). On
    the frozen static encoder, train a single-seed coarse family head + a
    per-column abstain probe. DELIVERABLE: are the over-tighten misses (56% of
    Sense error, 249/445) SEPARABLE in the shared trunk? If separability is absent
    the gate falls to the hierarchical-head failure mechanism — STOP, do not build
    the full head.
  gate: false
  checked: false
  ac_type: observation
- id: ac-5
  description: |
    IF ac-4 shows separability — build the abstaining loose-vs-tight gate (commit
    -to-leaf vs stay-loose, latency-neutral on the same encoder). Measure composed
    PASS-THROUGH (NOT raw Sense — composed is rule-bound and Sharpen already owns
    loose-vs-tight, latitude 0.18→1.00). Ship only if it beats the rule baseline
    on COMPOSED, not merely on raw Sense. Numeric value-range features may feed the
    abstain GATE only — never the flat softmax or the 27-stat trunk (cdist 0.316).
  gate: false
  checked: false
  ac_type: observation
- id: ac-6
  description: |
    Behaviour-neutral wins banked alongside: (a) delete the choice-0107-blessed
    orphan legacy modules that still compile (standalone CharCnn minus
    HierarchicalHead/HierarchyMap, char_training, tiered{,_training}, model.rs
    TextClassifier, training.rs legacy Trainer, CharCnn loaders) — gold
    no-regression gated (card 0019 scenario 5); (b) A/B dual→single potion encoder
    (−20–40ms) and the validation-branch ablation INSIDE the reshape retrain —
    ship each only if composed ties within CI.
  gate: false
  checked: false
- id: ac-7
  description: |
    Record the division of labour as a MADR choice: coarse model on open-vocab
    semantics + broad shape; cede the closed/format/checksum tail to
    Sharpen+validators. This is the decision the whole reshape depends on — surface
    to the owner. Amend H05's role for model swaps (gold-adjudicated relocation
    review, as choice 0104 did for s43) so the reshaped model can actually ship.
  gate: false
  checked: false
  ac_type: doc
