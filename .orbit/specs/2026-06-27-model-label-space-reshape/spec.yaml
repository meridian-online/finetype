id: 2026-06-27-model-label-space-reshape
goal: |
  Reshape the Sense model to its real, reduced job: keep it on open-vocabulary
  semantics + broad shape (the things only a learned model can do, and which the
  Sharpen layer structurally cannot), and CEDE the closed/format/checksum tail to
  validators that are correct-by-construction. The marquee accuracy bet on top is
  an abstaining loose-vs-tight head — de-risked with a cheap separability probe
  BEFORE any full build. Bank the behaviour-neutral speed/simplicity wins
  regardless.

  ## The thesis (why this, and why now)

  Composed accuracy is carried by Sharpen, not the model. Three independent
  retrains lifted raw Sense +4–7pp and moved composed ZERO (memory
  `composed-is-rule-bound`: gte 0.502→0.571, per-value attn 0.522→0.561, both
  composed-tied). So the model's job is SMALLER than its 240/244-leaf label space
  pretends. Its fine, value-determinable tail (checksums, closed validators,
  format-exclusive leaves, synthetic-generator types) is not where it adds value —
  it is where it MANUFACTURES the corpus over-emission that NO-GOs every fresh
  retrain (isbn collapse, currency_code 3.2×, user_agent 7.2×, si_number 2.5×).
  This session's gold work is the same signal at the column level: of 47
  re-adjudication candidates, the 28 KEPT were nearly all the model over-emitting
  `entity_name`/`alphanumeric_id`.

  Removing the validator-ownable leaves from the model's TRAINING label space is
  simplicity AND accuracy at once: it strips FP mass without losing recall,
  because the deterministic recovery path already ships (timezone_abbreviation,
  the 3 plain_text types, the iso-second leaves all recovered in Sharpen while the
  model stays 240-dim). The UNRUN experiment is excluding the EXISTING
  model-predicted format/checksum leaves and measuring whether the corpus
  over-emit NO-GO — the only blocker stopping a fresh retrain from shipping —
  clears.

  ## Two precise guardrails (both are real traps — do NOT cross)

  1. **Cede only CLOSED-vocabulary / validator-ownable leaves.** Do NOT extend the
     drop to open-vocab over-emitters (`city`, `entity_name`, `username`,
     `numeric_code`): vocabulary CLOSURE, not semantics, is what makes a leaf
     cede-able (memory `specialiser-is-the-abstaining-witness`: city AUC 0.987 /
     R@P.90 0.000). No validator can own them; ceding loses recall with no
     recovery. These stay the model's job — they are the retrain-negatives target
     (t-000133e418), not a label-space drop.
  2. **Do NOT merge `word`+`plain_text` into one TRAINING class.** The residual is
     itself a softmax attractor; the cure was SHRINKING residual mass 44%→25%
     (gte-tiny rebuild), so merging re-trips the over-emit band that rebalance
     cleared. The reframe stays a SCORING-only collapse (choice 0102).

  ## Why this is not a re-skin of a dead-end

  - NOT the hierarchical-domain head (gold 0.685 vs flat 0.718): a tree softmax
    still FORCES a leaf at every level; the abstaining gate adds the
    "nothing tighter fits" DECISION both flat and tree softmax structurally lack.
  - NOT a coarser-label-space TRAIN-SPEED play: the head is a small MLP on frozen
    embeddings, softmax width is negligible compute (the retired-240 trap). The
    win is accuracy/division-of-labour, not training wall-clock.
  - NOT an additive hard-negative retrain (0-for-6): this REMOVES leaves, it does
    not add hard negatives into a flat softmax.
  - NOT a residual merge (guardrail 2).

  ## Honest scope

  The leaf-drop is an OPEN BET — it needs a single-seed retrain to confirm the
  over-emit triggers vanish AND composed holds (gold-adjudicated relocation review
  per choice 0104, NOT a corpus-honest GO, which is structurally unpassable by any
  retrain). The abstaining head is a HIGHER-RISK bet with two load-bearing
  unknowns (recover-vs-relocate in the shared trunk; composed pass-through, since
  Sharpen already owns loose-vs-tight) — gated behind a cheap separability probe
  that can kill it before a 3-seed burn. The dead-code deletion and the
  encoder/branch ablations are the only behaviour-neutral safe wins.

  Substrate: workflow survey `wf_e68a56d0-90b`; memories `composed-is-rule-bound`,
  `specialiser-is-the-abstaining-witness`, `categorical-is-a-residual-category`,
  `sense-stage-ceiling-and-free-latency-wins`. Provenance/reasoning:
  `interview.md`.
