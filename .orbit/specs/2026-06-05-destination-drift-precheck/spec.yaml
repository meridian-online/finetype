acceptance_criteria:
- id: ac-01
  description: |
    Full-label-space drift report. A script diffs two Sense-distribution
    snapshots (baseline vs candidate) and emits EVERY label whose prediction
    count moves beyond a band — both an absolute floor and a relative multiple —
    ranked by magnitude, not a pre-registered watch subset. Normalises for
    differing total_cols between snapshots (use rate, not raw count). Run on the
    existing sense_dist_v19_clean.json vs sense_dist_v24_clean.json, it must list
    geography.coordinate.latitude among the top movers (the signal the old watch
    block missed).
  gate: false
  checked: true
- id: ac-02
  description: |
    Cheap proxy-train protocol. A documented, scripted fast proxy trains on a
    candidate hard-negative blend and produces a full-distribution snapshot
    without the full 3-seed 50-epoch overnight cost. Single seed, reduced epochs
    (calibrate the epoch floor against ac-03 — enough to surface drift, no more).
    Record proxy wall-clock as a fraction of the full overnight run; target
    ≤ ~20%. The proxy reuses the existing prepare/train scripts
    (scripts/overnight_v24_numeric.sh as template), parameterised, not forked.
  gate: false
  checked: false
- id: ac-03
  description: |
    Retro-calibration against both paid-for failures. Run the proxy (ac-02) +
    drift report (ac-01) on the v23 candidate blend AND the v24 candidate blend.
    The check must FLAG v23's representation.discrete.categorical explosion AND
    v24's geography.coordinate.latitude explosion — a true positive on both. For
    each, record the proxy's drift magnitude against the known full-run magnitude
    (does a cheap proxy preserve the ranking, even if it understates the size?).
  gate: false
  checked: false
  ac_type: observation
- id: ac-04
  description: |
    Band calibrated to separate signal from noise. Set the absolute + relative
    thresholds so the v23 and v24 explosions trip the gate (ac-03) AND a
    negative control does NOT — v19-vs-v19 different-seed snapshots, where any
    movement is sampling noise, must produce a GO (no label flagged). Document
    the chosen thresholds and the margin between the worst noise mover and the
    band.
  gate: false
  checked: true
- id: ac-05
  description: |
    Gate wired + instrument adopted. (a) The pre-check emits an explicit GO /
    NO-GO with the drifted-label list, runnable before a full overnight run is
    launched. (b) The Sense-distribution snapshot's hand-picked `watch` block is
    superseded by (or augmented with) the full-label-space drift report as the
    canonical collateral instrument. (c) CLAUDE.md / the retrain runbook document
    the proxy pre-check as a mandatory step ALONGSIDE the existing post-train
    Sense-distribution check — the post-train check stays mandatory; the proxy
    pre-check is the cheaper early gate, not a replacement.
  gate: false
  checked: false
  ac_type: doc
