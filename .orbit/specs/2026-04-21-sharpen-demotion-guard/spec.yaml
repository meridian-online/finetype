goal: >
  Add a validator-confirmed demotion guard to `disambiguate_categorical`
  in crates/finetype-model/src/column.rs that preserves a named-type
  prediction when every non-empty sampled value passes the named type's
  validator AND the validator is precise (enum-constrained OR regex
  whose anchored body genuinely constrains the character set, length,
  or structure — not `^.+$`, not `^[A-Za-z0-9_]+$`, etc.). Ships the
  fix for `excel_format` identified in the validator-signal-attribution
  discovery; does not require a retrain; narrow Sharpen-layer change.

constraints:
  - "Narrow scope. Only `disambiguate_categorical` (column.rs:3881) is modified. Other Sharpen rules (attractor demotion, header_sharpen, value_sharpen's other branches) are untouched in this spec. Broader generalisation is explicitly out of scope and belongs in a follow-up card if evidence warrants."
  - "No retrain. Must ship without retraining any model. The change is Sharpen-layer only — no touches to crates/finetype-model/src/multi_branch.rs, validation_features.rs, or training code."
  - "Precise-validator gate is mandatory. `all values pass` alone is insufficient — discovery evidence shows 25+ types simultaneously return pass_rate=1.000 on short strings (http_method values). The precise-predicate is defined at ac-01 and exercised against a real-taxonomy audit at ac-01b."
  - "No regression on previously-passing eval columns. Full `profile_eval.sh` is the gate, not a narrow 2-column test. Any column that passes on the baseline (re-run on the same pre-patch commit, per ac-05) and fails post-patch is a blocker."
  - "MADR 0059 is required and must be in `proposed` status before ac-02 begins implementation. It moves to `accepted` only after ac-05 (full eval) verifies no regression. This prevents the decision register from degenerating into post-hoc rubber-stamping."
  - "`http_method` is out of scope for a code fix. Discovery found its demotion path is different (best hypothesis: pre-Sharpen sibling-context enrichment). If the full-eval re-run shows http_method is still demoted to categorical, progress.md documents the evidence and a follow-up card is opened — not patched in this spec."
  - "Public API unchanged. `disambiguate_categorical`'s signature stays the same. The guard is an internal pre-check at the top of the function that returns the current label unchanged when fired."
  - "Non-empty value semantics pinned: `!s.trim().is_empty()` is the filter used by the guard. The guard operates on the `values` slice as-passed by the caller — no re-sampling."
  - "Rollback/tightening branch is explicit: if ac-05 shows `regressions > 0`, implementation tightens the `is_precise()` predicate (adds rejected patterns) and re-runs the eval. If no tightening reaches `regressions == 0` without losing the `excel_format` fix (ac-04), the spec is paused, a follow-up discovery card is opened, and MADR 0059 remains `proposed`. The spec does not ship a known-regression change."

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      A new method `Validation::is_precise(&self) -> bool` is added to
      crates/finetype-core (on the `Validation` struct — NOT on
      `CompiledValidator`, which has discarded the raw pattern/enum by
      the time it's constructed). The method inspects the raw
      `pattern` and `enum_values` fields on `Validation` and returns
      `true` when EITHER:
        (a) `enum_values.is_some() && !enum_values.as_ref().unwrap().is_empty()`, OR
        (b) `pattern.is_some()` AND the pattern is anchored (starts
            with `^` and ends with `$`) AND the pattern's body (between
            the anchors) is NOT in the rejected set. The rejected set
            contains, at minimum:
              `.+`, `.*`, `\S+`, `\S*`, `\w+`, `\w*`,
              `[A-Za-z0-9]+`, `[A-Za-z0-9_]+`, `[A-Za-z0-9 ]+`,
              `[A-Za-z0-9_\-\.]+`, `[\w\s]+`, `[\w]+`, `[\s]+`,
              `.{0,N}` / `.{1,N}` for any N
            These are patterns that match essentially arbitrary short
            identifiers and would cause guard-fire on loose validators.
            The predicate is implemented as a string-equality check
            against a checked-in constant list in the defining module;
            regex-parsing is NOT required.
      Returns `false` for validations with neither enum nor pattern.
      Unit-tested in the same module.
    verification: "Unit tests in the defining module cover at minimum: (a) Validation with non-empty enum → true; (b) pattern=`^[A-Z]{2}$` → true (anchored, bounded, restricted class); (c) pattern=`^.+$` → false; (d) pattern=`^\\S+$` → false; (e) pattern=`^\\w+$` → false; (f) pattern=`^[A-Za-z0-9_]+$` → false (rejected alphanumeric-id pattern); (g) pattern=`^[A-Za-z0-9 ]+$` → false; (h) Validation with only min/max length (no enum, no pattern) → false; (i) pattern=None and enum=None → false. All pass via `cargo test -p finetype-core dgd_ac01` (tests are prefixed per metadata.test_prefix; the earlier `is_precise` filter string was stale and matches zero tests)."

  - id: ac-01b
    ac_type: code
    description: >
      A one-time taxonomy audit exercises `Validation::is_precise()`
      against EVERY definition in `labels/definitions_*.yaml`. The
      audit emits a sorted TSV under
      `.orbit/specs/2026-04-21-sharpen-demotion-guard/precise_audit.tsv`
      with columns `(type_key, has_enum, pattern, is_precise)`. The
      audit is implemented as a Rust integration test
      (`cargo test -p finetype-core --test precise_audit -- --nocapture`)
      so it re-runs on CI and the TSV is regenerated (diffable in PRs).
      In addition, at least 3 real taxonomy patterns sampled from the
      TSV's `is_precise=false` rows are included as explicit assertions
      in ac-01's unit tests (concrete patterns, not synthetic
      examples), to anchor the predicate against the real dataset.
    verification: "File exists at .orbit/specs/2026-04-21-sharpen-demotion-guard/precise_audit.tsv; contains one row per taxonomy type (240 rows, +/- 1); has at least 1 row with is_precise=true AND at least 1 with is_precise=false; is regenerated by running `cargo test -p finetype-core --test precise_audit -- --nocapture`. ac-01's test module contains at least 3 assertions whose input patterns appear verbatim in the TSV."

  - id: ac-02
    ac_type: code
    description: >
      A demotion guard is added at the top of `disambiguate_categorical`
      in crates/finetype-model/src/column.rs (near line 3881). Before
      the existing demotion logic runs, the guard checks: (a)
      `taxonomy.get_validation(current_label).is_some()`; (b) that
      validation returns `true` from `is_precise()`; (c) every value in
      the `values` slice whose `s.trim().is_empty()` is `false` passes
      the validator via `is_valid()`. When all three hold, the function
      returns the current `(label, confidence)` unchanged (skipping
      demotion). When any fails, the existing demotion logic runs as
      before. The guard operates on the `values` slice as-passed — no
      re-sampling, no re-trimming beyond the non-empty filter. MADR
      0059 must exist in `proposed` status before this AC begins
      implementation.
    verification: "Code review: inspect disambiguate_categorical's entry point; confirm the guard is the first branch after the function's preamble and that it returns the current (label, confidence) unchanged when fired. Confirm no changes outside the function body. Confirm the existing demotion logic still runs when the guard is bypassed. Confirm the non-empty filter is spelled `!s.trim().is_empty()`. `cargo build` succeeds with zero warnings in finetype-model."

  - id: ac-03
    ac_type: code
    description: >
      Unit tests in `column.rs` tests module cover the four guard
      branches: (a) precise validator + all values pass → guard fires,
      returns current label; (b) precise validator + some values fail →
      guard doesn't fire, existing demotion runs; (c) imprecise
      validator + all values pass → guard doesn't fire; (d) no
      validation for current label → guard doesn't fire. Test function
      names use the spec's `test_prefix` (see metadata) — e.g.
      `test_dgd_ac03_guard_fires_precise_and_all_pass`.
    verification: "Run `cargo test -p finetype-model dgd_ac03` — four new tests pass. Each test is a pure function-level test over constructed input; no end-to-end pipeline required."

  - id: ac-04
    ac_type: gate
    description: >
      Targeted END-TO-END behavioural test — `finetype profile` on
      `eval/datasets/csv/coverage_closure_phase_ab.csv` for the
      `excel_format` column NO LONGER returns
      `representation.discrete.categorical` after ALL Sharpen layers
      run. A demotion guard can only PRESERVE the raw multi-branch
      top-1 label; it cannot PROMOTE a wrong top-1 to a right label.
      For this column the raw model predicts `representation.text.word`
      (see eval-artefacts/changes.tsv post-value), so the guard fires
      on text.word's precise validator and preserves it. This AC proves
      the end-to-end effect of the guard: the canonical failure case no
      longer demotes to `categorical`. Closing the remaining label gap
      (`text.word` → `file.excel_format`) is a promotion problem —
      out of scope for this spec (MADR 0059) and tracked for a
      data-quality follow-up.

      AMENDED v1.2 (2026-04-21) — Original verification expected the
      CLI to emit `representation.file.excel_format`. Implementation
      evidence (progress.md Assumption Reversal section +
      eval-artefacts/changes.tsv) showed this was inconsistent with
      the raw model's behaviour documented in the discovery's own
      findings.md: the raw multi-branch returns `text.word`, not
      `excel_format`. The guard preserves raw top-1 — promotion is a
      different problem. Verification amended to match observable
      evidence.
    verification: "From repo root: `FINETYPE_MODEL=models/default cargo build --release -p finetype-cli && ./target/release/finetype profile --file eval/datasets/csv/coverage_closure_phase_ab.csv -o json | jq -e '.columns[] | select(.column==\"excel_format\") | .type | . != \"representation.discrete.categorical\"' > /dev/null` exits 0. Command tests the CLI's final output, inclusive of all Sharpen layers. The expected post-patch label is `representation.text.word` (raw multi-branch top-1) — documented under eval-artefacts/changes.tsv."

  - id: ac-05
    ac_type: gate
    description: >
      Full regression eval — `./eval/profile_eval.sh` on the 448-row
      expanded manifest produces: (a) label accuracy ≥ pre-patch
      baseline (297/352 on the implementation branch's merge base with
      main); (b) domain accuracy ≥ pre-patch baseline; (c) zero
      regressions on previously-passing columns per the delta script.
      **Baseline MUST be re-run on the implementation branch's merge
      base with main** — stale baselines from earlier in the sprint are
      rejected. Both profile_results.csv files (pre and post) are
      attached under
      .orbit/specs/2026-04-21-sharpen-demotion-guard/eval-artefacts/
      with filenames `profile_results.pre.csv` and
      `profile_results.post.csv`. The `excel_format` column appears as
      a fix. `http_method` may appear unchanged — see ac-06.

      Delta-script contract (v1.2 amendment, 2026-04-21) — the
      originally-pinned `scripts/eval_delta_by_coverage.py --pre/--post
      --json | jq '.regressions'` contract turned out not to exist:
      the script on `main` is a single-snapshot reporter, not a
      pre/post differ, and has no `--json` mode. Rather than amend the
      sprint script (out of scope — this spec is Sharpen-layer only),
      the AC's regression count is computed by
      `.orbit/specs/2026-04-21-sharpen-demotion-guard/eval-artefacts/compute_regressions.py`,
      which implements the same label-match logic
      (schema_mapping.yaml + manifest join) and writes
      `regressions.tsv`, `improvements.tsv`, `changes.tsv`, and
      `summary.txt` alongside the pre/post CSVs. A regression is a
      (dataset, column) pair where pre matched ground truth and post
      did not. Contract: `summary.txt` line 1 must read `regressions: 0`.
    verification: "Run `git merge-base HEAD main` to identify the baseline commit. Check out the baseline, run `FINETYPE_MODEL=models/default ./eval/profile_eval.sh eval/datasets/manifest.csv`, save `profile_results.csv` as `profile_results.pre.csv`. Return to the implementation HEAD, re-run, save as `profile_results.post.csv`. Run `uv run --with pyyaml python3 .orbit/specs/2026-04-21-sharpen-demotion-guard/eval-artefacts/compute_regressions.py` — `summary.txt` line 1 must read `regressions: 0`. Attach both CSVs + TSVs + summary.txt to the PR."

  - id: ac-06
    ac_type: doc
    description: >
      `progress.md` contains an `## http_method outcome` section with:
      (a) the exact observed label and confidence returned by
      `finetype profile --file eval/datasets/csv/coverage_closure_phase_ab.csv`
      for the `http_method` column post-patch; (b) a named next step
      — one of {`no action — rescued`, `follow-up card opened at <path>`,
      `no action — evidence logged for future spec`}. AC passes IFF
      both (a) and (b) are present; it does NOT pass on section
      existence alone. This gates documentation quality, not just
      structural presence.
    verification: "Read progress.md; locate the `## http_method outcome` heading; confirm a verbatim label string is recorded (e.g., `technology.internet.http_method (0.62)` or `representation.discrete.categorical (0.37)`) AND a next-step decision is named with one of the three allowed values (or a variant following the same shape)."

  - id: ac-07
    ac_type: doc
    description: >
      MADR 0059 `demotion-guard-over-promotion` is committed under
      .orbit/choices/. Status starts `proposed` (before ac-02 begins);
      moves to `accepted` after ac-05 verifies no regression. References:
      (a) the validator-signal-attribution discovery findings; (b)
      MADR 0058 (whose follow-up this supersedes in direction); (c)
      MADR 0051 (http_method enum-only, the decision that framed the
      original promotion hypothesis). Rejects the originally-proposed
      `categorical → named_type` promotion rule in favour of a
      `named_type → categorical` demotion guard, citing the discovery
      evidence. Also records the rollback contingency (see constraints)
      so the decision is honest about downside branches.
    verification: "File exists at .orbit/choices/0059-demotion-guard-over-promotion.md, follows the MADR template in global CLAUDE.md, status field progresses proposed → accepted across this spec's commits, and is referenced by both spec.yaml (metadata) and the final PR description."

ontology_schema:
  name: "DemotionGuard"
  description: >
    The predicate and action of preserving a named-type prediction
    against Sharpen demotion when validator evidence confirms the
    prediction.
  fields:
    - name: "current_label"
      type: "string"
      description: "The top-1 label entering disambiguate_categorical (e.g. representation.file.excel_format)."
    - name: "validation_exists"
      type: "bool"
      description: "Whether taxonomy.get_validation(current_label) returns Some."
    - name: "validation_is_precise"
      type: "bool"
      description: "Whether Validation::is_precise() returns true (enum-constrained OR anchored regex with non-rejected body)."
    - name: "all_values_pass"
      type: "bool"
      description: "Whether every value with !s.trim().is_empty() returns true from validator.is_valid()."
    - name: "guard_fires"
      type: "bool"
      description: "validation_exists AND validation_is_precise AND all_values_pass. When true, disambiguate_categorical returns unchanged."

evaluation_principles:
  - principle: "Precision over permissiveness"
    weight: 0.40
    description: "The guard must not fire for loose validators. A false-positive guard (preserving a wrong label) is worse than a false-negative (wrongly demoting). The taxonomy audit at ac-01b is the evidence check against this principle. Aligns with CLAUDE.md Precision Principle."
  - principle: "No regression"
    weight: 0.35
    description: "Full eval must show zero regressions on previously-passing columns, measured by a pinned delta-script contract (ac-05). Baseline re-run on the same commit — stale baselines invalidate the gate."
  - principle: "Narrow blast radius"
    weight: 0.15
    description: "Only `disambiguate_categorical` is modified. Surface of change is small and auditable."
  - principle: "Evidence preservation"
    weight: 0.10
    description: "`http_method` evidence is documented even when not fixed (ac-06 gates on a recorded outcome + named next step). Future specs build on this spec's observations."

exit_conditions:
  - "All 8 ACs pass (ac-01, ac-01b, ac-02, ac-03, ac-04, ac-05, ac-06, ac-07)."
  - "No regression on previously-passing eval columns (ac-05 delta script output `.regressions == 0`)."
  - "MADR 0059 accepted (post-ac-05 verification)."
  - "If ac-05 regresses and tightening the precise-predicate cannot reach `regressions == 0` without losing the excel_format fix (ac-04), the spec is PAUSED and a follow-up discovery card is opened — NOT shipped with known regressions."
  - "PR description references the discovery findings, MADR 0059, the taxonomy audit TSV, and both pre/post profile_results CSVs."

