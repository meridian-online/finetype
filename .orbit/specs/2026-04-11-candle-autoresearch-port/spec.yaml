goal: >
  Port 4 empirically validated architecture improvements from the PyTorch autoresearch
  session (80 experiments, 92.4%->96.6% val_accuracy) into the Candle multi-branch trainer
  AND inference crates. Retrain on Mac with Metal, validate via profile eval, publish to
  HuggingFace if >=160/190.

  The 4 improvements (from autoresearch progress.md):
  1. GELU activations replacing ReLU (+1.3pp)
  2. LayerNorm on all branch inputs (+0.4pp)
  3. Replace merge BatchNorm with LayerNorm (+0.4pp)
  4. Weight decay 0.01 (up from 1e-4) (+1.7pp with checkpointing)

  Additionally: learning rate 0.001 (10x increase from 1e-4 default). Warmup schedule
  deferred — Candle CosineScheduler has no warmup support; adding it is a separate change.

constraints:
  - "Production-scale config dimensions (sherlock-v5-scaled: [450,450]/[300,300]/[192,96]/[750,750]) — do not change hidden sizes"
  - "Two primary files: crates/finetype-train/src/multi_branch.rs (training) + crates/finetype-model/src/multi_branch.rs (inference)"
  - "Backward compatible via #[serde(default)] — old model configs load unchanged with ReLU+BatchNorm defaults"
  - "Header branch retained with real Model2Vec features (unlike autoresearch which removed it)"
  - "Mac Metal training — no cloud GPU (RunPod zombie protection not yet fixed)"
  - "Profile eval >=160/190 label accuracy to publish (current baseline: 155/190)"
  - "No regression in actionability eval (currently 99.9%)"
  - "Training config: model config with activation=GELU, use_layer_norm=true; train config with weight_decay=0.01, lr=0.001"

acceptance_criteria:
  # --- Model config (shared by train + inference) ---
  - id: ac-01
    ac_type: code
    description: "Add Activation enum (ReLU default, GELU variant) to both train and inference MultiBranchConfig with #[serde(default)]."
    verification: "Old configs deserialize without the field (ReLU default). New configs can specify GELU. Both crates have the enum."

  - id: ac-02
    ac_type: code
    description: "Add use_layer_norm bool field to both train and inference MultiBranchConfig with #[serde(default)] of false."
    verification: "Old configs deserialize without the field (false default). New configs can enable LayerNorm. Both crates have the field."

  # --- Training crate changes ---
  - id: ac-03
    ac_type: code
    description: "Replace hardcoded .relu() with configurable activation in training BranchWeights::forward and MultiBranchModel::forward_trunk."
    verification: "When activation=GELU, forward passes use .gelu(). When activation=ReLU, behavior unchanged."

  - id: ac-04
    ac_type: code
    description: "Add optional LayerNorm to all branch inputs (char, embed, stats) when use_layer_norm=true. Header branch already has input LayerNorm."
    verification: "BranchWeights::new_with_input_norm used for all branches when config.use_layer_norm is true."

  - id: ac-05
    ac_type: code
    description: "Replace merge BatchNorm with LayerNorm when use_layer_norm=true in training crate. Remove batch dimension squeeze/unsqueeze workaround."
    verification: "Merge trunk uses LayerNorm instead of BatchNorm when use_layer_norm=true. Old configs still use BatchNorm via default."

  # --- Inference crate changes ---
  - id: ac-06
    ac_type: code
    description: "Replace hardcoded .relu() with configurable activation in inference BranchWeights::forward and MultiBranchClassifier::forward_trunk."
    verification: "When activation=GELU, inference forward pass uses .gelu(). When activation=ReLU, behavior unchanged."

  - id: ac-07
    ac_type: code
    description: "Add optional input LayerNorm to inference BranchWeights. Load input_ln weights when present in safetensors."
    verification: "Inference BranchWeights supports optional input_norm. When model has use_layer_norm=true, all branches get input LayerNorm."

  - id: ac-08
    ac_type: code
    description: "Replace hardcoded merge BatchNorm with conditional LayerNorm/BatchNorm in inference crate based on config.use_layer_norm."
    verification: "When use_layer_norm=true, merge uses LayerNorm (no unsqueeze workaround). When false, BatchNorm as before."

  # --- Training config ---
  - id: ac-09
    ac_type: config
    description: "Update MultiBranchTrainConfig: weight_decay default 1e-4 -> 0.01, lr default 1e-4 -> 0.001."
    verification: "grep weight_decay shows 0.01, grep lr shows 1e-3 / 0.001 as defaults."

  # --- Tests ---
  - id: ac-10
    ac_type: code
    description: "Tests pass with both old-style (ReLU+BatchNorm) and new-style (GELU+LayerNorm) configs. At least one test explicitly creates a GELU+LN model and verifies forward pass shape and gradient flow."
    verification: "cargo test -p finetype-train succeeds. cargo test -p finetype-model succeeds. Test names include 'gelu' or 'layer_norm'."

  # --- Gates ---
  - id: ac-11
    ac_type: gate
    description: "Train new model on Mac with Metal using GELU+LayerNorm+weight_decay=0.01+lr=0.001 config."
    verification: "Training completes without error. Model artifact produced. Saved config.json contains activation=GELU and use_layer_norm=true."

  - id: ac-12
    ac_type: gate
    description: "Profile eval >=160/190 label accuracy with new model."
    verification: "make eval-report shows label accuracy >=160/190."

  - id: ac-13
    ac_type: gate
    description: "No regression in actionability eval."
    verification: "Actionability eval >=99% transform success rate."

  - id: ac-14
    ac_type: config
    description: "Publish new model to HuggingFace for DuckDB extension runtime download."
    verification: "Model downloadable from HuggingFace. DuckDB extension loads it successfully."

deliverables:
  - path: "crates/finetype-train/src/multi_branch.rs"
    description: "MultiBranchConfig additions (activation, use_layer_norm), forward pass changes, merge LayerNorm, training config defaults"
  - path: "crates/finetype-model/src/multi_branch.rs"
    description: "Inference-side MultiBranchConfig additions, BranchWeights input_norm, configurable activation, conditional merge LayerNorm/BatchNorm"
  - path: "models/sherlock-v6-gelu/"
    description: "Trained model artifact with new architecture"
  - path: "HuggingFace: meridian-online/finetype-model"
    description: "Published model for DuckDB extension"

evaluation_principles:
  - principle: "Profile eval accuracy"
    weight: 0.4
  - principle: "Train/inference parity (same activation, normalization, architecture)"
    weight: 0.3
  - principle: "Backward compatibility (old models still load)"
    weight: 0.2
  - principle: "Code simplicity (LayerNorm removes BatchNorm workaround)"
    weight: 0.1

exit_conditions:
  - "Profile eval >=160/190 and model published to HuggingFace"
  - "Or: 155 <= score < 160 — keep model artifact locally, do not publish. Document as incremental improvement for next iteration."
  - "Or: score < 155 (regression) — revert and investigate"

