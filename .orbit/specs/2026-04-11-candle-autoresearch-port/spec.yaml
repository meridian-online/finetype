id: 2026-04-11-candle-autoresearch-port
goal: |
  Port 4 empirically validated architecture improvements from the PyTorch autoresearch session (80 experiments, 92.4%->96.6% val_accuracy) into the Candle multi-branch trainer AND inference crates. Retrain on Mac with Metal, validate via profile eval, publish to HuggingFace if >=160/190.
  The 4 improvements (from autoresearch progress.md): 1. GELU activations replacing ReLU (+1.3pp) 2. LayerNorm on all branch inputs (+0.4pp) 3. Replace merge BatchNorm with LayerNorm (+0.4pp) 4. Weight decay 0.01 (up from 1e-4) (+1.7pp with checkpointing)
  Additionally: learning rate 0.001 (10x increase from 1e-4 default). Warmup schedule deferred — Candle CosineScheduler has no warmup support; adding it is a separate change.
