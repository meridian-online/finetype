id: 2026-03-24-sibling-context-multi-branch
goal: Wire sibling-context attention into multi-branch training and inference so the header branch sees cross-column context, improving type prediction accuracy
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: 'AC-1: FTMB v3 format implemented per format_spec — 28-byte header, table groups with sibling headers, column_index per record. Backward-compatible v1/v2 reading (single group, empty siblings).'
  gate: false
  checked: false
- id: ac-02
  description: 'AC-2: Data prep generates FTMB v3 with (a) synthetic table assembly using domain-based templates and (b) distilled table groupings recovered from Sherlock batch files.'
  gate: false
  checked: false
- id: ac-03
  description: 'AC-3: FrozenSiblingContext struct implemented in finetype-train — loads sibling-context model as constant tensors, runs frozen forward pass. MultiBranchDataset batches by table group, enriches header embeddings via frozen attention before feeding to header branch MLP.'
  gate: false
  checked: false
- id: ac-04
  description: 'AC-4: Multi-branch inference wires sibling context — classify_columns_with_context() no longer bypasses multi-branch. When multi-branch is active with sibling context, headers are enriched before classification.'
  gate: false
  checked: false
- id: ac-05
  description: 'AC-5: Single-value inference verified — `finetype infer -i ''alice@example.com''` produces valid label with no panic/NaN. N=1 attention pass produces near-identity enrichment via residual connection. Test with trained (not random) weights.'
  gate: false
  checked: false
- id: ac-06
  description: 'AC-6: Model trained with sibling context and evaluated on 190-column profile eval. Both raw multi-branch and post-processed (with existing disambiguation rules) scores reported.'
  gate: false
  checked: false
- id: ac-07
  description: 'AC-7: Ablation comparison — re-train on FTMB v3 data with sibling attention disabled (raw Model2Vec header_features used directly, no enrichment) as baseline. Compare against sibling-enriched model on same v3 data. Delta measures sibling signal contribution.'
  gate: false
  checked: false
