id: 2026-06-10-postal-header-veto
goal: 'First gold-gated precision patch: demote postal_code predictions on generic-integer columns whose header does not corroborate a postal code (mirror of the shipped coord veto, choice 0094 pattern) — kills the worst measured over-emitter (gold precision 0.133, 26 FP / 4 TP) without losing real postal recall; ships as 0.6.27 with a release.'
cards:
- 0014-profile-validate-precision
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Rule implemented: `header_hint_postal_veto` in apply_header_sharpen
    (crates/finetype-model/src/column.rs), additive early-return beside the
    shipped coord veto. Fires when label == geography.address.postal_code AND
    the header does not corroborate postal (token-aware: zip/zipcode/plz/cep/
    pincode tokens, postal/postcode substrings, post+code token pair) AND the
    sampled values are bare integers WITHOUT leading zeros (a leading zero is
    postal evidence — 01219-style zips must never be vetoed). Demotes to
    integer_number, confidence-capped, demotion-only (can never promote),
    RHH-disableable. Unit tests mirror the coord-veto trio (corroborates real
    postal headers incl. locale terms; rejects false friends like zipper/
    unzip; value gate blocks leading-zero and non-integer columns) plus an
    end-to-end veto + no-veto pair. B07 note: additive change inside one
    private method, signature unchanged; clippy + cargo test are the check.
  gate: false
  checked: true
- id: ac-02
  description: |
    Gold + scoreboard verdicts: on the gold corpus, postal FP count drops
    from 26 toward 0 with NO postal recall loss (support-4 recall stays 1.0)
    and the headline accuracy does not regress (the 26 ex-FPs should flip to
    correct integer_number, so headline should RISE ~+2.5pp); rare-type
    scoreboard run for cross-type sanity. Evidence committed under
    output/postal-veto/.
  gate: false
  checked: true
- id: ac-03
  description: |
    Corpus-honest gate POST check (blocking, H05): scripts/corpus_honest_gate.py
    on the ac-01 stratified sample, candidate = patched binary predictions,
    baseline = v19_gated oracle — must return GO. This is a Sharpen behaviour
    change, so the relocation detector is mandatory before any release.
  gate: true
  checked: true
  ac_type: observation
- id: ac-04
  description: |
    Ship: workspace version 0.6.27, CHANGELOG entry (user-experience framing:
    "FineType no longer calls your volume/count columns postal codes"), gold
    baseline doc updated with the post-patch number, spec note records the
    instrument verdicts. Second consecutive ship on the 0094 header-
    corroboration pattern — note in the choice that its acceptance is now
    de facto (two shipped vetoes), pending formal author review.
  gate: false
  checked: true
  ac_type: doc
- id: ac-05
  description: |
    /release binary 0.6.27 after green CI (tag + GitHub release workflow +
    Homebrew tap). No model publish — Sharpen-only patch, models/default
    unchanged.
  gate: false
  checked: false
  ac_type: ops
