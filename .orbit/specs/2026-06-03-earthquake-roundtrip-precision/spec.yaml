id: 2026-06-03-earthquake-roundtrip-precision
goal: |
  Make the earthquake demo round-trip cleanly on the shipping CLI so the stalled
  blog post can land. Today `finetype profile -> validate` on
  eval/datasets/csv/earthquakes_2024.csv yields Grade F / 0 valid rows / 46,447
  rejects — even when validated against its OWN generated schema. The profile
  assigns labels its own validator then rejects.

  ## Diagnosis (measured 2026-06-03, binary 0.6.22, local default model)

  Recall is already met; precision is the binding constraint.

  - non_trivial_pct = 1.00 — every one of 22 columns gets a real (non-catch-all)
    type, so recall against the "type everything VARCHAR" failure is fine.
  - reject_rate_non_trivial = 0.1494 — ~15x over the 0.01 target. Grade F.

  The rejects concentrate in a handful of misclassified low-cardinality columns,
  not a broad smear:
    - net, locationSource, magSource -> representation.scientific.measurement_unit
      (schema enum = SI units {meter, kilogram, ...}; values are network codes
      "ci"/"us"/"nc") -> 100% reject, ~14,132 cells each.
    - id -> geography.coordinate.geohash (pattern rejects the alphanumeric event
      ids) -> ~3,978 rejects.
    - place 67, gap 6 (long-tail).
  That is ~3.2 columns' worth of cells doing essentially all the damage.

  ## Approach (revised 2026-06-03 after reachability review)

  A training-data retrain will NOT safely fix this set. The two failure families
  here are both LOW-safety per the corpus reachability advisory (safety_score on
  corroborated_gaps.parquet): id -> geography.coordinate.geohash is safety 0.32,
  and net/locationSource/magSource -> representation.scientific.measurement_unit
  is safety 0.29 — both < 0.50, both with correct label discrete.categorical.
  These are exactly the categorical-target clusters that sank v23 (it ate ~48k
  geography columns to win them). So additive training is the wrong lever here;
  the safe routes are (a) a scoped value-based Sharpen demotion of geohash /
  measurement_unit when values are low-cardinality codes, per decisions
  0038/0048, or (b) a taxonomy/validator change. The HIGH-safety numeric clusters
  are carried separately by spec 2026-06-03-v24-numeric-precision; this set is NOT
  in that retrain's scope.

  scripts/roundtrip_metrics.sh + scripts/roundtrip_ab.py are the measurement
  harness (validated 2026-06-03 to track the gittables corpus: earthquake reject
  0.149 ~ sample 0.141). They gate whichever fix ships.

  ## Out of scope
  - Hand-editing earthquakes_2024.csv or its committed schema to mask the failure.
  - An additive training-data retrain on these LOW-safety families (carried by
    v24 only for the HIGH-safety numeric clusters, which this set is not).
