id: 2026-03-13-sense-mask-tracing
status: closed
goal: |
  Add permanent tracing instrumentation to the Sense→Sharpen column classification pipeline, then use the trace output to diagnose and fix the horizontalError misclassification (decimal numbers → boolean.initials). Two PRs: tracing first, bug fix second.
acceptance_criteria:
- id: AC-1
  description: |
    Add tracing::debug! at Sense prediction point: log column name, predicted category, confidence, entity subtype (if applicable).
- id: AC-2
  description: |
    Add tracing::debug! at vote aggregation point: log top 5 CharCNN votes with counts before any masking is applied.
- id: AC-3
  description: |
    Add tracing::debug! at mask application point: log which votes survived the Sense mask, which were removed, total masked-out fraction, safety valve decision (fired or not), and Sense confidence used in the threshold check.
- id: AC-4
  description: |
    Add tracing::debug! at header hint point: log which hint matched (if any), what label it proposed, whether it was accepted.
- id: AC-5
  description: |
    Add tracing::debug! at feature rules (F1–F6) point: log which rule fired, the feature values that triggered it, and the label change.
- id: AC-6
  description: |
    Add tracing::debug! at final result point: log final label, confidence, full disambiguation trail, detected locale.
- id: AC-7
  description: |
    Add --verbose / -v flag to profile and load CLI commands that enables debug-level tracing for the finetype-model crate without requiring RUST_LOG to be set.
- id: AC-8
  description: |
    All existing tests pass. No performance regression when tracing is not enabled.
- id: AC-9
  description: |
    Using trace output, identify the exact failure path for horizontalError: Sense category, confidence, votes before/after mask, safety valve decision.
- id: AC-10
  description: |
    Fix the misclassification so horizontalError is classified as decimal_number (or another numeric type), not boolean.initials.
- id: AC-11
  description: |
    Fix does not regress any other earthquake column or profile eval accuracy.
