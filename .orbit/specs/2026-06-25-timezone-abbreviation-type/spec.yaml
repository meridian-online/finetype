id: 2026-06-25-timezone-abbreviation-type
goal: |
  Mine the timezone-abbreviation type (EST/EDT/CEST/…) out of the
  representation.text.word + datetime.offset.iana residual and ship it the proven
  plain_text-discovery way: a taxonomy leaf with a precise closed-set validator,
  recovered deterministically in the Sharpen layer (structured_string_refinement
  playbook), with a small gold migration — NO retrain.

  ## Why this type, and why now (spec 2026-06-25-sharpen-stage-audit follow-up)

  The sharpen-stage audit's both-wrong triage surfaced timezone abbreviations as a
  clean, value-determinable type hiding in the residual. Breadth + precision
  measured during scoping (2026-06-25):

  | candidate | distinct datasets | gold cols | verdict |
  |---|---|---|---|
  | datetime.offset.timezone_abbreviation | 1,504 | 6 | BUILD — clears the >=1,000 bar |
  | technology.code xmldoc-ref (T:/M:…)   | 31    | 1 | REJECT — below the volume bar |

  The xmldoc-ref candidate is clean-and-nameable but 30x below the
  plain-text-discovery volume bar, so it is rejected exactly like unix/url-path and
  pos_tagged there; its 1 gold column stays plain_text (the honest residual).

  ## Why a Sharpen rule, not a retrain (settled, do-not-reopen)

  A timezone abbreviation is a CLOSED-SET, value-determinable type — a precise enum
  validator decides it. Per decision 0096 (residual/value-determinable facts are
  rule-shaped) and the 3 already-shipped plain_text types (windows_path/message_id/
  qualified_name, recovered via structured_string_refinement while the model stays
  240-dim), it is recovered in Sharpen, not predicted by the model. Retraining to
  add one deterministic type worth ~6 gold columns invites the 0-for-6 additive-
  retrain collateral (catastrophic forgetting, residual-attractor explosions) for
  zero benefit the rule does not already give free. Folding the leaf into the model
  is deferred to a future PLANNED retrain, never the trigger for adding it.

  ## Expected outcome

  ~+0.6pp gold (6 cols: 5 exchangeTimezoneShortName word->tz_abbrev + 1 TZ
  iana->tz_abbrev, the latter a mislabel correction since CST is an abbreviation,
  not an IANA name). Gold-clean only if the taxonomy add + Sharpen recovery + gold
  migration land together; the corpus-honest gate is the blocking relocation check.
  Honest scope: this is the diminishing-returns end of the rule/taxonomy lever the
  ceiling-discovery work predicted — small but real, low-risk, well-worn playbook.
