acceptance_criteria:
- id: ac-0
  description: |
    Volume + precision gate (DONE at scoping, 2026-06-25 — recorded here, confirm
    in the build). Corpus breadth measured over 6.59M corpus_pass columns:
    timezone-abbreviation = 1,507 cols / 1,504 distinct datasets (clears the
    plain-text-discovery >=1,000-distinct-dataset bar); xmldoc-ref = 31 datasets
    (REJECTED, below bar — stays plain_text). The validator is a CLOSED ENUM of the
    canonical abbreviations (EST EDT CST CDT MST MDT PST PDT AKST AKDT HST AST ADT
    CET CEST EET EEST WET WEST GMT UTC BST IST JST KST AEST AEDT ACST ACDT AWST NZST
    NZDT SAST WAT CAT EAT MSK ICT SGT HKT …). PRECISION PRINCIPLE: the abbreviations
    EST/CST/PST overlap non-tz uses (estimate/cost), so precision is carried by the
    RECOVERY gating (ac-2: residual-label-only + >=90% closed-set match + header
    corroboration), not by relaxing the enum. Build only the type that clears both
    bars (= timezone-abbreviation only).
  gate: false
  checked: true
  ac_type: doc
- id: ac-1
  description: |
    Build the leaf LIVE into the taxonomy: datetime.offset.timezone_abbreviation
    (sibling of datetime.offset.iana) — definition + closed-enum validation +
    generator arm in generator/datetime.rs + label_category_map entry (sorted).
    `finetype check` 100% (count bumps 244 -> 245), full workspace `cargo test`
    green, clippy clean. Count constants + CLAUDE.md + CHANGELOG updated. The model
    stays 240-dim and does NOT predict it (recovered in ac-2), exactly like the 3
    plain_text leaves.
  gate: false
  checked: true
- id: ac-2
  description: |
    Recover the type deterministically in Sharpen — extend structured_string_
    refinement (or a sibling rule) with timezone_abbreviation. CORROBORATION gate:
    fire only on the residual labels the discovery mined it from (word / plain_text
    / unknown / datetime.offset.iana when the values are abbreviations not IANA
    names). VETO-CONSISTENCY gate: assert only if >=90% of values pass the closed-
    enum validator. Header corroboration (timezone/tz/zone in the header) to blunt
    the EST=estimate / CST=cost overlap. Value-based (0048), RHH-disableable,
    ledgered in the deterministic-layer audit. Verify on the 6 gold columns +
    over-emission-safety on the estimate/cost negatives.
  gate: false
  checked: true
- id: ac-3
  description: |
    Gold migration — re-adjudicate the 6 affected gold columns to the new leaf with
    provenance (choice 0095 evolution policy; mixed-panel per spec 2026-06-16 or
    author override): 5x exchangeTimezoneShortName (word -> timezone_abbreviation),
    1x TZ (iana -> timezone_abbreviation, a mislabel correction — CST is an
    abbreviation, not an IANA zone). Append-only with per-row provenance; leakage
    unaffected.
  gate: false
  checked: true
  ac_type: doc
- id: ac-4
  description: |
    Promotion gate. Gold no-regression-or-lift (expect ~+0.6pp: the 6 migrated
    columns flip miss -> correct once recovered) on BOTH the shipped default
    (m2v8m-s43) and the attention model; corpus-honest gate GO (blocking, H05 — the
    relocation check on the 1,504-dataset tz population, confirming the recovery
    does not steal word/categorical columns). NO retrain in this spec. A GO ships
    the leaf + recovery + gold migration together; a corpus-honest NO-GO tightens
    the ac-2 gating (header corroboration / closed-set threshold) and re-gates.
  gate: true
  checked: false
  ac_type: observation
memories_considered:
- key: categorical-is-a-residual-category
  disposition: adopted
  reason: Anchors the no-retrain decision — a closed-set value-determinable type belongs in Sharpen recovery, not a flat-softmax output; retraining for it risks the residual-attractor collateral.
- key: catastrophic-forgetting-cure-is-train-time
  disposition: adopted
  reason: The 0-for-6 additive-retrain history is why this ships as a deterministic rule + taxonomy add rather than a retrain.
- key: cardinality-boundary-error-is-real
  disposition: adopted
  reason: Bounds the ambition honestly — this is the diminishing-returns end of the rule/taxonomy lever (~+0.6pp), not a ceiling break.
