id: 2026-06-18-fine-tuned-encoder-discovery
goal: 'Determine whether replacing FineType''s static Model2Vec encoder with a small, local, fine-tuned LM encoder can crack the semantic over-emission mass that every prior model-side bet left untouched — while staying offline, deterministic, and fast enough. Discovery only: measure the prize, the latency budget, the encoder headroom, and the attractor risk; ship no model. The lever is the SHARED REPRESENTATION (the one part the falsified head/context/additive bets never replaced), gated low-band-only by the shipped confidence band.'
cards:
- 0002-semantic-type-detection
- 0020-honest-production-typing
status: closed
labels:
- discovery
- architecture
- encoder
acceptance_criteria:
- id: ac-00
  description: |
    SIZE THE PRIZE + SET THE LATENCY BUDGET (observation+doc, ground-before-building, BLOCKING).
    Two numbers must be fixed before any model is touched:
    (a) THE PRIZE. Quantify the EXACT mass this lever targets — the semantic over-emission
        errors where the model invents a specific type on text that needs MEANING, not shape:
        the ~62 gold residual→specific misses (output/ceiling-and-rules-discovery/, the
        `PA→country_code` / `Si→region` / `aranzebia→city` class) PLUS the representative
        semantic mass (eval/repr). This is the ONLY mass in scope — STRUCTURAL (deterministic,
        column-stats NO-GO), DATETIME (deterministic parser), and pure-residual masses are OUT.
        State the prize as a gold + representative column count and an upper-bound headline lift.
    (b) THE BUDGET. Measure the CURRENT shipped per-column latency (Model2Vec static encode +
        multi-branch classify) as the baseline, and set the HARD ceiling a candidate must clear,
        in TWO regimes: every-column (full 6.6M-column corpus pass viable) vs low-band-only
        escalation (the shipped quality_band <0.70 gates which columns get the richer encoder —
        memory `confidence-quality-band-shipped`). DELIVERABLE: prize (cols + max lift) +
        measured current latency + the budget ceiling + which regime the bet must hit.
  gate: true
  checked: true
  ac_type: observation
- id: ac-01
  description: |
    CANDIDATE ENCODERS — survey + REAL offline latency probe (observation). Survey small, local,
    CPU-runnable, fine-tunable encoder candidates (small BERT/MiniLM-family, distilled encoders,
    the sentence-transformer Model2Vec was itself distilled FROM, quantised int8). For 2–3
    candidates, measure ACTUAL per-column CPU inference latency (quantised vs fp32, batched) on a
    representative column sample — not spec-sheet numbers. Compare against the ac-00 budget in
    both regimes. DELIVERABLE: per-candidate latency table + which survive every-column and/or
    low-band-only. STATE: FineType already embeds + runs local neural models (Model2Vec,
    multi-branch, entity-classifier) so the integration pattern exists; the open question is
    pure SPEED. If NO candidate clears even low-band-only, that is a speed NO-GO feeding ac-04 —
    record it and continue the accuracy probe anyway (the signal is worth knowing).
  gate: false
  checked: true
  ac_type: observation
- id: ac-02
  description: |
    ENCODER HEADROOM — is the semantic signal even THERE in a richer encoder? (observation, the
    CRUX, BLOCKING). Test whether a candidate LM's representation separates the semantic
    boundaries Model2Vec cannot — WITHOUT a full retrain, the cheap probe that isolates SIGNAL
    from TRAINING. On the gold contested semantic columns (ac-00 prize set): embed header+values
    with a candidate encoder (zero-shot or lightly fine-tuned) and measure whether the failing
    boundaries (`PA` state-vs-country, `Si` status-vs-region, `aranzebia` text-vs-city) become
    linearly separable; compare head-to-head against Model2Vec embeddings on the identical probe.
    DELIVERABLE: separability (AUC / linear-probe accuracy) of the semantic boundaries under the
    candidate encoder vs Model2Vec. STATE THE LIMIT, hard-won this year: separability is a CEILING
    for a discriminator WITH A SECOND OPINION, NOT a shippable threshold (memories
    `column-stats-separate-residual-gaps`, `decisive-stat-skip-is-no-go`) — a positive probe is
    necessary, not sufficient, and a built model must still clear every gate. If the richer encoder
    does NOT separate these boundaries materially better than Model2Vec, the lever is dead and the
    semantic ceiling is the model's permanent limit — say so.
  gate: true
  checked: true
  ac_type: observation
- id: ac-03
  description: |
    THE ATTRACTOR RISK — would fine-tuning hit the SAME wall? (doc). Confront the 0-for-6 retrain
    record head-on (memories `categorical-is-a-residual-category`, `identity-retrain-broadened-
    fullname-no-go`, `ceiling-discovery-both-levers-dead`). The prior failures broadened residual
    catch-alls under a flat softmax. Reason from the ac-02 evidence + architecture: is the
    residual-attractor a TRAINING-DYNAMICS problem the encoder is orthogonal to (so a richer
    encoder alone won't escape it and the bet ALSO needs precedence semantics — decision 0096), or
    does upgrading the SHARED REPRESENTATION — the locus the discovery named for the interference,
    and the one part the falsified head (`hierarchical-head-falsified`) and sibling
    (`sibling-context-is-the-stranded-architecture-layer`) bets never touched — plausibly change
    the dynamics? DELIVERABLE: the reasoned risk verdict + the TRAINING DESIGN a build would
    require (not merely "fine-tune") + the gates it must clear (drift proxy → gold → representative
    → corpus-honest, all shipped this session).
  gate: false
  checked: true
  ac_type: doc
- id: ac-04
  description: |
    SYNTHESIS + RECOMMENDATION (doc, BLOCKING). One artefact answering: can "small + local + fast +
    fine-tuned" be ALL FOUR at once for this engine? Must resolve: (1) does a candidate clear the
    latency budget, and in which regime (ac-01); (2) is the semantic signal present in a richer
    encoder beyond Model2Vec (ac-02 separability); (3) does the attractor risk sink it or is there
    a training design that escapes (ac-03); (4) the honest GO/NO-GO with the prize sized (ac-00)
    and the build cost named. This is the LAST untried model-side lever — a NO-GO means the
    semantic over-emission mass is the model's permanent ceiling and the only remaining handles are
    value-rule vetoes + the confidence band (both shipped) + LLM-in-the-loop-for-labelling. End
    with a single recommended next step: BUILD (with the ac-03 training design + gates), a NARROWER
    follow-up probe, or NO-GO (accept the ceiling). Framed so the author picks with eyes open. No
    model ships from THIS spec — it produces the decision, not the change.
  gate: true
  checked: true
  ac_type: doc
