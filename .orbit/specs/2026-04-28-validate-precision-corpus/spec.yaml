- id: ac-15
  description: |
    A stub card for the corpus-curation follow-up exists at `.orbit/cards/0015-validate-corpus-curation.yaml`. The stub follows the standard card schema (`feature`, `as_a`, `i_want`, `so_that`, `scenarios`, `maturity`, `goal`, `references`), carries `maturity: emerging`, declares ≥1 scenario, and lists `.orbit/specs/2026-04-28-validate-precision-corpus/spec.yaml` in its `references` array. The stub's goal is to grow the validate-precision corpus from 7 datasets toward the 30–50-CSV target set out in this spec's goal statement.
