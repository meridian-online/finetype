id: 2026-04-28-validate-precision-corpus
goal: |
  Build a profile→validate round-trip precision harness that runs over a real-world corpus of whole CSVs, reports `N of M datasets pass at P=99%`, and attributes every failing column to one of four named mechanisms. Ship the harness mechanics + a 7-CSV iter-1 corpus (sourced fresh from public open-data URLs, disjoint from the m-19 eval corpus) + the two in-scope fixes (enum-overfit on the profile side, ≤5 validator widenings on the taxonomy side). Sourcing beyond 7 datasets toward the 30–50-CSV target is a separate curation sprint (stub card 0015) that consumes the harness this iteration delivers. Misclassification and code-vs-canonical defer to follow-up cards.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    `eval/datasets/validate_manifest.csv` exists with 9 columns: `dataset, file_path, source_url, licence, fetched_date, provenance_status, gt_sidecar_path, row_count, column_count`. Iteration 1 ships exactly 7 rows: `pokemon`, `rio2016_athletes`, `us_baby_names`, `co2_emissions_by_nation`, `world_population`, `un_locode`, `global_temp_annual`. Every row carries:
      - `source_url`: a fully-qualified public URL (no `'unknown'`
         values — iter-1 sources are all traceable; the URLs verified
         HTTP 200 at the time of spec landing are pinned in
         implementation_notes);
      - `licence`: one of the values in `eval/licence_allowlist.txt`
         (SPDX-canonical `MIT`, `CC0-1.0`, `CC-BY-4.0`, `PDDL-1.0`,
         `ODC-By-1.0`, … plus the free-form `public-domain`,
         `internal`, `unknown-investigating`); the iter-1 corpus
         uses `public-domain` for the four datasets/global_temp_annual,
         rio2016_athletes, world_population, co2_emissions_by_nation
         subset, `MIT` for pokemon's gist mirror, `PDDL-1.0` for the
         datahub mirrors that ship under ODC-PDDL, and free-form
         `public-domain` where no SPDX value applies. No new licence
         values are added in iter-1; if a source's licence is not
         already in `eval/licence_allowlist.txt`, the implementer
         extends the allowlist as part of this PR;
      - `fetched_date`: an ISO 8601 date (the date the CSV was
         sampled into the repo);
      - `provenance_status`: `real` for all 7 rows (no synthetic
         in this iteration's corpus). NOTE: `provenance_status` is
         a NEW column on `validate_manifest.csv` — it is not a field
         in the live `eval/datasets/sources.yaml` schema (sources.yaml
         uses `attribution` instead). The validate manifest is
         file-keyed and adds this column for MADR 0055 alignment;
         sources.yaml stays at its existing m-19 shape (see ac-02);
      - `file_path`: relative to repo root, pointing at
         `eval/datasets/validate_corpus/csv/<name>.csv`;
      - `gt_sidecar_path`: relative to repo root, pointing at
         `eval/datasets/validate_corpus/<name>.gt.yaml`.
    The schema admits new rows via PR with no harness code change.
  gate: false
  checked: false
- id: ac-02
  description: |
    `eval/datasets/sources.yaml` is extended with role-`validate` entries for the 7 validate-corpus CSVs. Existing role-`eval` and role-`train` and role-`both-forbidden` entries are byte-unchanged. Each new validate-corpus source mirrors the live sources.yaml schema: `source_url` (the public URL pinned in implementation_notes — NOT a `repo://` self-reference, since these CSVs originate externally), `role: validate`, `licence` (SPDX value from `eval/licence_allowlist.txt`), `fetched_date` (ISO 8601), `attribution` (one-line free-text prose pointing at the upstream project), `datasets` (a YAML list whose single element is the dataset slug from `validate_manifest.csv`). The `id`/`name`/ `provenance_status` keys do NOT appear in sources.yaml — they live exclusively on `validate_manifest.csv`. The `role` enum is extended from `{eval, train, both-forbidden}` to `{eval, train, both-forbidden, validate}`; the header comment block of sources.yaml documents the new value with the same paragraph shape as the existing three roles.
  gate: false
  checked: false
- id: ac-03
  description: |
    The row-hash leakage firewall is extended. `scripts/compute_row_hashes.py` regenerates `eval/row_hashes.tsv` from BOTH `eval/datasets/manifest.csv` (eval role) AND `eval/datasets/validate_manifest.csv` (validate role) such that any row appearing in either manifest contributes a hash. `scripts/prepare_multibranch_data.py`'s leakage-filter behaviour remains active-by-default and now excludes validate-corpus rows from training data via the same hash table. The shared normaliser at `scripts/eval_leakage/__init__.py` is the single source of truth for hash computation; extension is at the manifest-iteration layer only.
  gate: false
  checked: false
- id: ac-04
  description: |
    Ground-truth sidecars exist for all 7 iter-1 corpus CSVs at `eval/datasets/validate_corpus/<name>.gt.yaml` (a new directory that holds validate-corpus assets — sidecars and the CSVs live here, NOT in `eval/datasets/csv/` which is m-19 eval data). The seven sidecars are `pokemon.gt.yaml`, `rio2016_athletes.gt.yaml`, `us_baby_names.gt.yaml`, `co2_emissions_by_nation.gt.yaml`, `world_population.gt.yaml`, `un_locode.gt.yaml`, and `global_temp_annual.gt.yaml`. Each sidecar has the schema:
      ```yaml
      columns:
        <column_name>: <expected x-finetype-label>
        ...
      notes: |
        Optional free-text rationale for ambiguous labels.
      ```
    Every column in the source CSV appears in the `columns` map. The `expected x-finetype-label` value is a string that exists in the taxonomy (the harness validates this — see ac-07). The combined column count across all sidecars is approximately 58 columns (pokemon 13, rio2016_athletes 12, us_baby_names 4, co2_emissions_by_nation 10, world_population 4, un_locode 12, global_temp_annual 3 = 58 — implementation_notes pins the per- dataset column inventories once the CSVs are committed; the figure may shift by ±2 if upstream sources change schemas between spec landing and CSV fetch).
  gate: false
  checked: false
- id: ac-05
  description: |
    A new eval binary exists at `crates/finetype-eval/src/bin/validate_corpus.rs`. Invocation: `cargo run -p finetype-eval --bin validate-corpus --release --
     --manifest eval/datasets/validate_manifest.csv
     --output eval/eval_output/validate_corpus.md
     [--threshold 0.99]`. The binary:
      1. Reads the manifest.
      2. For each CSV row: shells `finetype profile -f <csv>
         -o json-schema` (stdout-by-default per
         `2026-04-28-profile-json-schema-output/` constraint —
         no `--stdout` flag) and captures stdout into a temp
         schema file.
      3. Shells `finetype validate -f <csv> --schema <temp_schema>`
         and parses the validation report (rows valid / rows total).
      4. Computes per-dataset `pass = (valid / total) >= threshold`.
      5. If a GT sidecar is present, attributes each failing column
         to a mechanism per ac-07's table.
      6. Writes a single `validate_corpus.md` report per ac-08's shape.
    Exit code 0 always (the harness reports — it does not gate).
  gate: false
  checked: false
- id: ac-06
  description: |
    `Makefile` gains a `validate-corpus` target that runs the binary from ac-05 against `eval/datasets/validate_manifest.csv` and writes to `eval/eval_output/validate_corpus.md`. `make eval-report` is extended to invoke `make validate-corpus` as part of its pipeline AND to surface the headline `N of M datasets pass at P=99%` line in the dashboard at `eval/eval_output/report.md` alongside the existing profile-eval and actionability-eval headlines.
  gate: false
  checked: false
- id: ac-07
  description: |
    Mechanism attribution is implemented in `crates/finetype-eval/src/bin/validate_corpus.rs` (or a sibling module). For each failing column with a GT sidecar entry, the mechanism is one of: `enum_overfit`, `format_diversity`, `misclassification`, `code_vs_canonical`, or `unknown`. The attribution rules (deterministic, in this order):
      1. If `predicted_label != expected_label` AND any reject row
         has `error_type='SEMANTIC_TYPE'` → `misclassification`.
      2. If `predicted_label == expected_label` AND any reject row
         has `constraint_failed='enum'` → `enum_overfit`.
      3. If `predicted_label == expected_label` AND
         `error_type='SEMANTIC_TYPE'` AND `constraint_failed='pattern'`
         AND the column's GT label has a known canonical-vs-code
         seam (table in implementation_notes lists 5 such seams:
         gender, country, currency, language, blood_type) →
         `code_vs_canonical`.
      4. If `predicted_label == expected_label` AND
         `error_type='SEMANTIC_TYPE'` AND `constraint_failed='pattern'`
         (and not rule 3) → `format_diversity`.
      5. Otherwise → `unknown`.
    Failing columns WITHOUT a GT sidecar contribute to the corpus headline but their mechanism is `no_gt` (separate count, not `unknown`).
  gate: false
  checked: false
- id: ac-08
  description: |
    `eval/eval_output/validate_corpus.md` shape (the harness writes this verbatim; column widths and exact whitespace are means-level):
      ```
      # Validate-Precision Corpus Report
      Generated: <ISO timestamp>
      Threshold: P=0.99
      Corpus: <M> datasets, <total_rows> rows total

      ## Headline
      **<N> of <M> datasets pass at P=99%** (baseline: <N₀ of M₀>; delta: <±N>)

      ## Per-mechanism breakdown
      | Mechanism             | Failing columns | Datasets affected |
      |-----------------------|-----------------|-------------------|
      | enum_overfit          | …               | …                 |
      | format_diversity      | …               | …                 |
      | misclassification     | …               | …                 |
      | code_vs_canonical     | …               | …                 |
      | unknown               | …               | …                 |
      | no_gt                 | …               | …                 |

      ## Per-dataset
      | Dataset | Rows | Valid | Pass@99% | Failing columns | Top mechanism |
      | airports | 7698 | …     | …        | …               | …             |
      … one row per dataset …
      ```
    Baseline numbers come from a `eval/eval_output/validate_corpus.baseline.md` file written by the FIRST harness run before any in-scope fix lands (ac-09, ac-10). Subsequent runs read the baseline file and report delta.
  gate: false
  checked: false
- id: ac-09
  description: |
    In-scope fix 1: enum-overfit. Two distinct sub-fixes ship under this AC; both target the JSON Schema enum emission path that `2026-04-28-profile-json-schema-output/` introduced.
      Sub-fix (a) — Default cardinality cap: lower the default value
      of the existing `--enum-threshold` flag (`crates/finetype-cli/src/main.rs:299`)
      from `50` → `32`. The flag's documented behaviour is unchanged;
      only its default moves. Users who pass `--enum-threshold N`
      explicitly are unaffected. The label-family gate at
      `crates/finetype-cli/src/main.rs:3345` (label must equal
      `representation.discrete.categorical`) is unchanged — that
      gate is already correct and pre-existed this iteration.
      Sub-fix (b) — Boolean-terms gate parity: extend the label-family
      gate so `representation.boolean.terms`,
      `representation.boolean.binary`, and `representation.boolean.initials`
      also receive the same enum-emission treatment as
      `representation.discrete.categorical` (these are taxonomically
      finite-domain labels too). A column labelled
      `representation.boolean.terms` with ≤ `enum_threshold` distinct
      values gets an emitted enum; over the threshold, no enum.
    The 32 figure and the new boolean.* gates are literal — implementer does not introduce new flags. Three unit tests in `crates/finetype-cli/tests/` (or under `#[cfg(test)] mod` adjacent to the JSON Schema emission code):
      T1: `pvc_enum_omitted_for_non_categorical_label` — profile a
          CSV column labelled `datetime.offset.iana` with 12 distinct
          values → emitted schema has the `x-finetype-label` and
          pattern but NO `enum` (regression test, asserts existing
          gate still holds).
      T2: `pvc_enum_kept_for_boolean_terms_label` — profile a CSV
          column labelled `representation.boolean.terms` with 6
          distinct yes/no values at default threshold → emitted
          schema HAS an `enum` array (sub-fix (b) extension).
      T3: `pvc_enum_omitted_when_cardinality_exceeds_default` —
          profile a CSV column labelled `representation.discrete.categorical`
          with 40 distinct values at default threshold (32) → no enum
          (regression bound on sub-fix (a)).
    Post-fix harness re-run: the corpus-level count of failing columns attributed to `enum_overfit` is ≤ baseline's count for that mechanism. The fix is mechanism-monotonic on `enum_overfit` only — counts of OTHER mechanisms (e.g. `format_diversity`, `unknown`) may rise as enum-suppressed columns fall through to broader pattern checks; this is expected and not a regression. If baseline shows 0 `enum_overfit` attributions, the three unit tests alone satisfy the fix's behavioural contract; the harness baseline- vs-post-fix delta is recorded honestly with prose noting why.
  gate: false
  checked: false
- id: ac-10
  description: |
    In-scope fix 2: validator format-diversity. The implementer runs the iteration-1 baseline harness over the 7-CSV corpus, reads the per-column `format_diversity` attributions, and chooses 1–5 type widenings whose widened patterns honour the precision principle (MADR 0001) — the widened validator must still REJECT clearly invalid input. Each widening is a one-line edit to the relevant `labels/definitions_*.yaml` `validation:` block (universal layer only — locale-specific blocks remain untouched, since MADR 0001 requires that locale-specific types' universal validators only reject, never accept widely). For each widening: (a) the YAML edit lands; (b) a regression test in `crates/finetype-core/tests/precision_widenings.rs` asserts both an accept-set (≥3 real-world variants the prior pattern rejected) AND a reject-set (≥3 clearly-invalid strings the widened pattern still rejects). Iteration-1 widening count: ≥1 (proves the widening pattern works) and ≤5 (bounds scope — further widenings ship under follow-up cards). Likely candidates from the iter-1 corpus, in priority order: `un_locode.Date` (yyMM short-form datetime), `un_locode.Coordinates` (DDMMNS DDDMMEW geo format), `rio2016_athletes.height` (decimal metres), or any other type the baseline surfaces; implementer chooses based on baseline measurement, NOT the list above.
  gate: false
  checked: false
- id: ac-11
  description: |
    Three MADRs land at: `.orbit/choices/0072-round-trip-pass-as-validate-metric.md`, `.orbit/choices/0073-validate-corpus-reuses-m19-infrastructure.md`, `.orbit/choices/0074-validate-corpus-in-scope-fix-mechanisms.md`. Each follows the MADR template (status, date-created, date-modified, Context and Problem Statement, Considered Options ≥3, Decision Outcome, Consequences). Status: `accepted` on merge, dated `2026-04-28`.
      - 0072 documents the round-trip pass contract (P=99% headline,
        dataset-pass-rate aggregation, why round-trip beats pure
        quality-gate framing).
      - 0073 documents the m-19 infrastructure reuse: sources.yaml
        role extension, MADR 0055 floors application, leakage
        firewall extension. References MADR 0055/0056/0057.
      - 0074 documents the in-scope (enum-overfit, format-diversity)
        vs deferred (misclassification, code-vs-canonical)
        partition. References MADR 0066 (v19 retrain hard gate)
        for why misclassification defers.
  gate: false
  checked: false
  ac_type: doc
- id: ac-12
  description: |
    `CHANGELOG.md` `[Unreleased]` (or `[0.6.20]` if cut) gains:
      ### Added
      - `make validate-corpus` profile→validate round-trip harness
        over real-world CSVs; `eval/eval_output/validate_corpus.md`
        report; per-mechanism attribution.
      ### Changed
      - `finetype profile --enum-threshold` default lowered from
        50 → 32 (more conservative enum emission in JSON Schema
        and other output formats).
      - JSON Schema emission gate extended: `representation.boolean.*`
        types now eligible for enum emission alongside
        `representation.discrete.categorical`.
      - Taxonomy validator widenings (1–5 types, names per ac-10's
        implementer-chosen list) accept additional real-world format
        variants while still rejecting clearly-invalid input
        (precision principle preserved per MADR 0001).
    `CLAUDE.md` "What's next" section gains a one-line entry pointing at `.orbit/specs/2026-04-28-validate-precision-corpus/` (with the baseline N-of-M figure once measured) and the three new MADRs in the Decision Register count.
  gate: false
  checked: false
  ac_type: doc
- id: ac-13
  description: |
    `make ci` passes (cargo fmt --check, cargo clippy --workspace -- -D warnings, cargo test --workspace, cargo run -- check). Zero new clippy warnings vs main. The new harness binary is included in the workspace test matrix.
  gate: false
  checked: false
- id: ac-14
  description: |
    Baseline measurement is committed. The baseline file `eval/eval_output/validate_corpus.baseline.md` is committed in this PR alongside the post-fix `validate_corpus.md`. Both files are committed; the post-fix file shows `delta: +N` where N ≥ 0 (movement-based success — N may be 0 if the iteration's two fixes happen to not flip any dataset across P=99%, which is acceptable given the bound nature of the iteration; the spec success criterion is the harness shipping with measurement capability, not a numerical movement floor).
  gate: false
