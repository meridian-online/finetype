id: 2026-04-29-validate-corpus-iter4
status: closed
goal: |
  Widen `finance.currency.amount` validation to accept plain bare-decimal values
  (e.g. `1914.96`, `19.95`, `100`, `-50.5`) by composing
  `representation.numeric.decimal_number`'s canonical regex as a 4th alternation
  in the amount union. Demonstrate the fix on the discovery vehicle
  (`eval/datasets/csv/ecommerce_orders.csv`: total_price 63 rejects → 0). Record
  the two misclassification findings (status→periodicity, order_id→SEDOL) as
  deferred-to-retrain and file a follow-up card under the model-improvement
  umbrella. iter-3's row-level fixture lock (MADR 0076) must continue to pass on
  the 12-dataset corpus — no silent attribution drift.
acceptance_criteria:
- id: ac-01
  description: |
    `finance.currency.amount`'s `validation.pattern` at
    `labels/definitions_finance.yaml:131` gains a 4th alternation, byte-identical
    to `representation.numeric.decimal_number`'s pattern at line 79 of
    `definitions_representation.yaml`: `^-?[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?$`.
    The full amount pattern is the existing 3-alternation union with this
    pattern appended via `|`. A YAML comment immediately above the pattern
    names the source: `# Alternation 4 borrows representation.numeric.decimal_number's canonical bare-decimal regex (definitions_representation.yaml:79). See MADR 0078.`
  ac_type: code
- id: ac-02
  description: |
    Regression test `vci4_amount_accepts_bare_decimal` verifies that
    bare-decimal values (`1914.96`, `19.95`, `100`, `-50.5`, `0.99`, `1e6`)
    match the widened `finance.currency.amount` regex.
  ac_type: code
- id: ac-03
  description: |
    Regression test `vci4_amount_preserves_existing_formats` verifies that
    the existing 3 alternations still match: US format (`$1,234.56`,
    `-$999.99`, `£10,000.00`), symbol-required (`-$5.00`), and
    accounting parens (`($1,234.56)`).
  ac_type: code
- id: ac-04
  description: |
    Regression test `vci4_amount_rejects_non_money` verifies that the widened
    pattern still rejects clearly-non-amount tokens: `abc`, `1.2.3`, `12px`,
    `1e`, `e5`, empty string. (Same negative cases as
    `decimal_number`'s rejection behaviour.)
  ac_type: code
- id: ac-05
  description: |
    Demonstration: running `finetype validate eval/datasets/csv/ecommerce_orders.csv
    <schema.json> --db /tmp/iter4-demo.db --table orders` against the schema
    generated by `finetype profile -f eval/datasets/csv/ecommerce_orders.csv -o json-schema`
    shows total_price reject count drop from 63 (iter-3 baseline) to 0.
    Captured as a before/after snippet in progress.md.
- id: ac-06
  description: |
    iter-3's `vci3_fixture_attribution_regression_match` test continues to
    pass after the regex change. No row-level attribution drift on the
    12-dataset corpus. If FIFA Value/Wage rows (currently
    `code_vs_canonical / path-b-codetype`) silently start passing validation
    under the widened amount regex, per MADR 0076 these rows become
    forward-looking anchors — fixture row preserved, test unaffected.
- id: ac-07
  description: |
    progress.md contains a "Misclassification findings (deferred)" section
    that records, for each of the two non-format-diversity columns:
    (1) the column name and dataset; (2) the GT label; (3) the model's
    predicted label; (4) representative sample values; (5) the trigger
    mechanism (header signal vs value shape vs prefix shape); (6) the
    named fix path (training data widening / generator tightening /
    retrain). Cross-references the follow-up card filed under ac-08.
  ac_type: doc
- id: ac-08
  description: |
    A follow-up card is filed at `.orbit/cards/0015-status-orderid-misclassification.yaml`
    (or the next available NNNN slot if 0015 is already taken when iter-4
    lands) capturing both misclassifications. Card scenarios cover:
    (1) `status` columns whose values are e-commerce/order-state enums
    (shipped, pending, delivered, returned, cancelled) classify as
    `representation.discrete.status` or equivalent, NOT
    `datetime.component.periodicity`; (2) `order_id` columns with
    prefix-shaped values (ORD-12345, INV-99999) classify as
    `identifier.code.order_id` or `representation.discrete.identifier`,
    NOT `finance.securities.sedol`. Card lists this spec as a reference.
  ac_type: doc
- id: ac-09
  description: |
    MADR 0078 (or next available index) accepted, dated 2026-04-29, titled
    "Validator alternations may compose canonical sibling-type patterns".
    Records the precedent: when widening a validator's regex, prefer
    composing the canonical pattern of a sibling type (here:
    `decimal_number` → `amount`) over inventing a new alternation. Names
    the constraint: comment annotation in YAML must reference the source
    sibling type's path + line number for traceability.
  ac_type: doc
- id: ac-10
  description: |
    `CHANGELOG.md [Unreleased]` gains an iter-4 entry naming the amount
    regex widening, the reused canonical pattern, and the deferred
    misclassifications. `CLAUDE.md` "Recent work" section gains an
    iter-4 line; "What's next" refreshes to consolidate the validate-corpus
    arc as a 4-iteration sequence with 7 MADRs (0072–0078). Card 0014
    `specs[]` array gains the iter-4 spec path.
  ac_type: doc
- id: ac-11
  description: |
    `make ci` exits 0. ≥3 net new `vci4_*` tests pass (per ac-02/03/04).
    `cargo clippy --all-targets -- -D warnings` clean. `finetype check`
    taxonomy alignment clean (240 definitions or current count;
    no new alignment failures introduced).
