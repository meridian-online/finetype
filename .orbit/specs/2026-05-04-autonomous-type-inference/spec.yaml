id: 2026-05-04-autonomous-type-inference
goal: |
  Ship a deterministic, autonomous type-inference module that fills
  `failure_log.tsv`'s `inferred_correct_type` and `mechanism` columns
  with meaningful values (replacing the hardcoded "unknown" /
  "value-shape" placeholders), so that E01a in the 2026-05-10
  GitTables 90% round-trip contract can fire on real (predicted,
  inferred) pair-distinctness instead of degenerating to "20 distinct
  predicted types". Phase 1 is a triangulator over two cheap signals
  (validator pass-rate + header-name match) that uses the model's
  prediction as a structural prior. Mechanism vocabulary aligns with
  MADR 0075's rule-emitted cascade tokens and extends with three
  triangulator-specific tokens; rule-cascade order makes mechanism
  selection deterministic. Per-row confidence and signal subscores
  are written to a sidecar `inference_signals.tsv` so failure_log's
  9-column schema is never altered (avoiding any conflict with the
  contract's H08 append-only invariant).
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    A specification document exists naming the candidate approach as
    "triangulator over validator pass-rate + header-name match (Phase
    1)". This `spec.yaml` plus the linked `interview.md` satisfy the
    bead's spec-doc requirement.
  gate: false
  checked: false
  ac_type: doc
- id: ac-02
  description: |
    Inference module produces non-`unknown` `inferred_correct_type`
    on ≥5% of B01/B04 entries from the MEASURE half of
    `eval/gittables/failure_log.tsv` (rows where
    `file_content_sha256` SHA-bucket MOD 2 == 1) at confidence ≥
    `ac02_threshold` (= 0.7), with the locked weights
    `w_v=0.4, w_h=0.6` (per ac-07). This is a confirmation floor —
    it asserts the module is decisive enough on at least one in
    twenty failure_log rows to feed E01a's "≥20 distinct
    (predicted, inferred) pairs" trigger. The 60% target this AC
    previously carried was an unbacked aspiration set during spec
    drafting without empirical data; recalibrated to 5% by MADR
    0084 after the v1.3 implementation surfaced a structural cap
    (header-only cases score ≤0.6 under the locked weights). The
    descriptive sweep additionally reports the (non_unknown_rate,
    threshold) curve in `progress.md`, computed on the calibrate
    half (bucket 0) for educational reference and as evidence for
    the Phase 2 case (see follow-on bead filed at close).
  gate: false
  checked: false
- id: ac-03
  description: |
    `scripts/cron_cycle_work.py` integrates the inference module at
    both B01 (currently lines 376-391) and B04 (currently lines
    403-418) failure_log append sites. The two structurally
    identical loops are refactored into a single helper that calls
    inference before appending. The hardcoded
    `"inferred_correct_type": "unknown"` and
    `"mechanism": "value-shape"` literals are removed. The cycle
    worker also writes a corresponding row to
    `eval/gittables/inference_signals.tsv` for each B01/B04 column.
  gate: false
  checked: false
- id: ac-04
  description: |
    Inference is deterministic. Re-running the module on the same
    input column produces byte-identical output (taxonomy ID,
    confidence rounded to 4 decimal places, mechanism, signal
    subscores). Floating-point determinism is enforced by:
      (i) candidate types are iterated in lexicographic order of
          taxonomy ID at scoring time (not just at tie-break);
      (ii) each candidate's `score` is rounded to 4 decimal places
           BEFORE the argmax comparison, eliminating sub-ulp
           differences that could otherwise flip argmax across
           runs;
      (iii) tie-breaking on equal-rounded-score: lexicographically
            smaller taxonomy ID wins.
  gate: false
  checked: false
- id: ac-05
  description: |
    Median latency <100ms per column on M1 over a 1000-column
    benchmark sampled from `failure_log.tsv` (calibrate half;
    measure half is reserved for ac-02). Benchmark MUST invoke the
    same code path the cycle worker uses in production: one
    subprocess invocation per column for subprocess form, OR one
    socket round-trip per column for server form. The benchmarked
    invocation pattern is recorded in `progress.md` alongside p50
    and p95 numbers.
  gate: false
  checked: false
- id: ac-06
  description: |
    Smoke test wired into `scripts/cron_preamble.sh`. Module loads,
    sanity-infers one canned column (canonical email), returns the
    expected type with high confidence and the deterministic
    `prediction_confirmed` mechanism. Failing the smoke check halts
    the cycle (H05 family). Smoke test is a load + correctness
    check; the validator-broken cases (titanic Sex / airports
    timezone) are exercised by `labelled_eval.tsv` (ac-13) and the
    held-out floor (ac-02), not here.
  gate: false
  checked: false
- id: ac-07
  description: |
    Triangulator architecture: Phase 1 inference fuses
    `validator_pass_rate` and `header_match` via a weighted sum
    `score(type) = w_v · validator_pass_rate(type) + w_h ·
    header_match(type)` where `w_v + w_h = 1.0` is invariant. Weights
    are LOCKED at `w_v=0.4, w_h=0.6` for this bead (rationale in
    constraint block: titanic/airports evidence in interview.md Q3
    establishes validators as the more error-prone signal, so header
    is weighted higher). The implementing agent does not run a
    weight-selection sweep; the descriptive sweep on the calibrate
    half exists only to populate the curve in `progress.md` for
    future Phase-2 calibration work. Confidence is `max_type score`.
    Inferred type is the argmax with lexicographic tie-break (ac-04).
  gate: false
  checked: false
- id: ac-08
  description: |
    Read-only validator authority. The module emits mechanism =
    `validator_widening` when ALL of: (a) predicted_type's validator
    rejects ≥50% of samples; AND (b) header-name match for the
    predicted_type is ≥0.7; AND (c) the inferred type (argmax)
    equals the predicted type. The module MUST NOT modify any file
    under `labels/`, `crates/finetype-core/src/`, or otherwise
    mutate validator state. Note: when (a) and (c) hold but (b)
    does not, the cascade falls through to MADR 0075's
    `enum_overfit` (rule 1) or `format_diversity_path_a` (rule 4)
    depending on validator type — that's the intended behaviour.
  gate: false
  checked: false
- id: ac-09
  description: |
    Mechanism vocabulary is the closed set of MADR 0075's
    rule-emitted tokens plus three triangulator-specific extensions.
    ALLOWED values:
    `enum_overfit`, `format_diversity_path_a`, `format_diversity_path_b`,
    `code_vs_canonical_path_a`, `code_vs_canonical_path_b`,
    `misclassification`, `fallthrough` (from MADR 0075);
    `validator_widening`, `prediction_confirmed`, `unknown_no_fit`
    (triangulator-specific). NO display roll-ups (`format_diversity`,
    `code_vs_canonical`) are ever emitted. Mechanism selection is:

      PRECONDITION: if `samples` is empty after truncation
      (ac-15), short-circuit with mechanism=`fallthrough`,
      inferred_correct_type=`unknown`, confidence=0.0. Cascade
      does not run. This precondition is structurally separate
      from the rule cascade because no candidate scores can be
      computed when there is nothing to score.

      Otherwise, the rule cascade fires in this priority order
      (first-fire wins; `max_score` is the max weighted score
      across the candidate pool):

      Rule 1: unknown_no_fit          — `max_score <
                                        fallback_threshold` (= 0.4);
                                        emit
                                        inferred=`representation.text.string`,
                                        confidence=0.3.
      Rule 2: validator_widening      — ac-08 conditions hold
                                        (predicted's validator
                                        rejects ≥50% AND header_match
                                        for predicted is ≥0.7 AND
                                        argmax == predicted).
      Rule 3: enum_overfit            — predicted == inferred,
                                        predicted's validator is
                                        enum-typed, ≥50% reject
                                        (per MADR 0075 rule 1).
      Rule 4: format_diversity_path_b — predicted != inferred,
                                        predicted/inferred share
                                        broad prefix
                                        (per MADR 0075 rule 2).
      Rule 5: code_vs_canonical_path_b — predicted != inferred,
                                        predicted/inferred form a
                                        code-vs-canonical XOR
                                        allowlist pair
                                        (per MADR 0075 rule 3).
      Rule 6: format_diversity_path_a — predicted == inferred,
                                        regex reject, no seam
                                        (per MADR 0075 rule 4).
      Rule 7: code_vs_canonical_path_a — predicted == inferred,
                                        regex reject, seam detected
                                        (per MADR 0075 rule 5).
      Rule 8: prediction_confirmed    — predicted == inferred,
                                        validator pass-rate ≥0.7.
      Rule 9: misclassification       — predicted != inferred,
                                        catch-all (per MADR 0075
                                        rule 6).
  gate: false
  checked: false
- id: ac-10
  description: |
    Fallback policy. Rule 1 of the cascade (ac-09) emits
    `inferred_correct_type = "representation.text.string"`,
    confidence = 0.3 (exact), mechanism = `unknown_no_fit` when
    `max_score < fallback_threshold` (= 0.4). The
    empty-samples PRECONDITION (structurally before the cascade)
    emits `inferred_correct_type = "unknown"`, confidence = 0.0,
    mechanism = `fallthrough`.
  gate: false
  checked: false
- id: ac-11
  description: |
    Phase 1 signal scope is locked to validator pass-rate +
    header-name match. The module's source MUST NOT reference
    generator-shape extraction, sibling-context attention, or
    Model2Vec embeddings. Phase 2 signals are explicitly out of
    scope and surface as TODO comments only if their integration
    points need to be sketched.
  gate: false
  checked: false
- id: ac-12
  description: |
    Sidecar inference signals file `eval/gittables/inference_signals.tsv`
    is created (new file, append-only from day 1) with schema:
    `cycle_id`, `timestamp`, `file_path`, `file_content_sha256`,
    `column_name`, `predicted_type`, `inferred_correct_type`,
    `confidence`, `mechanism`, `validator_pass_rate`, `header_match`,
    `top_k_json`. failure_log.tsv's existing 9-column schema is
    UNCHANGED — this bead modifies only the *content* of the
    `inferred_correct_type` and `mechanism` columns (no longer
    hardcoded). The new sidecar respects the contract's H08/H09
    append-only invariant by being append-only from creation; no
    existing append-only file is rewritten.
  gate: false
  checked: false
- id: ac-13
  description: |
    Ground-truth labelled eval subset published at
    `.orbit/specs/2026-05-04-autonomous-type-inference/labelled_eval.tsv`.
    200 rows sampled from the MEASURE half of `failure_log.tsv`
    (`file_content_sha256` MOD 2 == 1; never the calibrate half),
    stratified by `predicted_type` to cover ≥30 distinct types.
    Columns: original 9 columns from failure_log.tsv plus
    `truth_inferred_type`, `truth_mechanism`, `labeller`,
    `labelled_at`, `note`. Sibling file `labelling_protocol.md`
    documents: (i) labelling rubric; (ii) tie-break rules when more
    than one taxonomy type fits; (iii) protocol for unclear rows
    (resolution: emit `unknown` as `truth_inferred_type` with
    `note` explaining); (iv) sampling seed. `progress.md` reports
    precision-on-labelled (= fraction where module's
    `inferred_correct_type` matches `truth_inferred_type`) at the
    ac-02 threshold.
  gate: false
  checked: false
  ac_type: doc
- id: ac-14
  description: |
    Five MADR records authored, one per non-trivial design decision
    (D1-D5) surfaced in `interview.md`. (D6 — "B01/B04 only,
    MADR 0078 policy stands" — is a non-decision and does not
    warrant a record; its rationale lives in this spec's constraint
    block and the existing MADR 0078.) Each MADR includes context,
    considered options, decision outcome, and consequences. Status:
    at minimum `proposed`; `accepted` once the spec lands.
  gate: false
  checked: false
  ac_type: doc
- id: ac-15
  description: |
    Sample truncation is enforced inside the inference module
    before any validator scan. The module truncates the input
    `samples` array to N=8 entries (matches
    `OBSERVED_SAMPLE_LIMIT` at `scripts/cron_cycle_work.py:80`).
    The same N is applied uniformly across the calibration sweep
    (ac-07), the floor benchmark (ac-02), the latency benchmark
    (ac-05), the labelled eval (ac-13), and the smoke test (ac-06).
  gate: false
  checked: false
