acceptance_criteria:
- id: ac-00
  description: |
    B07 AUDIT + EMBED-SWAP PLAN. Determine whether a bigger potion (8M/32M) is a drop-in
    via the existing Rust model2vec_shared / extract_embedding_aggregation (same safetensors
    format, just swap the model dir + EMBED_DIM/EMBED_AGG_DIM), or needs model2vec-rs.
    Enumerate consumers of EMBED_DIM (128) / EMBED_AGG_DIM (512=128x4) / the FTMB embed slot
    / the model config embed_dim. DELIVERABLE: the edit set + the model2vec-rs vs in-place
    decision + a 27-stats build path for ac-01 (the 44-stats column-distribution addition
    was a NO-GO — the reproducibility baseline must use v19's exact 27 stats; flag/slice it).
  ac_type: doc
  gate: true
  checked: false
- id: ac-01
  description: |
    REPRODUCIBLE BASELINE (the foundation; FIRST OVERNIGHT). 3-seed Model2Vec retrain at
    v19's EXACT config (potion-4M embed, 27 stats, current taxonomy, the v19 recipe). Score
    Sense-vs-Sense vs v19 (0.502) and composed vs v19 (0.793). REQUIRE best-of-3 within the
    CI of v19 (reproducible -> a movable baseline) OR a diagnosis of the drift gap (taxonomy
    240->244, data, generators). Settles whether cdist's 0.316 was the 44-stats or a regressed
    pipeline. DELIVERABLE: the reproducible baseline number + verdict; the baseline every
    later candidate is measured against (fresh-vs-fresh, NOT vs the frozen v19).
  ac_type: observation
  gate: true
  checked: false
- id: ac-02
  description: |
    BIGGER-STATIC EMBEDDING FRONTIER. Swap potion-4M -> potion-8M and potion-32M (and
    potion-retrieval-32M) as the embed branch; for each: build features, retrain, measure
    Sense-only gold AND per-column latency. Map the frontier (4M baseline -> 8M -> 32M) as
    accuracy-per-millisecond. REQUIRE a candidate that improves Sense over the ac-01 baseline
    at <=~3x its latency. DELIVERABLE: the frontier table + the chosen candidate. (fastembed-rs
    ONNX gte/bge is the fallback ONLY if static tops out — do not build unless needed.)
  ac_type: observation
  gate: true
  checked: false
- id: ac-03
  description: |
    HONEST COMPOSED GATE. The chosen candidate: composed gold (native profile if in-binary,
    else compose_predictions.py) vs the ac-01 reproducible baseline AND v19's 0.793. Plus
    representative + corpus-relocation (H05, blocking). REQUIRE improve-or-hold composed vs
    the baseline. No Sense-vs-composed gates.
  ac_type: observation
  gate: true
  checked: false
- id: ac-04
  description: |
    RULE-SIMPLIFICATION (GATED). With the richer embed's stronger Sense, turn OFF >=1 Sharpen
    rule the better Sense now subsumes (candidate: the coordinate plausibility gate / lat-lon
    disambiguation, the cardinality gates) and confirm composed accuracy HOLDS (within CI) on
    gold + the corpus-relocation gate. DELIVERABLE: the rule(s) removed + composed-hold
    evidence + kill switches + ledger entry. A held removal is a structural win (decision 0038)
    independent of the headline.
  ac_type: code
  gate: true
  checked: false
- id: ac-05
  description: |
    SWAP / SHIP. If the candidate clears the composed gate (ac-03) AND holds the rule removal
    (ac-04) AND passes the corpus-relocation gate, swap models/default, version bump, CHANGELOG,
    count surfaces, latency note. Else documented fallback (the reproducible baseline ships as
    the new movable baseline even if no embed candidate wins — that alone unblocks the roadmap).
  ac_type: observation
  gate: true
  checked: false
