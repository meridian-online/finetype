id: 2026-06-21-reproducible-baseline-and-static-embeddings
goal: |
  Two coupled goals: (1) establish a REPRODUCIBLE Model2Vec baseline that matches v19 —
  escaping the roadmap dead-end where every bet loses to an artefact we cannot rebuild —
  and (2) climb the embedding speed-quality frontier with BIGGER STATIC models (potion-8M/
  32M via model2vec-rs): richer embeddings at near-Model2Vec speed, NOT gte's ~100x cost.
  Evaluated honestly (Sense-vs-Sense + per-column latency), with RULE REMOVAL a gated win.

  ## Why now — what this session established (2026-06-21)
  - The gte "NO-GO"s were a measurement artefact: gte was scored STANDALONE (Sense argmax)
    vs v19 COMPOSED (Sense + Sharpen, ~+0.29). On the HONEST Sense-vs-Sense gate, gte
    two-view Sense = 0.571 BEATS v19 Sense = 0.502; composed they TIE (0.787 vs 0.793).
    Richer embeddings genuinely produce a better Sense. (memory honest-sense-vs-composed-gate)
  - But gte costs ~100x: Model2Vec embed = 0.39 ms/col, gte-tiny = 39 ms/col (measured).
    A TIE at 100x is not shippable. The sweet spot is a representation that captures gte's
    Sense gain at ~1-2x latency — a BIGGER STATIC model, not a transformer.
  - Reproducibility is the real blocker: a fresh retrain (cdist, Model2Vec+44stats) Sense =
    0.316 vs v19's tuned 0.502. We cannot rebuild v19's quality, so "default to v19" is
    forced and the roadmap dead-ends. A movable baseline is the prerequisite for everything.
  - The Sharpen rules are PARTLY REDUNDANT with a better Sense (they add +0.29 to v19 but
    only +0.22 to two-view). A richer Sense may let us DELETE rules — a structural win.

  ## The bet
  A bigger static potion (8M/32M) is the same architecture we already run (model2vec_shared
  / extract_embedding_aggregation), so it is a near-drop-in (swap the model + EMBED_DIM, or
  via model2vec-rs) and stays static-fast. It should carry much of gte's Sense gain at a
  fraction of the latency — the shippable point on the frontier. fastembed-rs (ONNX gte/bge)
  is the middle-ground fallback IF static tops out (not built unless needed).

  ## Tooling banked this session (reuse, do not rebuild)
  score_gold_anchor.py predict --raw-model (Sense-only); compose_predictions.py +
  FINETYPE_INJECT_LABEL (compose any model's predictions — the rules are value-based);
  predict_multibranch (precomputed-feature scoring); the embed-swap builder pattern.

  ## Pillar defence
  Pillars 1 + 4 + the Precision Principle: a movable, reproducible baseline + a richer-but-
  fast representation is the path off the v19 plateau without paying transformer latency.

  ## Risk
  Flat-softmax destination drift on every retrain (cleared by the blocking gates: composed
  gold + corpus-relocation H05). Reproducibility may NOT recover (drift) — then ac-01 names
  the real problem instead of papering over it. Fallback: v19 stays default.
