id: 2026-06-10-deterministic-layer-audit
goal: |
  Produce a complete, evidence-graded ledger of every deterministic (non-neural)
  step in the inference pipeline AND every taxonomy validator — what each is for,
  whether it still fires, whether it is correct, and its net value at corpus scale —
  so we know which earn their place. The audit changes NO pipeline behaviour; its
  deliverable is the ledger and its verdicts, not the cleanup.

  ## Why now

  A session that started as a cheat-file check surfaced how much deterministic
  machinery sits on top of the neural Sense model — and how little of it is
  interrogated. A quick `-v` trace of all 449 columns across the 32 eval files
  (`/tmp/vtrace_clean.log` methodology) found two structural problems:

  1. COVERAGE GAP. Roughly half the deterministic rules never fire on the eval
     suite — 6 of 7 feature sharpen rules and 6 of 11 header-hint kinds, INCLUDING
     `header_hint_coord_veto`, the fix shipped in 0.6.25. A rule the eval suite never
     exercises ships without regression coverage; we cannot tell rare-but-correct
     from quietly-broken, and only the corpus can.

  2. FALSE-VETO SUSPECTS. A handful of HARD vetoes null columns that look correctly
     typed: `gender` → unknown (0% pass, AFTER the 0.6.26 case-fold — likely an
     M/F-abbreviation coverage gap), `npi` → unknown (32% pass), `price` → unknown
     (33% pass, where a hardcoded header hint asserts currency.amount and the veto
     then retracts it — two deterministic steps fighting).

  The deterministic logic is large (column.rs alone exceeds 10k lines) and has
  accreted across ~6 architectural decisions and many specs: header hints (11 kinds),
  feature/F-rules, locale detection, leading-zero, entity/attractor demotion, the
  validation veto (hard + advisory), value-based disambiguation — plus the 240
  taxonomy validators each rule leans on. Nothing maps each piece's HEALTH;
  docs/ARCHITECTURE.md maps only its structure.

  ## Scope (locked 2026-06-10)

  FULL: every deterministic pipeline step (~18: in-model Sharpen rules in column.rs +
  the CLI-layer veto/header-hint/locale steps + value-based disambiguation) AND a
  Precision-Principle review of all 240 taxonomy validators (is each a real
  validation, not one that confirms ~any input — `^.+$`, `^[A-Za-z0-9]+$`, etc.).

  ## Authority (locked 2026-06-10) — VERDICT-ONLY

  The audit makes NO pipeline code changes. No step is removed, no validator edited,
  no false-veto fix landed — every change is a separate, gated decision the author
  approves later. A "remove" verdict ALWAYS carries an explicit removal precondition,
  never a unilateral cut: the header-hint precedent (memory
  header-hint-deletion-blocked-multi-instrument) stands — a step can be net-negative
  on the corpus and still be load-bearing until the model can cover what it does.
  The only writes the audit performs are throwaway trigger inputs and the ledger.

  ## Approach — staged dynamic workflow, gated by author review

  Stage 1 (cheap, no corpus passes): enumerate, then fan out one track per step /
  per validator-group through intent → trigger → behavioural check → verdict.
  Produces the ledger and flags the questionable steps. Stage 1's ledger gates
  Stage 2's scope — the author reviews before any corpus spend.
  Stage 2 (expensive, targeted): corpus-ablation (step on/off vs the gated-YDF
  oracle) ONLY for the steps Stage 1 flags. Each is a ~25-min corpus pass, so scope
  is deliberately minimised by Stage 1's findings.

  ## Honest scope limits

  Behavioural checks prove "correct on a constructed case" — necessary, not
  sufficient. Corpus ablation proves "net help/harm vs an imperfect oracle"
  (gated-YDF, not truth; GO-precision still accruing). So verdicts are
  evidence-graded, and every "remove" ships with a precondition. Success is the map
  and actionable verdicts, NOT a leaner pipeline — removal is downstream.
cards:
