status: open
labels:
- topology
acceptance_criteria:
- id: ac-01
  description: |
    CANONICAL INVENTORY. Enumerate every deterministic step in the pipeline (the
    in-model Sharpen rules in finetype-model/column.rs — feature/F-rules,
    leading-zero, entity/attractor demotion; the CLI-layer validation veto, header-
    hint application across all 11 kinds, locale detection; value-based
    disambiguation) AND every taxonomy validator (240). Each entry records: code
    location (file:symbol), trigger condition, toggle flag if one exists, and the
    decision/spec/memory that introduced it. Deliverable: an inventory with one row
    per step and per validator. Acceptance: zero deterministic steps present in code
    but absent from the inventory (cross-checked against the trace-tag set and a code
    grep). This gates the rest — you cannot audit what you have not enumerated.
  gate: true
  checked: true
- id: ac-02
  description: |
    BEHAVIOURAL TRIGGER. Each of the ~18 pipeline steps has a constructed input
    column that fires it under `finetype profile -v`, with the trace line captured as
    evidence — OR documented proof it cannot be triggered at all (a dead-candidate,
    flagged for AC-06/the ledger, never removed here). For each firing step, the
    trace decision is checked against the step's intent (AC-03). Closes the half of
    the layer the eval suite never exercises.
  gate: false
  checked: true
- id: ac-03
  description: |
    INTENT RECONCILIATION. Each step's ledger row cites the decision/spec/memory that
    introduced it and states whether current behaviour still matches that intent
    (matches / drifted / no-recoverable-rationale). A step with no recoverable
    rationale is itself a finding.
  gate: false
  checked: true
  ac_type: doc
- id: ac-04
  description: |
    COVERAGE CLOSURE (verdict-only). Every rule dormant on the current eval suite is
    resolved to one of: (a) a delivered trigger fixture (a proposed eval column that
    exercises it — recommended for addition, NOT landed under verdict-only), or
    (b) a dead-candidate verdict with evidence. Net: dormant-without-a-disposition →
    0. Landing the fixtures is a separate decision.
  gate: false
  checked: true
  ac_type: doc
- id: ac-05
  description: |
    VALIDATOR PRECISION REVIEW. All 240 taxonomy validators classified against the
    Precision Principle: precise (real pattern/enum/locale/range that distinguishes
    is-type from is-not) / weak (confirms ~any input — `^.+$`, `^[A-Za-z0-9_]+$`,
    `.{0,N}`, etc.) / locale-gap (universal where a locale-specific validation
    belongs). Deliverable: a per-validator verdict table; the weak and locale-gap
    ones surfaced as the candidate work-list. No validator is edited.
  gate: false
  checked: true
  ac_type: doc
- id: ac-06
  description: |
    NET-VALUE ABLATION (defers — dated empirical). For each pipeline step Stage 1
    flags questionable (drifted intent, false-veto suspect, dead-candidate, or
    weak-validator-dependent), a corpus-ablation delta vs the stable gated-YDF oracle:
    run the stratified-sample corpus pass with the step toggled OFF and diff against
    on, reusing the corpus-honest-gate machinery. Each flagged step gets a
    toward/away-from-oracle number and a verdict; every net-negative verdict carries
    an explicit removal precondition (what must be true — e.g. model coverage — before
    removal is safe). Scope is whatever Stage 1 flags, reviewed by the author first.
  gate: false
  checked: false
  ac_type: observation
- id: ac-07
  description: |
    FALSE-VETO RESOLUTION. The three suspects from the quick pass — `gender` (0%
    pass), `npi` (32%), `price` (33%) — each get a root cause (invalid data vs
    validator/coverage gap vs deterministic-step conflict) and a recommended fix.
    Verdict-only: no fix lands; any that later does must clear the eval + corpus-
    honest gates.
  gate: false
  checked: true
  ac_type: doc
- id: ac-08
  description: |
    THE LEDGER. A single deliverable — one row per deterministic step plus a
    per-validator-precision summary — with columns: intent / fires? / correct? / net
    value / verdict / recommended action (+ removal precondition where the verdict is
    remove). Readable in a sitting, sufficient for the author to make a
    keep / fix / remove-eventually call per step. This is the spec's product; AC-01
    gates it, every other AC feeds it.
  gate: true
  checked: true
  ac_type: doc
memories_considered:
- key: header-hint-deletion-blocked-multi-instrument
  disposition: adopted
  reason: Sets the verdict-only authority and the removal-precondition halt condition. A deterministic step can be net-negative at corpus scale and still be load-bearing until the model covers what it does, so the audit produces verdicts plus preconditions, never unilateral cuts.
- key: eval-precision-metric-blind-to-rare-targets
  disposition: adopted
  reason: Grounds the honest-scope-limit clause. Aggregate corpus precision is structurally blind to rare-type movement, so net-value verdicts (ac-06) lean on the gated-YDF oracle and per-step ablation deltas, not aggregate precision.
- key: eval-csv-review-2026-06-09
  disposition: adopted
  reason: The quick-pass evidence the spec is built on — the coverage gap (6/7 feature rules, 6/11 header hints dormant) and the gender/npi/price false-veto suspects were surfaced there.
