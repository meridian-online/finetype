id: 2026-05-30-reachability-metric-v2
goal: |
  Implement the v2 reachability metric proposed in
  `output/cluster-reachability/redesign_memo.md` — neighbour-label
  composition over value-shape embeddings — and ship the
  `reachability_score` column into `corroborated_gaps.parquet` IF
  the v2 metric cleanly separates the six v23 fixture clusters into
  HIGH and LOW reachability bands per their ground-truth v23
  outcomes.

  ## Why now

  Spec `2026-05-29-cluster-reachability-scoring` closed Path C —
  the v1 metric (cluster vs correct_label distance) mis-scored two
  of six v23 fixture clusters. The redesign memo named the
  replacement algorithm AND wrote down its predicted score band for
  every fixture cluster. Implementing v2 is the next move because:

    1. v22 stays the default Sense model. Every future
       `training_data_addition` retrain bet has the v23 blind spot
       until reachability gates the ranking. CLAUDE.md's current
       requirement — "every training_data_addition retrain must
       include a Sense-distribution pre/post check" — works as a
       fallback but doesn't pre-filter the diagnostic; v2 puts the
       check at the right layer.

    2. The redesign memo committed to predictions BEFORE
       implementation. v2 either delivers them or doesn't — a
       crisper falsification setup than v1 had.

    3. The v1 embedding pipeline carries over directly. Only the
       per-column aggregation step changes (from "distance to
       correct_label baseline" to "what does YDF say about the
       100 nearest neighbours"). Net new code is ~150 lines.

  ## The v2 algorithm — committed by the redesign memo

  For each cluster (a `(fp_label, correct_label)` pair from a
  corroborated gap):

    Build value-shape embeddings for every column in
    `columns.parquet` (same embedding as v1 — char 3-gram hashed
    (1024) + length percentiles + char-class summary).

    For each cluster column c, find its 100 nearest neighbours in
    the corpus EXCLUDING the cluster's own columns (no fp_label /
    correct_label restriction — the NN are drawn from the global
    column pool).

    Bucket the neighbours by `ydf_prediction`. Define two
    per-column scores:

      absorption_c = (count of NN where ydf_prediction ==
                      correct_label) / 100
      risk_c       = (count of NN where ydf_prediction !=
                      correct_label AND
                      sense_prediction != correct_label) / 100

    Average across the cluster:

      absorption = mean(absorption_c)
      risk       = mean(risk_c)
      reachability_v2 = absorption * (1 - risk), clipped [0, 1]

  Interpretation:
    - High absorption + low risk → cluster lives inside a region of
      the corpus where YDF agrees with correct_label; training is
      safely absorbed (the utc case the redesign memo names).
    - Low absorption + high risk → cluster lives in a region where
      YDF disagrees with correct_label; training will pull the
      disagreeing population into the cluster's training direction
      (the v23 categorical-bleed mechanism, made measurable).
    - Low absorption + low risk → cluster's value-shape neighbours
      are scarce in the corpus; training has little leverage (the
      v23 url case).

  ## Pre-committed predictions

  From `output/cluster-reachability/redesign_memo.md`, the v2 metric
  should land the v23 fixture as:

  | cluster | v1 reach | v2 prediction | expected band |
  |---|---:|---|---|
  | utc → integer_number | 0.002 (rank 6) | absorption≈1, risk≈0 → reachability≈1 | HIGH |
  | gender_code → categorical | 0.100 (rank 1) | absorption≈0.4, risk≈0.3 → reachability≈0.28 | HIGH |
  | alphanumeric_id → categorical | 0.050 (rank 2) | absorption high, risk low → HIGH | HIGH |
  | periodicity → categorical | 0.005 (rank 5) | risk HIGH → LOW | LOW |
  | boolean.binary → integer_number | 0.018 (rank 3) | risk HIGH (binary cols correctly labelled) → LOW | LOW |
  | url → integer_number | 0.010 (rank 4) | absorption low (URL nbrs not integer) → LOW | LOW |

  If the actual v2 scores match these directions cleanly (three
  HIGH above three LOW), the metric ships. If not, ac-04 routes
  to redesign or back to Path C.

  ## Pillar defence

  Pillar 4 (long-running R&D) and Pillar 2 (agent self-learning),
  same defence as the v1 spec. The metric is the substrate every
  Sense retrain depends on; building it once amortises across
  every iteration.

  ## Out of scope

  - Any v24+ Sense retrain (v2 is a precondition, not a trigger).
  - Sharpen-rule design for low-reachability clusters (separate
    follow-up; this spec only flags which clusters need that
    treatment).
  - Re-running the multi-lens corpus pass.
  - Replacing the value-shape embedding with Sense's char-branch
    activations (the redesign memo's alternative; deferred to v3
    if v2 fails its fixture).
  - Adding a training-signal-size dimension to the score (the
    redesign memo's adjunct; deferred — implementations can add
    it as a separate CLI flag, not part of the score itself).

  ## Successor

  If v2 ships, the next retrain spec consumes `report.md`'s
  extended schema with the v2 score and picks clusters above the
  threshold. The relitigation memo's Sharpen-rule candidate becomes
  well-defined: high-reachability clusters whose direction was
  right but whose retrain budget is better spent elsewhere.

  If v2 fails its fixture, the redesign memo's Sense-embedding
  alternative becomes the v3 starting point.
