acceptance_criteria:
- id: ac-01
  description: |
    v2 algorithm ratification + edge-case calls.

    Write `.orbit/specs/2026-05-30-reachability-metric-v2/metric.md`
    that:

      (i) Ratifies the absorption/risk/reachability_v2 formulae from
          the redesign memo verbatim, OR explains any deviation in
          one paragraph with the rationale.

      (ii) Commits to a nearest-neighbour search algorithm. Default
           candidate: down-sample columns.parquet to a 50,000-row
           neighbour pool (reservoir sample, seed 44, stratified by
           ydf_prediction so rare correct_labels stay represented),
           then exact cosine k-NN per cluster column against the
           pool. Alternative: full ANN index (hnswlib) over all
           6.6M columns — names the dependency and the
           index-build budget if chosen.

      (iii) Names the k for nearest-neighbour search (default: 100
            per the redesign memo) and the rationale for any
            deviation.

      (iv) Names the cluster-size floor below which the score is
           emitted as null with an explicit error (default: 5
           columns, same as v1).

      (v) Names the global-neighbour-pool floor below which the
          per-cluster score is null with an error (default: 1000
          columns in the stratified pool for the cluster's
          correct_label; below that, the absorption term is too
          noisy).

      (vi) Names how the per-cluster k-NN search excludes the
           cluster's own columns (file_path + column_name match,
           not just label match — the NN search must not return
           the column being queried).

    `ac_type: doc`.
  gate: false
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    v2 scoring script.

    `scripts/compute_cluster_reachability_v2.py` reads:
      - `eval/gittables/corpus_pass/corroborated_gaps.parquet`
        (cluster definitions)
      - `eval/gittables/corpus_pass/columns.parquet` (per-column
        sample values, sense_prediction, ydf_prediction,
        file_path, column_name)

    For each (fp_label, correct_label) pair across the gaps:
      1. Embed all cluster columns (sense=fp, ydf=correct) and the
         50k stratified neighbour pool (per ac-01 spec).
      2. For each cluster column, k-NN search against the pool
         (excluding cluster columns by file_path + column_name).
      3. Compute absorption_c, risk_c, average to absorption,
         risk, reachability_v2.

    Emit:
      `output/cluster-reachability/cluster_scores_v2.parquet`
        — one row per gap_id, columns:
          gap_id, criterion, mechanism, fp_label, correct_label,
          affected_column_count, n_cluster_columns,
          n_neighbour_pool, absorption, risk,
          reachability_score, error.

    Default invocation runs on the full corroborated-gaps set; a
    `--gap-ids <id1,id2,...>` flag narrows to specific clusters.

    Caches embeddings per (fp_label, correct_label) like v1 — one
    score per pair, applied to every gap_id sharing that pair.

    Close evidence: parquet exists with one row per gap_id in
    `corroborated_gaps.parquet`; absorption/risk/reachability are
    non-null on every row (or carry an explicit error string).

    Closed: `output/cluster-reachability/cluster_scores_v2.parquet`
    carries 64,565 rows (one per gap_id, 878 unique (fp, correct)
    pairs). 63,118 rows non-null reachability; 1,447 rows carry
    error strings (cluster size < 5 or pool < 1000 for the
    correct_label). Coverage improved over v1 (1,447 nulls vs v1's
    24,413) because the stratified pool keeps rare correct_labels
    well-represented.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-03
  description: |
    v23 validation fixture — score the six v23 clusters and check
    against ground truth.

    Run `compute_cluster_reachability_v2.py` with the same six
    `--gap-ids 721b890ea74d,1b858e0d073b,3f2aa8465552,20803deffbad,81b63a52e3ef,cdde5d05b73a`
    on the v22 `corroborated_gaps.parquet`. Emit:

      `output/cluster-reachability/v23_fixture_v2.md`

    The report:
      - Shows reachability_score_v2 per cluster alongside its v23
        outcome AND the v1 score (so the comparison is visible).
      - Names the candidate threshold (midpoint between
        min(HIGH-band) and max(LOW-band) if clean).
      - Records the pre-committed predictions from the redesign
        memo and notes which predictions held vs missed.
      - Tags the verdict as Clean / Near-miss / Mismatch.

    Pre-committed reachability bands (same as v1):
      - **Clean separation** — the three HIGH-expected clusters
        (gender_code, alphanumeric_id, utc) all score above all
        three LOW-expected clusters (boolean.binary, url,
        periodicity). Threshold = midpoint. Ship threshold.
      - **Near-miss** — at most ONE crossover in either direction.
        Threshold = score that minimises classification error.
        Ship with caveat.
      - **Mismatch** — two or more crossovers. v2 doesn't ship;
        ac-04 routes to "redesign v3" via a memo.

    Close evidence: `v23_fixture_v2.md` exists and explicitly tags
    the verdict.

    Verdict: **Mismatch** — six crossovers in the six-cluster
    fixture. Both gender_code → categorical (rank 5) and
    alphanumeric_id → categorical (rank 6, score 0.173) sit below
    all three LOW-expected clusters (boolean.binary 0.856, url
    0.824, periodicity 0.468). The absorption term tracks
    correct_label density rather than cluster specificity, so
    integer_number-target clusters dominate the ranking regardless
    of cluster-specific risk. See
    `output/cluster-reachability/v23_fixture_v2.md`.

    `ac_type: code`.
  gate: true
  checked: true
- id: ac-04
  description: |
    Disposition of the v23 fixture verdict — ship-or-redesign,
    gated by ac-03.

    Path A (Clean) — write
    `output/cluster-reachability/threshold_v2.md` recording the
    threshold value, the six clusters' scores, and the rule for
    future retrain specs: "clusters with reachability_score ≥ T
    are candidates for `training_data_addition`; below T, route to
    Sharpen rule or taxonomy work."

    Path B (Near-miss) — same as Path A but with a `caveats`
    section naming the single crossover and the metric weakness it
    exposes.

    Path C (Mismatch) — write
    `output/cluster-reachability/redesign_memo_v3.md` proposing the
    next iteration. The redesign memo for v1 (currently in repo)
    already names the Sense-embedding alternative as a v3 candidate
    if v2 fails; the v3 memo confirms or refines that direction.

    Close evidence: for A or B, `threshold_v2.md` exists; for C,
    `redesign_memo_v3.md` exists.

    Path C taken. `output/cluster-reachability/redesign_memo_v3.md`
    proposes splitting reachability into safety_score (= 1 - v2's
    risk term) and a per-spec leverage judgement. v3 ships as an
    advisory column rather than a hard gate. Implementation is the
    next spec's work (`2026-05-31-reachability-safety-score` or
    similar).

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-05
  description: |
    Integrate the v2 score into the corroborated-gaps artefact.

    Gated by ac-04 — runs ONLY if Path A or B taken.

    Add a post-processing step (sibling script or extension of
    `scripts/gittables_corpus_pass.py`) so
    `corroborated_gaps.parquet` carries a `reachability_score`
    column populated from `cluster_scores_v2.parquet`.
    `eval/gittables/corpus_pass/report.md` is regenerated to
    include the score in each cluster's header line:

      `Rank #1 — gap_id... — N cols — action: ... — reachability: 0.NN`

    If Path C: this AC closes as "deferred; reachability column
    not added to corroborated_gaps.parquet until v3 metric ships."

    Close evidence: for A/B, `corroborated_gaps.parquet` has a
    `reachability_score` column AND `report.md` mentions it in
    cluster headers; for C, "deferred — see redesign_memo_v3.md"
    note appended.

    Deferred — see `output/cluster-reachability/redesign_memo_v3.md`.
    v2 score does NOT fold into corroborated_gaps.parquet. The
    column is reserved for v3's `safety_score` whenever the next
    spec ships it.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-06
  description: |
    Update CLAUDE.md guidance.

    Path A/B — replace the current
    "`training_data_addition` retrains need a reachability
    pre-flight" paragraph in CLAUDE.md's "Architectural direction
    (settled — do not re-ask)" section with a paragraph naming v2
    as the gate, citing `threshold_v2.md`, and dropping the
    interim "Sense-distribution pre/post check" requirement
    (which v2 now subsumes).

    Path C — extend the existing paragraph with the v3 redesign
    pointer; the interim "Sense-distribution pre/post check"
    requirement STAYS.

    Close evidence: CLAUDE.md paragraph reflects the verdict.

    Closed (Path C): CLAUDE.md's existing
    `training_data_addition` paragraph has been extended to cite
    both the v1 and v2 Path C closures plus the v3 redesign memo;
    the interim Sense-distribution pre/post check requirement
    STAYS until v3 ships.

    `ac_type: doc`.
  gate: false
  checked: true
  ac_type: doc
