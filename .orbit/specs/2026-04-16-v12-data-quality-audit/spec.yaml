id: 2026-04-16-v12-data-quality-audit
status: closed
goal: |
  Audit all 23 v12 misclassifications to determine root cause (model error, training data quality, or eval GT error). Fix GT where evidence justifies it. Produce a retrain brief for v13 if training data issues are found.
acceptance_criteria:
- id: ac-01
  description: |
    Per-item audit table for all 23 v12 misclassifications. Each row includes: dataset, column, v11 prediction, v12 prediction, expected label, v11 confidence, v12 confidence, root cause verdict, and evidence summary.
  ac_type: doc
- id: ac-02
  description: |
    Root cause classification for each item using categories: model_error (model genuinely wrong), gt_error (ground truth label is wrong or debatable), training_collision (types overlap in training data), generator_defect (synthetic generator produces confusable output), data_gap (type has insufficient or unrepresentative training data).
  ac_type: doc
- id: ac-03
  description: |
    Training data inspection for the 4 regressed items plus 8 key confusion pairs. For each regression and high-confusion pair, sample distilled and synthetic examples from each type and report: value overlap rate, distinguishing features, and whether the types are genuinely confusable from the data.
  ac_type: doc
- id: ac-04
  description: |
    Confidence analysis for the 6 persistent errors that increased in confidence. For each, extract the v12 validation features (239-dim) and report which taxonomy types the values pass validation for. Determine whether the validation branch is reinforcing or neutral toward the wrong prediction.
  ac_type: doc
- id: ac-05
  description: |
    GT corrections committed to eval ground truth files where ac-02 verdict is gt_error. Each correction includes a comment explaining the evidence.
  ac_type: code
- id: ac-06
  description: |
    Adjusted v12 score after GT corrections. Report the new label accuracy and domain accuracy with the corrected ground truth.
  ac_type: doc
- id: ac-07
  description: |
    Retrain brief for v13 (if training data issues found in ac-02/ac-03). Lists: specific training data fixes needed, generator changes, distilled data filtering, and expected impact. This brief becomes input for a future /orb:design session.
  ac_type: doc
