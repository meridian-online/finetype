id: 2026-05-29-cluster-reachability-scoring
goal: |
  Score every corroborated-gap cluster from the multi-lens
  diagnostic by whether its columns share a tight enough value-
  shape signature to train on without generalising into
  neighbouring labels — and ship a "safe to train" threshold
  calibrated against the v23 six-cluster ground truth.

  ## Why now

  v23-precision-retrain (spec 2026-05-27) shipped Failed at ac-04.
  The FP-rate component cleanly Met (top-6 corroborated clusters
  dropped −70.8%, three by 92–96%), but the cell-2 component
  Failed: v23 gated cell-2 vs v19 regressed to +5.1% as
  `representation.discrete.categorical` predictions exploded
  +529.6% and pulled ~48,000 v22 `geography.location.city` columns
  into the new categorical bucket. v22's −31.5% country lift
  collapsed.

  The root cause is named in the relitigation memo: the multi-lens
  diagnostic's `report.md` ranks gaps by `affected_column_count`
  and `recommended_action_class` but does NOT measure whether
  training on a cluster will generalise correctly. v23 picked six
  high-volume `training_data_addition` clusters; three were
  reachable (gender_code → categorical, utc → integer_number,
  alphanumeric_id → categorical) and three were not (url, boolean.
  binary, periodicity). The aggregate Met verdict hid the
  unevenness, and the negative transfer landed.

  Every future retrain bet has this blind spot until reachability
  is part of the ranking.

  ## What "reachability" means

  A cluster is *reachable* via `training_data_addition` when:

  1. **Tight value-shape signature.** Columns in the cluster look
     enough like each other that their value distribution forms a
     discriminative training signal (low intra-cluster variance on
     a low-level feature embedding).
  2. **Specific against the correct_label population.** Columns in
     the cluster do NOT look like the broader population of
     columns sharing the cluster's correct_label (high distance to
     other correct_label columns outside the cluster). Without
     this, training Sense on these columns under the correct_label
     teaches the model that "anything looking remotely like this
     family" is the correct_label — which is exactly how v23
     dragged geography into categorical.

  Reachability = tightness × specificity. High → safe to train.
  Low → needs a different intervention class (Sharpen rule,
  taxonomy widening, or out-of-scope).

  ## Pillar defence

  Pillar 4 (long-running R&D). The diagnostic is the substrate
  every future Sense retrain depends on; building reachability
  scoring once amortises across every iteration after v23.

  Pillar 2 (agent self-learning) secondarily. The score becomes
  part of the substrate the next agent reads before recommending a
  retrain spec — replaces "use diagnostic-surfaced clusters"
  guidance with "use clusters above the reachability threshold."

  ## Out of scope

  - Any v24+ Sense retrain (the score is a precondition, not a
    trigger).
  - Sharpen-rule design for low-reachability clusters (separate
    follow-up; this spec only flags which clusters need that
    treatment).
  - Re-running the multi-lens corpus pass (the diagnostic's
    `eval/gittables/corpus_pass/columns.parquet` is the input).
  - Changes to the corroborated-gaps definition or mechanism
    cascade.
  - Real-time integration with the corpus-pass pipeline; v1 ships
    as an offline post-processing step that adds a column to
    `corroborated_gaps.parquet`.

  ## Validation fixture

  The v23 outcome gives us six clusters with ground-truth labels:

  | gap_id | v23 verdict | expected reachability |
  |---|---|---|
  | 721b890ea74d (gender_code → categorical) | Met (−95.7%) | HIGH |
  | 1b858e0d073b (utc → integer_number)      | Met (−92.2%) | HIGH |
  | 3f2aa8465552 (alphanumeric_id → categorical) | Met (−95.8%) | HIGH |
  | 20803deffbad (url → integer_number)      | Flat (0%)    | LOW |
  | 81b63a52e3ef (boolean.binary → integer)  | Flat (−0.8%) | LOW |
  | cdde5d05b73a (periodicity → categorical) | Regressed (+139%) | LOW |

  The score must distinguish the three HIGH from the three LOW on
  the v23 corpus pass. A perfect split is the bar; one Met scored
  Failed or one Failed scored Met is a near-miss the threshold can
  paper over, but two crossovers means the metric is wrong.

  ## Successor

  Once the score ships, the next retrain spec consumes
  `report.md`'s extended schema and picks clusters above the
  threshold. The relitigation memo's "Sharpen rule" candidate
  becomes well-defined: it operates on the high-reachability
  clusters whose direction was right but whose retrain budget was
  better spent elsewhere.
