acceptance_criteria:
- id: ac-01
  description: |
    Reachability metric design document.

    `.orbit/specs/2026-05-29-cluster-reachability-scoring/metric.md`
    spells out, in one short document:

      (i) The feature embedding used to represent a column's
          value-shape signature. Default candidate: char n-gram
          histograms (3-grams over up to 8 sampled values per
          column, length-normalised to a fixed dim), augmented
          with length distribution percentiles and a
          character-class summary (fraction alpha / numeric /
          mixed / symbol). Final choice is the document's call.

      (ii) The distance metric over those embeddings. Default
           candidate: cosine distance (scale-invariant; robust to
           sample-count differences across columns).

      (iii) The aggregation that turns per-column distances into
            two cluster-level scores:
              - `tightness` ∈ [0, 1] — high when intra-cluster
                pairwise distance is low (i.e. columns look like
                each other). Default candidate: 1 − mean pairwise
                distance within the cluster, with epsilon
                smoothing for clusters smaller than 50 columns.
              - `specificity` ∈ [0, 1] — high when columns in the
                cluster are far from columns sharing the same
                correct_label but NOT in the cluster. Default
                candidate: mean distance from each cluster column
                to its k-NN in a sampled-1000 baseline of
                correct_label columns drawn from outside the
                cluster.

      (iv) The combined reachability score:
            `reachability_score = tightness × specificity`,
            clipped to [0, 1]. Other forms (e.g. harmonic mean)
            considered and rejected with a one-line reason.

    The document also names two known threats and how the metric
    addresses them — or doesn't:

      - **Sample-size bias.** Clusters with very few columns
        (<50) have noisier embeddings; the metric should down-
        weight or epsilon-smooth rather than silently lie. If
        v1 doesn't handle this, name it as a v2 follow-up.
      - **Correct_label broadness.** Some correct_labels (e.g.
        `representation.discrete.categorical`) are so broad
        that the baseline sample is itself heterogeneous;
        specificity may underestimate the real overlap. Same
        clause: name it or fix it.

    `ac_type: doc`.
  gate: false
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    Reachability scoring script.

    `scripts/compute_cluster_reachability.py` reads:
      - `eval/gittables/corpus_pass/corroborated_gaps.parquet`
        (cluster definitions)
      - `eval/gittables/corpus_pass/columns.parquet` (per-column
        sample values, sense_prediction, ydf_prediction)

    For each cluster, computes the feature embedding per column,
    aggregates per ac-01's design, and emits:
      - `output/cluster-reachability/cluster_scores.parquet`
        — one row per gap_id, columns:
          gap_id, criterion, mechanism, fp_label, correct_label,
          affected_column_count, tightness, specificity,
          reachability_score, n_baseline_samples.

    Default invocation runs on the full corroborated-gaps set; a
    `--gap-ids <id1,id2,...>` flag narrows to specific clusters
    for the v23 validation fixture.

    Close evidence: parquet exists with one row per gap_id in
    `corroborated_gaps.parquet`; tightness/specificity/
    reachability are non-null on every row (or carry an explicit
    error string explaining why — e.g. "cluster size < 5 columns,
    embedding unstable").

    Closed: `output/cluster-reachability/cluster_scores.parquet`
    carries 64,565 rows (one per gap_id, 878 unique (fp, correct)
    pairs). 40,152 rows carry non-null reachability; 24,413 rows
    carry an explicit error string (dominated by "baseline < 200
    columns" for narrow correct_labels like
    `representation.text.sentence`). The script caches at the
    (fp_label, correct_label) layer — all gap_ids sharing a pair
    receive the same score, since the metric is a property of the
    label-flow direction.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-03
  description: |
    v23 validation fixture: score the six v23 clusters and check
    against ground truth.

    Run `compute_cluster_reachability.py` with
    `--gap-ids 721b890ea74d,1b858e0d073b,3f2aa8465552,20803deffbad,81b63a52e3ef,cdde5d05b73a`
    on the corpus-pass-v22 `corroborated_gaps.parquet`. Emit:

      `output/cluster-reachability/v23_fixture.md`

    The report:
      - Shows reachability_score per cluster alongside its v23
        outcome (Met / Flat / Regressed from the v23 spec).
      - Plots the score distribution (text histogram or sorted
        list — no matplotlib).
      - Identifies the candidate threshold: the value that
        cleanly separates the three Met clusters from the three
        non-Met clusters, if one exists.
      - Records any crossovers (Met clusters below the threshold;
        non-Met above) and what the metric would have to change
        for those to land on the right side.

    Pre-committed reachability bands:
      - **Clean separation** — the three Met clusters all score
        above all three non-Met clusters. Threshold = midpoint
        between min(Met) and max(non-Met). Ship the threshold.
      - **Near-miss** — at most ONE crossover in either
        direction. Threshold = score that minimises classification
        error on the v23 fixture. Document the crossover; ship
        with caveat.
      - **Mismatch** — two or more crossovers. Metric is wrong.
        ac-04 routes to "redesign metric" via a memo, not "ship."

    Close evidence: `v23_fixture.md` exists and explicitly tags
    the verdict as Clean / Near-miss / Mismatch.

    Verdict: **Mismatch** — three crossovers in the six-cluster
    fixture; `datetime.offset.utc → integer_number` (HIGH-expected)
    scored rank 6 / 6 below all three LOW-expected clusters. See
    `output/cluster-reachability/v23_fixture.md`.

    `ac_type: code`.
  gate: true
  checked: true
- id: ac-04
  description: |
    Disposition of the v23 fixture verdict — ship-or-redesign.

    Three mutually-exclusive paths, gated by ac-03:

    Path A (Clean) — write
    `output/cluster-reachability/threshold.md` recording the
    threshold value, the three Met clusters' scores, and the
    three non-Met clusters' scores. Add a one-line interpretation
    rule for future retrain specs: "clusters with
    reachability_score ≥ T are candidates for
    `training_data_addition`; below T, route to Sharpen rule or
    taxonomy work."

    Path B (Near-miss) — same as Path A but with a `caveats`
    section naming the single crossover and the metric weakness
    it exposes. The threshold ships with the caveat; next retrain
    spec must read the threshold AND the caveat.

    Path C (Mismatch) — write
    `output/cluster-reachability/redesign_memo.md` recording
    which two-or-more crossovers occurred and proposing a
    different metric shape (alternative embedding, different
    aggregation, additional features like header n-grams).
    Do NOT ship the threshold. ac-05 closes as "deferred pending
    metric redesign."

    Close evidence: for A or B, threshold.md exists; for C,
    redesign_memo.md exists.

    Path C taken (Mismatch). `output/cluster-reachability/
    redesign_memo.md` proposes a v2 metric (neighbour-label
    composition: per cluster column, fraction of 100 NN whose
    ydf_prediction equals correct_label) with worked predictions
    against the v23 fixture, plus a secondary Sense-embedding
    alternative and a training-signal-size adjunct.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-05
  description: |
    Integrate the score into the corroborated-gaps artefact.

    Gated by ac-04: this AC only runs if Path A or B was taken.

    Modify `scripts/gittables_corpus_pass.py` (or a sibling
    post-processing script — implementer's call) so that
    `corroborated_gaps.parquet` carries the `reachability_score`
    column. Re-run on the existing v22 corpus pass output;
    `report.md` is regenerated to include the score in each
    cluster's header line:

      `Rank #1 — gap_id... — N cols — action: ... — reachability: 0.NN`

    If Path C: this AC closes as "deferred; reachability column
    not added to corroborated_gaps.parquet until ac-04 ships a
    metric that passes the v23 fixture."

    Close evidence: for A/B, the v22 `corroborated_gaps.parquet`
    has a `reachability_score` column; for C, append "deferred —
    see redesign_memo.md" to this spec's notes and close.

    Deferred — see `output/cluster-reachability/redesign_memo.md`.
    v1 reachability_score is NOT folded into corroborated_gaps;
    the column is reserved for whichever v2 metric closes its own
    fixture test. `output/cluster-reachability/cluster_scores.
    parquet` carries the v1 scores as a standalone artefact for
    redesign-memo reference.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-06
  description: |
    Guidance for the next retrain spec.

    Update CLAUDE.md's "Architectural direction (settled — do not
    re-ask)" section with one short paragraph naming reachability
    scoring as a precondition for `training_data_addition`
    retrains. Cite the v23 relitigation_memo.md as the precedent
    and link the threshold doc (or the redesign memo if Path C).

    Close evidence: the doc has a paragraph naming the rule and
    pointing at the threshold (or the redesign memo).

    Closed: CLAUDE.md's "Architectural direction (settled — do not
    re-ask)" section gained a paragraph naming reachability scoring
    as a `training_data_addition` precondition, citing both
    `output/v23-precision-retrain/relitigation_memo.md` and
    `output/cluster-reachability/redesign_memo.md`.

    `ac_type: doc`.
  gate: false
  checked: true
  ac_type: doc
