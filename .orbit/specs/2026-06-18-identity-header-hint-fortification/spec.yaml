id: 2026-06-18-identity-header-hint-fortification
goal: Retrain the identity/person family so the learned multi-branch model carries author/login->username and author/name->full_name from header+value context, unblocking removal of the hardcoded identity header hints (decision 0042); gated by the RHH counterfactual ablation (no_hint identity accuracy >=80%) + drift proxy + gold + corpus-honest.
cards:
- 0020-honest-production-typing
status: open
labels:
- retrain
- header-hint-removal
- identity
acceptance_criteria:
- id: ac-00
  description: |
    RE-BASELINE THE RHH IDENTITY COUNTERFACTUAL ON THE CURRENT MODEL (observation,
    BLOCKING). The April-2026 RHH classification (substring_matcher_identity = model-gap,
    no_hint accuracy 0.000 on 9 hit columns) is stale (measured against v19 pre-0.6.27).
    Re-run scripts/rhh/ac04_counterfactual.py + ac05_classify.py with the CURRENT model
    (rhh-instrumentation build) and record: for the identity header-hint families
    (substring_matcher_identity, and the cross-domain header_hint_* families that target
    identity.person.*), how many eval columns they fire on, and the learned model's
    no_hint label accuracy. This is the bet's STARTING POINT and the gate's baseline. STATE
    the limit: the 448-row manifest is curated/small; the identity hit-count is single
    digits, so this measures the curated gap, not production breadth.
  gate: true
  checked: true
  ac_type: observation
- id: ac-01
  description: |
    DESIGN THE HARD-NEGATIVE COMPOSITION (doc, BLOCKING). The retrain must teach the
    learned branches the header+value CONTEXT, not a flat label. Compose, grounded in
    corpus + generator data:
    (a) author/login header + handle values (high-cardinality single-token handle charset)
        -> identity.person.username;
    (b) author/name header + real-name values (multi-token "First Last") -> full_name
        (the legitimately-correct case the hardcoded hint currently serves);
    (c) hard negatives that must NOT become username: single-token HIGH-distinct name
        columns (country/state/api_name) and low-cardinality vocabularies (the ac-03
        false-positive classes from spec 2026-06-17-full-name-username-veto).
    Positives source: finetype generate (synthetic usernames already exist) + corpus-mined
    Author/login columns. State the over-emission risk: username is already a generic
    catch-all attractor (HARDCODED_GENERIC_LABELS) — training it harder is the 0-for-5
    failure mode. DELIVERABLE: composition memo + counts.
  gate: true
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    DESTINATION-DRIFT PROXY PRE-CHECK (observation, BLOCKING — mandatory, CLAUDE.md).
    Build the candidate FTMB, run scripts/proxy_pretrain.sh (1 seed, ~10 epochs) +
    scripts/drift_report.py (--abs-floor 0.0040 --rel-mult 3.0 --direction up) on the fixed
    file list. NO-GO (exit 1) means DO NOT launch the overnight run — username over-emission
    into neighbours is the specific risk. Record the full-label-space drift verdict.
  gate: true
  checked: false
  ac_type: observation
- id: ac-03
  description: |
    OVERNIGHT RETRAIN (code). On proxy GO, run the overnight multi-branch retrain (3 seeds,
    additive over the v22 boundary blend + the ac-01 identity hard negatives), via /train.
    Pick the best seed by val_accuracy. NOT to be launched until ac-02 is GO.
  gate: false
  checked: false
- id: ac-04
  description: |
    THE GATE — USERNAME/FULL_NAME OUTCOME ON THE RETRAINED MODEL (observation, BLOCKING).
    RE-SCOPED per ac-01 (ac01-composition.md): the family-level ablation is unachievable
    because substring_matcher_identity also carries header-only types (phone/first_name/
    height/weight) with no value signal — those are a separate, deferred problem. So the gate
    is the username RECOVERY outcome, not whole-family deletability:
    (a) gold (--reframe): username precision/recall UP, full_name precision NO-REGRESSION,
        headline no-regression;
    (b) corpus author-column relocation: of the ~108k handle author columns, the retrained
        model emits username (not full_name) at high correctness, AND does not over-emit
        username onto the hard-negative classes (country/state/api_name, low-card vocabs).
    A clean win here makes the author/name ARMS of the hint retargetable (ac-06), not the
    whole family.
  gate: true
  checked: false
  ac_type: observation
- id: ac-05
  description: |
    CORPUS-HONEST GATE (observation, BLOCKING, H05). ISOLATED same-binary baseline vs
    candidate over the 33k stratified sample (fix overnight_username_veto_gate.sh to
    --fill-ydf BOTH passes so the gate's oracle column exists — the gap that blocked spec
    2026-06-17-full-name-username-veto ac-03). Watch username over-emission and any
    untargeted-neighbour relocation. NO-GO is blocking.
  gate: true
  checked: false
  ac_type: observation
- id: ac-06
  description: |
    RETARGET THE AUTHOR/NAME ARMS + RETIRE THE DETERMINISTIC VETO (code). RE-SCOPED per
    ac-01: do NOT delete the whole substring_matcher_identity family (it carries header-only
    types phone/first_name/height/weight that have no value signal — deferred). On ac-04 GO,
    retarget the author/authors/author-name arms (header_sharpen.rs:376) so the learned model
    carries author+handle→username, and REVERT the deterministic full_name_username_veto
    (spec 2026-06-17-full-name-username-veto) — it was the stopgap for the semantic problem
    the retrain now owns. Re-run the full suite + corpus-honest gate to confirm no regression.
    File the whole-family deletion (phone/height/weight value-learnability) as a separate
    follow-up. CHANGELOG entry; leave for the next /release binary.
  gate: false
  checked: false
