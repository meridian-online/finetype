id: 2026-04-21-v18-retrain
status: closed
goal: |
  Train and promote a sherlock-v18 model that improves v16's accuracy on the expanded 352-column eval corpus (v16 baseline: 297/352 = 84.4% label / 91.8% domain), without regressing v16's domain accuracy or triggering concentrated per-domain regressions. Fix the sweep data-prep waste inherited from v16/v17 by pinning a single data seed and reusing one `.ftmb` across all training seeds.
acceptance_criteria:
- id: ac-01
  description: |
    Triage discovery complete. `.orbit/specs/2026-04-21-v18-retrain/triage.md` exists and enumerates every v16 misclassification on the expanded 352-col eval (~55 columns). Each row tagged with `dataset, column_name, gt_label, v16_label, error_category, proposed_lever` where `error_category ∈ {short-string-collapse, sibling-context-pull, label-confusion, taxonomy-gap, data-gap, validator-ambiguity, other}` and `proposed_lever ∈ {add-data, fix-label-remap, add-sharpen-rule, retrain-only, taxonomy-add, investigate-further}`. Per-domain summary table included (domain: failure count, top error categories). Input SHAs pinned — `triage.md` header records the git SHAs of `eval/eval_output/profile_results.csv` and `eval/datasets/manifest.csv` used to compute the failure set (either commit SHA of the repo at triage time, or `sha256:<hex>` content hashes of the two files). Verification replays against those pinned inputs, not live files.
- id: ac-02
  description: |
    Sweep script skeleton + prep-script instrumentation. Two code deliverables: (a) `scripts/sweep_v18.sh` (new file, copy+modify of `sweep_v17.sh`) invokes `prepare_multibranch_data.py` once with a pinned `--seed 42` and writes output to `output/multibranch-training/v18.ftmb`, then invokes `cargo run -- train-multi-branch` three times with `--seed {42,43,44}` pointing at the same `.ftmb`. The FTMB is NOT cleaned up between training runs (only after all 3 complete). (b) `scripts/prepare_multibranch_data.py` is patched to emit the seven required log markers for ac-04 and ac-05: `corpus_base: <path>`, `pre_filter_rows: N`, `row_hash_overlap: N`, `post_filter_rows: N`, `hash_filter_active: true`, `leaked_rows_after_filter: N`, `eval_hash_table_sha256: <hex>`, `n_sibling_headers: N`. Markers are emitted unconditionally (even on zero-overlap runs) so ac-04 verification can detect a silently-disabled firewall from marker absence.
  ac_type: code
- id: ac-03
  description: |
    Corpus base decision committed as MADR. New decision file at `.orbit/choices/0060-v18-corpus-base.md` (pre-assigned to avoid race with ac-08 → 0061). Records the corpus choice (v3, v4, or v4+additions) with explicit citations to triage.md evidence. If corpus base includes v4 assets, MADR also records (a) rebase status of `distilled-data-relabel-7-types-v17` onto current main (clean / required-merge-resolutions-listed), and (b) any `prepare_multibranch_data.py` conflicts resolved. Status `accepted` before prep runs.
  ac_type: doc
- id: ac-04
  description: |
    Row-hash firewall verified as ACTIVE (not just "ran with zero overlap"). Before training, the prep invocation logs five distinct fields in order: (a) `corpus_base: <path>`, (b) `pre_filter_rows: N`, (c) `row_hash_overlap: N`, (d) `post_filter_rows: N`, (e) `hash_filter_active: true`. The sentinel assertion `pre_filter_rows - row_hash_overlap = post_filter_rows` must hold — any other arithmetic indicates the filter did not run. Overlap > 0 is permitted only if `post_filter_rows > 0` AND `leaked_rows_after_filter: 0` appears in a subsequent log line (computed by re-hashing post-filter rows against the eval hash table). `leaked_rows_after_filter` must be logged UNCONDITIONALLY — even on zero-overlap runs — as a defence-in-depth signal that the filter actually ran (not just arithmetically no-oped). The SHA256 of `eval/row_hashes.tsv` loaded by the prep run must also be logged as `eval_hash_table_sha256: <hex>`. The instrumentation that emits these markers is implemented at ac-02; ac-04 verifies their presence in the runtime log.
  ac_type: code
- id: ac-05
  description: |
    3-seed sweep executes cleanly. All 3 training runs reuse `output/multibranch-training/v18.ftmb`. Per-seed artefacts at `models/sherlock-v18-seed-{42,43,44}/` — six files each: `results.json`, `epochs.jsonl`, `config.json` (including injected `type_index_keys`), `model.safetensors`, `label_map.json`, and a per-seed eval report at `models/sherlock-v18-seed-{SEED}/eval/report.md` written by invoking `eval/profile_eval.sh` (or equivalent) against that seed's model with `FINETYPE_MODEL=models/sherlock-v18-seed-{SEED}`. The wrapper invocation is part of `scripts/sweep_v18.sh` (ac-02). Summary CSV at `results/sweep-v18-summary.csv` with 3 data rows + header. Sibling-context data present in the FTMB: prep log reports a non-zero `n_sibling_headers` across table groups (FTMB v3 payload — `sibling_headers` field per `crates/finetype-train/src/multi_branch.rs`). Sibling-context verification does NOT require a config.json key — the multi-branch model's config does not carry sibling-context metadata; sibling context travels in the FTMB payload.
  ac_type: code
- id: ac-06
  description: |
    Training gate (decision 0053) passes for at least one seed. At least one of the three seeds achieves `val_accuracy ≥ 0.88` (floor). All three below floor is a halt condition: the spec is marked HALTED (not retried in-session) and `progress.md` documents structured investigation hypotheses before any retry sweep is authorised in a follow-up spec. HALT transition is observable via two signals: (a) `progress.md` contains a "Halt investigation" section with the required hypothesis schema, AND (b) `drive.yaml` `status` field is set to `halted` (no further stage transitions in this drive).
- id: ac-07
  description: |
    Promotion gate cleared. Winner seed's expanded-eval score `≥ 297/352` AND per-domain regression count `≤ 3` in every one of the 7 taxonomy domains (container, datetime, finance, geography, identity, representation, technology). Winner selection: highest profile-eval score > highest val_acc > lowest seed number. The flat `≤ 3` floor is a deliberate trade-off — in small domains (e.g. container, ~4-10 eval cols) this is a loose floor, in large domains (e.g. datetime, ~80 eval cols) it is tight; chosen for simplicity over scaling. Gate semantics are strict: if the selected winner (by tie-break) fails the per-domain regression floor, the sweep outcome is HELD regardless of other seeds' scores — candidate re-selection down the tie-break order is NOT permitted. The tie-break decides the evaluation target; the gate decides promotion. Per-column v16→v18 diff emitted at `.orbit/specs/2026-04-21-v18-retrain/v16-v18-diff.md` with four sections: fixes, regressions (domain-tagged), persistent-failures, per-domain summary.
- id: ac-08
  description: |
    Data-seed-discipline MADR committed. New decision file at `.orbit/choices/0061-sweep-data-seed-discipline.md` (pre-assigned to avoid race with ac-03 → 0060). Captures the rule "prep runs once per sweep with fixed data seed; training seeds vary training randomness only." References v17 sweep measurements (~60 min + 1.9 GB waste) and cites v18 as the first adopter.
  ac_type: doc
- id: ac-09
  description: |
    v18 outcome MADR committed. New decision file at `.orbit/choices/0062-v18-outcome.md`. Status `accepted`. If promoted: records corpus base, winner seed, eval delta, release PR reference, and a per-column fixes/regressions breakdown. If held: records hold reason (e.g., per-domain regression or net-zero outcome), specifies v4 artefact disposition, and includes a per-column fixes/regressions breakdown so the hold is auditable. If halted (ac-06 HALT triggered before eval): records the halt investigation hypotheses from `progress.md`, names the v4 artefact disposition, and explicitly notes that no per-column breakdown exists because no eval ran.
  ac_type: doc
- id: ac-10
  description: |
    Release scope decided and recorded. `handover.md` exists at the spec path and names one of {v0.6.18 shipped, internal promotion only, held}. HuggingFace upload, `FINETYPE_CI_MODEL` bump, and `models/default` flip mechanics are explicitly out-of-scope for this spec — they are delegated to the release skill / a subsequent release card once this gate is cleared. This spec's gate is the decision record, not the mechanics.
