id: 2026-06-11-categorical-identifier-recall-retrain
goal: |
  First gold-era retrain: recover the two largest recall pools the gold corpus
  measured — representation.discrete.categorical (recall 0.386, 62 FN of 101)
  and representation.identifier.alphanumeric_id (recall 0.111, 48 FN of 54) —
  with a curated positive-addition blend on the multi-branch v19 lineage
  (candidate sherlock-v27-recall), judged end-to-end by the choice-0095
  promotion order. The two pools are 110 of the ~296 remaining gold misses
  against the post-0.6.27 baseline (635/931 = 0.682); recovering half is worth
  roughly +5.5pp headline.

  ## Mechanism diagnosis (measured at design time, 2026-06-11)

  The two miss-pools fail by DIFFERENT mechanisms — the blend must address
  each, and the gates must watch each:

  **alphanumeric_id — exotic-tight-code assertion, then veto-to-unknown.**
  32 of 48 gold FNs land on `unknown`: Sense asserts geography.index.h3 (17)
  or technology.cryptographic.hash (8) on generic id columns (msg_id, link_id,
  wfo_id…), the validation veto correctly rejects, and the column falls to
  unknown instead of alphanumeric_id. The remaining 16 are absorbed by tight
  code validators (url, isbn, eu_vat, uuid, sedol, cusip, dea). Corpus mirror
  of the same mechanism in output/ydf-validation-gate/v19_gated.parquet:
  17,518 hash + 3,625 h3 sense assertions, plus ~8.8k ydf-gated-alnum columns
  where sense lands on geohash/cusip/sedol/hcpcs/url/unlocode. Root cause is
  trainable: the model lacks generic-id positives, so id-shaped strings snap
  to whichever tight code is nearest and die at the veto.

  **categorical — scatter into adjacent text/code labels.** 62 gold FNs spread
  across word (10), ordinal (6), entity_name (6), iata_code (5), unknown (5),
  city (4), http_method (3)… on classic vocabulary headers (type, status,
  class, team_abbreviation). Corpus mirror: the reachability scoring already
  ranked the categorical-direction clusters — the tld→categorical bucket is
  HIGH safety (0.972, 87k cluster columns; short status/type vocabularies
  misread as TLDs) and a MODERATE tail (safety 0.5–0.73) totals ~71k affected
  columns. (Latdec ac-01 established the corpus diagnostic's predictions ARE
  v19's, so these pools are the shipped model's own mistakes — no re-baseline
  needed for mining.)

  ## Why this is safe to attempt NOW — and why it nearly wasn't

  This is the first RECALL-direction retrain since v23, and v23 is the exact
  cautionary precedent: it pushed columns INTO categorical, exploded the label
  +529.6% and ate ~48,000 city columns. Four things are different:

  1. **Curated mining, not cluster-dumping.** Positives come only from
     safety-scored clusters (HIGH first, MODERATE allowed with the pre/post
     check per the advisory bands), with an explicit exclusion ledger for the
     known blast paths: geography.location.city (19,845 cols in the
     ydf=categorical pool), iata_code (19,335), identity.person.full_name
     (92,826) and all geography/identity-adjacent buckets are EXCLUDED from
     categorical positives regardless of what the ydf lens says — gated-YDF is
     a mining lens, wrong in 42.1% of contested assertions, never an
     adjudicator.
  2. **Destination-drift proxy pre-check** (mandatory, blocking) — calibrated
     on v23's exact failure mode, full-label-space band, runs BEFORE the
     overnight spend.
  3. **Corpus-honest gate post-train** (blocking, H05) — the only instrument
     that catches relocation, with over_emit/collapse/oracle_fp bands that are
     oracle-aware as of 0.6.24.
  4. **The gold corpus adjudicates** — per-label precision/recall with Wilson
     CIs against human-verified truth, not a proxy oracle.

  ## Promotion order (choice 0095, in full)

  gold-anchor efficacy → drift proxy (pre-train, blocking) → gold corpus
  headline + rare-type scoreboard → corpus-honest gate (blocking) → swap via
  the release runbook. The mandatory post-train Sense-distribution check runs
  alongside; no headline ever overrides a blocking NO-GO. Training blend must
  pass the leakage firewall (make leakage-guard; row-hash dedup vs
  eval/row_hashes.tsv, gold rows excluded — choice 0056).

  ## Out of scope

  - The legacy label `representation.alphanumeric.alphanumeric_id` emitted by
    hardcoded paths in crates/finetype-model/src/column.rs (~4479–4688) — a
    non-taxonomy string that cost ≥1 gold column and carries 686 ydf-gated
    corpus columns. Routed to spec 2026-06-10-deterministic-layer-audit as a
    ledger entry; fixing it is deterministic-layer work, not retrain work.
  - geography.location.state_code (P=R=0.000) — wholly unhandled family,
    taxonomy-gap ledger territory, not reachable by adding positives to
    existing labels.
  - A 0094-style Sharpen fallback ("veto-rejected tight code on id-shaped
    values → alphanumeric_id"). It is the cheaper fallback if this retrain
    NO-GOs twice (decision 0038 prefers retraining; 0048 requires any such
    rule be value-based). Recorded here so the fallback starts informed; not
    built in this spec.
  - Promotion/HuggingFace publish mechanics — the release runbook is a
    separate deliberate action; ac-07 records the GO/NO-GO and evidence only.

  ## Pre-committed halt conditions

  - Proxy NO-GO (ac-03): re-scope the blend ONCE (drop the riskiest bucket,
    re-run proxy). A second NO-GO closes the spec Failed-informative — do not
    relax the band, do not spend the overnight run.
  - Corpus-honest NO-GO (ac-06): blocking, final for this candidate. Record
    the transition table; the negative result seeds the fallback Sharpen spec.
