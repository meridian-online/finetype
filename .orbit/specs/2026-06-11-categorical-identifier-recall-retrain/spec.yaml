acceptance_criteria:
- id: ac-01
  description: |
    Blend sources mined and CURATED, with the exclusion ledger recorded. From
    output/ydf-validation-gate/v19_gated.parquet deliver two positive pools:
    (a) alphanumeric_id positives — columns where sense asserts
    h3/hash/iso6346-class tight codes or where ydf_gated=alphanumeric_id with
    sense on geohash/cusip/sedol/hcpcs/url/unlocode, value-spot-checked
    (sample ≥20 columns per bucket, confirm id-shaped values, not genuine
    hashes/geohashes); (b) categorical positives — drawn ONLY from
    safety-scored clusters ≥0.50 (HIGH tld→categorical bucket first), each
    bucket value-spot-checked for genuine low-cardinality vocabularies. The
    exclusion ledger names every bucket dropped and why (city, iata_code,
    full_name, all geography/identity-adjacent buckets — v23 blast paths).
    Record per-bucket counts and per-label addition caps relative to the v19
    training set so neither label's training mass moves more than the blend
    memo justifies.
    CLOSED 2026-06-11: scripts/mine_v27_recall_positives.py -> 4,754 rows
    (2,094 alnum across A1-A5, 2,660 categorical across B1-B5), value-based
    curation (categorical: n_distinct<=12 + repetition; ids: distinct>=0.7 +
    letter-digit mix), 756 gold file shas excluded, exclusion ledger in
    output/v27-recall-retrain/mining_manifest.json, spot-check tables
    reviewed (B2_word species-name contamination removed by the cardinality
    filter). Memo: output/v27-recall-retrain/blend_memo.md.
  gate: true
  checked: true
- id: ac-02
  description: |
    Blend built on the existing prepare/blend tooling
    (scripts/overnight_v24_numeric.sh / overnight_latdec.sh lineage,
    parameterised as scripts/overnight_v27_recall.sh — not forked). Leakage
    firewall passes: make leakage-guard green, row-hash dedup vs
    eval/row_hashes.tsv, zero overlap with eval/gold/gold_corpus_v1.tsv rows.
    Blend composition memo records: positives added per label, buckets used,
    true-label examples retained for every excluded neighbour (city, iata,
    tld, word, entity_name keep their existing training mass — recall there
    must not be the price).
  gate: false
  checked: false
- id: ac-03
  description: |
    Destination-drift proxy pre-check GO — the binding pre-train gate. Run
    scripts/proxy_pretrain.sh on the v27 blend FTMB vs the v19 baseline
    snapshot (shared fixed file list), then scripts/drift_report.py with the
    calibrated band (--abs-floor 0.0040 --rel-mult 3.0 --direction up).
    Watch in particular (informational — the full-label band is what gates):
    representation.discrete.categorical (v23's +529% precedent),
    representation.identifier.alphanumeric_id over-emit, and the excluded
    neighbours (city, iata_code, word, entity_name, tld). GO authorises
    ac-04; NO-GO triggers the pre-committed re-scope-once halt path. Record
    verdict, wall-clock, top movers.
    ROUND 1 (2026-06-11): NO-GO — categorical 1.71% -> 9.86% (+8.15pp,
    5.76x, band 3x), absorbing comma_separated (0.00x), word (0.07x), tld
    (0.04x), entity_name, plain_text. city HELD (0.76x — exclusion ledger
    worked); alphanumeric_id +1.54pp at 2.99x, just inside the band.
    30-min proxy spend; output/destination-drift-precheck/
    proxy_drift_v27-proxy.json. Pre-committed re-scope executed:
    categorical cap 3400->1700, B2_word bucket dropped (mined 4,054 rows).
    Round 2 is the LAST attempt — a second NO-GO closes Failed-informative.
  gate: true
  checked: false
  ac_type: observation
- id: ac-04
  description: |
    Full overnight 3-seed run + gold corpus scoring (only if ac-03 = GO).
    Train sherlock-v27-recall at full depth, score the best seed end-to-end
    (real Sense→Sharpen pipeline, 0.6.27 Sharpen surface) via
    scripts/score_gold_anchor.py build-gold → predict → score. Success bands
    vs the post-patch baseline (635/931 = 0.682,
    output/postal-veto/metrics_v19-postal-veto_2026-06-10.tsv):
    categorical recall ≥ 0.55 (from 0.386) with precision ≥ 0.80 (from
    0.867); alphanumeric_id recall ≥ 0.45 (from 0.111) with precision ≥
    0.80; headline ≥ 0.70; NO label with support ≥ 10 loses more than 5pp
    precision or recall (watch integer_number, city, word, plain_text,
    country_code, url, isbn). Record the full per-label table vs baseline.
  gate: false
  checked: false
  ac_type: observation
- id: ac-05
  description: |
    Mandatory post-train Sense-distribution check + rare-type scoreboard.
    Full-label-space drift report on the real run's snapshot vs v19 (same
    fixed file list as ac-03) — confirm the proxy's GO held at full
    convergence; any divergence is a calibration finding logged against the
    proxy's forward-use track record (currently 1-for-1 from latdec era).
    Run the rare-type scoreboard (spec 2026-06-09 instrument, validated
    99.0%) and record it alongside.
  gate: false
  checked: false
  ac_type: observation
- id: ac-06
  description: |
    Corpus-honest gate GO — blocking (H05). Score the candidate's predictions
    on the ac-01 stratified sample (scripts/corpus_honest_gate.py vs the
    stable v19 gated-YDF oracle, oracle-aware bands). A NO-GO blocks the
    models/default swap regardless of the gold headline — no headline
    overrides a blocking NO-GO. If this candidate clears with a genuine GO,
    that is ALSO the gate's first true GO-precision validation (its one open
    scope limit) — record that explicitly either way.
  gate: true
  checked: false
  ac_type: observation
- id: ac-07
  description: |
    Promotion decision recorded. Judge sherlock-v27-recall against the full
    0095 instrument table (gold anchor, proxy, gold corpus + scoreboard,
    corpus-honest gate, Sense-distribution check) and emit an explicit
    GO/NO-GO to promote to models/default. If GO, the publish runs via the
    release runbook as a separate deliberate action. If NO-GO, record which
    instrument killed it and what the blend re-scope or the 0094-style
    Sharpen fallback should learn from it.
  gate: false
  checked: false
  ac_type: doc
