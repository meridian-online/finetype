id: 2026-06-12-veto-shape-fallback
goal: |
  Recover the veto→unknown gold miss-pool with a value-based Sharpen-stage
  fallback: when the validation veto HARD-rejects a Sense assertion, decide
  from the column's value shape whether the column is a generic identifier
  (high-cardinality, letter+digit values → representation.identifier.
  alphanumeric_id) or a residual vocabulary (low-cardinality, repeating →
  representation.discrete.categorical) instead of unconditionally demoting
  to unknown. Gold-gated like the postal header-veto (0.6.27): gold
  no-regression + corpus-honest GO before ship.

  ## Why this and not the retrain

  Spec 2026-06-11-categorical-identifier-recall-retrain closed
  Failed-informative: two destination-drift proxy NO-GOs proved categorical
  trained as a flat-softmax shape class is a presence-driven attractor (5.76x
  and 6.22x over-emission; an 8x training-mass cut made it WORSE — memory
  categorical-is-a-residual-category). The gold-measured recall mechanism is
  a PRECEDENCE decision: Sense asserts a tight code (h3 x17, hash x8 on the
  gold alnum pool), the veto rightly rejects it, and the column dies to
  unknown because nothing expresses "tight assertion failed; what residual
  shape fits?". That is Sharpen-stage logic per the v27 report's ranked next
  bets. Value-based per decision 0048; author greenlit 2026-06-12.

  ## Mechanics

  finetype-core/src/validation_veto.rs gains veto_shape_fallback(values):
    - id-shape:    n>=3, distinct_ratio>=0.7, >=60% of values contain both a
                   letter and a digit -> alphanumeric_id
    - vocab-shape: n>=4, 2<=n_distinct<=12, distinct_ratio<=0.6 -> categorical
    - else None (unknown, unchanged)
  Both cmd_profile veto call sites consume it; fallback label never equals
  the vetoed label (guard); fallback recorded in disambiguation_rule as
  veto_fallback:id / veto_fallback:vocab; validation_vetoed and vetoed_type
  stay truthful (the veto DID fire). FINETYPE_NO_VETO_FALLBACK=1 disables.

  ## Expected movement (sized from gold predictions, post-0.6.27 baseline
  635/931 = 0.682)

  Directly targets the 32 alphanumeric_id and ~5 categorical gold FNs whose
  pipeline output is unknown via the veto path: ~+30 columns if the shape
  filters hit, headline -> ~0.71, alnum recall 0.111 -> ~0.6-0.7. The
  categorical scatter pool (~55 FNs that never touch the veto) is OUT of
  scope — re-assessed against the new baseline after this ships.

  ## Risks and how the gates see them

  Flipping veto-demoted unknowns into assertions at corpus scale is exactly
  what the corpus-honest gate's oracle-aware bands measure (over_emit /
  oracle_fp on CREATED transitions). Gold watches alnum precision (0.857
  must hold >=0.80) and categorical precision (0.867). A corpus-honest NO-GO
  blocks the ship regardless of the gold headline (H05).
