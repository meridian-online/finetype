id: 2026-03-25-training-tui-improvements
goal: |
  Ship a standalone TUI demo mode for visual verification, batch-level loss charts to eliminate the dead-screen problem during epochs, and a panic hook guard for terminal safety during overnight training runs.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: AC-1
  description: |
    Standalone demo binary renders one frame of the TUI to the alternate screen with realistic data in all four panels (title, charts, epoch table, progress bar), then exits cleanly to the normal screen. Entry point: pub fn run_tui_demo() exported from tui_impl, called by the demo binary.
  gate: false
  checked: false
- id: AC-2
  description: |
    TrainingRenderer::on_batch_end signature extended with batch_loss: f32. RenderMsg::BatchEnd includes batch_loss field. RenderState accumulates batch losses into batch_loss_history: Vec<f64> for the current epoch. Vec is cleared in the RenderMsg::EpochEnd handler (render thread side). multi_branch.rs call site passes loss_val through on_batch_end.
  gate: false
  checked: false
- id: AC-3
  description: |
    Loss chart displays a single batch-level loss sparkline replacing the previous two epoch-level sparklines (train + val). During epoch 0, the chart shows live batch losses instead of "Waiting for first epoch...". Val loss appears in the legend (from epoch_history) and epoch table only.
  gate: false
  checked: false
- id: AC-4
  description: |
    Panic hook guard installed in render_loop for training-thread panics: saves original panic hook, installs wrapper that calls LeaveAlternateScreen, restores original on clean exit. Scope: training-thread panics only — render-thread panics are handled by the existing error path in the thread::spawn closure.
  gate: false
  checked: false
- id: AC-5
  description: |
    Existing overnight training pipeline works unmodified — LogRenderer compiles, TuiRenderer still accepts all TrainingRenderer trait calls, no regressions.
  gate: false
  checked: false
