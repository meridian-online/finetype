id: 2026-03-13-disambiguator-spike
goal: |
  Investigate whether a learned disambiguator can replace the hardcoded rule cascade (75+ header hints, 5 feature rules) in FineType's column classification pipeline. The spike produces evidence and a recommendation, not shipped code. Immediate action: remove the harmful "id" → increment header hint.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: AC-1
  description: |
    Remove the "id" | "identifier" → increment hardcoded header hint from column.rs. The model should classify "id" columns based on values, not header assumption.
  gate: false
  checked: false
- id: AC-2
  description: |
    Extract per-column disambiguation inputs for all 174 profile eval columns: 36-dim aggregated features (mean, variance, min, max = 144 values), header embedding (Model2Vec), vote distribution (top-K types + fractions), and ground truth label.
  gate: false
  checked: false
- id: AC-3
  description: |
    Extract the same disambiguation inputs for the earthquake dataset's 22 columns with manually annotated ground truth labels.
  gate: false
  checked: false
- id: AC-4
  description: |
    Train a logistic regression disambiguator on the extracted features. Report accuracy, per-domain accuracy, and comparison against the current rule cascade (which columns flip correct/incorrect).
  gate: false
  checked: false
- id: AC-5
  description: |
    Train a shallow MLP (1–2 hidden layers, ≤64 units) disambiguator. Compare against logistic regression and the rule cascade.
  gate: false
  checked: false
- id: AC-6
  description: |
    Identify the top 10 most predictive features for disambiguation using feature importance (coefficients for logistic regression, permutation importance for MLP).
  gate: false
  checked: false
- id: AC-7
  description: |
    Analyse failure modes: which columns does the learned model get wrong that rules get right, and vice versa? Categorise by: header hint dependent, feature dependent, vote distribution dependent.
  gate: false
  checked: false
- id: AC-8
  description: |
    Assess whether 174 columns is sufficient training data or whether supplementary data (LLM distillation's 5,359 columns, synthetic generation) would be needed for a production disambiguator.
  gate: false
  checked: false
- id: AC-9
  description: |
    Produce a findings document with a clear recommendation: proceed with learned disambiguator (and which architecture), or keep rules with targeted fixes, or hybrid approach.
  gate: false
  checked: false
- id: AC-10
  description: |
    If recommending a learned disambiguator: outline the implementation plan including training data strategy, model format, integration points in column.rs, and taxonomy YAML header_patterns migration.
  gate: false
  checked: false
