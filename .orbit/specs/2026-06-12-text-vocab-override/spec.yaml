id: 2026-06-12-text-vocab-override
goal: |
  Recover the text-family slice of the categorical scatter pool with a
  value-based Sharpen rule (R32): when Sense's final label is
  representation.text.{word,entity_name,plain_text} but the column is a
  small repeated vocabulary (n>=4, 2<=n_distinct<=12, distinct_ratio<=0.6),
  override to representation.discrete.categorical. Text labels carry no
  validators, so neither the validation veto nor schema_fail_demotion can
  ever correct them — this is the missing correction for the no-validator
  family, sibling to the 0.6.28 veto shape-fallback.

  ## Scope drawn by measurement (both-sides test, 2026-06-12, post-0.6.28
  baseline 662/931 = 0.711)

  Of 61 remaining gold categorical FNs, 19 land on the three text labels.
  The cardinality rule fires on ZERO correctly-labelled gold text columns
  (word/entity_name/plain_text — clean other side) but MISFIRES on
  geography: 4/17 true-city and 1/6 true-region columns are legitimately
  low-cardinality vocabularies (hub cities, office locations). So the rule
  is scoped to the TEXT family only; geo/code/sibling destinations (city,
  region, state, iata, country_code, ordinal, http_method, smiles) are
  EXCLUDED and their ~25 FNs accepted as out of scope. http_method
  especially: a TRUE http-method column is itself a small vocabulary —
  value shape cannot separate it; that miss belongs to a future 0094
  header-corroboration decision, not this rule.

  Honest sizing: +8 confirmed hits, up to +14 with runtime value coverage
  (the diagnostic used truncated parquet samples; the rule sees full
  sampled values). Headline 0.711 -> ~0.72.

  ## Protocol

  Same as 0.6.27/0.6.28: gold no-regression (blocking) + corpus-honest GO
  (blocking, H05) before ship as 0.6.29. Watch labels at gold: word /
  entity_name / plain_text recalls (already weak; the rule must not eat
  their true columns — measured zero-fire on that side), categorical
  precision (0.851).
cards:
