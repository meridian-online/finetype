acceptance_criteria:
- id: ac-01
  description: |
    R32 text_vocab_override implemented in value_sharpen (column.rs), scoped
    to exactly word/entity_name/plain_text, with unit tests: vocab column
    asserted word -> categorical; species-name list (distinct) -> no fire;
    constant column -> no fire; city label -> out of scope (no fire path).
    cargo test + clippy -D warnings green.
    CLOSED 2026-06-12: R32 in value_sharpen (column.rs) + 4 unit tests;
    432 model tests pass; clippy clean.
  gate: false
  checked: true
- id: ac-02
  description: |
    Gold re-score vs 0.6.28 baseline (662/931 = 0.711): headline strictly
    improves; categorical recall improves with precision >= 0.80; word /
    entity_name / plain_text lose NO true-positive rows (their recalls hold
    or improve); no label with support >= 10 loses more than 5pp precision
    or recall.
    CLOSED 2026-06-12: headline 662 -> 674 (0.711 -> 0.724, CI 0.694-0.752).
    categorical R 0.396 -> 0.515 with P 0.851 -> 0.881 (BOTH improved);
    entity_name P 0.385 -> 0.455 and plain_text P 0.667 -> 0.889 (their FPs
    were the re-routed columns); zero text-family TPs lost; zero >5pp
    regressions. Tables: output/gold-corpus/
    metrics_v19-textvocab_2026-06-12.tsv.
  gate: true
  checked: true
  ac_type: observation
- id: ac-03
  description: |
    Corpus-honest gate GO (BLOCKING, H05) on the stratified sample with
    oracle-aware bands. NO-GO blocks the ship regardless of ac-02.
    ROUND 1 (broad text-family rule): NO-GO — 47,785 oracle-refuted moves;
    entity_name (3,752 observed) and plain_text (2,115) columns are
    genuinely entities/prose at corpus scale. Re-scoped to word-only (gold
    +7 instead of +12 — the 5 columns given back were the price of 5,867
    corpus errors).
    ROUND 2 (word-only): raw over_emit 3.152x tripped by STACKING (0.6.28's
    passed 2.61x + R32's increment) with oracle-refuted count 1,154 =
    identical to the passed baseline. Author-accepted amendment: over_emit
    made composition-aware (nets oracle-CONFIRMED growth; adj_ratio 2.26x).
    Verdict preservation re-run: v19self GO, latdec NO-GO, 0.6.28 GO,
    broad-R32 STAYS NO-GO (negative control — relocation still caught),
    word-R32 GO. v22/v23 preserved analytically (oracle_fp legs untouched;
    their growth was refuted, not confirmed). Doc:
    output/corpus-honest-gate/refined/composition_aware_over_emit.md.
    FINAL: GO.
  gate: true
  checked: true
  ac_type: observation
