id: 2026-06-18-minilm-encoder-build
goal: 'Build a fine-tuned all-MiniLM-L6-v2 contextual encoder as a low-band escalation path for the Sense pipeline — to crack the semantic over-emission mass the static Model2Vec encoder can''t (PA→country_code, Si→region). Fail-cheap order: confirm Rust/candle latency holds BEFORE training, catch the residual-attractor on gold+repr BEFORE corpus-scale work, and let the corpus-honest relocation gate (which killed 0-for-6 retrains) be the arbiter. A blocking NO-GO is a legitimate documented outcome, not a spec failure.'
cards:
- 0002-semantic-type-detection
- 0020-honest-production-typing
status: open
labels:
- build
- encoder
- minilm
acceptance_criteria:
- id: ac-00
  description: |
    RUST/CANDLE LATENCY PROBE — speed must hold in Rust BEFORE any training (code, BLOCKING,
    the cheapest kill). Load OFF-THE-SHELF all-MiniLM-L6-v2 in candle (candle-transformers BERT
    + the tokenizers crate loading tokenizer.json + safetensors weights — all already workspace
    deps; finetype-model is already a candle crate), mean-pool, and measure CPU per-column
    latency on a column-text sample ("header: <h> | values: <v…>"). The Python/torch probe showed
    6.7 ms/col; confirm candle holds the ≤10 ms low-band ceiling (ac-00 budget of the discovery).
    Confirm it is embeddable + offline + DETERMINISTIC (identical vectors across runs). Try int8
    quantisation if needed. DELIVERABLE: a working candle MiniLM inference path + measured Rust
    ms/col vs the 10 ms budget. If Rust latency blows the budget and quantisation can't recover it,
    NO-GO here — before a single training run is spent.
  gate: true
  checked: false
  ac_type: code
- id: ac-01
  description: |
    FINE-TUNE THE ENCODER with PRECEDENCE-AWARE residual training (code). Fine-tune
    all-MiniLM-L6-v2 + a classification head on the type task using the SAME substrate the
    multi-branch uses (the generator + distilled data), on the "header + values" representation.
    CRITICAL (the 0-for-6 defence, discovery ac-03): the residual must be trained as an explicit
    DECISION, not a frequency sink — class-balancing and/or an explicit "no-specific-type" abstain
    outcome and/or precedence semantics (decision 0096), NOT plain additive fine-tuning that
    broadened catch-alls six times. Lower-friction route: fine-tune in PyTorch (mature LoRA /
    head tooling), export safetensors for the candle path from ac-00; the candle finetype-train
    crate is the alternative. DELIVERABLE: the fine-tuned model + held-out separability (target:
    beat the 0.893 zero-shot probe) + safetensors loadable by the ac-00 candle path.
  gate: false
  checked: false
  ac_type: code
- id: ac-02
  description: |
    ATTRACTOR CHECK on gold + representative — catch the 0-for-6 failure mode CHEAPLY, before
    corpus-scale work (observation, BLOCKING). Score the fine-tuned model on gold + the
    representative fixture (eval/repr) via the Python harness — standalone or escalation-simulated
    (static path for quality_band≥0.70, encoder for the low band). Confirm the residual is NOT
    broadened: categorical/full_name/the text catch-alls hold or improve their PRECISION, and the
    semantic prize (the 83 gold / 31 repr over-emission cols, discovery ac-00) is recovered without
    a new attractor forming. This is the exact failure every additive retrain hit — measure it on
    the cheap instruments before spending the 9-hour corpus pass. DELIVERABLE: gold + repr per-type
    precision/recall for the candidate vs v19, with the residual-broadening check explicit. A
    broadened residual here is a NO-GO before ac-03/ac-04 — kill cheap.
  gate: true
  checked: false
  ac_type: observation
- id: ac-03
  description: |
    LOW-BAND ESCALATION INTEGRATION in Rust (code). Wire the candle encoder as a
    quality_band < 0.70 escalation path in the profile/classify pipeline: confident columns keep
    the fast static Model2Vec+multi-branch path (~0.9 ms/col); only the uncertain low band gets the
    MiniLM re-classification. Embedded + offline + deterministic, like the three existing models.
    Run the B07 consumer-graph audit on the classify path first (codegraph_impact; H03 halt if an
    unaudited load-bearing edit). Measure END-TO-END latency on real multi-column tables (the
    interactive analyst cost, not just per-column). DELIVERABLE: integrated escalation behind a flag
    + green CI (fmt + clippy -D warnings + cargo test) + the consumer-audit note + real-table latency.
  gate: false
  checked: false
  ac_type: code
- id: ac-04
  description: |
    THE FULL PROMOTION SCOREBOARD — corpus-honest gate is the arbiter (observation, BLOCKING).
    Run the candidate through the promotion order (0095, + representative band this session):
    gold-anchor (efficacy) → drift proxy (pre-train) → gold + representative + rare-type scoreboard
    → corpus-honest relocation gate (BLOCKING, H05). The corpus-honest gate killed all six prior
    retrains by catching error RELOCATION the curated instruments miss — it is the arbiter here, not
    the gold/separability number. DELIVERABLE: the per-gate verdict + the gold/representative headline
    delta + the corpus-honest relocation report. DECISION: if every blocking gate is GO, promote
    (models/default swap via the release flow) and record the headline lift; if the corpus-honest
    gate (or any blocking gate) is NO-GO, PRESERVE the model as an artifact, document the failure
    mode, and the semantic ceiling stands — a legitimate, expected-possible outcome after 0-for-6,
    NOT a spec failure. State what is measured vs assumed.
  gate: true
  checked: false
  ac_type: observation
