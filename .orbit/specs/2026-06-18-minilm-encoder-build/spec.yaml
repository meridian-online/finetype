id: 2026-06-18-minilm-encoder-build
goal: 'Ship gte-tiny as the semantic-boundary classifier in a type-routed two-stage (deterministic parsers + static multi-branch + gte-tiny on contested-semantic predictions, routed by PREDICTED TYPE — no confidence machinery). SLIM PLAN (2026-06-19 zoom-out, revised_slim_plan.md): gte-tiny is a separate encoder, not an additive flat-softmax retrain, so the relocation ceremony built for the 0-for-6 retrains does not apply. Gold + representative (human truth) are the BLOCKING gates; corpus over-emission is a DIRECTIONAL sanity check; the drift proxy and the gated-YDF-oracle blocking gate are DROPPED for this path (the YDF oracle is wrong ~42% on contested and inflated the prior NO-GO).'
cards:
- 0002-semantic-type-detection
- 0020-honest-production-typing
status: open
labels:
- build
- encoder
- minilm
acceptance_criteria:
- id: ac-00
  description: |
    RUST/CANDLE LATENCY — DONE. gte-tiny (lead encoder, beat 7 alternatives) runs in candle
    (candle-transformers BERT + tokenizers + safetensors, deterministic, embeddable). CPU batched
    ~10.6 ms/col (at budget), Metal batched 0.07 ms/col (corpus pass ~minutes). Same arch as MiniLM
    so latency identical. crates/finetype-candle-spike/src/bin/minilm_latency.rs.
  gate: true
  checked: true
  ac_type: code
- id: ac-01
  description: |
    FINE-TUNE gte-tiny AS THE SEMANTIC CLASSIFIER (code). Clean rebalanced training: mine REAL
    corpus columns (gold's distribution, NOT synthetic generation which under-performs) + label by
    authoritative-vocab membership (GeoNames incl admin2 for region, airports for iata) and DISTILLED
    LLM labels for entity_name/full_name/residual (NOT v19's noisy calls — the root cause of the
    prior over-demotion); residual ~25% (rebalanced from 44%). Train with the validated v3 recipe:
    partial-unfreeze (top-2 layers), discriminative LR (encoder 2e-6 / head 1e-3), NATURAL CE (no
    class weights), grad-clip + warmup; SAVE the model. DELIVERABLE: the saved fine-tuned gte-tiny +
    held-out separability beating the shipped model on the contested families.
  gate: false
  checked: false
  ac_type: code
- id: ac-02
  description: |
    GOLD + REPRESENTATIVE — the BLOCKING truth gates (observation, BLOCKING). Wire the type-routed
    two-stage (static multi-branch; when it predicts a contested-semantic type — geo/person/entity/
    residual — gte-tiny re-decides; route by PREDICTED TYPE, no confidence gating) and score it on
    the gold corpus + the representative fixture (eval/repr). REQUIRE: a lift on the contested mass,
    NO regression on non-contested types, and the residual NOT broadened (categorical/full_name/word
    precision held). These human-verified instruments — not the YDF oracle — are the arbiter.
    DELIVERABLE: gold + representative headline vs v19, per-type, with the residual-broadening check.
  gate: true
  checked: false
  ac_type: observation
- id: ac-03
  description: |
    TYPE-ROUTED TWO-STAGE IN RUST (code). Wire the candle gte-tiny into the profile pipeline:
    when the static stage predicts a contested-semantic type, gte-tiny re-classifies (predicted-type
    routing — NO confidence threshold, NO corpus-pass-confidence dependency). Embedded + offline +
    deterministic like the existing models. B07 consumer-graph audit on the classify path first
    (codegraph_impact; H03 halt if unaudited). DELIVERABLE: the integrated two-stage behind a flag +
    green CI (fmt + clippy -D warnings + cargo test) + the audit note + real-table latency.
  gate: false
  checked: false
  ac_type: code
- id: ac-04
  description: |
    CORPUS OVER-EMISSION SANITY CHECK — directional, NOT blocking (observation). Does gte-tiny
    over-emit any label wildly at corpus scale, judged on its OWN predictions (label marginals vs
    v19's)? Keep the corpus-honest gate's QUESTION — catch a label exploding at scale — but drop the
    vs-v19 gated-YDF relocation apparatus (the oracle is ~42% wrong on contested and inflated the
    prior NO-GO by scoring correct fixes as oracle_fp). A large over-emission FLAGS investigation; it
    does not auto-block. Promotion is decided by ac-02 (gold + representative). DELIVERABLE: the
    per-label corpus marginal comparison + a judgement on any wild over-emission. STATE what is
    measured vs assumed.
  gate: false
  checked: false
  ac_type: observation
