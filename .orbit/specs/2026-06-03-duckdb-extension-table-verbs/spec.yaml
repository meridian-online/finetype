id: 2026-06-03-duckdb-extension-table-verbs
goal: |
  Give the DuckDB extension a coherent `profile → schema → validate` surface
  that mirrors the CLI, so an analyst can answer "what type is this column?" and
  "is this table valid?" in SQL — not just "what type is this one value?".

  ## The gap today

  The shipped extension is six per-value scalars (finetype, finetype_detail,
  finetype_cast, finetype_unpack, finetype_validate, finetype_version). All
  operate one value at a time. There is no table verb. An analyst who wants to
  validate a loaded table must hand-write a UNPIVOT + json_keys + join against
  `finetype_validate`. The CLI answers "is this table valid?" in one command;
  the SQL channel cannot. The user's goal is **as common a `profile → schema →
  validate` flow across both channels as SQL idiom allows** — they need not
  overlap exactly (SQL is more expressive), but the table-validity question must
  be a first-class verb, not a recipe.

  Two accuracy facts make table verbs worth more than the scalars they wrap:

    - The model is **column-oriented** (5-branch: char + embed + stats + header
      + validation pooled across a column's values). A single value carries no
      column context, so `finetype('value')` misfires on values that only
      disambiguate in a column (a bare UUID, a phone, a placeholder email).
      `ft_infer(v)` is "profile with sample size 1" — strictly weaker than
      `ft_profile(table)` over a row sample.
    - So `ft_profile` is not sugar over `ft_infer`; it is the accurate path.

  ## Converged surface (`ft_` prefix on everything)

  | Verb                          | Scope        | DuckDB kind        | Mirrors CLI |
  |-------------------------------|--------------|--------------------|-------------|
  | `ft_infer(value)`             | one value    | scalar             | — (probe)   |
  | `ft_profile(table)`           | a column     | aggregate UDF      | `profile`   |
  | `ft_validate_text(value, schema)` | one value / column | scalar    | per-cell    |
  | `ft_validate(table, schema)`  | a table      | SQL table macro    | `validate`  |
  | `ft_cast` / `ft_unpack` / `ft_version` | one value | scalar     | utilities   |

  The existing un-prefixed scalars stay registered for one release as aliases so
  the just-republished v0.6.22 install does not break; new docs teach `ft_`.

  ## Why a macro, not a Rust table function (updates choice 0064)

  Choice 0064 concluded table-level validation was blocked by the **catalog
  wall**: duckdb-rs `BindInfo` exposes no Connection / catalog / row-iteration,
  so a Rust table function cannot read an existing DuckDB table by name. That is
  still true on the shipped pin (`duckdb 1.10503.1`, DuckDB 1.5.3).

  But a **SQL macro** sidesteps it entirely. A macro registered at `LOAD`
  expands into SQL that DuckDB itself executes with full catalog access;
  `query_table(name)` resolves at execution time on DuckDB's side. So
  `ft_validate(table, schema)` ships as `CREATE MACRO ... AS TABLE` — the path
  0064 did not consider. This spec amends choice 0064 to record that table
  verbs are reachable via macros even though Rust table functions remain walled.

  ## The schema is a JSON file (the interop contract)

  Schema **generation** stays in the CLI (`taxonomy`). The extension only
  **consumes** a JSON Schema. The one `schema` argument accepts all three forms
  via auto-detect in a single argument — no overload, no second function:

    - inline JSON literal — `trim(schema) LIKE '{%'`
    - a variable — `getvariable('schema')` resolves to the JSON string before
      the macro sees it, so it arrives as inline JSON
    - a file path — `(SELECT content FROM read_text(schema))`

  Verified: DuckDB short-circuits `CASE` so the `read_text` subquery is NOT
  evaluated when the inline branch matches — `ft_validate(my_table,
  'schema.json')` and `ft_validate(my_table, '{...}')` both work through one
  argument with no file-not-found error on the inline path. This is the
  simplification the user asked for.

  ## All-VARCHAR cell extraction (no column names typed)

  `finetype_validate` needs strings. DuckDB does the casting in-query:
  `SELECT COLUMNS(*)::VARCHAR FROM t` casts every column to text, then
  `UNPIVOT (val FOR col IN (COLUMNS(*)))` melts all columns with zero column
  names hard-coded — works on any heterogeneous table. The extension writes no
  extraction code.

  ## Nested-column sharp edge (Precision Principle)

  `COLUMNS(*)::VARCHAR` flattens STRUCT / LIST to DuckDB **display** text
  (`{'city': NYC}` — inner quotes lost, not valid JSON), which would then
  validate as opaque strings and silently FALSE-reject. That violates the
  Precision Principle (a validation that confirms/denies the wrong thing is
  worse than none). The table verbs must **guard** nested columns — surface them
  as a named skip/error so the analyst unnests / `to_json` / extracts first,
  rather than reporting silent rejects.

  ## Out of scope

  - Schema generation in SQL (stays in the CLI `taxonomy` command).
  - Reading files off disk as the validation source (`read_csv`-style). The
    user explicitly rejected this: too many hidden assumptions
    (headers/delimiters/encoding). Validation runs on **loaded tables** so the
    analyst controls exactly what table is validated.
  - A Rust table function for table reads (catalog wall stands; macro is the
    path).
  - Any model retrain or taxonomy change.

  ## Decisions

  Amends choice 0064 (macros reach table verbs past the catalog wall). The
  `ft_` naming and the table-not-frame terminology are settled in discussion
  and recorded here.
