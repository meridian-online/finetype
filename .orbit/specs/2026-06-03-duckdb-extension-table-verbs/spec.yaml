acceptance_criteria:
- id: ac-01
  description: |
    Choice 0064 amended. Record that table-level verbs are reachable via SQL
    macros (registered at LOAD, expanded into catalog-aware SQL on DuckDB's
    side) even though Rust table functions remain blocked by the BindInfo
    catalog wall on the current pin (duckdb 1.10503.1). Name `query_table(name)`
    as the execution-time resolution that does the work.
  gate: false
  checked: false
  ac_type: doc
- id: ac-02
  description: |
    `ft_infer(value VARCHAR) → VARCHAR` registered. A scalar that returns the
    semantic type label for a single value — "profile with sample size 1".
    Documented as the weak probe: less accurate than ft_profile because it
    carries no column context. Returns the same label finetype() does today.
  gate: false
  checked: false
- id: ac-03
  description: |
    `ft_profile` registered as an aggregate UDF returning the column's semantic
    type (and, in a detail variant or struct, confidence + recommended DuckDB
    type). Used `SELECT col, ft_profile(val) FROM (... UNPIVOT ...) GROUP BY col`
    or directly over a column. Pools char/embed/stats/validator signal across
    the aggregated values (header branch reads the column name). A row sample
    (e.g. `USING SAMPLE 100`) is the documented idiom; the aggregate itself
    bounds the values it pools so a full-table scan does not OOM.
  gate: false
  checked: false
- id: ac-04
  description: |
    `ft_validate_text(value VARCHAR, schema VARCHAR)` registered, operating over
    a single value or a whole column. Returns a STRUCT carrying at least
    {valid BOOLEAN, constraint VARCHAR, message VARCHAR} so a reject report can
    name which constraint failed — mirroring the CLI reject_errors shape — not
    just the bare "valid"/error string finetype_validate returns today. Applies
    the CLI null semantics (empty / "null" skip) so column validation matches
    `finetype validate`.
  gate: false
  checked: false
- id: ac-05
  description: |
    `ft_validate(table, schema)` shipped as a SQL table macro answering "is this
    table valid?". Expands to the all-VARCHAR UNPIVOT over `query_table(table)`,
    joins each column to its `$.properties.<col>` subschema, and returns a
    per-column report {column_name, total, rejects, sample_message}. Verified to
    run on a loaded heterogeneous table via the catalog (macro path, not a Rust
    table function).
  gate: false
  checked: false
- id: ac-06
  description: |
    One schema argument accepts inline JSON, a variable, and a file path. The
    macro auto-detects with `CASE WHEN trim(schema) LIKE '{%' THEN schema ELSE
    (SELECT content FROM read_text(schema)) END`. Verified: `ft_validate(t,
    'schema.json')` reads the file AND `ft_validate(t, '{...}')` uses the inline
    JSON with no file-not-found error (CASE short-circuits the read_text
    subquery). `getvariable('schema')` also works (resolves to inline JSON
    before the macro). No second function, no overload.
  gate: false
  checked: false
- id: ac-07
  description: |
    Nested columns guarded. When a table has a STRUCT / LIST / nested column,
    `ft_validate` (and `ft_profile` over `COLUMNS(*)`) does NOT silently
    validate the flattened display text. Either errors with a clear message
    naming the column, or surfaces it as an explicit skipped row in the report,
    instructing the analyst to unnest / to_json / extract first. A test proves a
    STRUCT column is not silently FALSE-rejected.
  gate: false
  checked: false
- id: ac-08
  description: |
    Existing un-prefixed scalars retained as aliases for one release so the
    v0.6.22 community install keeps working, with a deprecation note in docs
    pointing at the ft_ names. finetype()/finetype_validate()/etc. still resolve.
  gate: false
  checked: false
  ac_type: config
- id: ac-09
  description: |
    docs/DEVELOPMENT.md and the extension's docs (description.yml
    extended_description / hello_world) teach the ft_ surface and the
    `profile → schema → validate` flow end to end: profile a table to see column
    types, point at a CLI-generated schema.json, validate the table. Uses only
    verified-working examples (no `user@example.com`→email; that returns
    plain_text).
  gate: false
  checked: false
  ac_type: doc
- id: ac-10
  description: |
    Built extension loads on DuckDB v1.5.3 and the full surface works in a
    captured transcript: ft_infer on a value, ft_profile over a sampled column,
    ft_validate_text on a value, ft_validate on a loaded table with both an
    inline schema and a schema.json file, and the nested-column guard firing on
    a STRUCT column.
  gate: false
  checked: false
  ac_type: observation
