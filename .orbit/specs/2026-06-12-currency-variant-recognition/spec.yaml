id: 2026-06-12-currency-variant-recognition
goal: 'Teach FineType''s value-level model to recognise currency locale-format variants (finance.currency.amount_*) by MANUFACTURING CLDR currency-format training data and retraining — closing the price gap at its real root (training-data starvation, not a rule gap) per decision 0038 (strength through simplification: model over rules). The deterministic value-aware selector is demoted to a documented last-resort fallback. Run as the currency slice of the long-deferred CharCNN-vs-multi-branch value-level probe — currency is the ideal low-collateral case (the in-value symbol is an explicit marker, so CharCNN''s no-context weakness does not bite).'
cards:
- '0002'
status: open
labels:
- precision
- locale-coverage
- training-data
acceptance_criteria:
- id: ac-01
  description: |
    DESIGN + ROOT CAUSE LOCKED (this session). A euro column ("9.140,88 €")
    never reaches finance.currency.amount_comma_suffix: with a price/amount
    header it is forced to the generic US finance.currency.amount; with a
    neutral header the value-level model votes representation.numeric.
    decimal_number (it does not see the currency at all). ROOT, confirmed:
    the synthetic training templates (scripts/prepare_multibranch_data.py)
    emit ONLY generic finance.currency.amount — every one of the 12 amount_*
    locale variants is ABSENT (and only 114 of 240 types appear in templates
    at all). The model has never seen a labelled euro/real/lakh amount, so it
    cannot emit one — "a corpus whose distribution IS the gap cannot teach the
    model to close the gap". So this is corpus starvation, not a veto/rule
    bug. APPROACH PIVOT (author-endorsed 2026-06-12): manufacture + train, NOT
    a deterministic selector. The multilingual.csv price column is additionally
    a coherent 3-way per-row-locale mix (US/euro/real, 20 each) with no single
    correct type — do NOT mutate it. Evidence: interview.md.
  gate: false
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    MANUFACTURE — fold the currency amount_* format variants into the
    reference-data mining factory (spec 2026-06-07-reference-data-mining-
    factory, which already emits CLDR month_name/abbreviated_month and the
    ISO currency_code/currency_symbol enums but NOT the amount FORMAT
    variants). A generator emits value-level rows (value, type, source,
    locale) for the amount_* family from CLDR number-format rules — per-locale
    grouping separator, decimal separator, and symbol position — covering
    amount_comma, amount_comma_suffix, amount_space, amount_multisym,
    amount_apostrophe, amount_lakh, amount_nodecimal, amount_accounting,
    amount_neg_trailing, amount_code_prefix (amount_crypto is ticker-based,
    lower priority). Each value passes its own type's JSON-Schema validation-
    as-veto + the leakage firewall. Distinct-value census: every targeted
    variant clears the 50-distinct floor by a wide margin (the starvation-
    dissolution proof).
  gate: false
  checked: true
  ac_type: config
- id: ac-03
  description: |
    TRAIN + CharCNN-vs-MULTI-BRANCH PROBE. Train value-level candidate(s) on
    the manufactured-augmented corpus and measure per-variant recall on the
    gold corpus + rare-type scoreboard (do the amount_* variants now emit?).
    Run BOTH --model-type {char-cnn, multi-branch} on this currency slice as
    the clean, low-collateral instance of the long-deferred data-scaling test
    (memory charcnn-vs-multibranch-data-scaling): currency removes the
    latitude context-confound that has blocked that experiment, because the
    currency symbol is an explicit in-value signal. Deliverable: per-variant
    recall for each architecture + an honest read on whether the char branch
    separates the variants cleanly or the symbol-stripping that makes
    "9.140,88 €" look decimal also confuses it. This is the architecture
    evidence, not just a currency fix.
  gate: false
  checked: false
- id: ac-04
  description: |
    GATES (blocking, H05). Gold corpus no-regression vs the then-current
    baseline — the amount_* recognition must not relocate any non-currency
    label (watch decimal_number / integer_number). Corpus-honest gate GO on
    the stratified sample — watch the amount_* family for over-emit of any one
    variant (a plain-decimal column wrongly promoted to currency is the named
    risk). Rare-type scoreboard for the amount_* family. No headline overrides
    a NO-GO. Destination-drift proxy pre-check before any overnight run, per
    the standard retrain discipline.
  gate: true
  checked: false
  ac_type: observation
- id: ac-05
  description: |
    SELECTOR FALLBACK (last resort, per decision 0038). ONLY for any amount_*
    variant the trained model provably CANNOT learn after manufacture (the
    way categorical is a residual that resists flat-softmax training, memory
    categorical-is-a-residual-category) — a scoped, value-based Sharpen
    selector for that specific variant: when a column is currency-family and
    its values satisfy exactly one amount_* validator above the sample
    threshold AND carry a currency symbol (the over-emit guard), route there.
    Gated like any Sharpen change. Documented as a fallback the training bet
    failed to absorb — not the primary path. Likely empty if the manufacture
    works.
  gate: false
  checked: false
- id: ac-06
  description: |
    FIXTURE + SHIP. Add eval/datasets/csv/de_prices.csv (single-locale CLDR
    euro, "9.140,88 €" with thousands dots) as the clean recognition fixture;
    leave multilingual.csv intact with its price EXPECTED output set to the
    honest mixed-column answer (generic finance.currency.amount family OR
    decimal_number — a small deferred semantics call). Ship batched with the
    gender fix in one release: version bump, CHANGELOG (user-experience
    framing — "FineType reads your €1.234,56 columns as currency, in the right
    European format"), gold baseline doc updated. Closes spec
    2026-06-12-false-veto-trio-resolution ac-04 by delegation.
  gate: false
  checked: false
  ac_type: ops
