acceptance_criteria:
- id: ac-00
  description: |
    Default model pinned and target FPs re-baselined on it. The corpus diagnostic
    ran on v22; models/default currently symlinks v19; CLAUDE.md documents v22 as
    default. Resolve the canonical default, then re-measure the four target
    clusters' FP rate on THAT model (the diagnostic's gaps are v22 FPs and may
    differ on the shipping model). Record per-cluster pre-train FP rate. If a
    target cluster's FP rate is already ~0 on the true default, drop it from scope.
  ac_type: code
- id: ac-01
  description: |
    Hard-negative corpus extracted for the four HIGH-safety numeric-target
    clusters only. A script reads eval/gittables/corpus_pass/columns.parquet,
    filters to columns whose (sense_prediction, ydf_prediction) matches a target
    cluster AND whose cluster safety_score >= 0.80, dedups by row-hash SHA256
    against the existing training pile (MADR 0056), and emits
    output/v24-numeric-precision/hard_negatives.parquet with correct_label = the
    numeric ydf label. A per-cluster summary shows non-zero coverage on all four
    and ZERO rows whose correct_label is representation.discrete.categorical.
  ac_type: code
- id: ac-02
  description: |
    Pre-training Sense-distribution snapshot captured on the corpus (label ->
    column-count histogram) and the four clusters' safety_score recorded, so the
    post-train check has a baseline. Pre-training audit gate confirms no
    categorical label appears as a training target (VALID_DIM=240, distilled cap
    <= 600/type, per-type volume within range).
  ac_type: code
- id: ac-03
  description: |
    Train v24 with the numeric-target hard negatives added, same config as v22/v23
    (50 epochs, ~1200 cols/type, 70/30 blend, Metal). Model saved to
    models/sherlock-v24-numeric-relu-s{42,43,44}. discrete.categorical is not a
    training target.
  ac_type: code
- id: ac-04
  description: |
    Eval, gated on BOTH components (Failed if either fails):
    (a) FP-rate drop on the four numeric clusters (target: meaningful reduction,
        per-cluster reported); AND
    (b) NO collateral — post-train Sense-distribution shows discrete.categorical
        within +/- a small band of pre-train (NO v23-style explosion) AND
        geography (city/region/country) does NOT regress vs the pre-train default;
        gated cell-2 vs v19 does not regress.
    The combined band must be Met to promote. If Failed, open a re-litigation memo
    and do not ship.
  ac_type: observation
- id: ac-05
  description: |
    Round-trip harness does not regress: scripts/roundtrip_metrics.sh on
    earthquakes_2024.csv and scripts/roundtrip_ab.py on the 250-table gittables
    sample show non_trivial_pct still >= 0.80 under v24 (precision may improve on
    integer-heavy tables; it must not buy that by collapsing recall).
  ac_type: observation
