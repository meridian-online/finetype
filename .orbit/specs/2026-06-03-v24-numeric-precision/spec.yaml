id: 2026-06-03-v24-numeric-precision
goal: |
  Cut Sense's false-positive rate on the HIGH-safety numeric-target
  misclassification clusters from the multi-lens diagnostic, via an additive
  hard-negative retrain that the v23 re-litigation memo's failure mode cannot
  repeat — because every target cluster is reachability-safe and no categorical
  label is trained as a correct answer.

  ## Why this is not "v23 with a different mix"

  The v23 re-litigation memo (output/v23-precision-retrain/relitigation_memo.md)
  closes with an explicit warning: do NOT run a v24 patch retrain with a
  different hard-negative mix — same recipe, same risk. v23 won its 6 FP clusters
  (-70.8%) but fired representation.discrete.categorical on 548k columns
  (+529.6% vs v22), pulling ~48k geography columns into categorical and reversing
  v22's country/region/city gains. It closed Failed.

  The memo's own recommendation #3 — per-cluster reachability scoring — was
  subsequently built and ships as the advisory `safety_score` column on
  eval/gittables/corpus_pass/corroborated_gaps.parquet (specs
  2026-05-29/30/31). Reading it back validates the post-mortem exactly:

    | correct-label target | cols    | avg safety | v23 outcome on these |
    |----------------------|--------:|-----------:|----------------------|
    | numeric (int/dec)    |  69,987 |       0.69 | utc->integer was a clean win (0.95) |
    | categorical          | 115,439 |       0.49 | the clusters that ate geography |

  So the safe bet is the numeric-target clusters ONLY. Per CLAUDE.md's advisory
  bands (>= 0.80 HIGH safe; 0.50-0.80 MODERATE needs the Sense-distribution
  pre/post check; < 0.50 LOW prefer Sharpen/taxonomy), the targets are:

    | gap (eg col)            | v22 FP label              | correct (ydf) | cols   | safety |
    |-------------------------|---------------------------|---------------|-------:|-------:|
    | utc (Comments/Points)   | datetime.offset.utc       | integer       | ~25.4k |   0.95 |
    | url (ConcurrentQueue)   | technology.internet.url   | integer       |  9,779 |   0.91 |
    | boolean (Max Cardinality)| representation.boolean.binary | integer   |  8,649 |   0.94 |
    | int->dec (ref_num/rsvp) | representation.numeric.integer_number | decimal | ~3.9k | 0.84 |

  ## Mandatory failure-mode guard

  The Sense-distribution pre/post check is mandatory (CLAUDE.md, not optional for
  any training_data_addition retrain). v24 must show NO categorical explosion and
  NO geography regression — the precise way v23 died. discrete.categorical is
  never trained as a correct label (v23 lesson: the label is too broad; additive
  training on it rebalances all low-cardinality decisions toward categorical).

  ## Pillar defence
  Pillar 1: analysts profiling scientific/box-score tables currently see Sense
  declare confident wrong specific labels on plain integer columns. Pillar 4: the
  diagnostic + reachability metric spent the eval budget; this converts the
  safe-to-train subset into the bet that pays them back.

  ## Out of scope
  - Categorical-target clusters (gender_code, periodicity, alphanumeric_id,
    geohash, measurement_unit -> categorical; avg safety 0.49 LOW). Routed to a
    separate Sharpen-rule / taxonomy decision, NOT this retrain.
  - The earthquake blog round-trip
    (spec 2026-06-03-earthquake-roundtrip-precision). Its failures
    (id->geohash safety 0.32, net/source->measurement_unit safety 0.29) are in
    the unsafe bucket; this retrain will not fix them. Decoupled.
  - Sharpen-stage rules (decisions 0038/0048 govern).
  - YDF retraining / DBpedia mapping changes (lenses fixed for this bet).
