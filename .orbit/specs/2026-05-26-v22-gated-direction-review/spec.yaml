id: 2026-05-26-v22-gated-direction-review
goal: |
  Re-run the v22 ac-08 decision against the cleaned baseline and pick
  the actual next move.

  v22 closed Failed (−8.9% cell-2 vs v19) and its pre-committed branch
  said "training-data interventions exhausted; architectural surgery
  next." That triggered v23-sharpen-code-discriminator, which built,
  hardened, and reverted a country_code rule once ac-01 showed the
  cell-2 metric was dominated by YDF mislabel noise (msg_id as
  iso6346, team-codes as country_code, ...).

  Spec 2026-05-26-ydf-validation-gate cleaned the metric. v22's true
  position on the gated baseline is **Partial (−10.4%)**, not Failed.
  The pre-committed "architectural surgery" branch fired on a
  measurement artefact, not a real model deficiency. The per-subtype
  gains the noise had been masking are real and large: city −10.2%,
  region −12.8%, country −31.5%. v22 also lifted val_acc +0.0132 over
  v19 (the largest val_acc jump in the multi-branch line) and ac-06's
  ablation diagnostic showed the Model2Vec embed branch finally
  carrying weight on the city-vs-name boundary.

  This spec exists to decide three things, in order:

    1. Which subtypes responded to boundary training across v19 → v22,
       and where the diminishing returns sit. (The honest per-subtype
       trajectory — the input to the next R&D bet.)
    2. What the candidate next moves are, and which one moves the
       analyst experience most per unit of R&D spend.
    3. Whether v22 becomes the new default Sense model (held pending
       this review per the v22 spec's ac-07 close note).

  Pillar defence. Pillar 1 — does v22's −31% country lift translate
  to analyst-visible improvement on real GitTables columns, and where
  does the dominant remaining miss class live? Pillar 4 — the next
  retrain is the most expensive R&D unit in the project; this spec
  exists to make sure it's pointed at the right target.

  Out of scope:
    - Sharpen-stage rules of any kind (decisions 0038/0048 govern;
      the v23 experiment is the precedent).
    - YDF retraining or feature changes (the gate is the corrective).
    - Multi-branch architectural surgery (ac-06's ablation closed
      this door — the embed branch is doing work in v22).

cards:
- 0002-semantic-type-detection
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Per-subtype trajectory across v19 / v20 / v21 / v22 on the gated
    baseline.

    `scripts/compute_cell_deltas_gated.py` (or a thin variant) emits
    `output/v22-direction-review/per_subtype_trajectory.md` with one
    row per geography subtype, columns: v19 misses, v20 misses, v21
    misses, v22 misses, Δ v19→v22 (count + %), Δ v21→v22 (count + %).
    Sorted by v19 miss count descending so the dominant miss classes
    surface first.

    Read alongside `output/ydf-validation-gate/cell_deltas_gated.md`
    (which only shows v19 vs v22) — the four-way view exposes whether
    boundary training was monotone (v20 < v21 < v22 ratchet) or
    discontinuous (v22 jumped while v20/v21 didn't move).

    Close evidence: trajectory.md exists and is human-readable; the
    four bands of subtype response (large monotone movers, large v22-
    only jumpers, flat across all four, regressed in v22) are tagged
    inline so the ac-02 enumeration can pivot on them.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-02
  description: |
    Enumerate the candidate next moves.

    `output/v22-direction-review/next_move_options.md` lays out, with
    one paragraph per option, what each costs and what each would
    likely move. Candidates to consider — not a closed list:

      A. **v22 as default, move to other priorities.** Cell-2 already
         Partial-band; val_acc +0.0132 over v19; embed branch
         carrying weight. Accept the win, return R&D budget to other
         cards. Cost: symlink swap + CLAUDE.md update. Risk: leaves
         the long tail of city/region misses unaddressed.
      B. **v22+ patch retrain — extend the boundary-training blend.**
         Same recipe as v22, more hard negatives on the un-moving
         subtypes (full_address −1.2%, street_name −0.3%,
         postal_code −2.5%). Cost: overnight train + corpus pass.
         Risk: v22 already moved the easy targets — diminishing
         returns may bite.
      C. **Data-composition rebalance for the long tail.** The
         per-subtype trajectory should surface subtypes where v22
         barely moved; those have a different bottleneck (sample
         volume, geography distribution, header pattern thinness).
         Targeted source mining rather than another blend reshuffle.
         Cost: 2–3 spec-weeks of mining + a retrain.
      D. **Eval-corpus expansion blocking everything.** m-19's
         Phase A+B (240/240 type coverage + train/eval leakage
         firewall) is in flight and explicitly blocks v18+ retrains
         until it ships. If A+B isn't shippable inside a tight
         window, the right move may be to land v22 as default and
         pause Sense work until the firewall exists.

    Each option must name: (i) the pillar it serves, (ii) the
    falsifiable signal that would justify it, (iii) the cost in
    spec-weeks, (iv) what it deprioritises.

    `ac_type: doc`.
  gate: false
  checked: false
  ac_type: doc

- id: ac-03
  description: |
    Pick one. The decision AC.

    `output/v22-direction-review/decision.md` records the chosen
    next move from ac-02 in one short paragraph, names the pillar
    it serves, and lists the two best alternatives with a one-line
    reason for not taking them. The decision must be reachable from
    the ac-01 trajectory evidence — i.e. the document cites which
    subtype-response pattern is load-bearing for the call.

    If the call is "v22 as default, move on," that's a legitimate
    pick; the spec doesn't pre-commit to launching another retrain.
    If the call is a retrain or mining spec, ac-04 promotes it.

    `ac_type: doc`.
  gate: false
  checked: false
  ac_type: doc

- id: ac-04
  description: |
    Act on the decision.

    Two mutually-exclusive paths, gated by ac-03:

    Path A — **v22 becomes the new default Sense model.** Run
    `/release model models/sherlock-v22-boundary-relu-s44` (or the
    manual equivalent: swap `models/default` symlink, update
    CLAUDE.md's "Default Sense-stage model" line, update the val_acc
    + profile eval numbers if a fresh eval is available). Commit on
    a single-purpose commit. No retrain in this path.

    Path B — **next spec opened.** Create the follow-up spec stub
    (`.orbit/specs/<date>-<slug>/spec.yaml`) with the goal block
    written from ac-03's decision. Attach to card 0002 (or
    0010-synthetic-data-generation if the work is a mining spec).
    Do NOT begin implementation in this spec.

    Close evidence (whichever path): for A, `models/default` resolves
    to the v22 cherry-pick and CLAUDE.md reflects it; for B, the new
    spec file exists and is greppable.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code

- id: ac-05
  description: |
    Post-decision observation window — does the gated baseline hold?

    The gate (per spec 2026-05-26-ydf-validation-gate) is
    conservative — 50% threshold, length-only validations skipped.
    A stricter or differently-calibrated gate may reveal v22's true
    band is higher or lower than −10.4%. This AC defers a short soak:
    if the next 2–3 corpus passes (run for any reason — eval-corpus
    expansion, follow-up spec) show the gated v22/v19 ratio drifting
    outside [−8%, −13%], flag it and reopen this decision.

    Close evidence (after the soak window): a one-paragraph note at
    `output/v22-direction-review/gated_soak.md` recording whether
    the gated band held; if it didn't, link to the spec or memo that
    captures the reopened decision.

    `ac_type: observation`.
  gate: false
  checked: false
  ac_type: observation
