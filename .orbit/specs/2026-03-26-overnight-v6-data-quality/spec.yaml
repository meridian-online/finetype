id: 2026-03-26-overnight-v6-data-quality
goal: |
  Close the accuracy gap by fixing root causes upstream of training: (1) purge 9 stale label references from the Sharpen/header_hint pipeline that inject phantom labels into model output, (2) audit all generators for cross-type collisions and fix with Hugh's approval, (3) fix augmentation under-delivery and oversampling shortfall, (4) expand eval coverage from 131 to ~156 types so we can measure what we're improving. Then retrain as sherlock-v6 and re-tune Sharpen rules based on systematic error analysis. Ship on expanded eval baseline — old 190-column denominator becomes historical.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: AC-1
  description: |
    Purge all 9 stale label references from column.rs that inject phantom labels (labels not in the current 250-type taxonomy) into model output. These override correct model predictions with nonexistent labels, causing guaranteed eval failures.
    Stale labels to fix:
      - identity.financial.currency_code → finance.currency.currency_code (line 3843)
      - identity.credential.password → identity.person.password (line 4006)
      - geography.trade.hs_code → geography.transportation.hs_code (lines 2444, 2921-2930)
      - geography.transport.iata_code → geography.transportation.iata_code (line 5664)
      - technology.identifier.uuid → representation.identifier.uuid (line 3767)
      - technology.development.os → remove (no taxonomy match) (line 3895)
      - geography.address.street_address → remove or map to full_address (lines 3964-3969)
      - datetime.date.iso_date → datetime.date.iso (line 3972)
      - technology.development.boolean / technology.data.boolean → remove (lines 186-188)

    For labels with no taxonomy match: remove the hint entirely (let the model decide). Update corresponding test assertions (lines 5767, 5779-5780, 5950-5978, 8960/8977/ 8982/9221) to assert the correct canonical labels — do not simply delete tests.
  gate: false
  checked: false
- id: AC-2
  description: |
    Systematically test every generator pair that shares a broad_type (VARCHAR, BIGINT, DOUBLE, etc.) for output overlap. For each collision found, document:
      - Which types collide
      - Example overlapping values
      - Proposed resolution (case-by-case, not universal rule)
      - Whether the collision affects eval columns

    Known collision to fix: hs_code ↔ decimal_number. Decision: 2-level dotted values (e.g., 8471.30) are decimal. Only 3+ dot-separated levels (e.g., 0901.11.00.10) are hs_code. Change validation pattern from ^\d{4}\.?\d{2}(\.\d{2}){0,2}$ to ^\d{4}\.\d{2}(\.\d{2}){1,2}$. Remove 10% 2-level bucket from generator (was: 10% XXXX.XX, 70% XXXX.XX.XX, 20% XXXX.XX.XX.XX → becomes: 80% XXXX.XX.XX, 20% XXXX.XX.XX.XX).
    Present collision table to Hugh for approval before implementing fixes.
  gate: false
  checked: false
- id: AC-3
  description: |
    The stale header_hint reference (identity.financial.currency_code) reflects a taxonomy move that happened in v0.5.1. The canonical type is finance.currency.currency_code. Ensure no references to the old location remain anywhere in the codebase (training data, eval mappings, Sharpen rules, tests). Also scan the distilled training corpus for stale identity.financial labels — exclude or relabel before training. Record as MADR decision.
  gate: false
  checked: false
- id: AC-4
  description: |
    Add eval datasets for the ~25 highest-priority uncovered types identified in the investigation. Priority types include:
      - representation: scientific_notation, decimal_number_comma, file_size
      - datetime: compact_ymd, rfc_3339, iso_8601_offset, dmy_dash, ymd_dot, quarter, fiscal_year
      - finance: currency_symbol, bitcoin_address, isin, cusip
      - technology: ip_v6, calver
      - identity: username

    For each new type: create or source a CSV with ≥20 representative values, add to eval/datasets/manifest.csv with ground truth labels, update eval/schema_mapping.csv if needed. New datasets must NOT overlap with training corpus.
  gate: false
  checked: false
- id: AC-5
  description: |
    Root cause identified by spec review: double-probability gate in prepare_multibranch_data.py. augment_column() has 13/20 internal slots as "no_aug" (~65% no-op rate). augment_columns() gates on rng.random() < augmentation_rate. Combined effect: 0.35 × 0.35 = 12.25%, exactly matching v5's observed 12.2%.
    Fix: remove "no_aug" slots from augment_column()'s weighted choice table so that when a column is selected for augmentation (by the rate check), it always gets augmented. The --augmentation-rate flag then directly controls coverage.
    After fix: manifest must show augmented_columns/total_columns ≥ 30%. Augmentation types: whitespace, encoding, null_mix, case_variation (4 existing). format_mixing was never implemented — it is out of scope for this AC. If needed, it should be a separate feature AC with a design spec.
  gate: false
  checked: false
- id: AC-6
  description: |
    Root cause identified by spec review: blend_columns() correctly computes effective_spt = samples_per_type × oversample_multiplier (e.g., 9000). But the synthetic pool is generated flat at samples_per_type (3000) per type via generate_synthetic_columns(). When blend_columns() tries to allocate 9000, actual_s is capped by len(s_cols) = 3000, so total never exceeds ~5000.
    Fix: generate_synthetic_columns() must produce samples_per_type × oversample_multiplier synthetic columns for oversampled types. Either pass the oversample list to the generation step, or generate effective_spt columns per type when that type is in the oversample list.
  gate: false
  checked: false
- id: AC-7
  description: |
    Prerequisite: instrument the Sharpen pipeline to log a trace per column. Currently ColumnResult only records one disambiguation_rule, and feature_sharpen()/ value_sharpen() return on first match with no intermediate logging. Build minimal trace infrastructure: for each column, log the label before and after each rule stage (feature_sharpen, value_sharpen, header_sharpen), and which rules were evaluated (not just which fired).
    Then run models/sherlock-v5-current/ through profile eval with trace enabled. Analyze:
      (a) Rules that fired correctly for v4 but don't fire for v5 (confidence shift)
      (b) Rules that fire incorrectly for v5 (rescuing the wrong direction)
      (c) New rules justified by v5's specific error patterns
    Known candidate: iso vs iso_date T-separator check — the difference is meaningful for analysts and is exactly the kind of pattern Sharpen excels at. Per decision 0038: prefer retraining over new rules. Only add rules where the model demonstrably cannot learn the pattern.
  gate: false
  checked: false
- id: AC-8
  description: |
    Run the fixed pipeline end-to-end using v5 overnight infrastructure as base. CLI parameters match v5: 3000 samples/type, 3x oversample on confused types, 0.35 augmentation rate, adaptive epochs (minimum 20), seed 42. Only train one architecture (current — v5-scaled showed no benefit).
    Note: although CLI parameters are the same, behavior changes due to:
      - AC-5: augmentation no longer double-gated (effective rate ~35%, was ~12%)
      - AC-6: synthetic pool enlarged for oversampled types (9000 available, was 3000)
      - AC-2: generator collision fixes change training data distribution
    These changes are intentional. Document all behavioral differences from v5 in the overnight v6 script header.
    All generator fixes from AC-2 and data quality fixes from AC-5/AC-6 must land before training starts.
  gate: false
  checked: false
- id: AC-8b
  description: |
    Hugh reviewed the collision audit and identified types that don't spark joy for analysts. Remove 11 types (250 → 239) across 10 collapses:
    **Direct collapses (no structural difference):**
      - paypal_email → identity.person.email (identical validation)
      - form_data → container.key_value.query_string (identical validation)
      - geojson → container.object.json (JSON is JSON)
      - amount_minor_int → representation.numeric.integer_number (header-only signal, causes
        more harm than good — exactly the case where numeric_code over-classification hurts)
      - credit_card_expiration_date → datetime.date.month_year_slash (widen to accept MM/YY)

    **Hash consolidation (structurally indistinguishable):**
      - token_hex → technology.cryptographic.hash (random hex = hash output)
      - git_sha → technology.cryptographic.hash (40-char hex like SHA-1, content-based)
      - TSID stays separate (13-char Crockford Base32, time-sortable — different structure)

    **Text consolidation (length-only distinction, no analyst value):**
      - sentence + paragraph → representation.text.plain_text
      - word stays (structurally distinct — no spaces)
      - entity_name stays (meaningful category — orgs/products)

    **Niche removal:**
      - metric_prefix → representation.discrete.categorical (standalone SI prefixes too rare)
      - gender_symbol → removed (♂/♀/⚧ as column values vanishingly rare)

    **Hugh's domain notes from collision review:**
      - IATA, currency_code, http_method: finite code lists → record as Sharpen allowlists
      - numeric_code: existing F1/F5 rules already handle well (leading zeros → numeric_code,
        no leading zeros → integer). No change needed.
      - Hashes: hash/token_hex/git_sha structurally indistinguishable; TSID is different
      - EAN vs credit_card: add Luhn check at Sharpen stage (luhn crate already in deps)
      - Percentage vs yield: apply +/- sign rule at Sharpen stage
      - CPT: alphanumeric per docs, but purely numeric CPT codes inherently collide with
        postal_code/numeric_code — no taxonomy change, just awareness

    **Post-retrain Sharpen rules (deterministic, don't affect training):**
      - S1: IATA allowlist (~9,000 airport codes)
      - S2: Currency code allowlist (ISO 4217, ~180 codes)
      - S3: HTTP method allowlist (GET/POST/PUT/DELETE/PATCH/HEAD/OPTIONS)
      - S4: Credit card vs EAN — Luhn check
      - S5: Percentage vs yield — +/- sign prefix check
      - S6: Coordinate range check — lat must be ±90, long ±180 (5 eval misses)
      - S7: dmy_short_dot false positive check — basic date range validation (2 eval misses)
  gate: false
  checked: false
- id: AC-9
  description: |
    Evaluate sherlock-v6 on the expanded eval set (AC-4). Report both:
      - Expanded eval accuracy (new primary metric)
      - Legacy 190-column accuracy (historical comparison only)
    Target: ≥5 net column improvements over v5-current on expanded eval (stale label fixes alone should recover 2-3, so 5 is a reasonable floor for the combined work). Hard floor: no regression below v4 baseline (155/190) on the legacy set.
  gate: false
  checked: false
- id: AC-10
  description: |
    If AC-9 passes: update models/default symlink to sherlock-v6-current. Publish to HuggingFace meridian-online/finetype-model. Update CLAUDE.md with new accuracy numbers (on expanded eval). Update version to 0.6.13.
  gate: false
  checked: false
