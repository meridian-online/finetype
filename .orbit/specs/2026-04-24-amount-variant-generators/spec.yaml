id: 2026-04-24-amount-variant-generators
goal: |
  Diagnose why 11 finance.currency.amount* subtypes collapse to plain
  finance.currency.amount in v16/v18, apply mechanism-verified
  remediation, and unblock v19 retrain with a single-seed smoke
  baseline showing >=3 net target subtypes correctly predicted on the
  11 eval columns AND full-eval regression <= 1 label on the 352-row
  manifest.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: Corpus-count-per-subtype table produced for the v16 training corpus (v16-blend-70-30.ftmb, the shipped-model fixture; see constraint 10 for the v18→v16 pivot rationale). For each of the 11 amount subtypes plus plain amount, count distinct training rows that carry that label. Corpus is pinned via diagnostics/v16_corpus_hash.txt (SHA256 of the FTMB); the count script verifies the pin before tallying.
  gate: false
  checked: false
- id: ac-02
  description: Pairwise value-shape Jaccard matrix produced. For each of the 11 subtypes plus plain amount, sample 100 generated values via generator.generate_value(), hash each value to a char-class signature token (runs of digit/letter/separator/symbol collapsed to a canonical sequence), compute pairwise Jaccard of the signature sets.
  gate: false
  checked: false
- id: ac-03
  description: Confusion matrix on the 11 eval columns produced using v16 (models/default). For each subtype eval column in eval/datasets/csv/coverage_closure_phase_ab.csv, record v16's top-1 predicted label.
  gate: false
  checked: false
- id: ac-04
  description: Per-subtype confidence distribution produced. For each of the 11 eval columns, dump v16's raw model confidence (softmax output) over the top-5 predicted labels.
  gate: false
  checked: false
- id: ac-05
  description: Mechanism named in a MADR. Integrate evidence from ac-01..ac-04 and declare the primary mechanism via the closed-enum frontmatter field `primary_mechanism`. The MADR must also list at least three candidate mechanisms considered and rejected in a `## Ruled Out` section, each with a one-line evidence citation. MADR refines v18 handover's 'write per-subtype generators' framing.
  gate: false
  checked: false
- id: ac-06
  description: Remediation applied that addresses the mechanism named in ac-05 (read from the MADR's frontmatter `primary_mechanism` field). Concrete content conditional on the named mechanism. If mechanism == multi_cause, remediation must address each named sub-cause and clearly label which diff chunk addresses which sub-cause.
  gate: false
  checked: false
- id: ac-07
  description: Post-fix diagnostic artefact demonstrates the mechanism is measurably reduced. Rerun whichever of ac-01..ac-04 evidenced the mechanism, with the same scripts, writing the post-fix output alongside the pre-fix file. The mechanism token is read from ac-05 MADR frontmatter (`primary_mechanism` field) — no markdown-body parsing.
  gate: false
  checked: false
- id: ac-08
  description: 'v19 smoke run completed: 1 seed x 100 epochs on the post-fix corpus (seed 42, matching v18 lineage). Per-subtype label-accuracy delta vs v16 on the 11 eval columns computed. Full-eval delta on the 352-row manifest also computed.'
  gate: false
  checked: false
- id: ac-09
  description: 'Target-subtype unblock gate: sum(delta) >= 3 across the 11 target subtypes. Result recorded to diagnostics/v19_smoke_verdict.txt as exactly `GO` or `NO-GO` (no whitespace, no trailing newline). If this gate fails (verdict NO-GO), v19-proper remains blocked pending a follow-up spec.'
  gate: false
  checked: false
- id: ac-10
  description: 'Non-target regression guard: full-eval delta across the 341 non-target columns must be >= -1 (i.e., no more than 1 net label regression). Result recorded to diagnostics/v19_smoke_regression_verdict.txt as exactly `PASS` or `FAIL`. If this gate fails, ac-09''s GO verdict is overridden and v19-proper remains blocked.'
  gate: false
  checked: false
- id: ac-11
  description: MADR authored codifying the v19 retrain hard gate. This decision complements decision 0062 (v18 HELD) by declaring that no v19 sweep may start until an amount-subtype collapse mechanism is diagnosed and remediated, and no v19-proper promotion may happen unless both ac-09 GO and ac-10 PASS.
  gate: false
  checked: false
  ac_type: doc
- id: ac-12
  description: 'MADR authored recording the framing correction: ''diagnose amount-subtype collapse'' supersedes v18 handover''s ''write per-subtype generators from scratch'' framing. Cross-references the lines in .orbit/specs/2026-04-21-v18-retrain/handover.md that carried the superseded framing.'
  gate: false
  checked: false
  ac_type: doc
- id: ac-13
  description: CLAUDE.md 'What's next' section updated to reflect the v19 unblock/block status based on the combined ac-09 + ac-10 outcome (GO requires both gates green). v18 handover gets a Follow-up section pointing to this spec.
  gate: false
  checked: false
  ac_type: doc
