id: 2026-06-16-duckdb-shellout-ingestion
goal: Validate via a no-compile-risk shell-out spike whether the CLI can route CSV/Parquet ingestion through the external duckdb CLI (cross-platform incl Windows duckdb.exe, faster than the csv crate on large files); on green, require duckdb-on-PATH as a hard dependency, consolidate ingestion via shell-out, and universalise the free-stats + short-circuit path; on red, fall back to a prebuilt-libduckdb link or status quo. Per choice 0100 (supersedes 0099's link framing).
cards:
- 0007-duckdb-sql-extension
- 0014-profile-validate-precision
status: open
labels:
- duckdb
- ingestion
- spike
acceptance_criteria:
- id: ac-01
  description: |
    SHELL-OUT SPIKE (gate, BLOCKING) — the deciding experiment of choice 0100,
    and crucially NO COMPILE RISK (it invokes a binary; it does not link
    libduckdb, so the Windows/MSVC amalgamation failure that sank 0099 cannot
    occur). Prototype an ingestion path that invokes the external `duckdb` CLI to
    read a CSV (and Parquet) and emit, per column, a value sample + full-column
    stats (`count(*)`, `approx_count_distinct`, `min`, `max`) in one SQL query —
    mirroring validate's existing shell-out plumbing (validate.rs). Verify it
    runs on macOS, Linux, and WINDOWS with `duckdb.exe` (a normal CI matrix).
    Benchmark vs the csv-crate `read_csv_input` on a LARGE csv + a small one (to
    find the spawn-overhead crossover). GREEN = works on all three OSes AND
    faster on the large file (+ profile parity vs csv-crate). RED = fall back
    (ac-06).
  gate: true
  checked: true
  ac_type: observation
- id: ac-02
  description: |
    (GREEN-only) HARD DEPENDENCY. Declare the `duckdb` CLI a required runtime
    dependency: add it to the Homebrew formula deps, document it in
    docs/DEVELOPMENT.md + the README, and give a single clear actionable error
    when it is absent (validate already has the shape:
    "could not invoke duckdb CLI (is duckdb on PATH?)"). Formalises a dependency
    validate's Parquet/materialise paths already effectively have.
  gate: false
  checked: true
- id: ac-03
  description: |
    (GREEN-only) CONSOLIDATE INGESTION via shell-out. Route CSV + Parquet
    profiling through the duckdb CLI: read → per-column sample + full-column
    stats in one query → the shared finetype-model engine. PARITY vs the
    csv-crate reader on a fixture set (null-ish filtering, ragged rows, delimiter
    auto-detect, headers). Decide from the ac-01 small-file crossover whether to
    DELETE `read_csv_input` entirely (full consolidation, the analyst's goal) or
    keep it as the small-file fast path; record the call.
  gate: false
  checked: true
- id: ac-04a
  description: |
    (GREEN-only) FREE-STATS PLUMBING — no behaviour change, parity-gated. Compute
    per-column full-column stats (count, distinct, numeric min/max, all-integer,
    and the increment signature: contiguous + near-unique non-negative integer
    run) at the classify convergence point — `classify_column(values)` in the
    model crate, where EVERY input (CSV / Parquet / JSON / DuckDB table) already
    holds the full materialised column. Surface them as a typed struct the rule
    layer / short-circuit can read BEFORE the neural pass. Free: no extra I/O (the
    column is already in hand), exact (no HLL needed at this scale). Closes the
    deferred `2026-06-16-column-statistics-lever` ac-07 (free-stats). GATE: parity
    only — stats computed and surfaced; nothing yet consumes them to change a
    label. Build FIRST: ac-04b and ac-04c both read these stats; zero gate risk.
    NOTE (boundary refined during design, 2026-06-17): the skip's PRIMARY win is
    skipping the NEURAL PASS, not the file read — the read has already happened by
    the rule layer. So stats are computed in Rust here, NOT via a DuckDB SQL
    aggregate (a separate SUMMARIZE query would RE-SCAN the file — a double-read).
    The DuckDB-side / un-materialised-column path (never pull a huge column into
    Rust) is a SECONDARY memory optimisation deferred to ac-04c, adopted only if
    profiling shows the read dominates.
    DONE (f1e047d): ColumnScanStats landed at the classify convergence point
    (column/mod.rs) with parity tests; nothing consumes it (parity held).
  gate: false
  checked: true
  ac_type: code
- id: ac-04b
  description: |
    (GREEN-only) DECISIVE-STAT SWEEP STUDY — settles the conservatism question by
    measurement, not by fiat (design: interview.md, 2026-06-17). The short-circuit
    is a CARVE-OUT: serve the slice of columns where a full-column stat is >=98%
    precise, fast, skipping the neural pass; neural handles the rest. For each
    candidate predicate — increment, exact-binary, low-cardinality->categorical,
    high-cardinality->alphanumeric_id — build the affirmative predicate with a
    tunable strictness knob and sweep loose->tight. At each setting read four
    dials: captured-column count, slice precision on gold (over ONLY captured
    columns), corpus-honest verdict (ac-01 stratified sample), throughput delta.
    DELIVERABLE: the per-predicate {knob -> captured-count, slice-precision,
    corpus-honest, throughput} curve. The ship setting for each predicate is the
    LOOSEST knob position holding slice precision >= 0.98 AND corpus-honest GO AND
    no whole-corpus gold-headline regression. A predicate that cannot reach 0.98 at
    any setting without relocating does NOT get to skip (categorical is the
    expected such case — a known residual attractor; let the study reject it
    cleanly, do not tune it to pass). Run this BEFORE any skip code.
    DONE (2026-06-17): study complete — scripts/sweep_decisive_stats.py,
    output/decisive-stat-sweep/{sweep.md,finding.md}. RESULT: NO-GO for the skip.
    ALL FOUR predicates fail the >=0.98 gold slice-precision pre-condition by a
    wide margin (categorical 0.33, alphanumeric_id 0.63, increment ~0.13, binary
    0.00) — each stat's signature is shared by a high-frequency impostor it can't
    see past (codes/years under categorical; URLs/UUIDs/addresses under alnum;
    year-ranges/ranks/IDs gold-labelled integer_number under increment;
    constants + sparse 0/1 integer counts under binary, gold support 0). The
    binary/increment skips would re-assert the exact labels two shipped
    gold-validated vetoes EXIST TO STRIP. corpus-honest is moot (nothing clears
    the first gate). Conservatism answer, from data: tighter than any bare stat
    can express -> the skip premise fails; the lever survives only as a post-pass
    rule that keeps the neural vote.
  gate: false
  checked: true
  ac_type: observation
- id: ac-04c
  description: |
    (GREEN-only) SHIP ELIGIBLE SKIPS. Wire the neural short-circuit for each
    predicate the study (ac-04b) cleared, at its loosest-safe knob setting. Reuse
    the shipped affirmative predicates where they exist (`values_form_increment`
    == Some(true) -> increment; exact-{0,1} domain -> binary — both already
    demote-validated in column/mod.rs). Conservative only: skip ONLY when decisive,
    else neural runs (over-eager skip = silent misclassification). Each shipped
    skip clears its three blocking co-conditions: slice precision >= 0.98 + gold
    headline non-regression + corpus-honest GO (H05, the only relocation detector).
    Record measured throughput with vs without the short-circuit. Closes the
    deferred `2026-06-16-column-statistics-lever` ac-05 (short-circuit).
    RESOLVED NO-OP (2026-06-17): ac-04b returned NO-GO — no bare full-column-stat
    predicate clears the >=0.98 gold pre-condition, so NOTHING ships as a skip
    (the explicit no-op branch this spec's NO-GO philosophy anticipates). The
    short-circuit speed premise does not survive the data. The column-statistics
    accuracy lever survives as a POST-PASS recall rule (keeps the neural vote,
    layers value-shape guards; 0048/0096 pattern) — to be filed as a SEPARATE
    recall spec, NOT this skip. ac-04a free-stats plumbing feeds it.
  gate: false
  checked: true
  ac_type: code
- id: ac-05
  description: |
    DECISION CLOSE. Flip choice 0100 `accepted` (green, shipped) or `rejected`
    (red). Update CLAUDE.md (ingestion path) + docs/RELEASE.md. Because shell-out
    adds NO compile dependency, the cross-platform release build is unchanged —
    note this explicitly (the contrast with 0099). Bank a memory.
  gate: false
  checked: true
  ac_type: doc
- id: ac-06
  description: |
    (RED-only) FALLBACK. If shell-out fails cross-platform or is too slow:
    consider option 4 (link a PREBUILT libduckdb via DUCKDB_LIB_DIR — the
    official Windows binaries, NOT the bundled amalgamation that failed 0099) as
    a separate spike; else stay on 0099 Option 2 (lean csv-crate baseline +
    extension as the fast path). Record the failing dimension. Explicit no-op
    branch so a NO-GO lands cleanly.
  gate: false
  checked: false
  ac_type: doc
