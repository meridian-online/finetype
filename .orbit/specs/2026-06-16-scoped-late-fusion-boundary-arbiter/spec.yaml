id: 2026-06-16-scoped-late-fusion-boundary-arbiter
goal: Recover the column-level-ambiguous recall gaps that the flat-softmax Sense model and deterministic guards provably cannot, via a late-fusion arbiter BOUNDED to a pre-declared confusable boundary set so it never collapses the label space (the wall that closed the general-replacement bet) — each boundary proven to beat the rule baseline through the gold corpus + corpus-honest gate before promotion.
cards:
- 0002-semantic-type-detection
status: closed
labels:
- recall
- fusion
- architecture
acceptance_criteria:
- id: ac-01
  description: |
    SCOPE LOCK — the confusable boundary set the arbiter is ALLOWED to touch,
    and nothing else. The general 240-type fusion replacement is dead: it
    failed the corpus-honest gate twice (spec 2026-06-08-late-fusion-sense-
    classifier, output/late-fusion/ac07_ship_gate_decision.md) by the same
    structural wall — the value-level view, faced with the majority of real
    columns that carry no decisive per-value signal, defaults to the generic
    attractors (categorical/unknown) and drags the whole corpus there at
    breadth (47 types collapse to near-zero, categorical 6.05x over-emit,
    unknown +68%). This spec does NOT retry that. Enumerate a SMALL set of
    boundaries, each with written evidence of BOTH: (a) it is column-level-
    ambiguous — the flat softmax confuses it AND no value-based deterministic
    guard can win (cite the proof); (b) there is a DECISIVE signal a bounded
    arbiter can read, and WHICH view supplies it. Seed set to evaluate:
      - tight-code-vs-alphanumeric_id (VALUE-decisive; the proven family-A
        win, gold anchor 17%->93%, Sharpen-unreachable — option 2 of the prior
        ship-gate fork). The strongest first candidate.
      - latitude/longitude-vs-decimal_number (VALUE+SIBLING-decisive; arch test
        recovered lat/lon 0->74%/82% while decimal survived, output/value-
        level-arch-test/findings.md). Note the irreducible single-value
        ambiguity: 40.7128 is both — the sibling distribution is the tiebreak.
      - currency.amount-vs-decimal/integer (HEADER/COLUMN-decisive, NOT value-
        decisive). Proven this session: the 5 gold currency cols (NYC payroll
        base_salary/...; UK price) are 100% bare numbers, zero in-value symbol
        (memory currency-gold-gap-is-column-level) — the value view is blind to
        them too; only the header disambiguates. This boundary is GATED on
        ac-03 (column-context view) actually training; if it cannot, currency
        stays out of scope, honestly documented, and v1 ships value-decisive
        boundaries only.
    OUT OF SCOPE, explicit: the residual categories (categorical / ordinal /
    alphanumeric_id / plain_text — training-resistant attractors, choice 0096,
    memory categorical-is-a-residual-category) as fusion TARGETS, and any
    general replacement of the v19 label space.
  gate: false
  checked: false
  ac_type: doc
- id: ac-02
  description: |
    PRECEDENCE SEMANTICS — designed in, the lesson the two prior cycles paid
    for. v19 OWNS the label space. The arbiter is not an additive blend over
    the full 240-vector (that is exactly what collapsed: head + multi-branch
    summed, head's categorical/unknown logits swamped correct-but-moderate
    multi-branch votes). Instead the arbiter fires ONLY when ALL hold:
    (1) v19's emitted label is a member of a confusable boundary from ac-01;
    (2) the arbiter's score for the within-set alternative clears a per-
    boundary confidence FLOOR; (3) for HEADER-decisive boundaries, the column-
    context view corroborates. Everywhere else — every column whose v19 label
    is not in the set, and every in-set column below the floor — v19 passes
    through UNTOUCHED. Specify, per boundary: the trigger label(s), the floor,
    the corroboration predicate, and a named kill switch (rhh::is_disabled
    style) so any single boundary can be cut without a rebuild. Deliverable:
    a precedence design note in the spec folder.
  gate: false
  checked: false
  ac_type: doc
- id: ac-03
  description: |
    COLUMN-CONTEXT VIEW — the piece the prior B3 was missing. That spec DROPPED
    View3 (standalone sibling-context) because the labelled corpus
    (distillation-v3) carries no file_sha/header/siblings, so it leaned on
    View2 (multi-branch, which sees header+siblings only at inference). The
    HEADER-decisive boundaries (symbol-less currency: base_salary, price)
    cannot be recovered without a view that reads the header/column context at
    TRAIN time — proven this session that neither value nor a guard can see
    them. Build or secure a column-context feature (header embedding +
    sibling-distribution summary) present at BOTH train and inference. Resolve
    the training-corpus gap: re-dump fusion features over a corpus that carries
    header+siblings (corpus-pass parquet has them), or build a header+sibling
    labelled set. If the context view provably cannot be trained on available
    data, RECORD that and drop the header-decisive boundaries from v1 (ship
    value-decisive only) — do not fake it. Reuse: value-charcnn-v25 (trained,
    ac-01 of prior spec), the dump-fusion-features Rust subcommand (built).
  gate: false
  checked: false
- id: ac-04
  description: |
    BOUNDED ARBITER HEAD (Python research, fast iteration on cached features).
    Train a small head restricted to the confusable set: given value-view +
    column-context + v19 logits for an in-set column, output the within-set
    decision. Measure on the gold corpus: per-boundary RECALL must improve vs
    the current shipped default (the rule baseline), AND the collapse canaries
    must NOT move — track emission of the rare structured types the prior cycle
    gutted (top_level_domain, npi, uuid, geohash, utc-offset, upc) as a
    standing guard; any near-zero collapse is a design failure, not a tuning
    miss. Deliverable: per-boundary recall table + canary table.
  gate: false
  checked: false
- id: ac-05
  description: |
    PRE-PORT KILL SWITCH (gate, BLOCKING H05). Score the Python arbiter's
    predictions through the corpus-honest gate on the ac-01 stratified sample
    (scripts/corpus_honest_gate.py, the only relocation detector). BLOCKING:
    NO label-space collapse band, over_emit within the 3x band, no oracle_fp
    explosion. This is the cheap gate the prior general-replacement cycles
    correctly failed — the bounded design must clear it precisely because it
    leaves 239 types on v19. NO-GO (exit 1) = do not port to Rust. Mandatory
    destination-context check: the arbiter must not relocate any OUT-of-set
    label.
  gate: true
  checked: false
  ac_type: observation
- id: ac-06
  description: |
    RUST PORT. Port the bounded arbiter to the engine path. The prior spec left
    ModelType::LateFusion scaffolding (main.rs, fusion_manifest.json, cmd_profile
    wiring) — reuse it, but constrain the fused decision to the confusable set
    per ac-02 precedence (the prior port fused over the full vector). Parity
    test: Rust predictions match the Python head on the labelled sample within
    tolerance. Kill switches from ac-02 wired and defaulted per-boundary.
  gate: false
  checked: false
- id: ac-07
  description: |
    FULL POST-PORT SHIP GATE on the RUST path (gate, BLOCKING H05). The bar is
    the promotion order (choice 0095): gold corpus no-regression AND per-
    boundary recall win on gold AND corpus-honest GO on the Rust path AND
    Sense-distribution drift check vs v19. MUST BEAT THE RULE BASELINE — recover
    boundaries the shipped guards cannot, with ZERO regression on what they
    already fixed (postal, checksum, binary, url, city/region, country-code).
    A corpus-honest NO-GO is blocking and final. A GO is advisory until the
    gate clears its first genuine GO (gate GO-precision still unvalidated —
    safety_score precedent, memory finetype-retrain-authority).
  gate: true
  checked: false
  ac_type: observation
- id: ac-08
  description: |
    PROMOTION — models/default swap + release per docs/RELEASE.md, ONLY on a
    clean ac-07. Version bump, CHANGELOG in user-experience framing (e.g.
    "FineType now tells salary and price columns apart from plain decimals"),
    gold baseline doc updated. If only a subset of boundaries cleared, ship
    that subset and leave the rest open.
  gate: false
  checked: false
  ac_type: ops
- id: ac-09
  description: |
    DECISION MEMO — did the BOUNDED arbiter hold-and-improve where the general
    replacement collapsed? Record per-boundary outcome, the gate readings, and
    the architecture verdict: is a scoped boundary arbiter the right shape for
    column-level-ambiguous recall, or does even the bounded form fail? Bank the
    findings either way; update card 0002 and the relevant memories. This is the
    pillar-4 deliverable — the substrate the next recall bet reads.
  gate: false
  checked: false
  ac_type: doc
