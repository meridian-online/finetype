acceptance_criteria:
- id: ac-01
  description: |
    Stratified corpus sample that resolves rare labels — closes flaw 1
    (rare-label undersampling). Build a fixed column/file list keyed to the v19
    baseline label distribution (eval/gittables/corpus_pass/columns.parquet): take
    EVERY column of any label below a frequency floor (latitude, longitude, the
    coordinate/rare-geography family — each ~0.1–0.3%), and cap each common label at
    a ceiling (decimal, categorical, word). Deliver: the list file (reusable via
    snapshot_sense_distribution.py --file-list); its total column count and the
    fraction of the 504,454-column full pass it represents (target ≤ 15%); and a
    per-label resolution table proving EVERY label retains enough columns to resolve
    a 3× rate shift (the move size v23/v24 exhibited). The acceptance bar is the
    resolution table, not the size — small is only valuable if latitude is still
    legible in it.
  gate: false
  ac_type: code
  checked: false
- id: ac-02
  description: |
    Oracle-honest FP scorer — closes flaw 2 (the gameable metric). Implement a
    per-label false-positive count that is NOT conditioned on a non-null oracle:
    every column predicted as label L is adjudicated, INCLUDING ydf=None columns,
    by the gated-YDF lens (does ≥50% of the column's sample pass L's JSON Schema?
    — the canonical ydf_prediction_gated rule). The ydf-abstain bucket is tracked
    as an EXPLICIT destination so that relocation INTO it (latdec's exact move) is
    visible and counted, not silently dropped. Deliver the scorer (extending
    scripts/drift_report.py / the corpus-pass scoring), and demonstrate on the
    latdec parquet that it counts the ~4,417 ydf=None latitude FPs the bet's
    original metric drove to zero.
  gate: false
  ac_type: code
  checked: false
- id: ac-03
  description: |
    THE GATE — trust by reproduction. Run the stratified, oracle-honest gate
    (ac-01 sample + ac-02 scorer) against the four labelled corpus-scale outcomes
    on disk and confirm it reproduces every verdict FROM THE SAMPLE ALONE:
    (a) v19 vs itself → GO, no false alarm; (b) latdec → NO-GO, firing specifically
    on the latitude relocation (the ydf=None feature-float FPs), i.e. the verdict
    the gold anchor + m-19 + proxy all MISSED; (c) v22 → NO-GO on geography
    (country/region/city); (d) v23 → NO-GO on the categorical explosion. A gate
    that misses ANY known failure, or false-alarms on v19, is rejected and the
    sample/scorer re-scoped before anything downstream is trusted. Record the
    per-outcome verdict + the load-bearing movers for each. This is the gate AC:
    nothing about the instrument is trustworthy until it re-derives the four
    answers we already know.
  gate: true
  ac_type: observation
  checked: false
- id: ac-04
  description: |
    Cost — cheap enough to run in the loop, not as a 9-hour event. Measure the
    stratified pass wall-clock end to end (sample profile + score) on one candidate.
    Target: ≤ ~20% of the 9.08h full corpus pass (≤ ~2h), so the corpus-honest
    verdict becomes a routine post-train gate every retrain runs, not a special
    overnight instrument reserved for the final candidate. Record the wall-clock and
    the column throughput; if the target is missed, record what dominates (profile
    subprocess vs score) so the next cut is informed.
  gate: false
  ac_type: observation
  checked: false
- id: ac-05
  description: |
    Wire it into the promotion contract. Update CLAUDE.md's instrument map and the
    B08 promotion gate (memory finetype-retrain-authority) so a new default REQUIRES
    a corpus-honest GO from this gate alongside m-19 / gate / vci3 — and name, in one
    place, what each instrument can and cannot see (gold anchor = efficacy on curated
    columns; proxy = pre-train over-emit on common boundaries; THIS = corpus-honest
    rare-label relocation incl. the ydf-abstain bucket). The point the latdec NO-GO
    bought: gold-anchor + ship-gate is NOT sufficient to promote; corpus breadth is
    the only thing that catches a fix that relocates rather than removes.
  gate: false
  ac_type: doc
  checked: false
- id: ac-06
  description: |
    Pre-train reach — can the honest gate move EARLIER? (Investigation, recorded
    either way.) Run the stratified honest gate on the proxy's 10-epoch latdec model
    and test whether it predicts the 50-epoch corpus NO-GO. If YES, the gate moves
    pre-train and upgrades the proxy — the relocation is legible before the overnight
    spend. If NO, record that cheapness must come from sampling not epochs (the
    head-unsettled finding from ac-05 of the latdec spec, confirmed for relocation),
    and the gate stays a post-train instrument. Either outcome is a durable finding
    about where in the loop honesty is affordable.
  gate: false
  ac_type: observation
  checked: false
