id: 2026-06-07-corpus-honest-quality-gate
goal: |
  Build a corpus-scale model-quality gate that is BOTH honest (it counts the false
  positives the curated instruments cannot see) AND cheap (it runs on a stratified
  sample in a fraction of the 9-hour full corpus pass), so that a retrain candidate
  can be judged at corpus scale BEFORE it is promoted — not 9 hours and one
  overnight too late. The gate earns trust the only way it can: by reproducing every
  corpus-scale verdict we already know the answer to (v19 GO; v22, v23, latdec
  NO-GO) from the stratified sample alone.

  ## Why now — three retrains have failed the same way, and our instruments lied

  Additive retrains are now 0-for-3 on producing a promotable default, and every one
  failed identically: it passed every fast/curated instrument and was a corpus-scale
  regression that only the 9-hour full corpus pass caught.

  - v22: gold/manifest fine; gated cell-2 −10.4% on 503k cols, geography collapsed
    (country −31.5%, region −12.8%, city −10.2%). Promotion deferred.
  - v23: top-6 clusters trained cleanly; categorical exploded +529% and pulled ~48k
    geography columns into it. Shipped Failed.
  - latdec (2026-06-06): the sharpest case. Gold anchor GO (family C perfect, 3
    seeds), m-19 +1.79% (369→377), drift proxy GO. By every instrument we own it WAS
    the breakthrough. The 9-hour corpus pass then showed it RELOCATED the confusion:
    the bet's own FP metric (sense=latitude AND ydf=decimal) hit ZERO, but 4,417 NEW
    latitude false positives appeared on ydf=None columns — feature floats (ver, cam,
    HitRate, gpa) the metric structurally could not see. ~60% WORSE on the target
    boundary at corpus scale. NO-GO.

  The latdec post-mortem named two measurement flaws (memory
  latdec-corpus-fp-relocation) that this spec exists to close:

  1. RARE-LABEL UNDERSAMPLING. latitude is 0.13% of columns; the proxy's fixed
     1,000-file list catches ~18 latitude columns — far too few to resolve a +23%
     corpus shift. The proxy is calibrated for over-emit EXPLOSIONS on COMMON
     boundaries (v23 categorical 4.69×, v24 latitude 4.3×); a drift on a 0.13% label
     sits under its floor.
  2. AN ORACLE-GAMEABLE FP METRIC. "sense=L AND ydf=decimal" only counts FPs YDF can
     see. Relocating FPs onto ydf=None columns drives the metric to zero while the
     error count RISES. Any honest FP metric must NOT be conditioned on the oracle
     being non-null — it must adjudicate the abstain bucket explicitly.

  ## What the gate is, and what each existing instrument cannot see

  This gate does NOT replace anything. It fills the one hole all three current
  instruments share — corpus-scale honesty on rare-label relocation:

  - gold anchor (240 curated cols) — an EFFICACY instrument. Sees whether the fix
    LANDS on the hard columns. Structurally blind to where the softmax rebalance
    SENDS untargeted neighbours at scale.
  - m-19 (448-row manifest) — curated breadth. Same blindness.
  - destination-drift proxy (1,000-file sample, 10-epoch) — a PRE-train over-emit
    detector. Catches common-boundary explosions; blind to rare-label relocation and
    to the abstain bucket. Its first forward use (latdec ac-03) was 1-for-1 on the
    up-gate it is built for and mis-directed two untargeted labels — exactly as
    designed, and exactly insufficient to promote on.
  - THIS gate — corpus-honest, stratified, oracle-abstain-inclusive. The
    promotion-grade instrument the gold anchor and m-19 are not.

  ## Why cheapness must come from STRATIFIED SAMPLING, not the obvious shortcuts

  The full corpus pass is 9.08h because it subprocess-profiles ~504k columns. Two
  tempting shortcuts both reintroduce a blindness we have already paid for:

  - Uniform downsampling re-creates flaw 1 (rare labels vanish) — it IS the proxy's
    failure.
  - Fewer epochs re-creates the head-unsettled blindness: latdec ac-05 showed TLD
    RISING at 10 epochs and COLLAPSED at 50 — a 10-epoch snapshot caught the head
    mid-trajectory and pointed the wrong way.

  So the cheapness comes from a STRATIFIED sample keyed to the v19 baseline label
  distribution: take EVERY column of a rare label (latitude's whole ~650-col
  population is trivially cheap) and cap the common labels (decimal is 31% — sample
  it down hard). This SHRINKS the 504k while RAISING resolution on the labels that
  keep killing us. Cross-model snapshots MUST share one fixed file/column list
  (snapshot_sense_distribution.py --file-list); DuckDB reservoir sampling is not
  seed-reproducible.

  ## The substrate we already have to validate against

  Four labelled corpus-scale verdicts sit on disk — the gate is only trustworthy if
  it reproduces all four from the stratified sample alone:
  - v19 baseline: eval/gittables/corpus_pass/columns.parquet (+ output/
    ydf-validation-gate/v19_gated.parquet) — the true GO.
  - v22: output/ydf-validation-gate/v22_gated.parquet — geography NO-GO.
  - v23: output/ydf-validation-gate/v23_gated.parquet — categorical-explosion NO-GO.
  - latdec: eval/gittables/corpus_pass_latdec/corpus_pass/columns.parquet — the
    relocation NO-GO the curated instruments missed.

  ## Pillar defence

  Pillar 4 (long-running R&D) and pillar 3 (agent state-persistence). The gate is the
  substrate every future Sense retrain depends on; building it once amortises across
  every iteration after latdec, and it is the instrument that lets an agent recognise
  a real breakthrough instead of chasing a mirage overnight. Precedent: safety_score
  shipped advisory and accrued validation from real bets — this gate's trust accrues
  the same way, by reproducing labelled outcomes rather than by assertion.

  ## Out of scope

  - The sibling-context model bet itself (the actual fix for the lat/decimal family).
    It is the first MODEL candidate to run THROUGH this gate, a separate spec — there
    is prior art under .orbit/specs/*sibling-context*. This spec builds the
    instrument, not the model.
  - The HuggingFace publish / models/default swap (release runbook, deliberate
    reviewed action).
  - Re-deriving the proxy's pre-train calibration band. The proxy stays as-is; this
    gate is the post-train corpus-honest layer alongside it, not a re-tune of it.
cards:
