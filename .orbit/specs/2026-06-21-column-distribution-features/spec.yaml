acceptance_criteria:
- id: ac-00
  description: |
    B07 CONSUMER-GRAPH AUDIT of the feature contract before any load-bearing edit (H03).
    Enumerate every consumer of FEATURE_DIM / FEATURE_NAMES (features.rs), the column
    stats branch (mean/var/min/max), the FTMB stats slot + its dim in the writers/reader,
    value_feature_row / value_feature_dim (the YDF value pipeline, spec 2026-06-04), and
    extract-features. DELIVERABLE: consumer list + the exact edit set per surface + a
    format plan for the widened column feature slot (FTMB version bump or new slot;
    old models still load). KEY QUESTION: do the new features extend the COLUMN stats
    branch (column-level, where cardinality/range must live) or a new dedicated branch?
    CLOSED 2026-06-21 (ac00_audit.md). PREMISE CORRECTED: cardinality is ALREADY present
    (extract_column_stats / COLUMN_STATS_DIM=27 has col_entropy + frac_unique; the
    mod.rs:2266 "cannot see cardinality" is the separate value/fusion head, not the Sense
    multi-branch). Genuinely ABSENT: numeric value/range, column-level precision,
    sequentiality. EDIT: extend extract_column_stats — the UNIFIED Rust path (same fn at
    training-feature extraction AND inference -> NO train/inference skew, NO candle, FTMB
    reader dim-agnostic so NO format bump; per-value FEATURE_DIM/YDF UNTOUCHED). Blast
    radius: one Rust fn + COLUMN_STATS_DIM + STATS_DIM(py) + config stats_dim + retrain.
    ac-01 drops cardinality; ac-03/04 narrow to range/increment (0096 holds for
    categorical/id since cardinality was always present).
  ac_type: doc
  gate: true
  checked: true
- id: ac-01
  description: |
    COLUMN-DISTRIBUTION FEATURE SET. EXTEND extract_column_stats (ac-00) with the column-
    level signals it is genuinely missing (cardinality/entropy already present — do NOT
    re-add). NOT an embed competitor (the prior ac-01's error):
      - numeric value & range: parse to number -> min/max/mean/std/percentiles, sign
        fraction, signed-log magnitude, bounded-ness  [coordinates/year/unix/port/amount]
      - column-level precision: aggregate decimal_places (mean/max) — absent from the 27
      - sequentiality: monotonic fraction, contiguous-integer-run ratio, sortedness  [increment]
      - length consistency: fixed-width fraction, leading-zero fraction  [codes/postcodes]
    DELIVERABLE: the extended extract_column_stats (COLUMN_STATS_DIM 27->N, dim-agnostic FTMB
    reader, STATS_DIM/config updated) + COLUMN_STATS_NAMES.
    CLOSED 2026-06-21: extract_column_stats 27->44 (parsed range/precision/sequentiality
    appended; 27 unchanged). Backward-compat: inference slices stats[..config.stats_dim] ->
    v19 byte-identical (verified: still types lat->latitude). extract-features emits 44;
    STATS_DIM/cdist-config updated; FTMB reader dim-agnostic (no format bump); clippy clean.
  ac_type: code
  gate: true
  checked: true
- id: ac-02
  description: |
    SEPARATION PROBE (cheap pre-train gate). Does adding distribution features lift the
    separability of the recurring confusions vs the current feature set — coord-vs-decimal,
    categorical-vs-free-text, id-vs-categorical, increment-vs-integer? 5-fold CV classifier
    on stats+distribution vs stats-alone (reuse probe_range_features.py shape). REQUIRE a
    material lift on >=2 of these confusions; else the features do not carry the signal and
    the retrain is not worth running.
    CLOSED 2026-06-21 GO: stats-27+coldist lifts coord-vs-decimal 0.690->0.780 (+0.089) and
    multi-class +0.07 (probe_coldist.py, 414 gold cols). Two confusions clear the bar.
  ac_type: code
  gate: true
  checked: true
- id: ac-03
  description: |
    RETRAIN + LEARNED-DISTINCTION TEST (the core hypothesis). Retrain the multi-branch with
    the extended stats; score standalone gold (predict_multibranch). REQUIRE the model now
    LEARNS the RANGE/SEQUENCE distinctions it needed rules for: coordinates recovered WITHOUT
    the 1:1 decimal loss the logit-adjust sweep showed (latitude up, true-decimal recall
    held), and increment/serial vs integer improved. (Categorical/id are NOT in scope —
    cardinality was always present.) >=2/3 seeds beat the floor by >CI. GO -> ac-04; NO-GO ->
    the features did not transfer; rules stay.
  ac_type: observation
  gate: true
  checked: false
- id: ac-04
  description: |
    RULE-SIMPLIFICATION AUDIT + 0096 VERDICT (the payoff). With the model now seeing
    range/sequence, test which RANGE/SEQUENCE rule-gates become redundant — the increment
    contiguity check and the coordinate plausibility gate (NOT the cardinality gates, which
    the model already had cardinality for). Turn each off and confirm accuracy holds (the
    model subsumes it). DELIVERABLE: the list of rules the model now learns + the refined
    0096 verdict (residual-precedence learnability is bounded by feature coverage: range/
    sequence were absent and may now be learnable; cardinality was present and 0096 still
    holds for categorical/id). Each rule removal gate-shipped + ledgered with a kill switch.
  ac_type: code
  gate: true
  checked: false
- id: ac-05
  description: |
    COMPOSED GATE + CORPUS RELOCATION + SWAP. The features are deterministic/static, so the
    model runs the normal Sense->Sharpen pipeline — the composed gold number is free (no
    candle build). Score composed gold vs v19 0.798 and representative vs 0.691; run the
    corpus-relocation gate (H05, blocking). REQUIRE improve-or-hold on the blocking gates.
    GO -> swap models/default, version bump, CHANGELOG, count surfaces; NO-GO -> documented
    fallback to the escalation (the new features may still ship as substrate).
  ac_type: observation
  gate: true
  checked: false
