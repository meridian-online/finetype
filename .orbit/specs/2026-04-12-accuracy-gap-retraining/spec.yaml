id: 2026-04-12-accuracy-gap-retraining
status: closed
goal: |
  Close the profile eval accuracy gap from 193/227 (85.0%) to 205/227 (~90%) by retraining the ReLU+BN multi-branch model on a distillation-heavy (70/30) data mix with real Model2Vec headers and sibling-context enrichment. Publish the new model to HuggingFace as the default if the threshold is met.
acceptance_criteria:
- id: ac-01
  description: |
    Quick audit of 34 remaining misclassifications. Classify each as WRONG (model error), DEBATABLE (ground truth questionable), or AMBIGUOUS (can't distinguish without external context). Document in eval-audit-v2.md.
  ac_type: doc
- id: ac-02
  description: |
    Fix any DEBATABLE labels found in ac-01 — add accepted alternatives to schema_mapping.yaml and/or interchangeability rules to matching.rs and eval_profile.sql. Recalibrate baseline after fixes.
  ac_type: code
- id: ac-03
  description: |
    Prepare a fresh FTMB file with 70/30 distillation:synthetic mix. Distillation source: Sherlock annotated (102k annotations from HuggingFace). Synthetic source: finetype-synthetic (5k/type, 239 types). Report per-type distilled coverage: at least 150/239 types must have >= 1 distilled example.
- id: ac-04
  description: |
    FTMB includes real Model2Vec header features for all records. Spot-check: first 5 groups must have non-zero header features (>=10/128 nonzero dims).
- id: ac-05
  description: |
    FTMB includes sibling-context enriched headers using frozen weights from the existing sibling-context model. FrozenSiblingContext applied during FTMB preparation.
- id: ac-06
  description: |
    Train ReLU+BN multi-branch model on Mac Metal using the 70/30 FTMB. Config: sherlock-v5-scaled-config.json base, n_classes=239, lr=1e-4, weight_decay=1e-4, patience=10, max 40 epochs.
- id: ac-07
  description: |
    Best val_accuracy >= 88% (within 2 points of v4-sibling's 90%). If val_accuracy < 84%, abort and investigate FTMB data quality.
- id: ac-08
  description: |
    Profile eval label accuracy >= 205/227 (~90%) on the corrected 227-column eval set (or recalibrated target if ac-02 shifts baseline).
- id: ac-09
  description: |
    No actionability regression. Actionability eval >= 96.5% (current baseline: 96.9%).
- id: ac-10
  description: |
    Misclassification delta analysis: compare new model failures against v4-sibling failures. Document which clusters improved, which regressed, and net change.
  ac_type: doc
- id: ac-11
  description: |
    If ac-08 and ac-09 both pass, publish the new model to HuggingFace (meridian-online/finetype-multi-branch) as the new default. Rollback plan: v4-sibling remains as a tagged release. If post-publish regressions are found, re-publish v4-sibling as default.
- id: ac-12
  description: |
    Update CLAUDE.md default model reference and profile eval baseline numbers to reflect the new model.
  ac_type: config
