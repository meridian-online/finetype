id: 2026-06-12-false-veto-trio-resolution
goal: Resolve the three false-veto suspects the deterministic-layer audit surfaced — gender, npi, price — each a precision miss where a hard validation veto fires on a correctly-typed column, by fixing the upstream Sharpen/hint/fixture cause (not by loosening any validator), gated on no gold regression + corpus-honest GO.
cards:
- '0002'
status: open
labels:
- precision
- false-veto
acceptance_criteria:
- id: ac-01
  description: |
    GENDER (engine). disambiguate_gender routes columns whose non-empty
    values are exclusively single-character alpha sex codes (M/F/X,
    case-insensitive) to identity.person.gender_code; word-form columns
    (male/female/non-binary/...) still return identity.person.gender. The
    ISO-5218 numeric codes (0/1/2/9) are NOT a value-only trigger — they
    would over-emit gender_code onto every boolean/ordinal numeric column
    (boolean_subtype owns 0/1 and runs first; gender stays alpha-only).
    The Step-8 same-category header override (sense_header_hint_same_category,
    column.rs ~1850) must NOT revert a value-rule gender_code back to gender
    when the header is a hardcoded gender/sex hint — the two-deterministic-
    steps-fighting trap. Unit tests: pure M/F -> gender_code; pure male/female
    -> gender; header="gender" + M/F values -> gender_code survives Step 8
    (regression for the override conflict); mixed word+code -> gender.
    cargo test + clippy -D warnings green.
  gate: false
  checked: true
- id: ac-02
  description: |
    GENDER (gate). Gold re-score vs the 0.6.29 baseline (gold 0.719): headline
    holds or improves (the gold `gender` column is full-words male/female/
    no_answer, so it is unaffected; no gold gender_code rows exist yet). No
    label with support >= 10 loses precision or recall. Corpus-honest gate
    GO for the gender change (the reroute only re-labels columns that already
    fired the gender value-rule; verify no gender_code over-emit band). NOTE:
    the audit's "gender -> unknown" snapshot is stale — 0.6.28's veto
    shape-fallback already moved the symptom to representation.discrete.
    categorical (veto_fallback:vocab); this AC measures categorical ->
    gender_code precision, not unknown rescue.
  gate: true
  checked: true
  ac_type: observation
- id: ac-03
  description: |
    NPI (fixture). The medical_records.csv npi column is bad fixture data,
    not an engine fault — the CMS validator ^[12]\d{9}$ is correct (real NPIs
    begin 1 or 2) and 41 of 60 fixture values begin 3-9. Regenerate the column
    as 10-digit numbers beginning 1 or 2 (Luhn-with-prefix-80840 not required
    for the fixture). Validator UNTOUCHED. medical_records npi then profiles
    to identity.healthcare.npi (or its taxonomy id) without the veto firing.
  gate: false
  checked: true
  ac_type: config
- id: ac-04
  description: |
    PRICE (value-aware hint). The hardcoded header_hint("price") ->
    finance.currency.amount asserts US format and collides with multi-locale
    columns (de-DE comma-decimal, pt-BR multi-symbol) -> hard veto. Make the
    price resolution value-aware (select amount / amount_comma /
    amount_comma_suffix / amount_multisym by separator+symbol shape, per
    0042/0048) OR drop price from the hardcoded map and let the value rules
    decide. Do NOT widen the US amount validator. multilingual.csv price no
    longer false-vetoed; gold no-regression + corpus-honest GO.
  gate: true
  checked: false
  ac_type: observation
