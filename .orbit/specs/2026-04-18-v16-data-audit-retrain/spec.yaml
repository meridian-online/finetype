id: 2026-04-18-v16-data-audit-retrain
status: closed
goal: 'Comprehensive audit of training and eval data quality, fill coverage gaps for 100 uncovered types with synthetic data, and retrain multi-branch model (v16) on clean data with longer training. Target: 221+/227 profile eval (97.4%+).'
acceptance_criteria:
- id: ac-01
  description: Eval ground truth audit complete — all 338 labels in manifest.csv verified against actual column values
- id: ac-02
  description: Training data model-as-critic audit complete — v14 inference run on all 102k training rows with label_remap.json applied before comparison, disagreements flagged and categorised by label
- id: ac-03
  description: Training data cleaned — mislabeled examples corrected or removed. Changes flow through the data prep pipeline (prepare_multibranch_data.py), not just raw CSV edits
- id: ac-04
  description: Coverage gaps filled — synthetic training data generated for all 100 types not present in distilled data (100 types x 600 examples = ~60k rows)
- id: ac-05
  description: v16 model trained — 75–100 epochs on clean + synthetic data, best val_acc recorded
- id: ac-06
  description: Profile eval achieves 221+/227 (97.4%+ label accuracy). Any regressions on columns correct in v14 must be explained and documented.
- id: ac-07
  description: Golden integration tests pass with v16 model
- id: ac-08
  description: All existing tests pass, no regressions
