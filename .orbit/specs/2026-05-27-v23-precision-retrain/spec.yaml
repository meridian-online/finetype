id: 2026-05-27-v23-precision-retrain
goal: |
  Cut Sense's false-positive rate on the top-6 corroborated
  misclassification clusters from the multi-lens diagnostic via a
  v22+ patch retrain with targeted hard negatives.

  v22 is the current default (per
  `2026-05-26-v22-gated-direction-review`). The multi-lens
  diagnostic's `report.md` (under `reject_rate_ceil ×
  misclassification`) surfaces ~74k columns where v22 confidently
  predicts a specific label that BOTH the YDF lens AND the cascade
  contradict. The top six clusters (and gap_ids):

    | rank | cols     | gap_id (prefix)    | v22 FP label                                  | what it actually is                              |
    |-----:|---------:|--------------------|-----------------------------------------------|--------------------------------------------------|
    |    1 |  22,952  | `721b890ea74d…`    | `identity.person.gender_code`                 | basketball `START_POSITION` (`F`/`C`/`G`)        |
    |    2 |  21,956  | `1b858e0d073b…`    | `datetime.offset.utc`                         | integer `Comments`/`Points` box-score columns    |
    |    3 |   9,779  | `20803deffbad…`    | `technology.internet.url`                     | boolean / integer flag columns (`perm_unlink`)   |
    |    4 |   8,649  | `81b63a52e3ef…`    | `representation.boolean.binary`               | small integer columns (`Maximum Cardinality`)    |
    |    5 |   5,764  | `cdde5d05b73a…`    | `datetime.component.periodicity`              | categorical `Type` columns (`comment`, `story`)  |
    |    6 |   4,835  | `3f2aa8465552…`    | `representation.identifier.alphanumeric_id`   | `TEAM_ABBREVIATION` categorical (`DET`, `CLE`)   |

  All six are `action: training_data_addition` per the diagnostic —
  the corpus pass itself names the offending files in
  `sample_evidence`, so hard-negative columns can be sourced from
  the corpus rather than mined fresh.

  Pillar defence. Pillar 1 — analysts who profile sports box-scores,
  scientific tables, or any dataset with single-letter categoricals
  currently see v22 declare confident specific labels that are
  wrong; this is the most-visible precision hole in the model.
  Pillar 4 — the diagnostic spent the eval budget; converting
  surfaced gaps into a retrain bet is what makes the diagnostic pay
  back.

  Out of scope:
    - Sharpen-stage rules (decisions 0038/0048 govern; v23-sharpen
      precedent on country_code is the warning).
    - Flat-subtype long-tail (full_address, street_name,
      postal_code) — boundary blend didn't move them across v20/
      v21/v22 and a same-recipe patch won't either.
    - YDF retraining or DBpedia mapping changes (lenses are
      treated as fixed for this bet).
    - Cluster ranks 7+ in the report — included opportunistically
      if hard-negative collection sweeps them up, but not gated by
      this spec.

  Successor spec slot. If the patch retrain lands and ships as
  default, the next retrain bet picks up cluster ranks 7+. If it
  fails (eval band Failed), open a re-litigation memo and pause
  Sense retrains pending a different intervention class.
cards:
- 0002-semantic-type-detection
status: open
labels:
- precision
- retrain
acceptance_criteria:
- id: ac-01
  description: |
    Hard-negative corpus extracted from the diagnostic's
    `sample_evidence`.

    `scripts/extract_v23_hard_negatives.py` reads
    `eval/gittables/corpus_pass/columns.parquet`, filters to
    columns whose `(sense_prediction, ydf_prediction)` pair matches
    one of the six target clusters, dedups by row-hash SHA256
    against the existing training pile (per MADR 0056), and emits
    `output/v23-precision-retrain/hard_negatives.parquet` with
    columns: `file_path`, `column_name`, `sample_values`,
    `correct_label` (= YDF prediction for the cluster),
    `cluster_id` (the gap_id prefix).

    Close evidence: parquet exists; row count ≥ 30,000 (target
    half-coverage of the 73,935 surfaced columns after row-hash
    dedup; some columns will collide with training); a per-cluster
    summary at `output/v23-precision-retrain/hard_negatives_summary.md`
    shows non-zero coverage on all six clusters.
  gate: false
  checked: true
- id: ac-02
  description: |
    Hard negatives integrated into the v23 training blend.

    Pick ONE source-of-truth pattern by reading the v22 training
    script (`scripts/overnight_v22_*.sh`) and locating where the
    boundary-training blend is assembled:
      (a) Append hard_negatives.parquet to the existing blend with
          a labelled `provenance: v23-precision-retrain` column for
          downstream telemetry.
      (b) Replace a portion of the existing boundary-training
          blend with hard negatives at a configured ratio (default
          20%, configurable in the new overnight script).

    Default (a) — additive is safer; v22's monotone-mover gains on
    geography subtypes should be preserved, not reshuffled. Pick
    (b) only if eval-by-eval analysis shows (a) regresses geography.

    Updated training entry point at
    `scripts/overnight_v23_precision.sh` (sibling of the v22
    overnight script). Updates `sources.yaml` per MADR 0056 with
    the new training rows and their corpus-pass provenance so the
    leakage firewall continues to honour the MEASURE/CALIBRATE
    split.

    Close evidence: overnight script exists and is runnable
    (smoke test: `--dry-run` succeeds); sources.yaml diff is
    committed; row-hash overlap with the eval set is 0 (verified
    by the existing leakage-firewall check).
  gate: false
  checked: true
- id: ac-03
  description: |
    v23 model trained.

    Run the overnight script. Produces a model at
    `models/sherlock-v23-precision-<activation>-s<seed>/` matching
    the v22 architecture (5-branch, ReLU+BatchNorm, val_acc target
    ≥ 0.9305). At least three seeds (s42, s43, s44) trained for
    seed-stability assessment per the v22 spec's precedent.

    Close evidence: at least one seed reaches val_acc ≥ 0.9305 (no
    regression vs v22). Branch ablation diagnostic (sibling of
    `output/branch-ablation-v22/`) shows the embed branch still
    carrying weight on the geography subtypes that v22 unlocked.
  gate: false
  checked: true
- id: ac-04
  description: |
    Corpus pass + gated cell-2 eval against v22.

    Run `scripts/gittables_corpus_pass.py` against the chosen v23
    seed, then `scripts/apply_ydf_validation_gate.py` and the
    per-subtype delta scripts. Emits:

      - `output/corpus-pass-v23/corpus_pass/columns.parquet`
      - `output/ydf-validation-gate/v23_gated.parquet`
      - `output/v23-precision-retrain/cell_deltas_v23_vs_v22.md`
      - `output/v23-precision-retrain/per_cluster_fp_rate.md`
        (per-cluster column count under each of the six target
        gap_ids; expected to drop materially vs v22)

    Pre-committed acceptance band (matches the v22 spec's ac-08
    shape):
      - **Met (ship as default)** — top-6 cluster column count
        drops ≥ 50% AND gated cell-2 vs v19 is non-worse than v22
        (≤ −10.4%).
      - **Partial (review-and-decide)** — top-6 drops 20–50% AND
        gated cell-2 within ±2pp of v22.
      - **Failed (do not ship, open re-litigation memo)** — top-6
        drops < 20% OR gated cell-2 regresses ≥ 2pp vs v22.

    Close evidence: the three artefacts exist; the band verdict is
    recorded in `output/v23-precision-retrain/eval_summary.md`.
  gate: false
  checked: false
- id: ac-05
  description: |
    Promote-or-not decision.

    Two mutually-exclusive paths gated by ac-04's band:

    Path A (Met) — `/release model models/sherlock-v23-precision-<seed>`
    (or manual symlink swap + CLAUDE.md + card 0002 goal update).
    Single-purpose commit. No retrain in this path.

    Path B (Partial) — write
    `output/v23-precision-retrain/partial_band_review.md` naming
    which clusters moved, which didn't, and the next-step
    recommendation (extend hard negatives, change blend ratio,
    pivot to a different intervention class). Do NOT promote.

    Path C (Failed) — write
    `output/v23-precision-retrain/relitigation_memo.md` and pause
    Sense retrain work. The memo names which assumption broke
    (data thin in the surfaced clusters; clusters not really
    teachable from corpus evidence; architectural ceiling reached;
    other) and recommends a follow-up spec class.

    Close evidence (whichever path): for A, `models/default`
    resolves to the v23 cherry-pick and CLAUDE.md + card 0002 are
    updated; for B, partial_band_review.md exists and is
    greppable; for C, relitigation_memo.md exists.
  gate: false
  checked: false
- id: ac-06
  description: |
    Post-promotion soak (observation-deferred).

    If ac-05 took Path A, the next 2–3 corpus passes (run for any
    reason — future retrain candidates, follow-up specs) should
    confirm the cluster-rank shake-up holds: the top-6 v22 clusters
    should NOT reappear among v23's top-6, and gated cell-2 vs v19
    should stay within the band recorded at ac-04. If either drifts
    out of expected ranges, flag it in
    `output/v23-precision-retrain/post_promotion_soak.md` and
    consider whether the v23 promotion needs revisiting.

    If ac-05 took Path B or Path C this AC closes trivially
    (nothing to soak) — append "n/a; ac-05 took Path B/C" to the
    spec close note.

    Close evidence (after soak window OR immediately for B/C):
    `output/v23-precision-retrain/post_promotion_soak.md` exists.
  gate: false
  checked: false
  ac_type: observation
