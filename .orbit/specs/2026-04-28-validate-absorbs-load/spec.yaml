id: 2026-04-28-validate-absorbs-load
status: closed
goal: |
  Make `finetype validate --db --table` write a typed user table by applying per-column transforms inside the same DuckDB session that performs validation. Surface transform failures via a new `'TRANSFORM_FAILED'` reject ontology entry. Remove `cmd_load`. Single verb for the import flow: `profile -o json-schema → validate → done`.
acceptance_criteria:
- id: ac-01
  description: |
    Free function `build_transform_projection(headers: &[String], extensions: &SchemaExtensions, taxonomy: &Taxonomy, try_wrap: bool) -> String` lives in `crates/finetype-cli/src/main.rs`. For each header, emits one of: - bare quoted identifier `"col"` — when ANY of:
      (a) `extensions.get(header)` returns `(None, _)` (no
          `x-finetype-label` on the column),
      (b) the label IS present but `taxonomy.get(&label)` returns `None`
          (label not in taxonomy — graceful degradation, mirrors
          today's `cmd_load:2758-2760` `("VARCHAR", None, "")` branch),
      (c) the taxonomy entry's `duckdb_type` is `VARCHAR`.
    - `TRY(transform-with-{col}-replaced) AS "col"` — when `try_wrap=true`,
      a label is present in the taxonomy, and a transform exists
    - `transform-with-{col}-replaced AS "col"` — when `try_wrap=false`,
      a label is present in the taxonomy, and a transform exists
    - `TRY_CAST("col" AS T) AS "col"` (or `CAST(...)` when
      `try_wrap=false`) — when a label is present in the taxonomy,
      no transform, but non-VARCHAR `duckdb_type`
    Returns a comma-separated SELECT list. Output is byte-identical to `build_load_expr`'s output when `try_wrap=false` and the same column set is supplied.
  ac_type: code
- id: ac-02
  description: |
    `cmd_validate_table`'s materialise path (the `if let (Some(db_path), Some(table_name)) { ... }` block currently around `main.rs:3884`) replaces its `SELECT * EXCLUDE(__row_idx) FROM staging` CTAS with the transform projection. The new CTAS shape:
      `CREATE TABLE <user_table> AS SELECT <projection> FROM
       <staging> WHERE __row_idx IN <valid_set_filter>;`
    Projection built via `build_transform_projection(headers, &extensions, &taxonomy, /*try_wrap=*/true)`. Staging table read as `read_csv(..., all_varchar=true)` is unchanged.
  ac_type: code
- id: ac-03
  description: |
    Transform failures surface as reject rows. After CTAS, the validate path detects rows where `staging IS NOT NULL AND TRY(transform) IS NULL` per transformed column and emits a reject row with `error_type='TRANSFORM_FAILED'`, `constraint_failed='transform'`, `expected_type=<x-finetype-label>`, `constraint_value=<transform expression literal>`, `error_message=<staging cell value>`, `column_name=<header>`, `row_index=<staging __row_idx>`. The row is excluded from the user table (`WHERE __row_idx IN …` filter removes it).
  ac_type: code
- id: ac-04
  description: |
    NULL-in-NULL-out is NOT a transform failure. A row whose staging cell is NULL (CSV reader normalised "" / "NULL" / "null") and whose `TRY(transform)` is NULL must NOT emit a `'TRANSFORM_FAILED'` reject row. The user-table cell is NULL; the row remains in the user table (assuming no schema rejection).
  ac_type: code
- id: ac-05
  description: |
    `Commands::Load` variant deleted from the clap `Commands` enum. Dispatch arm `Commands::Load { ... } => cmd_load(...)` removed from `main()`. Function `cmd_load` deleted. `build_load_expr` and `build_load_expr_enum` deleted IF unused by `build_transform_projection`; otherwise renamed/inlined into the new helper. Net `crates/finetype-cli/src/main.rs` LOC delta: ≤ -250 measured against PR #54's post-merge HEAD (the schema-verb-fold parent). `cargo build -p finetype-cli` compiles clean with `clippy -D dead_code -D warnings`.
  ac_type: code
- id: ac-06
  description: |
    `finetype load file.csv` errors via clap's unknown-subcommand handler — no shim, no deprecation warning, no carve-out. Exit code 2 (clap's standard for unknown subcommand). stderr names the verb and points at `--help`.
  ac_type: code
- id: ac-07
  description: |
    MCP `validate` tool's `ValidateRequest` shape (`crates/finetype-mcp/ src/tools/validate.rs:9-22`) unchanged; no new fields; no behavioural change. MCP test `crates/finetype-mcp/tests/validate_tool.rs` (or equivalent) passes unchanged. The MCP `validate` tool description-string addendum lands at `crates/finetype-mcp/src/lib.rs:113`'s `#[tool(description = "...")]` literal — gains one sentence: "Engine-only — does not materialise to DuckDB. For typed output, agents should drive the CLI binary." (or equivalent wording). The `tools/validate.rs` edit is limited to the module doc comment (cross-reference to v0.6.20 audit follow-up).
  ac_type: code
- id: ac-08
  description: |
    All 15 existing `vrp_*` tests stay green. The 15 split as: 8 CLI-side in `crates/finetype-cli/tests/validate_cli.rs` and 7 engine-side in `crates/finetype-core/src/table_validator.rs`. The 7 engine-side tests are pure-function tests of `validate_table` and cannot regress under this fold (no CLI code paths affect them). The 8 CLI-side tests use schema fixtures (`SCHEMA_WITH_EXT`, `SCHEMA_NO_EXT`) carrying `x-finetype-label: identity.code.id` — a label NOT in the taxonomy — so per ac-01 branch (b) all such columns fall through to bare-passthrough VARCHAR after the fold. The 8 CLI tests therefore pass byte-identically without any column-type-assertion tightening; the typed-CTAS coverage is carried by the new ac-02/ac-03/ac-04 tests, which use real taxonomy labels (`datetime.date.iso_8601`, `finance.currency.amount`).
  ac_type: code
- id: ac-09
  description: |
    Golden tests `crates/finetype-cli/tests/cli_golden.rs` — `golden_load_*` test functions are deleted (their surface is covered by `validate_cli.rs` after the fold) OR replaced with `golden_validate_typed_*` equivalents asserting the typed CTAS shape. Choose deletion when validate_cli.rs covers the same semantic; choose replacement only when the golden test exercised a behaviour validate_cli.rs does not. No `golden_load_*` function remains.
  ac_type: code
- id: ac-10
  description: |
    MADR 0071 created at `.orbit/choices/0071-validate-absorbs-load.md` (status: accepted, dated 2026-04-28). Documents D1 (TRY-wrap + 'TRANSFORM_FAILED' / 'transform' ontology extension), D2 (projection builder home), D4 (cmd_load hard-removal). Refines MADR 0064 (extends reject ontology) and MADR 0031 (already superseded by 0070; this card removes load). MADR 0064's `status:` frontmatter updates to `date-modified: 2026-04-28` (the ontology extension is a refinement, not a supersession). MADR 0071 explicitly documents the `error_message` semantic split: for `error_type='SEMANTIC_TYPE'` rejects it carries the validation-engine diagnostic string ("did not match pattern", etc.); for `error_type='TRANSFORM_FAILED'` rejects it carries the failing input cell value from the staging table.
  ac_type: doc
- id: ac-11
  description: |
    README.md `validate` section gains the typed-output example and the migration line (`finetype load → finetype validate --db --table`). README's `### CLI` block drops the `finetype load -f data.csv | duckdb` example and replaces it with `finetype profile -f data.csv -o json-schema > schema.json && finetype validate data.csv schema.json --db out.db --table orders`. CLAUDE.md "Public vs internal CLI surface" table drops `load` from the public-tier list (5 public commands now: `infer`, `profile`, `validate`, `mcp`, `taxonomy`). CLAUDE.md `validate` row text updated to mention typed-output behaviour. `.claude/skills/ finetype-cli/SKILL.md` and `.claude/skills/finetype-pipeline/ SKILL.md` migrated: every `finetype load` invocation rewritten to `finetype validate ... --db ... --table ...`.
  ac_type: doc
- id: ac-12
  description: |
    CHANGELOG.md `[Unreleased]` (or `[0.6.19]` if the version line is already cut) gains a `### Removed` entry for the `load` verb removal with the verbatim migration map:
      finetype load FILE.csv -t TABLE  →
        finetype profile -f FILE.csv -o json-schema > schema.json
        finetype validate FILE.csv schema.json --db out.db --table TABLE
    And a `### Changed` entry recording all three behavioural shifts:
      (a) `finetype validate --db --table` now writes typed columns
          (was VARCHAR pass-through);
      (b) ENUM type emission dropped — `validate --db --table`
          produces no `CREATE TYPE … AS ENUM` regardless of column
          cardinality (was emitted by `cmd_load --enum-threshold`);
      (c) Reject sidecar `error_type` enum gains `'TRANSFORM_FAILED'`;
          `constraint_failed` enum gains `'transform'`.
  ac_type: doc
- id: ac-13
  description: |
    `make ci` passes — `cargo fmt --all -- --check`, `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace`, `cargo run --quiet -- check`. Zero new clippy warnings vs PR #54 baseline (the schema-verb-fold parent PR).
