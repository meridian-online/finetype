id: 2026-05-26-v23-sharpen-code-discriminator
goal: |
  Closed without shipping a Sharpen rule. ac-01's audit invalidated
  the spec's premise; the subsequent R26 country_code experiment
  (built and validated against the full 6.5M-column corpus) was
  reverted in favour of fixing the eval baseline.

  Original premise (pre-ac-01): close v22's cell-2 regression on six
  geography code subtypes (iso6346, mgrs, plus_code, country_code,
  iata_code, icao_code) via value-based Sharpen rules — no retrain.

  What ac-01 (script: scripts/audit_geography_code_patterns.py)
  showed: of 3,389 YDF-labeled `iso6346` columns, ZERO contain values
  matching the iso6346 regex; 2,828 are msg_id columns (msg48752425).
  Same for mgrs (0/35) and plus_code (0/4). v22 is correctly calling
  these alphanumeric_id while YDF's "ground truth" mislabels them.

  The narrow path that survived: R26 country_code with a US-state
  anti-enum (CA, IL, GA... collide with US state codes). Built,
  hardened, validated against the corpus. Result: fires on 3 columns
  out of 6.5M; cell-2 moves by 1 column. Reverted because:

    - Of 4,044 YDF-labeled country_code cols, Sense already correctly
      classifies 2,890 (71%). The remaining ~1,150 are dominated by
      3-letter team abbreviations (TEAM_ABBREVIATION: UTA, FLA — 547
      cols) and 3-letter exchange codes (exchange: GER — 237 cols)
      that a 2-char alpha-2 rule structurally cannot reach.
    - Decision 0038 ("rules are a last resort") and decision 0048
      ("value-based rules only") both argue against shipping a rule
      with 0.00005% lift on a metric we now know is dominated by YDF
      label noise.
    - The right fix is upstream: gate YDF's predictions against the
      JSON Schema validation already shipped in labels/*.yaml so
      msg_id/stock_id/team-code mislabels drop out of the metric at
      source.

  Load-bearing knowledge preserved as memories:
    - v23-ac01-finding — YDF mislabel-pattern analysis
    - taxonomy-country-code-enum-contamination — yaml enum has US
      states + Canadian provinces tacked on; would defeat any naïve
      consumer of definitions_geography.country_code.validation.enum
    - v23-ac08-outcome — R26 experiment result + reasoning

  Follow-up spec: 2026-05-26-ydf-validation-gate — apply JSON Schema
  validation post-hoc to YDF predictions, recompute v19/.../v22 cell-2
  against the cleaned baseline, document where v22 actually lands.
cards:
- 0002-semantic-type-detection
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Pattern-tightness audit baseline.

    `scripts/audit_geography_code_patterns.py` reads
    `output/corpus-pass-v22/corpus_pass/columns.parquet` and for each
    of the six target code patterns computes a per-(ydf_prediction)
    breakdown of columns where ≥80% of values match the pattern.
    Output: `output/v23-sharpen-codes/pattern_fp_audit.tsv`.

    Closed: TSV exists, tight patterns show ≤5 FPs, loose patterns
    show the predicted cross-type collision. Audit also surfaced the
    premise-invalidating finding (memory `v23-ac01-finding`).

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-04
  description: |
    R26 country_code Sharpen rule — built, hardened, reverted.

    Implementation history (commits dd0143c + 7071576, reverted):
    `sharpen_country_code_promote` in column.rs with a US-state
    anti-enum, four-condition gate (iso_rate ≥ 80%, state_only ≤ 5%,
    iso_only_distinct ≥ 30%, n_distinct ≥ 3), and 14 unit tests.
    Offline re-apply (scripts/apply_v23_sharpen_offline.py) across
    6.5M columns: R26 fired on 3, zero false promotions after the
    n_distinct floor caught a 730-column boolean-NO precision hole
    (NO = Norway in ISO 3166).

    Closed not-shipped: the recovery surface is too small to justify
    a permanent rule (decision 0038). Knowledge preserved in memory
    `v23-ac08-outcome`.

    `ac_type: code`.
  gate: false
  checked: true
- id: ac-08
  description: |
    Cell-2 lift band — closed at "Lift ≈ 0".

    v22 + (reverted) v23: cell-2 moved by 1 column out of 73,514
    (within rounding). The R26-scoped band classification ("Lift ≥ 0
    — fires productively") was technically met but not load-bearing
    once the rule was reverted.

    Decision: do not ship R26; open a follow-up spec on the eval
    baseline itself so future retrains can be judged against ground
    truth that isn't mostly noise.

    `ac_type: observation`.
  gate: false
  checked: true
  ac_type: observation
