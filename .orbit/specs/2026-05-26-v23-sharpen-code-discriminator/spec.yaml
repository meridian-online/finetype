id: 2026-05-26-v23-sharpen-code-discriminator
goal: |
  Recover misclassified country_code columns at the Sharpen stage —
  no retrain. Scope narrowed 2026-05-26 after ac-01 invalidated the
  original premise on five of six target subtypes.

  Original premise (pre-ac-01): close v22's cell-2 regression on six
  geography code subtypes via promote rules. Audit script
  `scripts/audit_geography_code_patterns.py` against
  `output/corpus-pass-v22/corpus_pass/columns.parquet` showed that
  three of the six (iso6346, mgrs, plus_code) have ZERO columns in
  the entire corpus where values actually match the type's pattern;
  YDF's "ground truth" labels msg_id (`msg48752425`) as iso6346,
  stock_id (`VD17785626559`) as mgrs, etc. v22 is correctly calling
  these alphanumeric_id while YDF mislabels them. iata (25 cols),
  icao (1 col) are too small to move the band.

  Surviving subtype: country_code. 839 YDF-labeled columns contain
  values that actually match ISO 3166-1 alpha-2. R26 promotes those
  away from non-geography misclassifications (categorical,
  full_name, alphanumeric_id) when values pass the enum gate.

  Precision risk: the 2-char alpha-2 pattern collides with US state
  codes. Many state codes ARE in ISO 3166 (CA=Canada=California,
  IL=Israel=Illinois, GA=Georgia-the-country=Georgia-the-state, LA,
  MS, MD, DE, IN, VA, KY, AL — 17+ codes appear in both sets). A
  naïve enum-only check would falsely promote US-state columns whose
  state codes happen to coincide with ISO codes.

  R26 hardens against this with a *US-states anti-enum*: load the
  US state alpha-2 set (~56 codes — 50 states + DC + territories)
  alongside ISO 3166. For each column, partition matches into
  `iso_only`, `state_overlap`, and `state_only`. Require both:
  state_only_rate ≤5% (rules out state columns containing NY/TX/FL/
  OK that aren't in ISO) AND iso_only_rate ≥30% of distinct matches
  (rules out columns dominated by state_overlap codes that could
  plausibly be states).

  Per the precision principle (CLAUDE.md): coverage of anti-enums
  expands; heuristics don't loosen.

  Expected lift: ~1 pp cell-2 reduction (839 cols out of 503,643
  files). Doesn't change v22's band on its own — but it's a
  real precision win for analysts working with country-code columns.
  The remaining cell-2 gap is largely measurement artefact (noisy
  YDF labels); proper fix is a separate spec on eval-baseline cleanup.

  Out-of-scope for v23 (deferred to a follow-up spec):
    - iso6346 / mgrs / plus_code Sharpen rules (no real columns)
    - iata / icao enum-required rules (too few columns to move band)
    - YDF-label-noise cleanup + cell-2 metric re-baseline

cards:
- 0002-semantic-type-detection
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Pattern-tightness audit baseline.

    `scripts/audit_geography_code_patterns.py` reads
    `output/corpus-pass-v22/corpus_pass/columns.parquet` and for each
    of the six target code patterns computes a per-(ydf_prediction)
    breakdown of columns where ≥80% of values match the pattern.
    Output: `output/v23-sharpen-codes/pattern_fp_audit.tsv`.

    Close evidence (✓ all met 2026-05-26): TSV exists; tight-pattern
    types (iso6346, mgrs, plus_code) show ≤5 false positives outside
    their target ydf_prediction; loose-pattern types (iata, icao,
    cc-alpha-2) show the cross-type collision pattern. Audit also
    surfaced the premise-invalidating finding captured in memory
    `v23-ac01-finding` — load-bearing for the spec scope reduction.

    `ac_type: code`.
  gate: false
  checked: true
  ac_type: code

- id: ac-04
  description: |
    R26 country_code Sharpen rule with US-state anti-enum.

    Implementation in `crates/finetype-model/src/column.rs`, in
    `value_sharpen()` near the top of the geography decision block
    (before R20/R21/R22 demote gates so a promoted country_code
    label gets the demote-gate check).

    Two enums:
      - ISO 3166-1 alpha-2 (~249 codes) — hardcoded constant
        mirroring `labels/definitions_geography.yaml` under
        `geography.location.country_code.validation.enum`. A test
        verifies the hardcoded list matches the yaml.
      - US states alpha-2 (~56 codes — 50 states + DC + territories
        PR, VI, GU, AS, MP) — hardcoded constant.

    Trigger conditions (all required):
      - result_label does NOT start with "geography." (don't override
        any Sense geography decision; covers country_code itself)
      - n_values ≥ 5
      - ≥80% of non-empty values are in ISO 3166-1 alpha-2
      - state_only_rate ≤ 5% of non-empty values
        (where state_only = US state code AND NOT in ISO)
      - iso_only_rate ≥ 30% of distinct values matching the enum
        (where iso_only = in ISO AND NOT a US state code)

    The state_only check rules out columns dominated by US state
    codes like NY/TX/FL/OK (not in ISO). The iso_only check rules
    out the ambiguous case where every match happens to also be a
    state code — that's not a clean country signal.

    Unit tests in column.rs's #[cfg(test)] module:
      (a) positive: 10 international country codes (US, GB, DE, FR,
          JP, BR, AU, MX, CA, IN) starting from
          `representation.discrete.categorical` → promote to
          country_code.
      (b) US-state-collision negative: 10 US state codes
          (CA, IL, GA, LA, MS, MD, DE, IN, VA, KY) — all in ISO but
          all in US states too. state_overlap dominates, iso_only=0,
          state_only=0; rule should NOT fire (iso_only_rate < 30%).
      (c) mixed-state negative: 12 mostly-US-states column with a
          few non-ISO codes (NY, TX, FL, OK, OH, MI, PA, NC, WA, WI,
          CA, IL) — state_only_rate > 5% so refuses.
      (d) strong-classes guard: a column with international country
          codes but result_label = "geography.location.region" — the
          guard preserves the model's geography decision.
      (e) enum-membership: hardcoded ISO list length matches the
          yaml enum length (regenerates on taxonomy update).

    `ac_type: code`.
  gate: false
  checked: true
  ac_type: code

- id: ac-05
  description: |
    End-to-end test surface — one full column-shaped fixture row
    covering the v22 corpus-pass failure mode R26 fixes.

    `crates/finetype-eval/tests/v23_sharpen_country_code_test.rs`
    (or extend existing tests file) — feed a column where Sense
    forces a wrong prediction (e.g., contrived header that v22
    misclassifies as `representation.discrete.categorical`) with
    values drawn from ISO 3166-1 alpha-2; confirm full pipeline
    output is `geography.location.country_code`.

    Comment cites a real misclassified column from
    `output/corpus-pass-v22/corpus_pass/columns.parquet` that R26
    is designed to recover.

    `ac_type: code`.
  gate: false
  checked: true
  ac_type: code

- id: ac-06
  description: |
    Offline re-application of the R26 Sharpen rule against v22's
    corpus pass — no fresh corpus pass required.

    `scripts/apply_v23_sharpen_offline.py` reads
    `output/corpus-pass-v22/corpus_pass/columns.parquet`, calls the
    R26 rule on each row's Sense prediction + sample values, writes
    `output/v23-sharpen-codes/columns_sharpened.parquet` with the
    Sharpen-overridden label.

    Justification: a full corpus pass is 6h+; the Sharpen stage is
    pure post-Sense logic that doesn't touch the model. Re-running
    Sharpen offline on the existing columns.parquet gives the same
    answer in minutes.

    Close evidence: parquet exists with same row count as input;
    spot-check 20 country_code-shaped rows shows the expected
    promote-to-country_code overrides; spot-check 20 US-state
    columns shows NO false promotion.

    `ac_type: code`.
  gate: false
  checked: true
  ac_type: code

- id: ac-07
  description: |
    Recompute cell deltas with v22-Sense + v23-Sharpen (R26 only).

    Re-run `scripts/compute_v22_cell_deltas.py` (or a v23-aware
    variant) against the sharpened parquet from ac-06. Write
    `output/v23-sharpen-codes/cell_deltas.md` as a five-way table
    (v19/v20/v21/v22-Sense-only/v22+v23-Sharpen) with per-subtype
    breakdown.

    Specifically expect:
      - country_code: v22's 948 misses drop to ~400 (R26 catches
        the alpha-2 columns Sense misclassified)
      - city / region / country / continent: unchanged (the
        !starts_with("geography.") guard prevents R26 from touching
        any Sense geography decision)
      - other regressed subtypes (iso6346, mgrs, plus_code, iata,
        icao): unchanged (no rule shipped)

    `ac_type: code`.
  gate: false
  checked: true
  ac_type: code

- id: ac-08
  description: |
    Cell-2 lift band — combined v22-Sense + v23-Sharpen target.

    Expected combined cell-2 rate vs v19 baseline: ~145 / 1000
    (v22-Sense-only at 145.96, R26 lifts by ~1 pp at best). Original
    spec targeted ≥10% reduction (≤144.22). R26 alone is unlikely
    to clear that — and the ac-01 finding confirms much of the
    residual gap is YDF-label noise, not real model loss.

    Three falsification bands, re-scoped for R26-only:

      - **Lift ≥1 pp** (R26 fires productively) — country_code
        recovery works as designed. Close v23. Open a follow-up spec
        on YDF-label cleanup + cell-2 metric re-baseline so future
        retrains can be judged honestly.
      - **Lift 0–1 pp** (R26 fires but barely moves the metric) —
        confirms the cell-2 metric is dominated by noise, not real
        misses. Close v23 with the precision win logged; the
        follow-up cleanup spec is even more urgent.
      - **Lift < 0** (R26 makes things worse) — implementation bug
        or the US-state anti-enum is misconfigured. Investigate.

    Close evidence: combined cell-2 rate recorded in
    `output/v23-sharpen-codes/cell_deltas.md` with band classification;
    spec close note records the band and the next-spec direction.

    `ac_type: observation`.
  gate: false
  checked: true
  ac_type: observation
