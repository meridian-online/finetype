id: 2026-05-26-v23-sharpen-code-discriminator
goal: |
  Close the v22 regression gap on syntactically-distinct geography codes
  via value-based Sharpen rules — no retrain. v22's boundary training
  lifted the dominant failure class (city, 62% of cell-2 misses) by
  10.2% corpus-wide but traded recall on four code subtypes:
  geography.transportation.iso6346 (+40.3% misses), geography.location.country_code
  (+94.7%), geography.transportation.iata_code (+83.3%), geography.coordinate.mgrs
  (+75.0%). Net cell-2 reduction stalled at 8.9% — 1.1 pp below the
  Partial-band threshold and 11.1 pp below the Met target.

  Ac-06's branch-ablation diagnostic rules out architectural surgery
  (embed branch IS carrying weight — 11.6 pp on the city-vs-name
  partition vs v21's 8.4 pp). The remaining gap is data composition,
  not model capacity. Per v22 ac-08's pre-committed Failed-band
  branch, the next move is option (b): an explicit Sharpen-stage
  discriminator.

  Each regressed type has a distinctive character signature:

    iso6346       ^[A-Z]{3}[UJZ]\d{7}$            (tight — verified)
    mgrs          ^\d{1,2}[C-X][A-HJ-NP-Z]{2}\d{2,10}$  (tight — verified)
    plus_code     ^[OLC-alphabet]{8}\+[OLC-alphabet]{2,}$ (tight — verified)
    country_code  ^[A-Z]{2}$ + ISO 3166-1 alpha-2 enum    (enum required)
    iata_code     ^[A-Z]{3}$ + ~9,500-entry IATA enum     (enum required)
    icao_code     ^[A-Z]{4}$ + ~13,000-entry ICAO enum    (enum required)

  Verified 2026-05-26 against output/corpus-pass-v22 — the three tight
  patterns have ~0 false-positive collisions (mgrs 2 FPs in
  alphanumeric_id columns, iso6346 0, plus_code 0). The three loose-
  letter patterns collide heavily without enum support (3-letter
  pattern matches 825 categorical columns + 45 currency_code +
  112 country_code-alpha-3; only 15 are actually IATA airports —
  enum match-rate gate is required for those rules to be safe).

  Target: combined v22-Sense + v23-Sharpen cell-2 reduction ≥ 12%
  vs v19 baseline (lifts v22's 8.9% into the Partial band, recovering
  the ~3,000 missed-geography rows from the four regressed types
  without re-introducing them as false positives on character-
  statistically ambiguous columns). Stretch: ≥ 20% (Met band), which
  also requires city/region to retain v22's gains (no Sharpen rule
  should fire on the city-boundary columns v22 already gets right).
cards:
- 0002-semantic-type-detection
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Pattern-tightness audit baseline. The verification done during
    drafting must be reproducible from a committed script.

    `scripts/audit_geography_code_patterns.py` reads
    `output/corpus-pass-v22/corpus_pass/columns.parquet` and for each
    of the six target code patterns (iso6346, mgrs, plus_code,
    country_code-alpha-2, iata, icao) computes a per-(ydf_prediction)
    breakdown of columns where ≥80% of values match the pattern.
    Output: `output/v23-sharpen-codes/pattern_fp_audit.tsv`.

    Close evidence: TSV exists; tight-pattern types (iso6346, mgrs,
    plus_code) show ≤5 false positives outside their target
    ydf_prediction; loose-pattern types (iata, icao, cc-alpha-2)
    show the cross-type collision pattern documented in the goal
    block.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-02
  description: |
    IATA + ICAO enum lists sourced and registered.

    `scripts/fetch_iata_icao_enums.sh` (idempotent, matching the
    `fetch_geonames.sh` pattern) downloads:
      - IATA airport codes (~9,500 entries) to
        `/Users/hugh/datasets/airports/<YYYY-MM-DD>/iata_codes.txt`
      - ICAO airport codes (~13,000 entries) to
        `/Users/hugh/datasets/airports/<YYYY-MM-DD>/icao_codes.txt`

    Source priority: (1) OpenFlights airports.dat CSV (Public Domain),
    (2) Wikidata Q1248784 SPARQL paged by Q-id range if OpenFlights is
    unavailable, (3) static fallback CSV checked into eval/airports/
    if both upstreams fail.

    On completion the script invokes `scripts/dataset_register.py
    airports`, producing `eval/datasets/snapshots/airports-<date>.json`
    with `role: train_and_eval` (the enum is used by the runtime
    Sharpen rule and also as a positive sample for any future
    iata/icao retraining), `licence: PD` (OpenFlights) or `CC0-1.0`
    (Wikidata), and attribution.

    Close evidence: `dataset_verify.py airports` exits 0; both TSVs
    contain ≥ 8,000 (IATA) and ≥ 10,000 (ICAO) entries; spot check
    5 random codes appear in the published canonical lists.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-03
  description: |
    Tight-pattern Sharpen rules — implement R23 (iso6346), R24 (mgrs),
    R25 (plus_code) in `crates/finetype-model/src/column.rs`.

    Rule shape (mirrors R20/R21/R22's "validation gate" pattern but
    inverted — promote ANY non-target label → target when values fit):

      fn promote_to_<type>(values: &[String], result_label: &str)
          -> Option<(String, String)>

    Trigger conditions for each rule:
      - result_label != <target_label>
      - result_label NOT in v22's strong-classes set (city, region,
        country, etc. — don't override the boundary work v22 nailed)
      - ≥ 80% of non-empty sample values match the type's regex
      - n_values ≥ 5 (the standard min_values floor)

    Wired into `value_sharpen()` at the start of the geography
    decision block (BEFORE the existing demotion gates), so the
    promote path runs first and the demote rules apply to the
    promoted label if relevant.

    Close evidence: three new rule functions in column.rs; unit tests
    in the same file's #[cfg(test)] module covering: (a) clean
    positive case (10 iso6346 codes promote correctly), (b) negative
    case (9 iso6346 codes + 1 random alphanumeric ≥ 80% match still
    promotes, but 7 iso6346 + 3 random does NOT), (c) does-not-fire
    when result_label is already a v22 strong class (city, region,
    country).

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-04
  description: |
    Enum-required Sharpen rules — implement R26 (country_code),
    R27 (iata_code), R28 (icao_code) in column.rs.

    Same rule shape as ac-03 but the value-match condition is enum
    membership rather than regex alone:

      country_code:  load alpha-2 enum from
                     labels/definitions_geography.yaml (already shipped
                     under `geography.location.country_code.validation.enum`)
      iata_code:     load from eval/airports/iata_codes.txt (ac-02 output)
      icao_code:     load from eval/airports/icao_codes.txt (ac-02 output)

    Trigger conditions identical to ac-03's tight-pattern rules but
    with enum-membership instead of regex match. Loose 2/3/4-letter
    patterns are too collision-heavy on their own (per ac-01 audit)
    — the enum gate is the load-bearing precision filter.

    Loading strategy: lazy-initialised `OnceLock<HashSet<String>>`
    per rule. Enums are <14k entries each — fully in-memory, O(1)
    lookup per value. No per-column re-parse cost.

    Close evidence: three new rule functions in column.rs; unit tests
    covering (a) positive (10 IATA codes promote), (b) precision
    (10 stock tickers do NOT promote even though they match the
    3-letter regex), (c) enum-load works without a network call
    (the txt files are committed into the repo via ac-02).

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-05
  description: |
    End-to-end test surface: each new rule has at least one full
    column-shaped test row covering the v22 corpus-pass failure mode
    it's designed to fix.

    `crates/finetype-eval/tests/v23_sharpen_codes_test.rs` (new file,
    or extend an existing tests/ file under finetype-eval) runs
    `finetype infer` on six fixture columns, one per code type, with
    Sense forced into a wrong prediction (we can use a contrived
    header that v22 misclassifies — the goal isn't to test Sense, it's
    to confirm Sharpen recovers the prediction).

    Close evidence: six green test cases; each fixture column has a
    comment pointing to a real column from
    `output/corpus-pass-v22/corpus_pass/columns.parquet` that v22
    misclassified the same way.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-06
  description: |
    Offline re-application of Sharpen rules against v22's corpus pass —
    no fresh corpus pass required.

    `scripts/apply_v23_sharpen_offline.py` reads
    `output/corpus-pass-v22/corpus_pass/columns.parquet`, calls
    `finetype infer-from-features` (or a new `finetype apply-sharpen`
    subcommand if simpler — pick whichever is cheaper to ship) on each
    column's Sense prediction + sample values, captures the Sharpen-
    overridden label, writes a new parquet at
    `output/v23-sharpen-codes/columns_sharpened.parquet`.

    Justification: a full corpus pass is 6h+; the Sharpen stage is
    pure post-Sense logic that doesn't touch the model. Re-running
    Sharpen offline against the existing columns.parquet gives the
    same answer in minutes.

    Close evidence: parquet exists with same row count as input;
    spot-check 20 rows from each of the six target subtypes shows
    the expected promote-to-code overrides.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-07
  description: |
    Recompute cell deltas with v22-Sense + v23-Sharpen applied.

    Re-run `scripts/compute_v22_cell_deltas.py` (or a v23-aware
    variant) against the sharpened parquet from ac-06. Write
    `output/v23-sharpen-codes/cell_deltas.md` as a five-way table
    (v19/v20/v21/v22-Sense-only/v22+v23-Sharpen) with the same
    per-subtype breakdown structure as v22 ac-07.

    Specifically expect:
      - iso6346: v22's 2,007 misses drop back to ~600 (Sharpen
        catches the 1,400+ regressed columns)
      - country_code: 948 → ~400
      - iata_code: 11 → ~4
      - mgrs: 35 → ~15
      - city / region / country / continent: unchanged (Sharpen rules
        only fire when result_label is non-geography and values match
        a code pattern — should never touch the boundary classes v22
        moved)

    Close evidence: cell_deltas.md exists and shows per-subtype
    deltas vs v22; ac-04 strong-classes guard verified by checking
    city/region/country counts are unchanged.

    `ac_type: code`.
  gate: false
  checked: false
  ac_type: code
- id: ac-08
  description: |
    Cell-2 lift band — combined v22-Sense + v23-Sharpen target.

    Combined cell-2 rate vs v19 baseline:

      Partial-band recovery target: ≤ 144.22 / 1000 (10% reduction).
                                    v22-Sense alone landed 145.96.
                                    Sharpen-only lift required: ~1.2 pp.
      Stretch (Met band):           ≤ 128.20 / 1000 (20% reduction).
                                    Sharpen-only lift required: ~12 pp.

    Three falsification bands:

      - **Met (≥ 20%)** — the boundary-training + Sharpen-rule
        methodology generalises. Promote v22+v23 as a paired release
        (v22 model + v23 Sharpen rules). Draft v24 for any remaining
        precision-principle work or domain-expansion.
      - **Partial (10–20%)** — v22+v23 lifts net cell-2 into the
        Partial band but doesn't hit the Met target. Promote as a
        paired release; the next spec investigates the remaining
        long-tail misses (smaller subtypes, ambiguous values that
        need data, not rules).
      - **Failed (< 10%)** — the Sharpen rules didn't recover what
        v22 lost. Re-investigate: maybe the regressed columns aren't
        actually pattern-matchable (header context required), or the
        rule ordering interacts with existing R20/R21/R22 in a way
        we didn't anticipate.

    Close evidence: combined cell-2 rate recorded in
    `output/v23-sharpen-codes/cell_deltas.md` with band classification;
    spec close note records the band and the next-spec direction.

    `ac_type: observation`.
  gate: false
  checked: false
  ac_type: observation
