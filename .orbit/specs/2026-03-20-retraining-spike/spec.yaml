id: 2026-03-20-retraining-spike
goal: |
  Run a controlled retraining experiment: train CharCNN on synthetic-only (baseline), distilled-only, and multiple blended data mixes, measuring each against Tier 2 benchmark and Tier 1 profile eval. Identify which data mix improves real-world accuracy (especially disagreement rows) without regressing. Architecture and hyperparameters held constant — the only variable is training data.
