id: 2026-06-06-latitude-decimal-hard-negative-retrain
goal: |
  Retrain the Sense-stage multi-branch model with hard negatives that fix the
  temperature-float vs latitude confusion (gold-anchor family C), gated by the
  destination-drift proxy pre-check, to produce a candidate that beats v19 on
  decimal recall AND latitude precision with no untargeted regression — the lead
  bet toward a new default model.

  ## Why this target

  Oracle is the gold anchor on the SHIPPED default v19
  (output/gold-eval-anchor/metrics_v19-models-default_2026-06-05.tsv), not the
  retired gated cell-2 lens. It says v19 is never *wrong* on the hard families —
  it is *silent*: every recall gap is precision 1.000. The single most leveraged
  cell is C_lat_lon_temperature:

  - representation.numeric.decimal_number recall 0.600 (12 false-negatives)
  - geography.coordinate.latitude precision 0.714 (12 false-positives)

  These are the SAME 12 columns. Temperature/feature floats that should read
  decimal get grabbed as latitude. One hard-negative retrain moves both numbers
  (decimal recall up, latitude precision up). Critically, it is the EXACT
  OPPOSITE direction of how v24 died — v24 pushed plain numerics INTO latitude
  and exploded it 4.3×; this bet pushes feature floats OUT of latitude and back
  to decimal. So it is both high-value and naturally de-risked against the
  failure we just instrumented against.

  ## Why now / why it is safe to attempt

  Additive hard-negative retrain is 0-for-2 (v23 categorical +529%, v24 latitude
  4.3×) because both destabilised an UNTARGETED neighbour. Spec
  2026-06-05-destination-drift-precheck shipped the cheap proxy gate that catches
  exactly that, 2-for-2 on the paid-for failures, at ~6–7% of the overnight
  wall-clock. This spec is the proxy's first FORWARD use: the gate decides
  whether the blend is allowed to consume an overnight run, BEFORE we spend it.

  Cluster safety_score for latitude→decimal is 0.589 (MODERATE) — which the
  advisory bands say MUST run the pre/post check. The proxy is that check, moved
  earlier.

  ## Coverage (already diagnosed)

  3,974 corpus columns read sense=latitude / ydf=decimal_number — a rich, clean
  hard-negative pool of feature floats (cumulative_gpa, mag, HitRate_*,
  velocities vz/vx/vy, RealTime(ms), LnPrior, ML min_q metrics), distinct from
  the ~1,280 true latitudes (Lat/lat/latitude) which must be PRESERVED so the fix
  does not cost latitude recall. Full diagnosis:
  output/gold-eval-anchor/next_step_diagnosis.md.

  ## Out of scope

  - The value-voting Sharpen guard for bounded labels (latitude ±90 backstop,
    longitude ±180, year range, set-membership). Tested in the diagnosis: it
    catches only 0.1% of THIS family because the impostors sit inside latitude's
    legal range, so it cannot recover C — only the retrain can. It is a separate,
    parallel, cheaper precision spec, not part of this retrain.
  - The alphanumeric_id (25 FN) and integer_number (20 FN) recall silences —
    real but recall-side, a separate competing-margin investigation.
  - The actual promotion/HuggingFace publish mechanics (release skill, deliberate
    reviewed action). This spec produces and judges the candidate; the GO/NO-GO
    to promote is its last AC, the publish itself is the release runbook.
