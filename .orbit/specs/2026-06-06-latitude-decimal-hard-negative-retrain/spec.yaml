acceptance_criteria:
- id: ac-01
  description: |
    Anchor the blend to v19's OWN mistakes, not v22's. The corpus diagnostic
    carries v22 sense predictions; the gold anchor confirms v19 has the same
    failure SHAPE (latitude P 0.714, decimal R 0.600) but not necessarily the
    same column identities. Snapshot the shipped default (v19, models/default)
    on the corpus file list and extract the actual columns v19 labels latitude
    whose values are non-geographic feature floats (the v19 false-positive set).
    Build the hard-negative pool from THESE identities. Document the v19 FP
    column count and how it compares to the v22-derived 3,974.
  gate: true
  checked: false
  ac_type: code
- id: ac-02
  description: |
    Hard-negative blend built. Add the v19 false-positive feature-float columns
    (ac-01) to the training FTMB labelled representation.numeric.decimal_number,
    WITHOUT removing or starving the true-latitude examples (Lat/lat/latitude) —
    latitude recall must not be the price of latitude precision. Record the blend
    composition: hard-negative count, true-latitude count retained, total delta
    vs the v19 training set. Reuse the existing prepare/blend tooling
    (scripts/overnight_v24_numeric.sh lineage), parameterised, not forked.
  gate: false
  checked: false
  ac_type: code
- id: ac-03
  description: |
    Proxy pre-check GO — the gate. Run scripts/proxy_pretrain.sh on the candidate
    blend's FTMB against the v19 baseline snapshot. The destination-drift gate
    (drift_report.py, calibrated band --abs-floor 0.0040 --rel-mult 3.0
    --direction up) MUST return GO — no untargeted boundary tripped. A NO-GO
    means the blend re-scopes (which feature-float family is over-represented?)
    BEFORE any overnight run is launched, not after. Record the proxy verdict,
    wall-clock, and the top movers. This is the proxy's first forward use; its
    decision is binding on whether ac-04 may run.
  gate: true
  checked: false
  ac_type: observation
- id: ac-04
  description: |
    Full overnight 3-seed run + gold-anchor re-score (only if ac-03 = GO).
    Train the candidate at full depth (3 seeds, 50 epochs) and score against the
    gold fixture with scripts/score_gold_anchor.py. Success: decimal_number
    recall improves from 0.600 AND latitude precision improves from 0.714, with
    NO per-family precision/recall regression elsewhere on the gold anchor
    (latitude recall stays 1.000; longitude, year, country_code, categorical,
    alphanumeric_id, integer hold). Record the full per-family table vs the v19
    anchor. Dated empirical window.
  gate: false
  checked: false
  ac_type: observation
- id: ac-05
  description: |
    Mandatory post-train Sense-distribution check still runs (it is not replaced
    by the proxy). Run the full-label-space drift report on the REAL run's
    snapshot vs v19 and confirm the proxy's GO held at full convergence — no
    untargeted boundary exploded that the proxy missed. If the proxy said GO and
    the full run drifts, that is a calibration finding worth recording against
    the proxy's forward-use track record (it was 2-for-2 retro; this is its first
    forward test). Dated empirical window.
  gate: false
  checked: false
  ac_type: observation
- id: ac-06
  description: |
    Promotion decision recorded. Judge the candidate against the promotion gate
    (memory finetype-retrain-authority B08: m-19 >= -0.5%, gate >= 0%, vci3 pass,
    no per-type >= 5% regression) AND the gold-anchor result (ac-04). Emit an
    explicit GO/NO-GO to promote to default. If GO, the publish itself runs via
    the release runbook (separate deliberate action) — this AC records the
    decision and the evidence, it does not perform the HuggingFace swap. If
    NO-GO, record the negative result so the next bet starts informed.
  gate: false
  checked: false
  ac_type: observation
