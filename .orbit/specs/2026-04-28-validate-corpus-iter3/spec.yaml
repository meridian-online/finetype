implementation_notes:
  - |
    **Existing cascade lives at `crates/finetype-eval/src/bin/validate_corpus.rs:259-340`.**
    The `attribute` module has the `Mechanism` enum (5 + NoGt), 5-seam
    table at line 290, `column_in_seam_table()` helper at line 292, and
    `attribute()` fn at line 300 implementing the 5-rule cascade. Read
    this before changing anything. Iter-2's rules are correct in their
    domain and must be preserved as paths A within their respective
    buckets.

  - |
    **Cascade rule layout suggestion.** Refactor `attribute()` from a
    single switch into a thin dispatcher iterating an ordered slice of
    rule functions. Each rule function takes `(column_name,
    predicted_label, expected_label, rejects)` and returns
    `Option<Mechanism>` (None = doesn't fire, falls through to the next
    rule). The 7th rule (unknown) returns `Some(Mechanism::Unknown)`
    unconditionally. This shape makes the cascade order test (ac-06)
    trivial — it can iterate the rules slice and assert on first-match
    behaviour.

  - |
    **Code-typed taxonomy allowlist seeding.** Walk
    `labels/definitions_*.yaml` for `broad_type: VARCHAR` types whose
    `format_string` is short-token (≤8 chars) or whose label contains
    `code` substring as a starting heuristic. Hand-curate from there.
    Document the criterion in rustdoc on `CODE_TYPED_LABELS`.

  - |
    **Fixture file population workflow — strict two-pass (ac-03 +
    ac-13).** Each phase is a SEPARATE git commit on the iter-3
    branch; this is enforced by ac-13's `git log` assertion.

    Phase 1 (anchor commit): hand-write the 5 anchor rows from
    `.orbit/specs/2026-04-28-validate-corpus-curation/spec.yaml`'s
    expected-vs-actual table. The harness has NOT been run at this
    point; `expected_mechanism` for these 5 rows is taken VERBATIM
    from iter-2's spec. Commit message: "iter-3 fixture Phase 1 —
    5 iter-2 anchor rows (independent ground-truth)".

    Phase 2 (harness-derived commit): run iter-3 harness against the
    full 12-dataset manifest, capture per-dataset failing columns,
    append one row per column with rationale = first sentence of the
    rule's rustdoc that fired. Hand-review each Phase-2 row for
    plausibility (catch obvious miscategorisations) before commit.
    Commit message: "iter-3 fixture Phase 2 — N harness-derived
    rows from 12-dataset run".

    After Phase 2 commits: record the fixture row count in this
    spec's metadata as `metadata.fixture_baseline_rows` (or in a new
    `implementation_state` block), and wire that constant into
    `vci3_fixture_row_count_baseline` (constraint 5). Subsequent
    fixture changes that shrink the row count below the baseline
    fail the test.

  - |
    **Same-broad-type prefix detection.**
    `predicted_label.split('.').next()` returns `Some("datetime")` for
    `datetime.timestamp.iso_8601`. Compare with
    `expected_label.split('.').next()`. Subtype mismatch is the full-label
    inequality after the prefix-equality check. No regex needed.

  - |
    **Code-typed lookup is O(N) over allowlist.** Allowlist will be
    small (≤30 entries). Linear scan with `.iter().any(|s| s ==
    label)` is fine — no need for HashSet plumbing. If the list grows
    past ~50 entries, escalate to `phf` or `OnceLock<HashSet>`.

  - |
    **Trigger label threading.** The `attribute()` dispatcher returns
    `(Mechanism, &'static str)` instead of just `Mechanism` — the
    second tuple element is the rule's trigger label, OWNED by the
    rule function (the dispatcher does NOT infer it from the
    Mechanism variant). The 6 distinct labels are:
    `"path-a-pattern"`, `"path-b-prefix"`, `"path-b-codetype"`,
    `"enum-constraint"`, `"prediction-error"`, `"fallthrough"`.
    Plumb the tuple through `DatasetResult` and into the per-column
    report row.

  - |
    **Markdown doc location.** `docs/mechanism-attribution.md` puts
    the file at the project's standard docs root (next to any other
    project markdown docs). If `docs/` doesn't exist yet, create it.
    The link from `validate_corpus.md` is relative:
    `../../docs/mechanism-attribution.md`.

  - |
    **MADR numbering.** `ls .orbit/choices/` shows the highest current
    MADR number; the next 3 numbers go to bucket-coalesce, fixture-lock,
    label-only attribution in that order. Sequential, not topical
    grouping.

  - |
    **Test prefix migration.** The 6 iter-1 tests at lines
    690/703/716/729/742/754 are renamed/absorbed, not deleted in place.
    The replacement tests (under `vci3_*`) cover the same behavioural
    surface, so the absorption is a 1-for-1+ replacement, not a
    regression. Run `cargo test -p finetype-eval` before and after to
    confirm no test count regression.

