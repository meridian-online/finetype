      - `nyc_taxi`, `tpep_pickup_datetime`, `format_diversity`
        — source: iter-2 GT sidecar `notes:` naming subtype drift on
        the timestamp column.
      - `gdelt_events`, `SQLDATE`, `format_diversity`
