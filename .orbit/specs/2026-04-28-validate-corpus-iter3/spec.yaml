        the validator." Path B trigger: GT
        `representation.text.plain_text`; harness predicts
        `finance.currency.amount` (in allowlist) → one-side-in-allowlist
        fires. (Replaces the v1.1 Nationality anchor — Nationality is
        named only in iter-2's illustrative mismatch-documentation
        table, not in the FIFA GT sidecar's CvC commitment, and isn't
        even in the current report's failing-column list.)
      - `oecd_employment`, `REF_AREA`, `code_vs_canonical`
        — source: iter-2 GT sidecar naming alpha-2/alpha-3 country
        code mix. Path B trigger: GT
        `geography.location.country_code` (in allowlist).

      **Known taxonomy-gap row (1 row, NOT a hard anchor):**
      - `sp500_constituents`, `GICS Sector`, `code_vs_canonical` —
        constructively un-attributable via label-only signals under
        v0.6.19 taxonomy: GT is `representation.discrete.categorical`
        (no GICS label exists), and there's no plausible predicted
        label that puts either side in the code-typed allowlist
        (English-text sector names like "Information Technology"
        will predict text/categorical, not codes). This row exists
        in the fixture as `pending_escalation: true` with rationale
        pointing at a follow-up spec for taxonomy-widening (GICS
        sector/industry types) OR value-shape signals plumbed into
        RejectRow. The harness assertion for this row is SKIPPED
        — the test marks it `#[ignore]` with a comment pointing at
        the follow-up spec — but it remains a fixture row so the
        obligation isn't lost. **Framed openly as 4 hard + 1 known
        gap, not 5 hard anchors.**

      **Source-of-truth precedence.** When iter-2's spec text
      contradicts the GT sidecar `notes:` section, the GT sidecar
      wins (the sidecar IS the curation deliverable; the spec text
      is the curation plan). The iter-2 spec's mismatch-documentation
      table is illustrative, not authoritative — do NOT cite it as
      the anchor source.

      Two-pass fixture construction (pinned in implementation_notes):
      Phase 1 hand-writes these 5 rows from the GT sidecar `notes:`
      sections (NOT from harness output, NOT from the iter-2 spec's
      illustrative table). Phase 2 runs the harness and adds rows
      for every other failing column. Phase 1 commits BEFORE Phase
      2 runs, so the 4 hard anchors can never be silently
      regenerated from harness output.
