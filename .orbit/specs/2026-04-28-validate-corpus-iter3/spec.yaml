id: 2026-04-28-validate-corpus-iter3
status: closed
goal: |
  Wire the validate-corpus harness's per-mechanism attribution to surface what
  iter-2's curated mechanism-coverage datasets were designed to exercise, and
  define what "best-at-this" looks like for FineType's round-trip diagnostic
  capability — the headline measure of project success.

  Concretely:
  1. Coalesce attribution into 4 buckets (per card 0014 scenario 2), with each
     bucket dispatching on two trigger paths internally — iter-2's
     `predicted == expected + pattern-reject` path and iter-3's
     `predicted != expected` shape (same-broad-type-prefix subtype drift for
     format_diversity; code/canonical disagreement for code_vs_canonical).
  2. Place the new iter-3 paths ahead of the catch-all misclassification rule
     in the cascade so iter-2's curated datasets (NYC Taxi, GDELT, FIFA, OECD,
     S&P 500) attribute to their target buckets.
  3. Promote iter-2's expected-vs-actual table to an authoritative
     per-(dataset, column) fixture covering every failing column across all 12
     datasets — not just iter-2's curated 5. The fixture becomes the
     anti-regression lock and the test surface for cascade behaviour.
  4. Ship analyst-facing documentation explaining each of the 4 mechanisms in
     plain language so the validate-corpus report is self-describing.
  5. Reconcile the three competing test-naming conventions
     (`pvc_attribute_rule_*` / `mechanism_attribution_*` / `vci3_*`) to a
     single prefix.

  This is a pure attribution-logic change in the harness binary at
  `crates/finetype-eval/src/bin/validate_corpus.rs`. Iter-2 GT sidecars,
  validate-corpus CSVs, the manifest, sources.yaml, and row_hashes.tsv are
  byte-unchanged.
acceptance_criteria:
- id: ac-01
  description: |
    Cascade refactor in `crates/finetype-eval/src/bin/validate_corpus.rs`
    `attribute` module. The 5-rule cascade (iter-2) becomes a 7-rule cascade
    with explicit ordering:

    1. enum_overfit — `predicted == expected` AND any enum-constraint failure.
    2. format_diversity (path B — iter-3 NEW) — `predicted != expected`
       AND GT and predicted share broad-type prefix (split on '.', take
       first segment) AND full-label mismatch (subtype differs).
    3. code_vs_canonical (path B — iter-3 NEW) — `predicted != expected`
       AND one side is in the code-typed taxonomy allowlist.
    4. format_diversity (path A — iter-2 PRESERVED) — `predicted == expected`
       AND SEMANTIC_TYPE pattern-reject AND
       `!column_in_seam_table(column_name)` (the iter-2 helper at
       validate_corpus.rs:292 — must be invoked explicitly, not
       re-derived inline).
    5. code_vs_canonical (path A — iter-2 PRESERVED) — `predicted == expected`
       AND SEMANTIC_TYPE pattern-reject AND
       `column_in_seam_table(column_name)` (same helper as Rule 4,
       opposite branch).
    6. misclassification — `predicted != expected` AND any SEMANTIC_TYPE
       reject (catch-all for prediction errors not handled by 2 or 3).
    7. unknown — anything else.

    Each rule lives in its own free function (e.g. `try_format_diversity_b`,
    `try_code_vs_canonical_b`) with rustdoc explaining trigger condition,
    example input, and what it does NOT fire on. The `attribute()` entry
    point becomes a thin dispatcher iterating the rules in order.
  ac_type: code
- id: ac-02
  description: |
    Code-typed taxonomy allowlist module within
    `crates/finetype-eval/src/bin/validate_corpus.rs` (or a sibling module
    in the same binary). Curated set of taxonomy labels treated as
    code-typed for the code_vs_canonical path B rule. Every entry MUST
    be a label that exists in `labels/definitions_*.yaml` — verified
    against the loaded taxonomy at test time, not by `[a-z_.]` regex.

    Initial seed (≥20 entries, all verified present in v0.6.19 taxonomy
    as of 2026-04-29):

    - geography: `geography.location.country_code`,
      `geography.location.state_code`,
      `geography.transportation.iata_code`,
      `geography.transportation.icao_code`,
      `geography.transportation.hs_code`,
      `geography.transportation.unlocode`,
      `geography.contact.calling_code`
    - finance: `finance.banking.swift_bic`, `finance.banking.iban`,
      `finance.banking.aba_routing`, `finance.banking.bsb`,
      `finance.currency.currency_code`,
      `finance.securities.cusip`, `finance.securities.figi`,
      `finance.securities.isin`, `finance.securities.lei`,
      `finance.securities.sedol`,
      `finance.payment.credit_card_number`
    - identity: `identity.medical.cpt`, `identity.medical.loinc`,
      `identity.medical.npi`, `identity.medical.ndc`,
      `identity.medical.icd10`, `identity.government.ssn`,
      `identity.government.ein`, `identity.government.vin`,
      `identity.government.eu_vat`, `identity.commerce.ean`,
      `identity.commerce.isbn`, `identity.commerce.upc`,
      `identity.person.gender_code`
    - technology: `technology.code.doi`, `technology.code.imei`,
      `technology.code.locale_code`, `technology.internet.http_method`,
      `technology.internet.top_level_domain`

    **GICS carve-out (S&P 500).** `gics_sector / industry_group /
    industry / sub_industry` do NOT exist in v0.6.19 taxonomy; the
    `sp500_constituents.GICS Sector` GT label is
    `representation.discrete.categorical`. The allowlist cannot
    handle this slot; iter-3's S&P 500 code_vs_canonical attribution
    relies on the implementer's allowlist tuning during fixture
    construction (constraint 4) — concretely, on whether the iter-3
    harness predicts a label for that column that is itself in the
    allowlist (e.g. a code-typed label predicted for canonical text).
    If allowlist tuning cannot make S&P 500 attribute to
    code_vs_canonical with label-only signals, the row is recorded
    in the iter-3 report's expected-vs-actual table as 'pending
    value-shape escalation' per constraint 4, and a follow-up spec
    is filed (taxonomy widening for GICS, OR value-shape signals).

    The allowlist is a `pub(crate) const` slice of `&'static str` with
    a rustdoc block explaining the curation criterion (short-form
    identifier codes vs canonical text/name forms) and the escalation
    path (value-shape signals if label-only proves insufficient even
    after tuning). The implementer MAY add or remove labels during
    fixture construction; the seed above is a starting point, not a
    ceiling.
  ac_type: code
- id: ac-03
  description: |
    Per-(dataset, column) fixture file at
    `eval/datasets/validate_corpus_expected_attributions.yaml`. YAML
    array; each entry has fields:
    - `dataset` (string, required)
    - `column` (string, required)
    - `expected_mechanism` (string, required, one of: enum_overfit,
      format_diversity, misclassification, code_vs_canonical, unknown,
      no_gt)
    - `rationale` (string, required, ≤200 chars)
    - `pending_escalation` (bool, optional, default false) — see ac-13

    Fixture coverage: EVERY failing column across all 12 datasets in
    `eval/datasets/validate_manifest.csv`. Construction is **strict
    two-pass** (enforced by ac-13's git-log assertion):

    Phase 1 (separate commit): hand-write the 5 anchor rows from
    `.orbit/specs/2026-04-28-validate-corpus-curation/spec.yaml`'s
    expected-vs-actual table. NO harness run informs Phase 1 —
    `expected_mechanism` for these 5 rows is taken VERBATIM from
    iter-2's spec.

    Phase 2 (separate commit): run the iter-3 harness against the
    full 12-dataset manifest, capture per-dataset failing columns,
    and append a fixture row per column. Each row's `rationale` is
    the first sentence of the rule's rustdoc that fired; each row's
    `expected_mechanism` is the harness's actual output. Hand-review
    each row before commit (catch any obvious miscategorisations).

    After Phase 2 commits, record the row count in this spec's
    implementation_notes as the baseline for the
    `vci3_fixture_row_count_baseline` test (constraint 5).

    The fixture is committed to the repo and is the authoritative
    ground-truth for what each failure means.
  ac_type: code
- id: ac-04
  description: |
    Per-mechanism positive and negative tests for the 4 mechanism buckets
    AND the 2 trigger paths within format_diversity and code_vs_canonical.

    Positive tests (≥1 per bucket, ≥1 per trigger path):
    - `vci3_attribute_enum_overfit_positive`
    - `vci3_attribute_format_diversity_path_a_positive` (iter-2 path)
    - `vci3_attribute_format_diversity_path_b_positive` (iter-3 path)
    - `vci3_attribute_code_vs_canonical_path_a_positive` (iter-2 path)
    - `vci3_attribute_code_vs_canonical_path_b_positive` (iter-3 path)
    - `vci3_attribute_misclassification_positive`

    Negative tests (2-3 per mechanism documenting boundary cases):
    - `vci3_attribute_format_diversity_negative_cross_domain` —
      GT=`datetime.timestamp.iso_8601`, predicted=`representation.numeric.integer`,
      rejects=[SEMANTIC_TYPE]. Asserts misclassification, not format_diversity.
    - `vci3_attribute_format_diversity_negative_no_subtype_diff` —
      GT=`datetime.timestamp.iso_8601`, predicted=`datetime.timestamp.iso_8601`,
      rejects=[]. Asserts NoGt or unknown, not format_diversity.
    - `vci3_attribute_code_vs_canonical_negative_both_code_typed` —
      GT=`geography.location.country_code` (ISO-2),
      predicted=`finance.banking.swift_bic`, both in allowlist. Asserts
      misclassification, not code_vs_canonical.
    - `vci3_attribute_code_vs_canonical_negative_both_text` —
      GT=`representation.text.word`, predicted=`representation.text.sentence`.
      Asserts misclassification or unknown, not code_vs_canonical.
    - `vci3_attribute_enum_overfit_negative_pattern_only` —
      `predicted == expected`, only pattern reject (no enum). Asserts
      format_diversity (path A), not enum_overfit.
    - `vci3_attribute_misclassification_negative_handled_by_path_b` —
      `predicted != expected`, same broad-type prefix, subtype mismatch.
      Asserts format_diversity (path B), not misclassification (regression
      test for cascade ordering).

    (The seam-table-guard test for Rule 4 vs Rule 5 cascade ordering
    lives in ac-06, NOT here — it's a cascade-ordering test, not a
    format_diversity boundary test.)

    Total: ≥12 attribution tests (6 positive + 6 negative minimum).
  ac_type: code
- id: ac-05
  description: |
    Fixture-iteration **regression test** that asserts per-(dataset,
    column) attribution matches the fixture for every row. This is a
    regression check (pins behaviour against future drift), NOT a
    correctness check (the only correctness check is ac-13's anchor
    pin — every other Phase-2 fixture row records the harness's
    output as `expected_mechanism`, so attribute() agreeing with the
    fixture proves nothing about correctness on Phase-2 rows; it
    proves the harness still does what it did when the fixture was
    written).

    The test loads
    `eval/datasets/validate_corpus_expected_attributions.yaml`,
    synthesises a minimal `(predicted_label, expected_label, rejects)`
    triple per row from per-dataset stored test data (or runs the
    validate harness against test fixtures), and asserts
    `attribute(...)` returns the fixture's `expected_mechanism` for
    every row where `pending_escalation: false`.

    The test name is `vci3_fixture_attribution_regression_match`
    (renamed from v1.1's `vci3_fixture_attribution_match` to make the
    regression-check framing explicit). Rustdoc on the test function
    explicitly states it's a regression check, not a correctness
    check, and points at ac-13 as the correctness anchor.

    Failure messages include the offending row's `(dataset, column,
    expected, actual, rationale)` for clear diff in CI.
  ac_type: code
- id: ac-06
  description: |
    Cascade-order test that asserts the 7 rules fire in the documented
    order. Constructs synthetic inputs that would trigger multiple rules
    and asserts the highest-priority rule wins.

    Test name: `vci3_attribute_cascade_order`. Cases (≥4
    multi-rule-eligible cases):
    - Input matches both Rule 2 (format_diversity path B) and Rule 6
      (misclassification) → asserts format_diversity.
    - Input matches both Rule 3 (code_vs_canonical path B) and Rule 6
      (misclassification) → asserts code_vs_canonical.
    - Input matches both Rule 1 (enum_overfit) and Rule 4
      (format_diversity path A) → asserts enum_overfit.
    - Input matches both Rule 5 (code_vs_canonical path A — column IN
      seam table, predicted == expected, SEMANTIC_TYPE pattern-reject)
      and Rule 4 (format_diversity path A — same trigger but
      seam-table-blind). Asserts code_vs_canonical (Rule 5 fires
      first by cascade order; the `column_in_seam_table()` guard on
      Rule 4 must short-circuit). This case can be a sub-test inside
      `vci3_attribute_cascade_order` OR a separately-named test
      `vci3_attribute_cascade_order_rule5_before_rule4` — implementer
      choice. Either way, the case lives under ac-06's cascade-order
      coverage, NOT under ac-04's format_diversity negatives.
  ac_type: code
- id: ac-07
  description: |
    Test naming reconciliation. Iter-1's `pvc_attribute_rule_*` tests
    (validate_corpus.rs:690, 703, 716, 729, 742, 754 per review-spec)
    renamed to `vci3_attribute_*`-prefixed equivalents that fold into
    ac-04/05/06 coverage. The 6 iter-1 tests do not survive as
    independent tests — their assertions are absorbed into the new
    ac-04 positive/negative test suite to avoid duplication.

    Verification text in this spec uses `vci3_attribute_*` exclusively;
    no `mechanism_attribution_*` or `pvc_attribute_*` references in
    verification fields after this iteration ships.
  ac_type: code
- id: ac-08
  description: |
    Analyst-facing markdown doc at `docs/mechanism-attribution.md`
    explaining the 4 mechanism buckets in plain language for analysts
    who don't read Rust. Each bucket gets a section with:

    - **Definition** — one-paragraph plain-English description
    - **Trigger conditions** — when does this fire (label-level, no code)
    - **Example failure** — concrete dataset/column from the corpus
    - **Recommended fix path** — what an analyst (or follow-up card)
      should do about it (taxonomy widening, model retrain, schema
      manual override, etc.)

    The doc opens with a 2-3 paragraph framing of the round-trip
    diagnostic — what `make validate-corpus` does, why mechanism
    attribution matters, how to read the per-mechanism breakdown table
    in the report. Closes with a "When to file a follow-up card"
    section listing the escalation paths.

    Linked from the header of `eval/eval_output/validate_corpus.md`
    (top of the file, above the headline) via a relative markdown link.
  ac_type: doc
- id: ac-09
  description: |
    Per-column report layout extended with a `trigger:` notes column
    so the iter-2 vs iter-3 trigger path is visible per failure. The
    per-column table in `eval/eval_output/validate_corpus.md` gains a
    column showing one of these 6 distinct labels (no shared
    `cascade-default` bucket):
    - `path-a-pattern` (iter-2 trigger: predicted == expected + pattern-reject)
    - `path-b-prefix` (iter-3 trigger: predicted != expected + same prefix)
    - `path-b-codetype` (iter-3 trigger: predicted != expected + code-typed)
    - `enum-constraint` (Rule 1 enum_overfit: predicted == expected + enum reject)
    - `prediction-error` (Rule 6 misclassification: predicted != expected, fell through paths B)
    - `fallthrough` (Rule 7 unknown: nothing else matched)

    The harness's report-generation code is updated to thread the trigger
    label through DatasetResult → per-column table. Each rule function
    returns its trigger label as part of the `(Mechanism, &'static str)`
    tuple (see implementation_notes); the dispatcher does not infer the
    label from the Mechanism variant.
  ac_type: code
- id: ac-10
  description: |
    Run `make validate-corpus` to regenerate
    `eval/eval_output/validate_corpus.md`. The post-iter-3 report shows:

    1. Per-mechanism breakdown table with `format_diversity` count ≥ 1
       AND `code_vs_canonical` count ≥ 1 (lifts iter-2's AC-08
       downgrade). The `code_vs_canonical` count must include at
       least one row whose `(dataset, column)` matches a fixture
       entry with `expected_mechanism: code_vs_canonical` AND
       `pending_escalation: false` — i.e. the count cannot be
       satisfied solely by GICS-style pending-escalation rows AND
       cannot be trivially engineered via allowlist tuning that
       doesn't tie to a fixture-blessed row. Same constraint
       applies symmetrically to `format_diversity` ≥ 1.
    2. Misclassification bucket count strictly less than the iter-2
       baseline (which had all 5 curated datasets attributing to
       misclassification).
    3. Per-dataset attribution for the 5 iter-2 anchor rows
       (ac-13) matches the fixture's `expected_mechanism` for each
       row, EXCEPT rows carrying `pending_escalation: true` which
       are reported as the actual harness output and called out in
       the report's expected-vs-actual table as "pending value-shape
       escalation". This sub-criterion is fixture-driven: the
       assertion is "report agrees with fixture for all anchor rows
       where pending_escalation is false", not a hard count of
       specific datasets — the fixture is the authority (constraint
       5).
    4. Iter-2 expected-vs-actual table at the bottom of the report
       updated: the "iter-1 actual" column relabeled to "iter-2
       actual"; a new "iter-3 actual" column added showing each row
       now matches the "expected" column (or carries the
       "pending value-shape escalation" annotation per
       sub-criterion 3).
  ac_type: code
- id: ac-11
  description: |
    Three MADRs landed at `.orbit/choices/` capturing the architectural
    decisions surfaced in the design session:

    - `00NN-mechanism-bucket-coalesce.md` — 4 buckets, two trigger paths
      each. Refines/extends iter-1's implicit cascade decision. Status:
      accepted, dated 2026-04-29.
    - `00NN-validate-corpus-fixture-anti-regression-lock.md` —
      per-(dataset, column) fixture as authoritative ground-truth and
      anti-regression lock. Notes the fixture is also the test surface
      for ac-05. Status: accepted, dated 2026-04-29.
    - `00NN-label-only-code-canonical-attribution.md` — label-only
      attribution via taxonomy allowlist for code_vs_canonical path B,
      with explicit escalation path to value-shape signals if
      under-fires. Status: accepted, dated 2026-04-29.

    Numbers (`00NN`) chosen sequentially from the next available slots
    after the highest-numbered existing MADR.
  ac_type: doc
- id: ac-12
  description: |
    Documentation updates outside the MADRs:

    - `CHANGELOG.md` [Unreleased] section gains entries describing the
      cascade refactor, fixture file, analyst-facing doc, and test
      rename.
    - `CLAUDE.md` "Recent work" / "What's next" sections updated to
      reflect iter-3 shipping. The "Validate-precision corpus shipped"
      bullet under "What's next" gets an iter-3 follow-up clause; the
      iter-3 bullet moves from "stub" to a full one-paragraph status.
    - Card `.orbit/cards/0014-profile-validate-precision.yaml` `specs[]`
      array already contains `.orbit/specs/2026-04-28-validate-corpus-iter3/`
      from iter-2 — verify it's still there post-iter-3.
  ac_type: doc
- id: ac-13
  description: |
    Independent-ground-truth pin: 4 hard anchor rows + 1 known
    taxonomy-gap row, sourced from the iter-2 GT sidecar `notes:`
    sections (NOT the illustrative mismatch table at iter-2 spec
    lines 432-440 — that table is documentation pattern, not
    delivered curation thesis). The fixture (ac-03) MUST contain
    these 5 rows with `expected_mechanism` taken from each
    dataset's GT sidecar `notes:` (the curation thesis), pinned
    independently of the iter-3 harness output.

    **Hard anchors (4 rows, strict assertion):**
    - `nyc_taxi`, `tpep_pickup_datetime`, `format_diversity`
      — source: iter-2 GT sidecar `notes:` naming subtype drift on
      the timestamp column.
    - `gdelt_events`, `SQLDATE`, `format_diversity`
      — source: iter-2 GT sidecar naming compact_ymd date subtype.
    - `fifa_players`, `Value`, `code_vs_canonical`
      — source: `eval/datasets/validate_corpus/fifa_players.gt.yaml`
      notes section item (2): "Value, Wage, Release Clause use
      formatted currency with M/K abbreviation ('€110.5M', '€565K')
      ... finance.currency.amount validation accepts plain numerics
      with at most a single currency symbol; the M/K suffix breaks
      the validator." Path B trigger: GT
      `representation.text.plain_text`; harness predicts
      `finance.currency.amount` (in allowlist) → one-side-in-allowlist
      fires. (Replaces the v1.1 Nationality anchor — Nationality is
      named only in iter-2's illustrative mismatch-documentation
      table, not in the FIFA GT sidecar's CvC commitment, and isn't
      even in the current report's failing-column list.)
    - `oecd_employment`, `REF_AREA`, `code_vs_canonical`
      — source: iter-2 GT sidecar naming alpha-2/alpha-3 country
      code mix. Path B trigger: GT
      `geography.location.country_code` (in allowlist).

    **Known taxonomy-gap row (1 row, NOT a hard anchor):**
    - `sp500_constituents`, `GICS Sector`, `code_vs_canonical` —
      constructively un-attributable via label-only signals under
      v0.6.19 taxonomy: GT is `representation.discrete.categorical`
      (no GICS label exists), and there's no plausible predicted
      label that puts either side in the code-typed allowlist
      (English-text sector names like "Information Technology"
      will predict text/categorical, not codes). This row exists
      in the fixture as `pending_escalation: true` with rationale
      pointing at a follow-up spec for taxonomy-widening (GICS
      sector/industry types) OR value-shape signals plumbed into
      RejectRow. The harness assertion for this row is SKIPPED
      — the test marks it `#[ignore]` with a comment pointing at
      the follow-up spec — but it remains a fixture row so the
      obligation isn't lost. **Framed openly as 4 hard + 1 known
      gap, not 5 hard anchors.**

    **Source-of-truth precedence.** When iter-2's spec text
    contradicts the GT sidecar `notes:` section, the GT sidecar
    wins (the sidecar IS the curation deliverable; the spec text
    is the curation plan). The iter-2 spec's mismatch-documentation
    table is illustrative, not authoritative — do NOT cite it as
    the anchor source.

    Two-pass fixture construction (pinned in implementation_notes):
    Phase 1 hand-writes these 5 rows from the GT sidecar `notes:`
    sections (NOT from harness output, NOT from the iter-2 spec's
    illustrative table). Phase 2 runs the harness and adds rows
    for every other failing column. Phase 1 commits BEFORE Phase
    2 runs, so the 4 hard anchors can never be silently
    regenerated from harness output.
  ac_type: code
- id: ac-14
  description: |
    `make ci` exits 0. This includes fmt + clippy + test + check. The
    new tests under `vci3_*` prefix all pass:
    - ≥12 attribution tests (ac-04: 6 positive + 6 negative minimum)
    - 1 fixture-iteration regression test (ac-05:
      `vci3_fixture_attribution_regression_match`)
    - 1 cascade-order test (ac-06: `vci3_attribute_cascade_order`,
      ≥4 cases including Rule 5 vs Rule 4 seam-table case)
    - 2 allowlist tests (ac-02:
      `vci3_code_typed_allowlist_taxonomy_valid` +
      `vci3_code_typed_allowlist_seed_minimum`)
    - 1 fixture-baseline test (constraint 5:
      `vci3_fixture_row_count_baseline`)
    - 2 anchor tests (ac-13:
      `vci3_fixture_iter2_anchor_rows_present` +
      `vci3_fixture_anchor_count_4_hard_1_gap`)
    Total: ≥19 net new `vci3_*` tests. No clippy warnings on the
    new code. The taxonomy `cargo run -- check` step remains green.
