id: 2026-06-04-value-level-ydf-labelling
goal: |
  Clean the gittables training corpus to VALUE granularity with a value-level
  YDF confidence gate, then settle whether the v14 CharCNN latitude result
  survives on de-noised real data in an apples-to-apples head-to-head with v19.

  ## Why this is needed

  The v14 value-only CharCNN (precision feature + schema-validation gate, commit
  24c8f90) drove latitude collateral to 0 on the 150-file corpus lens, beating
  the v24 multi-branch (29 collateral) with NO header signal. But that CharCNN
  trained on SYNTHETIC per-type data while v19 trains on the gittables blend, so
  the clean footprint is confounded: some of the win may be cleaner training
  data, not better architecture. The honest re-test is to train the CharCNN on
  gittables — but the gittables blend is dirty for two reasons the author named:

  1. **Column-granular labels over heterogeneous values.** A column labelled
     `latitude` is one label stretched over values that are not all latitude-like.
     Training "every value in the column = latitude" teaches the noise.
  2. **Unverified distillation.** The column labels came from a best-effort
     distillation that was never verified, so the label itself may be wrong.

  Both are VALUE-level noise. The existing YDF tooling cannot reach them: the YDF
  lens (scripts/train_ydf.py) and the specialist extractor
  (scripts/extract_ydf_specialist_training_data.py, spec
  2026-05-23-ydf-specialist-geography) both work at COLUMN granularity — YDF
  trains on 8-value column aggregates (mean length, digit fraction, bigram
  TF-IDF) and the extractor keeps or drops whole columns. Neither can say "this
  value is latitude, that one is not."

  ## What this ships

  A VALUE-level YDF confidence gate built from the three components the author
  trusts — CharCNN value features, JSON Schema validation, YDF — that filters
  gittables down to high-confidence (value, label) pairs, then retrains the
  CharCNN on the cleaned set and scores it against v19 on the SAME corpus and the
  SAME gated metric. That comparison answers the confound AND the dirty-data
  concern in one shot.

  Pipeline (detail in the acceptance criteria):
    1. Bootstrap a clean prior — value-level YDF on synthetic per-type values.
    2. Score every gittables value out-of-fold (cross-fit; no self-grading).
    3. Survivor census — cheap go/no-go: do latitude and utc survive the floor?
       HALT and relax the floor if not, before any heavy machinery is built.
    4. Corroboration triad — keep a value when >=2 of {YDF=L high-conf, value
       passes L's JSON Schema, L == weak column label}; drop off-distribution
       values; flag majority-disagreement columns as distillation label-errors.
    5. Optional one self-training round.
    6. Retrain the CharCNN on the cleaned value-level set.
    7. Apples-to-apples vs v19 on the corpus-pass gated lens — plus a
       dirty-trained CharCNN control cell, scored against a pre-set win
       condition (closes the confound; doesn't just measure cleaner data).

  ## Feature set per value

  YDF trains on a fixed per-value vector: the 37-dim deterministic
  `extract_features` (now including `decimal_places`) PLUS the 240-dim JSON
  Schema pass-rate vector (which of the 240 type schemas this single value
  satisfies). The schema vector is the Precision Principle as a feature and is
  the strongest per-value signal available. This is a NON-Sense feature category
  by construction (extract_features is deterministic, not a Sense branch), so the
  YDF lens stays independent of the model it cleans data for.

  ## Design decisions (author-approved, revisable on first-run evidence)

  - **Label-error policy: QUARANTINE first.** When the triad flags a column as
    distillation-mislabelled, write it to a quarantine list for review rather
    than auto-relabelling to YDF's call. The distillation was unverified, so the
    first run measures the error rate before we trust auto-relabelling. Revisit
    auto-relabel once the rate is known.
  - **Confidence floor: 0.85** (stricter than the column extractor's 0.7). This
    experiment trades recall for label purity — a smaller clean set beats a
    larger noisy one. Tunable if per-type volume starves (see halt conditions).

  ## What this proves, and what it costs

  Proves whether v14's latitude=0 survives once label noise is removed — turning
  "direction validated" into "architecture validated, or not". The cost is
  honest: a value-level YDF has no column context, so columns whose identity only
  emerges in aggregate (a categorical of repeated 2-letter codes) are where it is
  weakest. The ac-07 full-corpus delta therefore ALSO measures the size of the
  job left for the Model2Vec semantic leg — the third component, deferred to a
  later spec.

  ## Pillar defence
  Pillar 3 (precision) and the architecture bet: a clean value-level corpus is
  the substrate every future value-level model trains on. Pillar 4: this converts
  the v14 probe into a settled go/no-go on the new architecture, so the author
  decides the late-fusion direction on evidence, not on a confounded probe.

  ## Halt conditions
  - If the triad starves many types below a usable per-type floor (gate too
    strict), RELAX the confidence floor and re-run ac-04 rather than retraining
    the CharCNN on a starved set (ac-06 must not train on < N cols/type).
  - If the label-error (quarantine) rate is implausibly high, STOP and inspect:
    that points to a miscalibrated YDF prior, not a wholesale-wrong distillation.
  - Leakage firewall is non-negotiable (ac-08). If any cleaned value collides
    with the eval holdout, the run is void.

  ## Out of scope
  - The Model2Vec semantic-matching leg (header-to-taxonomy in embedding space).
    Separate spec; its size is an OUTPUT of ac-07, not an input here.
  - Promoting any model to models/default. This is an architecture experiment;
    promotion is a separate gated decision (v22 precedent).
  - Sharpen-stage rules and the regex header_hint path (decisions 0038/0042/0048).
  - The COLUMN-level YDF lens used by the corpus diagnostic — left untouched so
    the ac-07 metric stays comparable to prior baselines.
  - Changing the multi-branch v19 default. The schema gate already added (commit
    24c8f90) lives only in the per-value path; v19 is unaffected.
cards:
- 0002-semantic-type-detection
status: open
labels:
- labelling
- ydf
- charcnn
- precision
acceptance_criteria:
- id: ac-00
  description: |
    Per-value feature exporter produces a deterministic row of 37-dim
    extract_features (incl. decimal_places) + 240-dim JSON Schema pass-rate for
    any single value, with a fixed, documented column order shared between the
    synthetic-prior path and the gittables-scoring path. Reuse/extend the
    existing `finetype extract-features` bin or a thin Python wrapper over it;
    a golden test pins the vector for a handful of known values (a 4dp latitude,
    a 1dp magnitude, a 2-letter code) so the feature contract cannot drift
    silently between training and scoring.
  gate: false
  checked: true
- id: ac-01
  description: |
    Bootstrap prior trained. A value-level YDF (RandomForest) trains on synthetic
    per-type values from `finetype generate` — one label per value, features =
    the ac-00 vector. Every training value passes the row_hash firewall against
    eval/row_hashes.tsv (exclude collisions). Model + feature manifest saved
    under eval/gittables/models/ydf_value.*; report records per-type support and
    held-out accuracy on synthetic data.
  gate: false
  checked: false
- id: ac-02
  description: |
    Gittables scored out-of-fold. The prior scores every non-trivial gittables
    value from eval/gittables/corpus_pass/columns.parquet, emitting per value:
    ydf_label, ydf_confidence (RF vote fraction), the JSON-Schema pass set, and
    the weak column label. Cross-fitting (OOF) is used so any gittables value
    later folded into training (ac-05) is never graded by a tree that saw it.
    Output a scored-values parquet under output/value-level-labelling/.
  gate: false
  checked: false
- id: ac-03
  description: |
    Survivor census — the cheap go/no-go that runs BEFORE the triad is built.
    From the ac-02 scored-values parquet, count high-confidence (conf >= floor,
    default 0.85) survivors per type, with latitude and utc called out
    explicitly — these are the diseases the head-to-head exists to test. If
    latitude or utc fall below the usable per-type floor (N values), HALT and
    relax the floor: do NOT build the triad on a starved type, because a clean
    filter over a type that isn't there cannot answer the question. Emits a
    one-table census report and gates ac-04. This is deliberately the lightest
    AC in the spec — it spends an afternoon to stop the heavy machinery being
    built on sand.
  gate: false
  checked: false
- id: ac-04
  description: |
    Corroboration triad implemented and run. For each scored value: KEEP as
    (value, L) when >=2 of {YDF predicts L at conf >= floor; value passes L's
    JSON Schema; L == weak column label}; DROP values off-distribution for the
    column label; FLAG columns where YDF confidently predicts a different label
    for the majority AND those values validate better against it — written to a
    quarantine list (NOT auto-relabelled). Floor defaults 0.85. Emits the cleaned
    value-level training NDJSON ({classification, text}) and a label-error
    report. Report: kept/dropped/flagged counts, per-type kept volume, and the
    within-column heterogeneity fraction removed. Zero kept rows whose label is
    representation.discrete.categorical trained as a positive target (CLAUDE.md).
  gate: false
  checked: false
- id: ac-05
  description: |
    One self-training round (guarded). Fold the high-confidence KEPT gittables
    values back into the YDF training pool, retrain, re-score once. Report the
    delta in kept-set size and quarantine rate vs the single-pass result. If the
    round does not improve the kept set or worsens the leakage/heterogeneity
    metrics, keep the single-pass set and record why. Skippable without failing
    the spec if ac-04 already yields a usable set.
  gate: false
  checked: false
- id: ac-06
  description: |
    CharCNN retrained on the cleaned set. Train char-cnn with --use-features
    (37-dim) on the ac-04 (or ac-05) cleaned NDJSON, same recipe as v14-feat
    (12 epochs, seed 42), with the column.rs schema gate active. Refuse to train
    if any type falls below the usable per-type floor (halt condition — relax the
    floor and re-run ac-04 instead). Model saved to models/char-cnn-v15-gittables.
  gate: false
  checked: false
- id: ac-07
  description: |
    Apples-to-apples head-to-head — the question this spec settles. Three cells,
    one corpus, one gated lens (ydf_prediction_gated):
      (1) cleaned-data CharCNN (ac-06),
      (2) DIRTY-data CharCNN — same recipe trained on the UN-cleaned gittables
          blend (skip the triad). This is the confound control: without it a
          CharCNN win reads as "clean data won"; with it the win reads "the
          METHOD won, on the same messy data v19 had".
      (3) v19 multi-branch baseline.
    Report BOTH: (a) the latitude/utc collateral footprint — does v14's
    latitude=0 survive on cleaned REAL data? — and (b) full-corpus cell-2
    accuracy vs v19, the net-win check, not just the one disease.

    WIN CONDITION — decide the verdict against this bar, set BEFORE the run, do
    not rationalise it after:
      - latitude at/near 0 on cleaned data AND net cell-2 does not regress vs
        v19  ->  architecture VALIDATED (clean win).
      - latitude survives but cell-2 dips ONLY on column-context-dependent types
        ->  VALIDATED, with the Model2Vec gap quantified (the expected outcome).
      - latitude collateral returns once trained on real data  ->  NO-GO; v14
        was a synthetic-data artefact, not an architecture.
    State plainly which bar the result hits, and which losses are
    column-context-dependent types (the size of the deferred Model2Vec job).
  gate: true
  checked: false
  ac_type: observation
- id: ac-08
  description: |
    Leakage audit clean. Confirm zero overlap between the cleaned training set
    and the eval holdout via the row_hash(header,value) firewall against
    eval/row_hashes.tsv and the file_content_sha256 MOD 2 partition, mirroring
    the existing extractor's ac-02 leakage report. Any overlap voids the run.
  gate: false
  checked: false
  ac_type: observation
- id: ac-09
  description: |
    Decision memo written: is the architecture validated? Records whether v14's
    result held on cleaned data, the measured cost in column-context-dependent
    types (i.e. the size of the Model2Vec job), the first-run quarantine/label-
    error rate (and whether it justifies moving from quarantine to auto-relabel),
    and the go/no-go on drafting the late-fusion spec. Substrate:
    output/value-level-labelling/decision_memo.md.
  gate: false
  checked: false
  ac_type: doc
