- id: ac-09
  description: |
    Two-lens AND corroboration filter applied to candidate gaps.
    **Design revision 2026-05-21:** DBpedia was dropped from
    corroboration after ac-05's full-corpus extraction revealed that
    the heuristic-extended mapping table is 86% `no_finetype_equivalent`
    (1,476 of 1,710 rows). DBpedia's vote would reach only ~14% of
    columns and would mostly duplicate YDF or cascade where it does
    vote. The simplification removes the downgrade branch entirely
    and removes auto-classified-mapping noise from the lens stack.

    Candidates are clusters of columns sharing the same
    `(mechanism_token, taxonomy_signature, value_shape_signature)`
    triple, where:

      - `taxonomy_signature` is the column's `x-finetype-label`
        (Sense's prediction), the taxonomy ID Sense emitted for the
        column.
      - `value_shape_signature` is the SHA256 of the sorted set of
        distinct character-class patterns extracted from the
        column's `sample_values` (each value mapped via
        `[A-Z]→A, [a-z]→a, [0-9]→9, other→.` then deduplicated and
        sorted lexicographically). **Coarseness note:** with
        `OBSERVED_SAMPLE_LIMIT = 8` (constraint 10), the pattern
        set has ≤8 elements before deduplication, so columns with
        uniform shape produce a singleton pattern set and many
        columns will share signatures. This is acceptable for
        clustering — coarser clusters mean higher
        `affected_column_count` per cluster and a shorter, more
        actionable top-N — but the implementing agent must NOT
        over-interpret signature equality as "same column shape"
        beyond the 8-sample window.

    Both signatures are deterministic — same inputs produce the same
    bytes, so ac-13's byte-identical-output check is preserved.

    **Sense is the subject of corroboration, not a voter.** Sense's
    `x-finetype-label` is the prediction being challenged; the
    corroborating-lens pool is exactly `{YDF, cascade}`. The
    lens-vote functions are: YDF votes its top-1 prediction when
    confidence ≥0.5 (lower-confidence rows do not vote — the 0.5
    threshold matches the cascade's default and is
    sensitivity-checked in `progress.md` against {0.3, 0.5, 0.7} on
    the calibrate half); the cascade votes by emitting any token
    other than `prediction_confirmed`. A lens FLAGS a candidate gap
    iff its vote disagrees with Sense's prediction (or, for cascade,
    iff the token is not `prediction_confirmed`).

    Only candidates flagged by BOTH lenses enter `report.md` —
    `corroborating_lens_count == 2` over the 2-lens pool, i.e. an
    AND. Single-lens candidates (one lens flags, the other
    doesn't) are written to
    `eval/gittables/corpus_pass/single_lens_signals.tsv`.
  gate: false
  checked: true
  verification: |
    DuckDB query
    `SELECT COUNT(*) FROM corroborated_gaps WHERE
    corroborating_lens_count != 2` returns 0 (every corroborated
    gap has both YDF and cascade flagging; `corroborating_lens_count`
    is computed over `{ydf, cascade}` only).
    DuckDB query
    `SELECT COUNT(*) FROM corroborated_gaps WHERE
    'dbpedia' IN UNNEST(corroborating_lenses)` returns 0 — DBpedia
    never appears as a corroborating lens.
    Row count of `single_lens_signals.tsv` logged in `progress.md`.
- id: ac-10
  description: |
    Diagnostic report `eval/gittables/corpus_pass/report.md` has two
    parts:

    **Part 1 — Corroborated gaps (the headline diagnostic).** For each
    non-empty (criterion × mechanism) cell, a section lists the top-10
    ranked gaps. Each gap entry carries: `gap_id`,
    `affected_column_count`, `corroborating_lenses` (exactly 2 entries:
    `ydf` and `cascade`, with their verdicts), `sample_evidence`
    (≥3 example rows; `dbpedia_annotation_if_present` is shown for
    context but is not a vote), `mechanism`, `recommended_action_class`
    (from the locked mapping), `candidate_spec_slug` (suggested
    follow-up slug or empty). Empty cells are explicitly noted
    ("no corroborated gaps found").

    **Part 2 — Candidate taxonomy gaps from DBpedia coverage.** This
    section consumes
    `eval/gittables/corpus_pass/dbpedia_annotations.parquet` joined
    against the `no_finetype_equivalent` rows of
    `eval/gittables/dbpedia_finetype_mapping.tsv`. For each DBpedia
    class with `mapping_status = no_finetype_equivalent` that appears
    in ≥10 columns AND whose host columns were predicted as a
    `trivial` type by Sense (criterion-a fallthroughs), surface the
    class with: `dbpedia_class`, `affected_column_count`,
    `sample_columns` (≥3 file_path + column_name pairs), and a note
    inviting taxonomy-gap follow-up. This separates "DBpedia
    suggests a real-world semantic pattern that FineType doesn't
    model" from the lens-corroborated gaps in Part 1. The two
    parts are independent — they live in the same markdown file but
    do not cross-reference each other's GapEntry IDs.

    Frontmatter includes `model_sha`, `ydf_sha`,
    `dbpedia_mapping_sha`, `cascade_version`, `corpus_index_sha`, and
    `corpus_pass_id` (composite hash of the preceding five fields,
    byte-stable across re-runs). NO wall-clock timestamp in the
    frontmatter — runtime metadata lives in `progress.md`. The
    DBpedia mapping SHA stays in the frontmatter as a reproducibility
    anchor for Part 2 even though DBpedia no longer feeds Part 1.
  gate: false
  checked: true
  verification: |
    File `eval/gittables/corpus_pass/report.md` exists with two
    `##` headings (or equivalent) covering Part 1 and Part 2. Part 1
    has one section per non-empty (criterion × mechanism) cell;
    empty cells noted with the phrase "no corroborated gaps found".
    Part 2 lists `no_finetype_equivalent` DBpedia classes with
    `affected_column_count ≥ 10` whose host columns landed in
    criterion-a fallthroughs, each with ≥3 sample columns.
    Frontmatter contains exactly the six fields named above (no
    `corpus_pass_timestamp`). Part 1 gap entries include the eight
    gap_entry fields; Part 2 entries include their four fields.
  ac_type: doc
- id: ac-11
  description: |
    Validation against
    `2026-05-04-autonomous-type-inference/labelled_eval.tsv`.
    **Vocabulary precondition:** an empirical scan of the current
    `labelled_eval.tsv` shows every distinct `truth_mechanism` value
    is already in the MADRs-0075/0081 closed-10 set, so no
    renormalisation is needed today. A defensive assert remains:
    `scripts/audit_labelled_eval_vocabulary.py` enumerates distinct
    `truth_mechanism` values and asserts each is in the closed set
    before grading. If a future relabelling introduces an unknown
    value the audit fails fast; remediation (commit a
    renormalisation mapping or amend the closed set) lands in a
    follow-up spec, not here. Rows whose `truth_mechanism` would
    be unmappable are tracked in `n_rows_excluded` (presently 0).

    A row is FLAGGED BY THE DIAGNOSTIC iff it appears as
    `sample_evidence`
    in any GapEntry that enters `report.md` (i.e. it is part of a
    corroborated gap cluster, per ac-09). For each flagged row, the
    diagnostic emits a per-row tuple `(row_id, sense_prediction,
    ydf_prediction, dbpedia_annotation, mechanism_token,
    recommended_action_class, truth_inferred_type, truth_mechanism,
    mechanism_correct, ydf_correct)`. A flagged row has
    `mechanism_correct = true` iff
    `recommended_action_class == mapping_table[truth_mechanism]`
    (equivalently, `mechanism_token == truth_mechanism` after
    vocabulary renormalisation). `ydf_correct = true` iff
    `ydf_prediction == truth_inferred_type`. **Precision is
    computed on `mechanism_correct` only** — the diagnostic's
    primary claim is correct gap classification, not YDF top-1
    accuracy. `ydf_accuracy_on_flagged` is reported alongside as a
    separate stat (for lens-quality monitoring) but is NOT in the
    threshold. Unflagged rows are not counted (no true-negative
    ledger). Precision on flagged rows =
    `sum(mechanism_correct) / n_flagged ≥ 0.80`.
  gate: false
  checked: true
  verification: |
    File `eval/gittables/corpus_pass/labelled_eval_per_row.tsv` exists
    with one row per flagged labelled_eval entry and the 9 columns
    named above. Aggregate
    `eval/gittables/corpus_pass/labelled_eval_validation.json`
    derives `{n_rows_total, n_rows_excluded,
    n_flagged_by_diagnostic, n_mechanism_correct,
    precision_on_flagged, ydf_accuracy_on_flagged}` from the TSV
    (the JSON is regenerable via
    `python3 scripts/grade_labelled_eval.py` against the TSV).
    Asserts `precision_on_flagged >= 0.80`.
    `ydf_accuracy_on_flagged` is reported but not asserted. If
    `n_rows_excluded > 0`, the renormalisation mapping table is
    referenced in `progress.md`.
- id: ac-12
  description: |
    Per-cell spot-check on Part 1 (corroborated gaps) of `report.md`.
    Part 2 (DBpedia-derived taxonomy gaps) is not spot-checked under
    this AC — its content is mechanically derived from the
    `no_finetype_equivalent` rows of the audited mapping table.

    For each non-empty (criterion × mechanism) cell in Part 1, 3
    random gaps are sampled using sampling seed `20260520`
    (matching ac-02's sample seed, pre-declared here so the
    spot-checker cannot re-roll until a favourable sample appears).

    **Attestor:** `@hughcameron` (the project author), or a named
    delegate captured in `spot_check.md`'s frontmatter. The spot-
    check is `ac_type: ops` — an operator action with captured
    signoff.

    A gap passes spot-check iff ALL of:

    (a) the `sample_evidence` rows actually exhibit the claimed
        mechanism (the column failure pattern matches the
        MADRs-0075/0081 definition of the assigned
        `mechanism_token`);
    (b) both `corroborating_lenses` (YDF + cascade) genuinely
        disagree with the column's `sense_prediction` — they
        independently point at the same gap (the AND filter
        guarantees both flag, but the spot-checker verifies the
        disagreement is non-spurious);
    (c) the assigned `mechanism_token` is correct for the sample
        evidence per the closed-set definition.

    Partial failures (any 1 of 3 failing) count as full failures.
    Per-cell pass rate ≥ 90%. Attestation captured in
    `spot_check.md`.

    **Failure consequence:** if a cell's pass rate falls below
    90%, all gaps in that cell are demoted from `report.md`'s
    ranked tables to `single_lens_signals.tsv` (treated as
    single-lens-quality signal regardless of their original
    corroboration count), and the demotion is logged in
    `progress.md` with the cell name, sampled gap_ids, and the
    attestor's reason. The spec close blocks until either every
    cell passes OR every failing cell has been demoted; partial
    progress is not acceptable for close.
  gate: false
  checked: true
  verification: |
    File `eval/gittables/corpus_pass/spot_check.md` exists. Lists
    per cell: cell name, sampled gap_ids, per-gap pass/fail verdict,
    reason for any failure. Per-cell summary asserts
    `passed / sampled >= 0.90`. If any cell falls below threshold,
    `progress.md` names the root cause and the remediation action
    taken before spec close.
  ac_type: ops
