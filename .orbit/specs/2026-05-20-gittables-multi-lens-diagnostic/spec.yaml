id: 2026-05-20-gittables-multi-lens-diagnostic
goal: |
  Build a multi-lens corpus diagnostic that runs the FineType pipeline
  (Sense + validators + mechanism cascade) plus an independent YDF
  lens across the full gittables corpus, measured under the
  two-criterion gate from `scripts/gittables_gate.py`
  ((a) `non_trivial_pct ≥ 0.80`, (b) `reject_rate_non_trivial ≤ 0.01`)
  and decomposed by the MADR 0075 + 0081 mechanism cascade.

  The output is a two-part `report.md`. **Part 1** ranks corroborated
  gaps per `(criterion × mechanism)` cell — gaps requiring agreement
  from BOTH `{YDF, cascade}` (an AND filter; Sense is the subject of
  corroboration, not a voter). Each gap entry carries affected-column
  count, sample evidence, recommended action class, and a candidate
  spec slug for downstream work. **Part 2** lists DBpedia-suggested
  taxonomy gaps — DBpedia / Schema.org annotations that point at
  semantic patterns in real columns for which FineType has no
  equivalent type. DBpedia is NOT a corroboration lens (per design
  revision 2026-05-21 — see ac-09 rationale); the annotations parquet
  feeds Part 2 only. The diagnostic surfaces and ranks; it does not
  fix.

  This spec supersedes m-19 (`2026-04-21-eval-expansion`) and becomes the
  eval-expansion milestone. m-19's three deliverables fold in as design
  constraints: train/eval leakage firewall (MADR 0056) extends to the
  full corpus; coverage floor (MADR 0057) is satisfied by construction
  (full pass covers all 240 types Sense can emit); realism standard
  (MADR 0055) is operationalised as the corroboration filter — multi-lens
  agreement IS the realism gate.

  ## Hard constraints

  1. **FineType taxonomy is canonical.** DBpedia / Schema.org annotations
     are navigation aids — they identify columns of known semantic class
     so the diagnostic can measure whether FineType covers and correctly
     predicts the column. They are NEVER imported as type definitions.
     The mapping table FineType-taxonomy ↔ DBpedia / Schema.org class
     is one-way (external → FineType) and lives at
     `eval/gittables/dbpedia_finetype_mapping.tsv`.
  2. **YDF is a lens, not a candidate Sense replacement.** MADR 0041
     (multi-branch as Sense implementation) stands. Any architectural
     use of YDF (e.g. as a triangulator signal in the autonomous-inference
     module) is out of scope here and requires a separate MADR.
  3. **Corroboration filter is the noise-control mechanism at corpus
     scale.** A gap MUST be flagged by BOTH lenses in
     `{YDF, mechanism cascade}` (Sense is the subject of corroboration,
     not a voter). The AND threshold over a 2-lens pool is structurally
     tighter than a ≥2-of-3 OR; this is intentional — a research
     diagnostic prefers precision over recall. Single-lens signals are
     tabulated in `single_lens_signals.tsv` for the implementing
     agent's reference but do not appear in ranked tables. Lens
     independence is the precondition (ac-03 verifies it).
     **DBpedia / Schema.org annotations are NOT a corroboration lens**
     (design revision 2026-05-21 — see ac-09 rationale note). They
     contribute to the "Candidate taxonomy gaps" section of
     `report.md` via the `no_finetype_equivalent` mapping rows from
     `dbpedia_finetype_mapping.tsv` — classes that have no FineType
     equivalent and appear in real-world columns are candidate
     taxonomy gaps. The annotations parquet stays as ac-05 produced it.
  4. **Mechanism vocabulary is the closed 10-token set from MADR 0075 +
     0081** — `format_diversity_path_a`, `format_diversity_path_b`,
     `code_vs_canonical_path_a`, `code_vs_canonical_path_b`,
     `enum_overfit`, `misclassification`, `prediction_confirmed`,
     `validator_widening`, `unknown_no_fit`, `fallthrough`. The report
     MUST NOT invent new mechanism tokens; failure modes that do not
     fit the set surface as `unknown_no_fit` with a candidate-MADR note
     in `progress.md`.
  5. **Two-criterion gate constants are locked.** `NON_TRIVIAL_FLOOR =
     0.80` over `representation.text.plain_text` and
     `representation.numeric.decimal_number`. `REJECT_RATE_CEIL = 0.01`
     over `COUNT(DISTINCT line)` rejects on non-trivial columns.
     Deviations require an amendment MADR to this spec.
  6. **Train/eval leakage prevention.** The diagnostic runs on the
     MEASURE half of the corpus (`file_content_sha256 MOD 2 == 1`),
     extending the partition scheme from `scripts/split_failure_log.py`
     and MADR 0056. The CALIBRATE half is reserved for descriptive
     curves; weight tuning, threshold selection, and any parameter
     influencing ranked-gap selection MUST NOT consult the measure half.
     Cross-half leakage is a halting condition for spec close.
  7. **Python acceptable for offline research and tooling.** YDF
     training, the corpus runner, the report generator — all Python.
     Any artefact that bleeds into runtime (cargo crates, `finetype`
     CLI, DuckDB extension, MCP server) MUST respect the
     zero-Python-at-runtime policy.
  8. **This is the only active spec.** v19 retrain gate (MADR 0066)
     stays enforced — v20 promotion waits on ac-01 disposition. m-19
     deliverables fold in; Phase 2 inference module work (MADR 0083–0086)
     pauses or rolls in per ac-01.
  9. **Reproducibility.** Same corpus + same lens versions + same
     partition seed → byte-identical ranked-gap list (modulo per-file
     errors that are themselves reproducible). Lens versions captured
     in `report.md` frontmatter as `model_sha` (Sense), `ydf_sha`
     (YDF model file), `dbpedia_mapping_sha` (mapping table SHA256),
     `cascade_version` (MADR 0075/0081 revision tag),
     `corpus_index_sha` (SHA256 of sorted `corpus_paths.txt`),
     and `corpus_pass_id` (defined as
     `SHA256(model_sha || 0x00 || ydf_sha || 0x00 ||
     dbpedia_mapping_sha || 0x00 || cascade_version || 0x00 ||
     corpus_index_sha)` — the five SHA / version fields joined by a
     single 0x00 NUL byte separator, then hashed; byte-stable across
     re-runs because every input is itself reproducible). The
     frontmatter does NOT carry a wall-clock timestamp — runtime
     metadata lives in `progress.md`, not in the report.
  10. **Storage shape.** Per-column outputs at
      `eval/gittables/corpus_pass/columns.parquet`, partitioned by
      `file_content_sha256`. Per-file gate outputs at
      `eval/gittables/corpus_pass/files.parquet`. Aggregation queries
      that produce `report.md`'s tables run via DuckDB SQL.
      `sample_values` truncated to 64 chars per value, ≤8 values per
      column (matches `OBSERVED_SAMPLE_LIMIT` in
      `scripts/cron_cycle_work.py`). Realistic per-row size is
      400–800 bytes; expect 4–10 GB across both Parquet files.

  ## Mechanism token → recommended action class (locked)

  Used by ac-08 to assign each row's `recommended_action_class` and by
  ac-11 to grade diagnostic correctness on labelled_eval.

  **Recommended-action-class enum (closed 5-set):** `validator_widening`,
  `model_retrain`, `training_data_addition`, `taxonomy_addition`,
  `fallback_adjustment`. `prediction_confirmed` maps to N/A — no gap is
  surfaced and no row is emitted. The mechanism-token `validator_widening`
  and the action-class `validator_widening` share a name but live in
  distinct namespaces; the table below is the only place they coincide.

  | mechanism                  | recommended_action_class |
  |----------------------------|--------------------------|
  | format_diversity_path_a    | validator_widening       |
  | format_diversity_path_b    | model_retrain            |
  | code_vs_canonical_path_a   | model_retrain            |
  | code_vs_canonical_path_b   | model_retrain            |
  | enum_overfit               | validator_widening       |
  | misclassification          | training_data_addition   |
  | prediction_confirmed       | N/A (no gap surfaced)    |
  | validator_widening         | validator_widening       |
  | unknown_no_fit             | taxonomy_addition        |
  | fallthrough                | fallback_adjustment      |

  ## Domain object: GapEntry

  One row in the ranked-gaps report.
  - `gap_id` (string) — SHA256 of (criterion, mechanism, sorted
    affected-column signature). Reproducible.
  - `criterion` (enum) — `non_trivial_floor` | `reject_rate_ceil`.
  - `mechanism` (enum) — one of the 10 closed tokens.
  - `affected_column_count` (int) — distinct (file_path, column_name)
    pairs in the measure-half corpus.
  - `corroborating_lenses` (list, exactly 2 entries — `ydf` and
    `cascade` — since the AND filter requires both) —
    `{lens_name, prediction_or_annotation, confidence}`. DBpedia is
    NOT a corroboration lens per design revision 2026-05-21.
  - `sample_evidence` (list, ≥3 entries) — `{file_path, column_name,
    sample_values, sense_prediction, ydf_prediction,
    dbpedia_annotation_if_present}`.
  - `recommended_action_class` (enum) — derived from the mechanism per
    the table above.
  - `candidate_spec_slug` (string, may be empty).
  - `rank_within_cell` (int) — `ORDER BY affected_column_count DESC,
    gap_id ASC`.

  ## Evaluation principles

  - **Lens independence (40%)** — YDF's feature scope must exclude ≥1
    of Sense's five branches entirely AND use ≥1 feature category not
    in any Sense branch (ac-03 verifies). Corroboration validity rests
    on this.
  - **Mechanism vocabulary preservation (20%)** — closed 10-token set;
    no new tokens without a MADR.
  - **Reproducibility (20%)** — verified by ac-13.
  - **Action density (20%)** — top-N gaps ranked by
    `affected_column_count` desc, ties by `gap_id` lexicographic.
    `candidate_spec_slug` is advisory only — it does NOT affect
    ranking. Empty for the first pass; populated by the attestor
    during ac-12 spot-check for gaps that warrant a concrete
    follow-up spec name.

  ## Exit conditions

  - ac-01 disposition MADR `0087-gittables-diagnostic-absorbs-m19.yaml`
    accepted; references inserted into m-19's spec, MADR 0066, MADRs
    0083–0086.
  - ac-02 overlap spike has run; design_path recorded as an audit-trail
    artefact (per design revision 2026-05-21, ac-09 no longer consumes
    `design_path` — DBpedia is dropped from corroboration in both
    modes; only the Part-2 taxonomy-gap section of `report.md`
    consumes the annotations).
  - ac-03 through ac-13 pass per their verification clauses.
  - `report.md` shipped with every non-empty (criterion × mechanism) cell
    populated; empty cells explicitly noted.
  - Spot-check (ac-12) passes per-cell threshold.
  - Reproducibility check (ac-13) passes.
  - `progress.md` handover names: which downstream specs are queued for
    surfaced top-N gaps; which gaps were rejected and why; which
    open questions from `interview.md` remain unresolved (and where they
    land).

  ## Test prefix

  `gmld` — short label disambiguating ACs across specs (per the
  ac-taxonomy convention).
