id: 2026-06-19-plain-text-type-discovery
goal: |
  Find the real, nameable types hiding inside representation.text.plain_text
  (FineType's 447,422-column residual bucket), rank candidates by how common
  they are (distinct-dataset breadth) times how confidently a blind expert
  panel can name them, and build only those clearing a volume bar.

  ## Outcome

  Three types clear the bar and are built (definitions + generators authored
  and precision-validated), staged for the next taxonomy-expansion retrain:

  | type | distinct datasets | panel conf | score |
  |---|---|---|---|
  | representation.file.windows_path   | 7,651 | 0.97 | 7,421 |
  | technology.internet.message_id     | 3,032 | 0.95 | 2,880 |
  | technology.code.qualified_name     | 1,677 | 0.79 | 1,325 |

  Five candidates were rejected and why matters as much as the wins:
  numeric_range / quantity+unit / snake-token-soup each cleared the volume
  bar on raw count but all three blind panellists independently flagged them
  "mixed" — not a single type, so unwriteable as a precise validation.
  unix/url-path and pos_tagged were clean-and-nameable but fell below the
  >=1,000-distinct-dataset volume bar.

  ## Why staged, not live

  The label space is locked at 240 across the taxonomy, the
  label_category_map, and the trained model's valid_dim; precise_audit
  enforces taxonomy ~ model within +/-1. A new type becomes predictable only
  after a retrain (240 -> 243) through the full promotion gate stack. This
  spec hands that retrain three pre-validated targets.

  Substrate: discovery_report.md (headline + method),
  staged_definitions.yaml (3 blocks + count-bump checklist),
  staged_generators.rs.txt (3 generator arms, alignment-verified).
cards:
