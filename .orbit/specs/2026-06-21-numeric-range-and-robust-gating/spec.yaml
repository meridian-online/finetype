acceptance_criteria:
- id: ac-00
  description: |
    GATE-ZERO PRE-CHECK (cheapest, can redirect the spec). Does the Sharpen layer
    ALREADY heal the standalone latitude/postcode regressions? Determine whether the
    coordinate / postal / amount Sharpen rules (coord-promote-guard, postal header-
    veto, amount-veto) would correct the two-view seed-42 columns that regressed
    (latitude -0.30, postcode -0.40). DELIVERABLE: a memo listing, per regressed
    column, whether a Sharpen rule fires. DECISION: if composition recovers the bulk,
    the numeric-range view (ac-01) drops to secondary and the spec narrows to gating
    robustness (ac-02) + the static path (ac-03); else ac-01 proceeds at full weight.
  ac_type: code
  gate: true
  checked: false
- id: ac-01
  description: |
    NUMERIC-RANGE REPRESENTATION (weight set by ac-00). Build the format view as
    numeric-range FEATURES — value magnitude (order-of-magnitude / range buckets),
    length & digit-count distribution, charset signature — going beyond what the 27-dim
    stats branch encodes (which evidently does NOT separate latitude from year). NOT a
    semantic encoder. DELIVERABLE: the range-feature extractor + its format-versioned
    FTMB slot, with a held-out probe showing it separates latitude / longitude / year /
    postcode where both gte views collapse them.
  ac_type: code
  gate: true
  checked: false
- id: ac-02
  description: |
    ROBUST GATING (the other half of the two-view problem). Replace the soft-MLP view
    combination with reliable gating: an EXPLICIT learned gate over the embed views per
    column, or (cheaper, first) seed-ensembled logits. ACCEPTANCE: >=2/3 seeds clear
    the 0.532 floor by >CI (two-view was 1/3). DELIVERABLE: the gating mechanism + a
    3-seed standalone-gold spread showing materially reduced variance vs two-view's
    0.524-0.571.
  ac_type: code
  gate: true
  checked: false
- id: ac-03
  description: |
    STATIC-BY-DESIGN SPEED STRATEGY. Implement the embed branch as semantic-view-
    distilled-to-static (Model2Vec-style) + format-view-as-static-range-features.
    CONFIRM no candle transformer is needed at inference (the branch runs in the normal
    profile path) OR justify a transformer exception against the ~10ms/col budget.
    DELIVERABLE: a static inference path; latency measured; the former candle-gte-in-
    binary confirmed unnecessary (which makes ac-05's composed gate free).
  ac_type: code
  gate: true
  checked: false
- id: ac-04
  description: |
    OFFLINE ACCURACY GATE (standalone gold, blocking). Score the model via
    predict_multibranch vs the floor (0.532) and two-view best (0.571). REQUIRE
    >=2/3 seeds beat the floor by >CI AND the latitude/postcode regressions recovered
    vs two-view (the ac-01 target — verify per-family). Extend build_gold_ftmb for the
    new range features. GO -> compose (ac-05); NO-GO -> the range features / gating did
    not transfer; fall back to the narrow escalation.
  ac_type: observation
  gate: true
  checked: false
- id: ac-05
  description: |
    COMPOSED GATE + CORPUS RELOCATION + SWAP. Because the path is static (ac-03), the
    model runs in the normal Sense->Sharpen pipeline, so the COMPOSED gold number is
    free (no candle build). Score composed gold vs v19 0.798 and representative vs
    0.691; run the corpus-relocation gate (H05, blocking; the only relocation detector).
    REQUIRE improve-or-hold on the blocking gates. GO -> swap models/default, version
    bump, CHANGELOG, count surfaces; NO-GO -> documented fallback to the escalation.
  ac_type: observation
  gate: true
  checked: false
