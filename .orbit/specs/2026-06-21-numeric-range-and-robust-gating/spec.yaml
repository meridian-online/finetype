id: 2026-06-21-numeric-range-and-robust-gating
goal: |
  Close the two gaps the two-view overnight exposed — numeric-range types and seed-
  fragile gating — and lock in a STATIC-BY-DESIGN path so inference speed never
  becomes the blocker (and the expensive candle-gte-in-binary is never needed).

  ## Where we are (the two-view result, 2026-06-21)
  Two-view embed (frozen gte-tiny ++ fine-tuned gte-small = 3072) was a QUALIFIED GO:
  best seed 0.571 standalone gold (+0.039 over the 0.532 frozen floor, 65% of the way
  to the 0.599 oracle ceiling), clearly beating the wholesale swap (0.518 = floor).
  The gating MECHANISM is confirmed — seed 42 demonstrably uses both views: recovered
  numeric +0.48, utc +0.40, longitude +0.17 (format) WHILE keeping currency +0.39,
  codes +0.13, url +0.13 (semantic). Two gaps block a ship:
    1. SEED-FRAGILE — only 1/3 seeds clears the floor (spread 0.524-0.571). A soft
       3072->300 MLP can learn the gating but does not do so reliably.
    2. NUMERIC-RANGE STILL REGRESSES even in seed 42 — postcode -0.40, latitude -0.30.
       Neither gte view helps: both are SEMANTIC encoders that collapse magnitude
       ("is this a latitude or a year" is a range question; the strings look identical).
  Substrate: output/gte-tiny-embed-swap/twoview_result.md; models/gte-twoview-s{42,43,44};
  the floor model gte-floor-s42; the validated offline scorers predict_multibranch +
  build_gold_ftmb (predict reproduced 0.9497 on the floor's own training FTMB).

  ## The reframe (settled in design, 2026-06-21)
  The "format-aware encoder" is the wrong target. The remaining headroom is a numeric-
  RANGE representation, and the evidence says it is likely FEATURES (value magnitude /
  length / charset), not a neural encoder — which is also inherently static and fast.
  Static distillation splits the two views cleanly:
    - semantic view -> distils to a static lookup (meaning survives token-averaging,
      exactly what Model2Vec does) -> Model2Vec-speed, no transformer.
    - format view  -> does NOT distil (magnitude lives in how the transformer combines
      digit tokens) -> so it must be range FEATURES, static by construction.
  Target: semantic view = learned encoder distilled to static, format view = numeric-
  range features. BOTH static -> the embed branch runs in the normal profile path like
  today's Model2Vec, so COMPOSITION IS FREE and the candle-gte-in-binary is unnecessary.

  ## Pillar defence
  Pillar 4 (long-running R&D) + the Precision Principle: the numeric-range boundary
  (latitude/longitude/year/postcode) is exactly where "is this type" vs "is not" has
  been clawed back one Sharpen rule at a time; a representation that separates it is
  the path to accuracy, not relaxing heuristics.

  ## Risk
  Same flat-softmax destination-drift risk as every full retrain (0-for-6 on untargeted
  boundaries); cleared by the same blocking gates (gold standalone + composed + corpus-
  relocation H05). The validated narrow escalation (+1.1/flat) remains the fallback.
