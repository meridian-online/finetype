id: 2026-04-09-online-training
goal: |
  Establish an autonomous experiment loop (autoresearch) that runs overnight on RunPod GPUs, exploring model architecture, hyperparameters, and data strategies to close the 155/190 → 170+/190 profile eval accuracy gap for FineType's multi-branch semantic type classifier. Research in PyTorch; port winning architecture to Candle for release.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Generate synthetic training data using finetype generate (NDJSON output with {text, classification} per value). Run for all 239 taxonomy types with configurable samples-per-type (default 5000). prepare.py on the pod assembles value-level NDJSON into column-level training records by sampling N values per type to form synthetic columns.
  gate: false
  checked: false
- id: ac-02
  description: |
    Synthetic dataset is uploaded to HuggingFace as meridian-online/finetype-synthetic and is publicly accessible.
  gate: false
  checked: false
- id: ac-03
  description: |
    prepare.py extracts features by calling the finetype binary (downloaded from GitHub releases: finetype-v0.6.12-x86_64-unknown-linux-gnu.tar.gz) as a subprocess, matching the existing prepare_multibranch_data.py pattern. Produces FTMB v3 feature vectors: char distribution (960-dim), embedding aggregation (512-dim), column statistics (27-dim), header embedding (128-dim). Total: 1627-dim per column sample. The finetype binary is downloaded once to the network volume on first pod setup.
  gate: false
  checked: false
- id: ac-04
  description: |
    prepare.py downloads and caches both datasets from HuggingFace (sherlock-annotated + finetype-synthetic), merges them into a single training set with configurable synthetic mix ratio, and produces train/val/test splits (80/10/10). Cached data reused across pod restarts via network volume. Label-to-index mapping is documented and consistent with the actual training class count (verify against Candle config).
  gate: false
  checked: false
- id: ac-05
  description: |
    prepare.py provides an evaluate_accuracy() function that computes val_accuracy (top-1) and val_loss on the held-out validation split. This is the fast-gate metric for the experiment loop.
  gate: false
  checked: false
- id: ac-06
  description: |
    train.py implements the multi-branch architecture in PyTorch matching the Candle version: char branch (960 → 300 → 300), embed branch (512 → 200 → 200), stats branch (27 → 128 → 64), header branch (128 → 128 → 64), merge trunk (concat → BatchNorm → 500 → 500), flat head (→ N classes, matching the label-to-index mapping from prepare.py). ReLU activations, configurable dropout.
  gate: false
  checked: false
- id: ac-07
  description: |
    train.py trains for a fixed 10-minute wall-clock time budget (excluding startup and compilation overhead). Training stops when the time budget is reached, regardless of epoch count. Experiment 0 (baseline) includes a calibration note: if a 30-min run produces >5% better val_accuracy, the time budget should be increased.
  gate: false
  checked: false
- id: ac-08
  description: |
    train.py prints a machine-readable summary block at the end of training matching the autoresearch format, with at minimum: val_accuracy, val_loss, training_seconds, total_seconds, peak_vram_mb, num_epochs, num_params_M.
  gate: false
  checked: false
- id: ac-09
  description: |
    program.md provides staged search instructions for the autoresearch agent: Phase 1 (experiments 1-15): known gaps (data mix, augmentation, LR, dropout). Phase 2 (16-30): architecture (branch dims, merge strategy, loss functions). Phase 3 (31+): radical (attention, contrastive, novel). Includes FineType-specific context: taxonomy structure, known accuracy gaps (numeric_code FP, entity confusion, date ambiguity), evidence from prior training runs. Specifies context-lean practices: redirect all training output to run.log, read only via grep, never cat full logs. Describes how to reconstruct state from results.tsv + git log if the session restarts.
  gate: false
  checked: false
  ac_type: doc
- id: ac-10
  description: |
    prepare.py provides a profile_eval() function that loads the 29 eval datasets from eval/datasets/csv/ (git-tracked, available on the pod via the repo clone) and manifest (eval/datasets/manifest.csv), runs PyTorch model inference on each column (extracting features via the finetype binary), and computes label accuracy and domain accuracy against ground truth. This is the confirmation-tier metric, run only on kept models.
  gate: false
  checked: false
- id: ac-11
  description: |
    A launch script (scripts/runpod_launch.sh) provisions a RunPod Community Cloud pod with an RTX 4090, a CUDA-compatible PyTorch base image, and an attached network volume for cached datasets and checkpoints. Selects region based on 4090 availability. Creates the network volume if it doesn't exist (in the same region as the pod). The pod includes a self-destruct timer: a background process launched at pod start that terminates the pod after a configurable maximum runtime (default: 10 hours). This is a hardware-level failsafe independent of the agent, SSH, or budget guard. Implemented via the Docker command field: bash -c "nohup sh -c 'sleep 36000 && runpodctl stop pod $RUNPOD_POD_ID' &"
  gate: false
  checked: false
- id: ac-12
  description: |
    SSH access configured at pod creation: the Beelink's public key is pre-registered via runpodctl ssh add-key (one-time setup). After pod creation, the launch script parses SSH host and port from runpodctl ssh info <pod-id> and writes them to a local config file (e.g. .runpod_ssh.env with POD_HOST and POD_PORT). All subsequent SSH/rsync commands source this file. StrictHostKeyChecking=no for RunPod's proxy hosts.
  gate: false
  checked: false
- id: ac-13
  description: |
    Initial pod setup: the launch script clones the finetype repo on the pod (for eval datasets and manifest), downloads the finetype binary from GitHub releases to the network volume, and syncs the autoresearch files (train.py, prepare.py, program.md, pyproject.toml) from the Beelink. Subsequent experiment syncs only push changed files (train.py) via rsync.
  gate: false
  checked: false
- id: ac-14
  description: |
    Results sync from pod to Beelink via rsync: pulls run.log and any saved model checkpoints after each experiment. The agent reads metrics via grep on the local run.log copy.
  gate: false
  checked: false
- id: ac-15
  description: |
    Pod teardown: a shutdown script (scripts/runpod_stop.sh) syncs final results back, then terminates the pod via runpodctl pod stop. Network volume is preserved for future sessions.
  gate: false
  checked: false
- id: ac-16
  description: |
    Budget guard: a local file (budget.json) on the Beelink tracks cumulative GPU spend across pod lifetimes. Updated after each experiment by recording elapsed time * hourly rate (parsed from runpodctl pod get). The experiment loop halts if spend approaches the $40 cap (configurable threshold, default: $35 to leave headroom). Budget persists across preemption events.
  gate: false
  checked: false
- id: ac-17
  description: |
    Preemption handling: if SSH to the pod fails, the orchestration checks pod status via runpodctl pod get. If the pod is TERMINATED/EXITED (preempted), it logs the crashed experiment in results.tsv with status "crash", waits with configurable backoff, provisions a new pod (attached to the same network volume), and resumes the experiment loop from the last completed experiment. Lost mid-experiment training time is accepted (~$0.07 per preemption).
  gate: false
  checked: false
- id: ac-23
  description: |
    Beelink watchdog cron: a cron job on the Beelink runs every 30 minutes, calls runpodctl pod list, and checks for any pod running longer than a configurable maximum (default: 10 hours). If a zombie pod is detected, the watchdog terminates it via runpodctl pod stop and logs a warning. This is independent of the agent session — protects against agent crash, SSH failure, and budget guard failure. Installed by the launch script, removed by the shutdown script.
  gate: false
  checked: false
- id: ac-24
  description: |
    Four-layer zombie pod protection is verified end-to-end before any overnight run: (1) pod self-destruct timer baked into pod startup (ac-11), (2) agent-side budget guard halts loop at $35 (ac-16), (3) Beelink watchdog cron kills pods exceeding max runtime (ac-23), (4) RunPod account spend limit set to $80. At least two layers must be operational before starting an overnight session.
  gate: false
  checked: false
- id: ac-18
  description: |
    The experiment loop runs autonomously on the Beelink, driven by a Claude Code agent reading program.md. The agent: edits train.py locally → commits to the experiment branch → syncs to pod via rsync → runs training via ssh (uv run train.py > run.log 2>&1) → syncs run.log back → parses val_accuracy via grep → keeps or discards → logs to results.tsv → repeats. All training output redirected to files; agent reads only via grep/tail.
  gate: false
  checked: false
- id: ac-19
  description: |
    results.tsv tracks all experiments with tab-separated columns: commit, val_accuracy, val_loss, peak_vram_mb, status (keep/discard/crash), description. Commit is the short git hash of the train.py change. results.tsv is NOT committed to git (untracked), matching autoresearch convention.
  gate: false
  checked: false
- id: ac-20
  description: |
    Keep/discard logic: agent commits train.py before syncing to the pod (matching autoresearch pattern). If val_accuracy improves over the current best, the commit stays (kept). If val_accuracy is equal or worse, git reset --hard HEAD~1 reverts. Kept models trigger profile_eval() on the pod as a confirmation check. Profile eval result logged in results.tsv.
  gate: false
  checked: false
- id: ac-21
  description: |
    The baseline experiment (first run with unmodified train.py) establishes the starting val_accuracy and profile_eval score. Logged as the first row in results.tsv with status "keep" and description "baseline". Includes a calibration step: run baseline for 10 min and 30 min, compare val_accuracy to validate the time budget.
  gate: false
  checked: false
- id: ac-22
  description: |
    An overnight autoresearch session (8 hours) produces at least 30 experiments logged in results.tsv, with at least one model that improves over the baseline val_accuracy.
  gate: false
  checked: false
