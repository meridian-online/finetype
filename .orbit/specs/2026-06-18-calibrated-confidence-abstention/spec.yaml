id: 2026-06-18-calibrated-confidence-abstention
goal: Make FineType's per-column confidence an honest, calibrated data-quality signal — measure whether the shipped confidence tracks correctness, then (if viable) surface a calibrated confidence + honest abstention so an analyst can trust high-confidence types and scrutinise low-confidence ones, instead of receiving a bare guess with a heuristic number. Measure-first; ship only what calibration supports.
cards:
- 0020-honest-production-typing
status: open
labels:
- honest-typing
- confidence-calibration
- output-ux
acceptance_criteria:
- id: ac-00
  description: |
    MEASURE WHETHER CONFIDENCE IS CALIBRATED (observation, design-critical, BLOCKING).
    The shipped confidence is `majority_fraction` (branch agreement) + hardcoded rule values
    (0.85/0.9, column/mod.rs); hardcoded hints BYPASS the confidence gate (memory
    `header-hints-mixed-bulk-harm-loadbearing-spots`). Whether it tracks correctness is unknown
    and everything downstream rests on it. Capture per-column confidence (the gold predict
    harness currently writes it empty; the profile JSON carries it — extend the capture, do NOT
    change the model) for v19 on BOTH the gold and representative fixtures, scored --reframe, and
    build a RELIABILITY CURVE: bin predictions by emitted confidence, measure actual accuracy
    per bin. DELIVERABLE: the reliability curve (gold + repr) + three reads — (1) is confidence
    MONOTONIC with correctness (high-conf more accurate than low-conf)? (2) is it CALIBRATED
    (confidence ≈ accuracy) or just ranked? (3) where is the abstention knee — the confidence
    below which emitting a type is worse than emitting `unknown` (the precision floor an analyst
    would want). STATE THE LIMIT: hardcoded-hint and rule-override confidences are not
    model-probabilistic, so report whether they pollute the curve. If confidence is NOT even
    monotonic, that is a NO-GO finding for the whole spec — say so and stop.
  gate: true
  checked: true
  ac_type: observation
- id: ac-01
  description: |
    CALIBRATION MAP / ABSTENTION POLICY — design from ac-00 (doc, BLOCKING gate only if ac-00 GO).
    From the reliability curve, decide the minimal honest mechanism:
    (a) does confidence need a CALIBRATION MAP (isotonic/Platt fit on the curve) so the surfaced
        number means what it says, or is the raw rank sufficient for an abstention threshold?
    (b) the ABSTENTION POLICY: the confidence threshold below which the output surfaces a
        low-confidence signal (band, or `unknown`, or the runner-up — the determinability probe's
        "ship the runner-up, not 'not determinable'" recommendation, memory
        `determinability-probe-gold-is-the-ceiling`). Quantify the precision/recall trade at the
        chosen threshold on gold + repr.
    DELIVERABLE: the chosen mechanism + threshold + its measured precision/recall trade, framed
    so the author approves the analyst-facing behaviour before any code ships. NO model change —
    this is a presentation/abstention layer over the existing confidence, not a retrain.
  gate: true
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    SURFACE THE HONEST SIGNAL (code). Implement the ac-01 mechanism in the profile output:
    a calibrated confidence and/or a quality band (e.g. high/medium/low) and/or runner-up on
    low-confidence columns. Confidence already ships in json/csv/plain (profile.rs); extend it
    rather than reinvent. Behind a flag if it changes default output. RUN THE B07 CONSUMER-GRAPH
    AUDIT first (codegraph_impact on the ColProfile/output-schema path — json, csv, plain,
    profile_io, MCP, the DuckDB extension) so no downstream consumer breaks; H03 halt if a
    load-bearing edit is unaudited. DELIVERABLE: the implemented surfacing + green CI (fmt +
    clippy -D warnings + cargo test) + the consumer audit note.
  gate: false
  checked: false
- id: ac-03
  description: |
    PROVE IT HELPS THE ANALYST (observation, BLOCKING). The feature is only honest if
    high-confidence really is more correct than low-confidence on held-out data. On gold + repr,
    show: (1) precision in the top confidence band >> precision in the bottom band (the signal
    separates right from wrong); (2) the abstention threshold trades recall for precision as
    designed (how many wrong guesses become honest `unknown`/flagged, at what recall cost); (3)
    NO headline regression beyond the accepted trade. DELIVERABLE: the both-fixtures table +
    the verdict on whether the surfaced signal is trustworthy. STATE what is measured vs assumed;
    if the separation is weak, say the feature is cosmetic and recommend against shipping it on.
  gate: true
  checked: false
  ac_type: observation
