id: 2026-04-22-duckdb-extension-ergonomics
goal: 'Replace today''s CSV-emitting `finetype validate` with a DuckDB-native output pipeline. The CLI orchestrates validation through the existing `finetype-core` `table_validator` engine (extended with per-cell reject detail) and writes results directly into a DuckDB `.db` file: the user''s chosen table holds the clean rows, a sibling `finetype_reject_errors` table holds the rejects with an extended DuckDB-compatible shape. Analysts open the database and query both tables in-situ. The `.db` file replaces today''s CSV/JSONL sidecars.'
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: '`finetype_core::table_validator::TableValidationResult` gains two new fields (additive, non-breaking for the workspace since all consumers are in-repo): `valid_row_indices: Vec<usize>` carrying the 0-based indices of rows that passed every column''s validation, and `rejects: Vec<RejectRecord>` carrying per-cell failure detail. `RejectRecord` is a new struct in the same module with fields: `row_index: usize`, `column_index: usize`, `column_name: String`, `value: Option<String>`, `expected_type: Option<String>` (from `x-finetype-label`), `type_confidence: Option<f64>` (from `x-finetype-confidence`), `constraint_failed: String` (pattern|min_length|max_length|enum|type|required), `constraint_value: Option<String>`, `error_message: String`. All existing fields (`total_rows, valid_rows, invalid_rows, columns, grade, row_errors, missing_columns`) remain unchanged; the existing CLI validate path continues to work without modification.'
  gate: false
  checked: false
- id: ac-02
  description: 'The JSON Schema interpretation in `table_validator::validate_table` maps each jsonschema validator failure to a `RejectRecord` whose `constraint_failed` token is one of: `pattern`, `min_length`, `max_length`, `enum`, `type`, `required`. The `constraint_value` is populated with the pattern regex, the length limit as a string, the enum list as a JSON-array string, or the type name (matching the failing constraint). Unknown schema keywords fall through to `constraint_failed = "other"` with the raw validator message.'
  gate: false
  checked: false
- id: ac-03
  description: Validation is deterministic. Running `validate_table` twice on the same (headers, rows, schema) inputs produces byte-identical `TableValidationResult` outputs — same `valid_row_indices` order, same `rejects` order (sorted by row_index ascending, then column_index ascending), same field values throughout.
  gate: false
  checked: false
- id: ac-04
  description: 'Spike landing: `crates/finetype-duckdb/src/spike.rs` registers a trivial `finetype_spike(n BIGINT)` table function using duckdb-rs''s VTab trait. The spike file `.orbit/specs/2026-04-22-duckdb-extension-ergonomics/spike- duckdb-rs.md` records three findings with code references: (a) `vtab` is already active via `loadable-extension`''s transitive feature graph — no Cargo change required; (b) same-name scalar+table coexistence compiles in Rust and has DuckDB native precedent; (c) reading an existing DuckDB table by name from within a VTab is NOT supported in duckdb-rs 1.4.4''s safe API — `BindInfo` exposes no `Connection` / catalog / row-iteration primitives. Finding (c) ratifies rollback_plan Scenario A: no new DuckDB table function is registered in this spec. Cross- client research (see spike-duckdb-rs.md §Research) confirms this is a C++-only capability — the C API does not expose `ClientContext`, so no duckdb-rs upgrade is expected to unblock it without a C API extension.'
  gate: false
  checked: false
- id: ac-05
  description: Document the Scenario A pivot. No new DuckDB function is registered by this spec. The spike's probe-only `finetype_spike(n)` table function is retained in `crates/finetype-duckdb/src/spike.rs` as living evidence of the vtab feasibility boundary, with a module- level docstring naming MADR 0064 as the decision context. It is NOT re-exported for analyst use.
  gate: false
  checked: false
  ac_type: doc
- id: ac-06
  description: 'The CLI projects `TableValidationResult` into the output DuckDB `.db` via two INSERTs. Valid rows: CLI opens the `.db`, creates the user-named table with source-file schema (VARCHAR for all columns — CSV/Parquet load produces strings), inserts only the rows whose index appears in `valid_row_indices`. Rejects: CLI creates (or appends to) `finetype_reject_errors` with the RejectEntry ontology''s 13 columns, projects each `RejectRecord` into one row. `scan_id` and `file_id` are constants set by the CLI; `line` = `row_index + 1`; `column_idx` = `column_index`; `column_name` = `column_name`; `error_type` = literal `''SEMANTIC_TYPE''`; `csv_line` and `byte_position` = NULL. All remaining reject fields copy directly from `RejectRecord`.'
  gate: false
  checked: false
- id: ac-07
  description: The existing scalar `finetype_validate(value VARCHAR, schema_json VARCHAR)` in `crates/finetype-duckdb/src/validate.rs` is unchanged by this spec. Its behaviour ('valid' or error string per value) is preserved; no table function shares its name. This AC documents that preservation and its test coverage as part of the regression suite.
  gate: false
  checked: false
- id: ac-08
  description: 'Malformed JSON Schema surfaces as a clean CLI error with exit code 2 (see ac-10). The CLI''s schema-loading step validates that the file exists, parses as JSON, and has a `properties` object before any staging-table creation. Error messages are specific enough to diagnose: name the file path for missing-file, name the JSON parse position for invalid-JSON, name the missing required schema field for structural failures. No partial `.db` writes occur; if the schema load fails, no tables are created in the output `.db`.'
  gate: false
  checked: false
- id: ac-09
  description: 'The CLI command shape is: `finetype validate <input> <schema.json> --db <output.db> --table <name> [--append] [--lenient]`. Execution flow: (1) load and parse `<schema.json>`, fail-fast on malformed schema per ac-08; (2) open or create `<output.db>`; (3) read `<input>` (CSV or Parquet) into a staging table `__finetype_staging_<uuid>` via DuckDB''s `read_csv`/`read_parquet`; (4) extract headers + rows from the staging table into Rust Vecs; (5) call `finetype_core::table_validator::validate_table(headers, rows, schema)` to produce a `TableValidationResult`; (6) BEGIN TRANSACTION; (7) create the user''s `<name>` table (VARCHAR cols, names from headers); INSERT the rows indexed by `valid_row_indices`; (8) create `finetype_reject_errors` if absent (schema per RejectEntry ontology); INSERT each `RejectRecord` with the CLI-assigned `scan_id` and constant `file_id` = 0; (9) COMMIT; (10) drop the staging table (in a RAII-equivalent guard that runs on both success AND error paths). scan_id rules per constraint 8. `--append` reuses an existing `.db` and computes the next `scan_id` from `MAX(scan_id) + 1`; absence of `--append` on a `.db` that already contains the user''s `<name>` table is an error (exit 2).'
  gate: false
  checked: false
- id: ac-10
  description: 'CLI exit codes: `0` when zero rejects were produced and no error occurred; `1` when any rejects were produced (default CI-gate behaviour); `2` when an error occurred (bad schema, file unreadable, DuckDB error, staging collision without `--append`). A `--lenient` flag forces exit `0` regardless of reject count when no error occurred. Exit code `2` is not affected by `--lenient`.'
  gate: false
  checked: false
- id: ac-11
  description: The CLI accepts the JSON Schema format produced by the existing `finetype schema <file>` command without modification. Specifically, `x-finetype-confidence` and `x-finetype-label` at each column-property level are read by the CLI's schema-load step and surfaced via `RejectRecord.type_confidence` and `RejectRecord.expected_type` on rejects produced from that column. Schemas without these extensions validate correctly but produce NULL in the corresponding reject columns (graceful degradation). The extension reader uses `serde_json`'s `get("x-finetype-*")` pattern and tolerates absence.
  gate: false
  checked: false
- id: ac-12
  description: End-to-end test on the ecommerce_orders fixture documents the observable behaviour when the schema is itself wrong (the documented foot-gun). The reject sidecar populates with `type_confidence` and `expected_type` values that were recorded at schema-authoring time (i.e. copied from `x-finetype-confidence` / `x-finetype-label` in the schema JSON — NOT recomputed at validation). These authored-time values are what let the analyst distinguish "classifier was confidently wrong" from "data value is bad" using plain SQL. Validate remains deterministic and emits no warning/summary relation of its own.
  gate: false
  checked: false
- id: ac-13
  description: 'The following named scenario grid has at least one test function each; every test name is prefixed `vrp_acNN_*` (where NN is the primary AC it covers). All tests pass under `make ci`. Scenarios — core crate (7): `happy_all_valid`, `all_reject`, `partial_reject_mixed`, `multi_reject_per_row`, `empty_input`, `single_row_single_column`, `constraint_grid` (one sub-test per pattern/min_length/max_length/ enum/type/required). Scenarios — CLI (5): `cli_writes_db_with_sidecar`, `cli_staging_cleanup_on_success`, `cli_staging_cleanup_on_failure`, `cli_exit_code_grid` (sub-cases: zero-reject, non-zero-reject, error, lenient), `cli_malformed_schema_error_grid` (sub-cases: missing-file, invalid-json, missing-properties, permission-denied). Total: 12 named functions minimum (two with sub-cases). The previously-planned DuckDB-extension category is DROPPED per Scenario A ratification in ac-04.'
  gate: false
  checked: false
- id: ac-14
  description: 'Documentation updated: (a) card `.orbit/cards/0005-schema-driven- data-validation.yaml` has this spec appended to its `specs` array (already done in v1.0); (b) card `.orbit/cards/0007-duckdb- sql-extension.yaml` same (already done); (c) CLAUDE.md `validate` entry reflects the new CLI shape (`--db`, `--table`, `--append`, `--lenient`) and `.db` output replacing the CSV/JSONL sidecars; (d) README `validate` section shows the new command form and a DuckDB query example against the output `.db`; (e) new MADR `.orbit/choices/0064-validate-as-duckdb-reject-pipeline.md` records the structural change, names the Scenario A pivot with its duckdb-rs API-gap rationale, and is marked as refining decisions 0031 and 0032.'
  gate: false
  checked: false
  ac_type: doc
