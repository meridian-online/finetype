id: 2026-06-10-human-verified-gold-corpus
goal: 'A stratified, human-verified gold corpus (GitTables + external open datasets) becomes the canonical accuracy eval: per-type quotas derived from CI targets, agent pre-labelling with author adjudication of disagreements only, leakage-firewalled, and every existing instrument scored against it so redundant ones can retire.'
cards:
- 0019-human-verified-gold-corpus
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Sizing memo (output/gold-corpus/sizing_memo.md). Enumerates the contested-type set
    from the campaign record (latitude, longitude, url, utc_offset, country, city,
    region, categorical-boundary, plus the 0094 model-gap families: datetime, isbn,
    postal, amount) and derives per-type quotas from an explicit CI target (default:
    FP-rate/precision half-width <= 5pp per contested type, ~80-100 verified columns
    each) plus a proportional common-type backbone (integer, decimal, plain text,
    date). Hard constraint stated and respected: author adjudication budget <= ~350
    columns (~3 hours). External-source share ~30% per the discovery interview.
    Prior art honoured: inherits the gold-anchor independence contract (spec
    2026-06-05-gold-eval-anchor ac-01 — labels must not derive from YDF, Sense,
    or mining-factory sources), applies the choice-0055 realism pre-screen, and
    positions the corpus as the scaled successor to the anchor's 240 columns and
    choice 0057's deferred Phase C (~400-column target).
    GATE: author reviews quotas and budget before any build spend.
  gate: true
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    Candidate sample built per the approved quotas. GitTables share reuses the
    build_stratified_sample.py machinery (fixed file list, seed-reproducible);
    external share sourced from open datasets (data.gov / Kaggle-class). The
    fixture EXTENDS eval/gold/gold_eval_anchor.tsv's conventions — same key
    (file_content_sha256, column_name) and columns (family, curated_label,
    labeller, provenance) plus source/licence/stratum for the external share —
    so the existing 240 anchor rows fold in as the seed rather than a parallel
    fixture. Sanitised per the corpus-pass artefact discipline.
  gate: false
  checked: true
- id: ac-03
  description: |
    Agent pre-labelling: every candidate column labelled by >= 3 independent lenses
    (at minimum: value-validator lens, header-semantic lens, and one model-free
    heuristic or external-reference lens). Per-column agreement and confidence
    recorded. Output: a verified-by-consensus set plus a disagreement/low-confidence
    adjudication queue, with the queue size within the ac-01 budget.
  gate: false
  checked: false
- id: ac-04
  description: |
    Author adjudication pass complete: review tooling (extend
    scripts/rare_type_gold_review.py) presents the queue, captures verdicts, and
    persists them into the manifest as final labels. Folds in the open
    rare-type-scoreboard canonicalisation task (t-0001692818b74c8d50b76340) so the
    ~120-row scoreboard sample is adjudicated as part of the same pass.
  gate: false
  checked: false
  ac_type: ops
- id: ac-05
  description: |
    Leakage firewall: every gold source registered in eval/datasets/sources.yaml
    with role=gold; the row-hash leakage check (scripts/eval_leakage/) treats gold
    rows as forbidden in training data; CI or a make target enforces it.
  gate: false
  checked: false
- id: ac-06
  description: |
    Canonical scoreboard: EXTEND scripts/score_gold_anchor.py (its predict mode
    already runs the REAL Sense path — finetype profile, not infer --mode column —
    and its score mode is model-agnostic) to the full corpus fixture, adding
    per-type CIs and a single headline number. No parallel scorer. Baseline run
    on shipped v19 committed as output/gold-corpus/baseline_v19.md.
  gate: false
  checked: false
- id: ac-07
  description: |
    Instrument audit: gated-YDF oracle, rare-type scoreboard, corpus-honest-gate
    bands, and drift proxy each scored against gold on the overlapping columns;
    each instrument's false-alarm and miss rate published in
    output/gold-corpus/instrument_audit.md with a retire/keep/demote recommendation
    per instrument. Recommendations are advisory until the author accepts them.
    Constraint (memory latdec-corpus-fp-relocation): the corpus-honest gate is the
    only instrument that catches error RELOCATION (incl. the ydf-abstain bucket);
    its blocking NO-GO role (H05) cannot be retired unless the audit demonstrates
    gold detects relocation at least as well — column-intrinsic accuracy alone is
    not sufficient grounds.
  gate: false
  checked: false
  ac_type: observation
- id: ac-08
  description: |
    Promotion order and docs updated: a MADR choice records gold as the canonical
    accuracy eval and the new gate precedence; CLAUDE.md "Eval baseline" and
    "Current sprint" sections updated; demoted instruments documented with their
    measured error rates rather than deleted (deletion is downstream, gated on gold
    per card 0019 scenario 5).
  gate: false
  checked: false
  ac_type: doc
