goal: >
  Full audit of all Sharpen post-processing rules. Measure each rule's net impact
  on the 448-row eval manifest through both v16 and v19-relu. Remove net-negative
  rules. Ship rule removals alongside v19-relu-s42 model promotion. Amend MADR 0066
  to accept a tie (net_label_delta >= 0) when rule count decreases.

constraints:
  - "Full 448-row manifest for all measurements — no coverage_closure exclusion"
  - "Rules + model ship together in one PR"
  - "No Sharpen rule additions — only removals and narrowing"
  - "All three Sharpen subsystems in scope: feature_sharpen (F1-F6), value_sharpen (R rules + disambiguate_* functions), header hints (apply_header_sharpen)"
  - "v19-relu-s42 is the candidate model (best ReLU seed from overnight sweep)"
  - "Existing tests for removed rules are deleted — not left as dead code"
  - "Sharpen demotion guard (decision 0059) is audited but expected to be net-positive"

acceptance_criteria:
  - id: ac-01
    ac_type: code
    description: >
      Ablation script that measures each Sharpen rule's individual net impact.
      For each rule: disable it, run v19-relu through the pipeline, score against
      the full manifest, report (fixes, regressions, net_delta). Output a TSV
      summary sorted by net impact.
    verification: >
      Script produces diagnostics/sharpen_ablation.tsv with one row per rule,
      columns: rule_id, fixes, regressions, net_delta, affected_columns.
      Runs to completion without error.

  - id: ac-02
    ac_type: gate
    description: >
      Ablation results reviewed. Each rule categorised as KEEP (net-positive),
      REMOVE (net-negative or net-zero), or NARROW (net-positive but overly broad).
      Categorisation recorded in diagnostics/sharpen_audit_verdicts.tsv.
    verification: >
      Every F rule, R rule, disambiguate_* function, and header hint pathway has
      a verdict row. No rule is uncategorised.

  - id: ac-03
    ac_type: code
    description: >
      All REMOVE-verdict rules deleted from column.rs. Associated tests deleted.
      Code compiles (cargo check) and remaining tests pass (cargo test).
    verification: >
      cargo check succeeds. cargo test succeeds. Deleted rule count >= 0.
      If zero REMOVE candidates exist, AC-03 is satisfied vacuously — record
      in progress.md and proceed to AC-05.

  - id: ac-04
    ac_type: code
    description: >
      All NARROW-verdict rules edited to reduce their match scope. Existing tests
      updated to reflect narrowed conditions. If no rules receive a NARROW verdict,
      AC-04 is satisfied vacuously.
    verification: >
      cargo check succeeds. cargo test succeeds. Narrowed rules (if any) have
      updated doc comments explaining the change.

  - id: ac-05
    ac_type: doc
    description: >
      MADR 0069 recorded: amend MADR 0066 gate to accept net_label_delta >= 0
      when the change reduces Sharpen rule count (fewer rules + same accuracy =
      net maintainability improvement). Drafted BEFORE the gate evaluation in ac-06
      so the threshold is unambiguous.
    verification: >
      .orbit/choices/0069-*.md exists with status accepted, references 0066.

  - id: ac-06
    ac_type: gate
    description: >
      v19-relu-s42 + cleaned pipeline scored against full 448-row manifest.
      Profile eval result recorded. Gate check per amended MADR 0066 (ac-05):
      net_label_delta >= 0 vs v16 baseline (371/448). If rule cleanup recovers
      fewer than 6 labels, the amended gate (>= 0 with fewer rules) applies.
    verification: >
      diagnostics/v19_cleaned_profile_score.txt contains the score.
      Label count >= 365 (v19-relu-s42 raw score, tie under amended gate) OR
      label count >= 371 (v16 baseline, tie or better under original gate).
      Either threshold satisfies the amended gate when rule count decreases.

  - id: ac-07
    ac_type: code
    description: >
      v19-relu-s42 promoted as models/default. models/default symlink updated.
      FINETYPE_CI_MODEL updated in CI workflows. HuggingFace upload is a manual
      pre-requisite performed before PR merge (not gated by this AC but noted
      in implementation_notes).
    verification: >
      ls -la models/default points to sherlock-v19-relu-s42.
      grep FINETYPE_CI_MODEL .github/workflows/ci.yml shows sherlock-v19-relu-s42.

  - id: ac-08
    ac_type: doc
    description: >
      CLAUDE.md updated: current model version, rule count, profile eval score,
      architectural direction updated to reflect audit outcome.
    verification: >
      CLAUDE.md references sherlock-v19 as default model and updated rule counts.

implementation_notes:
  - "Ablation method: add a feature flag or env var per rule (e.g. FINETYPE_DISABLE_F1=1) that skips the rule body. Score with v19_compare.sh infrastructure."
  - "Alternative ablation method: simpler — comment out each rule one at a time, rebuild, score. More manual but avoids feature-flag plumbing for throwaway diagnostic."
  - "F rules are in feature_sharpen() at column.rs:2467. R rules are dispatched from value_sharpen() at column.rs:2572 to individual disambiguate_* functions."
  - "Header hints are in apply_header_sharpen() at column.rs:2147, calling into semantic.rs."
  - "The amount-variant 11-arm match block (column.rs:4303-4314) is a header hint — include in audit."
  - "16 regressions cluster: 7 coverage_closure, 3 datetime subtype, 3 cross-domain, 3 scientific/text."
  - "v19_compare.sh scoring is working — reuse for ablation measurements."
  - "Model promotion follows the 3-step flow: HuggingFace upload (manual, pre-merge), FINETYPE_CI_MODEL bump, models/default symlink flip."
  - "Individual ablation is for triage; ac-06 is the interaction-aware gate. If ac-06 fails after ac-03 removals, re-examine interaction effects between removed rules and consider restoring net-zero rules that interact positively."
  - "Not all 16 regressions may be rule-caused — some (especially coverage_closure) may be model-intrinsic. The amended gate (ac-05) accounts for partial recovery: fewer rules + same-or-better accuracy is the win condition, not full recovery of all 6 lost labels."
  - "If ablation reveals zero REMOVE candidates, the model may still be promotable under the amended gate at its raw score of 365/448. Decouple gate amendment from rule work if needed."

ontology_schema:
  name: "SharpenAblationResult"
  description: "Per-rule measurement from the ablation study"
  fields:
    - name: "rule_id"
      type: "string"
      description: "Rule identifier (F1, R12, disambiguate_slash_dates, header_hint_amount, etc.)"
    - name: "subsystem"
      type: "string"
      description: "feature_sharpen | value_sharpen | header_hint"
    - name: "fixes"
      type: "integer"
      description: "Columns that become correct when this rule is disabled"
    - name: "regressions"
      type: "integer"
      description: "Columns that become incorrect when this rule is disabled"
    - name: "net_delta"
      type: "integer"
      description: "fixes - regressions (positive = rule is harmful, should remove)"
    - name: "verdict"
      type: "string"
      description: "KEEP | REMOVE | NARROW"
    - name: "affected_columns"
      type: "string"
      description: "Comma-separated list of affected column names"

evaluation_principles:
  - principle: "Net impact on real eval data"
    weight: 0.5
  - principle: "Rule count reduction (fewer = better)"
    weight: 0.3
  - principle: "Future retrain compatibility (rules that fight model improvements are worse)"
    weight: 0.2

exit_conditions:
  - "All rules audited and categorised"
  - "v19-relu + cleaned pipeline passes amended MADR 0066 gate (net_label_delta >= 0 when rule count decreases)"
  - "PR created with rule removals + model promotion"

