id: 2026-04-24-remove-header-hints
goal: |
  Produce the removal roadmap for rule-based header-hint pathways (MADR 0042 execution). This spec is diagnostic-only: it enumerates every rule-based header-hint family in the codebase, measures how often each family fires on the full eval corpus (448 rows, 352 label-scored columns), measures what the multi-branch model predicts when each family is disabled, and classifies each family as model-covered (safe to remove) or model-gap (blocked on training-data fortification). Output: diagnostics/rhh_roadmap.tsv + methodology doc. No source-code removal. Subsequent per-domain specs consume this roadmap.
cards: []
status: closed
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Family inventory — enumerate every rule-based header-hint rule family in the codebase as a TSV at diagnostics/rhh_family_inventory.tsv. Columns: family_id (stable identifier matching the runtime disambiguation_rule tag, e.g. "header_hint_hardcoded", "header_hint_measurement", "sense_geo_hint_override", "substring_matcher_finance", plus "header_hint_table" for the top-level match at column.rs:3999), file, line_start, line_end, rule_family_class (one of: match_table, branch, substring, legacy_sense), domain (7-value enum OR "cross-domain" if the family covers multiple domains), type_targets (semicolon-separated taxonomy types), arm_count (number of distinct arms/call-sites within this family — for "header_hint_table" this is the ~185-line match arm count; for "substring_matcher_*" this is the h.contains count within the family's scope). Generated by scripts/rhh/ac01_inventory.py which grep-walks column.rs (and any other source files where header_hint_* tags are emitted).
  gate: false
  checked: false
- id: ac-02
  description: |
    Family-disablement instrumentation — add a runtime hook that reads env var RHH_DISABLE_HINTS (comma-separated family_ids) and causes matching families to early-return their hint-application step during inference. Implemented as ONE cfg-gated check per function entry point (apply_header_sharpen, header_hint, each sense_geo_* branch head, each substring_matcher_* branch head) — not per-arm. Feature flag `rhh-instrumentation` gates the entire hook; when off, the hook compiles to zero instructions. Covers every family_id from ac-01.
  gate: false
  checked: false
- id: ac-03
  description: |
    Per-family hit-count measurement — for every family_id in ac-01, measure how many of the 352 scored columns on the expanded eval manifest currently trigger that family. Uses the existing disambiguation_rule field emitted during inference, matched by prefix. Output diagnostics/rhh_hit_counts.tsv with columns: family_id, columns_hit, columns_correct (prediction matches GT), columns_wrong (prediction differs from GT), columns_unused (352 - hit). Generated by scripts/rhh/ac03_hit_counts.py which runs `finetype profile --verbose` once on the full manifest and parses disambiguation_rule prefixes across all 352 rows.
  gate: false
  checked: false
- id: ac-04
  description: |
    Per-family counterfactual prediction — for every family_id with columns_hit ≥ 1, measure what the model predicts on those columns when that family is disabled (via ac-02's instrumentation). Output diagnostics/rhh_counterfactual.tsv with columns: family_id, column_id (dataset::column_name), gt_label, baseline_prediction, no_hint_prediction, no_hint_domain_correct (bool), no_hint_label_correct (bool). One row per (family_id, column_hit) pair. Generated by scripts/rhh/ac04_counterfactual.py which loops over family_ids, sets RHH_DISABLE_HINTS, runs `finetype profile --verbose` on the family's hit columns, parses predictions, diffs against baseline.
  gate: false
  checked: false
- id: ac-05
  description: |
    Family classification — classify every family_id as "model-covered", "model-gap", or "no-hit". Rules: (a) no-hit: columns_hit == 0 on eval. Safe to remove with zero measured risk but unverifiable; flagged for next eval-corpus expansion. (b) model-covered: columns_hit ≥ 1 AND no_hint_label_correct ≥ 80% of columns_hit. Safe to remove. (c) model-gap: columns_hit ≥ 1 AND no_hint_label_correct < 80% of columns_hit. Remove blocked pending training-data fortification. Output diagnostics/rhh_classification.tsv with columns: family_id, classification, columns_hit, no_hint_label_accuracy (3 decimal places), notes. Generated by scripts/rhh/ac05_classify.py joining ac-03 + ac-04 outputs.
  gate: false
  checked: false
- id: ac-06
  description: |
    Domain-level rollup — aggregate classification counts per domain into diagnostics/rhh_domain_rollup.tsv. Columns: domain (7 rows — container, datetime, finance, geography, identity, representation, technology; plus one "cross-domain" row for families that span multiple domains), total_families, model_covered, model_gap, no_hit, removal_readiness. removal_readiness is "READY" if model_gap == 0, "NEEDS_FORTIFICATION" if model_gap > 0, "NO_EVIDENCE" if total_families == no_hit.
  gate: false
  checked: false
- id: ac-07
  description: |
    Roadmap synthesis — final artefact diagnostics/rhh_roadmap.tsv. One row per family_id, columns: family_id, file, line_start, line_end, domain, type_targets, classification, proposed_stage (domain name or "cross-domain-stage"), blocked_on (empty, "v19-retrain", or "training-data-fortification-<type-or-family>"), notes. proposed_stage defaults to the family's domain; cross-domain families get assigned to the last domain stage unless a more-specific driver is recorded. Families with classification == "model-gap" that target finance.currency.amount_* variants get blocked_on == "v19-retrain" (the 11 amount-variant arms shipped in MADR 0065). Other model-gap families get blocked_on == "training-data-fortification-<primary-target>", where primary-target is defined as the FIRST type in the family's type_targets field (semicolon-split[0]). For single-target families this is unambiguous; for multi-target families the first-listed type becomes the primary ticket, and secondary targets are recorded in the notes field.
  gate: false
  checked: false
- id: ac-08
  description: |
    Methodology doc at diagnostics/rhh_methodology.md documenting the 80% threshold rationale, counterfactual measurement approach, the single-cfg-gate instrumentation design, known limitations (sibling-context attention interaction NOT measured — see spec open question 4; per-arm granularity deferred; the 80% threshold is a policy choice not a statistical test), and reproducibility steps listing every script + invocation order.
  gate: false
  checked: false
  ac_type: doc
- id: ac-09
  description: |
    Reproducibility gate — from a clean checkout on the same machine, running `scripts/rhh/regenerate_all.sh` produces byte-identical output files for rhh_family_inventory.tsv, rhh_hit_counts.tsv, rhh_classification.tsv, rhh_domain_rollup.tsv, rhh_roadmap.tsv. rhh_counterfactual.tsv is permitted ≤0 rows of drift on the same machine and documented tolerance ≤1% cross-machine (not enforced by this spec — documented only).
  gate: false
  checked: false
- id: ac-10
  description: |
    Publication gate — the roadmap output is committed under diagnostics/rhh_*.tsv. PR description includes: (a) summary table of ac-06 domain rollup, (b) the proposed per-domain stage sequence from ac-07, (c) explicit list of model-gap families with blocked_on values, (d) pointer to rhh_methodology.md.
  gate: false
  checked: false
- id: ac-11
  description: |
    MADR 0042 status update — append an "Execution Log" section to .orbit/choices/0042-remove-regex-header-hints.md linking this spec and noting rhh_roadmap.tsv as the execution artefact. Do not change the decision's status field.
  gate: false
  checked: false
  ac_type: doc
