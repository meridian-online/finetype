id: 2026-06-19-gte-tiny-clean-slate-build
goal: |
  Build the clean-slate Sense stage (choice 0103): deterministic parsers +
  a fine-tuned gte-tiny backbone + a full-column stats head, retiring the v19
  five-branch multi-branch (and char-CNN / Model2Vec / header branches). Target:
  a model that BEATS v19 on gold (semantic headroom) and MATCHES it on the
  structural/easy label space, clearing the blocking truth gates first try.

  ## Why now
  Six additive flat-softmax retrains failed; the encoder discovery proved gte-tiny
  is backbone-grade (separability 0.87 vs 0.68; witness 165:4 on gold). The
  confidence-gated escalation proved the representation can lead (gold +1.1, repr
  flat) but a frozen-v19 floor is a ceiling. This builds the encoder as the
  backbone, not a patch.

  ## Expectation-setting
  The overnight cost is a 22M-param gte-tiny fine-tune (NOT a v19 retrain) plus a
  v19 sense_confidence inference pass for the corpus relocation gate. v19 is never
  retrained. The frozen-v19 escalation (output/gte-tiny-gated-escalation) is the
  validated FALLBACK if a blocking gate fails.
cards:
- 0002-semantic-type-detection
status: open
labels:
- architecture
- gte-tiny
- encoder
- clean-slate
acceptance_criteria:
- id: ac-01
  description: |
    TRAINING DATA — mine a clean, full-label-space training set on the POST-0102
    label space (categorical retired, residual = word/plain_text collapsed),
    leakage-firewalled against gold (the sha exclusion). Real mined corpus columns
    (header+values text) + clean vocab/distilled labels for the semantic types
    (entity from Wikidata/dbpedia, NOT shipped-model calls); residual rebalanced
    (~25%, the band that cleared word over-emission in June). DELIVERABLE: training
    TSV covering the full non-parseable label space, per-label coverage report,
    leakage-guard pass.
  ac_type: code
  gate: true
  checked: false
- id: ac-02
  description: |
    TRAIN the full-label gte-tiny backbone (v3 recipe: partial-unfreeze top-2
    layers, discriminative LR enc 2e-6 / head 1e-3, natural CE, grad-clip, warmup),
    saved checkpoint. This is the overnight train (22M encoder). DELIVERABLE: saved
    model + held-out accuracy by domain, with the STRUCTURAL/easy types matching
    v19 and the SEMANTIC types beating it (vs the linear-probe floor 0.72).
  ac_type: code
  gate: true
  checked: false
- id: ac-03
  description: |
    STATS HEAD — wire a full-column cardinality/sequence component over
    ColumnScanStats for the identifier types (alphanumeric_id, increment,
    numeric_code) that gte-tiny structurally cannot separate (probe: 0.42/0.43 from
    8 samples; full-column stats lifts these). Decide learned-head vs deterministic
    precedence rules (open question, choice 0103). DELIVERABLE: the identifier
    types resolved at parity-or-better vs v19, unit-tested.
  ac_type: code
  gate: true
  checked: false
- id: ac-04
  description: |
    COMPOSE the three-component Sense (parsers deterministic-first → stats head for
    identifier types → gte-tiny for the rest) with a defined precedence, and score
    on GOLD + REPRESENTATIVE (the blocking truth gates) across the FULL label space
    — structural types included, not just contested. REQUIRE improve-or-hold on
    both vs v19 (gold 0.800 / repr 0.691). DELIVERABLE: gold + representative
    headline vs v19, full per-domain breakdown.
  ac_type: observation
  gate: true
  checked: false
- id: ac-05
  description: |
    CORPUS RELOCATION GATE — persist v19 sense_confidence via a corpus inference
    pass (the genuinely long step; currently NULL in v19_gated.parquet), then run
    the corpus over-emission / relocation check on the clean-slate model's own
    predictions (target word ratio ~1.0; the June head over-emitted residual
    1.65-2.08x — output/gte-tiny-gated-escalation/corpus_overemit_check.py). A wild
    over-emission is a blocking flag. DELIVERABLE: per-label corpus marginal
    before/after, no uncontained over-emission.
  ac_type: observation
  gate: true
  checked: false
- id: ac-06
  description: |
    RUST/CANDLE INTEGRATION — embed the fine-tuned gte-tiny (candle, like the 3
    models already embedded), wire the three-component Sense, B07 consumer-graph
    audit, green CI (fmt, clippy -D warnings, cargo test), latency within budget
    (candle spike proved gte-tiny viable). On a clean GO, swap models/default and
    RETIRE v19 + char-CNN + Model2Vec branches. DELIVERABLE: integrated binary,
    green CI, swap + retirement, or documented fallback to the escalation (Option A).
  ac_type: code
  gate: true
  checked: false
