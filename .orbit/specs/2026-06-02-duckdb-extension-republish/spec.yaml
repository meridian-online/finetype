id: 2026-06-02-duckdb-extension-republish
goal: |
  Restore `INSTALL finetype FROM community; LOAD finetype;` to working order on
  current DuckDB by consolidating the DuckDB extension in-tree and repointing
  the community-extensions registry — i.e. execute the migration that
  choice 0063 decided (Option B) but never carried out.

  ## Why now

  The community install is broken, not merely stale. On 2026-06-02 a user on
  DuckDB v1.5.3 hit `HTTP 404` for
  `community-extensions.duckdb.org/v1.5.3/osx_arm64/finetype.duckdb_extension.gz`.
  Probing the registry: artifacts exist for v1.5.0 and v1.5.1, but 404 for
  v1.5.2 and v1.5.3. So every new DuckDB user who follows the README/website
  one-liner gets a broken install. The DuckDB extension is a load-bearing
  distribution channel (card 0007) — the only one-line install path for DuckDB
  users — so this blocks the extension's public story even though it does not
  block the CLI binary release.

  ## Root cause (a version-pin lag, not a code bug)

  community-extensions rebuilds every registered extension against each new
  DuckDB release. The registered source `meridian-online/duckdb-finetype`
  (ref 2b45744, registry version 0.2.0) pins the DuckDB Rust crate to
  `=1.10500.0` — DuckDB 1.5.0 exactly. When DuckDB shipped 1.5.2/1.5.3 the
  exact-pinned rebuild produced no matching artifact, so publishing stopped.
  Nobody has bumped the pin since the standalone repo's last commit
  (2026-03-17). Compounding it: the in-tree crate `crates/finetype-duckdb`
  is pinned even older (`duckdb = "=1.4.4"`, DuckDB 1.4.x), so repointing the
  registry at it as-is would build *backwards*. And the registry's
  `extended_description` still advertises the abandoned architecture
  ("tiered CharCNN, 34 CNNs, 250 types") — none of which is true of the
  current multi-branch sherlock model (240 types, single forward pass).

  ## Sequence (the registry PR is the LAST step, not the first)

  A registry PR submitted before the source builds would just fail community
  CI. Order of operations:

    1. Pick the source — already decided in choice 0063: the in-tree crate.
    2. Bump the DuckDB Rust crate to the line tracking current DuckDB and fix
       any 1.4→1.5 API breakage; prove the extension builds.
    3. Prove the built artifact loads and its functions work on current DuckDB.
    4. Vendor the community build scaffolding in-tree (extension-ci-tools,
       configure/, Makefile) + CI so a tagged ref is buildable by community CI.
    5. Tag a ref (align with the next CLI release tag).
    6. Submit the community-extensions PR (repoint + version bump + rewrite
       extended_description).
    7. After merge + one green rebuild, archive the standalone and revert the
       "being republished" doc notes.

  ## Release-cut question (answered, for the record)

  No full product release is required to fix the community channel. The
  community build pulls SOURCE from a git ref — it does not consume the GitHub
  binaries, Homebrew, or crates.io. It needs only a git tag/commit containing
  the fixed extension + scaffolding, plus a `version:` bump in the registry
  `description.yml`. Practically, align the tag with the next CLI release so
  the extension version tracks the CLI version.

  ## Pin-strategy decision required (ac-01)

  An exact `=` pin guarantees another 404 on the next DuckDB patch. The spec
  must decide: loosen to a compatible range, or accept a bump-and-re-PR each
  DuckDB release. This ongoing maintenance tax is the real cost of keeping the
  community channel, and is worth weighing against choice 0063 Option A
  (deregister; rely on Homebrew + cargo install).

  ## Out of scope

  - The CLI binary public release (does not depend on this; ships with the
    honest "being republished" docs already in place).
  - Any Sense/model retrain or taxonomy change.
  - WASM / musl platform support (already excluded in the registry).

  ## Decisions

  Implements choice 0063 (Consolidate DuckDB Extension In-Tree, Repoint
  Community-Extensions Registry — accepted). ac-01 may amend 0063 or add a new
  choice recording the pin strategy.

cards:
