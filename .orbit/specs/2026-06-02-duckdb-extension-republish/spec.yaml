acceptance_criteria:
- id: ac-01
  description: |
    Pin strategy decided and recorded. Write a short decision (amend
    choice 0063 or add a new choice) settling whether the in-tree extension
    pins `duckdb`/`libduckdb-sys` to an exact DuckDB version (and accepts a
    bump-and-re-PR per DuckDB release) or to a compatible range. Name the
    maintenance commitment either choice implies, and confirm Option B
    (consolidate) still beats Option A (deregister) given that cost.
  gate: false
  checked: false
  ac_type: doc
- id: ac-02
  description: |
    DuckDB crate bumped and the in-tree extension builds against current
    DuckDB. Update the workspace `duckdb` + `libduckdb-sys` pins (currently
    `=1.4.4`) to the duckdb-rs release tracking the target DuckDB version
    (current DuckDB is 1.5.3; the standalone tracked 1.5.0 via `=1.10500.0`),
    per the ac-01 strategy. Fix any 1.4→1.5 Rust API breakage in
    `crates/finetype-duckdb/src/`. `cargo build -p finetype_duckdb --release`
    succeeds.
  gate: false
  checked: false
  ac_type: code
- id: ac-03
  description: |
    Built artifact loads and functions work on current DuckDB. `make
    build-release` produces `finetype_duckdb.duckdb_extension`; loaded unsigned
    in a current DuckDB (v1.5.3), each scalar function returns correct results:
    finetype(), finetype_detail(), finetype_cast(), finetype_unpack(),
    finetype_validate(). Capture a transcript.
  gate: false
  checked: false
  ac_type: code
- id: ac-04
  description: |
    Community build scaffolding vendored in-tree (choice 0063 step 2). Add the
    `extension-ci-tools` submodule, `configure/`, and a Makefile target that
    builds a per-platform `.duckdb_extension` matching the community-extensions
    build contract, runnable from the workspace root. Document the build in
    docs/DEVELOPMENT.md.
  gate: false
  checked: false
  ac_type: config
- id: ac-05
  description: |
    CI produces the extension artifact. A GitHub Actions job in
    meridian-online/finetype builds the `.duckdb_extension` for the registry's
    target platforms (the registry excludes wasm_* and linux_amd64_musl), so a
    tagged ref is buildable by community-extensions CI without manual steps.
  gate: false
  checked: false
  ac_type: config
- id: ac-06
  description: |
    A buildable ref is tagged. Tag the commit that contains the bumped deps +
    scaffolding (align with the next CLI release tag where practical) so the
    registry `repo.ref` can point at a stable tag, not a floating commit.
  gate: false
  checked: false
  ac_type: ops
- id: ac-07
  description: |
    community-extensions PR raised. PR to duckdb/community-extensions updating
    extensions/finetype/description.yml: `repo.github` → meridian-online/finetype,
    `repo.ref` → the new tag, `version` bumped, and `extended_description`
    rewritten to the current architecture (multi-branch sherlock, single
    forward pass, 240 types — drop "tiered CharCNN / 34 CNNs / 250 types").
    Reply to the open issue #3 (DuckDB pin bump request from @rustyconover).
  gate: false
  checked: false
  ac_type: ops
- id: ac-08
  description: |
    Community install verified working. After the PR merges and the rebuild
    lands, `community-extensions.duckdb.org/v1.5.3/osx_arm64/finetype.duckdb_extension.gz`
    returns HTTP 200 and `INSTALL finetype FROM community; LOAD finetype;`
    succeeds on a clean DuckDB v1.5.3, with finetype('user@example.com')
    returning identity.person.email.
  gate: false
  checked: false
  ac_type: observation
- id: ac-09
  description: |
    Standalone repo retired. After one green community rebuild cycle, archive
    meridian-online/duckdb-finetype (close issue #3 with a pointer to the
    in-tree source).
  gate: false
  checked: false
  ac_type: ops
- id: ac-10
  description: |
    Docs reverted to the working install. Once ac-08 holds, restore the
    `INSTALL finetype FROM community;` instruction in README.md and the web
    repo (duckdb-extension.mdx, quick-start.mdx, parquet guide), removing the
    interim "being republished / build from source" notes.
  gate: false
  checked: false
  ac_type: doc
