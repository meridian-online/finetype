goal: >
  Add a 5th "validation" branch to the multi-branch model that provides
  JSON Schema pass rates per type as input features. For each column,
  validate sampled values against all 239 type schemas using CompiledValidator
  (which handles both pattern matching and numeric range checks) and feed the
  239-dim pass-rate vector into a new model branch. Retrain as v12,
  targeting 215/227 (95%) on the profile eval. This addresses the 26
  remaining model-level misclassifications that Sharpen tuning cannot
  reach (decision 0038 ceiling), and restores actionability from 96.7%
  as a side-effect (the drop was caused by mispredictions, not missing
  format_strings).

constraints:
  - "FTMB format bumps to v4 — additive header extension (30 bytes), backward-compatible readers for v1/v2/v3"
  - "Validation features are 239-dim (one pass rate per taxonomy type), pre-computed into FTMB v4"
  - "Validation uses CompiledValidator::is_valid() which already handles both string patterns and numeric range checks (latitude/longitude ranges already exist in taxonomy)"
  - "ISO 3166-1 alpha-2 enum (~249 officially-assigned codes) added to country_code validation"
  - "Multi-branch architecture gains a 5th branch: validation(239) -> Dense -> Dense -> merge"
  - "v11 model weights are NOT frozen — this is a full retrain"
  - "No existing Sharpen rules (F1-F6, R1-R24) are modified"
  - "No taxonomy types are added or removed — only country_code validation gains an enum field"
  - "Taxonomy size coupling: type-to-index mapping stored in model config for forward compatibility"
  - "Validators compiled once at model/taxonomy load time, reused across all columns (not per-column compilation)"

acceptance_criteria:
  # --- Taxonomy foundation ---
  - id: ac-01
    ac_type: code
    description: >
      Add ISO 3166-1 alpha-2 enum to geography.location.country_code
      validation in definitions_geography.yaml. The enum field contains
      all ~249 officially-assigned 2-letter codes (US, FR, JP, ...).
      Existing pattern (^[A-Z]{2}$) is retained alongside the enum.
      Source: ISO 3166-1 alpha-2 standard. User-assigned codes (AA, QM-QZ,
      XA-XZ, ZZ) are excluded unless officially assigned.
    verification: >
      Unit test: validate "US", "AU", "JP" pass; "QQ", "A1", "usa" fail.
      finetype schema geography.location.country_code --stdout includes
      enum array with ~249 entries.

  # --- Validation feature extraction ---
  - id: ac-02
    ac_type: code
    description: >
      Implement extract_validation_features() in finetype-model that takes
      a slice of string values and returns a 239-dim f32 vector. For each
      type in the taxonomy (sorted by key), compute the fraction of sampled
      values that pass that type's CompiledValidator::is_valid() check.
      CompiledValidator already handles both string pattern validation AND
      numeric range checks (e.g., latitude -90/+90, longitude -180/+180
      are already defined in the taxonomy). No new range-check code is needed.
      Validators are compiled once from the taxonomy at startup and held in
      memory for reuse across all columns.
    verification: >
      Unit test: a column of ["US", "FR", "JP"] produces ~1.0 pass rate
      for country_code (with enum) and ~0.0 for email, url, etc.
      Unit test: ["40.7", "-33.8", "91.5"] against latitude yields
      pass_rate = 2/3 (91.5 out of range); against decimal_number
      yields 3/3 (no range constraint).
      Benchmark: 100 values x 239 types completes in <50ms on a single core.

  # --- FTMB v4 format ---
  - id: ac-03
    ac_type: code
    description: >
      Define FTMB v4 binary format in finetype-train. Header layout (30 bytes):

        Offset  Size  Field
        0       4B    magic ("FTMB")
        4       4B    version (4, little-endian u32)
        8       8B    n_records (little-endian u64)
        16      2B    char_dim (little-endian u16)
        18      2B    embed_dim (little-endian u16)
        20      2B    stats_dim (little-endian u16)
        22      2B    header_dim (little-endian u16)
        24      2B    n_groups (little-endian u16)
        26      2B    reserved (0x0000)
        28      2B    valid_dim (little-endian u16)

      Each record appends valid_dim x f32 validation features after
      header_features. Writer function write_ftmb_v4() serialises
      records with all 5 feature vectors.
    verification: >
      Round-trip test: write 10 records with known validation features,
      read back, verify exact f32 equality. File magic is FTMB, version 4,
      header is exactly 30 bytes.

  - id: ac-04
    ac_type: code
    description: >
      FTMB v4 reader is backward-compatible with v1/v2/v3 files. When
      reading v1-v3 files, validation features default to a zero vector
      of valid_dim length. Reader detects version from header and adapts.
      v3 readers encountering v4 files reject with a clear version error
      (existing behaviour: "Unsupported FTMB version: 4").
    verification: >
      Test: read v1 FTMB with v4 reader — char/embed/stats correct,
      header and validation features are zero vectors.
      Test: read v2 FTMB with v4 reader — char/embed/stats/header correct,
      validation features are zero vectors.
      Test: read v3 FTMB with v4 reader — all original features correct,
      validation features are zero vectors.
      Document: v4 files are forward-incompatible with v3 readers (expected).

  # --- Multi-branch architecture ---
  - id: ac-05
    ac_type: code
    description: >
      Add 5th validation branch to MultiBranchModel in finetype-model.
      Architecture: validation(239) -> Dense(128, Act) -> Dense(64, Act) -> [64].
      No input LayerNorm — pass rates are already bounded [0, 1] and
      well-conditioned. Merge layer concatenates all 5 branch outputs:
      [300+200+64+64+64] = [692]. Branch is gated on valid_dim > 0 in
      config (same pattern as header branch).
    verification: >
      Unit test: construct model with valid_dim=239, forward pass succeeds,
      output shape matches n_classes. Construct with valid_dim=0, model works
      without validation branch (backward compat).

  - id: ac-06
    ac_type: code
    description: >
      Store type-to-index mapping in the model config (config.json in model
      directory). The mapping is a sorted list of type keys used at training
      time. At inference time, the current taxonomy keys are mapped to
      training-time indices. Types added after training get index -1 (ignored).
      Types removed after training get a zero pass rate. This decouples
      the validation branch from exact taxonomy size — future taxonomy
      changes do not require immediate retraining (though retraining is
      recommended to benefit from new types).
    verification: >
      Unit test: construct mapping with ["a", "b", "c"]; look up "b" -> 1;
      look up "d" (missing) -> None. Integration test: model trained on
      239 types loads correctly when taxonomy has 240 types (one extra
      type produces zero in its dimension).

  - id: ac-07
    ac_type: code
    description: >
      Inference pipeline (classify_column in column.rs) computes validation
      features at inference time. Validators are compiled once at model load
      (or first use) from the taxonomy and held in memory. Per-column cost
      is validation only (100 values x 239 is_valid calls), not compilation.
      When validation branch is absent (v11 model, valid_dim=0), skip
      validation computation entirely.
    verification: >
      Integration test: classify_column with v12 model uses validation
      features and produces correct results. classify_column with v11
      model (no validation branch) produces identical results to before.
      Benchmark: per-column validation feature extraction < 50ms.

  - id: ac-08
    ac_type: code
    description: >
      DuckDB extension can compute validation features at inference time.
      The taxonomy definitions needed for CompiledValidator are available
      to the extension — either bundled in the model directory (e.g.,
      models/sherlock-v12/taxonomy.bin or compiled_validators.bin) or
      loaded from the embedded taxonomy. The extension's existing
      SCHEMA_CACHE pattern informs the caching strategy.
    verification: >
      DuckDB extension loads v12 model and computes finetype('column_value')
      correctly. No additional file downloads beyond the model are required
      at runtime.

  # --- Training data generation ---
  - id: ac-09
    ac_type: code
    description: >
      The extract-features CLI command gains validation feature output.
      When invoked with a column of values, it computes validation features
      alongside char/embed/stats/header features and includes them in its
      JSON output. prepare_multibranch_data.py passes --format v4 to write
      FTMB v4 files. The Python script is a build-time tool (not runtime)
      — it orchestrates feature extraction by shelling out to the Rust CLI.
    verification: >
      Generate a small FTMB v4 file (~100 records), read it back, verify
      validation features are non-zero for at least some types per record.
      extract-features JSON output includes a "validation" key with 239 floats.

  # --- Training and evaluation ---
  - id: ac-10
    ac_type: code
    description: >
      Train v12 model on FTMB v4 data with 5-branch architecture.
      Training loop reads validation features from FTMB v4 and feeds
      them to the validation branch. Hyperparameters: same as v11
      baseline except validation branch hidden dims [128, 64].
    verification: >
      Training completes without error. results.json contains epoch
      metrics with improving val_accuracy. Model checkpoint saved
      to models/sherlock-v12/.

  - id: ac-11
    ac_type: gate
    description: >
      Profile eval achieves >= 215/227 (95% label accuracy) on the
      35-dataset eval suite with sherlock-v12 + Sharpen.
    verification: >
      make eval-report with FINETYPE_MODEL_DIR=models/sherlock-v12
      shows >= 215/227.

  - id: ac-12
    ac_type: gate
    description: >
      No regression on previously-correct columns. Every column that
      v11+Sharpen classified correctly (201/227) must remain correct
      in v12+Sharpen. Net improvement only — no trading existing
      accuracy for new wins. Tolerance: at most 2 regressions are
      acceptable if net improvement is >= +10.
    verification: >
      Diff v11 vs v12 eval results column-by-column. Count regressions
      (correct in v11, wrong in v12). Must be 0, or <= 2 with net >= +10.

  - id: ac-13
    ac_type: gate
    description: >
      Actionability does not regress below 96.7% (current level).
      Expected to improve as mispredictions are the root cause.
    verification: >
      Actionability eval with v12 model shows >= 96.7%.

  - id: ac-14
    ac_type: gate
    description: >
      All existing model tests pass (374+). No regressions in
      Sharpen rules, feature extraction, or CLI behaviour.
    verification: >
      cargo test passes with zero failures.

ontology_schema:
  name: "ValidationFeatures"
  description: >
    A 239-dimensional vector where each element is the fraction of
    sampled column values that pass the corresponding type's
    CompiledValidator. Provides a strong discriminating signal for
    same-category sibling types (e.g., country vs country_code) where
    character-level and embedding features are insufficient. Also
    discriminates types with numeric range constraints (e.g., latitude
    vs decimal_number) since CompiledValidator checks both patterns
    and numeric bounds.
  fields:
    - name: "pass_rates"
      type: "Vec<f32>"
      description: >
        One float per taxonomy type (ordered by training-time type_index).
        Each value is in [0.0, 1.0] representing the fraction of sampled
        values passing that type's compiled validator.
    - name: "type_index"
      type: "BTreeMap<String, usize>"
      description: >
        Mapping from type key to index in the pass_rates vector.
        Stored in model config.json at training time. At inference time,
        current taxonomy keys are mapped through this index. New types
        (not in training-time mapping) produce zero at their position.

evaluation_principles:
  - principle: "Profile eval label accuracy"
    weight: 0.4
  - principle: "No regression on previously-correct columns"
    weight: 0.3
  - principle: "Actionability (transform success rate)"
    weight: 0.2
  - principle: "Backward compatibility (v11 model still loads)"
    weight: 0.1

exit_conditions:
  - "Profile eval reaches 215/227 (95%) with zero regressions — ship v12"
  - "Profile eval improves but plateaus below 215 — ship if >= 210/227 with <= 2 regressions, document remaining gaps for v13"
  - "Validation branch shows no improvement over v11 baseline (201/227) — abandon branch, document findings as decision record, return to retraining-only strategy"
  - "Validation branch improves targeted pairs (country/country_code, email/email_display, phone/phone_e164, url/data_uri, jwt/user_agent, latitude/decimal_number) but not others — still ship, the branch addresses its intended gap"

# --- Discrimination analysis ---
# The validation branch is expected to help with these specific pairs
# where type schemas have meaningfully different validation signatures:
#
#   STRONG signal (pattern/enum difference):
#     country ↔ country_code  — enum vs free-form (ac-01 adds enum)
#     email ↔ email_display   — bare email vs angle-bracket pattern
#     phone ↔ phone_e164      — permissive vs strict ^\+[1-9]\d{6,14}$
#     url ↔ data_uri          — generic scheme:// vs data: prefix
#     compact_ym ↔ year       — 6-digit YYYYMM vs 4-digit YYYY
#     user_agent ↔ jwt        — jwt requires 3 base64url dot-segments
#
#   MODERATE signal (numeric range):
#     latitude ↔ decimal_number — latitude has -90/+90 range constraint
#
#   WEAK/NO signal (values pass both validators):
#     iso ↔ mdy_dash/dmy_dash — date format ambiguity
#     integer_number ↔ postal_code/port — all are integers
#     alphanumeric_id ↔ isbn/geohash — generic alphanumeric
#
# The 215/227 target requires ~14 fixes. 7 are in the strong/moderate
# category. The remaining 7 depend on the model learning subtler
# cross-branch interactions between validation features and other
# branches (char patterns, header embeddings, statistics).

