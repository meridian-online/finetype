id: 2026-06-17-enum-domain-emission
goal: 'Ship enum-domain emission as a patch (choice 0102 increment): emit a column''s observed bounded domain as a descriptive x-finetype-enum extension, driven by full-column cardinality + structural cohesion, decoupled from the semantic label — additive output, conservative standard enum keyword, MCP shadows CLI via one shared policy. No model/gold/eval change.'
cards:
- 0014-profile-validate-precision
- 0002-semantic-type-detection
status: open
labels:
- enum
- json-schema
- column-statistics
- mcp-parity
acceptance_criteria:
- id: ac-00
  description: |
    CALIBRATION STUDY (no shipped code) — settle the enum PREDICATE and its
    thresholds by measurement, not fiat (design: interview.md). The predicate is:
    bounded full-column cardinality (distinct <= cap AND distinct/rows <= ratio)
    AND structural COHESION (the distinct values are a designed set, not accidental
    low cardinality) AND not-denylisted (continuous numeric, datetime, quasi-unique
    IDs). DELIVERABLE: (a) a character-shape cohesion metric — signature each
    distinct value by length-bucket + character-class pattern, score concentration
    (dominant-shape fraction or inverse shape-entropy); (b) the {cap, ratio,
    cohesion-threshold} that cleanly separate DESIGNED enums from accidental low
    cardinality, calibrated on gold: positives = categorical/boolean columns;
    negatives = heterogeneous low-card columns + cohesive-but-OPEN types (city,
    entity_name — these are shape-cohesive too, so cohesion + denylist together do
    the work, not cohesion alone). Report precision/coverage of the predicate vs
    the gold signal. Ship the loosest setting holding high enum precision. Note:
    NO enum ground truth exists, so this calibrates the predicate's separation, not
    an accuracy number — state the limit (per the 2026-06-17 over-read discipline).
    DONE (2026-06-17, scripts/enum_predicate_study.py, finding.md): SETTLED
    predicate = `distinct <= 32` AND `distinct/rows <= 0.5` AND broad-type NOT in
    {numeric, datetime, identifier, url} (the denylist). The denylist is
    load-bearing — without it cardinality+ratio fires on ~190/476 numeric/id
    columns (cohesion cannot reject them: numbers are shape-cohesive). KEY FINDING:
    char-shape COHESION as a GATE is net-negative — ablation: coh>=0.7 costs 12 ENUM
    positives to reject 3 open-text; `ratio` already rejects heterogeneous
    open-text, and surviving small open-text is shape-indistinguishable from a
    designed enum. So cohesion ships as an EMITTED SCORE (analyst signal), NOT a
    gate. Semantic cohesion (Model2Vec) is the untested open question, deferred.
    Over-emission is low-harm (descriptive output) so the predicate is
    useful-not-perfect.
  gate: false
  checked: true
  ac_type: observation
- id: ac-01
  description: |
    SHARED ENUM-PREDICATE MODULE over full-column stats. Implement the ac-00
    predicate as ONE policy module that BOTH the CLI (`enum_emission.rs` callers in
    profile.rs) and the MCP/extension (`json_schema.rs:attach_stats`) call — the
    MCP shadows the CLI, it is NOT a separate feature set (author). Consume
    `ColumnScanStats` (column/mod.rs, f1e047d) for true full-column distinct/rows +
    a cohesion fn (EMITTED as a score, not gated — ac-00). The GATE predicate is
    cardinality (distinct <= 32) + ratio (<= 0.5) + broad-type denylist {numeric,
    datetime, identifier, url}. Replace the CLI LABEL gate and the MCP
    CARDINALITY-ONLY path with this one unified predicate. Kill-switchable (rhh).
  gate: false
  checked: false
  ac_type: code
- id: ac-02
  description: |
    OUTPUT + ROUND-TRIP SAFETY (gate, BLOCKING). Emit the OPEN enum domain as a
    DESCRIPTIVE extension `x-finetype-enum: { open: true, domain: [...], distinct,
    rows, cohesion }` — NOT the standard JSON Schema `enum` keyword. The standard
    `enum` keyword (a CLOSED validation constraint) stays CONSERVATIVE — the patch
    does not broaden what lands there, because an open domain in `enum` re-creates
    `enum_overfit` and breaks profile->validate (card 0014). GATE: the
    profile->validate round-trip must NOT regress — `make validate-corpus` pass
    rate holds (validate ignores x-finetype-*; no new enum_overfit). Golden-test the
    new extension shape on both surfaces.
  gate: true
  checked: false
  ac_type: code
- id: ac-03
  description: |
    MCP/CLI PARITY GUARD. A test asserts the CLI `profile -o json-schema` and the
    MCP/extension profile emit IDENTICAL enum output (the x-finetype-enum block and
    the conservative `enum` keyword) for the same input — the MCP shadows the CLI.
    Precedent: the MCP tool-surface parity guard (choice 0101). Reconciling the MCP
    emitter onto the shared policy will REMOVE its current cardinality-only `enum`
    emissions (an existing enum_overfit hazard) — record that as a fix in the diff,
    golden-tested.
  gate: false
  checked: false
  ac_type: code
- id: ac-04
  description: |
    PATCH RELEASE. Bump the workspace PATCH version (not 0.7.0 — author), update
    CHANGELOG.md (additive `x-finetype-enum`; MCP enum output now shadows the CLI;
    no model/gold/eval change) and the profile/json-schema docs. Note the 0.7.0
    accuracy reframe (eval scores semantic type + enum dimension; drop categorical
    as a target; gold migration; closed-enum dictionaries) remains a SEPARATE future
    spec against choice 0102. Bank a memory: ColumnScanStats (ac-04a) shipped its
    first consumer here.
  gate: false
  checked: false
  ac_type: doc
