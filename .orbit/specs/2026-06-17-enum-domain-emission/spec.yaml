    memory still to add. NOTE: ColumnScanStats did NOT end up the consumer — the
    label-prefix denylist + direct value counts were simpler; ac-04a remains idle
    plumbing (honest correction to the spec's prediction).
    DONE (2026-06-17): RELEASED v0.6.33. Pre-flight all-green (CI success on
    fcf76ae, 452 tests, zero warnings, symlink<->CI agree, model on HF, duckdb pin
    unchanged). Cargo 0.6.32->0.6.33, CHANGELOG [0.6.33] heading, CLAUDE.md version.
    Tag v0.6.33 pushed (commit 3e11d23) -> release.yml building cross-platform
    binaries + Homebrew tap. Docs note in docs/DEVELOPMENT.md; memory
    enum-domain-emission-shipped. 0.7.0 reframe tracked in memo
    2026-06-17-enum-accuracy-reframe-0.7.0.
  gate: false
  checked: true
  ac_type: doc
