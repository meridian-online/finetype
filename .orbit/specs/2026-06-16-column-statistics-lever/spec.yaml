id: 2026-06-16-column-statistics-lever
goal: Give the classifier full-column statistics (cardinality, increment signature, binary domain, range) as cheap value-based signals — free from DuckDB column statistics, a single bounded aggregate elsewhere — to recover the residual recall gaps (categorical / alphanumeric_id / increment) the per-value model is structurally blind to; gold + corpus-honest gated, with a short-circuit that REDUCES neural inference.
cards:
- 0002-semantic-type-detection
status: open
labels:
- recall
- deterministic-layer
- duckdb
acceptance_criteria:
- id: ac-01
  description: |
    SEPARABILITY LOCKED (this session, 2026-06-16). The wall: the remaining
    gold recall gaps are column-level, and the per-VALUE model (100-value
    sample) is blind to them. Probe (scripts/probe_column_stats.py, 751/931
    gold via DuckDB full-column aggregates) established that cheap full-column
    CARDINALITY decisively separates them:
      - categorical (median card 0.036) vs alphanumeric_id (1.000): AUC 0.985
      - categorical vs entity_name 0.887 ; vs city 0.776
      - integer_number vs increment: AUC 0.972 (increment signature) / 0.944 (card)
    OUT OF SCOPE: coordinates — numeric RANGE barely separates them (max|val|
    AUC 0.58/0.69); they are sibling-paired (handled elsewhere) and already
    solved on gold. Target boundaries + metric recorded. Substrate:
    output/column-stats-probe/, memory column-stats-separate-residual-gaps.
  gate: false
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    STAT INTERFACE + AGGREGATION BOUND (the design decision). Define the full-
    column stat set the deterministic layer consumes: approx distinct
    (HLL), row count, min/max, int-fraction, increment signature (contiguous
    range x uniqueness), binary domain ({0,1} / two-valued). AGGREGATION BOUND,
    settled: use APPROXIMATE distinct (approx_count_distinct / HLL — bounded
    memory at any scale; ~1-2% error is nothing against the 0.036-vs-1.0 gap),
    NOT exact count(distinct). Denominator = true row count (free metadata),
    so the ratio is scale-independent. Inside DuckDB: HLL over the full column,
    uncapped (cheap), optional TABLESAMPLE only to bound latency on pathological
    columns. Elsewhere (CSV/sample path): cap the distinct estimate at ~50k
    values (statistically ample for the low-vs-high-cardinality decision) with
    the true/scanned row count as denominator. min/max free via zonemap. The
    decision is robust to approximation — ship thresholds, not a raw continuous
    ratio. Deliverable: the stat-extraction interface + documented bound.
  gate: false
  checked: false
- id: ac-03
  description: |
    FIRST RULE — full-column cardinality disambiguation (the big win). Generalise
    the SHIPPED, working pattern (veto_shape_fallback 0.6.28, text_vocab_override
    0.6.29, fusion_cardinality_gate column/mod.rs:2115 — all cardinality on the
    100-VALUE SAMPLE, fired only inside the validation veto) to a SYSTEMATIC,
    full-column-stat rule: a low-cardinality column the model emitted as a high-
    cardinality type (entity_name / city / alphanumeric_id) routes to
    categorical; a near-unique column emitted as a small-vocab type routes to
    alphanumeric_id. Value-based (decision 0048), residual-direction (choice
    0096 — categorical/alnum are residual, this is a value-rule not a softmax
    class). Named kill switch. Gold per-boundary recall must improve.
  gate: false
  checked: false
- id: ac-04
  description: |
    INCREMENT + BINARY rules. increment signature (contiguous range x near-
    uniqueness) recovers integer_number → increment (17 of integer's 40 gold
    misses — the biggest single leak). binary domain ({0,1} two-valued) is the
    inverse of the shipped binary_vocab_veto. Both value-based, kill-switched,
    gold-gated. Honest caveat: gold increment support is thin (n=1) — lean on
    the rare-type scoreboard + corpus-honest gate for the real read.
  gate: false
  checked: true
- id: ac-05
  description: |
    SHORT-CIRCUIT (the speed win, the analyst's "run less inference"). When a
    decisive full-column stat resolves a column (cardinality / binary domain),
    skip or lighten the neural pass. Measure inference throughput WITH vs
    WITHOUT the short-circuit (finetype bench / val-per-sec) — the target is
    neutral-to-faster, never a regression. Confirms the lever costs no
    inference speed (and likely saves it), unlike the encoder bet.
  gate: false
  checked: false
- id: ac-06
  description: |
    PROMOTION GATES (BLOCKING, H05). The separability in ac-01 is a CEILING on
    gold, not a shipped win — this AC is the real test. Per choice 0095: gold
    corpus no-regression + per-boundary recall win + rare-type scoreboard →
    corpus-honest gate GO on the candidate's predictions (the only relocation
    detector; a NO-GO is blocking and final — cardinality rules can over-route
    just like any rule). ZERO regression on the guard campaign's shipped wins
    and on the gold headline (728/931 = 0.782). Ship per gold-gated-fix
    discipline (commit each rule before the next; scripts/eval_rule.sh
    --label X --out-dir output/X --default).
  gate: true
  checked: false
  ac_type: observation
- id: ac-07
  description: |
    DUCKDB FREE-STATS PATH. Plumb full-column statistics from the DuckDB
    extension (catalog zonemaps + approx_count_distinct) so the premium-
    accuracy path costs ~nothing where the data already lives — the analyst's
    core idea. The CLI/CSV path computes the same stats via one bounded
    aggregate pass (ac-02 cap). Same rules, two sourcing paths; no behaviour
    fork beyond cost. Verify parity: a column typed through DuckDB-stats and
    through the aggregate pass yields the same label.
  gate: false
  checked: false
- id: ac-08
  description: |
    DECISION MEMO — close the architecture-search loop. Record the session
    arc: model-side delivery exhausted (additive 0-for-5, fusion dead, sibling
    thin, hierarchical falsified) → the lever is column-level STATISTICS fed as
    value-based rules, not a bigger model. Per-boundary shipped outcome, the
    throughput delta, and the DuckDB free-stats result. Update card 0002 +
    memories. This is the answer to "find the new architecture layer": it was
    a data-source change (full-column stats), not an encoder.
  gate: false
  checked: false
  ac_type: doc
