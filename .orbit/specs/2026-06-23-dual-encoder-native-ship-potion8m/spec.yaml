acceptance_criteria:
- id: ac-00
  description: |
    B07 AUDIT + DUAL-ENCODER DESIGN. Enumerate every consumer of `models/model2vec` and the
    EMBED_DIM/EMBED_AGG_DIM consts: the value-aggregation branch (extract_embedding_aggregation,
    main.rs:1464), the header branch (128-dim header embed, shares the same resource), and the
    semantic/entity/sense classifiers (model2vec_shared). Decide the mechanism: a SECOND
    Model2VecResources for the value branch selected by a model-config field (e.g. value_embed_model),
    keeping potion-4M for header+classifiers; and how EMBED_DIM 128->256 / EMBED_AGG_DIM 512->1024 is
    handled (config-driven vs const — must not break the 128-dim header or the other classifiers).
    DELIVERABLE: the consumer graph + the edit set + the config-schema change + the dim-handling
    decision. Use codegraph (codegraph_impact/codegraph_callers) per CLAUDE.md.
    DONE: ac00-dual-encoder-design.md (consumer graph, edit set, config field
    value_embed_model, dim-handling via extract_embedding_aggregation_dyn + config.embed_dim).
  ac_type: doc
  gate: true
  checked: true
- id: ac-01
  description: |
    IMPLEMENT DUAL-ENCODER NATIVE INFERENCE. Per ac-00's design: the binary loads potion-4M (header +
    semantic/entity/sense) AND potion-8M (value-aggregation, 1024-dim agg); the value-embed model is
    config-selected so v19/m2v-244 (single potion-4M) still load unchanged. Place the potion-8M
    artifact; set potion-8M's config value_embed_model + embed_dim 1024. VERIFY: `FINETYPE_MODEL=
    models/m2v8m-s44 finetype profile` runs natively; native gold composed reproduces the offline
    0.794 within tolerance AND native Sense ~= 0.522 (else HALT + diagnose); the header branch and
    the other classifiers are unaffected (v19 still profiles identically). Tests + B07 + `clippy -D
    warnings` + `cargo test` green.
    DONE: dual-encoder built; value features byte-faithful to offline; v19 profiles identically.
    Native gold composed best-of-3 = 0.794, TIES v19 0.797 (within CI). The initial −11pp HALT was a
    config bug (missing type_index_keys zeroed the validation branch), fixed in fb44b26. See
    ac01-native-verdict.md.
  ac_type: code
  gate: true
  checked: true
- id: ac-02
  description: |
    NATIVE CORPUS-HONEST GATE on potion-8M — the real, faithful GO/NO-GO vs v19 (replaces the invalid
    offline gate). Run `gittables_corpus_pass` natively (FINETYPE_MODEL=potion-8M) over the ac-01
    stratified sample, then `corpus_honest_gate.py` vs the stable v19_gated oracle (categorical->word
    remap). DELIVERABLE: the verdict + the trigger list, classified shared-collapse vs over-emit. This
    is BLOCKING (H05). Expectation from the directional offline read: numeric_code/isbn/npi collapse +
    some over-emits; the rules in ac-03 must clear the blocking ones.
    DONE — NO-GO (faithful). 14 triggers post categorical→word remap: numeric_code collapse
    (7,014 confirmed→0), isbn collapse, user_agent 7.2× over-emit, si_number/compact_dmy/last_name/
    country/etc. Same signature as m2v-244 (real drift, not the config bug). See RESULTS_LEDGER.md.
  ac_type: observation
  gate: true
  checked: true
- id: ac-03
  description: |
    PRINCIPLED RULE FIXES for the gate's blocking triggers, then re-gate to GO. Start with the
    leading-zero numeric_code promotion rule (banked task t-0000a86b: integer_number -> numeric_code
    when leading-zero ratio >= 0.5 AND fixed-width all-digit; the biggest shared collapse, helps every
    model incl v19). Add value-based rules (0048/0096) for remaining blocking triggers — each with a
    kill switch + deterministic-layer ledger entry + both-sides evidence. Re-run the native
    corpus-honest gate until GO AND composed improve-or-hold vs v19 on gold + rare-type scoreboard.
    HALT if > ~4 new rules are needed (fragility -> fix data drift instead). DELIVERABLE: the rules +
    composed-hold evidence + the GO verdict.
    NOT VIABLE — 14 triggers ≫ ~4-rule cap → per spec, fix the data drift, not rules. The leading-zero
    numeric_code rule (t-0000a86b) is still independently worthwhile (biggest single collapse, helps v19).
  ac_type: code
  gate: true
  checked: false
- id: ac-04
  description: |
    SHIP. If native potion-8M + rules clears the corpus-honest gate (GO) AND composed holds vs v19 on
    gold (+ representative advisory) AND the rare-type scoreboard is clean: package (skill `package`),
    upload to HuggingFace, swap `models/default` -> potion-8M, version bump, CHANGELOG, update count
    surfaces + a latency note, and update CLAUDE.md (v19 retired -> potion-8M is the shipped default).
    This is the swap that retires v19 and unblocks the roadmap. Else: documented fallback (stay on v19;
    the next bet is fixing the fresh-retrain data drift so a reproducible model is corpus-clean).
    FALLBACK TAKEN — STAY ON v19. potion-8M corpus-honest NO-GO. Dual-encoder kept as proven
    infrastructure for a future corpus-clean candidate. Next bet: fix fresh-retrain data drift.
  ac_type: observation
  gate: true
  checked: true
