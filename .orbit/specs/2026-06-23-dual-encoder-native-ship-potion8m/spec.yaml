id: 2026-06-23-dual-encoder-native-ship-potion8m
goal: |
  Ship **potion-8M** as the reproducible, 244-label default Sense model that finally retires
  v19 — via **dual-encoder native inference** (the binary loads potion-4M for the header/
  classifier paths AND potion-8M for the value-aggregation branch), gated by the BLOCKING
  corpus-honest gate plus principled value-rule fixes for whatever relocations it surfaces.

  ## Why now — what the 2026-06-21 spec established (read those memories first)
  - **v19 is a dead-end as the reference**: 240-label (can't predict the live 244 taxonomy's new
    leaves) AND unreproducible. Every experiment gated against it stalls the roadmap. The default
    MUST become reproducible + full-taxonomy. (CLAUDE.md architectural direction; [[fresh-retrain-penalty-was-44-stats]])
  - **The embed frontier is closed** (ac-02, [[static-embed-frontier-topped-out]]): static Sense is
    capped ~0.52; composed is RULE-bound, not embed-bound. No embedding beats v19 composed. So this
    is NOT an accuracy bet — it is a **reproducibility + full-taxonomy** bet at composed parity.
  - **potion-8M is the chosen candidate** ([[potion8m-beats-code16m-pick]]): gold composed 0.794
    (ties v19 0.793) > code-16M 0.776; directional relocation slightly favors it; code-16M's
    format-teacher bet failed. Sense 0.522 > v19 0.502, latency ~free (static).
  - **m2v-244 (potion-4M) is NOT shippable** ([[m2v244-corpus-nogo-gold-reproducible-not-corpus-faithful]]):
    gold-reproducible but a corpus-honest NO-GO (numeric_code collapse 59k->238, isbn/npi collapse,
    si_number/file_size over-emit). Gold-reproducible != corpus-faithful — the fresh-retrain pipeline
    drifted from v19's corpus behaviour in ways only the corpus gate sees.
  - **There is NO faithful offline gate** ([[offline-gate-needs-composed-not-raw-sense]]): the
    validation veto lives only in the native `finetype profile` pipeline. predict_multibranch is raw
    pre-veto Sense (0 unknowns); FINETYPE_INJECT_LABEL composes Sharpen but NOT the veto (0 unknowns
    vs native's 13%). So testing potion-8M faithfully REQUIRES native inference = the dual-encoder
    work = the same work needed to ship. Testing and shipping have converged.

  ## The bet
  potion-8M trained with a 1024-dim potion-8M value embed + a 128-dim potion-4M header embed (the
  builder only swapped the value branch). The binary loads ONE shared model2vec. So native potion-8M
  needs the binary to load TWO model2vec resources — potion-4M (header + semantic/entity/sense
  classifiers) and potion-8M (value-aggregation) — plus EMBED_DIM/EMBED_AGG_DIM handling for the
  1024-dim value agg. Once native, potion-8M is gated like any candidate; relocations are fixed with
  principled value-based rules (decision 0048/0096), and the bundle ships if it clears the blocking
  corpus-honest gate at composed parity with v19.

  ## Pillar defence
  Pillars 1 + 4: a reproducible, full-taxonomy default is the prerequisite for ALL future Sense work
  (the v19 dead-end is the binding constraint). The Precision Principle: rule fixes must be genuine
  value-based type semantics that transfer across models, not per-model patches.

  ## Risk / halt conditions
  - Native potion-8M gold composed must reproduce the offline 0.794 (within tolerance). If native
    composition diverges, STOP and diagnose before gating (the native path differs from offline).
  - If clearing the corpus-honest gate needs a large stack of vetoes (fragility, against 0038), STOP:
    that signals the data/recipe drift should be fixed (so the fresh model is corpus-clean by
    construction) rather than papered over with rules. Threshold to revisit: > ~4 new rules.
  - Dual-encoder touches the load-bearing every-profile-call inference path: B07 audit + H02 verify
    are mandatory; no rushed merge.
