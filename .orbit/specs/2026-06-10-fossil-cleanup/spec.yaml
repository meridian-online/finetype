id: 2026-06-10-fossil-cleanup
goal: 'Reclaim the repo''s working surface without eval risk: archive fossil eval artefacts, prune author-approved dead model dirs, fix stale CLAUDE.md claims, and bring the dirty git tree to zero — only changes that need no accuracy evidence; code deletions and file splits stay gated on the gold corpus.'
cards:
- 0019-human-verified-gold-corpus
status: open
labels: []
acceptance_criteria:
- id: ac-01
  description: |
    Retention manifest (output/fossil-cleanup/manifest.md): every output/ campaign
    dir, models/ dir, and eval/ artefact classified keep / archive / delete with a
    one-line reason. "Keep" requires a live reference (CLAUDE.md, an open spec or
    task, the shipped default symlink, a published release, or the rare-type
    scoreboard's MODELS list). Nothing is moved or removed under this AC.
    GATE: author signs the manifest before any archive/delete executes.
  gate: true
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    Archive executed per the signed manifest: "archive" entries compressed or moved
    to cold storage outside the working tree, "delete" entries removed, disk
    reclaimed reported (before/after du). No dir referenced by an open spec, task,
    or CLAUDE.md is touched. Models are archived (recoverable), never silently rm'd.
  gate: false
  checked: false
  ac_type: ops
- id: ac-03
  description: |
    Dirty tree to zero: the ~104 untracked/modified files in git status are each
    committed, .gitignore'd, or removed per the manifest. git status --porcelain
    is empty on main after the sweep.
  gate: false
  checked: false
  ac_type: config
- id: ac-04
  description: |
    Stale claims fixed: CLAUDE.md codebase figure corrected (~77k lines of Rust
    across 9 crates, not ~20k); "zero Python dependencies" qualified to name the
    scripts/ eval-tooling reality (110 Python files, build+runtime still
    Python-free); any other figure the manifest pass catches.
  gate: false
  checked: false
  ac_type: doc
- id: ac-05
  description: |
    Inference-speed baseline measured (the unmeasured success criterion from the
    2026-06-10 discovery): wall-clock and per-column throughput for finetype
    profile on a representative file set, on this machine, committed as
    output/fossil-cleanup/inference_baseline.md. No optimisation work — just the
    number, so "very fast inference" becomes testable.
  gate: false
  checked: false
