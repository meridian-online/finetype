id: 2026-06-27-m2v-witness-specialiser-pilot
goal: Pilot a per-class m2v-embedding GBT abstaining witness on ONE high-value contested boundary, wired as a high-precision corroborating veto and gated via the fast re-anchored corpus-honest gate — testing whether the cheap, modular per-class embedding-witness framework produces a shippable specialist (the m2v variant of the proven +1.1pp gte witness gate).
cards:
- '0019'
status: open
labels:
- specialiser
- sense-architecture
- pilot
acceptance_criteria:
- id: ac-0
  description: |
    Design pinned: target boundary chosen (a contested class with a real gold gap
    where the m2v embedding plausibly carries signal — candidates: entity_name
    over-emit, plain_text under-recall, region, or the user_agent corpus wart) +
    rationale. (m2v separability ceiling ~0.80 contested; composed-rule-bound.)
  gate: false
  checked: false
  ac_type: doc
- id: ac-1
  description: |
    Extract (m2v aggregated embedding, label) pairs: training set from the training
    FTMB (output/multibranch-training/m2v8m-244.ftmb), eval set from the gold FTMB
    (output/embed-frontier/gold_m2v8m.ftmb). Round-trips: dims + label join verified.
  gate: false
  checked: false
- id: ac-2
  description: |
    Train a per-class one-vs-rest GBT (ydf 0.16.1) on the m2v embedding for the
    target class; report separability (AUC/CV) + the precision-recall curve on gold.
    Cross-check against the known m2v probe ceiling (~0.80 contested).
  gate: false
  checked: false
- id: ac-3
  description: |
    Calibrate a HIGH-PRECISION abstention threshold (assert only at precision >=0.9;
    abstain otherwise). DELIVERABLE: the precision-at-recall the witness achieves in
    the asserting regime — the load-bearing shippability number for an abstaining veto.
  gate: false
  checked: false
  ac_type: observation
- id: ac-4
  description: |
    Wire as a two-sided corroborating veto (override the composed label only where the
    main model band is low/med AND the witness >= threshold), mirroring the proven
    gte-tiny witness gate. Measure gold improve-or-hold (vs the 0.823 baseline) + the
    representative band (advisory).
  gate: false
  checked: false
  ac_type: observation
- id: ac-5
  description: |
    PROMOTION GATE: the witness clears the FAST re-anchored corpus-honest gate
    (corpus_honest_gate_fast.sh, m2v8m witness-OFF -> witness-ON) with no relocation
    NO-GO. A Sense-side win that ties composed is a documented no-ship, not a failure.
  gate: true
  checked: false
  ac_type: observation
- id: ac-6
  description: |
    Findings memo (output/m2v-witness-pilot/RESULT.md): does the cheap, modular
    per-class m2v-witness framework SHIP? Magnitude vs the +1.1pp gte upper bound;
    the boundary's verdict; and whether the framework generalises to a suite of
    per-class witnesses or is one-off. GO/NO-GO on building the framework out.
  gate: false
  checked: false
  ac_type: doc
