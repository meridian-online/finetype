id: 2026-06-24-per-value-attention-pooling
goal: |
  Replace the value branch's fixed mean/var/min/max pool with cross-value
  per-value attention over static potion-8M (choice 0106, Option B), retrain
  3 seeds, and measure whether the Sense lift passes through to composed —
  Sense-first, with the rule-layer rework explicitly out of scope.
cards: []
status: open
labels:
- model
- sense-architecture
acceptance_criteria:
- id: ac-0
  description: |
    Design pinned (interview.md): resolve choice 0106's open questions —
    pool query (learned vs header-derived), attention shape (layers/heads/
    width), n_values carried + padding/masking, keep-or-drop the mean/var/
    min/max concat. One config committed (models/<tag>-attn-config.json).
  gate: false
  checked: true
  ac_type: doc
- id: ac-1
  description: |
    FTMB carries the ~50 sampled value strings per column so per-value
    structure survives to training (format version bump + read_ftmb verify
    gate). Touches build_ftmb_v5_potion.py, prepare_multibranch_data.py,
    read_ftmb.py, the dims gate in overnight_potion.sh, and the record
    struct in finetype-train/src/data.rs. Round-trips: a built FTMB
    re-reads identical strings.
  gate: false
  checked: false
- id: ac-2
  description: |
    Cross-value attention-pool module lands in finetype-train/src/
    multi_branch.rs: a 1-2 layer self-attention over the per-value potion-8M
    vectors followed by a learned/header-query pool, feeding the value
    branch (mean/var/min/max retained as auxiliary concat per the pinned
    design). Trains end-to-end on the new FTMB; config fields added.
  gate: false
  checked: false
- id: ac-3
  description: |
    Rust inference mirrors the trained pool: new value_attention.rs (modelled
    on sense.rs cross-attention), edits to multi_branch/mod.rs (per-value
    matrix path, not extract_embedding_aggregation_dyn on the value branch),
    branch.rs, config.rs. Native finetype predictions match the trainer's
    predict_multibranch on the gold FTMB within tolerance (parity check).
  gate: false
  checked: false
- id: ac-4
  description: |
    3-seed retrain (potion-8M value encoder) scored on gold: Sense + composed
    vs the m2v8m-s43 baseline (Sense 0.522 / composed 0.794) and v19
    (0.502 / 0.793). Drift-proxy pre-check run; representative band (advisory)
    reported. DELIVERABLE: best-of-3 Sense delta and composed delta, and the
    explicit read on whether the Sense lift passed through to composed.
  gate: false
  checked: false
  ac_type: observation
- id: ac-5
  description: |
    PROMOTION GATE (choice 0104, unchanged): a swap to models/default requires
    gold parity + gold-adjudicated relocation review AND a non-NO-GO from the
    corpus-honest gate (blocking). No swap unless gold holds and the relocation
    review passes. A Sense-only win that ties composed is a documented
    no-swap outcome, not a failure.
  gate: true
  checked: false
  ac_type: observation
- id: ac-6
  description: |
    Findings memo (output/per-value-attention/RESULT.md): what cross-value
    attention bought on Sense, whether it tied or beat composed, native
    latency confirmed vs the shipped potion-8M, and the GO/NO-GO call on
    whether to proceed to the separate rule-layer bet (the composed cap).
  gate: false
  checked: false
  ac_type: doc
