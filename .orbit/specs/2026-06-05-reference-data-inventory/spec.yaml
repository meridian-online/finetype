id: 2026-06-05-reference-data-inventory
goal: Produce a verified, durable reference-data inventory mapping every authoritative input (Geonames, CLDR, ISO, IANA, ITU, standards bodies) to the taxonomy types it backs, tiered by mining-readiness with licensing constraints recorded — the catalogue the YDF mining factory (B2) consumes.
cards:
- 0017-ydf-specialist-geography
- 0001-type-taxonomy
status: closed
labels:
- precision
- data-factory
- reference-data
acceptance_criteria:
- id: ac-01
  description: |
    Complete, durable tier assignment. Promote the draft inventory (memo
    2026-06-05-reference-data-inventory.md) into a durable TRACKED artefact at a
    canonical path (e.g. eval/datasets/reference_data_inventory.md or under
    docs/) — NOT a memo, which is deleted after distillation. Every one of the
    240 taxonomy types is assigned a mining-readiness tier: Tier 1
    (reference-backed, mine directly), Tier 2 (large enumerable code space, mine
    with the pattern as precision gate), or Tier 3 (pure pattern, no vocabulary —
    mining adds nothing over the regex). Verifiable: the count of tier-assigned
    types equals 240 across the 7 domains (container 11, datetime 84, finance 28,
    geography 25, identity 33, representation 33, technology 26); no type
    unassigned.
  gate: true
  checked: true
  ac_type: doc
- id: ac-02
  description: |
    Source catalogue table. Each authoritative source (Geonames, CLDR,
    ISO 3166-1 / 4217 / 639, IANA tz+TLD+media-types, ITU-T E.164, HL7 FHIR,
    ICAO 9303, ISO/IEC 5218, SI/UCUM, RFC 7231, and any Tier-2 source) records:
    the taxonomy type(s) it backs, the CURRENT embedded coverage (count), the
    full authoritative list size, and the licence. Anchor each row to the embed
    location it would replace (generator.rs / locale_data.rs line range) so the
    gap is concrete. The full-249 country_code enum is named as the completeness
    template every reference-backed type should reach.
  gate: false
  checked: true
  ac_type: doc
- id: ac-03
  description: |
    Licensing verdict per source — public-repo safety is explicit. Tier-1
    sources confirmed permissive with the specific licence named (Geonames
    CC-BY 4.0, CLDR Unicode licence, IANA public domain, ISO codes free-to-use,
    ITU free). The two landmines flagged DO-NOT-VENDOR: CPT (AMA-copyrighted)
    and CUSIP/ISIN (licensed) — these may be mined only via pattern + checksum,
    never by vendoring the list. Any source whose licence cannot be verified is
    marked "verify before use", not assumed safe.
  gate: false
  checked: true
  ac_type: doc
- id: ac-04
  description: |
    B2 build order locked and justified. The factory's first integrations are
    ordered Geonames -> full CLDR -> IANA -> ISO 4217/639, each justified by
    coverage-gap x licence-permissiveness (front-load the largest coverage gains
    against the most permissive licences). Geonames is named the single biggest
    unrealised win (thinnest types — city/region/district at 15-40 hand-curated —
    against the richest source, ~4M).
  gate: false
  checked: true
  ac_type: doc
- id: ac-05
  description: |
    Ingestion-pattern decision recorded as a MADR choice. The repo has NO
    external-reference-data ingestion pattern today (all data hand-embedded, no
    data crates). Decide and record: build-time generation vs pipeline-time
    fetch; where normalised reference data lives (tracked in-repo vs downloaded
    on demand, mirroring the model-weights download path in
    2026-06-02-public-release-readiness ac-06); and the normalised on-disk shape
    the B2 sieves consume.
  gate: false
  checked: true
  ac_type: doc
- id: ac-06
  description: |
    Reconcile with the existing card-0017 extractor. Card 0017
    (ydf-specialist-geography) already proposes pulling (Sense-missed,
    YDF-confident) columns from the multi-lens diagnostic as training rows. State
    how the reference-data-trained-sieve method (train a sieve FROM Geonames/CLDR,
    then mine GitTables) relates to it — complement, supersede, or two stages of
    one funnel — so B2 builds on card 0017 rather than forking it. Note the
    eval-independence implication: the diagnostic's YDF lens cannot also be the
    judge once it mines (see spec 2026-06-05-gold-eval-anchor).
  gate: false
  checked: true
  ac_type: doc
closed_at: 2026-06-05T05:37:04.48962Z
