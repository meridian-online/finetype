[package]
name = "finetype-core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Core taxonomy and data generation for FineType"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokenizers = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
glob = { workspace = true }
luhn = { workspace = true }
phonenumber = { workspace = true }
jsonschema = { workspace = true }
regex = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }

[features]
# Embed the taxonomy YAMLs at compile time so crate consumers can read the
# authoritative Frictionless type map (choice 0105) without a labels/ dir at
# runtime. Workspace-only: it `include_str!`s the sibling `labels/` directory, so
# it is for in-workspace path-dependency consumers (e.g. dovetail), NOT for the
# crates.io-published light core, which builds with this feature off.
embedded-taxonomy = []

[dev-dependencies]
pretty_assertions = "1.4"
