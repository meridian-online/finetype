[package]
name = "finetype-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MCP server for FineType semantic type classification"

[dependencies]
finetype-core = { workspace = true }
finetype-model = { workspace = true }

rmcp = { version = "1.1", features = ["server", "transport-io"] }
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
csv = { workspace = true }
sha2 = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
# Conformance test (spec 2026-06-24 ac-04): validate emitted datapackage
# descriptors against the vendored profile, using the embedded taxonomy so the
# type/format come from the real authoritative map.
finetype-core = { workspace = true, features = ["embedded-taxonomy"] }
jsonschema = { workspace = true }
