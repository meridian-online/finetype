[package]
name = "finetype-model"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Candle-based transformer model for FineType"

[features]
default = ["cpu"]
cpu = []
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
# RHH (Remove-Header-Hints) instrumentation. When enabled, the runtime
# reads RHH_DISABLE_HINTS (comma-separated family ids) and short-circuits
# the matching rule families inside `column.rs`. When disabled (default),
# every check compiles to a constant `false` and there is zero overhead.
# See .orbit/specs/2026-04-24-remove-header-hints/spec.yaml ac-02.
rhh-instrumentation = []

[dependencies]
finetype-core = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
regex = "1"

[dev-dependencies]
anyhow = { workspace = true }
csv = { workspace = true }

# candle-transformers carries no `use` — it exists for the cuda/metal feature
# passthrough above. cargo-machete can't see feature-graph deps.
[package.metadata.cargo-machete]
ignored = ["candle-transformers"]
