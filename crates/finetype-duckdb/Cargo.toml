[package]
name = "finetype_duckdb"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DuckDB extension for semantic type classification"
publish = false

# The produced artifact is `libfinetype.{dylib,so,dll}` — the community-extensions
# build contract derives the library filename from the extension name (`finetype`),
# not the package name. Keeping the package `finetype_duckdb` preserves the
# documented `cargo build -p finetype_duckdb` command.
[lib]
name = "finetype"
crate-type = ["cdylib"]

# `spike` registers crates/finetype-duckdb/src/spike.rs — a trivial VTab kept as
# living evidence that vtab is active under `loadable-extension` and that a
# table function and the scalars coexist (choice 0064, finding a/b). It is NOT
# production surface, so it is off by default and no released artifact carries
# `finetype_spike` in its catalog. The `spike-compiles` step of the doc-surface
# CI job builds with it, which is what keeps the evidence a compile rather than
# a memory.
[features]
spike = []

[dependencies]
# `vtab` is transitively enabled by `loadable-extension` in the workspace
# duckdb dep — we list it here as well for explicit documentation of the
# spike's finding (see spec 2026-04-22-duckdb-extension-ergonomics
# spike-duckdb-rs.md, finding a). ac-04 verification literal.
duckdb = { workspace = true, features = ["vtab"] }
libduckdb-sys = { workspace = true }
finetype-core = { workspace = true }
finetype-model = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
hf-hub = { workspace = true }
tracing = { workspace = true }

# Force a vendored OpenSSL build on the platforms that need it. hf-hub +
# tokenizers pull OpenSSL transitively via native-tls only on Linux; the
# community-extensions Linux container points OPENSSL_DIR at a vcpkg prefix that
# contains no OpenSSL, so a system/vcpkg build of openssl-sys panics ("OpenSSL
# include directory does not exist"). The vendored feature makes openssl-sys
# compile its own copy and ignore OPENSSL_DIR, so the extension builds in that
# container (and under `cross`) without a system OpenSSL.
#
# Scoped to non-Windows: native-tls uses SChannel on Windows and the macOS
# Security framework, so neither needs OpenSSL. Forcing the vendored dep on
# Windows made openssl-src compile from source, which the runner's MSYS Perl
# cannot configure (missing Locale::Maketext::Simple) — breaking the Windows
# extension build. macOS keeps vendored (its build already compiles it cleanly).
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[package.metadata.cargo-machete]
ignored = ["openssl"]
